- name: ChatWindowConfiguration.AbsolutePosition
  summary: 'Actual screen position of the default chat window, in pixels.

    '
  description: 'Read-only property that provides the screen position of the default
    chat

    window (message list) in pixels. Behaves similarly to

    `Class.GuiBase2d.AbsolutePosition`.


    This value represents only the message list portion of the chat UI, not

    the entire chat interface. To get the total bounds including the input

    bar, see `Class.ChatInputBarConfiguration.AbsolutePosition` and combine

    both regions. See the code example in the class description above.

    '
