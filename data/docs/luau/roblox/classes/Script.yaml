name: Script
type: class
memory_category: Script
summary: 'An object that contains and runs Luau code on the server.

  '
description: "A `Class.Script` is a Luau source container that can access server-side\n\
  objects, properties, and events, such as to award badges to players using\n`Class.BadgeService`,\
  \ while `Class.LocalScript|LocalScripts` on the client\ncannot.\n\nThe instant that\
  \ the following conditions are met, a script's code is run in a\nnew thread:\n\n\
  - Its `Class.Script.Enabled|Enabled` property is `true`.\n- The `Class.Script` object\
  \ is a descendant of the `Class.Workspace` or\n  `Class.ServerScriptService`.\n\n\
  The script will continue to run until the above conditions are **not** met, it\n\
  terminates, or it raises an error (unless that error is raised by a function\nconnected\
  \ to some event that is firing). Additionally, the thread will be\nstopped if the\
  \ script or one of its ancestors is destroyed. A script will\ncontinue to run even\
  \ if the `Class.Instance.Parent|Parent` property is set to\n`nil` and the `Class.Script`\
  \ is not destroyed.\n"
