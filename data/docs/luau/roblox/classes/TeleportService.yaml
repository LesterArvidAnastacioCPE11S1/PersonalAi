- name: TeleportService.LocalPlayerArrivedFromTeleport
  summary: 'Fires when the `Class.Players.LocalPlayer|LocalPlayer` enters the place

    following a teleport.

    '
  description: "This function fires when the `Class.Players.LocalPlayer` enters the\
    \ place\nfollowing a teleport. The `teleportData` and `customLoadingScreen` are\n\
    provided as arguments.\n\nWhen fetching _teleportData_ and the _customLoadingScreen_\
    \ you are advised\nto use `Class.TeleportService:GetLocalPlayerTeleportData()`\
    \ and\n`Class.TeleportService:GetArrivingTeleportGui()` instead. This is because\n\
    these functions can be called immediately without having to wait for this\nevent\
    \ to fire.\n\nThis event should be connected immediately in a `Class.LocalScript`\n\
    parented to `Class.ReplicatedFirst`. Otherwise, when the connection is\nmade the\
    \ event may have already fired.\n\n#### Loading Screen\n\nDuring a teleport, while\
    \ the destination place is loading, the\n_customLoadingScreen_ is parented to\
    \ the `Class.CoreGui`. Once the place\nhas loaded the `Class.ScreenGui|loading\
    \ screen` is\n`Class.Instance.Parent|parented` to _nil_.\n\nIf you wish to preserve\
    \ the _customLoadingScreen_ and perform your own\ntransitions, you will need to\
    \ parent it to the local player's\n`Class.PlayerGui`. For example, using the following\
    \ code inside a\n`Class.LocalScript` in `Class.ReplicatedFirst`:\n\n```lua\nlocal\
    \ TeleportService = game:GetService(\"TeleportService\")\nlocal Players = game:GetService(\"\
    Players\")\nlocal ReplicatedFirst = game:GetService(\"ReplicatedFirst\")\n\nTeleportService.LocalPlayerArrivedFromTeleport:Connect(function(customLoadingScreen,\
    \ teleportData)\n\tlocal playerGui = Players.LocalPlayer:WaitForChild(\"PlayerGui\"\
    )\n\tReplicatedFirst:RemoveDefaultLoadingScreen()\n\n\tcustomLoadingScreen.Parent\
    \ = playerGui\n\t-- animate screen here\n\twait(5)\n\t-- destroy screen\n\tcustomLoadingScreen:Destroy()\n\
    end)\n```\n\nThe _customLoadingScreen_ will not be used if the destination place\
    \ is in\na different game.\n\n#### Studio Limitation\n\nSee\n[Test teleports](https://create.roblox.com/docs/projects/teleport#test-teleports-in-studio)\n\
    for information on using this function in Studio testing.\n"
  code_samples: []
  parameters:
  - name: loadingGui
    type: Instance
    default: null
    summary: 'The _customLoadingScreen_ the `Class.Players.LocalPlayer|LocalPlayer`

      arrived into the place with.

      '
  - name: dataTable
    type: Variant
    default: null
    summary: 'The _teleportData_ the `Class.Players.LocalPlayer|LocalPlayer` arrived

      into the place with.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Teleport
- name: TeleportService.TeleportInitFailed
  summary: 'Fires when a teleport fails to start, leaving the player in their current

    server.

    '
  description: "This event fires on both the client and the server when a request\
    \ to\nteleport from a function such as `Class.TeleportService:TeleportAsync()`\n\
    fails and the player does not leave the current server. It provides a\nreason\
    \ for the failure, as well as all of the information necessary to\nretry the teleport.\
    \ If a group teleport fails, the event will fire once\nper player.\n\n#### TeleportOptions\n\
    \nThe `Class.TeleportOptions` object provided by this event is not identical\n\
    to the one passed to the original `Class.TeleportService:TeleportAsync()`\ncall.\
    \ It is a new object populated with the necessary parameters to retry\nthe teleport\
    \ and send the player to the exact same destination. This is\nespecially important\
    \ for facilitating group teleports when they fail. If\n`Class.TeleportOptions.ForcePublicServer`\
    \ was set for a single-player\nteleport, it remains set in the retry options.\
    \ For a group teleport, once\na server has been chosen, the retry options use\n\
    `Class.TeleportOptions.ServerInstanceId` to send the player to that same\nserver\
    \ instead. In this case, `Class.TeleportOptions.ForcePublicServer` is\nnot set,\
    \ because the two options cannot be used together.\n\n<table>\n    <thead>\n \
    \       <tr>\n            <th>Original Teleport Type</th>\n            <th>Teleport\
    \ Data</th>\n            <th>ReservedServerId</th>\n            <th>VipServerId</th>\n\
    \            <th>ReservedServerAccessCode</th>\n            <th>ServerInstanceId</th>\n\
    \            <th>ShouldReserveServer</th>\n        </tr>\n    </thead>\n    <tbody>\n\
    \        <tr>\n            <td>Individual player to place</td>\n            <td>Original\
    \ value</td>\n            <td>None</td>\n            <td>None</td>\n         \
    \   <td>None</td>\n            <td>None</td>\n            <td>false</td>\n   \
    \     </tr>\n        <tr>\n            <td>Player(s) to reserved server (ReservedServerId)</td>\n\
    \            <td>Original value</td>\n            <td>Original value</td>\n  \
    \          <td>None</td>\n            <td>None</td>\n            <td>None</td>\n\
    \            <td>false</td>\n        </tr>\n        <tr>\n            <td>Player(s)\
    \ to VIP server (VipServerId)</td>\n            <td>Original value</td>\n    \
    \        <td>None</td>\n            <td>Original value</td>\n            <td>None</td>\n\
    \            <td>None</td>\n            <td>false</td>\n        </tr>\n      \
    \  <tr>\n            <td>Player(s) to reserved server (legacy access code)</td>\n\
    \            <td>Original value</td>\n            <td>None</td>\n            <td>None</td>\n\
    \            <td>Original value, or the code generated if ShouldReserveServer\
    \ was originally true</td>\n            <td>None</td>\n            <td>false</td>\n\
    \        </tr>\n        <tr>\n            <td>Player(s) to specific server</td>\n\
    \            <td>Original value</td>\n            <td>None</td>\n            <td>None</td>\n\
    \            <td>None</td>\n            <td>Original value</td>\n            <td>false</td>\n\
    \        </tr>\n        <tr>\n            <td>Players to place</td>\n        \
    \    <td>Original value</td>\n            <td>None</td>\n            <td>None</td>\n\
    \            <td>None</td>\n            <td>Same destination ID as the other players\
    \ in the original teleport</td>\n            <td>false</td>\n        </tr>\n \
    \   </tbody>\n</table>\n\nWhen the engine routes a plain teleport to a VIP server,\
    \ VIP-specific join\nfailures such as a full or flooded server fall back to a\
    \ public join and\nthis event does not fire. Only teleports with an explicit\n\
    `Class.TeleportOptions.VipServerId` surface a VIP join failure through\nthis event.\n\
    \nFor more information on how to teleport players between servers, see\n[Teleport\
    \ between places](../../../projects/teleport.md).\n"
  code_samples: []
  parameters:
  - name: player
    type: Instance
    default: null
    summary: 'The `Class.Player` instance that failed to teleport.

      '
  - name: teleportResult
    type: TeleportResult
    default: null
    summary: 'The reason for the teleport failure.

      '
  - name: errorMessage
    type: string
    default: null
    summary: 'The message provided to the player explaining the teleport failure.

      '
  - name: placeId
    type: int64
    default: null
    summary: 'The original target place ID of the teleport.

      '
  - name: teleportOptions
    type: Instance
    default: null
    summary: 'A `Class.TeleportOptions` object that can be passed back to

      `Class.TeleportService:TeleportAsync()` to retry the failed teleport.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Teleport
