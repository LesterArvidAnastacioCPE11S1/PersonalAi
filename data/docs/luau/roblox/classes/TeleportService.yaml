- name: TeleportService:GetPlayerPlaceInstanceAsync
  summary: 'Returns the `Class.DataModel.PlaceId|PlaceId` and

    `Class.DataModel.JobId|JobId` of the server the user with the given

    `Class.Player.UserId|UserId` is in provided it is in the same game as the

    current place.

    '
  description: "This function returns the `Class.DataModel.PlaceId|PlaceId` and\n\
    `Class.DataModel.JobId|JobId` of the server the user with the given\n`Class.Player.UserId|UserId`\
    \ is in, provided it is in the same game as the\ncurrent place.\n\nThen, `Class.TeleportService:TeleportToPlaceInstance()`\
    \ can be called with\nthis information to allow a user to join the target user's\
    \ server.\n\nUpon a successful lookup, the function returns the following values:\n\
    \n<table>\n\t<thead>\n\t\t<tr>\n\t\t\t<th>#</th>\n\t\t\t<th>Name</th>\n\t\t\t\
    <th>Type</th>\n\t\t\t<th>Description</th>\n\t\t</tr>\n\t</thead>\n\t<tbody>\n\t\
    \t<tr>\n\t\t\t<td><b>1</b></td>\n   \t\t\t<td> currentInstance</td>\n\t\t\t<td>bool</td>\n\
    \t\t\t<td>A bool indicating if the user was found in the current instance</td>\n\
    \t\t</tr>\n\t\t<tr>\n\t\t\t<td><b>2</b></td>\n   \t\t\t<td>error</td>\n\t\t\t\
    <td>string</td>\n\t\t\t<td>An error message in the event of the lookup failing</td>\n\
    \t\t</tr>\n\t\t<tr>\n\t\t\t<td><b>3</b></td>\n   \t\t\t<td>placeId</td>\n\t\t\t\
    <td>int64</td>\n\t\t\t<td>The PlaceId of the server the user is in</td>\n\t\t\
    </tr>\n\t\t<tr>\n\t\t\t<td><b>4</b></td>\n   \t\t\t<td>instanceId</td>\n\t\t\t\
    <td>string</td>\n\t\t\t<td>The JobId of the server the user is in</td>\n\t\t</tr>\n\
    \t</tbody>\n</table>\n\nIf there is a problem during lookup, such as the user\
    \ being offline, an\nerror is thrown. It is recommended that you wrap calls to\
    \ this function in\n`pcall`.\n\n#### Limitations\n\nYou should be aware of the\
    \ following limitations when using this function:\n\n- This function can only\
    \ be called by the server.\n- This function may fail to return the correct information\
    \ if the user is\n  teleporting.\n- It is possible for this function to throw\
    \ an error, hence developers\n  should wrap it in a `Global.LuaGlobals.pcall()`\
    \ (see example below)\n- As this function returns the JobId of the server and\
    \ not the access code\n  returned by `Class.TeleportService:ReserveServerAsync()`,\
    \ the ID\n  returned is not appropriate for use with reserved servers.\n\n####\
    \ Studio Limitation\n\nNote that this function does not work during playtesting\
    \ in Roblox Studio;\nto use it, you must publish the experience and play it in\
    \ the Roblox\napplication.\n"
  code_samples:
  - following-a-player-in-a-universe
  parameters:
  - name: userId
    type: User
    default: null
    summary: 'The `Class.Player.UserId` of the `Class.Player`.

      '
  returns:
  - type: Tuple
    summary: 'See the table above.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Teleport
- name: TeleportService:GetTeleportSetting
  summary: 'Retrieves a teleport setting saved using

    `Class.TeleportService:SetTeleportSetting()` using the given key.

    '
  description: "This function retrieves a teleport setting saved using\n`Class.TeleportService:SetTeleportSetting()`\
    \ using the given key.\n\nThis method is intended for use on the client only and\
    \ should not be used\non the server.\n\nTeleport settings are preserved across\
    \ teleportations within the same\ngame. This means data can be saved using\n`Class.TeleportService:SetTeleportSetting()`\
    \ in one place and retrieved\nusing GetTeleportSetting in another place the user\
    \ has been teleported to.\n\nFor example, in a game that allowed crouching you\
    \ could save whether the\nuser is currently crouching prior to teleporting as\
    \ a teleport setting.\nThis could then be retrieved in the destination place after\
    \ the\nteleportation:\n\n```lua\nlocal TeleportService = game:GetService(\"TeleportService\"\
    )\n\nlocal isCrouching = TeleportService:GetTeleportSetting(\"isCrouching\")\n\
    ```\n\nIf no teleport setting exists under the given key, this function will\n\
    return _nil_.\n\n#### Differences from GlobalDataStores\n\nAlthough they share\
    \ some similarities, there are some key differences\nbetween teleport settings\
    \ and datastores:\n\n- `Class.GlobalDataStore:SetAsync()` stores the data on Roblox\
    \ servers\n  whereas SetTeleportSetting stores the data locally\n- Data stored\
    \ in a `Class.GlobalDataStore` is preserved after the user\n  leaves the game\
    \ universe whereas teleport settings are not\n- `Class.GlobalDataStore|GlobalDataStores`\
    \ can only be accessed on the\n  server, whereas teleport settings can only be\
    \ accessed on the client\n- `Class.GlobalDataStore|GlobalDataStores` have usage\
    \ limits, whereas\n  teleport settings do not\n\nIn general teleport settings\
    \ should be used to preserve client side\ninformation within a single play session\
    \ across different places in a\ngame. `Class.GlobalDataStore|GlobalDataStores`\
    \ should be used to save\nimportant player data that needs to be accessed across\
    \ player sessions.\n\n#### Teleport settings and security\n\nAs teleport settings\
    \ are stored locally, it is possible they can be\nmanipulated by malicious users.\
    \ This risk can be mitigated by employing\nserver side validation.\n\n#### Studio\
    \ Limitation\n\nSee\n[Test teleports](https://create.roblox.com/docs/projects/teleport#test-teleports-in-studio)\n\
    for information on using this function in Studio testing.\n"
  code_samples: []
  parameters:
  - name: setting
    type: string
    default: null
    summary: 'The key the value was stored under using

      `Class.TeleportService:SetTeleportSetting()`.

      '
  returns:
  - type: Variant
    summary: 'The value stored under the given key.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Teleport
- name: TeleportService:PromptExperienceDetailsAsync
  summary: 'Prompts a `Class.Player` with information about the specified experience.

    The player can choose to teleport to the target experience through the

    prompt.

    '
  description: "Prompts the specified `Class.Player` with information of the specified\n\
    experience. The prompt includes the experience name, creator name,\nmaturity rating,\
    \ etc. The prompt also includes a **Join** button which the\nplayer can use to\
    \ be teleported to the target experience. If the player is\nineligible to join\
    \ the target experience, the button will be disabled.\n\nAny teleport failures\
    \ after the player clicks the **Join** button will\nalso fire `Class.TeleportService.TeleportInitFailed`\
    \ providing a reason\nfor the failure.\n\n#### Limitations\n\n- For security purposes,\
    \ teleporting a user from your experience to\n  another experience owned by others\
    \ fails by default. See\n  [here](../../../projects/teleport.md#enable-cross-experience-teleportation)\n\
    \  for steps to enable cross-experience teleportation.\n- This function currently\
    \ can only be called from the client with\n  `Class.Players.LocalPlayer` as the\
    \ `player` parameter.\n- The join button will always be disabled during Studio\
    \ playtesting; to\n  test aspects of your experience using it, you must publish\
    \ the\n  experience and play it in the Roblox application.\n"
  code_samples:
  - present-experience-details-page
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` to be presented the prompt.

      '
  - name: universeId
    type: int64
    default: null
    summary: '`Class.DataModel.UniverseId` of the experience to be presented to the

      `Class.Player`.

      '
  returns:
  - type: PromptExperienceDetailsResult
    summary: '`Enum.PromptExperienceDetailsResult`

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Teleport
