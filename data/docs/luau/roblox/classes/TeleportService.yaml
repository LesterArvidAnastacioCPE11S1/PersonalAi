  tags: []
  deprecation_message: 'Use `Class.TeleportService:TeleportAsync()|TeleportAsync()`
    for

    server-side teleports. For client-side teleports, use a

    `Class.RemoteEvent` to signal the server to call `TeleportAsync()`. For a

    migration guide, see

    [Teleport between places](../../../projects/teleport.md#migrate-to-secure-teleports).

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
  - Teleport
- name: TeleportService:TeleportAsync
  summary: 'The all-encompassing method to teleport a player or group of players from

    one server to another.

    '
  description: "This function serves as the all-encompassing method to teleport a\
    \ player\nor group of players from one server to another. It can be used to:\n\
    \n- Teleport players to a different place.\n- Teleport players to a specific server.\n\
    - Teleport players to a reserved server.\n\nFor a single-player teleport with\
    \ no server routing option, the engine can\ninfer that the player should return\
    \ to a VIP server if the player\noriginally joined in a VIP server. If that inferred\
    \ VIP join fails for an\neligible reason, the engine can fall back to a public\
    \ server. Set\n`Class.TeleportOptions.ForcePublicServer` to skip this inference\
    \ for the\ncurrent teleport.\n\n#### Server-Only\n\nThis method can only be called\
    \ from the server. If you need to initiate a\nteleport from the client, use a\
    \ `Class.RemoteEvent` to signal the server,\nthen call `Class.TeleportService:TeleportAsync()`\
    \ from a server\n`Class.Script`. Client-side teleports using\n`Class.TeleportService:Teleport()`\
    \ is not recommended for new work. See\n[Teleport between places](../../../projects/teleport.md)\
    \ for more\ninformation.\n\n#### Group Teleport Limitations\n\n- Groups of players\
    \ can only be teleported within a single experience.\n- No more than 50 players\
    \ can be teleported with a single\n  `Class.TeleportService:TeleportAsync()` call.\n\
    \n#### Studio Limitation\n\nSee\n[Test teleports](https://create.roblox.com/docs/projects/teleport#test-teleports-in-studio)\n\
    for information on using this function in Studio testing.\n\n#### Potential Errors\n\
    \nThis is a list of potential reasons a teleport may fail, ranging from\ninvalid\
    \ teleports to network issues.\n\n<table>\n    <thead>\n        <tr>\n       \
    \     <th>Error</th>\n           \t<th>Description</th>\n        </tr>\n    </thead>\n\
    \    <tbody>\n        <tr>\n            <td>Invalid placeId</td>\n           \
    \ <td>The provided place ID is below 0.</td>\n        </tr>\n        <tr>\n  \
    \          <td>Players empty</td>\n            <td>The provided list of players\
    \ to teleport is empty.</td>\n        </tr>\n        <tr>\n            <td>List\
    \ of players instances is incorrect</td>\n            <td>Any of the provided\
    \ players is not a Player object.</td>\n        </tr>\n        <tr>\n        \
    \    <td>TeleportOptions not of correct type</td>\n            <td>The provided\
    \ teleportOption is not a TeleportOptions object.</td>\n        </tr>\n      \
    \  <tr>\n            <td>TeleportAsync called from Client</td>\n            <td>The\
    \ client called TeleportAsync, which can only be called from the server.</td>\n\
    \        </tr>\n        <tr>\n            <td>Incompatible Parameters</td>\n \
    \           <td>\n              Conflicting teleport options were used and TeleportService\
    \ doesn't know where to send the player.<br><br>\n              Only one of the\
    \ following private-server routing fields may be set at a time:<br>\n        \
    \       * ReservedServerId<br>\n               * VipServerId<br>\n           \
    \    * ReservedServerAccessCode<br>\n               * ShouldReserveServer<br>\n\
    \               * ServerInstanceId\n            </td>\n        </tr>\n    </tbody>\n\
    </table>\n\nFor more information on how to teleport players between servers and\n\
