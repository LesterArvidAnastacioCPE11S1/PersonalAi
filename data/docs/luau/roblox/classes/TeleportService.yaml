  - Teleport
- name: TeleportService:SetTeleportGui
  summary: 'Sets the custom `Class.ScreenGui|teleport GUI` that will be shown to the

    local user during teleportation, prior to the teleport being invoked.

    '
  description: 'This function sets the custom `Class.ScreenGui|teleport GUI` that
    will be

    shown to the local user during teleportation, prior to the teleport being

    invoked.


    Note, the `Class.ScreenGui|teleport GUI` will not be used if the

    destination place is in a different game. It will also not persist across

    multiple teleports and will need to be set prior to each one.


    This function should only be used on the client. If the teleportation

    function is called from the server (as is the case with

    `Class.TeleportService:TeleportAsync()`) then this function should be

    called on the client prior to this. One way of doing this is listening to

    a `Class.RemoteEvent` that fires several seconds before teleportation.


    #### Loading screen


    During a teleport, while the destination place is loading, the

    _customLoadingScreen_ is parented to the `Class.CoreGui`. Once the place

    has loaded the `Class.ScreenGui|loading screen` is

    `Class.Instance.Parent|parented` to _nil_.


    This `Class.ScreenGui` can be fetched at the destination place using

    `Class.TeleportService:GetArrivingTeleportGui()`, allowing you to parent

    it to the `Class.PlayerGui` and perform your own transitions.


    You are advised to also `Class.Instance.Parent|parent` the

    `Class.ScreenGui` to the `Class.PlayerGui` in the start place while the

    teleport is initiating.


    #### External references


    The teleport GUI and all of its descendants are carried to the destination

    place, but any property that references an `Class.Instance` **outside**

    the GUI''s own tree is cleared during the teleport. For example, a

    `Class.Sound` inside the GUI whose `Class.Sound.SoundGroup|SoundGroup`

    points to a `Class.SoundGroup` under `Class.SoundService` will arrive with

    that reference set to `nil`, because the target lives outside the GUI and

    cannot safely cross the boundary between servers.


    References that point to other instances **within** the GUI tree are

    preserved. If your loading screen depends on an external instance,

    recreate that instance inside the GUI tree.


    #### Studio Limitation


    See

    [Test teleports](https://create.roblox.com/docs/projects/teleport#test-teleports-in-studio)

    for information on using this function in Studio testing.

    '
  code_samples:
  - teleporting-the-local-player
  parameters:
  - name: gui
    type: Instance
    default: null
    summary: 'The loading `Class.ScreenGui` that is to be displayed during

      teleportation.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
  - Teleport
- name: TeleportService:SetTeleportSetting
  summary: 'Stores a value under a given key that persists across all teleportations

    in the same game.

    '
  description: "This function stores a value under a given key that persists across\
    \ all\nteleportations in the same game.\n\nThis method is intended for use on\
    \ the client only and should not be used\non the server.\n\nThe stored value can\
    \ later be retrieved using\n`Class.TeleportService:GetTeleportSetting()`. This\
    \ will work in the\ncurrent place and any subsequent places the `Class.Players.LocalPlayer`\n\
    teleports to, provided they are in the same game.\n\nFor example, in a game that\
    \ allowed crouching you could save whether the\nuser is currently crouching prior\
    \ to teleporting as a teleport setting:\n\n```lua\nlocal TeleportService = game:GetService(\"\
    TeleportService\")\n\nlocal isCrouching = false\nTeleportService:SetTeleportSetting(\"\
    isCrouching\", isCrouching)\n```\n\nThe stored value may only contain value types.\
    \ It cannot contain\n`Class.Instance|Instances` or other types that reference\
    \ engine state, as\nthese cannot safely cross the boundary between servers.\n\n\
    Allowed values:\n\n- Primitives: a `bool`, a `number`, or a `string`\n- Value\
    \ types such as `Datatype.Vector3`, `Datatype.CFrame`,\n  `Datatype.Color3`, `Datatype.UDim2`,\
    \ `Datatype.NumberSequence`,\n  `Datatype.ColorSequence`, `Enum` items, and similar\n\
    - A table without mixed keys (all strings or all integers) containing only\n \
    \ the allowed types above\n\nNot allowed (these will be removed before the teleport\
    \ completes):\n\n- `Class.Instance` and instance references\n- `Datatype.RBXScriptConnection|Connections`,\
    \ `Datatype.RBXScriptSignal`,\n  and functions\n- `SharedTable`\n- Types that\
    \ reference engine or `Class.DataModel` state, such as\n  `Class.InputObject`,\
    \ `Datatype.RaycastParams`, and\n  `Datatype.RaycastResult`\n\nIf a stored setting\
    \ contains a disallowed type, that value is removed and\nan error is written to\
    \ the developer console. Convert instance references\nto plain values (for example,\
    \ a numeric ID or a string path).\n\nIf data is already stored under the given\
    \ key, the previous value will be\noverwritten by the new value.\n\n#### Differences\
    \ from GlobalDataStores\n\nAlthough they share some similarities, there are some\
    \ key differences\nbetween teleport settings and datastores:\n\n- `Class.GlobalDataStore:SetAsync()`\
    \ stores the data on Roblox servers\n  whereas SetTeleportSetting stores the data\
    \ locally\n- Data stored in a `Class.GlobalDataStore` is preserved after the user\n\
    \  leaves the game universe whereas teleport settings are not\n- `Class.GlobalDataStore|GlobalDataStores`\
    \ can only be accessed on the\n  server, whereas teleport settings can only be\
    \ accessed on the client\n- `Class.GlobalDataStore|GlobalDataStores` have usage\
    \ limits, whereas\n  teleport settings do not\n\nIn general teleport settings\
    \ should be used to preserve client side\ninformation within a single play session\
    \ across different places in a\ngame. `Class.GlobalDataStore|GlobalDataStores`\
    \ should be used to save\nimportant player data that needs to be accessed across\
    \ player sessions.\n\n#### Teleport settings and security\n\nAs teleport settings\
    \ are stored locally, it is possible they can be\nmanipulated by malicious users.\
    \ This risk can be mitigated by employing\nserver side validation.\n\n#### Studio\
    \ Limitation\n\nSee\n[Test teleports](https://create.roblox.com/docs/projects/teleport#test-teleports-in-studio)\n\
    for information on using this function in Studio testing.\n"
  code_samples: []
  parameters:
  - name: setting
    type: string
    default: null
    summary: 'The key to store the _value_ under. This key can be used to retrieve

      the value using `Class.TeleportService:GetTeleportSetting()`.

      '
  - name: value
    type: Variant
    default: null
    summary: 'The value to store.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Teleport
