- name: TeleportService:ReserveServerAsync
  summary: 'Returns an access code that can be used to teleport players to a reserved

    server, along with the `Class.DataModel.PrivateServerId` for it.

    '
  description: 'This function is deprecated and no longer supported. It remains available

    for backward compatibility but should not be used for new work. It can

    only be called on the server.


    For new work, generate a GUID with `Class.HttpService:GenerateGUID()`, set

    `Class.TeleportOptions.ReservedServerId`, and call

    `Class.TeleportService:TeleportAsync()`.


    You can see if the current server is a reserved server by using the

    following code:


    ```lua

    local isReserved = game.PrivateServerId ~= "" and game.PrivateServerOwnerId ==
    0

    ```


    The `Class.DataModel.PrivateServerId` is constant across all server

    instances associated with the server access code, the

    `Class.DataModel.JobId` is not.


    #### Studio Limitation


    See

    [Test teleports](https://create.roblox.com/docs/projects/teleport#test-teleports-in-studio)

    for information on using this function in Studio testing.


    #### Cross-Platform Play


    Players on Xbox and PlayStation with cross‑play disabled will arrive in a

    different server than players with cross‑play enabled. This can cause

    multiple game servers with the same

    `Class.DataModel.PrivateServerId|PrivateServerId` to exist. You can use

    `Class.DataModel.MatchmakingType` to differentiate these game servers.

    '
  code_samples:
  - TeleportService-ReserveServer1
  - teleportservice-teleport-to-a-reserved-server-via-chat
  parameters:
  - name: placeId
    type: int64
    default: null
    summary: 'The `Class.DataModel.PlaceId` of the place the reserved server is

      being created for.

      '
  returns:
  - type: Tuple
    summary: 'The server access code required by

      `Class.TeleportService:TeleportToPrivateServer()` and the

      `Class.DataModel.PrivateServerId` for the reserved server.

      '
  tags:
