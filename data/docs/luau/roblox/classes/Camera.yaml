- name: Camera.CFrame
  summary: 'The `Datatype.CFrame` of the `Class.Camera`, defining its position and

    orientation in the 3D world.

    '
  description: "This property is the `Datatype.CFrame` of the `Class.Camera`, defining\
    \ its\nposition and orientation in the 3D world. Note that some transformations,\n\
    such as the rotation of the head when using VR devices, are not reflected\nin\
    \ this property, so you should use\n`Class.Camera:GetRenderCFrame()|GetRenderCFrame()`\
    \ to obtain the \"true\"\n`Datatype.CFrame` of the camera.\n\nYou can move the\
    \ camera by setting this property. However, the default\ncamera scripts also set\
    \ it, so you should either:\n\n- Set the camera `Class.Camera.CameraType|CameraType`\
    \ to\n  `Enum.CameraType.Scriptable` so that the default camera scripts will not\n\
    \  update the camera's `Datatype.CFrame`. This method is simplest and\n  recommended\
    \ in most cases.\n\n- Completely replace the default camera scripts with alternatives.\
    \ This\n  approach is only recommended if you do not need any default camera\n\
    \  functionality.\n\nThe most intuitive way to position and orient the `Class.Camera`\
    \ is by\nusing the `Datatype.CFrame.lookAt()` constructor. In the following\n\
    example, the `Class.Camera` is positioned at\n`Datatype.Vector3.new(0, 10, 0)`\
    \ and is oriented to be looking towards\n`Datatype.Vector3.new(10, 0, 0)`.\n\n\
    ```lua\nlocal camera = workspace.CurrentCamera\ncamera.CameraType = Enum.CameraType.Scriptable\n\
    \nlocal pos = Vector3.new(0, 10, 0)\nlocal lookAtPos = Vector3.new(10, 0, 0)\n\
    \ncamera.CFrame = CFrame.lookAt(pos, lookAtPos)\n```\n\nAlthough the camera can\
    \ be placed in the manner demonstrated above, you\nmay want to animate it to move\
    \ smoothly from one `Datatype.CFrame` to\nanother. For this, you can either:\n\
    \n- Set the camera's position/orientation every frame with\n  `Class.RunService:BindToRenderStep()`\
    \ and the `Datatype.CFrame:Lerp()`\n  method.\n- Create and play a `Class.Tween`\
    \ that animates the position/orientation\n  of the camera:\n\n  ```lua\n  local\
    \ Players = game:GetService(\"Players\")\n  local TweenService = game:GetService(\"\
    TweenService\")\n\n  local camera = workspace.CurrentCamera\n  camera.CameraType\
    \ = Enum.CameraType.Scriptable\n\n  local player = Players.LocalPlayer\n  local\
    \ character = player.Character\n  if not character or character.Parent == nil\
    \ then\n  \tcharacter = player.CharacterAdded:Wait()\n  end\n\n  local pos = camera.CFrame\
    \ * Vector3.new(0, 20, 0)\n  local lookAtPos = character.PrimaryPart.Position\n\
    \  local targetCFrame = CFrame.lookAt(pos, lookAtPos)\n\n  local tween = TweenService:Create(camera,\
    \ TweenInfo.new(2), {CFrame = targetCFrame})\n\n  tween:Play()\n  ```\n"
  code_samples: []
  type: CFrame
