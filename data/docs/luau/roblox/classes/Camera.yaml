- name: Camera.HeadLocked
  summary: 'Toggles whether the camera will automatically track the head motion of
    a

    player using a VR device.

    '
  description: "Toggles whether the camera will automatically track the head motion\
    \ of a\nplayer using a VR device. When `true` (default), the engine combines\n\
    `Class.Camera.CFrame|CFrame` with the `Enum.UserCFrame` of the user's head\nto\
    \ render the player's view with head tracking factored in. The view will\nbe rendered\
    \ at the following `Datatype.CFrame`:\n\n```lua\nlocal UserInputService = game:GetService(\"\
    UserInputService\")\n\nlocal camera = workspace.CurrentCamera\n\nlocal headCFrame\
    \ = UserInputService:GetUserCFrame(Enum.UserCFrame.Head)\nheadCFrame = headCFrame.Rotation\
    \ + headCFrame.Position * camera.HeadScale\n\n-- This will be equivalent to Camera:GetRenderCFrame()\n\
    local renderCFrame = camera.CFrame * headCFrame\n```\n\nIt is recommended to **not**\
    \ disable this property for the following\nreasons:\n\n- Players may experience\
    \ motion sickness if an equivalent head tracking\n  solution is not added.\n-\
    \ The Roblox Engine performs latency optimizations when `HeadLocked` is\n  true.\n\
    \n##### See Also\n\n- `Class.VRService:GetUserCFrame()` which can be used to obtain\
    \ the\n  `Datatype.CFrame` of the head.\n- `Class.VRService:RecenterUserHeadCFrame()`\
    \ which is used to recenter the\n  head to the current position and orientation\
    \ of the VR device.\n- The `Class.Camera:GetRenderCFrame()|GetRenderCFrame()`\
    \ method which\n  returns the `Class.Camera.CFrame|CFrame` combined with the\n\
    \  `Datatype.CFrame` of the user's head.\n"
  code_samples: []
  type: boolean
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: true
    can_save: true
  capabilities:
  - Basic
- name: Camera.HeadScale
  summary: 'Sets the scale of the user''s perspective of the world when using VR.

    '
  description: '`HeadScale` is the scale of the user''s perspective of the world when
    using

    VR.


    The size of 1 stud in VR is `0.3 meters / HeadScale`, meaning that larger

    `HeadScale` values equate to the world looking smaller from the user''s

    perspective when using VR devices. For example, a part that''s 1 stud tall

    appears to be 0.6 meters tall to a VR player with a `HeadScale` of `0.5`.


    This property is automatically controlled by

    `Class.VRService.AutomaticScaling` to align the player''s perspective with

    the size of their avatar. If you intend to control `HeadScale` yourself or

    use custom characters, toggle `Class.VRService.AutomaticScaling` to

    `Enum.VRScaling.Off`.


    This property should not be confused with `Class.Humanoid.HeadScale` which

    is a `Class.NumberValue` parented to a `Class.Humanoid` to control its

    scaling.

    '
