methods:
- name: Camera:GetLargestCutoffDistance
  summary: 'Returns how much the `Class.Camera` needs to be pushed towards its

    `Class.Camera.Focus|Focus` in order to make sure there is no obstructions

    between the `Class.Camera.Focus|Focus` and `Class.Camera.CFrame|CFrame`.

    '
  description: "This method is used by `PopperCam` in the default camera scripts to\
    \ ensure\nobstructions do not come between the `Class.Camera` and its subject.\n\
    \nThis method will check all `Class.BasePart|BaseParts` and `Class.Terrain`\n\
    in the `Class.Workspace` with the following exceptions:\n\n- Any `Class.Instance`\
    \ specified in the `ignoreList` (including its\n  descendants) will be ignored\n\
    - `Class.BasePart|BaseParts` with `Class.BasePart.CanCollide` set to false\n \
    \ are ignored\n- `Class.BasePart|BaseParts` with a `Class.BasePart.Transparency`\
    \ greater\n  than 0.95 will be ignored Water `Class.Terrain` is ignored\n\nNote,\
    \ as this method requires an `ignoreList` to run, you should pass an\nempty table\
    \ when none is required.\n"
  code_samples: []
  parameters:
  - name: ignoreList
    type: Instances
    default: null
    summary: 'An array of `Class.Instance|Instances` to ignore. Descendants of these

      instances will also be ignored.

      '
  returns:
  - type: float
    summary: 'The distance, in studs, that the `Class.Camera` needs to be pushed

      towards its `Class.Camera.Focus|Focus` to ensure there are no

      obstructions between the `Class.Camera.Focus|Focus` and

      `Class.Camera.CFrame|CFrame` of the `Class.Camera`.

      '
  tags:
  - Deprecated
  deprecation_message: 'This method is deprecated. Do not use it for new work.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: Camera:GetPanSpeed
  summary: 'Returns the current ''pan'' speed of the `Class.Camera`.

    '
  description: 'This method is broken and should not be used.


    This method returns the current pan speed of the `Class.Camera`.


    The pan speed of the `Class.Camera` describes the speed at which the

    `Class.Camera` is rotating around its `Class.Camera.Focus|Focus` around

    the **Y** axis.

    '
  code_samples: []
  parameters: []
  returns:
  - type: float
    summary: 'The speed at which the `Class.Camera` is rotating around its

      `Class.Camera.Focus|Focus` on the **Y** axis.

      '
  tags:
  - Deprecated
  deprecation_message: 'This method has been deprecated and no longer works. It should
    not be used

    in new work.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: Camera:GetPartsObscuringTarget
  summary: 'Returns an array of `Class.BasePart|BaseParts` that are obscuring the

    lines of sight between the camera''s `Class.Camera.CFrame|CFrame` and the

    cast points.

    '
  description: "This method returns an array of `Class.BasePart|BaseParts` that are\n\
    obscuring the lines of sight between the camera's\n`Class.Camera.CFrame|CFrame`\
    \ and `Datatype.Vector3` positions in the\n`castPoints` array. Any `Class.Instance|Instances`\
    \ included in the\n`ignoreList` array will be ignored, along with their descendants.\n\
    \nThe `castPoints` parameter is given as an array of `Datatype.Vector3`\npositions.\
    \ Note that the array of `Class.BasePart|BaseParts` returned is\nin an arbitrary\
    \ order, and no additional raycast data is provided. If you\nneed data such as\
    \ hit position, hit material, or surface normal, you\nshould opt for the `Class.WorldRoot:Raycast()`\
    \ method.\n\n```lua\nlocal camera = workspace.CurrentCamera\n\nlocal castPoints\
    \ = {\n\tVector3.new(0, 10, 0),\n\tVector3.new(0, 15, 0)\n}\nlocal ignoreList\
    \ = {}\n\nlocal partsObscuringTarget = camera:GetPartsObscuringTarget(castPoints,\
    \ ignoreList)\n```\n\nIf `Class.Terrain` obscures a cast point, `Class.BasePart|BaseParts`\n\
    obscuring the cast point between the obscuring `Class.Terrain` and the\ncast point\
    \ will not be returned.\n"
  code_samples: []
  parameters:
  - name: castPoints
    type: Array
    default: null
    summary: 'An array of `Datatype.Vector3` positions of cast points.

      '
  - name: ignoreList
    type: Instances
    default: null
    summary: 'An array of `Class.Instance|Instances` that should be ignored, along

      with their descendants.

      '
  returns:
  - type: Instances
    summary: 'An array of `Class.BasePart|BaseParts` that obscure the lines of sight

      between the camera''s `Class.Camera.CFrame|CFrame` and the

      `castPoints`.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: Camera:GetRenderCFrame
  summary: 'Returns the actual `Datatype.CFrame`where the `Class.Camera` is being

    rendered, accounting for any roll applied and the impact of VR devices.

    '
  description: 'This method returns the actual `Datatype.CFrame` of the `Class.Camera`
    as

    it is rendered, including the impact of VR (VR head transformations are

    not applied to the `Class.Camera.CFrame|CFrame` property, so it is best

    practice to use `Class.Camera:GetRenderCFrame()|GetRenderCFrame()` to

    obtain the "true" `Datatype.CFrame` of a player''s view).


    For example, when using VR, the `Class.Camera` is actually rendered at the

    following `Datatype.CFrame`:


    ```lua

    local UserInputService = game:GetService("UserInputService")


    local camera = workspace.CurrentCamera


    local headCFrame = UserInputService:GetUserCFrame(Enum.UserCFrame.Head)

    headCFrame = headCFrame.Rotation + headCFrame.Position * camera.HeadScale

    renderCFrame = camera.CFrame * headCFrame

    ```


    The camera''s render `Datatype.CFrame` will only be changed to account for

    the head when the `Class.Camera.HeadLocked|HeadLocked` property is true.

    '
  code_samples: []
  parameters: []
  returns:
  - type: CFrame
    summary: 'The `Datatype.CFrame` the `Class.Camera` is being rendered at.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
