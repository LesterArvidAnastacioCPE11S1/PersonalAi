- name: Camera.FieldOfView
  summary: 'Sets the angle of the camera''s vertical field of view.

    '
  description: "The `FieldOfView` (FOV) property sets how many degrees in the vertical\n\
    direction the camera can view. This property is clamped between `1` and\n`120`\
    \ degrees and defaults at `70`. Very low or very high fields of view\nare not\
    \ recommended as they can be disorientating to players.\n\nNote that uniform scaling\
    \ is enforced, meaning the vertical and horizontal\nfield of view are always related\
    \ by the aspect ratio of the screen.\n\nSuggested uses for `FieldOfView` include:\n\
    \n- Reducing FOV to give the impression of magnification, for example when\n \
    \ using binoculars.\n- Increasing FOV when the player is \"sprinting\" to give\
    \ the impression of\n  a lack of control.\n\nNote that `FieldOfView` represents\
    \ the field of view that is visible by\nthe `Class.Camera` rendering into the\
    \ fullscreen area which may be\noccluded by notches or screen cutouts on some\
    \ devices. See\n`Class.Camera.ViewportSize|ViewportSize` for more information.\n"
