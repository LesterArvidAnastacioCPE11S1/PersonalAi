  summary: 'Pans the `Class.Camera` around the `Class.Camera.Focus|Focus` in 45 degree

    increments around the **Y** axis.

    '
  description: 'This method pans the `Class.Camera` around the `Class.Camera.Focus|Focus`

    in 45 degree increments around the **Y** axis.


    The rotation is applied to the camera''s `Class.Camera.CFrame|CFrame`

