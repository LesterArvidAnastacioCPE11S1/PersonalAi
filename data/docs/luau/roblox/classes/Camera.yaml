- name: Camera.NearPlaneZ
  summary: 'Describes the negative **Z** offset, in studs, of the camera''s near

    clipping plane.

    '
  description: 'The `NearPlaneZ` property describes how far away the camera''s near

    clipping plane is, in studs. The near clipping plane is a geometric plane

    that sits in front of the camera''s `Class.Camera.CFrame|CFrame`. Anything

    between this plane and the camera will not render, creating a cutaway view

    when viewing objects at very short distances. The value of `NearPlaneZ`

    varies across different platforms and is currently always between `-0.1`

    and `-0.5`.


    <img src="/assets/engine-api/classes/Camera/NearPlaneZ.jpg" width="720" alt="Diagram
    showing how the NearPlaneZ clips (does not render) 3D content between the plane
    and the camera." />

