- name: Camera:Interpolate
  summary: 'Tweens the `Class.Camera` in a linear fashion towards a new

    `Class.Camera.CFrame|CFrame` and `Class.Camera.Focus|Focus` over a given

    duration.

    '
  description: "This method tweens the `Class.Camera` in a linear fashion towards\
    \ a new\n`Class.Camera.CFrame|CFrame` and `Class.Camera.Focus|Focus` over a given\n\
    duration, for example:\n\n```lua\nlocal camera = workspace.CurrentCamera\ncamera.CameraType\
    \ = Enum.CameraType.Scriptable\n\ncamera:Interpolate(\n\tCFrame.new(0, 10, 100),\n\
    \tCFrame.new(0, 0, 100),\n\t5\n)\n```\n\nThroughout the tween, the camera's `Class.Camera.CFrame|CFrame`\
    \ will be\norientated towards the camera's `Class.Camera.Focus|Focus`.\n\nWhen\
    \ the tween has completed, the camera's\n`Class.Camera.InterpolationFinished|InterpolationFinished`\
    \ event will\nfire.\n\nIf this method is called while the `Class.Camera` is already\
    \ tweening, the\nolder tween will be stopped (without firing\n`Class.Camera.InterpolationFinished|InterpolationFinished`)\
    \ and overridden\nby the new tween.\n\nInterpolate can only be used if the current\n\
    `Class.Camera.CameraType|CameraType` is `Scriptable`, regardless of\nwhether the\
    \ default camera scripts are being used. If it is used with any\nother `Class.Camera.CameraType|CameraType`\
    \ an error will be thrown.\n\nYou are advised to use `Class.TweenService` to tween\
    \ the `Class.Camera`\ninstead as it is more reliable and offers a variety of easing\
    \ styles. See\nbelow for an example:\n\n```lua\nlocal TweenService = game:GetService(\"\
    TweenService\")\n\nlocal camera = workspace.CurrentCamera\ncamera.CameraType =\
    \ Enum.CameraType.Scriptable\n\nlocal tween = TweenService:Create(\n\tcamera,\n\
    \tTweenInfo.new(5, Enum.EasingStyle.Quad, Enum.EasingDirection.Out),\n\t{\n\t\t\
    CFrame = CFrame.new(0, 10, 100),\n\t\tFocus = CFrame.new(0, 0, 100)\n\t}\n)\n\n\
    tween:Play()\n```\n"
  code_samples: []
  parameters:
  - name: endPos
    type: CFrame
    default: null
    summary: 'The `Datatype.CFrame` for the `Class.Camera` to tween to.

      '
  - name: endFocus
    type: CFrame
    default: null
    summary: 'The `Datatype.CFrame` for the camera''s `Class.Camera.Focus|Focus` to

      tween to.

      '
  - name: duration
    type: float
    default: null
    summary: 'The duration, in seconds, of the tween.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Deprecated
  deprecation_message: 'This method has been deprecated. Instead use `Class.TweenService`
    to

    smoothly animate the `Class.Camera`, see the code snippets below for an

    example.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
