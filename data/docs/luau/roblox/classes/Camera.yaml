name: Camera
type: class
memory_category: Instances
summary: 'A class which defines a view of the 3D world.

  '
description: "The `Camera` object defines a view of the 3D world. In a running experience,\n\
  each client has its own `Camera` object which resides in that client's local\n`Class.Workspace`,\
  \ accessible through the `Class.Workspace.CurrentCamera`\nproperty.\n\nThe most\
  \ important camera properties are:\n\n- `Class.Camera.CFrame|CFrame` which represents\
  \ the position and orientation\n  of the camera.\n\n- `Class.Camera.CameraType|CameraType`\
  \ which is read by the experience's\n  camera scripts and determines how the camera\
  \ should update each frame.\n\n- `Class.Camera.CameraSubject|CameraSubject` which\
  \ is read by the experience's\n  camera scripts and determines what object the camera\
  \ should follow.\n\n- `Class.Camera.FieldOfView|FieldOfView` which represents the\
  \ visible extent\n  of the observable world.\n\n- `Class.Camera.Focus|Focus` which\
  \ represents the point the camera is looking\n  at. It's important this property\
  \ is set, as certain visuals will be more\n  detailed and will update more frequently\
  \ depending on how close they are to\n  the focus point.\n\nSee [Customizing the\
  \ Camera](../../../workspace/camera/index.md) for more\ninformation on how to adjust\
  \ and customize the camera's behavior.\n\n#### Storing Multiple Cameras\n\nNote\
  \ that when changing `Class.Workspace.CurrentCamera` to a new\n`Class.Camera`, all\
  \ other `Class.Camera|Cameras` directly descending from\n`Class.Workspace` will\
  \ be destroyed. If you need to store multiple cameras and\nswap between them on\
  \ demand, it's recommended that you store them in a\n`Class.Folder` or `Class.Model`\
  \ under `Class.Workspace`, inside which they\nwill remain even when `Class.Workspace.CurrentCamera|CurrentCamera`\
  \ is\nchanged.\n"
