name: CompositeValueCurve
type: class
memory_category: Instances
summary: 'An animation curve that groups child `Class.FloatCurve|FloatCurves` which
  each

  animate a different component of a non-unary value.

  '
description: "An animation curve that groups child `Class.FloatCurve|FloatCurves`\
  \ which each\nanimate a different component of a non-unary value. The\n`Class.CompositeValueCurve.CurveType|CurveType`\
  \ property specifies the type of\nvalue to be animated and, depending on this value,\
  \ differently named children\nare used to drive the animation of the components\
  \ of the value.\n\nAs follows are the names of the child curves that drive the animation\
  \ for each\npossible `Enum.CompositeValueCurveType` value for\n`Class.CompositeValueCurve.CurveType|CurveType`:\n\
  \n- `Enum.CompositeValueCurveType.ColorRGB|ColorRGB`: { `\"R\"`, `\"G\"`, `\"B\"\
  ` }\n- `Enum.CompositeValueCurveType.ColorHSV|ColorHSV`: { `\"H\"`, `\"S\"`, `\"\
  V\"` }\n- `Enum.CompositeValueCurveType.NumberRange|NumberRange`: { `\"Min\"`, `\"\
  Max\"` }\n- `Enum.CompositeValueCurveType.Rect|Rect`: { `\"MinX\"`, `\"MaxX\"`,\
  \ `\"MinY\"`,\n  `\"MaxY\"` }\n- `Enum.CompositeValueCurveType.UDim|UDim`: { `\"\
  Scale\"`, `\"Offset\"` }\n- `Enum.CompositeValueCurveType.UDim2|UDim2`: { `\"ScaleX\"\
  `, `\"OffsetX\"`,\n  `\"ScaleY\"`, `\"OffsetY\"` }\n- `Enum.CompositeValueCurveType.Vector2|Vector2`:\
  \ { `\"X\"`, `\"Y\"`}\n- `Enum.CompositeValueCurveType.Vector3|Vector3`: { `\"X\"\
  `, `\"Y\"`, `\"Z\"` }\n\nThe children that drive the animation can be accessed via\
  \ the\n`Class.CompositeValueCurve:GetComponentCurves()|GetComponentCurves()` method\n\
  which returns an array of curves in the order specified above. The value of\nthe\
  \ curve at a given time in the animation may be sampled by the\n`Class.CompositeValueCurve:GetValueAtTime()|GetValueAtTime()`\
  \ method.\n"
