methods:
- name: CompositeValueCurve:GetComponentCurves
  summary: 'Returns the child curves with the given names for the

    `Class.CompositeValueCurve.CurveType|CurveType` of this

    `Class.CompositeValueCurve`.

    '
  description: 'This method returns the child curves with the given names for the

    `Class.CompositeValueCurve.CurveType|CurveType` of this

    `Class.CompositeValueCurve`, in the order given by the list of child

    curves outlined at the top of this page. Any curve that does not exist

    prior to calling this method will be created and added as a child with the

    appropriate name. That new curve will be an empty `Class.FloatCurve`.

    '
  code_samples: []
  parameters: []
  returns:
  - type: List<FloatCurve>
    summary: 'An array of the child `Class.FloatCurve` instances that drive the

      components of the animated value, in the order listed at the top of

      this page. Any expected child curve that does not yet exist is created

      as an empty `Class.FloatCurve` and included in the result.

      '
