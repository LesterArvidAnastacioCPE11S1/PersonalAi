- name: CompositeValueCurve:GetValueAtTime
  summary: 'Returns the sampled animated value at the passed `time` argument.

    '
  description: 'This method returns the sampled animated value at the passed `time`

    argument. The type of the returned value will match that specified by the

    `Class.CompositeValueCurve.CurveType|CurveType` property.


    If any child curve is missing from the children of the curve, the

    corresponding value in the returned property will be `0`. For example, if

    a curve has a `Class.CompositeValueCurve.CurveType|CurveType` of

    `Enum.CompositeValueCurveType.ColorRGB` but only one `Class.FloatCurve`

    child named `"G"`, then the returned `Class.FloatCurve` will have values

    of `0` for `"R"` and `"B"`, but the `"G"` value will be sampled from the

    child curve.

    '
  code_samples: []
  parameters:
  - name: time
    type: float
    default: null
    summary: 'Time at which to get the value.

      '
  returns:
  - type: Variant
    summary: 'The value of the curve at the passed time.

      '
