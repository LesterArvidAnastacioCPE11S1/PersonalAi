name: ContentProvider
type: class
memory_category: Instances
summary: 'Service that is used to load content, or assets, into a game.

  '
description: "Service that loads content (assets) into a game.\n\nRoblox servers stream\
  \ all assets to the client at runtime: objects in the\nWorkspace, mesh assets, texture\
  \ assets, etc. Assets such as mesh visual data,\ntextures, decals, and sounds are\
  \ streamed in as required, regardless of\nwhether [Streaming](../../../workspace/streaming/index.md)\
  \ is enabled.\n\nIn some cases, this behavior is undesirable, as it can lead to\
  \ a delay before\nthe content loads into the experience.\n\n`ContentProvider` lets\
  \ you preload assets into an experience using the\n`Class.ContentProvider:PreloadAsync()`\
  \ method. You might want to display a\nloading screen, preload critical assets,\
  \ and only then allow the player into\nthe experience.\n\n#### Best Practices for\
  \ Preloading\n\n- Only preload essential assets, **not** the entire `Class.Workspace`.\
  \ You\n  might get occasional pop-in, but it decreases load times and generally\n\
  \  doesn't disrupt the player experience. Assets that are good candidates for\n\
  \  preloading include those required for the loading screen, the UI, or the\n  starting\
  \ area.\n- Let players skip the loading screen, or automatically skip it after a\n\
  \  certain amount of time.\n"
code_samples:
- ContentProvider1
inherits:
- Instance
descendants: []
tags:
- NotCreatable
