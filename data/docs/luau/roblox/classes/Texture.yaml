name: Texture
type: class
memory_category: GraphicsTexture
summary: 'Applies a repeating image texture to the face of a parent `Class.BasePart`.

  '
description: "A `Class.Texture` object applies a repeating image texture to the face\
  \ of a\nparent `Class.BasePart`. The affected face is dependent on the\n`Class.Texture.Face|Face`\
  \ property. Unlike `Class.Decal|Decals`, the texture\napplied by a `Class.Texture`\
  \ will repeat when the parent `Class.BasePart` is\nresized, with the size of the\
  \ repeating textures determined by the\n`Class.Texture.StudsPerTileU|StudsPerTileU`\
  \ and\n`Class.Texture.StudsPerTileV|StudsPerTileV` properties.\n\nThe applied image\
  \ texture is determined by its\n`Class.Texture.ColorMapContent|ColorMapContent`\
  \ property. For details on how\nto upload images, see\n[asset management](../../../projects/assets/index.md#asset-management).\n\
  \nUse the inherited `Class.Decal.ResampleMode|ResampleMode` property to choose\n\
  between smooth and pixelated filtering for the repeating texture maps.\n\nFor more\
  \ information, review\n[textures and decals](../../../parts/textures-decals.md).\
  \ See also:\n\n- `Class.Decal` for non-repeating surface images.\n- `Class.MeshPart.TextureContent`\
  \ to apply an image texture to a\n  `Class.MeshPart`.\n- `Class.SurfaceGui` to apply\
  \ an `Class.ImageLabel` or `Class.ImageButton` to\n  an in-experience 3D object.\n"
