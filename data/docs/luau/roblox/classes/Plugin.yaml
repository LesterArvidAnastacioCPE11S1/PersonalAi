  description: "Stores a given value for later use under the given key. The value\
    \ will\npersist even after Roblox Studio is closed. These settings are saved in\n\
    `.json` format as a map with string keys. Arrays are automatically\nconverted\
    \ to maps by converting the numeric keys to strings first.\n\nNote that the `.json`\
    \ format imposes additional restrictions, including\nthe following characters\
    \ which can corrupt the settings file:\n\n- Backslashes (`\\`) in keys or values,\
    \ in particular escaped quotes\n  (`\\\"`).\n- Newlines (`\\n`) in keys.\n- Quotes\
    \ (`\"`) in keys.\n- Periods (`.`) in keys.\n\nThis call can silently fail if\
    \ multiple instances of the same plugin are\nactively reading and writing data.\
    \ If your plugin expects to write to\nsettings frequently, you may check that\
    \ the data has been properly written\nby calling `Class.Plugin:GetSetting()|GetSetting()`.\n"
