methods:
- name: Plugin:Activate
  summary: 'Sets the state of the calling plugin to activated.

    '
  description: "This method sets the state of the calling plugin to activated. Activating\n\
    the plugin allows mouse control through the\n`Class.Plugin:GetMouse()|GetMouse()`\
    \ method.\n\nAt any given time, there are either 0 or 1 activated plugins. Activating\
    \ a\nplugin will deactivate all other plugins and they will receive a\n`Class.Plugin.Deactivation|Deactivation`\
    \ event.\n\n#### See Also\n\n- `Class.Plugin:IsActivatedWithExclusiveMouse()|IsActivatedWithExclusiveMouse()`\n\
    \  which returns `true` if the plugin is currently active with an exclusive\n\
    \  mouse, after having been activated via this method.\n- `Class.Plugin.Unloading|Unloading`\
    \ which fires immediately before the\n  plugin is unloaded or reloaded via uninstallation,\
    \ deactivation, or\n  updating.\n"
  code_samples: []
  parameters:
  - name: exclusiveMouse
    type: boolean
    default: null
    summary: 'A boolean specifying whether to activate the plugin with exclusive

      mouse. If `true`, a `Class.PluginMouse` can be retrieved via

      `Class.Plugin:GetMouse()|GetMouse()`.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
