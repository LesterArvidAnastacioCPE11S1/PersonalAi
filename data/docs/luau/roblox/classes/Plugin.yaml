- name: Plugin:ImportFbxAnimation
  summary: 'Prompts the user to open a `.fbx` animation file that can be loaded onto

    the `rigModel`, then proceeds to insert the animation as a

    `Class.KeyframeSequence` in the `Class.Workspace`.

    '
  description: 'This method prompts the user to open a `.fbx` animation file that
    can be

    loaded onto the `rigModel`, then proceeds to insert the animation as a

    `Class.KeyframeSequence` named "ImportedAnimation" in the

    `Class.Workspace`. The `isR15` parameter determines whether the file is

    interpreted as an R15 rig and defaults to `true`.


    Returns the resulting `Class.KeyframeSequence` instance. Errors if

    `rigModel` is `nil` or if the user cancels the file dialog without

    selecting a file.

    '
  code_samples: []
  parameters:
  - name: rigModel
    type: Instance
    default: null
    summary: 'The rig model that the imported animation will be applied to.

      '
  - name: isR15
    type: boolean
    default: true
    summary: 'Whether the animation file should be interpreted as an R15 rig.

      Defaults to `true`.

      '
  returns:
  - type: Instance
    summary: 'The imported `Class.KeyframeSequence` instance inserted into the

      `Class.Workspace`.

