- name: Plugin:StartDrag
  summary: 'Starts a drag action given a dictionary of parameters.

    '
  description: "This method initiates a drag action using a dictionary of parameters.\
    \ The\nparameters are as follows:\n\n<table>\n    <thead>\n        <tr>\n    \
    \        <th>Name</th>\n            <th>Type</th>\n            <th>Default</th>\n\
    \            <th>Description</th>\n        </tr>\n    </thead>\n    <tbody>\n\
    \      <tr>\n        <td><code>Sender</code></td>\n        <td>string</td>\n \
    \       <td><code>\"\"</code></td>\n        <td>\n            Identifies the source\
    \ of the drag action to the drop target\n        </td>\n        </tr>\n      \
    \  <tr>\n        <td><code>MimeType</code></td>\n        <td>string</td>\n   \
    \     <td><code>\"\"</code></td>\n        <td>\n            The MIME type of <code>Data</code>.\n\
    \        </td>\n        </tr>\n        <tr>\n        <td><code>Data</code></td>\n\
    \        <td>string</td>\n        <td><code>\"\"</code></td>\n        <td>\n \
    \           Information about the drag action, for example what is being dragged.\
    \ Should be used by the drop target.\n        </td>\n        </tr>\n        <tr>\n\
    \        <td><code>MouseIcon</code></td>\n        <td><code>Datatype.Content</code></td>\n\
    \        <td><code>\"\"</code></td>\n        <td>\n            The icon to use\
    \ for the mouse cursor during the drag. If empty, uses the default cursor.\n \
    \       </td>\n        </tr>\n        <tr>\n        <td><code>DragIcon</code></td>\n\
    \        <td><code>Datatype.Content</code></td>\n        <td><code>\"\"</code></td>\n\
    \        <td>\n        \tAn image to render under the mouse cursor during the\
    \ drag. This should represent the item being dragged.\n        </td>\n       \
    \ </tr>\n        <tr>\n        <td><code>HotSpot</code></td>\n        <td><code>Datatype.Vector2</code></td>\n\
    \        <td><code>Datatype.Vector2.new(0, 0)</code></td>\n        <td>\n    \
    \    \tThe pixel offset from the top-left where the cursor should \"hold\" the\
    \ <code>DragIcon</code>.\n        </td>\n        </tr>\n    </tbody>\n</table>\n\
    \nSee also `Class.PluginGui.PluginDragEntered`,\n`Class.PluginGui.PluginDragMoved`,\
    \ `Class.PluginGui.PluginDragDropped`,\nand `Class.PluginGui.PluginDragLeft`.\n"
  code_samples:
