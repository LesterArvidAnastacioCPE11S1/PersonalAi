events:
- name: Plugin.Deactivation
  summary: 'Fired when the plugin is deactivated.

    '
  description: 'Fired when the `Class.Plugin` is deactivated. This occurs when either
    the

    plugin code calls `Class.Plugin:Deactivate()|Deactivate()`, or because

    some other plugin called `Class.Plugin:Activate()|Activate()`, which

    forces all other plugins to lose their active state.


    See also `Class.Plugin.Unloading|Unloading` which fires immediately before

    the plugin is unloaded or reloaded via uninstallation, deactivation, or

    updating.

    '
  code_samples: []
  parameters: []
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  capabilities: []
- name: Plugin.Unloading
  summary: 'Fires immediately before the `Class.Plugin` stops running.

    '
  description: 'This event fires immediately before the `Class.Plugin` stops running.

    Plugins are unloaded when disabled, uninstalled, about to be updated, or

    when the place is closing.


    It enables a plugin to clean up after itself before its scripts stop

    running, e.g. to remove unnecessary instances from the `Class.DataModel`.

    If a plugin does not clean up properly, the old copies will remain. When

    this occurs, users may be forced to close and reopen the place which is a

    bad user experience.


    Plugin-related instances such as

    `Class.PluginToolbarButton|PluginToolbarButtons`,

    `Class.DockWidgetPluginGui|DockWidgetPluginGuis`, and

    `Class.PluginGui|PluginGuis` are automatically cleaned up when the plugin

    is unloaded so there is no need to remove them.

    '
  code_samples: []
  parameters: []
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  capabilities: []
