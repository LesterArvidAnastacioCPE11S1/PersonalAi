methods:
- name: SoundService:GetListener
  summary: 'Returns the current listener type used by `Class.Sound|Sounds`, as well
    as

    what that listener is currently set to.

    '
  description: 'Returns the current listener type used by `Class.Sound|Sounds` and
    what

    object or position that listener is currently set to. This is the point

    from which `Class.Sound` audio in the experience is heard by the player.

    By default, the listener is set to `Class.Workspace.CurrentCamera`. The

    listener can be changed using

    `Class.SoundService:SetListener()|SetListener()`.


    Note that this does not affect the listener location when using the

    advanced audio system. See `Class.AudioListener` for a way to set the

    listener location in that system.

    '
  code_samples: []
  parameters: []
  returns:
  - type: Tuple
    summary: "A table containing two results. The first result is the listener's\n\
      `Enum.ListenerType` and the second result is dependent on that type:\n\n<table>\n\
      \      <thead>\n\t  <tr>\n\t      <th>Listener Type</th>\n\t      <th>Description</th>\n\
      \t  </tr>\n      </thead>\n      <tbody>\n\t  <tr>\n\t      <td><code>Enum.ListenerType.Camera</code></td>\n\
      \t      <td>Does not return a listener object as <code>Class.Workspace.CurrentCamera|CurrentCamera</code>\
      \ is always used.</td>\n\t  </tr>\n\t  <tr>\n\t      <td><code>Enum.ListenerType.CFrame</code></td>\n\
      \t      <td>Returns the <code>Datatype.CFrame</code> used in <code>Class.SoundService:SetListener()|SetListener()</code>.</td>\n\
      \t  </tr>\n\t  <tr>\n\t      <td><code>Enum.ListenerType.ObjectPosition</code></td>\n\
      \t      <td>Returns the <code>Class.BasePart</code> used in <code>Class.SoundService:SetListener()|SetListener()</code>.</td>\n\
      \t  </tr>\n\t  <tr>\n\t      <td><code>Enum.ListenerType.ObjectCFrame</code></td>\n\
      \t      <td>Returns the <code>Class.BasePart</code> used in <code>Class.SoundService:SetListener()|SetListener()</code>.</td>\n\
      \t  </tr>\n      </tbody>\n</table>\n"
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Audio
- name: SoundService:GetMixerTime
  summary: 'Returns a number in seconds which increases as the audio engine mixes.

    '
  description: 'Returns a number in seconds that increases as the audio engine produces

    output. Because this clock is derived from the number of audio samples the

    mixer has processed, it is stable, sample-accurate, and monotonically

    increasing, which makes it suitable for scheduling audible changes at

    precise moments.


    Use this value as the basis for the `atTime` argument of methods that

    support scheduling playback to begin or end at an exact point in the

    future, such as `Class.AudioPlayer:Play()|Play()` and

    `Class.AudioPlayer:Stop()|Stop()`. Those methods expect times derived from

