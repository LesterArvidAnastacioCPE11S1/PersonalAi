- name: SoundService.ListenerType
  summary: 'The current listener type used by 3D `Class.Sound|Sounds` to determine

    where they will be heard from.

    '
  description: 'The listener type for any 3D `Class.Sound|Sounds` in the experience,

    effectively the point from which 3D `Class.Sound` audio in the experience

    is heard by the player. For `Class.Sound|Sounds` parented to a

    `Class.BasePart` or `Class.Attachment`, the listener influences the volume

    and left/right balance of a playing sound. By default, this listener is

    set to `Class.Workspace.CurrentCamera`.


    Note that this does not affect the listener location when using the

    advanced audio system; see `Class.AudioListener` for a way to set the

    listener location within that system.


    This property may not yet be enabled for all creators. Until full rollout,

    use `Class.SoundService:GetListener()` and

    `Class.SoundService:SetListener()` instead.

    '
