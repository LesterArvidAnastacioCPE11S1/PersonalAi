name: TerrainRegion
type: class
memory_category: Instances
summary: 'An object that stores a chunk of terrain voxel data, produced by

  `Class.Terrain:CopyRegion()` and consumed by `Class.Terrain:PasteRegion()`.

  '
description: 'A TerrainRegion is a snapshot of `Class.Terrain` retrieved from the

  `Class.Terrain:CopyRegion()` method. Can be later pasted into the Terrain

  using `Class.Terrain:PasteRegion()`.

  '
