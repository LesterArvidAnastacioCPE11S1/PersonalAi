- name: TerrainRegion.SizeInCells
  summary: 'The size of this TerrainRegion in cells.

    '
  description: 'Returns a `Datatype.Vector3` whose components indicate the number
    of

    terrain cells along each axis of the stored region. Each terrain cell

    occupies 4 studs in world space, so multiplying by 4 gives the region''s

    world-space dimensions. The value is set when the region is captured by

    `Class.Terrain:CopyRegion()` and cannot be changed afterward.

    '
