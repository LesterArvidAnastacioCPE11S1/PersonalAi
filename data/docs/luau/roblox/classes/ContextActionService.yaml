methods:
- name: ContextActionService:BindAction
  summary: 'Bind user input to an action given an action handling function.

    '
  description: "Bind an action to user input given an action handling function. Upon\
    \ a\nmatching input being performed, the action handler function will be called\n\
    with the arguments listed below. Valid input enum items include those\nwithin\
    \ the following: `Enum.KeyCode`, `Enum.UserInputType` or\n`Enum.PlayerActions`\
    \ . Call this function when a player **enters the\ncontext** in which an action\
    \ can be performed. When the player leaves the\ncontext, call `Class.ContextActionService:UnbindAction()|UnbindAction()`\n\
    with the same `actionName`.\n\nThe code sample below shows how a `Class.Sound`\
    \ can be\n`Class.Sound:Play()|played` while a key (<kbd>H</kbd>), game pad button,\n\
    or touch screen button is pressed.\n\n```lua\nlocal ContextActionService = game:GetService(\"\
    ContextActionService\")\n\n-- A car horn sound\nlocal honkSound = Instance.new(\"\
    Sound\", workspace)\nhonkSound.Looped = true\nhonkSound.SoundId = \"rbxassetid://9120386436\"\
    \n\nlocal function handleAction(actionName, inputState, inputObject)\n\tif actionName\
    \ == \"HonkHorn\" then\n\t\tif inputState == Enum.UserInputState.Begin then\n\t\
    \t\thonkSound:Play()\n\t\telse\n\t\t\thonkSound:Pause()\n\t\tend\n\tend\nend\n\
    \n-- When the player sits in the vehicle:\nContextActionService:BindAction(\"\
    HonkHorn\", handleAction, true, Enum.KeyCode.H, Enum.KeyCode.ButtonY)\n\n-- When\
    \ the player gets out:\nContextActionService:UnbindAction(\"HonkHorn\")\n```\n\
    \n#### Action Handler Parameters\n\nThe action handler functions are called with\
    \ the following parameters:\n\n<table>\n<tr>\n  <th>#</th>\n  <th>Type</th>\n\
    \  <th>Description</th>\n</tr>\n<tr>\n  <td>1</td>\n  <td><code>string</code></td>\n\
    \  <td>The same string that was originally passed to <code>Class.ContextActionService:BindAction()|BindAction()</code>.\n\
    \  This allows one function to handle multiple actions at once, if necessary.</td>\n\
    </tr>\n<tr>\n  <td>2</td>\n  <td><code>Enum.UserInputState</code></td>\n  <td>The\
    \ state of the input. <code>Enum.UserInputState|Cancel</code> is sent\n  if some\
    \ input was in progress and another action bound over that in-progress\n  input,\
    \ or if the in-progress bound action was unbound through <code>Class.ContextActionService:UnbindAction()|UnbindAction()</code>.</td>\n\
    </tr>\n<tr>\n  <td>3</td>\n  <td><code>InputObject</code></td>\n  <td>An object\
    \ that contains information about the input (varies based on\n  <code>Enum.UserInputType</code>).\
    \ The <code>Class.InputObject</code> sometimes won't match the inputs the action\n\
    \  was bound to: when the <code>Enum.UserInputState|Cancel</code> state is sent,\
    \ this object will be\n  <code>Enum.KeyCode.Unknown</code> and <code>Enum.UserInputType.None</code>.</td>\n\
    </tr>\n</table>\n\n#### Action Bindings Stack\n\nAction bindings behave like a\
    \ stack: if two actions are bound to the same\nuser input, the **most recently\
    \ bound** action handler will be used. If an\naction handler returns `Enum.ContextActionResult.Pass`,\
    \ the next most\nrecently bound action handler will be called, and so on until\
    \ a handler\nsinks the input (by returning `nil` or `Enum.ContextActionResult.Sink`).\n\
    When `Class.ContextActionService:UnbindAction()|UnbindAction` is called,\nthe\
    \ action handler is removed from the stack. This stack behavior can be\noverridden\
    \ using\n`Class.ContextActionService:BindActionAtPriority()|BindActionAtPriority`,\n\
    where an additional priority parameter after `createTouchButton` may\noverride\
    \ the order in which actions are bound (higher before lower).\n\n#### Touch Buttons\n\
    \nIn addition to input types, this function's third parameter controls\nwhether\
    \ a button is created for\n`Class.UserInputService.TouchEnabled|TouchEnabled`\
    \ devices. Upon the first\ntouch button's creation, a `Class.ScreenGui` named\
    \ \"ContextActionGui\" is\nadded to the `Class.PlayerGui`. Inside the ScreenGui\
    \ is a `Class.Frame`\ncalled \"ContextButtonFrame\" is added. It is in this frame\
    \ in which\n`Class.ImageButton|ImageButtons` for bound actions are parented; you\
    \ can\nuse `Class.ContextActionService:GetButton()|GetButton()` to retrieve such\n\
    buttons for customization. A maximum of 7 touch buttons can be created\nthrough\
    \ `Class.ContextActionService:BindAction()|BindAction()`.\n"
  code_samples:
  - ContextActionService-Tool-Reload
  - General-Action-Handler
  - Stacked-Action-Handlers
