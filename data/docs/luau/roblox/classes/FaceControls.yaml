name: FaceControls
type: class
memory_category: Animation
summary: 'The `Class.FaceControls` object defines a set of properties for controlling

  the facial expressions of a Dynamic Head.

  '
description: "The `Class.FaceControls` object defines a set of properties for controlling\n\
  the facial expressions of a character head capable of animation.\n\nThe FaceControls\
  \ properties are based on the Facial Action Coding System\n(FACS), a comprehensive\
  \ system for describing all visually discernible facial\nmovement based on anatomy.\
  \ `Class.FaceControls` properties can only be set\nbetween 0 and 1. Different combinations\
  \ of the `Class.FaceControls` property\nvalues create different facial expressions.\
  \ Recording multiple facial\nexpressions over time creates facial animation.\n\n\
  ## What is an Animatable Head?\n\nAn animatable head is a `Class.MeshPart` that\
  \ implements a facial rig and is\ncapable of playing facial animations and triggering\
  \ facial expressions. A\n`Class.FaceControls` object that is a child of a head `Class.MeshPart`\
  \ can\nchange the facial expressions of the head.\n\nA head consists of the following\
  \ three components:\n\n- Skinned MeshPart instance for the head geometry with an\
  \ internal rig that\n  deforms this skinned MeshPart\n- FaceControls instance that\
  \ drives the internal rig when properties such as\n  FaceControls.JawDrop are changed.\n\
  - Cage `Class.WrapTarget` instance for tight fitting facial accessories\n\nIn a\
  \ third-party modeling tool, such as Blender or Maya, an artist can create\na joint-driven\
  \ facial rig, pose the joints to match each of the individual\nFACS controls, and\
  \ save as an FBX. When a head `.FBX` is imported in Studio, a\nfacs-to-joint mapping\
  \ is created. This mapping deforms the mesh geometry when\nFaceControls properties\
  \ are changed. The mapping and the facial rig (including\n`Class.Bone` instances)\
  \ are not exposed to developers and can only be accessed\nthrough the FaceControls\
  \ instance. The `Class.MeshPart` for a Dynamic Head\nlooks and behaves the same\
  \ as a regular `Class.MeshPart` except when a\nFaceControls instance is a child\
  \ of the MeshPart. Editing the properties of\nthe FaceControls deforms the MeshPart's\
  \ geometry. These properties are\navailable to animate in the Animation Editor.\n\
  \nSee [Facial animation](../../../avatar/dynamic-heads/index.md) for more\ninformation\
  \ on usage and creation of an animatable head.\n\n## Animatable Heads in the Marketplace\n\
  \nIf you are publishing your head to the Marketplace, your head asset must\ninclude\
  \ a minimum subset of face controls. Roblox's publishing validation\nrejects assets\
  \ without the following required poses:\n\n- EyesLookDown\n- EyesLookLeft\n- EyesLookRight\n\
  - EyesLookUp\n- JawDrop\n- LeftEyeClosed\n- LeftLipCornerPuller\n- LeftLipStretcher\n\
  - LeftLowerLipDepressor\n- LeftUpperLipRaiser\n- LipsTogether\n- Pucker\n- RightEyeClosed\n\
  - RightLipCornerPuller\n- RightLipStretcher\n- RightLowerLipDepressor\n- RightUpperLipRaiser\n\
  \nSee\n[FACS poses reference](../../../avatar/dynamic-heads/facs-poses-reference.md)\n\
  for more information on usage and creation of an animatable head.\n"
