name: InputActionLabel
type: class
memory_category: Gui
summary: 'A `Class.GuiObject` that automatically displays the keybinding for an action

  as text or an image.

  '
description: "`InputActionLabel` is a drag-and-drop `Class.GuiObject` that automatically\n\
  shows the appropriate key or icon for an `Class.InputAction` based on the\nplayer's\
  \ current input device (keyboard/mouse, gamepad, touch, VR). When the\nplayer switches\
  \ devices or the binding is rebound, the label updates instantly\nwithout scripting.\n\
  \nRendering of the `InputActionLabel` depends on the `Class.InputAction` (linked\n\
  through `Class.InputActionLabel.InputAction`) and that action's child\n`Class.InputBinding|InputBindings`.\
  \ As the label resolves what to show, it\nfollows this order:\n\n1. **Custom Images**\
  \ — If child `Class.InputBinding|InputBindings` have their\n   `Class.InputBinding.DisplayImage|DisplayImage`\
  \ property set, the label\n   renders those images directly, optionally modified\
  \ by\n   `Class.InputActionLabel.ImageColor3|ImageColor3` and\n   `Class.InputActionLabel.ImageTransparency|ImageTransparency`.\n\
  \n2. **Platform Key Images** — Lacking custom images, the label renders\n   platform-provided\
  \ images for child `Class.InputBinding|InputBindings`\n   through `Class.UserInputService:GetImageForKeyCode()`,\
  \ if such images are\n   available. Composite bindings with modifiers show multiple\
  \ icons with `+`\n   separators.\n\n3. **Custom Names** — Lacking available images,\
  \ if child\n   `Class.InputBinding|InputBindings` have their\n   `Class.InputBinding.DisplayName|DisplayName`\
  \ property set, the label\n   renders that text in a style defined by\n   `Class.InputActionLabel.FontFace|FontFace`,\n\
  \   `Class.InputActionLabel.TextColor3|TextColor3`,\n   `Class.InputActionLabel.TextSize|TextSize`,\n\
  \   `Class.InputActionLabel.TextTransparency|TextTransparency`,\n   `Class.InputActionLabel.TextWrapped|TextWrapped`,\n\
  \   `Class.InputActionLabel.TextXAlignment|TextXAlignment`, and\n   `Class.InputActionLabel.TextYAlignment|TextYAlignment`.\n\
  \n4. **Platform Key Strings** — Lacking all of the above, the label renders\n  \
  \ platform-provided strings through\n   `Class.UserInputService:GetStringForKeyCode()`.\n\
  \n5. If no `Class.InputAction` is assigned or no child `Class.InputBinding`\n  \
  \ exists, the label renders a placeholder icon.\n"
