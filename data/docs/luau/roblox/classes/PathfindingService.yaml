- name: PathfindingService:CreatePath
  summary: 'Creates a `Class.Path` object based on the given agent parameters.

    '
  description: "Creates a `Class.Path` object based on various agent parameters. Valid\n\
    keys and values in the `agentParameters` table are as follows:\n\n<table>\n  \
    \  <thead>\n        <tr>\n            <th>Key</th>\n            <th>Type</th>\n\
    \            <th>Default</th>\n            <th>Description</th>\n        </tr>\n\
    \    </thead>\n    <tbody>\n        <tr>\n            <td><code>AgentRadius</code></td>\n\
    \            <td>integer</td>\n            <td><code>2</code></td>\n         \
    \   <td>Determines the minimum amount of horizontal space required\n         \
    \   for empty space to be considered traversable.</td>\n        </tr>\n      \
    \  <tr>\n            <td><code>AgentHeight</code></td>\n            <td>integer</td>\n\
    \            <td><code>5</code></td>\n            <td>Determines the minimum amount\
    \ of vertical space required\n            for empty space to be considered traversable.</td>\n\
    \        </tr>\n        <tr>\n            <td><code>AgentCanJump</code></td>\n\
    \            <td>boolean</td>\n            <td><code>true</code></td>\n      \
    \      <td>Determines whether jumping during pathfinding is\n            allowed.</td>\n\
    \        </tr>\n        <tr>\n            <td><code>AgentCanClimb</code></td>\n\
    \            <td>boolean</td>\n            <td><code>false</code></td>\n     \
    \       <td>Determines whether climbing <code>Class.TrussPart|TrussParts</code>\n\
    \            during pathfinding is allowed.</td>\n        </tr>\n        <tr>\n\
    \            <td><code>WaypointSpacing</code></td>\n            <td>number</td>\n\
    \            <td>4</td>\n            <td>Determines the spacing between intermediate\
    \ waypoints in\n            path.</td>\n        </tr>\n        <tr>\n        \
    \    <td><code>Costs</code></td>\n            <td>table</td>\n            <td><code>{}</code></td>\n\
    \            <td>Table of materials or defined\n            <code>Class.PathfindingModifier|PathfindingModifiers</code>\
    \ and their\n            \"cost\" for traversal. Useful for making the agent prefer\n\
    \            certain materials/regions over others.</td>\n        </tr>\n    </tbody>\n\
    </table>\n"
  code_samples:
  - pathfinding---creating-path-with-params
  parameters:
