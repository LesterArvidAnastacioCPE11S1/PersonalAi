- name: GeometryService:SplitApartAsync
  summary: 'Splits each `Class.PartOperation` or `Class.MeshPart` into one part per

    disconnected solid region.

    '
  description: 'Splits each input into disconnected solid regions. `Class.MeshPart`
    inputs

    produce `Class.MeshPart` pieces; `Class.PartOperation` inputs produce

    `Class.PartOperation` pieces. When history is preserved in Studio, pieces

    split from a `Class.UnionOperation` or `Class.IntersectOperation` are

    `Class.UnionOperation|UnionOperations` that keep the input as their

    history, so Separate restores it. Like

    `Class.GeometryService:UnionAsync()|UnionAsync()` with `SplitApart`,

    normalization may drop degenerate slivers.


    The inputs are unchanged, and returned parts have no set

    `Class.Instance.Parent|Parent`.


    For more information and detailed examples, see

    https://create.roblox.com/docs/parts/solid-modeling#in-experience-solid-modeling.

    '
  code_samples:
  - GeometryService-SplitApartAsync
  parameters:
  - name: parts
    type: Array
    default: null
    summary: 'Array of `Class.PartOperation` and `Class.MeshPart` instances to split

      independently. `Class.NegateOperation` is not supported.

      '
  - name: options
    type: Dictionary
    default: nil
    summary: "Options table containing all the controls for the method:\n\n- `CollisionFidelity`\
      \ — The value of\n  `Class.TriangleMeshPart.CollisionFidelity|CollisionFidelity`\
      \ in the\n  resulting parts.\n- `RenderFidelity` — The value of\n  `Class.PartOperation.RenderFidelity|RenderFidelity`\
      \ or\n  `Class.MeshPart.RenderFidelity|RenderFidelity` in the resulting\n  parts.\n\
      - `FluidFidelity` — The value of\n  `Class.TriangleMeshPart.FluidFidelity|FluidFidelity`\
      \ in the\n  resulting parts.\n- `UseOffCenterCoordinates` — Boolean, default\
      \ `true`. Keeps each\n  input's `Class.BasePart.CFrame|CFrame` for its pieces;\
      \ `false`\n  centers each piece's frame on its geometry.\n"
  returns:
  - type: Array
    summary: 'Array of dictionaries `{ “Instance”: instance, “Index”: index }`,

      where `Index` is the 1-based position of the source input in `parts`.

      Inputs with a single connected solid produce no entries.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - CSG
- name: GeometryService:SweepPartAsync
  summary: 'Creates a `Class.MeshPart` which has the shape of the input part

    stretched/dragged through the given set of `CFrame` positions.

    '
  description: 'Creates a `Class.MeshPart` which has the shape of the input part

    stretched/dragged through the given set of `CFrame` positions. The exact

    shape of the result is defined as the union of the convex hulls of each

    adjacent pair of `CFrames`.


    If a single `CFrame` is provided, the result will be a convex hull of the

    input part.


    For more information and detailed examples, see

    https://create.roblox.com/docs/parts/solid-modeling#in-experience-solid-modeling.

    '
  code_samples:
  - GeometryService-SweepPartAsync
  parameters:
  - name: part
    type: BasePart
    default: null
    summary: 'A `Class.Part`, `Class.PartOperation`, or `Class.MeshPart` to operate

      on.

      '
  - name: cframes
    type: Array
    default: null
    summary: 'Array of coordinate frames to sweep parts through.

      '
  - name: options
    type: Dictionary
    default: nil
    summary: "Options table containing all the controls for the method:\n\n- `CollisionFidelity`\
      \ — The value of\n  `Class.TriangleMeshPart.CollisionFidelity|CollisionFidelity`\
      \ in the\n  resulting parts.\n- `RenderFidelity` — The value of\n  `Class.MeshPart.RenderFidelity|RenderFidelity`\
      \ in the resulting\n  parts.\n- `FluidFidelity` — The value of\n  `Class.TriangleMeshPart.FluidFidelity|FluidFidelity`\
      \ in the\n  resulting parts.\n"
  returns:
  - type: MeshPart
    summary: 'A new `Class.MeshPart` with the swept geometry.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - CSG
