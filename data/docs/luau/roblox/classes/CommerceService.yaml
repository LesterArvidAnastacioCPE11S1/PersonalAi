- name: CommerceService:GetCommerceProductInfoAsync
  summary: 'Retrieves information about the commerce products you are selling in

    experience.

    '
  description: "Retrieves information about the products that you are selling and\
    \ surface\nthem within your experience. How you surface products to your users\
    \ is\nentirely up to you.\n\n<table><thead>\n  <tr>\n    <th>Name</th>\n    <th>string</th>\n\
    \    <th>Localized name of of the physical item</th>\n  </tr></thead>\n<tbody>\n\
    \  <tr>\n    <td>Description</td>\n    <td>string</td>\n    <td>Localized description\
    \ of the physical item</td>\n  </tr>\n  <tr>\n    <td>IconImageAssetId</td>\n\
    \    <td>number</td>\n    <td>The image asset ID of main default image of the\
    \ physical item</td>\n  </tr>\n  <tr>\n    <td>DisplayPrice</td>\n    <td>string</td>\n\
    \    <td>Localized price string with currency symbol of the physical item. e.g.\
    \ “$4.99“</td>\n  </tr>\n  <tr>\n    <td>IsPurchasable</td>\n    <td>bool</td>\n\
    \    <td>If the item can be added to a merchant checkout session, i.e. item is\
    \ in stock, or can be backordered</td>\n  </tr>\n</tbody>\n</table>\n"
  code_samples: []
  parameters:
  - name: commerceProductId
    type: string
    default: null
    summary: 'The identifier of the commerce product to look up, either the numeric

      ID or the full `COM-`-prefixed form.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary of information about the commerce product, including

      whether it `IsForSale`, an `Item` sub-table of display details

      (`Name`, `Description`, `IconImageAssetId`, `DisplayPrice`, and

      `IsPurchasable`), and the `Benefits` granted by purchasing it.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
