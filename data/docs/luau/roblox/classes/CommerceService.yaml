- name: CommerceService:PromptRealWorldCommerceBrowser
  summary: 'Legacy endpoint that opens an in-experience browser to a real-world

    commerce URL for the specified player; superseded by

    `Class.CommerceService:PromptCommerceProductPurchase()`.

    '
  description: 'This is a legacy endpoint that is not meant for use. To open the webview

    to the purchasing flow for real world commerce, see

    `Class.CommerceService:PromptCommerceProductPurchase`. For more

    information, see

    [Commerce products](../../../production/monetization/commerce-products.md)

    '
  code_samples: []
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` for whom the browser opens. When called from a

      client script, this must be the local player.

      '
  - name: url
    type: string
    default: null
    summary: 'The real-world commerce URL to open. The URL must be on the commerce

      allowlist, or the request is ignored.

      '
