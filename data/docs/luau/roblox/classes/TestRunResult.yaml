- name: TestRunResult.Status
  summary: 'The outcome of the whole run.

    '
  description: "The outcome of the whole run:\n\n- `Enum.TestRunStatus.Pass` if at\
    \ least one test passed and none failed or\n  timed out.\n- `Enum.TestRunStatus.Fail`\
    \ if any test failed or timed out.\n- `Enum.TestRunStatus.Skipped` if tests matched\
    \ the filter but every one\n  was skipped.\n- `Enum.TestRunStatus.NoTests` if\
    \ no test was registered or matched the\n  filter.\n\nTo decide whether a run\
    \ passed, compare\n`Class.TestRunResult.Status|Status` with `Enum.TestRunStatus.Pass`.\n\
    Statuses may be added later, so don't treat everything other than\n`Enum.TestRunStatus.Fail`\
    \ as a pass.\n"
