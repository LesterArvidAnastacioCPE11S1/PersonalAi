  summary: 'A one-line description of the run''s results.

    '
  description: 'A one-line description of the run for people to read, such as

    `3 passed, 1 failed, 0 skipped (4 total) in 812ms`. It''s also printed to

    the **Output** window when the run ends. Its wording may change, so read

    the counts from `Class.TestRunResult.Passed|Passed`,

    `Class.TestRunResult.Failed|Failed`,

    `Class.TestRunResult.Skipped|Skipped`, and

    `Class.TestRunResult.Total|Total` rather than parsing it.

