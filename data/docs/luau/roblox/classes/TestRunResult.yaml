name: TestRunResult
type: class
memory_category: Instances
summary: 'The outcome of a test run started by `Class.TestService:RunTestsAsync()`.

  '
description: "A `TestRunResult` is returned by `Class.TestService:RunTestsAsync()`\
  \ when a\nrun finishes. `Class.TestRunResult.Status|Status` is the outcome of the\
  \ whole\nrun, the counts say how many tests ended each way, and\n`Class.TestRunResult:GetTests()|GetTests()`\
  \ returns a `Class.TestResult` for\neach test.\n\nA `TestRunResult` isn't an `Class.Instance`\
  \ and can't be parented.\n\n```lua\nlocal TestService = game:GetService(\"TestService\"\
  )\n\nlocal result = TestService:RunTestsAsync()\nprint(result.Summary)\nif result.Status\
  \ ~= Enum.TestRunStatus.Pass then\n\tfor _, test in result:GetTests() do\n\t\tif\
  \ test.Status ~= Enum.TestCaseStatus.Pass and test.Status ~= Enum.TestCaseStatus.Skipped\
  \ then\n\t\t\twarn(`{test.TestId}: {test.Status.Name}`)\n\t\tend\n\tend\nend\n```\n"
