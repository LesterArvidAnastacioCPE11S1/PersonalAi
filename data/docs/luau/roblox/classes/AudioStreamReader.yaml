- name: AudioStreamReader:Peek
  summary: 'Reads audio samples from the internal buffer without consuming them.

    '
  description: 'Reads audio samples from the internal buffer without consuming them.

    Unlike `Class.AudioStreamReader:Read|Read()`, peeked samples remain in the

    buffer and will be returned again on subsequent calls. This is useful for

    overlapping analysis windows. The number of buffers in the array must

    match the number of channels specified by

    `Class.AudioStreamReader.Layout|Layout`. Returns the number of frames

    actually written, which may be less than the buffer length if insufficient

    data is available.

    '
  code_samples: []
  parameters:
  - name: into
    type: Array
    default: null
    summary: 'An array of buffers, one per channel, to write samples into.

      '
  returns:
  - type: int
    summary: 'The number of frames written into the buffers.

      '
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Audio
- name: AudioStreamReader:Read
  summary: 'Reads and consumes audio samples from the internal buffer.

    '
  description: 'Reads audio samples from the internal buffer and removes them, advancing

    the read position. The number of buffers in the array must match the

    number of channels specified by `Class.AudioStreamReader.Layout|Layout`.

    Returns the number of frames actually written, which may be less than the

    buffer length if insufficient data is available.

    '
  code_samples: []
