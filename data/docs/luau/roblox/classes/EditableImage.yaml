name: EditableImage
type: class
memory_category: Instances
summary: 'Object which allows for the runtime creation and manipulation of images.

  '
description: "`EditableImage` allows for the runtime creation and manipulation of\
  \ images.\n\nTo create a blank `EditableImage`, use\n`Class.AssetService:CreateEditableImage()`.\
  \ To create an `EditableImage` from\nan existing image, use `Class.AssetService:CreateEditableImageAsync()`.\n\
  \n`EditableImage` can be used in any `Datatype.Content` property which takes an\n\
  image, such as `Class.ImageLabel.ImageContent` or\n`Class.MeshPart.TextureContent`.\
  \ This is done by setting the content property\nto `Datatype.Content.fromObject(editableImage)`.\n\
  \nThe `EditableImage` coordinate system is relative to the top left of the\nimage:\n\
  \n- Top-left: `(0, 0)`\n- Bottom-right: `(Size.X - 1, Size.Y - 1)`\n\nWhen you use\
  \ `Class.AssetService:PromptCreatePlatformContentAsync()` to\npublish an object\
  \ that has a `Datatype.Content` property which references an\n`EditableImage`, the\
  \ editable image is published as an image and the property\nis set to a new asset\
  \ ID.\n\n#### Update Limitations\n\nOnly a single `EditableImage` can be updated\
  \ per frame on the display side.\nFor example, if you update three `EditableImage`\
  \ objects which are currently\nbeing displayed, it will take three frames for all\
  \ of them to be updated.\n\n#### Enabling for Published Experiences\n\nFor security\
  \ purposes, using `EditableImage` fails by default in published\ngames. To enable\
  \ it, open the\n[Creator Dashboard](https://create.roblox.com/dashboard/creations),\
  \ go to the\ngame's **Configure**&nbsp;⟩ **Settings**, and toggle on **Enable Mesh\
  \ / Image\nAPIs**. Alternatively, in Studio, open **Experience Settings** and toggle\
  \ on\n**Allow Mesh / Image APIs** under **Security**. Remember to review the\n[Terms\
  \ of Use](https://en.help.roblox.com/hc/en-us/articles/115004647846-Roblox-Terms-of-Use#creators-restrictions-on-use)\n\
  before enabling the toggle.\n\n#### Permissions\n\nTo prevent misuse, `Class.AssetService:CreateEditableImageAsync()`\
  \ only allows\nyou to load and edit image assets if any of the following is true:\n\
  \n- Owned by or explicitly shared with the experience owner.\n- Owned by or explicitly\
  \ shared with the logged in Studio user.\n- Owned by or explicitly shared with the\
  \ logged in player if the\n  `EditableImage` is on the client side.\n- Owned by\
  \ a group where the experience owner, Studio user, or player has a\n  role with\
  \ permission to edit the group's assets. See\n  [Roles and permissions](../../../projects/groups.md#roles-and-permissions)\n\
  \  for more information.\n\nSee [Grant permissions](../../../projects/assets/privacy.md#grant-permissions)\n\
  to learn how to share assets with users or groups.\n\nThe APIs throw an error if\
  \ they are used to load an asset that does not meet\nthe criteria above.\n\n####\
  \ Memory Limits\n\nEditable assets are currently expensive for memory usage. To\
  \ minimize its\nimpact on client performance, `EditableImage` has strict client-side\
  \ memory\nbudgets, although the server, Studio, and plugins operate with unlimited\n\
  memory. Linking one `Class.EditableImage` to multiple image-related\n`Datatype.Content`\
  \ data types (multi-referencing) can help with memory\noptimization.\n\nIf an `EditableImage`\
  \ no longer changes, you can save a significant amount of\nmemory budget by converting\
  \ it to `Enum.ContentSourceType|Opaque` content with\n`Class.AssetService:CreateDataModelContentAsync()`.\
  \ Use the returned\n`Datatype.Content` in place of the `EditableImage`, then call\n\
  `Class.EditableImage:Destroy()|Destroy()` to release the editable copy. To\nedit\
  \ the image again, pass the opaque content to\n`Class.AssetService:CreateEditableImageAsync()`.\n"
