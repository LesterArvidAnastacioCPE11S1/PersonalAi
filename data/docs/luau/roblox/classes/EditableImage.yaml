- name: EditableImage:DrawImageProjected
  summary: 'Projects another `EditableImage` onto a surface using an

    `Class.EditableMesh` or prepared `Class.WrapTextureTransfer` and stores

    the result on this `EditableImage`.

    '
  description: 'Projects another `EditableImage` onto the surface defined by

    `projectionSource` and stores the result on this `EditableImage` using the

    source''s UV mapping and the specified projection and brush configuration.

    `projectionSource` accepts an `Class.EditableMesh` or a

    `Class.WrapTextureTransfer`.


    When passing a `Class.WrapTextureTransfer`, first call

    `Class.WrapTextureTransfer:PrepareProjectionMeshDataAsync()` and wait for

    it to complete successfully.

    '
  code_samples: []
  parameters:
  - name: projectionSource
    type: Object
    default: null
    summary: 'The `Class.EditableMesh` or prepared `Class.WrapTextureTransfer` that

      provides the geometry and UV mapping for projection.

      '
  - name: projection
    type: Dictionary
    default: null
    summary: "Projection configuration dictionary including the following key-value\n\
      pairs:\n\n- `Direction` (`Datatype.Vector3`) where the projector is facing.\n\
      - `Position` (`Datatype.Vector3`) as the position in local space with\n  respect\
      \ to the mesh.\n- `Size` (`Datatype.Vector3`) as the size of the projector.\n\
      - `Up` (`Datatype.Vector3`) as the up vector of the projector in local\n  space\
      \ with respect to the mesh.\n"
  - name: brushConfig
    type: Dictionary
    default: null
    summary: "Brush configuration dictionary including the following key-value\npairs:\n\
      \n- `AlphaBlendType` (`Enum.ImageAlphaType`) which determines how this\n  projection\
      \ will blend alpha values.\n- `ColorBlendType` (`Enum.ImageCombineType`) which\
      \ determines how this\n  projection will blend color values.\n- `Decal` (`EditableImage`)\
      \ as the image used for projection.\n- `FadeAngle` (number) as the angle in\
      \ degrees for the projection\n  edges to start to fall off. The projection will\
      \ be fully faded out\n  at 90 degrees. An angle of 0 means fading starts immediately\
      \ at 0\n  degrees and an angle of 90 means no fading but instead a hard edge\n\
      \  at 90 degrees. An angle of 70 degrees would mean the projection\n  starts\
      \ to fade at 70 degrees and is fully faded out at 90 degrees.\n- `BlendIntensity`\
      \ (number) as the value between `0` and `1` which\n  controls how much of the\
      \ projection is blended into the resulting\n  image.\n"
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
- name: EditableImage:SampleImageProjected
  summary: 'Projects pixels from a texture into this `EditableImage` using an

    `Class.EditableMesh` or prepared `Class.WrapTextureTransfer`.

    '
  description: 'Projects the pixels in `sourceTexture`, using the geometry and UV
    mapping

    of `projectionSource`, onto this `EditableImage`. `projectionSource`

    accepts an `Class.EditableMesh` or a `Class.WrapTextureTransfer`. This is

    the inverse of

    `Class.EditableImage:DrawImageProjected()|DrawImageProjected()`: it reads

    from the mesh texture and writes the sampled pixels into this image in

    place.


    Only mesh surfaces facing the projector and within the projection volume

    are sampled. When multiple mesh surfaces project to the same destination

    pixel, the closest surface is used. This makes the method suitable for

    sampling a brush-sized region, modifying it in place, and then using

    `Class.EditableImage:DrawImageProjected()|DrawImageProjected()` to write

    it back onto a texture.


    When passing a `Class.WrapTextureTransfer`, first call

    `Class.WrapTextureTransfer:PrepareProjectionMeshDataAsync()` and wait for

    it to complete successfully.

    '
  code_samples: []
  parameters:
  - name: projectionSource
    type: Object
    default: null
    summary: 'The `Class.EditableMesh` or prepared `Class.WrapTextureTransfer` that

      maps `sourceTexture` onto the surface being sampled.

      '
  - name: sourceTexture
    type: EditableImage
    default: null
    summary: 'The `EditableImage` from which pixels are sampled.

      '
  - name: projectionConfig
    type: Dictionary
    default: null
    summary: "Projection configuration dictionary containing the following key-value\n\
      pairs:\n\n- `Direction` (`Datatype.Vector3`) where the projector is facing.\n\
      - `Position` (`Datatype.Vector3`) as the projector position in local\n  space\
      \ with respect to the mesh.\n- `Size` (`Datatype.Vector3`) as the size of the\
      \ projector. The **X**\n  and **Y** components specify its dimensions, while\
      \ the **Z**\n  component specifies the projection depth.\n- `Up` (`Datatype.Vector3`)\
      \ as the up vector of the projector in local\n  space with respect to the mesh.\n"
  - name: brushConfig
    type: Dictionary
    default: null
    summary: "Brush configuration dictionary containing the following key-value\n\
      pairs:\n\n- `AlphaBlendType` (`Enum.ImageAlphaType`) which determines how the\n\
      \  sampled alpha values are blended.\n- `ColorBlendType` (`Enum.ImageCombineType`)\
      \ which determines how the\n  sampled color values are blended.\n- `FadeAngle`\
      \ (number) as the angle in degrees at which the projection\n  begins to fade\
      \ based on the surface normal. A value of `180` applies\n  no normal-angle fade.\n"
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
- name: EditableImage:DrawImageTransformed
  summary: 'Draws an image into this `EditableImage` with transformations including

    scaling and rotation, placing it at the specified position.

    '
  description: 'This method lets you draw an `EditableImage` into this `EditableImage`

    with transformations applied, such as scaling and rotation. The position

    parameter specifies where the pivot point of the source image will be

    placed on this image after transformations. Positions outside the canvas

    bounds are allowed such that only part of the new image is drawn.

    '
  code_samples:
  - EditableImage-DrawImageTransformed
  - EditableImage-DrawImageTransformed-Crop
  parameters:
  - name: position
    type: Vector2
    default: null
    summary: 'Position in pixels where the pivot point of the source image will be

      placed on this image.

      '
  - name: scale
    type: Vector2
    default: null
    summary: 'Scaling factors for the source image along the X and Y axes.

      '
  - name: rotation
    type: float
    default: null
    summary: 'The rotation angle in degrees, applied around the pivot point of the

      source image.

      '
  - name: image
    type: EditableImage
    default: null
    summary: 'The source `EditableImage` to be drawn into this image.

      '
  - name: options
    type: Dictionary?
    default: null
    summary: "Optional dictionary for additional configuration:\n\n- `CombineType`:\
      \ Specifies how the pixels of the source image blend\n  with those of the destination.\
      \ Default is\n  `Enum.ImageCombineType.AlphaBlend`.\n- `SamplingMode`: Specifies\
      \ the sampling method (e.g. `Default` for\n  bilinear or `Pixelated` for nearest\
      \ neighbor). Default is\n  `Enum.ResamplerMode.Default`.\n- `PivotPoint`: Specifies\
      \ the pivot point within the source image for\n  scaling and rotation. Default\
      \ is the center of the source image\n  (i.e. `Image.Size / 2`).\n- `AlphaBlendType`:\
      \ Determines how this draw will blend alpha values.\n  Default is `Enum.ImageAlphaType.Default`.\n"
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
