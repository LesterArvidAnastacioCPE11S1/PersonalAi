- name: TeleportAsyncResult.PrivateServerId
  summary: 'The private server ID of the destination server that the players are being

    teleported to.

    '
  description: "The private server ID of the destination server that the players are\
    \ being\nteleported to. This field is populated when the teleport targets a private\n\
    server, including:\n\n- `Class.TeleportOptions.ReservedServerId` — The supplied\
    \ reserved server\n  ID.\n- `Class.TeleportOptions.VipServerId` — The supplied\
    \ VIP server ID.\n- `Class.TeleportOptions.ReservedServerAccessCode` (deprecated)\
    \ — The\n  destination's private server ID.\n- `Class.TeleportOptions.ShouldReserveServer`\
    \ (deprecated) — The newly\n  allocated private server ID.\n\nThis value matches\
    \ `Class.DataModel.PrivateServerId` on the destination\nserver.\n\nFor more information\
    \ on how to teleport players between servers, see\n[Teleporting Between Places](../../../projects/teleport.md).\n"
