methods:
- name: Translator:FormatByKey
  summary: 'Returns the localized text string in a `Class.LocalizationTable` based
    on

    its `Class.Translator` locale, by key.

    '
  description: "Returns the localized text string in a `Class.LocalizationTable` based\
    \ on\nits `Class.Translator` locale, by key. The optional **args** table is used\n\
    for filling format parameters in the matching text entry.\n\nNote that this method\
    \ will throw an error in the following cases:\n\n- If none of the `Class.LocalizationTable|LocalizationTables`\
    \ available to\n  this `Class.Translator` include a value for the given key.\n\
    - If the\n  [format string](../../../production/localization/translate-dynamic-content.md)\n\
    \  for the key uses numbered parameters and **args** is not an array.\n- If the\n\
    \  [format string](../../../production/localization/translate-dynamic-content.md)\n\
    \  uses named parameters and **args** is not a table of key-value pairs.\n- If\
    \ **args** is missing values for parameters that are used in the\n  matching\n\
    \  [format string](../../../production/localization/translate-dynamic-content.md).\n\
    \nSee\n[Localize with scripting](../../../production/localization/localize-with-scripting.md)\n\
    for more details and usage examples of this function.\n"
  code_samples: []
  parameters:
  - name: key
    type: string
    default: null
    summary: 'The **Key** value to look up and translate.

      '
  - name: args
    type: Variant
    default: null
    summary: 'To be provided if the **Source** text and translations contain format

      strings. Will be a Luau table of values **or** key-value pairs,

      depending on whether the format strings are numbered or named.

      '
  returns:
  - type: string
    summary: 'The localized text string associated with the given **key**, with any

      format parameters filled in from **args**.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
