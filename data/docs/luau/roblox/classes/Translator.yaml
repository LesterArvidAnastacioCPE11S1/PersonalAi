- name: Translator:Translate
  summary: 'Returns the localized text string in a `Class.LocalizationTable` based
    on

    its `Class.Translator` locale, by source lookup.

    '
  description: "Returns the localized text string in a `Class.LocalizationTable` based\
    \ on\nits `Class.Translator` locale. This string will be in the context of the\n\
    provided object, given the provided **Source** text.\n\nSee\n[Localize with scripting](../../../production/localization/localize-with-scripting.md)\n\
    for more details and usage examples of this function.\n\n#### Context Overrides\n\
    \nIn some cases, duplicate **Source** strings may have completely different\n\
    translations in other languages. For example, the English noun \"Screen\"\ncan\
    \ indicate both a computer screen and a window screen, but the Spanish\ntranslations\
    \ are completely different:\n\n<table>\n<tbody>\n    <tr>\n      <td width=\"\
    12%\">A</td>\n      <td width=\"16%\">B</td>\n      <td width=\"18%\">C</td>\n\
    \      <td width=\"12%\">D</td>\n      <td width=\"18%\">E</td>\n    </tr>\n \
    \   <tr>\n      <td>Key</td>\n      <td>Context</td>\n      <td><b>Source</b></td>\n\
    \      <td>Example</td>\n      <td><b>es</b></td>\n    </tr>\n    <tr>\n     \
    \ <td></td>\n      <td></td>\n      <td>Screen</td>\n      <td></td>\n      <td>Pantalla</td>\n\
    \    </tr>\n    <tr>\n      <td></td>\n      <td></td>\n      <td>Screen</td>\n\
    \      <td></td>\n      <td>Mosquitero</td>\n    </tr>\n    <tr>\n      <td> </td>\n\
    \      <td></td>\n      <td></td>\n      <td></td>\n      <td></td>\n    </tr>\n\
    \  </tbody>\n</table>\n\nIn these cases, the first argument to this function &mdash;\
    \ a valid\nin-game `Class.Instance` &mdash; can be used as a \"tie breaker\" when\n\
    multiple GUI objects use the same source string. To implement this,\nspecify the\
    \ \"path\" to the `Class.Instance` you'd like to override as the\n**Context**\
    \ value of the translation data:\n\n<table>\n<tbody>\n    <tr>\n      <td width=\"\
    12%\">A</td>\n      <td width=\"36%\">B</td>\n      <td width=\"18%\">C</td>\n\
    \      <td width=\"12%\">D</td>\n      <td width=\"18%\">E</td>\n    </tr>\n \
    \   <tr>\n      <td>Key</td>\n      <td><b>Context</b></td>\n      <td>Source</td>\n\
    \      <td>Example</td>\n      <td>es</td>\n    </tr>\n    <tr>\n      <td></td>\n\
    \      <td>workspace.ComputerScreen.SurfaceGui.TextLabel</td>\n      <td>Screen</td>\n\
    \      <td></td>\n      <td>Pantalla</td>\n    </tr>\n    <tr>\n      <td></td>\n\
    \      <td></td>\n      <td>Screen</td>\n      <td></td>\n      <td>Mosquitero</td>\n\
    \    </tr>\n    <tr>\n      <td> </td>\n      <td></td>\n      <td></td>\n   \
    \   <td></td>\n      <td></td>\n    </tr>\n  </tbody>\n</table>\n\nThen, when\
    \ calling this function in a script, pass the same\n`Class.Instance` as the first\
    \ argument, followed by the **Source** lookup\ntext as the second argument:\n"
  code_samples:
  - Translator-Translate
  parameters:
  - name: context
    type: Instance
    default: null
    summary: 'A valid in-game `Class.Instance` to use for context override as

      outlined above. Note that this argument can be arbitrary, for example

      `game`, if you don''t require a context override.

      '
  - name: text
    type: string
    default: null
    summary: 'The **Source** text to look up and translate.

      '
  returns:
  - type: string
    summary: 'The translated text.

      '
