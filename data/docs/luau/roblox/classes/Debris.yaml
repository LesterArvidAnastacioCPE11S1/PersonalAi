name: Debris
type: class
memory_category: Instances
summary: 'Allows scheduling the guaranteed destruction of an object without yielding.

  '
description: "The **Debris** service allows scheduling guaranteed destruction of an\
  \ object\nwithout yielding.\n\n#### Advantages\n\nBesides creating a bit of a mess,\
  \ objects that are no longer required can use\nup system memory and cause an experience\
  \ to run slower over time. For this\nreason, it's always advised to call `Class.Instance:Destroy()`\
  \ on objects you\nno longer need. In some cases, however, an object may have a specific\
  \ period\nof utility before it can be destroyed.\n\nConsider a wall being smashed\
  \ into individual bricks. If you want a brick to\nlinger for 3 seconds before being\
  \ destroyed, you can use the following code:\n\n```lua\ntask.wait(3)\nbrick:Destroy()\n\
  ```\n\nHowever, waiting causes the thread to yield which may be undesired. To avoid\n\
  yielding, a callback function can be scheduled to run on a new thread after 3\n\
  seconds:\n\n```lua\ntask.delay(3, function()\n\tbrick:Destroy()\nend)\n```\n\nOr\
  \ in one line:\n\n```lua\ntask.delay(3, brick.Destroy, brick)\n```\n\nWhile this\
  \ now avoids yielding, it has a potential drawback in that the\nscheduled callback\
  \ will never run if the script is disabled or destroyed\nbefore the callback runs.\n\
  \nThis is where `Class.Debris` has a specific advantage, as it does not yield\n\
  the current thread and runs outside the context of the script, guaranteeing\nthe\
  \ instance is eventually destroyed even if the script is disabled or\ndestroyed.\
  \ The following code does not yield and guarantees the instance will\nbe destroyed:\n\
  \n```lua\nDebris:AddItem(brick, 3)\n```\n\nNote that `Class.Debris` has a hardcoded\
  \ maximum of 1,000 objects, so if more\nthan 1,000 items are added, the oldest debris\
  \ will be destroyed instantly to\nmake room for new debris.\n"
code_samples:
- Debris-AddItem
