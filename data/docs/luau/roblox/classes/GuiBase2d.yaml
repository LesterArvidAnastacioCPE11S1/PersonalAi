- name: GuiBase2d.RootLocalizationTable
  summary: 'A reference to a `Class.LocalizationTable` to be used to apply automated

    localization to this `Class.GuiBase2d` and its descendants.

    '
  description: 'A reference to a `Class.LocalizationTable` to be used to apply automated

    localization to this `Class.GuiBase2d` and its descendants.

    `Class.GuiBase2d.AutoLocalize|AutoLocalize` must be set to `true` on the

    `Class.GuiBase2d` and its ancestors for automated localization to be

    applied.


    You can set this to reference a `Class.LocalizationTable` anywhere in the

    `Class.DataModel`. The `Class.GuiBase2d` object and all of its children

    will try to use that specific `Class.LocalizationTable` and its ancestors

    for automatic text replacement before using the tables under

    `Class.LocalizationService` in an undefined order and the cloud table.


    If there is no translation available in the referenced table, it will look

    for a translation in the parent of that table, if it is also a

    `Class.LocalizationTable`, and so on.


    See also `Class.LocalizationService:GetTableEntries()` which explains how

    the `Class.GuiBase2d.RootLocalizationTable|RootLocalizationTable` is used

    for automated localization.

    '
