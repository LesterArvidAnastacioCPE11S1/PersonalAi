- name: GuiBase2d.AbsoluteRotation
  summary: 'Describes the actual screen rotation of a `Class.GuiBase2d` element, in

    degrees.

    '
  description: '`Class.GuiBase2d.AbsoluteRotation|AbsoluteRotation` is a read-only

    property that describes the actual screen rotation of a `Class.GuiBase2d`

    element, in degrees. It does **not** perform bounds checking, so its value

    may not be in the range `0` to `360`.


    See also `Class.GuiBase2d.AbsolutePosition|AbsolutePosition` and

    `Class.GuiBase2d.AbsoluteSize|AbsoluteSize`.

