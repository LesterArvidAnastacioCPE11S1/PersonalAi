- name: GuiBase2d.SelectionBehaviorDown
  summary: 'Customizes gamepad selection behavior in the down direction.

    '
  description: '`Class.GuiBase2d.SelectionBehaviorDown|SelectionBehaviorDown` customizes

    how gamepad selection moves in the down direction out of a selection

    group. It only has an effect when

    `Class.GuiBase2d.SelectionGroup|SelectionGroup` is `true`;

    `SelectionGroup` is `false` by default, and while it remains `false` this

    property has no effect.


    Its default value is `Enum.SelectionBehavior.Escape`, which prioritizes

    buttons within the selection group but allows the selection to move to a

    `Class.GuiObject` outside the group in the down direction if no suitable

    button is found inside. Setting it to `Enum.SelectionBehavior.Stop`

    instead constrains the selection to the group, preventing it from moving

    downward out of the group.


    See also `Class.GuiBase2d.SelectionGroup|SelectionGroup`.

    '
  code_samples: []
  type: SelectionBehavior
