- name: GuiBase2d.SelectionChanged
  summary: 'Fires when the gamepad selection moves to, leaves, or changes within the

    connected `Class.GuiBase2d` or any descendant

    `Class.GuiObject|GuiObjects`.

    '
  description: 'This event fires when the gamepad selection moves to, leaves, or changes

    within the connected `Class.GuiBase2d` or any descendant

    `Class.GuiObject|GuiObjects`. When the selection highlight moves to a

    `Class.GuiObject`, the event bubbles from that `Class.GuiObject` to all of

    its ancestors, informing them that the selection has

    changed/entered/exited to a `Class.GuiObject` in their descendant tree.

    '
  code_samples: []
  parameters:
  - name: amISelected
    type: boolean
    default: null
    summary: 'True if the new selection matches the attached GuiBase2d.

      '
  - name: previousSelection
    type: GuiObject
    default: null
    summary: 'The `Class.GuiObject` that was previously selected before the

      selection changed, or nil if nothing was selected.

      '
  - name: newSelection
    type: GuiObject
    default: null
    summary: 'The `Class.GuiObject` that is now selected after the selection

      changed, or nil if nothing is selected.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - UI
