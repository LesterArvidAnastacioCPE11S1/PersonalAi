- name: GuiBase2d.SelectionGroup
  summary: 'Allows customization of gamepad selection movement.

    '
  description: 'Allows for customization of how gamepad selection can move between

    buttons, which are descendants of the selection group, leave the group,

    and select other buttons.


    Setting `Class.GuiBase2d.SelectionGroup|SelectionGroup` to `true` exposes

    the `Class.GuiBase2d.SelectionBehaviorUp|SelectionBehaviorUp`,

    `Class.GuiBase2d.SelectionBehaviorDown|SelectionBehaviorDown`,

    `Class.GuiBase2d.SelectionBehaviorLeft|SelectionBehaviorLeft`, and

    `Class.GuiBase2d.SelectionBehaviorRight|SelectionBehaviorRight`

    properties. For these selection behaviors, a setting of

    `Enum.SelectionBehavior.Escape` (default) means the gamepad selection

    tries to first find a selection within the selection group and only moves

    outside if it does not find a suitable button. Alternatively, a setting of

    `Enum.SelectionBehavior.Stop` means gamepad selection only looks within

    the selection group and does not move outside of the group from the

    selection behavior direction.

    '
  code_samples: []
  type: boolean
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Selection
