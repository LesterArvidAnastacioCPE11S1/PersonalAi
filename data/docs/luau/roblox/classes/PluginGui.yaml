name: PluginGui
type: class
memory_category: Instances
summary: 'An abstract base class for GUIs that display `Class.GuiObject|GuiObjects`
  in

  Roblox Studio widgets.

  '
description: 'PluginGui is an abstract class for GUIs that allow the display of

  `Class.GuiObject|GuiObjects` in various Roblox Studio widgets. As of right

  now, the only available PluginGui type is `Class.DockWidgetPluginGui`, but

  there may be more in the future!

  '
