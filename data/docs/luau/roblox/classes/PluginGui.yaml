- name: PluginGui.PluginDragDropped
  summary: 'Fires when the user releases their mouse when hovering over a PluginGui

    during a drag operation started by `Class.Plugin:StartDrag()`.

    '
  description: '**PluginDragDropped** fires when the user releases their mouse over
    a

    `Class.PluginGui` during a drag operation started by

    `Class.Plugin:StartDrag()`.


    See also:


    - `Class.PluginGui.PluginDragEntered`

    - `Class.PluginGui.PluginDragLeft`

    - `Class.PluginGui.PluginDragMoved`

    '
  code_samples:
  - plugin-drag-and-drop
  parameters:
  - name: dragData
    type: Dictionary
    default: null
    summary: 'A copy of the data originally passed to `Class.Plugin:StartDrag()`.

      '
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  capabilities:
  - UI
- name: PluginGui.PluginDragEntered
  summary: 'Fires when the user''s mouse enters a PluginGui during a drag operation

    started by `Class.Plugin:StartDrag()`.

    '
  description: '**PluginDragEntered** fires when the user''s mouse enters the

    `Class.PluginGui` during a drag operation started by

    `Class.Plugin:StartDrag()`.


    This event is useful for displaying a "Drop Here" UI on PluginGuis where a

    drag operation can be dropped. Such a UI should be hidden when either

    `Class.PluginGui.PluginDragLeft|PluginDragLeft` or

    `Class.PluginGui.PluginDragDropped|PluginDragDropped` fire.


    See also:


    - `Class.PluginGui.PluginDragLeft`

    - `Class.PluginGui.PluginDragMoved`

    - `Class.PluginGui.PluginDragDropped`

    '
  code_samples:
  - plugin-drag-and-drop
  parameters:
  - name: dragData
    type: Dictionary
    default: null
    summary: 'A copy of the data originally passed to `Class.Plugin:StartDrag()`.

      '
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  capabilities:
  - UI
- name: PluginGui.PluginDragLeft
  summary: 'Fires when the user''s mouse leaves a PluginGui during a drag operation

    started by `Class.Plugin:StartDrag()`.

    '
  description: '**PluginDragLeft** fires when the user''s mouse leaves a `Class.PluginGui`

    during a drag operation started by `Class.Plugin:StartDrag()`.


    This event and `Class.PluginGui.PluginDragDropped|PluginDragDropped` are

    useful for hiding a "Drop Here" UI on PluginGuis where a drag operation

    can be dropped. Such a UI should be shown when either

    `Class.PluginGui.PluginDragEntered|PluginDragEntered` fires.


    See also:


    - `Class.PluginGui.PluginDragEntered`

    - `Class.PluginGui.PluginDragMoved`

    - `Class.PluginGui.PluginDragDropped`

    '
  code_samples:
  - plugin-drag-and-drop
  parameters:
  - name: dragData
    type: Dictionary
    default: null
    summary: 'A copy of the data originally passed to `Class.Plugin:StartDrag()`.

      '
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  capabilities:
  - UI
- name: PluginGui.PluginDragMoved
  summary: 'Fires when the user''s mouse moves within a PluginGui during a drag

    operation started by `Class.Plugin:StartDrag()`.

    '
  description: '**PluginDragMoved** fires when the user''s mouse moves within a

    `Class.PluginGui` during a drag operation started by

    `Class.Plugin:StartDrag()`.


    See also:


    - `Class.PluginGui.PluginDragEntered`

