methods:
- name: PluginGui:BindToClose
  summary: 'Binds a function that runs when the user closes the `Class.PluginGui`.

    '
  description: "This method binds a function that runs when the user clicks the close\n\
    button of the `Class.PluginGui`. The widget closes and its\n`Class.LayerCollector.Enabled|Enabled`\
    \ property becomes `false` even when\na function is bound, so the function can't\
    \ prevent or delay closing. Use\nit to perform tasks such as saving work when\
    \ the widget closes.\n\nFor example, the following code saves work when the user\
    \ closes the\nwidget:\n\n```lua\nlocal function saveWork()\n\t-- Save the user's\
    \ work here.\nend\n\npluginGui:BindToClose(function()\n\tsaveWork()\nend)\n```\n\
    \nCall `BindToClose()` without an argument to unbind the current function:\n\n\
    ```lua\npluginGui:BindToClose()\n```\n\nSee also:\n\n- `Class.Plugin:CreateDockWidgetPluginGuiAsync()`\
    \ to create a\n  `Class.PluginGui`\n- `Class.DataModel:BindToClose()`, which can\
    \ be used to bind a function to\n  the game ending and should not be confused\
    \ with this function\n"
  code_samples: []
  parameters:
  - name: function
    type: Function
    default: nil
    summary: 'The function to bind the close button to. If no function is specified

      then any previously specified function will be unbound.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
