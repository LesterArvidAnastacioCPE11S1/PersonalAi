- name: GamepadService:EnableGamepadCursor
  summary: 'Enables the gamepad cursor or updates its position.

    '
  description: "This function enables the gamepad cursor if it's currently disabled.\
    \ If\nthe cursor is already enabled, calling the API updates the cursor's\nposition.\
    \ The function accepts an optional `Class.GuiObject|GuiObject`\nparameter, but\
    \ there are some invalid cases. To set the cursor to the\ndefault position, pass\
    \ `nil` or omit the argument.\n\n<table>\n  <thread>\n    <tr>\n      <th>Input\
    \ GuiObject</th>\n      <th>Cursor Starting Position</th>\n    </tr>\n  </thread>\n\
    \  <tbody>\n    <tr>\n      <td><code>Nil</code></td>\n      <td>Default position</td>\n\
    \    </tr>\n    <tr>\n      <td>Not a GuiObject</td>\n      <td>Cursor does not\
    \ appear, errors<td>\n    </tr>\n    <tr>\n      <td>Not a child of BasePlayerGui</td>\n\
    \      <td>Cursor does not appear, errors</td>\n    </tr>\n    <tr>\n      <td>GuiObject\
    \ has Visible 2 set to false or any parent visible set \n          to false</td>\n\
    \      <td>Default position with warning</td>\n    </tr>\n    <tr>\n      <td>Child\
    \ of ScreenGui 1 with Enabled 1 set to false</td>\n      <td>Default position\
    \ with warning</td>\n    </tr>\n    <tr>\n      <td>Child of BillboardGui 4 or\
    \ SurfaceGui</td>\n      <td>Default position with warning</td>\n    </tr>\n \
    \   <tr>\n      <td>GuiObject outside the viewport (Or, any part of the gui object\
    \ \n        that is off screen)</td>\n      <td>Default position with warning</td>\n\
    \    </tr>\n    <tr>\n      <td>Child of ScrollingFrame with clipping set to false:\
    \ GuiObject \n        outside of scrolling frame (Object child of scrolling frame\
    \ and \n        not visible on screen)</td>\n      <td>Default position with warning</td>\n\
    \    </tr>\n    <tr>\n      <td>Child of ScrollingFrame with clipping set to true:\
    \ GuiObject \n        outside scrolling frame window but inside viewport</td>\n\
    \      <td>GuiObject moves into the scrolling frame and starts the cursor \n \
    \       centered over the object</td>\n    </tr>\n    <tr>\n      <td>GuiObject\
    \ inside the frame and visible</td>\n      <td>Cursor starts centered on the GuiObject</td>\n\
    \    </tr>\n  </tbody>\n</table>\n"
  code_samples:
  - GamepadService-EnableGamepadCursor
  parameters:
  - name: guiObject
    type: GuiObject?
    default: nil
    summary: 'A `Class.GuiObject` to center the virtual cursor on when enabled, or

      `nil` to use the default cursor position.

      '
  returns:
  - type: ()
    summary: ''
