- name: SocialService:GetEventRsvpStatusAsync
  summary: 'Returns the local player''s RSVP status for the given event.

    '
  description: 'Returns the local player''s RSVP status for the given event. Events
    must be

    in the current experience and must not have already started. If the event

    has already started, this method will return an error.


    Use

    `Class.SocialService:GetUpcomingExperienceEventsAsync()|GetUpcomingExperienceEventsAsync()`

    to obtain a valid event ID at runtime rather than hardcoding one. Note

    that you can use

    `Class.SocialService:PromptRsvpToEventAsync()|PromptRsvpToEventAsync()` to

    prompt the player to change their RSVP status for the event.

    '
  code_samples:
  - SocialService-PromptRsvpToEventAsync
  parameters:
  - name: eventId
    type: string
    default: null
    summary: 'The event ID of the event to prompt the player to change their RSVP

      status for. This must be a valid event ID that exists in the current

      experience, represented as a string (not a number).

      '
  returns:
  - type: RsvpStatus
    summary: 'Returns an `Enum.RsvpStatus` indicating the player''s current RSVP

      status for the event. If the player has not RSVP''d to the event, this

      will return `Enum.RsvpStatus.None`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Social
- name: SocialService:GetExperienceEventAsync
  summary: 'Returns details for the specified experience event or `nil` if it is

    unavailable.

    '
  description: "`GetExperienceEventAsync()` yields until the request completes and\
    \ then\nreturns a dictionary describing the requested event. The dictionary\n\
    contains the following fields:\n\n- `Id` (string)\n- `Title` (string)\n- `Subtitle`\
    \ (string)\n- `Description` (string)\n- `DisplayTitle` (string)\n- `DisplaySubtitle`\
    \ (string)\n- `DisplayDescription` (string)\n- `ThumbnailIds` (array of numbers):\
    \ Asset IDs for the event thumbnails.\n  The first ID is the primary thumbnail.\n\
    - `StartTime` (dictionary)\n  - `Day` (number)\n  - `Year` (number)\n  - `Month`\
    \ (number)\n  - `Minute` (number)\n  - `Millisecond` (number)\n  - `Hour` (number)\n\
    \  - `Second` (number)\n- `EndTime` (dictionary)\n  - `Day` (number)\n  - `Year`\
    \ (number)\n  - `Month` (number)\n  - `Minute` (number)\n  - `Millisecond` (number)\n\
    \  - `Hour` (number)\n  - `Second` (number)\n- `HasStarted` (boolean)\n- `HasEnded`\
    \ (boolean)\n- `Status` (`Enum.ExperienceEventStatus`)\n- `UserRsvpStatus` (`Enum.RsvpStatus`\
    \ or `nil`)\n\nIf the event cannot be found, belongs to a different experience,\
    \ or the\nresponse is malformed, this method returns `nil`. Requests may also\
    \ fail\nwith a `HttpError <status>` message if the service returns an unexpected\n\
    error code.\n"
  code_samples:
  - SocialService-GetUpcomingExperienceEventsAsync
  parameters:
  - name: eventId
    type: string
    default: null
    summary: 'The string identifier of the event to retrieve. Must correspond to an

      event in the current experience.

      '
  returns:
  - type: ExperienceEvent?
    summary: 'A dictionary describing the event, or `nil` if the event does not

      exist, belongs to another experience, or is otherwise unavailable.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Social
- name: SocialService:GetPartyAsync
  summary: 'Returns an array of dictionaries containing data for all members of the

    specified party who are currently in the experience.

    '
  description: "Returns an array of dictionaries containing data for all members\n\
    associated with the given `partyId`. The returned array reflects the\ncurrent\
    \ state of the party across all active server instances within the\nexperience\
    \ and it is ordered by the time each party member accepted the\nparty invite.\
    \ This means the first element in the array is the earliest to\naccept and the\
    \ last is the most recent.\n\nThis method is useful for retrieving up-to-date\
    \ information about all\nparty members currently in the experience and across\
    \ different servers,\nenabling coordinated group behavior such as teleportation,\
    \ matchmaking, or\nparty-based gameplay logic.\n\nEach dictionary in the returned\
    \ array contains the following fields:\n\n<table>\n<thead>\n  <tr>\n    <th>Key</th>\n\
    \    <th>Value Type</th>\n    <th>Description</th>\n  </tr>\n</thead>\n<tbody>\n\
    \  <tr>\n    <th><code>UserId</code></th>\n    <td>number</td>\n    <td>The player's\
    \ <code>Class.Player.UserId</code> property.</td>\n  </tr>\n  <tr>\n    <th><code>PlaceId</code></th>\n\
    \    <td>number</td>\n    <td>The <code>Class.DataModel.PlaceId</code> of the\
    \ place the party member is currently in.</td>\n  </tr>\n  <tr>\n    <th><code>JobId</code></th>\n\
    \    <td>string</td>\n    <td>The <code>Class.DataModel.JobId</code> of the server\
    \ instance the user currently resides in.</td>\n  </tr>\n  <tr>\n    <th><code>PrivateServerId</code></th>\n\
    \    <td>string</td>\n    <td>If applicable, the <code>Class.DataModel.PrivateServerId</code>\
    \ when the party member is in a private or reserved server.</td>\n  </tr>\n  <tr>\n\
    \    <th><code>ReservedServerAccessCode</code></th>\n    <td>string</td>\n   \
    \ <td>If applicable, the legacy access code for the reserved server that the user\
    \ currently resides in. For new work, use <code>Class.TeleportOptions.ReservedServerId</code>\
    \ with <code>Class.TeleportService:TeleportAsync()</code> instead.</td>\n  </tr>\n\
    </tbody>\n</table>\n\nTo test this service in your experience, use the\n[Party\
    \ Simulator](../../../studio/testing-modes.md#party-simulation) in\nRoblox Studio\
    \ or publish the experience and play it in the Roblox\napplication.\n"
  code_samples:
  - SocialService-GetPartyAsync
  parameters:
  - name: partyId
    type: string
    default: null
    summary: 'The unique identifier of the party to retrieve member data for,

      corresponding to a `Class.Player.PartyId` value.

      '
  returns:
  - type: Array
    summary: 'An array of dictionaries representing the members of the specified

      party who are currently in the experience.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Social
