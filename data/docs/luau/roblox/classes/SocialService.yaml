- name: SocialService:PromptFeedbackSubmissionAsync
  summary: 'Prompts the player to submit feedback or a player support ticket about
    the

    current experience.

    '
  description: "Displays a dialog to the player, allowing them to provide feedback\
    \ about\ntheir experience or submit a player support ticket.\n\n- The submitted\
    \ feedback becomes available to developers in the Creator\n  Dashboard under the\
    \ **Audience** > **Feedback** section.\n- The submitted player support requests\
    \ become available to developers in\n  the Creator Dashboard under the **Audience**\
    \ > **Player Support**\n  section. The Player Support flow is currently in **alpha**\
    \ and is only\n  available to select experiences.\n\nThis method yields until\
    \ the player either submits feedback, dismisses the\ndialog, or a timeout is reached.\
    \ As an asynchronous operation, it should\nbe called using `task.spawn()` or within\
    \ a coroutine.\n\n#### Feedback Types\n\nThe `FeedbackType` key in the options\
    \ dictionary determines which flow is\ndisplayed:\n\n- `Enum.FeedbackType.Feedback`\
    \ (default) — Displays a general feedback\n  prompt where the player can rate\
    \ and comment on the experience.\n- `Enum.FeedbackType.PlayerSupport` — (**Alpha;\
    \ select experiences only**)\n  Displays a player support flow where the player\
    \ can submit a categorized\n  support ticket directly to the experience developer.\
    \ This enables\n  in-experience customer support without requiring players to\
    \ leave the\n  game.\n\n#### Feedback Flow\n\nWhen `FeedbackType` is `Enum.FeedbackType.Feedback`\
    \ (or omitted), the\nplayer is shown a general feedback prompt where they can\
    \ rate and\noptionally comment on the experience. Submitted feedback appears in\
    \ the\nCreator Dashboard under **Audience** > **Feedback**. Players can submit\n\
    feedback once per day per experience.\n\n#### Player Support Flow (Alpha)\n\n\
    When `FeedbackType` is set to `Enum.FeedbackType.PlayerSupport`, the\nplayer is\
    \ guided through a support ticket submission flow. This flow is\ncurrently in\
    \ **alpha** and is only available to select experiences. The\nprompt presents\
    \ a form where the player selects a category, writes a\ndescription of their issue,\
    \ and chooses whether to share their user ID\nwith the developer. The available\
    \ categories are:\n\n<table>\n<thead>\n  <tr>\n    <th>Category</th>\n    <th>Description</th>\n\
    \  </tr>\n</thead>\n<tbody>\n  <tr>\n    <td>Bug Report</td>\n    <td>The player\
    \ is reporting a bug or technical issue.</td>\n  </tr>\n  <tr>\n    <td>Data Restore\
    \ Request</td>\n    <td>The player is requesting that lost or corrupted data be\
    \ restored.</td>\n  </tr>\n  <tr>\n    <td>Purchasing Issue</td>\n    <td>The\
    \ player has an issue with an in-experience purchase.</td>\n  </tr>\n  <tr>\n\
    \    <td>Other</td>\n    <td>A general issue that does not fit the other categories.</td>\n\
    \  </tr>\n</tbody>\n</table>\n\nThe player also chooses whether to share their\
    \ `Class.Player.UserId` with\nthe developer as part of the ticket.\n\n#### Eligibility\n\
    \nBefore showing the prompt, this method performs an eligibility check. The\n\
    eligibility rules differ depending on the feedback type.\n\nA player is ineligible\
    \ for the **Feedback** flow if:\n\n- The player is the experience owner (developers\
    \ cannot submit feedback\n  for their own experiences).\n- The player has been\
    \ rate limited (submitted too many reviews recently).\n- The player does not meet\
    \ age requirements.\n\nA player is ineligible for the **Player Support** flow\
    \ if:\n\n- The player does not meet age requirements.\n- The player already has\
    \ 5 in-progress tickets.\n- The player is banned from the experience.\n\nIf the\
    \ player is ineligible, the prompt displays a message indicating that\nfeedback\
    \ or support is unavailable and the method returns without error.\n\n#### Notes\n\
    \n- This service does not work during playtesting in Roblox Studio. To test\n\
    \  the feedback prompt, you must publish the experience and play it in the\n \
    \ Roblox application.\n- The method will time out and resume if the player does\
    \ not interact with\n  the prompt within a reasonable period.\n- If the submission\
    \ fails due to a text filter violation or network error,\n  the player is notified\
    \ within the dialog.\n"
  code_samples:
  - PromptFeedbackSubmissionAsync
  - PromptFeedbackSubmissionAsync-PlayerSupport
  parameters:
  - name: options
    type: Dictionary?
    default: null
    summary: 'Optional `Dictionary` configuring the prompt. Supported keys: -

      `FeedbackType` (`Enum.FeedbackType`). Selects which feedback flow to

      display. Defaults to `Enum.FeedbackType.Feedback`.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Social
