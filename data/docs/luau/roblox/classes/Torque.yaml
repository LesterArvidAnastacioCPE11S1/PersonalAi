name: Torque
type: class
memory_category: BaseParts
summary: 'Applies constant torque to an assembly from its center of mass.

  '
description: "A `Torque` constraint applies constant torque to an assembly from its\
  \ center\nof mass. Alternatively:\n\n- Because the `Torque` constraint applies **constant**\
  \ torque and angular\n  acceleration, very high speeds may result if no other forces\
  \ are involved.\n  If you want to maintain a more steady velocity over time, use\
  \ an\n  `Class.AngularVelocity` constraint.\n- If you only need **initial** velocity,\
  \ set the\n  `Class.BasePart.AssemblyAngularVelocity|AssemblyAngularVelocity` property\n\
  \  directly on the assembly.\n\nWhen configuring this constraint, it may be helpful\
  \ to study\n[Roblox Units](../../../physics/units.md) to understand how Roblox units\n\
  compare to metric units.\n\n#### Relativity\n\nBy default, torque is applied relative\
  \ to\n`Class.Constraint.Attachment0|Attachment0`. If the parent assembly rotates,\n\
  the torque will change direction to match the adjusted orientation of the\nattachment.\n\
  \nIf `Class.Torque.RelativeTo|RelativeTo` is set to\n`Enum.ActuatorRelativeTo|World`,\
  \ torque will be applied in world coordinates,\nindependent of the parent or attachment\
  \ orientations.\n\nIf `Class.Torque.RelativeTo|RelativeTo` is set to\n`Enum.ActuatorRelativeTo|Attachment1`,\
  \ torque will be applied relative to\n`Class.Constraint.Attachment1|Attachment1`\
  \ and, if the attachment rotates,\nchange to match its orientation.\n"
