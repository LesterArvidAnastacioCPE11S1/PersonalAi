- name: CollectionService.TagAdded
  summary: 'Fires when a tag is added to an instance and the added tag is the only

    occurrence of that tag in the place.

    '
  description: 'This event fires when a tag transitions from being unused to being
    in use

    — specifically, when a tag is applied to an instance inside the

    `Class.DataModel` and no other instance in the `Class.DataModel`

    previously had that tag. The event passes the tag name as its parameter.


    `TagAdded` fires once per tag lifetime, not once per instance. To detect

    every individual instance that receives a particular tag, use

    `Class.CollectionService:GetInstanceAddedSignal()|GetInstanceAddedSignal()`

    instead.


    The event fires asynchronously (deferred to the next resumption point),

    not synchronously inside the `Class.CollectionService:AddTag()|AddTag()`

    call that triggered it.

    '
  code_samples: []
  parameters:
  - name: tag
    type: string
    default: null
    summary: 'The name of the tag that entered use.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Basic
- name: CollectionService.TagRemoved
  summary: 'Fires when a tag is removed from an instance and the removed tag is no

    longer used anywhere in the place.

    '
  description: 'This event fires when the last instance bearing a given tag leaves
    the

    `Class.DataModel` or has the tag removed, meaning no instance in the

    `Class.DataModel` still carries that tag. The event passes the tag name as

    its parameter.


    `TagRemoved` fires once per tag lifetime, not once per instance. To detect

    every individual instance that loses a particular tag, use

    `Class.CollectionService:GetInstanceRemovedSignal()|GetInstanceRemovedSignal()`

    instead.


    The event fires asynchronously (deferred to the next resumption point),

    not synchronously inside the removal operation that triggered it.

    '
  code_samples: []
  parameters:
  - name: tag
    type: string
    default: null
    summary: 'The name of the tag that is no longer in use.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
