- name: CollectionService:GetCollections
  summary: 'Gets an array of every `Datatype.Collection` the given instance is

    currently a member of.

    '
  description: 'This method is the `Datatype.Collection` equivalent of

    `Class.CollectionService.GetTags()`. It performs a reverse lookup on the

    instance and returns the collections it''s a member of. Collections are not

    cached on `Class.Instance` like tags, so this call scans all active

    collections looking for membership.

    '
  code_samples: []
  parameters:
  - name: instance
    type: Instance
    default: null
    summary: 'The instance to look up `Datatype.Collection` membership for.

      '
  returns:
  - type: Array
    summary: 'An array of the `Datatype.Collection` values the instance is currently

      a member of. Empty if the instance matches no active query.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: CollectionService:GetInstanceAddedSignal
  summary: 'Returns a signal that fires when a given tag is added to an instance.

    '
  description: "Given a tag (string), this method returns a signal which fires under\
    \ two\nconditions:\n\n- The tag is assigned to an instance within the `Class.DataModel`\
    \ using\n  `Class.CollectionService:AddTag()` or `Class.Instance:AddTag()`.\n\n\
    - An instance with the given tag is added as a descendant of the\n  `Class.DataModel`,\
    \ for example by setting `Class.Instance.Parent` or\n  similar.\n\nSubsequent\
    \ calls to this method with the same tag return the same signal\nobject. Consider\
    \ also calling\n`Class.CollectionService:GetTagged()|GetTagged()` to get a list\
    \ of\ninstances that already have a tag (and thus won't fire the event if they\n\
    already are in the `Class.DataModel`).\n\nSee also\n`Class.CollectionService:GetInstanceRemovedSignal()|GetInstanceRemovedSignal()`\n\
    which returns an event that fires under similar conditions.\n"
  code_samples:
  - Deadly-Bricks-using-CollectionService
  parameters:
  - name: tag
    type: string
    default: null
    summary: 'The tag to watch for.

      '
  returns:
  - type: RBXScriptSignal
    summary: 'An event that fires when you add the tag to an instance.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: CollectionService:GetInstanceRemovedSignal
  summary: 'Returns a signal that fires when a given tag is removed from an instance.

    '
  description: "Given a tag (string), this method returns a signal which fires under\
    \ two\nconditions:\n\n- The tag is removed from an instance within the `Class.DataModel`\
    \ using\n  `Class.CollectionService:RemoveTag()` or `Class.Instance:RemoveTag()`.\n\
    \n- An instance with the given tag is removed as a descendant of the\n  `Class.DataModel`,\
    \ for example by un‑setting `Class.Instance.Parent` or\n  similar.\n\nSubsequent\
    \ calls to this method with the same tag return the same signal\nobject. The signal\
    \ is useful for cleaning up resources used by instances\nthat once had tags, such\
    \ as disconnecting connections.\n\nSee also\n`Class.CollectionService:GetInstanceAddedSignal()|GetInstanceAddedSignal()`\n\
    which returns an event that fires under similar conditions.\n"
  code_samples:
  - Deadly-Bricks-using-CollectionService
  parameters:
  - name: tag
    type: string
    default: null
    summary: 'The tag to watch for.

      '
  returns:
  - type: RBXScriptSignal
    summary: 'An event that fires when you remove the tag from an instance.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: CollectionService:GetTagged
  summary: 'Returns an array of instances in the game with a given tag.

    '
  description: 'This method returns an array of instances with a given tag which are

    descendants of the `Class.DataModel`. Removing a tag using

    `Class.CollectionService:RemoveTag()` or `Class.Instance:RemoveTag()`

    ensures this method does not return them.


    If you want to detect all instances with a tag, both present **and**

    future, use this method to iterate over instances while also making a

    connection to a signal returned by

    `Class.CollectionService:GetInstanceAddedSignal()|GetInstanceAddedSignal()`.


    This method does not guarantee any ordering of the returned instances.

    Additionally, it''s possible that instances can have the given tag assigned

    to them but not be a descendant of the `Class.DataModel`, for example its

    parent is `nil`; this method will not return such instances.

    '
  code_samples:
  - Deadly-Bricks-using-CollectionService
  parameters:
  - name: tag
    type: string
    default: null
    summary: 'The tag to search for.

      '
  returns:
  - type: Instances
    summary: 'An array of all instances with the tag.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
- name: CollectionService:GetTags
  summary: 'Gets an array of all tags applied to a given instance.

    '
  description: 'Given an `Class.Instance`, this method returns an array of strings
    which

    are the tags applied to the instance.


    This method is useful when you want to do something with multiple instance

    tags at once, but it''s inefficient to check for the existence of a single

    tag. For this, use `Class.CollectionService:HasTag()|HasTag()` to check

    for a single tag.

    '
  code_samples:
  - Using-Tags-and-CollectionService
  parameters:
  - name: instance
    type: Instance
    default: null
    summary: 'The instance whose tags should be returned.

      '
  returns:
  - type: Array
    summary: 'An array of strings which are the tags applied to the given instance.

