name: CollectionService
type: class
memory_category: Instances
summary: 'A service which manages instance collections using assigned tags.

  '
description: '`CollectionService` manages groups (collections) of instances with **tags**.

  Tags are sets of strings applied to instances that replicate from the server

  to the client. They are also serialized when places are saved.


  The primary use of `CollectionService` is to register instances with specific

  tags that you can use to extend their behavior. If you find yourself adding

  the same script to many different instances, a script that uses

  `CollectionService` may be better.


  Tags can be added or removed through this class'' methods such as

  `Class.CollectionService:AddTag()|AddTag()` or

  `Class.CollectionService:RemoveTag()|RemoveTag()`. They can also be managed

  directly in Studio through the

  [Tags](../../../studio/properties.md#instance-tags) section of an instance''s

  properties.


  ##### Replication


  When tags replicate, **all tags on an instance replicate at the same time**.

  Therefore, if you set a tag on an instance from the client then add/remove a

  **different** tag on the same instance from the server, the client''s local

  tags on the instance are overwritten. In

  `Class.Workspace.StreamingEnabled|StreamingEnabled` places, instances can be

  unloaded as they leave the client''s streamed area. If such an instance

  re-enters the streamed area, properties and tags will be re-synchronized from

  the server. This can cause changes made by `Class.LocalScript|LocalScripts` to

  be overwritten/removed.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
deprecation_message: ''
properties: []
methods:
- name: CollectionService:AddTag
  summary: 'Applies a tag to an `Class.Instance`.

    '
  description: "This method applies a tag to an `Class.Instance`, doing nothing if\
    \ the tag\nis already applied to that instance. Successfully adding a tag will\
    \ fire a\nsignal created by\n`Class.CollectionService:GetInstanceAddedSignal()|GetInstanceAddedSignal()`\n\
    with the given tag.\n\n##### Warnings\n\n- An instance's tags that were added\
    \ client-side will be dropped if the\n  server later adds or removes a tag on\
    \ that instance because the server\n  replicates all tags together and overwrites\
    \ previous tags.\n\n- When tagging an instance, it is common that some resources\
    \ are used to\n  give the tag its functionality, for example event connections\
    \ or tables.\n  To prevent memory leaks, it's a good idea to clean these up (disconnect,\n\
    \  set to `nil`, etc.) when no longer needed for a tag. Do this when\n  calling\
    \ `Class.CollectionService:RemoveTag()|RemoveTag()`, calling\n  `Class.Instance:Destroy()`\
    \ or in a function connected to a signal\n  returned by\n  `Class.CollectionService:GetInstanceRemovedSignal()|GetInstanceRemovedSignal()`.\n"
  code_samples: []
  parameters:
  - name: instance
    type: Instance
    default: null
    summary: 'The `Class.Instance` to apply the tag to.

      '
  - name: tag
    type: string
    default: null
    summary: 'The tag string to apply to the instance.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: CollectionService:CreateCollection
  summary: 'Creates a `Datatype.Collection` that tracks every instance matching a

    query.

    '
  description: "Creates a `Datatype.Collection`, a live group of instances defined\
    \ by a\nquery. Unlike `Class.CollectionService:GetTagged()|GetTagged()`, which\n\
    returns a fixed array, a collection keeps tracking which instances match\nand\
    \ runs your callbacks as instances join and leave.\n\nSee `Datatype.Collection`\
    \ for query syntax, callbacks, and lifetime.\n\n```lua\nlocal CollectionService\
    \ = game:GetService(\"CollectionService\")\n\n-- Every Part tagged KillBrick under\
    \ Workspace\nlocal killBricks = CollectionService:CreateCollection(\"Part.KillBrick\"\
    )\n\nfunction killBricks.OnTouched(brick: Part, otherPart: BasePart)\n\tlocal\
    \ character = otherPart.Parent\n\tlocal humanoid = character and character:FindFirstChildOfClass(\"\
    Humanoid\")\n\tif humanoid then\n\t\thumanoid.Health = 0\n\tend\nend\n```\n"
  code_samples: []
  parameters:
  - name: query
    type: string
    default: null
    summary: 'The selector that defines which instances belong to the collection.

      See `Datatype.Collection` for the syntax.

      '
  - name: root
    type: Instance
    default: nil
    summary: 'The collection only tracks descendants of this instance. Defaults to

      `Class.Workspace`.

      '
  returns:
  - type: Collection
    summary: 'A `Datatype.Collection` that tracks instances matching `query`.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: CollectionService:GetAllTags
  summary: 'Returns an array of all tags in the experience.

    '
  description: 'Returns an array of all tags that currently have at least one tagged

    instance inside the `Class.DataModel`. The returned array does not

    guarantee any particular ordering.


    A tag appears in the result as soon as any instance bearing it enters the

    `Class.DataModel` (for example by being parented to `Class.Workspace`),

    and it is removed from the result once the last instance with that tag

    leaves the `Class.DataModel` or has the tag removed. This means calling

    `GetAllTags()` immediately after removing the last instance with a given

    tag will no longer include that tag.

    '
  code_samples: []
  parameters: []
  returns:
  - type: Array
    summary: 'An array of all tags that currently have at least one tagged instance

      in the `Class.DataModel`.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
- name: CollectionService:GetCollection
  summary: 'Returns all instances of a given class which are in the `Class.DataModel`.

    '
  description: 'This function returns all instances of a given class which are in
    the

    `Class.DataModel`. Only works for `Class.Configuration`,

    `Class.CustomEvent`, `Class.CustomEventReceiver`, `Class.Dialog`, and

    `Class.VehicleSeat`.

    '
  code_samples:
  - CollectionService-GetCollection1
  parameters:
  - name: class
    type: string
    default: null
    summary: 'The class type to retrieve instances of.

      '
  returns:
  - type: Instances
    summary: 'An array of all instances of the specified class in the

      `Class.DataModel`.

      '
  tags:
