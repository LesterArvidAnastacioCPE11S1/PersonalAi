name: ServiceProvider
type: class
memory_category: Instances
summary: 'A ServiceProvider is an abstract class, which stores, and provides certain

  singleton classes, depending on what inherited class you are using its members

  with.

  '
description: 'A ServiceProvider is an abstract base class that manages a registry
  of

  singleton service instances. The `Class.DataModel` (accessible in Lua as

  `game`) is the primary ServiceProvider in an experience. Services are created

  lazily the first time they are requested via

  `Class.ServiceProvider:GetService()` and remain available for the lifetime of

  the DataModel.


  You do not create ServiceProvider instances directly; instead you interact

  with its members through the DataModel.

  '
code_samples: []
inherits:
- Instance
descendants:
- DataModel
- GenericSettings
tags:
- NotCreatable
- NotBrowsable
deprecation_message: ''
properties: []
methods:
- name: ServiceProvider:FindService
  summary: 'Returns the service specified by the given className if it''s already

    created, errors for an invalid name.

    '
  description: 'Returns the service with the given class name only if it has already
    been

    created. Unlike `Class.ServiceProvider:GetService()`, this method does not

    create the service when it does not yet exist; it returns `nil` instead.

    If `className` is not a valid service name, the method throws an error.


    This method is thread-safe and can be called from any thread context. It

    is useful when you need to check whether a service is present without

    triggering its initialization, for example during cleanup or conditional

    logic that should not force service creation.

    '
  code_samples:
  - ServiceProvider-FindService1
  parameters:
  - name: className
    type: string
    default: null
    summary: 'The class name of the service to find.

      '
  returns:
  - type: Instance
    summary: 'The service instance if it has already been created, or nil if the

      service does not yet exist.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities: []
- name: ServiceProvider:GetService
  summary: 'Returns the service with the requested class name, creating it if it does

    not exist.

    '
  description: "Returns a service with the class name requested. When called with\
    \ the name\nof a service (such as `Class.Debris`) it will return the instance\
    \ of that\nservice. If the service does not yet exist it will be created and the\
    \ new\nservice is returned. This is the only way to create some services, and\
    \ can\nalso be used for services that have unusual names, e.g. RunService's name\n\
    is \"Run Service\".\n\nNote:\n\n- This function will return `nil` if the className\
    \ parameter is an\n  existing class, but the class is not a service.\n- If you\
    \ attempt to fetch a service that is present under another Object,\n  an error\
    \ will be thrown stating that the \"singleton serviceName already\n  exists\"\
    .\n"
  code_samples:
  - ServiceProvider-GetService1
  parameters:
  - name: className
    type: string
    default: null
    summary: 'The class name of the requested service.

      '
  returns:
  - type: Instance
    summary: 'An instance of the requested service.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
