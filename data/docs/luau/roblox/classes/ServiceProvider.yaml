events:
- name: ServiceProvider.Close
  summary: 'Fires when the current place is exited.

    '
  description: 'Fires when the game instance is shutting down, immediately before
    services

    and instances are torn down. On the server this occurs when the last

    player leaves or the server is closed; on the client it fires when the

    player leaves the experience.


    Connect to this event to perform final cleanup such as saving player data

    with `Class.DataStoreService`. Handlers run synchronously — the engine

    waits for all connected callbacks to return before proceeding with

    shutdown.

    '
  code_samples:
  - ServiceProvider-Close1
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities: []
- name: ServiceProvider.ServiceAdded
  summary: 'Fired when a service is created.

    '
  description: 'Fires after a service is added to the DataModel. The `service` parameter

    is the `Class.Instance` of the newly added service. Because services are

    created lazily (the first time `Class.ServiceProvider:GetService()` is

    called for them), this event lets you react to a service becoming

    available without polling for it.

    '
  code_samples: []
  parameters:
  - name: service
    type: Instance
    default: null
    summary: 'The instance of the service that was added.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities: []
- name: ServiceProvider.ServiceRemoving
  summary: 'Fired when a service is about to be removed.

    '
  description: 'Fires just before a service is removed from the DataModel. The `service`

    parameter is the `Class.Instance` that is about to be removed. This event

    fires during DataModel teardown, giving listeners a chance to disconnect

    from the service or release references before the service is destroyed.

    '
  code_samples: []
  parameters:
  - name: service
    type: Instance
    default: null
    summary: 'The Instance of the service that is about to be removed.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities: []
