  summary: 'Returns an array of `Class.InputObject|InputObjects` for all available

    inputs on the given gamepad, representing each input''s last input state.

    '
  description: 'This method returns an array of `Class.InputObject|InputObjects` for
    all

    available inputs on the given `Enum.UserInputType` gamepad, representing

    each input''s last input state.

    '
  code_samples: []
