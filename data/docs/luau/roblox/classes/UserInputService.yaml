- name: UserInputService:GetUserCFrame
  summary: 'Returns a `Datatype.CFrame` describing the position and orientation of
    a

    specified virtual reality device.

    '
  description: "The `Class.UserInputService:GetUserCFrame()` method returns a\n`Datatype.CFrame`\
    \ describing the position and orientation of a specified\n`Enum.UserCFrame` virtual\
    \ reality (VR) device. If the specified device is\nnot connected, the method returns\
    \ `Datatype.CFrame|CFrame.new()`.\n\nFor example, the code snippet below prints\
    \ the CFrame of the user's VR\nheadset.\n\n```lua\nlocal UserInputService = game:GetService(\"\
    UserInputService\")\nlocal cframe = UserInputService:GetUserCFrame(Enum.UserCFrame.Head)\n\
    \nprint(cframe)\n```\n\nBy using the method, players can implement features such\
    \ as re-positioning\nthe user's in-game character corresponding to the location\
    \ of a connected\nVR device. This can be done by changing the _CFrame_ of the\
    \ user's in-game\nbody parts to match the _CFrame_ of the specified VR device\
    \ using\n`Enum.UserCFrame` and `Datatype.CFrame` value arguments passed by the\n\
    event.\n\nSee also:\n\n- `Class.UserInputService.UserCFrameChanged`, an event\
    \ which fires when\n  the `Datatype.CFrame` of a VR device changes\n- `Class.VRService`,\
    \ a service used to implement VR support\n\nAs this event only fires locally,\
    \ it can only be used in a\n`Class.LocalScript`.\n"
  code_samples:
  - UserInputService-UserCFrameChanged
  parameters:
  - name: type
    type: UserCFrame
    default: null
    summary: 'The `Enum.UserCFrame` corresponding to the VR device.

      '
  returns:
  - type: CFrame
    summary: 'A `Datatype.CFrame` describing the position and orientation of the

      specified VR device.

      '
  tags:
  - Deprecated
  deprecation_message: 'Use `Class.VRService:GetUserCFrame()` instead.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
