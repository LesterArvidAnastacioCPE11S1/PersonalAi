  parameters: []
  returns:
  - type: TextBox
    summary: 'The currently focused `Class.TextBox`, or `nil` if no `Class.TextBox`

      is focused.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: UserInputService:GetGamepadConnected
  summary: 'Returns whether a gamepad with the given `Enum.UserInputType` is

    connected.

    '
  description: 'This method returns whether a gamepad with the given `Enum.UserInputType`

    is connected.


    Alternatively to detecting a specific gamepad by `Enum.UserInputType`, the

    `Class.UserInputService.PreferredInput|PreferredInput` property can be

