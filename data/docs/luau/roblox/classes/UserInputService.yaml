- name: UserInputService.MouseBehavior
  summary: 'Determines whether the user''s mouse can be moved freely or is locked.

    '
  description: "This property sets how the user's mouse behaves based on the\n`Enum.MouseBehavior`\
    \ enum. It can be set to three values:\n\n- `Enum.MouseBehavior.Default` &mdash;\
    \ The mouse moves freely around the\n  user's screen.\n- `Enum.MouseBehavior.LockCenter`\
    \ &mdash; The mouse is locked and cannot\n  move from the center of the user's\
    \ screen.\n- `Enum.MouseBehavior.LockCurrentPosition` &mdash; The mouse is locked\
    \ and\n  cannot move from its current position on the user's screen at the time\n\
    \  of locking.\n\nThe value of this property does not affect the sensitivity of\
    \ events\ntracking mouse movement. For example,\n`Class.UserInputService:GetMouseDelta()|GetMouseDelta`\
    \ returns the same\n`Datatype.Vector2` screen position in pixels regardless of\
    \ whether the\nmouse is locked or able to move freely around the user's screen.\
    \ As a\nresult, default scripts like those controlling the camera are not impacted\n\
    by this property.\n\nThis property is overridden if a `Class.GuiButton` with\n\
    `Class.GuiButton.Modal|Modal` enabled is `Class.GuiButton.Visible|Visible`\nunless\
    \ the player's right mouse button is down.\n\nNote that if the mouse is locked,\n\
    `Class.UserInputService.InputChanged|InputChanged` will still fire when\nthe player\
    \ moves the mouse and will pass in the delta that the mouse\nattempted to move\
    \ by. Additionally, if the player is kicked from the\nexperience, the mouse will\
    \ be forcefully unlocked.\n"
  code_samples: []
  type: MouseBehavior
