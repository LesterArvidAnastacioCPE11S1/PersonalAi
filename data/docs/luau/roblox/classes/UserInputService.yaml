- name: UserInputService.UserCFrameChanged
  summary: 'Fires when the `Datatype.CFrame` of a specified Virtual Reality device

    changes.

    '
  description: "The UserCFrameChanged event fires when the `Datatype.CFrame` of a\
    \ VR\ndevice changes.\n\nThis event can be used to track the movement of a connected\
    \ VR device.\n\nUsing the event, you can implement features such as moving the\
    \ user's\nin-game character limbs as the user moves their VR device. This can\
    \ be\ndone by changing the CFrame of the user's in-game limbs to match the\nCFrame\
    \ changes of the VR device using the `Enum.UserCFrame` enum and\n_CFrame_ value\
    \ arguments passed by the event.\n\nTo retrieve the `Datatype.CFrame` of a connected\
    \ VR device, use\n`Class.UserInputService:GetUserCFrame()`.\n\nAs the event fires\
    \ locally, it can only be used in a `Class.LocalScript`.\n\nSee also:\n\n- `Class.VRService`,\
    \ used to implement support, including an identical\n  event `Class.VRService.UserHeadCFrameChanged`\n\
    - `Class.Camera.HeadLocked`, when this property is `true` the\n  `Class.Camera`\
    \ will automatically track the head motion of a player\n  using a VR device\n\
    - `Class.Camera:GetRenderCFrame()`, a method which retrieves the\n  `Datatype.CFrame`\
    \ the `Class.Camera` is being orientated at, including\n  the impact of VR devices\n"
  code_samples:
  - UserInputService-UserCFrameChanged
  parameters:
  - name: type
    type: UserCFrame
    default: null
    summary: 'A `Enum.UserCFrame` value indicating which body part moved.

      '
  - name: value
    type: CFrame
    default: null
    summary: 'A `Datatype.CFrame` value indicating the updated CFrame of the body

      part that moved.

      '
  tags:
  - Deprecated
  deprecation_message: 'Use `Class.VRService.UserCFrameChanged` instead.

    '
  security: None
  capabilities:
  - Input
