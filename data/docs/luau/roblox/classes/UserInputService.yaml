methods:
- name: UserInputService:CreateVirtualInput
  summary: 'Creates a `Class.VirtualInput` object for simulating mouse, keyboard,
    and

    pointer input.

    '
  description: 'This method creates a `Class.VirtualInput` object for simulating mouse,

    keyboard, and pointer input as if it were performed by a real user. It is

    intended for testing and automation workflows that need to simulate user

    interaction inside a running experience. Simulated input is restricted to

    the experience''s own UI elements and cannot interact with arbitrary or

    system-level GUI.


    Always check that the returned value is not `nil` before calling any

    methods on it.

    '
  code_samples: []
  parameters:
  - name: target
    type: Instance
    default: nil
    summary: 'Optional. The window to send input to instead of the main viewport,

      such as a `Class.DockWidgetPluginGui`. Must be a

      `Class.LayerCollector` in the same `Class.DataModel`. If `nil`, input

      goes to the main viewport.

      '
  returns:
  - type: Object
    summary: 'A new `Class.VirtualInput` object, or `nil` if the feature is not

      available.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: UserInputService:GamepadSupports
  summary: 'Returns whether the given `Enum.UserInputType` gamepad supports a button

    corresponding with the given `Enum.KeyCode`.

    '
  description: 'This method returns whether the given `Enum.UserInputType` gamepad

    supports a button corresponding with the given `Enum.KeyCode`.

    '
  code_samples: []
  parameters:
  - name: gamepadNum
    type: UserInputType
    default: null
    summary: 'The `Enum.UserInputType` of the gamepad.

      '
  - name: gamepadKeyCode
    type: KeyCode
    default: null
    summary: 'The `Enum.KeyCode` of the button in question.

      '
  returns:
  - type: boolean
    summary: 'Whether the given gamepad supports a button corresponding with the

      given `Enum.KeyCode`.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: UserInputService:GetConnectedGamepads
  summary: 'Returns an array of `Enum.UserInputType` gamepads currently connected.

    '
  description: 'This method returns an array of `Enum.UserInputType` gamepads currently

    connected. If no gamepads are connected, the array will be empty.


    Alternatively to detecting all gamepads, the

    `Class.UserInputService.PreferredInput|PreferredInput` property can be

    used to more accurately reflect which input (mouse/keyboard, touch,

    gamepad, etc.) the player is likely using as the **primary** input.

    '
  code_samples: []
  parameters: []
  returns:
  - type: Array
    summary: 'An array of `Enum.UserInputType|UserInputTypes` corresponding with the

      gamepads connected to the user''s device.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: UserInputService:GetDeviceAcceleration
  summary: 'Returns an `Class.InputObject` that describes the device''s current

    acceleration.

    '
  description: 'This method returns an `Class.InputObject` that describes the device''s

    current acceleration. For this to function, the user''s device must have an

    enabled accelerometer as queried through the

    `Class.UserInputService.AccelerometerEnabled|AccelerometerEnabled`

    property.


    To track when the device''s acceleration changes, use the

    `Class.UserInputService.DeviceAccelerationChanged|DeviceAccelerationChanged`

    event.

    '
  code_samples:
  - UserInputService-GetDeviceAcceleration
  parameters: []
  returns:
  - type: InputObject
    summary: 'An `Class.InputObject` describing the device''s current acceleration,

      with `Class.InputObject.Position|Position` representing the

      acceleration force on each local device axis.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: UserInputService:GetDeviceGravity
  summary: 'Returns an `Class.InputObject` describing the device''s current gravity

    vector.

    '
  description: "This method returns an `Class.InputObject` describing the device's\
    \ current\ngravity vector. The vector is determined by the device's orientation\n\
    relative to the real-world force of gravity. For example:\n\n- `Datatype.Vector3|Vector3.new(0,\
    \ 0, -9.81)` if the device is perfectly\n  upright (portrait)\n- `Datatype.Vector3|Vector3.new(9.81,\
    \ 0, 0)` if the left side of the\n  device is pointing down\n- `Datatype.Vector3|Vector3.new(0,\
    \ -9.81, 0)` if the back of the device is\n  pointing down\n\nGravity is only\
    \ tracked for devices with an enabled gyroscope as queried\nthrough `Class.UserInputService.GyroscopeEnabled|GyroscopeEnabled`.\n\
    \nTo track when the device's gravity changes, use the\n`Class.UserInputService.DeviceGravityChanged|DeviceGravityChanged`\
    \ event.\n"
  code_samples:
  - UserInputService-GetDeviceGravity
  parameters: []
  returns:
  - type: InputObject
    summary: 'An `Class.InputObject` describing the device''s current gravity vector,

      with `Class.InputObject.Position|Position` representing the force of

      gravity on each local device axis.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: UserInputService:GetDeviceRotation
  summary: 'Returns an `Class.InputObject` and a `Datatype.CFrame` describing the

    device''s current rotation vector.

    '
  description: 'This method returns an `Class.InputObject` and a `Datatype.CFrame`

    describing the device''s current rotation vector.


    Device rotation is only tracked for devices with an enabled gyroscope as

    queried through

    `Class.UserInputService.GyroscopeEnabled|GyroscopeEnabled`.

    '
  code_samples:
  - UserInputService-GetDeviceRotation
  parameters: []
  returns:
  - type: Tuple
    summary: 'A tuple containing two properties: The delta describing the amount of

      rotation that last happened, and the `Datatype.CFrame` of the device''s

      current rotation relative to its default reference frame.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: UserInputService:GetFocusedTextBox
  summary: 'Returns the `Class.TextBox` the client is currently focused on.

    '
  description: 'This method returns the `Class.TextBox` the client is currently focused

    on. A `Class.TextBox` can be manually selected by the user, or selection

    can be forced using the `Class.TextBox:CaptureFocus()` method. If no

    `Class.TextBox` is selected, this method will return `nil`.

    '
