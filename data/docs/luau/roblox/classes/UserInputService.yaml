- name: UserInputService.PreferredInput
  summary: 'Queries the primary input type a player is using, based on anticipated

    user behavior.

    '
  description: "This read-only property lets you query the **primary** input type\
    \ a player\nis likely using, based on anticipated user behavior, to ensure UI\
    \ elements\nlike on‑screen buttons and menus work elegantly across devices. For\n\
    example, a touch‑enabled device assumes touch is the default input and\nthat touch\
    \ buttons may appear for actions, but if a player connects an\nadditional bluetooth\
    \ keyboard/mouse or gamepad, you can assume they want\nto switch to that as the\
    \ primary input type and possibly use touch as a\nbackup input for on‑screen UI.\n\
    \nThe value of `PreferredInput` changes based on built‑in device inputs and\n\
    the player's most recent interaction with a connected gamepad or\nkeyboard/mouse.\
    \ Examples include:\n\n<table>\n  <thead>\n    <tr>\n      <th>Real-World Scenario</th>\n\
    \      <th><code>PreferredInput</code></th>\n    </tr>\n  </thead>\n  <tbody>\n\
    \    <tr>\n      <td>Player is using a phone with no other connected input devices;\
    \ no possibility of an input type change.</td>\n      <td><code>Enum.PreferredInput|Touch</code></td>\n\
    \    </tr>\n    <tr>\n      <td>Player is using a mobile device with a bluetooth\
    \ keyboard & mouse connected, but no gamepad is connected.</td>\n      <td><code>Enum.PreferredInput|KeyboardAndMouse</code></td>\n\
    \    </tr>\n    <tr>\n      <td>Player is using a tablet with a bluetooth gamepad\
    \ connected, but no keyboard or mouse is connected.</td>\n      <td><code>Enum.PreferredInput|Gamepad</code></td>\n\
    \    </tr>\n    <tr>\n      <td>Player is using an Xbox or PlayStation with a\
    \ bluetooth keyboard & mouse connected and has most recently interacted with the\
    \ keyboard or mouse.</td>\n      <td><code>Enum.PreferredInput|KeyboardAndMouse</code></td>\n\
    \    </tr>\n    <tr>\n      <td>Player is on a Windows or Mac PC with a gamepad\
    \ connected and has most recently interacted with the gamepad.</td>\n      <td><code>Enum.PreferredInput|Gamepad</code></td>\n\
    \    </tr>\n  </tbody>\n</table>\n"
  code_samples:
  - UserInputService-PreferredInput
  type: PreferredInput
  tags:
  - ReadOnly
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
