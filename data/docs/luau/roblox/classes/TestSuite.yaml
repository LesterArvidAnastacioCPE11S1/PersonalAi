- name: TestSuite:RegisterTest
  summary: 'Registers a test in this suite.

    '
  description: "Registers a test in this suite. It works like\n`Class.TestService:RegisterTest()`,\
    \ except that the test belongs to this\nsuite instead of the `Default` suite and\
    \ starts with the suite's settings:\n\n- The test's tags are its own `Tags` plus\
    \ the suite's tags.\n- The test uses the suite's `Class.TestSuite.TimeoutSec|TimeoutSec`\
    \ unless\n  it sets its own.\n\nThrows an error if `Class.TestService.Enabled`\
    \ is `false`, if `testName`\nis empty or is already registered in this suite,\
    \ if `Tags` isn't an array\nof strings, or if `TimeoutSec` isn't a number from\
    \ `0` to `86400`.\n"
  code_samples: []
  parameters:
  - name: testName
    type: string
    default: null
    summary: 'The name of the test. Must not be empty or already used in this suite.

      '
  - name: callback
    type: Function
    default: null
    summary: 'The function that runs the test. It receives the test''s

      `Class.TestCase` and a `Class.TestExecutionContext`.

      '
  - name: options
    type: Dictionary
    default: nil
    summary: 'Optional settings for the test: `Tags` (an array of strings) and

      `TimeoutSec` (a number of seconds).

      '
  returns:
  - type: TestCase
