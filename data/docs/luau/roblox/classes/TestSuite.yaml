name: TestSuite
type: class
memory_category: Instances
summary: 'A named group of tests that share tags and a timeout.

  '
description: "A `TestSuite` groups related tests. Create one with\n`Class.TestService:RegisterSuite()`\
  \ and add tests to it with\n`Class.TestSuite:RegisterTest()|RegisterTest()`. Every\
  \ test in the suite gets\nthe suite's tags and timeout, and the `Suite` filter of\n\
  `Class.TestService:RunTestsAsync()` runs the whole suite.\n\nA `TestSuite` isn't\
  \ an `Class.Instance` and can't be parented.\n\n```lua\nlocal ReplicatedStorage\
  \ = game:GetService(\"ReplicatedStorage\")\nlocal TestService = game:GetService(\"\
  TestService\")\n\nlocal Inventory = require(ReplicatedStorage.Inventory)\n\nlocal\
  \ inventory = TestService:RegisterSuite(\"Inventory\", { Tags = { \"data\" }, TimeoutSec\
  \ = 10 })\n\ninventory:RegisterTest(\"starts empty\", function(test)\n\ttest:Check(#Inventory.new():GetItems(),\
  \ 0)\nend)\n\n-- Overrides the suite's timeout and adds a tag\ninventory:RegisterTest(\"\
  loads saved items\", function(test)\n\tlocal items = Inventory.load(123):GetItems()\n\
  \ttest:Check(#items, 3)\nend, { Tags = { \"slow\" }, TimeoutSec = 30 })\n\nTestService:RunTestsAsync({\
  \ Suite = \"Inventory\" })\n```\n"
