  summary: 'A reference to the `Class.ChatWindowMessageProperties` that overrides
    the

    appearance of this message in the chat window.

    '
  description: 'A reference to the `Class.ChatWindowMessageProperties` instance that

    overrides `Class.ChatWindowConfiguration` properties for this individual

    message as displayed in the chat window.


    This property is `nil` by default. It is populated when your

    `Class.TextChatService.OnChatWindowAdded` callback returns a

    `Class.ChatWindowMessageProperties` instance, typically created with

    `Class.ChatWindowConfiguration:DeriveNewMessageProperties()`: the returned

    instance is stored here on the resulting `Class.TextChatMessage`. Any

    properties set on it take precedence over the shared

    `Class.ChatWindowConfiguration` when the message is rendered.

    '
