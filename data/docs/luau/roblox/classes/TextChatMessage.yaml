- name: TextChatMessage.BubbleChatMessageProperties
  summary: 'A reference to the `Class.BubbleChatMessageProperties` that overrides
    the

    appearance of this message''s chat bubble.

    '
  description: 'A reference to the `Class.BubbleChatMessageProperties` instance that

    overrides `Class.BubbleChatConfiguration` properties for this individual

    message''s chat bubble.


    This property is `nil` by default. It is populated when your

    `Class.TextChatService.OnBubbleAdded` callback returns a

    `Class.BubbleChatMessageProperties` instance: the returned instance is

    stored here on the resulting `Class.TextChatMessage`. Any properties set

    on it take precedence over the shared `Class.BubbleChatConfiguration` when

    the message''s bubble is rendered.

    '
