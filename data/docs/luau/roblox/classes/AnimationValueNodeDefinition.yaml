summary: 'A node within an animation graph that outputs one or more values instead
  of an

  animation pose.

  '
description: 'Represents a node in an animation graph that outputs one or more values

  instead of an animation pose, unlike `Class.AnimationNodeDefinition`. Each

  output is exposed as a child `Class.AnimationValueOutputDefinition` instance;

  other nodes consume it by pointing an `Class.ObjectValue` wire at that

  instance.

  '
