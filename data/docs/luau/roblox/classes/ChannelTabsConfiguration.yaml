- name: ChannelTabsConfiguration.BackgroundTransparency
  summary: 'Background transparency of the channel tabs.

    '
  description: 'Background transparency of the channel tabs as a number between `0`
    and

    `1`. This value is multiplied with the user''s

    `Class.GuiService.PreferredTransparency` to create the effective

    background transparency used by the channel tabs, which may be more opaque

    than this value set here. Default value is `0`.

    '
