- name: ChannelTabsConfiguration.BackgroundColor3
  summary: 'Background color of the channel tabs.

    '
  description: 'Background color of the channel tabs. If the background color is not

    overridden, this value will respect the user''s

    `Class.GuiService.PreferredTransparency` by making the menu more gray as

    the transparency of the menu decreases. Default value is

    `Datatype.Color3|Color3.new(25, 27, 29)`.

    '
