name: SpecialMesh
type: class
memory_category: BaseParts
summary: 'The `Class.SpecialMesh` object applies a mesh to a `Class.BasePart` depending

  on the `Class.SpecialMesh.MeshType|MeshType` property.

  '
description: "The `Class.SpecialMesh` object applies a mesh to a `Class.BasePart`\
  \ depending\non the `Class.SpecialMesh.MeshType|MeshType` property. A number of\
  \ options are\navailable.\n\n- **Brick** - A block shape, equivalent to a `Class.BlockMesh`\n\
  - **Cylinder** - A cylinder, identical to a `Class.Part` with a\n  `Class.Part.Shape`\
  \ of 'Cylinder'\n- **FileMesh** - A user uploaded Mesh, equivalent to `Class.FileMesh`\
  \ that a\n  texture can be applied to using the `Class.FileMesh.TextureId` property\n\
  - **Head** - A character head shape\n- **Sphere** - A sphere shape, similar to a\
  \ `Class.Part` with a\n  `Class.Part.Shape` of 'Ball' but can be freely resized\
  \ on all axis\n- **Wedge** - A wedge shape, identical to a `Class.WedgePart`\n-\
  \ **Torso** - A block with sloped sides, due to be deprecated\n\nNote, each `Class.SpecialMesh.MeshType`\
  \ will scale differently when using\n`Class.DataModelMesh.Scale`, for more information\
  \ on this please see the page\non `Class.DataModelMesh.Scale`. The SpecialMesh object\
  \ also exposes the\n`Class.DataModelMesh.Offset` property.\n\nIt is important to\
  \ remember that when using a SpecialMesh, only the appearance\nof a part changes.\
  \ The collision model of the part remains the same. For\nexample, a character will\
  \ not be able to walk correctly over a mesh as the\nmesh geometry is not taken into\
  \ account.\n\n#### SpecialMesh vs MeshPart\n\nThere are currently two ways of using\
  \ a developer created mesh. They are using\na SpecialMesh with the `Class.SpecialMesh.FileType`\
  \ set to 'FileMesh', or by\nusing a `Class.MeshPart`. Although, on the whole, the\
  \ `Class.MeshPart` object\nhas superseded the SpecialMesh there are some differences\
  \ developers should be\naware of.\n\n- `Class.BasePart.Material` displays correctly\
  \ on the mesh when using a\n  `Class.MeshPart` and not when using a SpecialMesh\n\
  - `Class.MeshPart|MeshParts` include the `Class.MeshPart.CollisionFidelity`\n  property,\
  \ meaning the collision model of a `Class.MeshPart` can be set to\n  resemble the\
  \ geometry of the mesh. The SpecialMesh object by contrast, uses\n  the parent `Class.BasePart|BaseParts`\
  \ collision model\n- The mesh of a `Class.MeshPart` scales on all axis depending\
  \ on the\n  `Class.BasePart.Size|Size` property of the `Class.MeshPart`, the mesh\
  \ of a\n  SpecialMesh does not\n- The SpecialMesh object includes the `Class.DataModelMesh.Offset|Offset`\
  \ and\n  `Class.DataModelMesh.Scale|Scale` properties whereas\n  `Class.MeshPart|MeshParts`\
  \ do not\n- The `Class.FileMesh.MeshId|MeshId` property of a `Class.SpecialMesh`\
  \ can be\n  changed by a `Class.Script` or `Class.LocalScript` during runtime. The\n\
  \  `Class.MeshPart.MeshId|MeshId` property of a `Class.MeshPart` can not.\n"
