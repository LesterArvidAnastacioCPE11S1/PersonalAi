  open_cloud_equivalents:
  - path: POST /cloud/v2/universes/{universe_id}:publishMessage
    relationship: equivalent_full
    note: MessagingService:PublishAsync and POST /cloud/v2/universes/{universe_id}:publishMessage
      both publish one message to one topic in an experience's universe; the Engine
      uses a persistent WebSocket connection while Open Cloud uses an HTTP request.
- name: MessagingService:SubscribeAsync
  summary: 'Begins listening to the given topic.

    '
  description: "This function registers a callback to begin listening to the given\
    \ topic.\nThe callback is invoked when a topic receives a message. It can be called\n\
    multiple times for the same topic.\n\n#### Callback\n\nThe callback is invoked\
    \ with a single argument, a table with the following\nentries:\n\n<table>\n\t\
    <thead>\n\t\t<tr>\n\t\t\t<th>Field</th>\n\t\t\t<th>Summary</th>\n\t\t</tr>\n\t\
    </thead>\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t\t<b>Data</b>\n\t\t\t</td>\n\t\
    \t\t<td>\n\t\t\t\tDeveloper supplied payload\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\
    \t\t\t<td>\n\t\t\t\t<b>Sent</b>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t\tUnix time in\
    \ seconds at which the message was sent\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n\
    </table>\n\nIt yields until the subscription is properly registered and returns\
    \ a\nconnection object.\n\nTo unsubscribe, call `Datatype.RBXScriptConnection|Disconnect()`\
    \ on the\nreturned object. Once called, the callback should never be invoked.\n\
    Killing the script containing the connections also causes the underlying\nconnect\
    \ to be unsubscribed.\n\nSee also `Class.MessagingService:PublishAsync()` which\
    \ sends the provided\nmessage to all subscribers to the topic, triggering their\
    \ registered\ncallbacks to be invoked.\n"
  code_samples:
  - subscribing-to-cross-server-messages
  parameters:
  - name: topic
    type: string
    default: null
    summary: 'Determines where to listen for messages.

      '
  - name: callback
    type: Function
    default: null
    summary: 'Function to be invoked whenever a message is received.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'Connection that can be used to unsubscribe from the topic.

      '
  tags:
  - Yields
