name: MessagingService
type: class
memory_category: Instances
summary: 'Allows servers of the same experience to communicate with each other.

  '
description: "**MessagingService** allows servers of the same experience to communicate\
  \ with\neach other in real time, typically within 1-2 seconds, using topics. Topics\n\
  are developer‑defined strings (1–80 characters) that servers use to send and\nreceive\
  \ messages.\n\nDelivery is best effort and not guaranteed. Make sure to architect\
  \ your\nexperience so delivery failures are not critical.\n\n[Cross-Server Messaging](../../../cloud-services/cross-server-messaging.md)\n\
  explores how to communicate between servers in greater detail.\n\nIf you want to\
  \ publish ad-hoc messages to live game servers, or publish across\nexperiences,\
  \ you can use the\n[Open Cloud APIs](../../../cloud/guides/usage-messaging.md).\n\
  \n#### Limitations\n\nNote that these limits are subject to change.\n\n<table>\n\
  \t<thead>\n\t\t<tr>\n\t\t\t<th>Limit</th>\n\t\t\t<th>Maximum</th>\n\t\t</tr>\n\t\
  </thead>\n\t<tbody>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t\t<b>Size of message</b>\n\t\t\t\
  </td>\n\t\t\t<td>\n\t\t\t\t1kB\n\t\t\t</td>\n\t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\
  \t\t\t<b>Messages sent per game server</b>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t\t 600\
  \ + 240 * (number of players in this game server) per minute\n\t\t\t</td>\n\t\t\
  </tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t\t<b>Messages received per topic</b>\n\t\t\t\
  </td>\n\t\t\t<td>\n\t\t\t\t(40 + 80 * number of servers) per minute\n\t\t\t</td>\n\
  \t\t</tr>\n\t\t<tr>\n\t\t\t<td>\n\t\t\t\t<b>Messages received for entire game</b>\n\
  \t\t\t</td>\n\t\t\t<td>\n\t\t\t\t (400 + 200 * number of servers) per minute\n\t\
  \t\t</td>\n\t\t</tr>\n    <tr>\n\t\t\t<td>\n\t\t\t\t<b>Subscriptions allowed per\
  \ game server</b>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t\t 20 + 8 * (number of players\
  \ in this game server)\n\t\t\t</td>\n\t\t</tr>\n    <tr>\n\t\t\t<td>\n\t\t\t\t<b>Subscribe\
  \ requests per game server</b>\n\t\t\t</td>\n\t\t\t<td>\n\t\t\t\t 240 requests per\
  \ minute\n\t\t\t</td>\n\t\t</tr>\n\t</tbody>\n</table>\n"
