- name: Chat:CanUserChatAsync
  summary: 'Will return false if the player with the specified `Class.Player.UserId`

    is not allowed to chat because of their account settings.

    '
  description: 'Returns whether the player identified by `userId` is permitted to
    use

    in-game text chat. The check evaluates the player''s chat privacy mode,

    third-party platform restrictions, and any active moderation timeouts.


    On the server, the specified player must be connected to the current

    server; otherwise the call errors. On the client, the method must be

    called only for the local player''s `Class.Player.UserId`.

    '
  code_samples: []
