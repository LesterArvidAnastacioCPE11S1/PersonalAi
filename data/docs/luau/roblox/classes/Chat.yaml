- name: Chat:Chat
  summary: 'Fires the `Class.Chat.Chatted` event with the parameters specified in
    this

    method.

    '
  description: 'The Chat function fires the `Class.Chat.Chatted` event with the parameters

    specified in this method.


    By default, there is a `Class.LocalScript` inside of each player''s

    `Class.PlayerScripts` object named _BubbleChat_, which causes a

    dialog-like billboard to appear above the _partOrCharacter_ when the

    chatted event is fired.


    _Note:_ Since dialogs are controlled by a LocalScript, you will not be

    able to see any dialogs created from this method unless you are running in

    _Play Solo_ mode.

    '
  code_samples:
  - Chat-Chat1
  parameters:
  - name: partOrCharacter
    type: Instance
    default: null
    summary: 'An instance that is the part or character which the _BubbleChat_

      dialog should appear above.

      '
  - name: message
    type: string
    default: null
    summary: 'The message string being chatted.

      '
  - name: color
    type: ChatColor
    default: Blue
    summary: 'An `Enum.ChatColor` specifying the color of the chatted message.

