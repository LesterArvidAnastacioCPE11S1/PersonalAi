- name: Chat:InvokeChatCallback
  summary: 'Invoke a chat callback function registered by

    `Class.Chat:RegisterChatCallback()|RegisterChatCallback`. Used by the Luau

    Chat System.

    '
  description: 'InvokeChatCallback will call a function registered by

    `Class.Chat:RegisterChatCallback()|RegisterChatCallback`, given the

    ChatCallbackType enum and the arguments to send the function. It will

    return the result of the registered function, or raise an error if no

    function has been registered.


    This function is called by the Luau Chat System so that chat callbacks may

    be registered to change the behavior of certain features. Unless you are

    replacing the default Luau Chat System with your own, you should not need

    to call this function. You can read about the different callback functions

    at `Class.Chat:RegisterChatCallback()`.

    '
  code_samples: []
  parameters:
  - name: callbackType
    type: ChatCallbackType
    default: null
    summary: 'The type of callback to invoke.

      '
  - name: callbackArguments
    type: Tuple
    default: null
    summary: 'The arguments that will be sent to the registered callback function.

      '
  returns:
  - type: Tuple
    summary: 'The values returned by the function registered to the given

      ChatCallbackType.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Chat
- name: Chat:RegisterChatCallback
  summary: 'Register a function to be called upon the invocation of some chat system

    event (`Class.Chat:InvokeChatCallback()|InvokeChatCallback`).

    '
  description: "RegisterChatCallback binds a function to some chat system event in\
    \ order\nto affect the behavior of the Luau chat system. The first argument\n\
    determines the event (using the `Enum.ChatCallbackType` enum) to which the\nsecond\
    \ argument, the function, shall be bound. The default Luau chat\nsystem uses `Class.Chat:InvokeChatCallback()|InvokeChatCallback`\
    \ to invoke\nregistered functions. Attempting to register a server- or client-\
    \ only\ncallback on a peer that isn't a server or client respectively will raise\n\
    an error. The following sections describe in what ways registered\nfunctions will\
    \ be used.\n\n#### OnCreatingChatWindow\n\nClient-only. Invoked before the client\
    \ constructs the chat window. Must\nreturn a table of settings to be merged into\
    \ the information returned by\nthe ChatSettings module.\n\n#### OnClientFormattingMessage\n\
    \nClient-only. Invoked before the client displays a message (whether it is a\n\
    player chat message, system message, or /me command). This function is\ninvoked\
    \ with the message object and may (or may not) return a table to be\nmerged into\
    \ `message.ExtraData`.\n\n#### OnClientSendingMessage\n\nNot invoked at this time.\n\
    \n#### OnServerReceivingMessage\n\nServer-only. Invoked when the server receives\
    \ a message from a speaker\n(note that speakers may not necessarily be a `Class.Player`\
    \ chatting).\nThis callback is called with the Message object. The function can\
    \ make\nchanges to the Message object to change the manner in which the message\
    \ is\nprocessed. **The Message object must be returned for this callback to do\n\
    anything.** Setting this callback can allow the server to, for example:\n\n- Set\
    \ `message.ShouldDeliver` to false in order to cancel delivery of the\n  message\
    \ to players (useful for implementing a chat exclusion list)\n- Get/set the speaker's\
    \ name color (`message.ExtraData.NameColor`, a\n  Color3) on a message-by-message\
    \ basis\n"
  code_samples: []
  parameters:
  - name: callbackType
    type: ChatCallbackType
    default: null
    summary: 'The callback to which the function shall be registered (this

      determines in what way the function is called).

      '
  - name: callbackFunction
    type: Function
    default: null
    summary: 'The function to call when the callback is invoked using

      Chat:InvokeChatCallback.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Chat
- name: Chat:SetBubbleChatSettings
  summary: 'Customizes various settings of the in-game bubble chat.

    '
  description: 'This function customizes various settings of the in-game bubble chat.


    Before using this, make sure that bubble chat is enabled by setting

    `Class.Chat.BubbleChatEnabled` to true.


    The settings argument is a table where the keys are the names of the

    settings you want to edit and the values are what you want to change these

    settings to. Note that you don''t have to include all of them in the

    settings argument, omitting some will result in them keeping their default

    value.


    This function is client-side only, attempting to call it on the server

    will trigger an error.

    '
  code_samples:
  - customize-visual-aspects
  - restore-default-settings
  parameters:
  - name: settings
    type: Variant
    default: null
    summary: 'A settings table.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Chat
