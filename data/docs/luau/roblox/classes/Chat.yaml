  security: None
  thread_safety: Unsafe
  capabilities:
  - Chat
- name: Chat:CanUsersChatAsync
  summary: 'Will return false if the two users cannot communicate because their

    account settings do not allow it.

    '
  description: 'Returns whether two players are permitted to exchange chat messages
    with

    each other. The method evaluates user blocking, age-based communication

    constraints, and chat privacy mode compatibility between the two accounts.


    This method can only be called from server-side `Class.Script|Scripts`.

    Both players must be connected to the current server; otherwise the call

    errors.

    '
