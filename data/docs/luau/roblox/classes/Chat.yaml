name: Chat
type: class
memory_category: Instances
summary: 'Houses the Luau code responsible for running the legacy chat system.

  '
description: 'The **Chat** service houses the Luau code responsible for running the

  [legacy chat system](../../../chat/in-experience-text-chat.md#migrate-from-legacy-chat).

  Similar to `Class.StarterPlayerScripts`, default objects like

  `Class.Script|Scripts` and `Class.ModuleScript|ModuleScripts` are inserted

  into the service.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: 'This class is deprecated. Use `Class.TextChatService` instead.

  '
properties:
- name: Chat.BubbleChatEnabled
  summary: 'Determines whether player''s chat messages will appear above their in-game

    avatar.

    '
  description: 'If true, entering a message in the chat will result in a chat bubble

    popping up above the player''s `Class.Player.Character`. This behavior can

    either be enabled by directly ticking this checkbox in Studio, or by using

    a `Class.LocalScript`:


    ```lua

    local ChatService = game:GetService("Chat")

    ChatService.BubbleChatEnabled = true

    ```


    This must be done on the client, toggling this value in a server-side

    `Class.Script` will have no effect.

    '
  code_samples: []
  type: boolean
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Behavior
  serialization:
    can_load: true
    can_save: true
  capabilities:
  - Chat
- name: Chat.LoadDefaultChat
  summary: 'Toggles whether the default chat framework should be automatically loaded

    when the game runs.

    '
  description: 'When set to `true` (the default), the engine inserts the default Luau
    chat

    system scripts (such as `ChatScript` and `BubbleChat`) into the `Chat`

    service at runtime. Setting this to `false` prevents the legacy chat

    framework from loading, which is useful if you are replacing it with a

    custom chat implementation or migrating to `Class.TextChatService`.


    This property defaults to `true`. It is not writable by scripts at

    runtime.

    '
  code_samples: []
