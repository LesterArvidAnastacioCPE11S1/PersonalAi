events:
- name: Chat.Chatted
  summary: 'Fires when `Class.Chat:Chat()` is called.

    '
  description: 'Fires when `Class.Chat:Chat()` is called. The event passes the part
    or

    character the message is associated with, the message string, and the

    `Enum.ChatColor`. When fired on the server, the event replicates to all

    connected clients. The default `BubbleChat` `Class.LocalScript` listens

    for this event and displays a chat bubble above the specified part or

    character.

    '
