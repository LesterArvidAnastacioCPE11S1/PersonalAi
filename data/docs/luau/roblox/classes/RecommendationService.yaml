name: RecommendationService
type: class
memory_category: Instances
summary: 'A service that provides an interface for you to manage and display

  personalized content recommendations.

  '
description: '`RecommendationService` provides an interface for you to manage and
  display

  personalized content recommendations. It supports creating, retrieving,

  updating, and deleting recommendation items, as well as generating lists of

  recommended content for users. Additionally, it includes functionality for

  logging user interactions, such as views and actions, to help refine and

  improve recommendation quality. Once set up, you can monitor analytics in the

  Creator Dashboard under the **Engagement** section for an experience.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
deprecation_message: ''
properties: []
methods:
- name: RecommendationService:GenerateItemListAsync
  summary: 'Returns a paginated list of personalized recommendation items for the

    specified request configuration.

    '
  description: "This function returns a paginated list of recommended items based\
    \ on a\ngiven request. The request can specify criteria such as configuration\n\
    name, location, and page size to tailor the recommendations. It returns a\n`Class.RecommendationPages`\
    \ object that can be used to iterate through the\nlist of items.\n\nThe `ConfigName`\
    \ parameter determines how the recommendation engine ranks\nand returns items.\
    \ For example, you can have configurations that optimize\nfor views, likes, or\
    \ purchases. For the ranking to be effective, you must\nensure that you are logging\
    \ the corresponding user interactions using\n`Class.RecommendationService.LogImpressionEvent|LogImpressionEvent`\
    \ and\n`Class.RecommendationService.LogActionEvent|LogActionEvent`.\n\nSupported\
    \ `ConfigName` are:\n\n- `MaximizeTimespent`: Optimizes recommendations to prioritize\
    \ content\n  that engages users for longer periods.\n- `MaximizeReactions`: Optimizes\
    \ recommendations to highlight content that\n  generates the most user reactions,\
    \ such as likes and favorites.\n- `MaximizePlays`: Optimizes recommendations to\
    \ prioritize content that\n  generates the most `Play` actions. To use this configuration\n\
    \  effectively, you must log both impressions and `Play` actions. It's\n  recommended\
    \ to filter for \"quality\" plays (for example play duration\n  greater than 60\
    \ seconds) before logging to reduce noise and improve the\n  system's learning\
    \ accuracy.\n- `MaximizeEngagement`: Optimizes recommendations through a balanced\n\
    \  approach that considers multiple engagement signals, including quality\n  views\
    \ and reactions. This config is designed to highlight content that\n  performs\
    \ well across different engagement areas.\n- `PlayerSpecific`: Returns public\
    \ items created by the player specified\n  in the request and sorted by the most\
    \ recent creation time. To use this\n  config, you must pass the `UserId` in the\
    \ `CustomContexts`.\n- `RecentlyAdded`: Returns items sorted by how recent they\
    \ are, and\n  displays the most recently added public content first.\n- `MaximizeJoins`:\
    \ Optimizes recommendations to prioritize game joins.\n  This configuration is\
    \ exclusive to Roblox Moments and focuses on\n  maximizing interactions leading\
    \ to a teleport. In contrast,\n  `MaximizePlays` is purely optimizing `Play` actions.\n\
    - `PlayerOwnedItems`: Displays the user's own creations sorted by creation\n \
    \ time. This config requires user authentication because it displays\n  private\
    \ items. This config is only available on the **client**.\n\nThis function can\
    \ be called from both the **server** and the **client**.\nWhen called from the\
    \ server, you must pass the `UserId` in the\n`CustomContexts`.\n"
  code_samples:
  - GenerateItemListAsync-example
  parameters:
  - name: generateRecommendationItemListRequest
    type: Dictionary
    default: null
    summary: "A dictionary containing the following fields:\n\n- `ConfigName` &mdash;\
      \ A unique ID for the specific configuration.\n  This determines how the candidates\
      \ are ranked.\n- `LocationId` &mdash; A developer-defined string that specifies\
      \ the\n  location where the recommendation is used, such as `\"For_you\"` or\n\
      \  `\"Lobby\"`. This parameter will not affect the items returned, and it\n\
      \  can help you track the performance of multiple recommendation\n  features\
      \ within your experience. Recommendation metrics for each\n  individual location\
      \ will be displayed in the Creator Hub.\n  `LocationId` **must** be a string\
      \ and cannot be `\"Other\"` or\n  `\"other\"` as these values are reserved by\
      \ the Creator Hub.\n- `PageSize` &mdash; The number of items returned for each\
      \ page.\n- `BoostCustomTags` &mdash; A list of string tags. Any item with this\n\
      \  tag will be boosted in ranking. Supports boosting one tag.\n- `CustomContexts`\
      \ &mdash; A table of key-value pairs used to pass in\n  additional context data\
      \ for ranking. For example, `UserId` for a\n  Server script.\n"
  returns:
  - type: RecommendationPages
    summary: 'A `RecommendationPages` object containing the paginated list of

      recommended items for the given request configuration.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RecommendationService:GetRecommendationItemAsync
  summary: 'Retrieves a single registered recommendation item by its `ItemId`.

    '
  description: 'This function returns a single recommendation item by its `ItemId`.
    This

    is useful for getting the details of a specific item without having to

    fetch a whole list.


    This function can be called only from the **server**.

    '
  code_samples:
  - GetRecommendationItemAsync-example
  parameters:
  - name: itemId
    type: string
    default: null
    summary: 'The ID of the item to retrieve.

      '
  returns:
  - type: Dictionary
    summary: "A dictionary representing the recommendation item with the following\n\
      fields:\n\n- `ItemId` &mdash; The unique ID for the item.\n- `ReferenceId` &mdash;\
      \ The developer-provided ID for the item.\n- `TracingId` &mdash; An ID for tracking\
      \ recommendation sessions. This\n  will be empty when fetching a single item\
      \ directly.\n- `Creator` &mdash; A table containing the `CreatorId` and\n  `CreatorType`.\n\
      - `Attributes` &mdash; A list of content attributes associated with\n  the item.\n\
      - `CustomTags` &mdash; A list of custom string tags.\n- `Visibility` &mdash;\
      \ An enum of type\n  `Enum.RecommendationItemVisibility|RecommendationItemVisibility`.\n"
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RecommendationService:LogActionEvent
  summary: 'Logs a user action, such as a reaction or play, taken on a recommended

    item.

    '
  description: 'This function logs a user action on a recommended item, such as a
    "like,"

    "share," or "purchase." It requires the `itemId` of the item and a

    `tracingId` from the GenerateItemListAsync response to link the action to

    a specific recommendation context. Additional details about the action can

    be provided in the `actionEventDetails` dictionary.


    Logging actions is essential for recommendation configurations that rank

    items based on user engagement such as number of likes or purchases.


    This function can only be called from the **client**.


    **Note:** Only `LogActionEvent` calls in production actually log actions.

    Calling this function in Studio doesn''t have any effect; you can call it

    as many times as you want when testing.

    '
  code_samples:
  - LogActionEvent-example
  parameters:
  - name: actionType
    type: RecommendationActionType
    default: null
    summary: 'The enum for the type of action.

      '
  - name: itemId
    type: string
    default: null
    summary: 'The item ID returned from registration and

      `Class.RecommendationService.GenerateItemListAsync|GenerateItemListAsync`.

      '
  - name: tracingId
    type: string
    default: null
    summary: 'The tracing ID returned from the

      `Class.RecommendationService.GenerateItemListAsync|GenerateItemListAsync`

      response. Each item has a `TracingId`.

      '
  - name: actionEventDetails
    type: Dictionary
    default: nil
    summary: "A dictionary containing the following fields:\n\n- `Weight` &mdash;\
      \ A number representing the weight of the action.\n  Default is 1.\n- `DestinationPlaceId`\
      \ &mdash; The ID of the place the user was sent\n  to after the action. Used\
      \ for\n  `Enum.RecommendationActionType.Play|Play`.\n- `CommentText` &mdash;\
      \ Any text associated with the action, such as a\n  comment. Used for `Enum.RecommendationActionType.Comment|Comment`.\n\
      - `ReactionType` &mdash; A string describing the type of reaction, for\n  example,\
      \ \"like\" or \"dislike\". Used for\n  `Enum.RecommendationActionType.AddReaction|AddReaction`\
      \ or\n  `Enum.RecommendationActionType.RemoveReaction|RemoveReaction`.\n"
  returns:
  - type: ()
    summary: 'No return value.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RecommendationService:LogImpressionEvent
  summary: 'Logs an impression event, such as a user viewing a recommended item.

    '
  description: 'This function logs an impression event, such as a user viewing a

    recommended item. It requires the `itemId` and a `tracingId` to associate

    the impression with the recommendation context. Details like view duration

    and position can be passed in the `impressionEventDetails` dictionary to

    provide more context for the recommendation engine.


    Logging impressions, especially `Duration`, is critical for recommendation

    configurations that rank items based on view time.


    This function can only be called from the **client**.


    **Note:** Only `LogImpressionEvent` calls in production actually log

    impressions. Calling this function in Studio doesn''t have any effect; you

    can call it as many times as you want when testing.

    '
  code_samples:
  - LogImpressionEvent-example
  parameters:
  - name: impressionType
    type: RecommendationImpressionType
    default: null
    summary: 'The enum for the type of the impression.

      '
  - name: itemId
    type: string
    default: null
    summary: 'The item ID returned from registration and

      `Class.RecommendationService.GenerateItemListAsync|GenerateItemListAsync`.

      '
  - name: tracingId
    type: string
    default: null
    summary: 'The tracing ID returned from the

      `Class.RecommendationService.GenerateItemListAsync|GenerateItemListAsync`

      response. Each item has a `TracingId`.

      '
  - name: impressionEventDetails
    type: Dictionary
    default: nil
    summary: "A dictionary containing the following fields:\n\n- `Duration` &mdash;\
      \ The duration of the impression in seconds.\n- `Weight` &mdash; A number representing\
      \ the weight of the impression.\n  Default is 1.\n- `ItemPosition` &mdash; The\
      \ position of the item in the\n  recommendation list.\n- `DepartureIntent` &mdash;\
      \ The `Enum.RecommendationDepartureIntent`\n  indicating the user's intent when\
      \ leaving a view. For example,\n  `Positive` if the view is considered good.\n"
  returns:
  - type: ()
    summary: 'No return value.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RecommendationService:LogPreferenceEvent
  summary: 'Logs a user preference signal, such as follow or mute, toward a user,

    universe, or custom content tag.

    '
  description: 'This function logs a user preference signal, such as follow, unfollow,

    mute, or unmute, directed at another user, a universe, or a custom content

    tag. It requires a `preferenceType`, a `targetType`, and a `targetId`

    whose format depends on the target type: the user key for

    `Enum.RecommendationPreferenceTargetType.User|User`, the universe ID as a

    string for `Enum.RecommendationPreferenceTargetType.Universe|Universe`, or

    the tag string for

    `Enum.RecommendationPreferenceTargetType.CustomTag|CustomTag`. When the

    preference originates from a recommendation card served by

    `Class.RecommendationService.GenerateItemListAsync|GenerateItemListAsync`,

    pass the card''s `tracingId` and `itemId` to correlate the event with the

    recommendation context; otherwise pass empty strings for both.


    Logging preferences helps the recommendation engine personalize future

    results across every recommendation surface, not just item feeds.


    This function can only be called from the **client**.


    **Note:** Only `LogPreferenceEvent` calls in production actually log

    preferences. Calling this function in Studio doesn''t have any effect; you

    can call it as many times as you want when testing.

    '
  code_samples: []
  parameters:
  - name: preferenceType
    type: RecommendationPreferenceType
    default: null
    summary: 'The enum for the type of preference.

      '
  - name: targetType
    type: RecommendationPreferenceTargetType
    default: null
    summary: 'The enum for the type of target.

      '
  - name: targetId
    type: string
    default: null
    summary: 'The identifier of the preference target. The format depends on

      `targetType`.

      '
  - name: tracingId
    type: string
    default: null
    summary: 'The tracing ID returned from the

      `Class.RecommendationService.GenerateItemListAsync|GenerateItemListAsync`

      response. Pass an empty string if the preference originates outside a

      recommendation feed.

      '
  - name: itemId
    type: string
    default: null
    summary: 'The item ID returned from the

      `Class.RecommendationService.GenerateItemListAsync|GenerateItemListAsync`

      response. Pass an empty string if the preference originates outside a

      recommendation feed.

      '
  returns:
  - type: ()
    summary: 'No return value.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RecommendationService:RegisterItemAsync
  summary: 'Registers a new item on the server so it can be included in

    recommendations, returning the generated `ItemId` and `ReferenceId`.

    '
  description: "This function registers a new item to be included in recommendations.\
    \ It\nrequires a `player` object and a `registerRecommendationItemsRequest`\n\
    dictionary containing details about the item, such as its content type,\nreference\
    \ ID, and custom tags. It returns a dictionary with the `ItemId`\nand the `ReferenceId`\
    \ of the newly registered item.\n\nWhen selecting a `ContentType`, choose the\
    \ type that best represents your\nitem. Note that different content types are\
    \ not ranked against each other\ndirectly. Instead, they are mixed into the final\
    \ recommendation list based\non a configured ratio. For example, a configuration\
    \ might display one\n`Static` item for every ten items. If your experience only\
    \ features a\nsingle type of content, ensure that all registered items share the\
    \ same\n`ContentType`.\n\nThe `ItemId` is a unique ID returned by the `RecommendationService`.\
    \ All\nfunctions in the `RecommendationService` use the `ItemId` as input and\n\
    output.\n\nThe `ReferenceId` is a developer-provided identifier for an item. To\
    \ make\nsure that this reference ID is unique, we recommend that you use a UUID.\n\
    You can use this reference ID as a key to store rendering-specific\nmetadata in\
    \ a data store.\n\nWhen you register an item, you should only provide information\
    \ that is\nrelevant for ranking and recommendations. All other data needed for\n\
    rendering should be stored separately in, for example, a data store. This\napproach\
    \ decouples the recommendation logic from the rendering process,\nand results\
    \ in a system that is more modular and easier to maintain.\n\n`Attributes` is\
    \ a list of content attributes associated with the item.\nEach attribute in the\
    \ list can contain the following fields:\n\n- `AssetId` &mdash; The ID of an asset,\
    \ such as an image or video.\n- `Text` &mdash; A short text string, like a title.\n\
    - `Description` &mdash; A longer text description for the attribute.\n- `SeekStartTime`\
    \ / `SeekEndTime` &mdash; The start and end times for\n  seeking within video\
    \ content.\n- `TrimStartTime` / `TrimEndTime` &mdash; The start and end times\
    \ for\n  trimming video content.\n\nCommon Error Codes:\n\n- **HTTP 403 (Forbidden)**\
    \ &mdash; This error can occur when you call\n  `RegisterItemAsync` from Studio.\
    \ Even if you run it as a server script\n  in Studio, the request is not issued\
    \ from a Roblox server. To resolve\n  this, publish your experience and run it\
    \ in the Roblox client.\n- **HTTP 400 (Bad Request)** &mdash; This error indicates\
    \ that a parameter\n  is malformed. Common causes include a custom tag containing\
    \ a comma or\n  the `Attributes` table exceeding its size limit. If you encounter\
    \ a 400\n  error and have a large `Attributes` table, try reducing its size.\n\
    \  Remember to only include attributes that are relevant for ranking.\n\nThis\
    \ function can only be called from the **server**.\n"
  code_samples:
  - RegisterItemAsync-example
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The player who created the item.

      '
  - name: registerRecommendationItemsRequest
    type: Dictionary
    default: null
    summary: "A dictionary containing the following fields:\n\n- `ContentType` &mdash;\
      \ The `Enum.RecommendationItemContentType`\n  specifying the type of content.\
      \ Type is defined in a generic way.\n  For example, you can use `Static` for\
      \ images, `Dynamic` for videos,\n  and `Interactive` for 3D models that support\
      \ interaction.\n- `ReferenceId` &mdash; The developer-defined string that uniquely\n\
      \  identifies the item.\n- `Duration` &mdash; The duration of the content in\
      \ seconds.\n- `Attributes` &mdash; The table of attributes for the item, such\
      \ as\n  `AssetId` or `Description`.\n- `CustomTags` &mdash; The list of string\
      \ tags for filtering and\n  boosting. Individual custom tags can't contain commas.\n\
      - `Visibility` &mdash; The\n  `Enum.RecommendationItemVisibility|RecommendationItemVisibility`\n\
      \  enum that controls the item's visibility, such as `Public` or\n  `Private`.\n"
  returns:
  - type: Dictionary
    summary: 'A table with only two fields: `ItemId` and `ReferenceId`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RecommendationService:RemoveItemAsync
  summary: 'Removes a registered item from the recommendation system by its `ItemId`.

    '
  description: "This function removes an item from the recommendation system. It takes\
    \ the\n`itemId` of the item to be deleted as a parameter.\n\nThis function can\
    \ be called from both the **server** and the **client**,\nwith the following limitations:\n\
    \n- When called from the server, it can only remove items registered under\n \
    \ the same `universeId`.\n- When called from the client, it can only remove items\
    \ registered by the\n  current `player`.\n"
  code_samples:
  - RemoveItemAsync-example
  parameters:
  - name: itemId
    type: string
    default: null
    summary: 'The itemId to remove.

      '
  returns:
  - type: ()
    summary: 'No return value.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RecommendationService:UpdateItemAsync
  summary: 'Updates the mutable attributes of an existing recommendation item.

    '
  description: 'This function updates the attributes of an existing recommendation
    item.

    It takes an `updateRecommendationItemRequest` dictionary containing the

    `itemId` and the fields to be updated. Any fields not included in the

    request will remain unchanged.


    Items with their

    `Enum.RecommendationItemVisibility|RecommendationItemVisibility` set to

    `Private` are not recommended to other users, but they can still be

    returned when a user requests their own creations by using the

    `ConfigName` of `PlayerOwnedItems`.


    In Roblox Moments, moderated items are set to `Private`. While this

    prevents other users from seeing them, the item creator can still see

    these moderated items and check their moderation status in their **My

    Moments** tab.


    This function can only be called from the **server**.

    '
  code_samples:
  - UpdateItemAsync-example
  parameters:
  - name: updateRecommendationItemRequest
    type: Dictionary
    default: null
    summary: "A dictionary containing the following fields:\n\n- `ItemId` &mdash;\
      \ The ID of the item to update.\n- `ReferenceId` &mdash; The new developer-defined\
      \ string to identify\n  the item.\n- `Creator` &mdash; The new creator for the\
      \ item. Creator is a table\n  containing two fields: `CreatorId: number` and\n\
      \  `CreatorType: Enum.CreatorType`.\n- `Duration` &mdash; The new duration for\
      \ the content in seconds.\n- `Visibility` &mdash; The new visibility setting\
      \ for the item.\n- `Attributes` &mdash; The new table of attributes for the\
      \ item.\n- `CustomTags` &mdash; The new list of string tags. Individual custom\n\
      \  tags can't contain commas.\n"
  returns:
  - type: ()
    summary: 'No return value.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
