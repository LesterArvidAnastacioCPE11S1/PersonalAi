  summary: 'Describes what `Enum.UserCFrame` is responsible for input in VR.

    '
  description: 'This property describes what `Enum.UserCFrame` is responsible for
    input in

    VR. For instance, if a VR headset is responsible, the value of this

    property will be `Enum.UserCFrame.Head`.


