- name: VRService.ControllerModels
  summary: 'Controls whether and how the player''s VR hand controllers are rendered
    in

    the experience.

    '
  description: 'Controls how the models representing the player''s VR hand controllers
    are

    displayed (`Enum.VRControllerModelMode`). When set to

    `Enum.VRControllerModelMode.Transparent|Transparent`, the controller

    models are shown with transparency; when set to

    `Enum.VRControllerModelMode.Disabled|Disabled`, the controller models are

    not rendered.


    Defaults to `Enum.VRControllerModelMode.Transparent|Transparent`.

    '
