events:
- name: VRService.NavigationRequested
  summary: 'Fired when navigation is requested from `Class.VRService`.

    '
  description: 'This event fires when navigation is requested from `Class.VRService`
    for a

    specified `Enum.UserCFrame` VR device. It fires with a `Datatype.CFrame`

    coordinate and the specified `Enum.UserCFrame` indicating the device

    requesting the navigation.


    This event can be used alongside `Class.UserInputService` service events

    and methods.


    Since this event fires locally, it can only be used in a

    `Class.LocalScript`.

    '
  code_samples:
  - VRService-NavigationRequested
  parameters:
  - name: cframe
    type: CFrame
    default: null
    summary: 'The requested `Datatype.CFrame` coordinates.

      '
  - name: inputUserCFrame
    type: UserCFrame
    default: null
    summary: 'Indicates the VR device for which navigation is requested.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
- name: VRService.TouchpadModeChanged
  summary: 'Fires if the `Enum.VRTouchpadMode` of a `Enum.VRTouchpad` is changed.

    '
  description: 'This event fires if the `Enum.VRTouchpadMode` of a `Enum.VRTouchpad`
    is

    changed. You can use this event to track the states of VR touchpads

    connected via the user''s client.


    This event can be used alongside `Class.UserInputService` service events

    and methods.


    Since this event fires locally, it can only be used in a

    `Class.LocalScript`.

    '
  code_samples:
  - VRService-TouchpadModeChanged
  parameters:
  - name: pad
    type: VRTouchpad
    default: null
    summary: 'The touchpad that changed mode.

      '
  - name: mode
    type: VRTouchpadMode
    default: null
    summary: 'The new mode.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
- name: VRService.UserCFrameChanged
  summary: 'Fires when a `Enum.UserCFrame` is changed.

    '
  description: 'This event fires when a `Enum.UserCFrame` is changed, for instance
    when

    the user moves a connected VR device. It can be used alongside

    `Class.VRService:GetUserCFrame()|GetUserCFrame()` to track the

    `Datatype.CFrame` coordinates of a VR device, and when it changes/moves.

    It can also be used alongside `Class.UserInputService` service events and

    methods.


    Since this event fires locally, it can only be used in a

    `Class.LocalScript`.

    '
  code_samples:
  - VRService-UserCFrameChanged
  parameters:
  - name: type
    type: UserCFrame
    default: null
    summary: 'The type of VR device that changed.

      '
  - name: value
    type: CFrame
    default: null
    summary: 'The updated `Datatype.CFrame` coordinates of the VR device after the

      change.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
- name: VRService.UserCFrameEnabled
  summary: 'Fires when a `Enum.UserCFrame` is enabled or disabled.

    '
  description: 'This event fires when a `Enum.UserCFrame` is enabled or disabled.
    It can

    be used alongside

    `Class.VRService:GetUserCFrameEnabled()|GetUserCFrameEnabled()` to track

    whether a specified `Enum.UserCFrame|UserCFrame` is enabled, and when its

    state changes. It can also be used alongside `Class.UserInputService`

    service events and methods.


    Since this event fires locally, it can only be used in a

    `Class.LocalScript`.

    '
