- name: VRService.VREnabled
  summary: 'Describes whether the user is using a virtual reality device.

    '
  description: "This property describes whether the user is using a virtual reality\
    \ (VR)\ndevice.\n\nIf a VR device is enabled, you can interact with its location\
    \ and movement\nthrough methods such as `Class.UserInputService:GetUserCFrame()`.\
    \ You can\nalso react to VR device movement using the\n`Class.UserInputService.UserCFrameChanged`\
    \ event.\n\n```lua\nlocal VRService = game:GetService(\"VRService\")\n\nlocal\
    \ isUsingVR = VRService.VREnabled\nif isUsingVR then\n\tprint(\"User is using\
    \ a VR headset!\")\nelse\n\tprint(\"User is not using a VR headset!\")\nend\n\
    ```\n\nThis property can only be used in a `Class.LocalScript`.\n\n#### See Also\n\
    \n- `Class.Camera.HeadLocked`\n- `Class.UserInputService:GetUserCFrame()`\n- `Class.UserInputService.UserCFrameChanged`\n"
