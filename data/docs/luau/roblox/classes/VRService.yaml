methods:
- name: VRService:GetTouchpadMode
  summary: 'Returns the VRTouchpadMode indicating the mode of a specified VRTouchpad.

    '
  description: 'This method returns the `Enum.VRTouchpadMode` indicating the mode
    of a

    specified `Enum.VRTouchpad`. The returned mode indicates how the user

    interacts with their touchpad to play the game.


    This can also be used alongside the several `Class.UserInputService` VR

    methods and events.


    This method will only work when used in a `Class.LocalScript`.

    '
  code_samples:
  - VRService-GetTouchpadMode
  parameters:
  - name: pad
    type: VRTouchpad
    default: null
    summary: 'The specified `Enum.VRTouchpad|VRTouchpad`.

      '
  returns:
  - type: VRTouchpadMode
    summary: 'The mode of the specified `Enum.VRTouchpad|VRTouchpad`.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: VRService:GetUserCFrame
  summary: 'Returns a CFrame describing the position &amp; orientation of a specified

    virtual reality device as an offset from a point in real world space.

    '
  description: 'This method returns a `Datatype.CFrame` describing the position and

    orientation of a specified virtual reality (VR) device as an offset from a

    point in real world space. This method should be used when implementing VR

    compatibility into a game to obtain and track the movement of a connected

    VR device.


    By using the method, developers can implement features such as

    re-positioning the user''s in-game character corresponding to the location

    of a connected VR device. This can be done by changing the _CFrame_ of the

    user''s in-game character to match the _CFrame_ of the specified VR device

    using the UserCFrame enum and _CFrame_ value arguments passed by the

    event.


    `Class.VRService` also provides a

    `Class.VRService.UserCFrameChanged|UserCFrameChanged` event that

    automatically fires when the `Datatype.CFrame` of connected VR device

    changes, so long it is used in a `Class.LocalScript`.


    This method will only work when used in a `Class.LocalScript`.

    '
  code_samples:
  - VRService-GetUserCFrame
  parameters:
  - name: type
    type: UserCFrame
    default: null
    summary: 'The specified `Enum.UserCFrame|UserCFrame`.

      '
  returns:
  - type: CFrame
    summary: 'A `Datatype.CFrame` describing the position and orientation of the

      specified VR device as an offset from a point in real-world space.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: VRService:GetUserCFrameEnabled
  summary: 'Returns true if the specified `Enum.UserCFrame` is available to be

    listened to.

    '
  description: 'This method returns true if the specified `Enum.UserCFrame` virtual

    reality device (VR) is available to be listened to. It can be used to

    determine whether a specified VR device, such as `Enum.UserCFrame.Head`,

    is connected to the user''s game.


    This can also be used alongside the several `Class.UserInputService` VR

    methods and events.


    This method will only work when used in a `Class.LocalScript`.

    '
  code_samples:
  - VRService-GetUserCFrameEnabled
  parameters:
  - name: type
    type: UserCFrame
    default: null
    summary: 'The specified type of VR device.

      '
  returns:
  - type: boolean
    summary: 'A boolean indicating whether the specified VR device is enabled

      (`true`) or disabled (`false`).

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: VRService:RecenterUserHeadCFrame
  summary: 'Re-centers the `Datatype.CFrame` to the current location of the VR headset

    being worn by the user.

    '
  description: 'This method re-centers the `Datatype.CFrame` of the user''s head to
    the

    current location of the VR headset being worn by the user. It can be used

    to ensure that the user''s in-game head is positioned according to the

    location of the user''s VR headset.


    This behaves identically to

    `Class.UserInputService:RecenterUserHeadCFrame()`.


    This method will only work when used in a `Class.LocalScript`.

    '
  code_samples:
  - VRService-RecenterUserHeadCFrame
  parameters: []
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: VRService:RequestNavigation
  summary: 'Requests navigation to the specified `Datatype.CFrame` using the specified

    `Enum.UserCFrame` as the origin for the visualizer parabola.

    '
  description: 'This method requests navigation to the specified `Datatype.CFrame`
    using

    the specified `Enum.UserCFrame` as the origin for the visualizer parabola.

    It can be used to incorporate virtual reality (VR) into your game by

    providing a means to visualize a navigation path from the user''s VR device

    to a destination.


    `Class.VRService` has a similar event,

    `Class.VRService.NavigationRequested|NavigationRequested`, used to detect

    such requests. This can also be used alongside the several

    `Class.UserInputService` VR methods and events.


    This method will only work when used in a `Class.LocalScript`.

    '
  code_samples:
  - VRService-RequestNavigation
  parameters:
  - name: cframe
    type: CFrame
    default: null
    summary: 'The specified `Datatype.CFrame` coordinates.

      '
  - name: inputUserCFrame
    type: UserCFrame
    default: null
    summary: 'The VR device for which the navigation is requested.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
- name: VRService:SetTouchpadMode
  summary: 'Sets the mode of the specified `Enum.VRTouchpad` to the specified

    `Enum.VRTouchpadMode`.

    '
  description: 'This method sets the mode of the specified `Enum.VRTouchpad` to the

    specified `Enum.VRTouchpadMode`. It can be used to change the user''s

    virtual reality (VR) touchpad mode so that the user interacts with the

    game differently using the touchpad.


    This can also be used alongside the several `Class.UserInputService` VR

    methods and events.


    This method will only work when used in a `Class.LocalScript`.

    '
  code_samples:
  - VRService-SetTouchpadMode
  parameters:
  - name: pad
    type: VRTouchpad
    default: null
    summary: 'The specified `Enum.VRTouchpad|VRTouchpad` you want to set the mode

      of.

      '
  - name: mode
    type: VRTouchpadMode
    default: null
    summary: 'The mode you want to set the specified `Enum.VRTouchpad|VRTouchpad`

      to.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Input
