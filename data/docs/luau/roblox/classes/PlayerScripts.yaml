- name: PlayerScripts:ClearComputerCameraMovementModes
  summary: 'Unregisters all `ComputerCameraMovementMode` enums from the game''s

    settings menu.

    '
  description: 'Removes every `Enum.ComputerCameraMovementMode` currently registered
    on

    this `Class.PlayerScripts` instance, so the in-experience settings menu

    offers no computer camera modes until one is registered again with

    `Class.PlayerScripts:RegisterComputerCameraMovementMode()`. The call

    always notifies the settings menu, which rebuilds its camera-mode options

    to reflect the now-empty set.

    '
  code_samples: []
