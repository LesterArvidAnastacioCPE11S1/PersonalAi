methods:
- name: Animator:ApplyJointVelocities
  summary: 'Computes relative velocities between parts and applies them to

    `Class.Motor6D.Part1`.

    '
  description: 'Given the current set of `Class.AnimationTrack|AnimationTracks` playing

    and their current times and play speeds, this method computes relative

    velocities between the parts and applies them to `Class.Motor6D.Part1`

    (the part which `Animator` considers the "child" part). These relative

    velocity calculations and assignments happen in the order provided.


    This method doesn''t apply velocities for a given joint if both of the

    joint''s parts are currently part of the same assembly; for example, if

    they are still connected directly or indirectly by motors or welds.


    Note that this method doesn''t disable or remove the joints for you. You

    must disable or otherwise remove the rigid joints from the assembly before

    calling this method.


    The given `Class.Motor6D|Motor6Ds` are not required to be descendants of

    the `Class.DataModel`. Removing the joints from the `Class.DataModel`

    before calling this method is supported.

    '
  code_samples: []
  parameters:
  - name: motors
    type: Variant
    default: null
    summary: 'An array of `Class.Motor6D` instances to compute and apply velocities

      for.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Animation
- name: Animator:GetPlayingAnimationTracks
  summary: 'Returns the list of currently active

    `Class.AnimationTrack|AnimationTracks`.

    '
  description: 'Returns the list of currently active

    `Class.AnimationTrack|AnimationTracks` on this `Class.Animator`. This

    includes tracks that are fading out and does **not** depend on

    `Class.AnimationTrack.IsPlaying` being `true`; as a result,

    `Class.Animator:GetTrackByAnimationId()|GetTrackByAnimationId()` may be a

    better option to get a specific `Class.AnimationTrack` by its asset ID.

    Fading tracks are automatically stopped and removed from this list once

    their blend weight reaches zero.

    '
  code_samples: []
  parameters: []
  returns:
  - type: Array
    summary: 'An array of currently active `Class.AnimationTrack|AnimationTracks`
      on

      this `Class.Animator`, including tracks that are fading out.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Animation
  simulationAccess: true
- name: Animator:GetTrackByAnimationId
  summary: 'Returns an existing `Class.AnimationTrack` on this `Class.Animator` that

    was loaded from an `Class.Animation` with the given animation ID. Unlike

    `Class.Animator:LoadAnimation()|LoadAnimation()`, this method does not

    create a new `Class.AnimationTrack` instance.

    '
  description: 'Returns an existing `Class.AnimationTrack` on this `Class.Animator`
    that

    was loaded from an `Class.Animation` with the given animation ID. Unlike

    `Class.Animator:LoadAnimation()|LoadAnimation()`, this method does **not**

    create a new `Class.AnimationTrack` instance; it only looks up a track

    that was previously loaded.


    If multiple tracks have been loaded for the same animation ID, this method

    returns the first match. If no matching track exists, it returns `nil`.

    '
  code_samples:
  - Animator-GetTrackByAnimationId
  parameters:
  - name: animationId
    type: ContentId
    default: null
    summary: 'The asset ID of the `Class.Animation` whose loaded track should be

      retrieved.

      '
  returns:
  - type: AnimationTrack?
    summary: 'The first `Class.AnimationTrack` on this `Animator` that was loaded

      from the given animation ID, or `nil` if none has been loaded.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Animation
  simulationAccess: true
- name: Animator:LoadAnimation
  summary: 'Loads an `Class.Animation` onto an `Animator`, returning an

    `Class.AnimationTrack`.

    '
  description: "This method loads the given `Class.Animation` onto this `Animator`,\n\
    returning a playable `Class.AnimationTrack`. When called on an `Animator`\nwithin\
    \ models that the client has network ownership of, for example the\nlocal player's\
    \ character or from `Class.BasePart:SetNetworkOwner()`, this\nmethod also loads\
    \ the animation for the server as well.\n\nNote that the `Animator` must be in\
    \ the `Class.Workspace` before making a\ncall to `LoadAnimation()` or else it\
    \ will be unable to retrieve the\n`Class.AnimationClipProvider` service and throw\
    \ an error.\n\n#### Warning\n\nDo **not** use `LoadAnimation()` in an attempt\
    \ to retrieve an existing\ntrack. Calling `LoadAnimation()` always creates a **new**\n\
    `Class.AnimationTrack` instance which may impact game performance if\noverused.\
    \ Instead, use\n`Class.Animator:GetTrackByAnimationId()|GetTrackByAnimationId()`\
    \ when you\nneed to look up a track that was already loaded.\n\n#### Loading an\
    \ Animation on Client or Server\n\nIn order for `Class.AnimationTrack|AnimationTracks`\
    \ to replicate\ncorrectly, it's important to know when they should be loaded on\
    \ the client\nor on the server:\n\n- If an `Animator` is a descendant of a `Class.Humanoid`\
