name: Animator
type: class
memory_category: Instances
summary: 'Responsible for the playback and replication of `Class.Animation|Animations`.

  '
description: '`Animator` is the main class responsible for the playback and replication
  of

  `Class.Animation|Animations`. All replication of playing

  `Class.AnimationTrack|AnimationTracks` is handled through the `Animator`

  instance.


  See [Animation in Roblox](../../../animation/) to learn how to create and add

  pre-built or custom animations to your game.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags: []
deprecation_message: ''
properties:
- name: Animator.EvaluationThrottled
  summary: 'Indicates whether animation evaluation was throttled (skipped) this frame

    for this `Class.Animator`.

    '
  description: 'A read-only property that indicates whether animation evaluation was

    throttled (skipped) on this frame. When `true`, the `Class.Animator`

    reused the pose from the previous frame instead of evaluating fresh

    animation data.


    This property is useful when layering procedural animation on top of

    `Class.AnimationConstraint.Transform|Transform` — if evaluation was

    throttled, applying procedural offsets would fight the stale pose and

    should be skipped:

    '
  code_samples:
  - Animator-EvaluationThrottled
  type: boolean
  tags:
  - ReadOnly
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: Safe
  category: Behavior
  serialization:
    can_load: false
    can_save: false
  capabilities:
  - Animation
- name: Animator.PreferLodEnabled
  summary: 'Controls whether animation LOD throttling is allowed for this

    `Class.Animator`. When set to `false`, animations always evaluate at full

    fidelity.

    '
  description: 'When `true` (the default), the engine may reduce animation evaluation

    frequency for remotely-simulated characters based on distance, screen

    coverage, and frame budget. When set to `false`, LOD-based throttling is

    disabled and this `Class.Animator` always evaluates at full fidelity.


    Setting this to `false` is useful for important NPCs or characters that

    must always animate smoothly regardless of distance. However, disabling

    LOD for many animators simultaneously can impact performance.


    Note that this property only controls per-animator LOD throttling. The

    workspace-level `Class.Workspace.ClientAnimatorThrottlingMode` setting can

    independently disable or enable throttling for all animators.

    '
  code_samples: []
  type: boolean
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Behavior
  serialization:
    can_load: true
    can_save: true
  capabilities:
  - Animation
