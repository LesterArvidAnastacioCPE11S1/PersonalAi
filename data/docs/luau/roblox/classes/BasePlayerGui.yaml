- name: BasePlayerGui:GetGuiObjectsAtPosition
  summary: 'Returns a list of all `Class.GuiObject` instances occupying the given

    '
  description: 'Takes a screen position and returns a list of all the `Class.GuiObject`

    instances which are occupying that screen position, sorted in the order

    they appear on screen from top to bottom as the first and last index,

    respectively. The main use case is to get GUI objects under the player''s

    mouse or touch inputs to allow for selection or highlighting.


    Since the child classes of `Class.BasePlayerGui` inherit this function, it

    can be fired by container classes such as `Class.PlayerGui` and

    `Class.StarterGui`.

    '
  code_samples:
  - selecting-guis-at-a-position
  parameters:
  - name: x
    type: int
    default: null
    summary: 'The **X** position on the screen relative to the top-left corner after

      the GUI inset is applied (see `Class.GuiService:GetGuiInset()`).

      '
  - name: y
    type: int
    default: null
    summary: 'The **Y** position on the screen relative to the top-left corner after

      the GUI inset is applied (see `Class.GuiService:GetGuiInset()`).

      '
  returns:
  - type: Instances
    summary: 'A table of the `Class.GuiObject` instances that occupy the given

      screen space.

      '
