    can_save: true
  capabilities:
  - Audio
  - Chat
  - PluginOrOpenCloud
- name: VoiceChatService.EnableVoiceVolumeControls
  summary: 'Controls whether Roblox''s built-in voice chat volume controls are

    available to players.

    '
  description: 'This `Enum.RolloutState` property controls whether Roblox''s built-in
    voice

    chat volume controls are available to players, including a global voice

    chat volume slider and per-user volume adjustments.


    When set to `Enum.RolloutState|Enabled`, these controls are available to

    players. When set to `Enum.RolloutState|Disabled`, the built-in controls

    are hidden, though creators can still implement their own custom voice

    volume controls. `Enum.RolloutState|Default` follows the default for this

    feature.


    If `Class.VoiceChatService.UseAudioApi|UseAudioApi` is disabled, this

    property has no effect and built-in controls will be hidden.

    '
  code_samples: []
  type: RolloutState
  tags: []
  deprecation_message: ''
  security:
    read: RobloxScriptSecurity
    write: RobloxScriptSecurity
  thread_safety: ReadSafe
  category: Behavior
  serialization:
    can_load: true
    can_save: true
  capabilities:
  - Audio
  - Chat
- name: VoiceChatService.UseAudioApi
  summary: 'Controls whether voice chat is represented and controlled by

    `Class.AudioDeviceInput` objects.

    '
  description: "If `Enum.AudioApiRollout|Enabled`, the voice chat setup is represented\
    \ and\ncontrolled by `Class.AudioDeviceInput` objects. More specifically:\n\n\
    - An `Class.AudioDeviceInput` will be created and parented to each\n  voice-eligible\
    \ `Class.Player`.\n- An `Class.AudioEmitter` will be created and parented to each\n\
    \  voice-eligible player's `Class.Player.Character`.\n- An `Class.AudioListener`\
    \ will be created and parented to\n  `Class.Workspace.CurrentCamera`.\n\nYou can\
    \ disable the default setup by setting\n`Class.VoiceChatService.EnableDefaultVoice`\
    \ to `false`.\n\nIf `Enum.AudioApiRollout|Disabled`, the voice chat setup is done\
    \ through\nan internal-only system.\n\nCurrently, setting this to `Enum.AudioApiRollout|Automatic`\
    \ has the same\nmeaning as `Enum.AudioApiRollout|Disabled`. However, in the future,\n\
    `Enum.AudioApiRollout|Automatic` will become\n`Enum.AudioApiRollout|Enabled`,\
    \ so that new experiences can achieve\ngreater customization over voice.\n"
  code_samples: []
  type: AudioApiRollout
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Behavior
  serialization:
    can_load: true
    can_save: true
  capabilities:
  - Audio
