name: CanvasGroup
type: class
memory_category: Gui
summary: 'Blends descendants as a flattened group with an optional color/transparency

  modification.

  '
description: "`CanvasGroup` renders its descendants as a flattened group with\n`Class.CanvasGroup.GroupColor3|GroupColor3`\
  \ and\n`Class.CanvasGroup.GroupTransparency|GroupTransparency` optionally applied\
  \ to\nthe rendered result. `Class.UIComponent` visual modifiers such as\n`Class.UICorner`\
  \ and `Class.UIGradient` under a `CanvasGroup` will also apply\nto the whole group.\
  \ Note that `CanvasGroup` always has\n`Class.GuiObject.ClipsDescendants|ClipsDescendants`\
  \ set to `true` and all\ndescendants will be clipped outside the group's bounds.\n\
  \n#### Important Notes\n\n- Descendants of `CanvasGroup` will be rendered as a flattened\
  \ texture only\n  when the ancestor `Class.LayerCollector` has its\n  `Class.LayerCollector.ZIndexBehavior|ZIndexBehavior`\
  \ set to\n  `Enum.ZIndexBehavior.Sibling`.\n- `CanvasGroup` consumes extra texture\
  \ memory. The quality of the texture and\n  total memory usage is limited by the\
  \ `Enum.QualityLevel` of the client. When\n  exceeding the memory cap, `CanvasGroup`\
  \ will render as a blank texture.\n- It's recommended to use `CanvasGroup` with\
  \ static sizes, otherwise a new\n  texture would need to be created to accommodate\
  \ new sizes.\n"
