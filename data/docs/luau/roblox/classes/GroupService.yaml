- name: GroupService:GetAlliesAsync
  summary: 'Returns a `Class.StandardPages` object including information on all of
    the

    specified group''s allies.

    '
  description: "Returns a `Class.StandardPages` object including information on all\
    \ of the\nspecified group's allies.\n\nThis pages does not include a list of group\
    \ IDs but instead a list of\ngroup information tables, mirroring the format of\
    \ those returned by\n`Class.GroupService:GetGroupInfoAsync()`. See below for the\
    \ structure of\nthese tables.\n\n```lua\ngroup = {\n    Name = \"Knights of the\
    \ Seventh Sanctum\",\n    Id = 377251,\n    Owner = {\n        Name = \"Vilicus\"\
    ,\n        Id = 23415609\n    },\n    EmblemUrl = \"http://www.roblox.com/asset/?id=60428602\"\
    ,\n    Description = \"We fight alongside the balance to make sure no one becomes\
    \ too powerful\",\n    Roles = {\n        [1] = {\n            Name = \"Apprentice\"\
    ,\n            Rank = 1\n        },\n        [2] = {\n            Name = \"Warrior\"\
    ,\n            Rank = 2\n        },\n        [3] = {\n            Name = \"Earth\
    \ Walker\",\n            Rank = 255\n        }\n    }\n}\n```\n\nNote, as this\
    \ function returns a `Class.StandardPages` object rather than\nan array, developers\
    \ may wish to convert it to an array for ease of use\n(see examples).\n\nThis\
    \ function has a number of useful applications, including detecting if\na player\
    \ is a member of an allied group.\n\nFor enemies, use `Class.GroupService:GetEnemiesAsync()`.\n"
  code_samples:
