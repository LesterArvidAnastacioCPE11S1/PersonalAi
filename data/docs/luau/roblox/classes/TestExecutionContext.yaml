name: TestExecutionContext
type: class
memory_category: Instances
summary: 'Passed to a running test''s callback to control how the test runs.

  '
description: 'A `TestExecutionContext` is the second argument passed to a test''s
  callback

  when `Class.TestService:RunTestsAsync()` runs it. Use it to skip the test with

  `Class.TestExecutionContext:Skip()|Skip()`.


  A `TestExecutionContext` isn''t an `Class.Instance` and can''t be parented.

  '
