- name: MarketplaceService:UserOwnsGamePassAsync
  summary: 'Returns true if the player with the given `Class.Player.UserId|UserId`

    owns the pass with the given `gamePassId`.

    '
  description: 'Returns true if the user with the given `Class.Player.UserId|UserId`
    owns

    the [pass](../../../production/monetization/passes.md) with the given

    `gamePassId` (not to be confused with an asset ID). You can use this

    method on both the client and the server.


    #### Caching Behavior


    The results of this function are cached so that repeated calls are

    returned faster. When the

    `Class.MarketplaceService.PromptGamePassPurchaseFinished|PromptGamePassPurchaseFinished`

    event fires, the cache gets updated to reflect the latest ownership state

    of the associated game pass.


    If the user purchases a game pass outside of the experience while

    remaining in the same session, the cache is eventually updated, but this

    process might take several minutes to propagate.


    When a user first enters a server after purchasing a game pass, this

    functions always returns true.


    #### Batching behavior


    This method is **Transparent Batching capable**. If you spawn multiple

    calls concurrently using `task.spawn`, the engine automatically combines

    them into fewer HTTP requests behind the scenes. This is faster and helps

    you avoid rate limits. See

    [Transparent Batching](../../../scripting/transparent-batching.md) for

    details.

    '
  code_samples:
  - MarketplaceService-UserOwnsGamePassAsync-TransparentBatching
  parameters:
  - name: userId
    type: User
    default: null
    summary: 'The `Class.Player.UserId|UserId` of the `Class.Player` whose inventory

      you''re checking.

      '
  - name: gamePassId
    type: int64
    default: null
    summary: 'The pass ID you want to check for. Not to be confused with an asset

      ID.

      '
  returns:
  - type: boolean
    summary: 'Whether the user owns the pass.

      '
  tags:
  - Yields
