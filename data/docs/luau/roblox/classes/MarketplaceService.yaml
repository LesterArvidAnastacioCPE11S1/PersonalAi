name: MarketplaceService
type: class
memory_category: Instances
summary: 'The service responsible for in-experience transactions.

  '
description: '`Class.MarketplaceService` is responsible for in-experience transactions.
  The

  most notable methods are

  `Class.MarketplaceService:PromptProductPurchase()|PromptProductPurchase` and

  `Class.MarketplaceService:PromptPurchase()|PromptPurchase`, as well as the

  callback `Class.MarketplaceService.ProcessReceipt|ProcessReceipt` which must

  be defined so that developer product transactions do not fail.

  `Class.MarketplaceService:BindReceiptHandler()|BindReceiptHandler` is a newer

  alternative that processes developer product receipts (and Robux transfer

  receipts) through one or more bound handlers instead of the single

  `ProcessReceipt` callback.


  `Class.MarketplaceService` also has methods that fetch information about

  [developer products](../../../production/monetization/developer-products.md)

  (`Class.MarketplaceService:GetProductInfoAsync()|GetProductInfoAsync` and

  `Class.MarketplaceService:GetDeveloperProductsAsync()|GetDeveloperProductsAsync`),

  [passes](../../../production/monetization/passes.md)

  (`Class.MarketplaceService:UserOwnsGamePassAsync()|UserOwnsGamePassAsync()`),

  and other assets

  (`Class.MarketplaceService:PlayerOwnsAssetAsync()|PlayerOwnsAssetAsync`,

  `Class.MarketplaceService:PlayerOwnsBundleAsync()|PlayerOwnsBundleAsync`).


  Understanding `Class.MarketplaceService` is the first step towards learning to

  [monetize](../../../production/monetization/index.md) an experience on Roblox,

  as well as learning to use `Class.DataStoreService`, which is responsible for

  saving and loading all data related to purchases.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
deprecation_message: ''
properties: []
methods:
- name: MarketplaceService:BindReceiptHandler
  summary: 'Registers a callback to process receipts of a specific type.

    '
  description: "`BindReceiptHandler` registers a callback to process receipts of a\n\
    specific `Enum.ReceiptType`. You can use it to handle developer product\nreceipts\
    \ (`Enum.ReceiptType.DeveloperProduct`) and Robux transfer receipts\n(`Enum.ReceiptType.RobuxTransferSender`\
    \ and\n`Enum.ReceiptType.RobuxTransferReceiver`).\n\nFor `Enum.ReceiptType.DeveloperProduct`,\
    \ you can register handlers in two\nways:\n\n- **Filtered** &mdash; Pass a `filter`\
    \ array of developer product IDs so\n  the handler only fires for receipts whose\
    \ `ProductId` is in that array.\n  Use this to route specific products to dedicated\
    \ handlers.\n- **Catch-all** &mdash; Omit `filter` so the handler fires for any\n\
    \  developer product receipt not already claimed by a filtered handler.\n\nFor\
    \ developer products, `BindReceiptHandler` is an alternative to the\nlegacy `Class.MarketplaceService.ProcessReceipt|ProcessReceipt`\
    \ callback.\nA bound handler takes precedence; if no bound handler matches a developer\n\
    product receipt, it falls through to `ProcessReceipt`. This lets you adopt\n`BindReceiptHandler`\
    \ incrementally without removing an existing\n`ProcessReceipt` callback.\n\nThe\
    \ `handler` callback receives a receipt info dictionary and must return\nan `Enum.ReceiptDecision`\
    \ value:\n\n- `Enum.ReceiptDecision.Processed` &mdash; Indicates the receipt was\n\
    \  successfully processed and all benefits have been granted. The receipt\n  is\
    \ marked as complete.\n- `Enum.ReceiptDecision.NotProcessedYet` &mdash; Indicates\
    \ the receipt has\n  not been processed yet. The receipt remains unresolved and\
    \ will be\n  delivered again on the next opportunity.\n\n#### Receipt Info Dictionary\n\
    \nThe receipt info dictionary passed to the `handler` contains the following\n\
    fields:\n\n<table size=\"small\">\n<thead>\n  <tr>\n    <th>Key</th>\n    <th>Type</th>\n\
    \    <th>Description</th>\n  </tr>\n</thead>\n<tbody>\n<tr>\n  <td><code>PurchaseId</code></td>\n\
    \  <td>string</td>\n  <td>A unique identifier for this specific receipt.</td>\n\
    </tr>\n<tr>\n  <td><code>PlayerId</code></td>\n  <td>number</td>\n  <td>The <code>Class.Player.UserId</code>\
    \ of the user associated with\n  this receipt.</td>\n</tr>\n<tr>\n  <td><code>PlaceIdWherePurchased</code></td>\n\
    \  <td>number</td>\n  <td>The place ID where the transaction was initiated.</td>\n\
    </tr>\n<tr>\n  <td><code>ReceiptType</code></td>\n  <td><code>Enum.ReceiptType</code></td>\n\
    \  <td>The type of this receipt.</td>\n</tr>\n<tr>\n  <td><code>ProductId</code></td>\n\
    \  <td>number</td>\n  <td>The developer product ID. Only present for\n  <code>Enum.ReceiptType.DeveloperProduct</code>\
    \ receipts.</td>\n</tr>\n<tr>\n  <td><code>CurrencyType</code></td>\n  <td><code>Enum.CurrencyType</code></td>\n\
    \  <td>The currency used for the purchase. Only present for\n  <code>Enum.ReceiptType.DeveloperProduct</code>\
    \ receipts.</td>\n</tr>\n<tr>\n  <td><code>CurrencySpent</code></td>\n  <td>number</td>\n\
    \  <td>The amount of Robux involved in the transaction. For\n  <code>Enum.ReceiptType.DeveloperProduct</code>\
    \ receipts, this is the\n  product's price. For\n  <code>Enum.ReceiptType.RobuxTransferSender</code>\
    \ receipts, this is\n  the amount sent. For\n  <code>Enum.ReceiptType.RobuxTransferReceiver</code>\
    \ receipts, this is\n  the amount received.</td>\n</tr>\n<tr>\n  <td><code>TransferRequestId</code></td>\n\
    \  <td>string</td>\n  <td>The transfer request ID from\n  <code>Class.MarketplaceService:PromptRobuxTransferAsync()</code>.\
    \ Only\n  present for <code>Enum.ReceiptType.RobuxTransferSender</code> and\n\
    \  <code>Enum.ReceiptType.RobuxTransferReceiver</code> receipts.</td>\n</tr>\n\
    </tbody>\n</table>\n\n#### Receipt Timing\n\nFor Robux transfer receipts, `handler`\
    \ is invoked once the transfer\nsettles. A settled receipt is delivered to whichever\
    \ server the user is\ncurrently in (the user does not need to rejoin).\n\n- `Enum.ReceiptType.RobuxTransferReceiver`\
    \ &mdash; Delivered to the server\n  the receiver is currently in once the transfer\
    \ settles. If the receiver\n  is offline at that time, delivery happens the next\
    \ time they join a\n  server.\n- `Enum.ReceiptType.RobuxTransferSender` &mdash;\
    \ Delivered immediately if\n  the transfer settles synchronously. If the transfer\
    \ is gated on receiver\n  approval (for example, parental consent), delivery happens\
    \ once the\n  receiver accepts, to whichever server the sender is currently in\
    \ or on\n  their next join if they are offline.\n\nFor developer product receipts,\
    \ `handler` is invoked when the purchase\ncompletes while the buyer is on a server.\
    \ If the handler returns\n`Enum.ReceiptDecision.NotProcessedYet`, or the buyer\
    \ is not reachable, the\nreceipt remains unresolved and is redelivered on a later\
    \ opportunity or\nthe next time the buyer joins a server.\n\nThe user must be\
    \ on a server for `handler` to fire.\n\n#### Errors\n\nThis method throws an error\
    \ if:\n\n- A handler is already registered for the same `Enum.ReceiptType` and\n\
    \  product ID combination.\n- A catch-all handler is already registered for the\
    \ same\n  `Enum.ReceiptType`.\n"
  code_samples:
  - MarketplaceService-BindReceiptHandler1
  - MarketplaceService-BindReceiptHandler2
  parameters:
  - name: transactionType
    type: ReceiptType
    default: null
    summary: 'The `Enum.ReceiptType` indicating which kind of receipt to handle.

      '
  - name: handler
    type: Function
    default: null
    summary: 'A callback function that receives a receipt info dictionary and must

      return an `Enum.ReceiptDecision` value.

      '
  - name: filter
    type: Array?
    default: null
    summary: 'An optional array of product IDs. When provided, the handler only

      fires for receipts matching those product IDs. Not supported for

      `RobuxTransferSender` or `RobuxTransferReceiver` receipt types.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'A `Datatype.RBXScriptConnection` that can be disconnected to

      unregister the handler.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
