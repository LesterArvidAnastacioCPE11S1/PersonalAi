- name: MarketplaceService:PromptBulkPurchase
  summary: 'Prompts a user to purchase multiple avatar items with the given `assetId`

    or `bundleId`.

    '
  description: "Prompts a user to purchase multiple avatar items with the given `assetId`\n\
    or `bundleId`. Does not work with non-avatar items.\n\n`PromptBulkPurchase` only\
    \ allows prompting from server scripts.\n\nFor limited items, original copies\
    \ are prompted until they run out,\nregardless of the price. Once original copies\
    \ are out, resale copies are\nprompted.\n\nA maximum of 20 items can be added\
    \ to a single bulk purchase prompt.\n\n#### PurchaseOptions\n\nEach line item\
    \ can optionally include a `PurchaseOptions` array to control\nwhich purchase\
    \ option appears in the prompt. If omitted, the user is\nprompted for a permanent\
    \ purchase only (default behavior).\n\n`PurchaseOptions` currently supports only\
    \ one entry. If more than one\noption is provided, the API throws an error.\n\n\
    Each entry in `PurchaseOptions` contains:\n\n<table size=\"small\">\n  <thead>\n\
    \    <tr>\n      <th>Key</th>\n      <th>Type</th>\n      <th>Description</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n  <tr>\n    <td><code>Type</code></td>\n  \
    \  <td>Enum</td>\n    <td><code>Enum.PurchaseOption.TimedOption</code> for a timed\
    \ option, or <code>Enum.PurchaseOption.Permanent</code> for standard purchase.</td>\n\
    \  </tr>\n  <tr>\n    <td><code>Value</code></td>\n    <td>number</td>\n    <td>Required\
    \ for <code>TimedOption</code>. The duration in seconds.</td>\n  </tr>\n  </tbody>\n\
    </table>\n\n**Do not hardcode duration values.** Available durations and prices\
    \ are\ndetermined by the backend and may change at any time. Always retrieve them\n\
    from one of the following APIs and pass the values through to\n`PurchaseOptions`:\n\
    \n- `Class.MarketplaceService:GetProductInfoAsync()`\n- `Class.AvatarEditorService:GetItemDetailsAsync()`\n\
    - `Class.AvatarEditorService:GetBatchItemDetailsAsync()`\n- `Class.AvatarEditorService:SearchCatalogAsync()`\n"
  code_samples:
  - Prompt-Bulk-Purchase-Local
  - Prompt-Bulk-Purchase-Server
  - MarketplaceService-PromptBulkPurchase-TimedOptions
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The user to prompt to purchase items.

      '
  - name: lineItems
    type: Array
    default: null
    summary: "An array of avatar items to be included in the bulk purchase.\n\nEach\
      \ line item contains the following structure:\n\n```lua\n{\n  Type: MarketplaceProductType,\n\
      \  Id: string,\n  PurchaseOptions: { {Type: PurchaseOption, Value: number?}\
      \ }?\n}\n```\n\nEach line item contains the following pairs:\n\n- `Type`: The\
      \ corresponding `Enum.MarketplaceProductType` (Enum).\n- `Id`: The ID of the\
      \ asset or bundle.\n- `PurchaseOptions`: Optional. An array containing a single\
      \ purchase\n  option to display in the prompt. If omitted, the permanent purchase\n\
      \  is prompted. See the PurchaseOptions section below for details.\n"
  - name: options
    type: Dictionary
    default: null
    summary: 'Not available at this time.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - PromptExternalPurchase
