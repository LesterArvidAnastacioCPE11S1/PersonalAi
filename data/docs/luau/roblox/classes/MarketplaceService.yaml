    type: Player
    default: null
    summary: 'The `Class.Player` who received the prompt.

      '
  - name: didTryPurchasing
    type: boolean
    default: null
    summary: 'Whether the user attempted to purchase Roblox Plus.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - PromptExternalPurchase
