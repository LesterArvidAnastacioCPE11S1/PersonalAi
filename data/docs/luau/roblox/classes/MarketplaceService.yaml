- name: MarketplaceService:GetRobloxSubscriptionDetailsAsync
  summary: 'Returns the subscription details for the given user for the Roblox

    Subscription ecosystem.

    '
  description: "This method is a streamlined endpoint to check for a single, platform-wide\n\
    Roblox subscription product. By providing `StartTime` (conditionally) and\n`IsOriginExperience`\
    \ to reward long-term loyalists without compromising\nuser data across the platform.\n\
    \nThe returned dictionary contains the following fields:\n\n<table size=\"small\"\
    >\n  <thead>\n    <tr>\n      <th>Field</th>\n      <th>Type</th>\n      <th>Description</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>IsSubscribed</code></td>\n\
    \      <td>bool</td>\n      <td>Returns true if the user has an active Roblox\
    \ Subscription membership.</td>\n    </tr>\n    <tr>\n      <td><code>IsOriginExperience</code></td>\n\
    \      <td>bool</td>\n      <td>Returns true if the user originally subscribed\
    \ to Roblox Subscription while inside the current Experience (Universe).</td>\n\
    \    </tr>\n    <tr>\n      <td><code>StartTime</code></td>\n      <td>DateTime?</td>\n\
    \      <td>A <code>Datatype.DateTime</code> object representing the time when\
    \ the user’s subscription period first began. Note: For privacy reasons, this\
    \ field is only returned if <code>IsOriginExperience</code> is true. If the user\
    \ subscribed in a different experience or on the web, this field will be nil.</td>\n\
    \    </tr>\n  </tbody>\n</table>\n"
  code_samples:
