- name: MarketplaceService:GetProductInfoAsync
  summary: 'Returns the product information of an asset using its asset ID.

    '
  description: "This method provides information about an asset,\n[developer product](../../../production/monetization/developer-products.md),\n\
    or [pass](../../../production/monetization/passes.md) based on the asset\nID and\
    \ the `Enum.InfoType`. If an item with the given ID does not exist,\nthis method\
    \ throws an error.\n\nInformation about the queried item is provided in a dictionary\
    \ with the\nfollowing keys. Note that not all information is provided or necessarily\n\
    relevant for the kind of product you're querying.\n\n<table size=\"small\">\n\t\
    <thead>\n\t  <tr>\n\t    <th>Key</th>\n\t    <th>Type</th>\n\t    <th>Description</th>\n\
    \t  </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n\t  <td><code>Name</code></td>\n\t \
    \ <td>string</td>\n\t  <td>The name shown on the asset's page.</td>\n  </tr>\n\
    \t<tr>\n\t  <td><code>Description</code></td>\n\t  <td>string</td>\n\t  <td>The\
    \ description shown on the asset's page; can be <code>nil</code> if blank.</td>\n\
    \  </tr>\n\t<tr>\n\t  <td><code>PriceInRobux</code></td>\n\t  <td>number</td>\n\
    \t  <td>The cost of purchasing the asset using Robux.</td>\n  </tr>\n  <tr>\n\t\
    \  <td><code>UserBasePriceInRobux</code></td>\n\t  <td>number</td>\n\t  <td>The\
    \ base price of the asset in Robux before any discounts are applied.</td>\n  </tr>\n\
    \  <tr>\n\t  <td><code>PriceDiscountDetails</code></td>\n\t  <td>Array</td>\n\t\
    \  <td>An ordered list of discounts representing the difference between <code>UserBasePriceInRobux</code>\
    \ and <code>PriceInRobux</code>. Each entry contains the following keys:</td>\n\
    \  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n\t  <td><code>Type</code>: The\
    \ type of discount. <code>\"RobloxPlusSubscription\"</code> indicates that the\
    \ discount was applied due to the user’s Roblox Plus subscription.</td>\n  </tr>\n\
    \  <tr>\n\t  <td colspan=\"2\"></td>\n\t  <td><code>AmountInRobux</code>: number\
    \ — The value of the discount in Robux.</td>\n  </tr>\n  <tr>\n\t  <td colspan=\"\
    2\"></td>\n\t  <td><code>Percent</code>: number — The percentage of the discount.</td>\n\
    \  </tr>\n  <tr>\n\t  <td><code>ProductId</code></td>\n\t  <td>number</td>\n\t\
    \  <td>The product ID if <code>Enum.InfoType</code> is <code>Product</code>.</td>\n\
    \  </tr>\n  <tr>\n\t  <td><code>ProductType</code></td>\n\t  <td>string</td>\n\
    \t  <td>A string describing what the product is. Not to be confused with <code>Enum.MarketplaceProductType</code>.</td>\n\
    \  </tr>\n\t<tr>\n\t  <td><code>Created</code></td>\n\t  <td>string</td>\n\t \
    \ <td>Timestamp of when the asset was created, for example <code>2022-01-02T10:30:45Z</code>.\
    \ Formatted using ISO 8601.</td>\n  </tr>\n\t<tr>\n\t  <td><code>Updated</code></td>\n\
    \t  <td>string</td>\n\t  <td>Timestamp of when the asset was last updated by its\
    \ creator, for example <code>2022-02-12T11:22:15Z</code>. Formatted using ISO\
    \ 8601.</td>\n  </tr>\n\t<tr>\n\t  <td><code>ContentRatingTypeId</code></td>\n\
    \t  <td>number</td>\n\t  <td>Indicates whether the item is marked as 13+ in catalog.</td>\n\
    \  </tr>\n\t<tr>\n\t  <td><code>MinimumMembershipLevel</code></td>\n\t  <td>number</td>\n\
    \t  <td>The minimum subscription level necessary to purchase the item.</td>\n\
    \  </tr>\n\t<tr>\n\t  <td><code>IsPublicDomain</code></td>\n\t  <td>boolean</td>\n\
    \t  <td>Describes whether the asset can be taken for free.</td>\n  </tr>\n  <tr>\n\
    \t  <td><code>TargetId</code></td>\n\t  <td>number</td>\n\t  <td>The ID of the\
    \ product or asset.</td>\n  </tr>\n  </tbody>\n</table>\n\n#### Creator Information\n\
    \n<table size=\"small\">\n  <thead>\n\t  <tr>\n\t    <th>Key</th>\n\t    <th>Type</th>\n\
    \t    <th>Description</th>\n\t  </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n\t  <td><code>Creator</code></td>\n\
    \t  <td>table</td>\n\t  <td>Dictionary table of information describing the creator\
    \ of the asset, containing the following fields:</td>\n  </tr>\n  <tr>\n\t  <td\
    \ colspan=\"2\"></td>\n    <td><code>CreatorType</code>: Either <code>User</code>\
    \ or <code>Group</code>.</td>\n  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n\
    \    <td><code>CreatorTargetId</code>: The ID of the creator user or group.</td>\n\
    \  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n    <td><code>HasVerifiedBadge</code>:\
    \ Boolean of whether the creator has a verified badge.</td>\n  </tr>\n  <tr>\n\
    \t  <td colspan=\"2\"></td>\n    <td><code>Name</code>: The name/username of the\
    \ creator.</td>\n  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n    <td><code>Id</code>:\
    \ Use <code>CreatorTargetId</code> instead.</td>\n  </tr>\n  </tbody>\n</table>\n\
    \n#### Asset Information\n\n<table size=\"small\">\n  <thead>\n\t  <tr>\n\t  \
    \  <th>Key</th>\n\t    <th>Type</th>\n\t    <th>Description</th>\n\t  </tr>\n\t\
    </thead>\n  <tbody>\n\t<tr>\n\t  <td><code>AssetId</code></td>\n\t  <td>number</td>\n\
    \t  <td>The asset ID if <code>Enum.InfoType</code> is <code>Asset</code>.</td>\n\
    \  </tr>\n\t<tr>\n\t  <td><code>AssetTypeId</code></td>\n\t  <td>number</td>\n\
    \t  <td>The type of asset. See <code>Enum.AssetType</code> for the asset type\
    \ ID numbers.</td>\n  </tr>\n  <tr>\n\t  <td><code>IconImageAssetId</code></td>\n\
    \t  <td>number</td>\n\t  <td>The asset ID of the product's icon, or <code>0</code>\
    \ if there isn't one.</td>\n  </tr>\n\t<tr>\n\t  <td><code>IsForSale</code></td>\n\
    \t  <td>boolean</td>\n\t  <td>Describes whether the asset is purchasable.</td>\n\
    \  </tr>\n\t<tr>\n\t  <td><code>IsLimited</code></td>\n\t  <td>boolean</td>\n\t\
    \  <td>Describes whether the asset is a Roblox Limited that is no longer (if ever)\
    \ sold.</td>\n  </tr>\n\t<tr>\n\t  <td><code>IsLimitedUnique</code></td>\n\t \
    \ <td>boolean</td>\n\t  <td>Describes whether the asset is a unique Roblox Limited\
    \ (\"Limited&nbsp;U\") item that only has a fixed number sold.</td>\n  </tr>\n\
    \t<tr>\n\t  <td><code>IsNew</code></td>\n\t  <td>boolean</td>\n\t  <td>Describes\
    \ whether the asset is marked as \"new\" in the catalog.</td>\n  </tr>\n\t<tr>\n\
    \t  <td><code>Remaining</code></td>\n\t  <td>number</td>\n\t  <td>The remaining\
    \ number of times a limited unique item may be sold.</td>\n  </tr>\n\t<tr>\n\t\
    \  <td><code>Sales</code></td>\n\t  <td>number</td>\n\t  <td>The number of times\
    \ the asset has been sold.</td>\n  </tr>\n  </tbody>\n</table>\n\n#### Collectibles\
    \ Information\n\n<table size=\"small\">\n  <thead>\n\t  <tr>\n\t    <th>Key</th>\n\
    \t    <th>Type</th>\n\t    <th>Description</th>\n\t  </tr>\n\t</thead>\n  <tbody>\n\
    \  <tr>\n\t  <td><code>CollectibleItemId</code></td>\n\t  <td>string</td>\n\t\
    \  <td>The unique item ID of the collectible.</td>\n  </tr>\n\t<tr>\n\t  <td><code>CollectibleProductId</code></td>\n\
    \t  <td>string</td>\n\t  <td>The unique product ID of the collectible.</td>\n\
    \  </tr>\n  <tr>\n\t  <td><code>CollectiblesItemDetails</code></td>\n\t  <td>table</td>\n\
    \t  <td>Dictionary table of information describing the collectible, containing\
    \ the following fields:</td>\n  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n \
    \   <td><code>CollectibleLowestAvailableResaleItemInstanceId</code>: The unique\
    \ item instance ID of the lowest available resale for the collectible.</td>\n\
    \  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n    <td><code>CollectibleLowestAvailableResaleProductId</code>:\
    \ The unique product ID of the lowest available resale for the collectible.</td>\n\
    \  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n    <td><code>CollectibleLowestResalePrice</code>:\
    \ The lowest resale price for the collectible in Robux.</td>\n  </tr>\n  <tr>\n\
    \t  <td colspan=\"2\"></td>\n    <td><code>IsForSale</code>: Boolean of whether\
    \ the collectible is available for sale (not resale).</td>\n  </tr>\n  <tr>\n\t\
    \  <td colspan=\"2\"></td>\n    <td><code>IsLimited</code>: Boolean of whether\
    \ or not the collectible is limited.</td>\n  </tr>\n  <tr>\n\t  <td colspan=\"\
    2\"></td>\n    <td><code>TotalQuantity</code>: The total quantity of the collectible\
    \ available for purchase (not resale).</td>\n  </tr>\n  </tbody>\n</table>\n\n\
    #### Sale Location Settings\n\n<table size=\"small\">\n  <thead>\n\t  <tr>\n\t\
    \    <th>Key</th>\n\t    <th>Type</th>\n\t    <th>Description</th>\n\t  </tr>\n\
    \t</thead>\n  <tbody>\n\t<tr>\n\t  <td><code>CanBeSoldInThisGame</code></td>\n\
    \t  <td>boolean</td>\n\t  <td>Describes whether the asset is purchasable in the\
    \ current experience.</td>\n  </tr>\n  <tr>\n\t  <td><code>SaleLocation</code></td>\n\
    \t  <td>table</td>\n\t  <td>Dictionary table of information describing where the\
    \ item can be sold, containing the following fields:</td>\n  </tr>\n  <tr>\n\t\
    \  <td colspan=\"2\"></td>\n\t  <td><code>SaleLocationType</code>: The type of\
    \ sale location setting. See <code>Enum.ProductLocationRestriction</code> for\
    \ the sale location setting ID numbers.</td>\n  </tr>\n  <tr>\n\t  <td colspan=\"\
    2\"></td>\n\t  <td><code>UniverseIds</code>: Array table of universes in which\
    \ the item can be sold (not currently implemented).</td>\n  </tr>\n  </tbody>\n\
    </table>\n\n#### Timed Options\n\n<table size=\"small\">\n  <thead>\n\t  <tr>\n\
    \t    <th>Key</th>\n\t    <th>Type</th>\n\t    <th>Description</th>\n\t  </tr>\n\
    \t</thead>\n  <tbody>\n  <tr>\n\t  <td><code>TimedOptions</code></td>\n\t  <td>array</td>\n\
    \t  <td>Optional. An array of available timed options with durations and prices.\
    \ Only present for assets that support timed ownership. Do not hardcode duration\
    \ values; always retrieve them from this API as they may change. Each entry contains:</td>\n\
    \  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n\t  <td><code>Duration</code>:\
    \ number — The duration in seconds (e.g. 259200 for 3 days, 604800 for 7 days).</td>\n\
    \  </tr>\n  <tr>\n\t  <td colspan=\"2\"></td>\n\t  <td><code>Price</code>: number\
    \ — The price in Robux for this duration.</td>\n  </tr>\n  </tbody>\n</table>\n\
    \n#### Batching behavior\n\nThis method is **Transparent Batching capable**. If\
    \ you spawn multiple\ncalls concurrently using `task.spawn`, the engine automatically\
    \ combines\nthem into fewer HTTP requests behind the scenes. This is faster and\
    \ helps\nyou avoid rate limits. See\n[Transparent Batching](../../../scripting/transparent-batching.md)\
    \ for\ndetails and a code example.\n"
  code_samples:
  - MarketplaceService-GetProductInfo1
  - MarketplaceService-GetProductInfo2
  - MarketplaceService-GetProductInfo-TimedOptions
  - MarketplaceService-GetProductInfo-TransparentBatching
  parameters:
  - name: assetId
    type: int64
    default: null
    summary: 'The asset ID of the specified product.

      '
  - name: infoType
    type: InfoType
    default: Asset
    summary: 'An `Enum.InfoType` enum value specifying the type of information being

      retrieved.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary containing information about the queried item, described

      in the previous tables.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
