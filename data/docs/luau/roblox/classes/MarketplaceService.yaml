- name: MarketplaceService:GetUserSubscriptionDetailsAsync
  summary: 'Returns a table that contains the details of the user''s subscription
    for a

    given `subscriptionId`.

    '
  description: "Returns a dictionary table containing the details of the user's\n\
    subscription for the given `subscriptionId`. The table contains the\nfollowing\
    \ keys:\n\n<table size=\"small\">\n\t<thead>\n\t  <tr>\n\t    <th>Key</th>\n\t\
    \    <th>Type</th>\n\t    <th>Description</th>\n\t  </tr>\n\t</thead>\n  <tbody>\n\
    \t<tr>\n\t  <td><code>SubscriptionState</code></td>\n\t  <td><code>Enum.SubscriptionState</code></td>\n\
    \t  <td>Current state of this particular subscription.</td>\n  </tr>\n\t<tr>\n\
    \t  <td><code>NextRenewTime</code></td>\n\t  <td><code>Datatype.DateTime</code></td>\n\
    \t  <td>\n      Renewal time for this current subscription. May be in the past\
    \ if the subscription is in\n      <code>Enum.SubscriptionState.SubscribedRenewalPaymentPending|SubscribedRenewalPaymentPending</code>\
    \ state. This\n      field is will be <code>nil</code> if the subscription will\
    \ not renew, is <code>Enum.SubscriptionState.Expired|Expired</code>, or the user\
    \ never subscribed.\n    </td>\n  </tr>\n  <tr>\n\t  <td><code>ExpireTime</code></td>\n\
    \t  <td><code>Datatype.DateTime</code></td>\n\t  <td>\n      When this subscription\
    \ expires. This field will be <code>nil</code>\n      if the subscription is not\
    \ cancelled or the user never subscribed.\n    </td>\n  </tr>\n  <tr>\n\t  <td><code>ExpirationDetails</code></td>\n\
    \t  <td><code>Library.table</code></td>\n\t  <td>\n      Table containing the\
    \ details of the subscription expiration. This\n      field will be <code>nil</code>\
    \ if the subscription is not in the\n      <code>Enum.SubscriptionState.Expired|Expired</code>\
    \ state. If populated, the table contains a <code>ExpirationReason</code> key\
    \ of type <code>Enum.SubscriptionExpirationReason</code> describing why the subscription\
    \ is expired.\n    </td>\n  </tr>\n  </tbody>\n</table>\n\nNote that this method\
    \ can only be called from a `Class.Script` with\n`Class.BaseScript.RunContext|RunContext`\
    \ of\n`Enum.RunContext.Server|Server`. If you only need to determine the\n`IsSubscribed`\
    \ status of a user, it's recommended to use\n`Class.MarketplaceService:GetUserSubscriptionStatusAsync()|GetUserSubscriptionStatusAsync`\n\
    as it is faster and more efficient for that particular purpose.\n"
  code_samples: []
  parameters:
  - name: user
    type: Player
    default: null
    summary: 'The `Class.Player` object whose subscription details you want to

      check.

      '
  - name: subscriptionId
    type: string
    default: null
    summary: 'The ID of the subscription to check.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary containing the user''s subscription details described in

      the following table.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
- name: MarketplaceService:GetUserSubscriptionPaymentHistoryAsync
  summary: 'Returns an `Library.table|Array` that contains up to one year of the

    user''s subscription payment history for the given `subscriptionId`.

    '
  description: "Returns an `Library.table|Array` that contains up to one year of the\n\
    user's subscription payment history for the given `subscriptionId`, sorted\nfrom\
    \ the most recent status to the least recent. You can only call this\nmethod from\
    \ a `Class.Script` with `Enum.RunContext.Server`.\n\nEach entry in the payment\
    \ history `Library.table|Array` contains the\nfollowing keys:\n\n<table size=\"\
    small\">\n\t<thead>\n\t  <tr>\n\t    <th>Key</th>\n\t    <th>Type</th>\n\t   \
    \ <th>Description</th>\n\t  </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n\t  <td><code>CycleStartTime</code></td>\n\
    \t  <td><code>Datatype.DateTime</code></td>\n\t  <td><code>Datatype.DateTime</code>\
    \ at the start of this particular subscription period.</td>\n  </tr>\n\t<tr>\n\
    \t  <td><code>CycleEndTime</code></td>\n\t  <td><code>Datatype.DateTime</code></td>\n\
    \t  <td><code>Datatype.DateTime</code> at the end of this particular subscription\
    \ period.</td>\n  </tr>\n  <tr>\n\t  <td><code>PaymentStatus</code></td>\n\t \
    \ <td><code>Enum.SubscriptionPaymentStatus</code></td>\n\t  <td><code>Enum.SubscriptionPaymentStatus.Paid</code>\
    \ if the user paid for this particular subscription period.\n    <code>Enum.SubscriptionPaymentStatus.Refunded</code>\
    \ if the user refunded this particular subscription period.\n    </td>\n  </tr>\n\
    \  </tbody>\n</table>\n\n#### Payment History Length\n\nOnly creators affiliated\
    \ with the subscription product can access up to\n**one year** worth of the user's\
    \ subscription payment history.\nNon-associated creators can only get the user's\
    \ **current** subscription\npayment status or an empty `Library.table|Array` if\
    \ the user has no active\nsubscription.\n\n#### Grace Period\n\nSubscription renewal\
    \ payments can have some processing time. Payment\nhistory doesn't return a table\
    \ for this period. However, in order to\npreserve a user's subscription experience\
    \ during the processing period,\n`Class.MarketplaceService.GetUserSubscriptionStatusAsync()|GetUserSubscriptionStatusAsync`\n\
    returns `IsSubscribed: true` for the given user. Don't grant durable items\nor\
    \ currency type subscription benefits to the user until after payment has\nbeen\
    \ confirmed for the current cycle.\n\nFor example, on August 31, 2023, User A's\
    \ Subscription B is up for\nrenewal. On September 1, 2023, the payment has yet\
    \ to be processed. If you\ncall\n`Class.MarketplaceService.GetUserSubscriptionPaymentHistoryAsync()|GetUserSubscriptionPaymentHistoryAsync`\n\
    on September 1, 2023 on User A for Subscription B, the first entry of the\nreturn\
    \ value is:\n\n<table size=\"small\">\n\t<thead>\n\t  <tr>\n\t    <th>Key</th>\n\
    \t    <th>Value</th>\n\t  </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n\t  <td><code>CycleStartTime</code></td>\n\
    \t  <td>...</td>\n  </tr>\n\t<tr>\n\t  <td><code>CycleEndTime</code></td>\n\t\
    \  <td>August 31, 2023</td>\n  </tr>\n  <tr>\n\t  <td><code>PaymentStatus</code></td>\n\
    \t  <td><code>Enum.SubscriptionPaymentStatus.Paid</code></td>\n  </tr>\n  </tbody>\n\
    </table>\n\nNote that since the user is within the grace period, the cycle they\
    \ have\nyet to pay for (September 1, 2023) does not appear in the return value\
    \ at\nall. This field only populates after the payment has been received and\n\
    processed.\n\nAt the same time,\n`Class.MarketplaceService.GetUserSubscriptionStatusAsync()|GetUserSubscriptionStatusAsync`\n\
    returns the following result until the renewal payment process fails or\nthe user\
    \ cancels:\n\n<table size=\"small\">\n\t<thead>\n\t  <tr>\n\t    <th>Key</th>\n\
    \t    <th>Return</th>\n\t  </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n\t  <td><code>IsSubscribed</code></td>\n\
    \t  <td>True</td>\n  </tr>\n\t<tr>\n\t  <td><code>IsRenewing</code></td>\n\t \
    \ <td>True</td>\n  </tr>\n  </tbody>\n</table>\n"
  code_samples:
  - MarketplaceService-GetUserSubscriptionPaymentHistoryAsync1
  parameters:
  - name: user
    type: Player
    default: null
    summary: 'The `Class.Player` whose subscription payment history you want to

      retrieve.

      '
  - name: subscriptionId
    type: string
    default: null
    summary: 'The ID of the subscription whose payment history you want to retrieve.

      '
  returns:
  - type: Array
    summary: 'An array of payment-history entries, ordered from most recent to least

      recent, as described in the following table.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
- name: MarketplaceService:GetUserSubscriptionStatusAsync
  summary: 'Returns a `Library.table` that contains the subscription status of the

    user for the given `subscriptionId`.

    '
  description: "Returns a `Library.table` that contains the subscription status of\
    \ the\nuser for the given `subscriptionId`. The table contains the following\n\
    keys:\n\n<table size=\"small\">\n\t<thead>\n\t  <tr>\n\t    <th>Key</th>\n\t \
    \   <th>Type</th>\n\t    <th>Description</th>\n\t  </tr>\n\t</thead>\n  <tbody>\n\
    \t<tr>\n\t  <td><code>IsSubscribed</code></td>\n\t  <td>boolean</td>\n\t  <td>True\
    \ if the user's subscription is active.</td>\n  </tr>\n\t<tr>\n\t  <td><code>IsRenewing</code></td>\n\
    \t  <td>boolean</td>\n\t  <td>True if the user is set to renew this subscription\
    \ after the current subscription period ends.</td>\n  </tr>\n  </tbody>\n</table>\n\
    \nNote that `IsSubscribed` will be `true` only when a user has purchased the\n\
    subscription and the payment has been successfully processed. If the\npayment\
    \ for a user's initial subscription purchase is still processing or\nhas failed,\
    \ `IsSubscribed` returns `false`. To understand when a user's\nsubscription status\
    \ has changed, see the\n`Class.Players.UserSubscriptionStatusChanged` event.\n"
  code_samples:
  - MarketplaceService-GetUserSubscriptionStatusAsync1
  parameters:
  - name: user
    type: Player
    default: null
    summary: 'The `Class.Player` object whose subscription status you want to check.

      '
