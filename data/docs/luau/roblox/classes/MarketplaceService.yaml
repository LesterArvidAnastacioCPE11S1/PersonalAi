events:
- name: MarketplaceService.PromptBulkPurchaseFinished
  summary: 'Fires when a purchase prompt for bulk avatar items is closed.

    '
  description: 'This event fires when a purchase prompt for a bulk avatar items closes.

    For example, when a user receives the purchase prompt and clicks

    **Cancel**, or when they receive a success or error message and click

    **OK**.


    Note: This is not a trusted event from the client. To check if the user

    owns the items purchased, use

    `Class.MarketplaceService.PlayerOwnsAssetAsync` or

    `Class.MarketplaceService.PlayerOwnsBundleAsync`.

    '
  code_samples: []
  parameters:
  - name: player
    type: Instance
    default: null
    summary: 'The `Class.Player` who received the prompt.

      '
  - name: status
    type: MarketplaceBulkPurchasePromptStatus
    default: null
    summary: 'The status of the bulk purchase.

      '
  - name: results
    type: Dictionary
    default: null
    summary: "The table type containing the line items and their status in the\nfollowing\
      \ format:\n\n```lua\n{\n  RobuxSpent: number\n  Items: {\n    {\n      type:\
      \ MarketplaceProductType,\n      id: string,\n      status: MarketplaceItemPurchaseStatus\n\
      \    },\n    ...\n  }\n}\n```\n\nEach line item contains the following pairs:\n\
      \n- `type`: The corresponding `Enum.MarketplaceProductType` (Enum).\n- `id`:\
      \ The ID of the asset or bundle (string).\n- `status`: The `Enum.MarketplaceItemPurchaseStatus`\
      \ of the purchase\n  (Enum)\n"
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - PromptExternalPurchase
- name: MarketplaceService.PromptBundlePurchaseFinished
  summary: 'Fires when a bundle purchase prompt closes.

    '
  description: 'This event fires when a purchase prompt for a bundle closes. Use

    `Class.MarketplaceService:PlayerOwnsBundleAsync()|PlayerOwnsBundleAsync()`

    to verify ownership instead of trusting this client-originated event.

    '
  code_samples: []
  parameters:
  - name: player
    type: Instance
    default: null
    summary: 'The `Class.Player` who received the prompt.

      '
  - name: bundleId
    type: int64
    default: null
    summary: 'The ID of the bundle shown in the prompt.

      '
  - name: wasPurchased
    type: boolean
    default: null
    summary: 'Whether the bundle was purchased.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - PromptExternalPurchase
- name: MarketplaceService.PromptGamePassPurchaseFinished
  summary: 'Fires when a purchase prompt for a pass is closed.

    '
  description: "This event fires when a purchase prompt for a\n[pass](../../../production/monetization/passes.md)\
    \ closes. For example,\nwhen a user receives the purchase prompt and clicks **Cancel**,\
    \ or when\nthey receive a success or error message and click **OK**.\n\n#### See\
    \ Also\n\n- For repeatable **developer product** purchase prompts, use\n  `Class.MarketplaceService.PromptProductPurchaseFinished|PromptProductPurchaseFinished`.\n\
    - For **affiliate gear sales** or other assets, use\n  `Class.MarketplaceService.PromptPurchaseFinished|PromptPurchaseFinished`.\n\
    - For more information on saving and replicating user data like purchases\n  and\
    \ progress, see\n  [Implementing player data and purchases](https://devforum.roblox.com/t/implementing-player-data-and-purchasing-systems/2839941).\n"
  code_samples:
  - handling-gamepass
  parameters:
  - name: player
    type: Instance
    default: null
    summary: 'The `Class.Player` who received the prompt.

      '
  - name: gamePassId
    type: int64
    default: null
    summary: 'The ID number of the pass shown in the prompt. Not to be confused with

      an asset ID.

      '
  - name: wasPurchased
    type: boolean
    default: null
    summary: 'Indicates if the user pressed **OK** (true), **Cancel** (false) on the

      purchase prompt, or if the purchase prompt errored (false).


      When `PromptGamePassPurchaseFinished` fires, it updates the cache used

      by

      `Class.MarketplaceService:UserOwnsGamePassAsync()|UserOwnsGamePassAsync()`

      to reflect the current ownership state.


      `PromptGamePassPurchaseFinished` should only be listened to in a

      server script. When used on the server, values such as `wasPurchased`

      reflect the final outcome of the purchase attempt. When used in a

      local script, these values should not be relied on for validation or

      game logic.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - PromptExternalPurchase
- name: MarketplaceService.PromptPremiumPurchaseFinished
  summary: 'Fires when a purchase prompt for Roblox Premium is closed.

    '
  description: "This event fires when a purchase prompt for\n[Roblox Premium](https://www.roblox.com/premium/membership)\
    \ closes. For\nexample, when a user receives the purchase prompt and clicks **Cancel**,\n\
    or when they receive a success or error message and click **OK**.\n\n#### See\
    \ Also\n\n- `Class.MarketplaceService.PromptPremiumPurchase|PromptPremiumPurchase`\n\
    \  to prompt a user to purchase Premium.\n- `Class.Players.PlayerMembershipChanged|PlayerMembershipChanged`,\
    \ which\n  fires when the server recognizes that a user's membership has changed.\n"
  code_samples: []
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - PromptExternalPurchase
- name: MarketplaceService.PromptProductPurchaseFinished
  summary: 'Fires when a purchase prompt for a developer product is closed. Do not
    use

    this event to process purchases.

    '
  description: "**IMPORTANT:** Do **not** use the `PromptProductPurchaseFinished`\
    \ event to\nprocess purchases; instead, use the\n`Class.MarketplaceService.ProcessReceipt|ProcessReceipt`\
    \ callback. The\nfiring of `PromptProductPurchaseFinished` does **not** mean that\
    \ a user\nhas successfully purchased an item.\n\nThis event fires when a purchase\
    \ prompt for a\n[developer product](../../../production/monetization/developer-products.md)\n\
    closes. For example, when a user receives the purchase prompt and clicks\n**Cancel**,\
    \ or when they receive a success or error message and click\n**OK**. The firing\
    \ of this event does **not** mean that a user has\nsuccessfully purchased an item.\n\
    \nWhile you can use the `PromptProductPurchaseFinished` event to detect when\n\
    a user closes a purchase prompt, you should **not** use it to process\npurchases\
    \ because those purchases might still fail in the backend for\nseveral reasons.\
    \ For example, if a Roblox system is offline, or if the\nproduct price has changed\
    \ and the user now doesn't have enough Robux to\nmake the purchase. To process\
    \ purchases, you must use\n`Class.MarketplaceService.ProcessReceipt()|ProcessReceipt`.\
    \ Using\n`ProcessReceipt` allows you to confirm that the purchase has succeeded\n\
    before you grant the user the item they have purchased.\n\nThe `PromptProductPurchaseFinished`\
    \ event fires with a `Player.UserId`\ninstead of a reference to the `Player` object.\n\
    \n#### See Also\n\n- `Class.MarketplaceService.PromptGamePassPurchaseFinished|PromptGamePassPurchaseFinished`\n\
    \  to prompt a user to purchase a pass.\n- `Class.MarketplaceService.PromptPurchaseFinished|PromptPurchaseFinished`\n\
    \  to prompt a user to purchase affiliate gear or other assets.\n- For more information\
    \ on saving and replicating user data like purchases\n  and progress, see\n  [Implementing\
    \ player data and purchases](https://devforum.roblox.com/t/implementing-player-data-and-purchasing-systems/2839941).\n"
  code_samples: []
  parameters:
  - name: userId
    type: int64
    default: null
    summary: 'The `Class.Player.UserId|UserId` of the user who received the

      developer product prompt.

      '
  - name: productId
    type: int64
    default: null
    summary: 'The ID number of the developer product shown in the prompt. Not to be

      confused with an asset ID.

      '
  - name: isPurchased
    type: boolean
    default: null
    summary: 'Indicates if the user pressed **OK** (true), **Cancel** (false) on the

      purchase prompt, or if the purchase prompt errored (false).


      Do not use this parameter to process developer product purchases.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - PromptExternalPurchase
- name: MarketplaceService.PromptPurchaseFinished
  summary: 'Fires when a purchase prompt for an affiliate gear sale or other asset
    is

    closed. Does **not** fire for developer product or pass prompts.

    '
  description: "This event fires when a purchase prompt for an affiliate gear sale\
    \ or\nother asset closes. For example, when a user receives the purchase prompt\n\
    and clicks **Cancel**, or when they receive a success or error message and\nclick\
    \ **OK**.\n\nThis event does not fire for\n[developer product](../../../production/monetization/developer-products.md)\n\
    or [pass](../../../production/monetization/passes.md) prompts.\n\n#### See Also\n\
    \n- `Class.MarketplaceService.PromptGamePassPurchaseFinished|PromptGamePassPurchaseFinished`\n\
    \  to prompt a user to purchase a pass.\n- `Class.MarketplaceService.PromptProductPurchaseFinished|PromptProductPurchaseFinished`\n\
    \  to prompt a user to purchase a developer product.\n- For more information on\
    \ saving and replicating user data like purchases\n  and progress, see\n  [Implementing\
    \ player data and purchases](https://devforum.roblox.com/t/implementing-player-data-and-purchasing-systems/2839941).\n"
  code_samples:
  - MarketplaceService-PromptPurchaseFinished1
  parameters:
  - name: player
    type: Instance
    default: null
    summary: 'The `Class.Player` who received the prompt.

      '
  - name: assetId
    type: int64
    default: null
    summary: 'The asset ID of the item shown in the prompt.

      '
  - name: isPurchased
    type: boolean
    default: null
    summary: 'Indicates if the user pressed **OK** (true), **Cancel** (false) on the

      purchase prompt, or if the purchase prompt errored (false).


      This might not accurately reflect if the purchase itself has been

      successfully processed.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - PromptExternalPurchase
- name: MarketplaceService.PromptRobloxSubscriptionPurchaseFinished
  summary: 'Fires when a purchase prompt for Roblox Plus is closed.

    '
  description: "This event fires when a purchase prompt for Roblox Plus closes. For\n\
    example, when a user receives the purchase prompt and clicks **Cancel**,\nor when\
    \ they receive a success or error message and click **OK**.\n\nNote that this\
    \ event firing does **not** guarantee the subscription was\nsuccessfully processed.\
    \ Listen to `Class.Player.HasRobloxSubscription` via\n`Class.Instance:GetPropertyChangedSignal()`\
    \ on the server to confirm a\nsubscription change before granting rewards.\n\n\
    #### See Also\n\n- `Class.MarketplaceService.PromptRobloxSubscriptionPurchase|PromptRobloxSubscriptionPurchase`\n\
    \  to prompt a user to purchase Roblox Plus.\n- `Class.Player.HasRobloxSubscription`,\
    \ which can be observed via\n  `Class.Instance:GetPropertyChangedSignal()` to\
    \ detect when a user's\n  subscription status changes.\n"
  code_samples:
