- name: MarketplaceService:PromptRobuxTransferAsync
  summary: 'Initiates a Robux transfer from the sender to another user.

    '
  description: "`PromptRobuxTransferAsync` initiates a Robux transfer from the `sender`\
    \ to\nthe user specified by `receiverUserId`. This is a server-only method and\n\
    must be called from a `Class.Script` with `RunContext` set to `Server`.\n\nAfter\
    \ a successful transfer, both the sender and receiver will have\nreceipts delivered\
    \ to their respective\n`Class.MarketplaceService:BindReceiptHandler()|BindReceiptHandler`\n\
    callbacks:\n\n- The sender's receipt has `Enum.ReceiptType.RobuxTransferSender`.\n\
    - The receiver's receipt has `Enum.ReceiptType.RobuxTransferReceiver`.\n\nBoth\
    \ receipts include a `TransferRequestId` field matching the\n`transferRequestId`\
    \ returned by this method, which you can use for logging\nor to correlate sender\
    \ and receiver receipts.\n\n#### Receipt Timing\n\nBoth receipts are delivered\
    \ to whichever server the corresponding user is\ncurrently in once the transfer\
    \ settles (neither side needs to rejoin). If\na transfer is gated on receiver\
    \ approval, for example parental consent for\nthe receiver's account, it does\
    \ not settle until approval lands; receipts\nare delivered after that point.\n\
    \n- **Receiver receipt** is delivered to the server the receiver is\n  currently\
    \ in once the transfer settles, or on their next session join if\n  they are offline.\n\
    - **Sender receipt** is delivered immediately if the transfer settles\n  synchronously.\
    \ If approval is required, it is delivered to the server\n  the sender is currently\
    \ in once the receiver accepts, or on the sender's\n  next session join if they\
    \ are offline.\n\n#### Errors\n\nThis method throws an error if:\n\n- The `sender`\
    \ is not a valid `Class.Player` instance.\n- `receiverUserId` is not a positive\
    \ integer.\n- `amount` is not a positive integer.\n- The method is called from\
    \ the client instead of the server.\n"
  code_samples:
  - MarketplaceService-PromptRobuxTransferAsync1
  parameters:
  - name: sender
    type: Player
    default: null
    summary: 'The `Class.Player` initiating the transfer. Must be a valid player

      currently in the server.

      '
  - name: receiverUserId
    type: int64
    default: null
    summary: 'The `Class.Player.UserId|UserId` of the user who will receive the

      Robux.

      '
  - name: amount
    type: int64
    default: null
    summary: 'The amount of Robux to transfer. Must be a positive integer.

      '
  returns:
  - type: string
    summary: 'A string `transferRequestId` that uniquely identifies this transfer

      request. Use this ID to correlate with receipts delivered through

      `Class.MarketplaceService:BindReceiptHandler()|BindReceiptHandler`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - PromptExternalPurchase
