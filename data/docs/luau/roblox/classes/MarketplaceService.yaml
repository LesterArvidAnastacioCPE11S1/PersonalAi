callbacks:
- name: MarketplaceService.ProcessReceipt
  summary: 'A callback to process receipts of developer product purchases.

    '
  description: "`ProcessReceipt` is a callback to process receipts from\n[developer\
    \ product purchases](../../../production/monetization/developer-products.md).\n\
    You can sell developer products inside an experience using\n`MarketplaceService`\
    \ functions, or outside an experience on the Store tab\nof your experience details\
    \ page.\n\nYou should only set the `ProcessReceipt` callback one time in a single\n\
    server-side `Class.Script|Script`. This callback must handle the receipts\nfor\
    \ all developer products you have for sale.\n\n**IMPORTANT:** It's **highly recommended**\
    \ that you properly implement the\n`ProcessReceipt` callback in order to sell\
    \ your developer products. You\nshould use `ProcessReceipt` to grant users their\
    \ purchased product over\nany other granting method. If your `ProcessReceipt`\
    \ implementation isn't\ncorrect, you will **not** be able to grant users the products\
    \ they have\npurchased on the Store tab of your experience details page.\n\n####\
    \ Guarantees\n\nThe `ProcessReceipt` callback is called for all unresolved developer\n\
    product purchases when:\n\n- A user successfully completes the purchase of a developer\
    \ product.\n- A successful developer product purchase prompt appears to the user.\n\
    - A user joins the server.\n\nA purchase is considered **successfully initiated**\
    \ when:\n\n- The purchase is processed on Roblox's backend.\n- The funds are placed\
    \ in escrow.\n\nA purchase is considered **resolved** when:\n\n- The `ProcessReceipt`\
    \ callback returns a `Enum.ProductPurchaseDecision`\n  enum of `Enum.ProductPurchaseDecision.PurchaseGranted|PurchaseGranted`.\n\
    - The purchase is successfully recorded on Roblox's backend.\n\n#### Unresolved\
    \ Developer Product Purchases\n\nAn **unresolved developer product purchase**\
    \ takes place when a user's\npurchase of a developer product has not yet been\
    \ acknowledged by the\nserver through the `ProcessReceipt` function.\n\nUnresolved\
    \ developer product purchases are not removed or refunded after\nthe escrow period\
    \ expires.\n\n#### Retries and Timeouts\n\n`ProcessReceipt` has no time-based\
    \ retry mechanism. If a user makes a\npurchase that returns a `Enum.ProductPurchaseDecision`\
    \ enum of\n`Enum.ProductPurchaseDecision.PurchaseGranted|NotProcessedYet`, the\n\
    `ProcessReceipt` callback is only called again on the same server if:\n\n- The\
    \ user successfully initiates another developer product purchase.\n- The user\
    \ re-joins any server under the same experience.\n\n`ProcessReceipt` also has\
    \ no timeout for yielded callbacks. A\n`ProcessReceipt` callback can yield for\
    \ as long as the server is running,\nand the callback result is still accepted\
    \ when the result returns.\n\n#### Limitations\n\n- If you don't implement a `ProcessReceipt`\
    \ callback, your receipts will\n  be auto-acknowledged. You can't get a receipt\
    \ back after it has been\n  acknowledged.\n- When there are multiple purchases\
    \ pending for a user, `ProcessReceipt`\n  callbacks are called in a non-deterministic\
    \ order.\n- The user must be on the server for the `ProcessReceipt` callback to\
    \ be\n  invoked.\n- The user does not have to be on the server for the result\
    \ of the\n  `ProcessReceipt` callback to be recorded on the backend.\n- The `ProcessReceipt`\
    \ callback for a specific purchase might run on two\n  different servers at the\
    \ same time if the user joins the second server\n  before the callback returns\
    \ on the first server.\n- The `ProcessReceipt` callback might still fail to be\
    \ recorded on the\n  backend, even if it returns a `Enum.ProductPurchaseDecision`\
    \ enum of\n  `Enum.ProductPurchaseDecision.PurchaseGranted|PurchaseGranted`. When\n\
    \  this happens, the purchase remains unresolved.\n"
  code_samples:
  - ProcessReceipt-Example
  parameters:
  - name: receiptInfo
    type: Dictionary
    default: null
    summary: "The `receiptInfo` table passed to this callback contains the following\n\
      data:\n\n- `PurchaseId` &mdash; A unique identifier for the specific purchase.\n\
      - `PlayerId` &mdash; The user ID of the user who made the purchase.\n- `ProductId`\
      \ &mdash; The ID of the purchased product.\n- `PlaceIdWherePurchased` &mdash;\
      \ The place ID in which the purchase\n  was made. Depending on where the user\
      \ is during gameplay, the\n  purchase place's ID can be the same as or different\
      \ from the current\n  place's ID.\n- `CurrencySpent` &mdash; The amount of currency\
      \ spent in the\n  transaction.\n- `CurrencyType` &mdash; The type of currency\
      \ spent in the purchase;\n  always `Enum.CurrencyType.Robux`.\n- `ProductPurchaseChannel`\
      \ — How the user acquired the developer\n  product. One of `Enum.ProductPurchaseChannel`.\n"
  returns:
  - type: ProductPurchaseDecision
    summary: "An enum that represents how the developer product receipt was\nprocessed.\n\
      \n- `PurchaseGranted`:\n  - Indicates that the experience successfully granted\
      \ the player the\n    developer product.\n  - Indicates to Roblox that the developer\
      \ product sale was\n    successful.\n- `NotProcessedYet`:\n  - Indicates that\
      \ the experience failed to grant the player the\n    developer product.\n"
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
  writeCapabilities: []
