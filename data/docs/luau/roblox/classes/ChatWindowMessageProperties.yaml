name: ChatWindowMessageProperties
type: class
memory_category: Instances
summary: 'Customizes the appearance of an individual text chat message displayed in
  the

  chat window.

  '
description: "Can be used to customize the appearance of text chat messages sent to\
  \ the\nChatWindow. Inherits from `Class.TextChatMessageProperies`. To create a new\n\
  `ChatWindowMessageProperties` instance, use\n`Class.ChatWindowConfiguration:DeriveNewMessageProperties()`\
  \ which will have\nthe current properties from `Class.ChatWindowConfiguration`.\n\
  \n```lua\nlocal TextChatService = game:GetService(\"TextChatService\")\n\nlocal\
  \ ChatWindowConfiguration = TextChatService:FindFirstChildOfClass(\"ChatWindowConfiguration\"\
  )\n\nTextChatService.OnChatWindowAdded = function(message: TextChatMessage)\n  --\
  \ Derive chat message properties\n  local properties = ChatWindowConfiguration:DeriveNewMessageProperties()\n\
  \n  -- Change color of message within the chat window\n  properties.TextColor3 =\
  \ Color3.fromRGB(255, 121, 121)\n\n  return properties\nend\n```\n"
code_samples: []
