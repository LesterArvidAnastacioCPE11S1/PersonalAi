properties:
- name: StyleQuery.IsActive
  summary: 'A boolean that determines whether a `Class.StyleRule.Selector` of `@`
    will

    match the `Class.StyleQuery` name.

    '
  description: "A boolean that determines whether a `Class.StyleRule.Selector` of\
    \ `@` will\nmatch the `StyleQuery` name. For example, if a `StyleQuery` named\n\
    `SmGamepad` has conditions set for `Class.UserInputService.PreferredInput`\nof\
    \ `Enum.PreferredInput.Gamepad|Gamepad` and\n`Class.GuiService.ViewportDisplaySize`\
    \ of `Enum.DisplaySize.Small|Small`\nand both of these conditions are `true` (player\
    \ is playing on a small\ndisplay size and using a gamepad), the parent of the\
    \ `StyleQuery` will\nmatch any `Class.StyleRule.Selector` `@SmGamepad`.\n\n####\
    \ Conditions\n\n<table>\n<thead>\n  <tr>\n    <th>Condition</th>\n    <th>Type</th>\n\
    \    <th>Description</th>\n  </tr>\n</thead>\n<tbody>\n  <tr>\n    <td><code>AspectRatioRange</code></td>\n\
    \    <td><code>Datatype.NumberRange</code></td>\n    <td>Evaluates to <code>true</code>\
    \ if the parent width-to-height ratio of <code>Class.GuiBase2d.AbsoluteSize</code>\
    \ is greater than or equal to <code>AspectRatioRange.Min</code> and less than\
    \ <code>AspectRatioRange.Max</code>.</td>\n  </tr>\n  <tr>\n    <td><code>MaxSize</code></td>\n\
    \    <td><code>Datatype.Vector2</code></td>\n    <td>Evaluates to <code>true</code>\
    \ if the parent <code>Class.GuiBase2d.AbsoluteSize</code> is less than <code>MaxSize</code>.</td>\n\
    \  </tr>\n  <tr>\n    <td><code>MinSize</code></td>\n    <td><code>Datatype.Vector2</code></td>\n\
    \    <td>Evaluates to <code>true</code> if the parent <code>Class.GuiBase2d.AbsoluteSize</code>\
    \ is greater than or equal to <code>MinSize</code>.</td>\n  </tr>\n  <tr>\n  \
    \  <td><code>PreferredInput</code></td>\n    <td><code>Enum.PreferredInput</code></td>\n\
    \    <td>Evaluates to <code>true</code> if <code>PreferredInput</code> matches\
    \ <code>Class.UserInputService.PreferredInput</code>.</td>\n  </tr>\n  <tr>\n\
    \    <td><code>PreferredTextSize</code></td>\n    <td><code>Enum.PreferredTextSize</code></td>\n\
    \    <td>Evaluates to <code>true</code> if <code>PreferredTextSize</code> matches\
    \ <code>Class.GuiService.PreferredTextSize</code>.</td>\n  </tr>\n  <tr>\n   \
    \ <td><code>ReducedMotionEnabled</code></td>\n    <td>boolean</td>\n    <td>Evaluates\
    \ to <code>true</code> if <code>ReducedMotionEnabled</code> matches <code>Class.GuiService.ReducedMotionEnabled</code>.</td>\n\
    \  </tr>\n  <tr>\n    <td><code>ViewportDisplaySize</code></td>\n    <td><code>Enum.DisplaySize</code></td>\n\
    \    <td>Evaluates to <code>true</code> if <code>ViewportDisplaySize</code> matches\
    \ <code>Class.GuiService.ViewportDisplaySize</code>.</td>\n  </tr>\n</tbody>\n\
    </table>\n"
  code_samples: []
