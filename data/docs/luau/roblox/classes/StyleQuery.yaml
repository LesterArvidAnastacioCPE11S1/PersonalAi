- name: StyleQuery:SetCondition
  summary: ''
  description: 'Sets a new condition (or modifies an existing condition) for the

    `StyleQuery`. The `name` parameter should be a valid condition of

    `StyleQuery`, and the assigned value should match the condition''s value

    type, for example `Datatype.Vector2` for `MaxSize` or

    `Enum.PreferredInput` for `PreferredInput`.


    Attempts to assign invalid condition names such as `"Size"` or `"Input"`

    will silently fail. Type mismatches such as `Datatype.UDim2` for `MaxSize`

    or `string` for `ReducedMotionEnabled` will also fail.


    To set multiple conditions for a `StyleQuery` at once, see

    `Class.StyleQuery:SetConditions()|SetConditions()`.

    '
  code_samples:
  - StyleQuery-SetCondition
  parameters:
  - name: name
    type: string
    default: null
    summary: 'Condition name to set, for example `"MinSize"`.

      '
  - name: value
    type: Variant
    default: null
    summary: 'Condition value to set, for example `Datatype.Vector2.new(100, 0)`.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
- name: StyleQuery:SetConditions
  summary: 'Lets you declare and set multiple conditions of the `StyleQuery` at once.

    '
  description: 'Similar to `Class.StyleQuery:SetCondition()|SetCondition()` but lets
    you

    declare and set multiple conditions of the `StyleQuery` at once. Each

    `name` parameter should be a valid condition of `StyleQuery`, and the

    assigned value should match the condition''s value type, for example

    `Datatype.Vector2` for `MaxSize` or `Enum.PreferredInput` for

    `PreferredInput`.


    Attempts to assign invalid condition names such as `"Size"` or `"Input"`

    will silently fail. Type mismatches such as `Datatype.UDim2` for `MaxSize`

    or `string` for `ReducedMotionEnabled` will also fail.


    To set/update just one condition of a `StyleQuery`, see

    `Class.StyleQuery:SetCondition()|SetCondition()`.

    '
  code_samples:
  - StyleQuery-SetConditions
