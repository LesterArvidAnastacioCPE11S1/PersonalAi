name: StyleQuery
type: class
memory_category: Instances
summary: 'Instance used to set conditions such as `"MaxSize"` and `"PreferredInput"`
  for

  a `Class.StyleRule`.

  '
description: '`StyleQuery` is an instance used to set conditions like `"MaxSize"`
  and

  `"PreferredInput"` for a `Class.StyleRule`. If the conditions are `true`, the

  rule''s `@` selector is enabled. This is helpful to author styling with dynamic

  container sizes and cross-platform UI.

  '
code_samples: []
