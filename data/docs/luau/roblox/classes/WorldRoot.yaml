- name: WorldRoot:Shapecast
  summary: 'Casts the shape of a given `Class.BasePart` in a direction and returns
    a

    `Datatype.RaycastResult` if the shape hits a `Class.BasePart` or

    `Class.Terrain` cell.

    '
  description: 'Casts the shape of the given `Class.BasePart` in a given direction
    and

    returns the first collision with a `Class.BasePart` or `Class.Terrain`

    cell. This is analogous to how `Class.WorldRoot:Raycast()` casts a linear

    ray in a direction to find a collision, but it uses a 3D shape instead of

    a ray. Unlike `Class.WorldRoot:Blockcast()` and

    `Class.WorldRoot:Spherecast()`, which use a simple box or sphere, this

    method casts the actual geometry of the provided part.


    Unlike `Class.WorldRoot:GetPartsInPart()`, this method does not detect

    `Class.BasePart|BaseParts` that **initially** intersect the shape.


    If a hit is detected, a `Datatype.RaycastResult` is returned containing

    the hit information. The `Datatype.RaycastResult.Distance|Distance`

    property represents the distance the shape has to travel to find a hit,

    and the `Datatype.RaycastResult.Position|Position` property represents the

    intersection point that causes the hit.


    This method throws an error if it is passed a non-existent part, an

    invalid direction, or a part with `Class.Terrain` geometry.

    '
  code_samples: []
  parameters:
  - name: part
    type: BasePart
    default: null
    summary: 'The part whose shape is cast. The cast uses this part''s geometry

      (block, ball, mesh, and so on) and size; excessively large parts may

      not be supported, and it cannot be a `Class.Terrain` part.

      '
  - name: direction
    type: Vector3
    default: null
    summary: 'Direction of the shapecast, with the magnitude representing the

      maximum distance the shape can travel. The maximum distance is 1024

      studs.

      '
  - name: params
    type: RaycastParams
    default: RaycastParams{IgnoreWater=false, Margin=0, SizeGradient=0, BruteForceAllSlow=false,
      RespectCanCollide=false, CollisionGroup=Default, FilterDescendantsInstances={}}
    summary: 'An object used to specify hit eligibility in the shapecast operation.

      If not provided, default values are used where all other parts are

      considered and `Class.Terrain` water is not ignored. The part being

      cast is always excluded from the results.

      '
  - name: cframeOverride
    type: CFrame?
    default: nil
    summary: 'The `Datatype.CFrame` from which the shape begins the cast. If not

      provided, the part''s own `Class.BasePart.CFrame|CFrame` is used.

      '
  - name: sizeOverride
    type: Vector3?
    default: nil
    summary: 'The size of the cast shape. If not provided, the part''s own

      `Class.BasePart.Size|Size` is used. Every component must be finite and

      greater than or equal to `0`, and the shape must not exceed the

      maximum supported side length.

      '
  returns:
  - type: RaycastResult?
    summary: 'Contains the result of the shapecast operation, or `nil` if no

      eligible `Class.BasePart` or `Class.Terrain` cell was hit.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
