methods:
- name: WorldRoot:ArePartsTouchingOthers
  summary: 'Returns true if any of the given `Class.BasePart` are touching any other

    parts.

    '
  description: '**ArePartsTouchingOthers** returns true if at least one of the given

    `Class.BasePart` are touching any other parts. Two parts are considered

    "touching" if they are within the distance threshold, `overlapIgnored`.


    If no parts are provided, false is returned.

    '
  code_samples:
  - checking-for-touching-parts
  parameters:
  - name: partList
    type: Instances
    default: null
    summary: 'A list of parts checks to see if any parts in the list are touching

      any parts not in the list.

      '
  - name: overlapIgnored
    type: float
    default: 0.000199999995
    summary: 'The part overlap threshold in studs that is ignored before parts are

      considered to be touching.

      '
  returns:
  - type: boolean
    summary: 'True if and only if any of the `Class.Part|parts` in `partList` are

      touching any other parts (parts not in the partList). False if no

      parts are passed.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
- name: WorldRoot:Blockcast
  summary: 'Casts a block shape in a given direction and returns a

    `Datatype.RaycastResult` if the shape hits a `Class.BasePart` or

    `Class.Terrain` cell.

    '
  description: 'Casts a block shape in a given direction and returns the first collision

    with a `Class.BasePart` or `Class.Terrain` cell. This is analogous to how

    `Class.WorldRoot:Raycast()` casts a linear ray in a direction to find a

    collision, but it uses a 3D shape instead of a ray.


    Unlike `Class.WorldRoot:GetPartsInPart()`, this method does not detect

    `Class.BasePart|BaseParts` that **initially** intersect the shape.


    If a hit is detected, a `Datatype.RaycastResult` is returned containing

    the hit information. The `Datatype.RaycastResult.Distance|Distance`

    property represents the distance the shape has to travel to find a hit,

    and the `Datatype.RaycastResult.Position|Position` property represents the

    intersection point that causes the hit.


    This method throws an error if it is passed invalid `Datatype.CFrame`,

    size, or direction inputs.

    '
  code_samples:
  - worldroot---blockcast
  parameters:
  - name: cframe
    type: CFrame
    default: null
    summary: 'The initial position and rotation of the cast block shape.

      '
  - name: size
    type: Vector3
    default: null
    summary: 'The size of the cast block shape in studs. The maximum size is 512

      studs.

      '
  - name: direction
    type: Vector3
    default: null
    summary: 'Direction of the shapecast, with the magnitude representing the

      maximum distance the shape can travel. The maximum distance is 1024

      studs.

      '
  - name: params
    type: RaycastParams
    default: RaycastParams{IgnoreWater=false, Margin=0, SizeGradient=0, BruteForceAllSlow=false,
      RespectCanCollide=false, CollisionGroup=Default, FilterDescendantsInstances={}}
    summary: 'An object used to specify hit eligibility in the shapecast operation.

      If not provided, default values are used where all parts are

      considered and `Class.Terrain` water is not ignored.

      '
  returns:
  - type: RaycastResult?
    summary: 'Contains the result of the shapecast operation, or `nil` if no

      eligible `Class.BasePart` or `Class.Terrain` cell was hit.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities: []
  simulationAccess: true
- name: WorldRoot:BulkMoveTo
  summary: 'Moves an array of `Class.BasePart|BaseParts` to an array of

    `Datatype.CFrame|CFrames`.

    '
  description: 'This function moves an array of `Class.BasePart|BaseParts` to an array
    of

    `Datatype.CFrame|CFrames` without necessarily firing the default property

    `Class.Object.Changed|Changed` events. This provides a very fast way to

    move large numbers of parts, as you don''t have to pay the cost of separate

    property sets for each individual part.


    Both `partList` and `cframeList` are sequential arrays (Luau tables with

    integer indices starting at 1), not dictionaries. Each part at index `i`

    in `partList` is moved to the `Datatype.CFrame|CFrame` at index `i` in

    `cframeList`. The arrays must contain the same number of entries.


    ```lua

    local Workspace = game:GetService("Workspace")


    local partList = { Workspace.Part1, Workspace.Part2 }

    local cframeList = { CFrame.new(0, 5, 0), CFrame.new(10, 5, 0) }

    Workspace:BulkMoveTo(partList, cframeList, Enum.BulkMoveMode.FireCFrameChanged)

    ```


    The third argument allows you to further optimize the movement operation.

    By default, the `Class.Object.Changed|Changed` event of each part fires

    for `Class.BasePart.Position|Position`,

    `Class.BasePart.Orientation|Orientation`, and

    `Class.BasePart.CFrame|CFrame`. However, if you specify

    `Enum.BulkMoveMode|FireCFrameChanged` as the third argument, only the

    `Class.Object.Changed|Changed` event for the

    `Class.BasePart.CFrame|CFrame` property will fire.


    Note that you should only use this function if you''re sure that part

    movement is a bottleneck in your code. Simply setting the

    `Class.BasePart.CFrame|CFrame` property of individual parts and welded

    models is fast enough in the majority of cases.

    '
  code_samples: []
  parameters:
  - name: partList
    type: Instances
    default: null
    summary: 'An array of `Class.BasePart|BaseParts` to be moved. Each entry is

      matched by index to the corresponding entry in `cframeList`.

      '
  - name: cframeList
    type: Array
    default: null
    summary: 'An array of `Datatype.CFrame|CFrames` that the parts will be moved to,

      matched by index to `partList`. Both arrays must be the same length.

      '
  - name: eventMode
    type: BulkMoveMode
    default: FireAllEvents
    summary: 'An `Enum.BulkMoveMode` enum specifying which

      `Class.Object.Changed|Changed` events fire during the move. Default is

      `Enum.BulkMoveMode|FireAllEvents`.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
