- name: WorldRoot:FindPartOnRay
  summary: 'Returns the first `Class.BasePart` or `Class.Terrain` cell intersecting

    with the given `Datatype.Ray`.

    '
  description: "**FindPartOnRay** uses [raycasting](../../../workspace/raycasting.md)\
    \ to\nfind the first `Class.BasePart` or `Class.Terrain` cell intersecting with\n\
    a given `Datatype.Ray`. This function returns the `Class.BasePart` or\nterrain\
    \ cell hit, the point of intersection, the surface normal at the\npoint of intersection,\
    \ and the associated `Enum.Material` hit.\n\nIf the `ignoreDescendantsInstance`\
    \ parameter is provided, the raycasting\ncalculation will ignore the given object\
    \ and all of its descendants. It\nbehaves similar to the `Class.Mouse.TargetFilter`\
    \ property.\n\nThe `terrainCellsAreCubes` and `ignoreWater` parameters determine\
    \ whether\n`Class.Terrain` cells should be treated as cubes or not, and whether\
    \ water\nshould be ignored or not.\n\nIn order to include or exclude multiple\
    \ objects and their descendants, use\nthe `Class.WorldRoot:FindPartOnRayWithWhitelist()`\
    \ and\n`Class.WorldRoot:FindPartOnRayWithIgnoreList()` variants.\n\n#### Notes\n\
    \n- Theoretically, a ray extends infinitely in one direction. However, the\n \
    \ max length of the direction vector on Roblox is 15000 studs.\n- The length (magnitude)\
    \ of the directional vector is important, as parts\n  further away than its length\
    \ will not be tested.\n- If the ray does not intersect anything, the return values\
    \ will be `nil`\n  and the point at the end of the ray, respectively.\n- Parts\
    \ that are in a\n  [collision group](../../../workspace/collisions.md#collision-filtering)\n\
    \  that does not collide with the \"Default\" collision group are ignored\n  implicitly.\n"
  code_samples: []
  parameters:
  - name: ray
    type: Ray
    default: null
    summary: 'A `Datatype.Ray` whose origin and direction define the raycast.

      '
  - name: ignoreDescendantsInstance
    type: Instance
    default: nil
    summary: 'An `Class.Instance` whose descendants are ignored in the raycast.

      '
  - name: terrainCellsAreCubes
    type: boolean
    default: false
    summary: 'Whether `Class.Terrain` cells are treated as full cubes when

      calculating intersection. Default is false.

      '
  - name: ignoreWater
    type: boolean
    default: false
    summary: 'Whether `Class.Terrain` water cells are ignored by the ray. Default
      is

      false.

      '
  returns:
  - type: Tuple
    summary: 'The `Class.BasePart` or `Class.Terrain` cell hit, the

      `Datatype.Vector3` point of intersection, the `Datatype.Vector3`

      surface normal at the point of intersection, and the `Enum.Material`

      of the `Class.BasePart` or terrain cell hit.

      '
  tags:
  - Deprecated
  deprecation_message: 'This function has been deprecated. Use `Class.WorldRoot:Raycast()`
    along

    with `Datatype.RaycastParams` for new work.

    '
  security: None
  thread_safety: Unsafe
  capabilities: []
