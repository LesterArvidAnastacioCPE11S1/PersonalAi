- name: WorldRoot:IKMoveTo
  summary: 'Moves the specified part to the specified location via inverse kinematics

    rather than moving it there directly, to ensure any joints, constraints,

    or collisions that part is participating in remain physically satisfied.

    '
  description: "This function moves the specified part to the specified location via\n\
    [inverse kinematics](https://en.wikipedia.org/wiki/Inverse_kinematics)\nrather\
    \ than moving it there directly, to ensure any joints,\n`Class.Constraint|constraints`,\
    \ or collisions that part is participating\nin remain physically satisfied. Currently\
    \ this function is only available\nin Studio to `Class.Plugin|plugins`, as it\
    \ currently conflicts with the\nphysics of a running game.\n\n**Translate stiffness**\
    \ is a number between 0 and 1 specifying how\naggressively to match the part's\
    \ position to the position part of the\ntarget CFrame. **Rotate stiffness** is\
    \ a number between 0 and 1 specifying\nhow aggressively to match the part's rotation\
    \ to the rotation part of the\ntarget CFrame.\n\nFor example:\n\n- If translate\
    \ stiffness and rotate stiffness are both equal to 1, then\n  the part will be\
    \ moved exactly to the target CFrame regardless of what\n  physical constraints\
    \ there are on it.\n- If translate stiffness and rotate stiffness are both equal\
    \ to 0.5, then\n  the part will try to move to exactly the target CFrame, but\
    \ may be\n  pushed out of the way by physical constraints on it.\n- If translate\
    \ stiffness and rotate stiffness are both equal to 0, then\n  the target CFrame\
    \ will be ignored and physical constraints will be\n  solved for the object at\
    \ the position where it was.\n"
  code_samples: []
  parameters:
  - name: part
    type: BasePart
    default: null
    summary: 'The part being moved.

      '
  - name: target
    type: CFrame
    default: null
    summary: 'The location to move the specified part.

      '
  - name: translateStiffness
    type: float
    default: 0.5
    summary: 'A number between 0 and 1 specifying how aggressively to match the

      part''s position to the position part of the target `Datatype.CFrame`.

      '
  - name: rotateStiffness
    type: float
    default: 0.5
    summary: 'A number between 0 and 1 specifying how aggressively to match the

      part''s rotation to the rotation part of the target `Datatype.CFrame`.

      '
  - name: collisionsMode
    type: IKCollisionsMode
    default: OtherMechanismsAnchored
    summary: 'Allows you to specify what objects should be effected by the physical

      resolution.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: PluginSecurity
