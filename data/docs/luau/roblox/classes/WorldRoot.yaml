- name: WorldRoot:StepPhysics
  summary: 'Advances the simulation for parts in the world forward based on a

    specified time increment and an optional set of

    `Class.BasePart|BaseParts`.

    '
  description: 'Advances the simulation for parts in the world forward based on a

    specified time increment and an optional set of `Class.BasePart`. When a

    set of parts is specified, only these parts will be simulated and all

    other parts in the world will be treated as anchored. When this argument

    is left out, all parts in the world will be included in the simulation.

    The specified time increment can be any positive number, with larger

    values increasing the runtime of the function. Depending on the value of

    the time increment, the physics system may subdivide it into multiple

    individual steps to maintain the accuracy and stability of the simulation.

    Even if the function performs multiple substeps, the results of the

    simulation will only be seen once the function completes. To visualize the

    individual steps of a simulation, the function can be called once per

    RenderStep via the `Class.RunService.RenderStepped` event.

    '
  code_samples:
  - worldroot---stepphysics
  parameters:
  - name: dt
    type: float
    default: null
    summary: 'The amount of time that will be simulated. This argument must be a

      positive number. Larger values will increase the runtime of this

      function.

      '
  - name: parts
    type: Instances
    default: '{}'
    summary: 'Optional array of parts that will be simulated. This set must contain

      instances that are of type `Class.BasePart`; any other types will be

      ignored.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
- name: WorldRoot:UnregisterCollisionGroup
  summary: 'Unregisters the collision group for the given name in this world.

    '
  description: "Unregisters the collision group for the given name in this world,\
    \ with the\nfollowing behaviors:\n\n- If an invalid name is provided, the method\
    \ will not do anything.\n- If the reserved name `\"Default\"` is provided **or**\
    \ if the method is\n  called from a client, it will throw an error.\n- If there\
    \ are any parts in the collision group when it is removed, those\n  parts will\
    \ still maintain the same collision group name. The physical\n  behavior of parts\
    \ in a removed group is undefined, so it's recommended\n  to move any parts in\
    \ a removed group to another group, such as the\n  `\"Default\"` group.\n\nNote\
    \ that this method has a slight performance overhead based on the\nnumber of `Class.BasePart|BaseParts`\
    \ in the world, so it's recommended\nthat you register all collision groups at\
    \ edit time through the Studio\n[editor](../../../workspace/collisions.md#collision-groups)\
    \ and call this\nmethod as infrequently as possible.\n"
  code_samples: []
