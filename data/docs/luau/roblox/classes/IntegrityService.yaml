name: IntegrityService
type: class
memory_category: Instances
summary: 'A service that lets you decide how your experience responds to the device

  trust level of each player.

  '
description: '`IntegrityService` exposes the API to measure the

  [device trust level](../../../scripting/security/device-trust.md) of every

  player who joins your game. Roblox doesn''t take any action based on the device

  trust level; instead, you decide what it means for your experience, such as

  rejecting players on untrusted devices, restricting sensitive features, or

  sending players to a different place.


  To accept or reject each player once their trust level is available, assign a

  function to

  `Class.IntegrityService.EvaluatePlayerDeviceTrust|EvaluatePlayerDeviceTrust`.

  To read the trust level of a player at any time, use

  `Class.Player.DeviceTrustLevel`.


  The device trust level describes the player''s device, not the player or their

  account. **It doesn''t tell you whether a player is cheating.** For code

  samples and guidance on choosing a policy, see

  [device trust](../../../scripting/security/device-trust.md).

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: ''
properties: []
methods: []
events: []
callbacks:
- name: IntegrityService.EvaluatePlayerDeviceTrust
  summary: 'Decides whether a player can stay in the server once their device trust

    level is available.

    '
  description: "This callback is called once for each player, as soon as their device\n\
    trust level is available. Use it to decide whether the player can stay in\nthe\
    \ server, based on `Class.Player.DeviceTrustLevel` and the `measures`\ntable.\n\
    \nKeep the following in mind when you assign this callback:\n\n- You can only\
    \ assign it from a server-side `Class.Script`. Assigning it\n  from a client throws\
    \ an error.\n- Each place has one callback. If you assign it more than once, the\
    \ last\n  assignment replaces the earlier ones.\n- It runs after `Class.Players.PlayerAdded`\
    \ fires, because checking the\n  device takes time. When it runs, `Class.Player.DeviceTrustLevel`\
    \ is\n  never `Enum.PlayerDeviceTrustLevel.Pending|Pending`.\n- It can yield.\
    \ The player keeps playing while it runs, so a rejected\n  player can be disconnected\
    \ after they've started playing.\n- If the player leaves, or your scripts remove\
    \ them, before their trust\n  level is available, it isn't called for that player.\n\
    - Roblox doesn't check devices in Studio, so it isn't called during\n  playtests.\n\
    \nRoblox filters a custom `Message` and shortens messages that are too long.\n\
    If filtering would change the message, Roblox shows the default message\ninstead.\n\
    \nRoblox doesn't kick the player in each of the following cases:\n\n- No script\
    \ assigns the callback.\n- The callback returns `nil`, a value that isn't a table,\
    \ or a table\n  without a valid `Action`.\n- The callback throws an error. Roblox\
    \ reports the error like any other\n  script error.\n- The callback doesn't return\
    \ in time.\n\nFor code samples, see\n[device trust](../../../scripting/security/device-trust.md).\n"
  code_samples: []
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` being evaluated. Their trust level is already set

      in `Class.Player.DeviceTrustLevel` when this callback runs.

      '
  - name: measures
    type: Dictionary
    default: null
    summary: "A table of key-value pairs explaining the trust level of the player's\n\
      device. A value of `true` means the device passed that measure:\n\n- `IsPlatformVersionSecure`\
      \ &mdash; The operating system is at or\n  above the minimum version that Roblox\
      \ considers secure.\n- `IsPlatformBootSecure` &mdash; The operating system started\
      \ in a\n  secure state.\n- `IsAppSecure` &mdash; The Roblox app hasn't been\
      \ tampered with.\n\nA measure that isn't available on the device reads `true`,\
      \ so always\ncheck `Class.Player.DeviceTrustLevel` as well.\n"
  returns:
  - type: PlayerDeviceTrustResult?
    summary: "A table that tells Roblox what to do with the player, or `nil` to keep\n\
      them:\n\n- `Action` &mdash; Required. `Enum.PlayerDeviceTrustDecision.Reject`\n\
      \  disconnects the player. `Enum.PlayerDeviceTrustDecision.Accept`\n  keeps\
      \ them.\n- `Message` &mdash; Optional. The message that a rejected player sees.\n\
      \  If you omit it, Roblox shows a default message that explains how the\n  player\
      \ might fix their device.\n"
  tags: []
