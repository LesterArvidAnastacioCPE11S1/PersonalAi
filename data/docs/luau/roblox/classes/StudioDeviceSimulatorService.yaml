name: StudioDeviceSimulatorService
type: class
memory_category: Instances
summary: 'Service allowing you to control Studio''s Device Simulator.

  '
description: "Provides programmatic control over Studio's Device Simulator. Use this\
  \ service\nto switch between device presets, override resolution and pixel density,\n\
  control orientation and scaling, and manage custom device profiles from a\nplugin\
  \ or from an external tool connected through the MCP server.\n\nAll methods are\
  \ asynchronous and yield the calling coroutine. The service is\navailable in **Edit\
  \ mode** and **Play Client**. Methods that modify the active\nsimulation state are\
  \ blocked in **PlayServer** mode.\n\n##### Limitations\n\n- All methods are asynchronous\
  \ and yield the calling coroutine.\n- Methods that modify the active simulation\
  \ state (`SetDeviceAsync`,\n  `StopSimulationAsync`, `SetOrientationAsync`, `SetResolutionAsync`,\n\
  \  `SetPixelDensityAsync`, `SetScalingModeAsync`) error in PlayServer mode.\n  They\
  \ work in Edit mode and Play Client.\n- `UpdateDeviceAsync` and `RemoveDeviceAsync`\
  \ error when called on built-in\n  presets.\n- Resolution, DPI, and scaling mode\
  \ methods require an active device and error\n  when `GetDeviceAsync()` returns\
  \ \"default\".\n- Resolution and DPI overrides are session-level. They are not persisted\
  \ and\n  are cleared on `SetDeviceAsync`.\n- Built-in presets are immutable.\n"
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: ''
properties: []
methods:
- name: StudioDeviceSimulatorService:CreateDeviceAsync
  summary: 'Creates a custom device preset and returns its ID.

    '
  description: 'Creates a custom device and returns its newly assigned ID. Custom
    devices

    are persisted to disk and appear in the Device Simulator UI.


    Errors if any required field is missing or out of range.

    '
  code_samples:
  - StudioDeviceSimulatorService-CreateDeviceAsync
  parameters:
  - name: config
    type: Dictionary
    default: null
    summary: 'A dictionary describing the new device. Required fields: `Name`

      (string, 1-200 characters, cannot be `"default"`), `Width` (int,

      1-7680 pixels), `Height` (int, 1-4320 pixels), `PixelDensity` (int,

      72-10000 DPI). Optional fields: `DeviceForm` (`Enum.DeviceForm`,

      default Phone), `ResolutionScale` (float, default 1.0, max 10.0),

      `PortraitKeyboardHeight` (int, default 0), `LandscapeKeyboardHeight`

      (int, default 0).

      '
  returns:
  - type: string
    summary: 'string

      '
  tags:
  - Yields
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
