- name: StudioDeviceSimulatorService:SetResolutionAsync
  summary: 'Overrides the simulated viewport resolution for the current session.

    '
  description: 'Overrides the simulated viewport resolution or returns the current

    resolution as a Vector2. Overrides are session-level and cleared when you

    switch devices.


    Coordinates are in landscape space: the first parameter maps to the

    horizontal axis in landscape, the second to the vertical axis. In

    portrait, axes are swapped automatically.


    Both methods require an active device. They error if `GetDeviceAsync()`

    returns `"default"`. `SetResolutionAsync` also errors in PlayServer mode.

    '
  code_samples: []
  parameters:
  - name: width
    type: int
    default: null
    summary: 'The viewport width in pixels (horizontal axis in landscape

      orientation). Range: 1 to 7680.

      '
  - name: height
    type: int
    default: null
    summary: 'The viewport height in pixels (vertical axis in landscape

      orientation). Range: 1 to 4320.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Yields
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
- name: StudioDeviceSimulatorService:SetScalingModeAsync
  summary: 'Sets how the simulated resolution maps to the Studio viewport.

    '
  description: "Controls how the simulated resolution maps to the Studio viewport.\n\
    \n- `ScaleToPhysicalSize` scales the viewport to approximate physical device\n\
    \  size.\n- `ActualResolution` renders at exact pixel resolution.\n- `FitToWindow`\
    \ scales to fill the viewport.\n\nBoth methods require an active device. `SetScalingModeAsync`\
    \ also errors\nin PlayServer mode.\n"
  code_samples: []
  parameters:
  - name: mode
    type: DeviceSimulatorScalingMode
    default: null
    summary: 'The scaling mode to apply. One of

      `Enum.DeviceSimulatorScalingMode.ScaleToPhysicalSize`,

      `Enum.DeviceSimulatorScalingMode.ActualResolution`, or

      `Enum.DeviceSimulatorScalingMode.FitToWindow`.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Yields
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
