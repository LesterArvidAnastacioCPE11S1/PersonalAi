- name: StudioDeviceSimulatorService:GetDeviceInfoAsync
  summary: 'Returns the configuration dictionary for the specified device.

    '
  description: "Returns a `DeviceConfiguration` for the specified device without\n\
    activating it. Useful for inspecting presets before choosing one to switch\nto.\n\
    \nThe returned dictionary contains the following fields:\n\n<table size=\"small\"\
    >\n  <thead>\n    <tr>\n      <th>Field</th>\n      <th>Type</th>\n\t  <th>Create/Update</th>\n\
    \      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n    \
    \  <td><code>DeviceId</code></td>\n      <td>string</td>\n\t  <td>Read-only</td>\n\
    \      <td>Unique identifier assigned by the service.</td>\n    </tr>\n    <tr>\n\
    \      <td><code>Name</code></td>\n      <td>string</td>\n\t  <td>Required</td>\n\
    \      <td>Display name. 1 to 200 characters. Cannot be <code>\"default\"</code>.</td>\n\
    \    </tr>\n    <tr>\n      <td><code>Width</code></td>\n      <td>number</td>\n\
    \t  <td>Required</td>\n      <td>Screen width in pixels. Range: 1 to 7680.</td>\n\
    \    </tr>\n    <tr>\n      <td><code>Height</code></td>\n      <td>number</td>\n\
    \t  <td>Required</td>\n      <td>Screen height in pixels. Range: 1 to 4320.</td>\n\
    \    </tr>\n    <tr>\n      <td><code>PixelDensity</code></td>\n      <td>number</td>\n\
    \t  <td>Required</td>\n      <td>Pixel density in DPI. Range: 72 to 10000.</td>\n\
    \    </tr>\n    <tr>\n      <td><code>DeviceForm</code></td>\n      <td><code>Enum.DeviceForm</code></td>\n\
    \t  <td>Optional (default: Phone)</td>\n      <td>One of Phone, Tablet, Desktop,\
    \ Console, VR.</td>\n    </tr>\n    <tr>\n      <td><code>IsCustom</code></td>\n\
    \      <td>boolean</td>\n\t  <td>Read-only</td>\n      <td><code>true</code> if\
    \ the device was user-created.</td>\n    </tr>\n    <tr>\n      <td><code>ResolutionScale</code></td>\n\
    \      <td>number</td>\n\t  <td>Optional (default: 1.0)</td>\n      <td>Resolution\
    \ scaling factor. Must be greater than 0, max 10.0.</td>\n    </tr>\n    <tr>\n\
    \      <td><code>PortraitKeyboardHeight</code></td>\n      <td>number</td>\n\t\
    \  <td>Optional (default: 0)</td>\n      <td>Virtual keyboard height in portrait\
    \ mode.</td>\n    </tr>\n    <tr>\n      <td><code>LandscapeKeyboardHeight</code></td>\n\
    \      <td>number</td>\n\t  <td>Optional (default: 0)</td>\n      <td>Virtual\
    \ keyboard height in landscape mode.</td>\n    </tr>\n  </tbody>\n</table>\n"
  code_samples: []
  parameters:
  - name: deviceId
    type: string
    default: null
    summary: 'The unique identifier of the device to query. Must be a valid ID from

      `GetDeviceListAsync()`; cannot be `"default"`.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary containing the device configuration and passed to

      `CreateDeviceAsync` and `UpdateDeviceAsync`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: PluginSecurity
