events:
- name: Mouse.Button1Down
  summary: 'Fires when the left mouse button is pressed.

    '
  description: "This event fires when the player presses their left mouse button.\
    \ Note\nthat this can be accessed from a `Class.Tool`; for example, when placed\
    \ in\na `Class.LocalScript`, the code below prints `Button1Down` whenever the\n\
    left mouse button is pressed.\n\n```lua\nlocal tool = script.Parent  -- Make sure\
    \ this is a Tool object\n\ntool.Equipped:Connect(function(mouse)\n\tmouse.Button1Down:Connect(function()\n\
    \t\tprint(\"Button1Down\")\n\tend)\nend)\n```\n\nYou can find out the position\
    \ of the mouse in world space and if it's\npointing at any `Class.BasePart` using\
    \ the `Class.Mouse.Hit|Hit` and\n`Class.Mouse.Target|Target` properties.\n"
  code_samples: []
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
- name: Mouse.Button1Up
  summary: 'Fires when the left mouse button is released.

    '
  description: "This event fires when the player releases their left mouse button.\
    \ Note\nthat this can be accessed from a `Class.Tool`; for example, when placed\
    \ in\na `Class.LocalScript`, the code below prints `Button1Up` whenever the left\n\
    mouse button is released.\n\n```lua\nlocal tool = script.Parent  -- Make sure\
    \ this is a Tool object\n\ntool.Equipped:Connect(function(mouse)\n\tmouse.Button1Up:Connect(function()\n\
    \t\tprint(\"Button1Up\")\n\tend)\nend)\n```\n\nYou can find out the position of\
    \ the mouse in world space and if it's\npointing at any `Class.BasePart` using\
    \ the `Class.Mouse.Hit|Hit` and\n`Class.Mouse.Target|Target` properties.\n"
  code_samples: []
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
