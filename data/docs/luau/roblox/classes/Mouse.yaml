- name: Mouse.Idle
  summary: 'Fired during every heartbeat that the mouse isn''t being passed to another

    mouse event.

    '
  description: 'Fired during every heartbeat that the mouse isn''t being passed to
    another

    mouse event.


    Note, this event should not be used to determine when the mouse is still.

    As it fires every heartbeat it will fire between `Class.Mouse.Move`

    events.


    For information on how to obtain the `Class.Mouse` object, please see the

    `Class.Mouse` page.


    Developers can find out the position of the mouse in world-space, and if

    it is pointing at any `Class.BasePart` using the `Class.Mouse.Hit` and

    `Class.Mouse.Target` properties.


    Note, developers are recommended to use `Class.UserInputService` instead

    of the `Class.Mouse` object in new work.

    '
  code_samples:
  - Mouse-Idle1
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
- name: Mouse.KeyDown
  summary: 'Fires when a Key is pressed.

    '
  description: "This event fires when a Key is pressed, with the passed argument being\
    \ the\nkey that was pressed.\n\nNote:\n\n- Not all keys generate this event. However,\
    \ you can get around this with\n  a few of the keys, \"/\" for example, by using\
    \ the `Class.Mouse.KeyUp`\n  event.\n- Some keys generate the same string as other\
    \ keys.\n- It's possible for the string to be empty (possibly due to \"\\0\" key\n\
    \  code).\n"
  code_samples:
  - Mouse-KeyDown1
  parameters:
  - name: key
    type: string
    default: null
    summary: ''
  tags:
  - Deprecated
  deprecation_message: 'Mouse events have been superseded by `Class.UserInputService`
    which should

    be used in all new work.

    '
  security: None
  capabilities:
  - Input
- name: Mouse.keyDown
  summary: ''
  description: ''
  code_samples: []
  parameters:
  - name: key
    type: string
    default: null
    summary: ''
  tags:
  - Deprecated
  deprecation_message: 'This event is a deprecated variant of `Class.Mouse.KeyDown`
    which has also

    been deprecated. Neither event should be used in new work.

    '
  security: None
  capabilities:
  - Input
- name: Mouse.KeyUp
  summary: 'Fires when a Key is released.

    '
  description: "This event is fired when a Key is released, with the passed argument\
    \ being\nthe key that was released.\n\nNote:\n\n- Not all keys generate this event.\
    \ However, you can get around this with\n  a few of the keys, \"/\" for example,\
    \ by using the\n  [[API:Class/Mouse/KeyUp|KeyUp]] event.\n- Some keys generate\
    \ the same string as other keys.\n- It's possible for the string to be empty (possibly\
    \ due to \"\\0\" key\n  code).\n"
  code_samples:
  - Mouse-KeyUp1
