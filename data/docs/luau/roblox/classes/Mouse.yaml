name: Mouse
type: class
memory_category: Instances
summary: 'Legacy object that contains members useful for pointer input.

  '
description: "**Mouse** has been superseded by `Class.UserInputService` and\n`Class.ContextActionService`,\
  \ which cover a broader scope, are more feature\nrich, and support **cross-platform**\
  \ patterns better. It remains supported\nbecause of its widespread use, but you\
  \ should strongly consider using these\nalternatives.\n\nThe **Mouse** object houses\
  \ various API for pointers, primarily for buttons\nand raycasting. It can be accessed\
  \ through `Class.Player:GetMouse()` called on\nthe `Class.Players.LocalPlayer` in\
  \ a `Class.LocalScript`. It is also passed by\nthe `Class.Tool.Equipped` event.\n\
  \n- It is most notable for the `Class.Mouse.Icon|Icon` property, which changes\n\
  \  the cursor's appearance.\n- It continually raycasts the screen mouse position\
  \ into the 3D world using\n  the `Class.Mouse.TargetFilter|TargetFilter` property,\
  \ storing the results of\n  the raycast in the `Class.Mouse.Hit|Hit`, `Class.Mouse.Target|Target`,\
  \ and\n  `Class.Mouse.TargetSurface|TargetSurface` properties. These can be useful\n\
  \  for simple cases, but `Class.WorldRoot:Raycast()` should be used in more\n  complicated\
  \ [raycasting](../../../workspace/raycasting.md) scenarios.\n- `Class.Plugin|Plugins`\
  \ can use `Class.Plugin:GetMouse()` to get a\n  `Class.PluginMouse`, which behaves\
  \ similarly.\n\n```lua\n-- From a LocalScript:\nlocal Players = game:GetService(\"\
  Players\")\nlocal player = Players.LocalPlayer\nlocal mouse = player:GetMouse()\n\
  -- Setting the mouse icon\nmouse.Icon = \"rbxasset://SystemCursors/Wait\"\n```\n\
  \nNote:\n\n- This object does not control/restrict pointer movement. For this, see\n\
  \  `Class.UserInputService.MouseBehavior` and\n  `Class.UserInputService.MouseDeltaSensitivity`.\n\
  - If two functions are connected to same input event, such as\n  `Class.Mouse.Button1Down|Button1Down`,\
  \ **both** functions will run when the\n  event fires. There is no concept of sinking/passing\
  \ input, as events don't\n  support this behavior. However, `Class.ContextActionService`\
  \ does have this\n  behavior through `Class.ContextActionService:BindAction()|BindAction`.\n\
  - While a mouse may not be available on all platforms, Mouse will still\n  function\
  \ on mobile (touch) and console (gamepad), which don't typically have\n  mice or\
  \ pointer hardware. For explicit cross-platform behaviors, use\n  `Class.UserInputService`\
  \ and `Class.ContextActionService`.\n\n  See [Input and Camera](../../../input/index.md)\
  \ for more information on\n  customizing inputs in your experience.\n"
