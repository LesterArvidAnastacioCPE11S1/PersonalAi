  - Deprecated
  deprecation_message: 'Mouse events have been superseded by `Class.UserInputService`
    which should

    be used in all new work.

    '
  security: None
  capabilities:
  - Input
- name: Mouse.Move
  summary: 'Fired when the mouse is moved.

    '
  description: "Fired when the mouse is moved.\n\nNote, this event is fired when the\
    \ mouse's position is updated, therefore\nit will fire repeatedly while being\
    \ moved.\n\nFor information on how to obtain the `Class.Mouse` object, please\
    \ see the\n`Class.Mouse` page.\n\nDevelopers can find out the position of the\
    \ mouse in world-space, and if\nit is pointing at any `Class.BasePart` using the\
    \ `Class.Mouse.Hit` and\n`Class.Mouse.Target` properties.\n\n```\nmouse.Move:Connect(function()\n\
    \tlocal position = mouse.Hit.p\n\tlocal target = mouse.Target\n\tprint(target,\
    \ position)\nend)\n```\n\nNote, developers are recommended to use `Class.UserInputService`\
    \ instead\nof the `Class.Mouse` object in new work.\n"
  code_samples:
  - move-parts-with-the-mouse
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
- name: Mouse.WheelBackward
  summary: 'Fires when the mouse wheel is scrolled backwards.

    '
  description: 'The WheelBackward event fires when the mouse wheel is scrolled backwards.

    Possible uses for this event include toggling a gun''s scope in a first

    person shooter (FPS) or zooming the player''s camera.


    This can be used alongside the scrolling forward event,

    `Class.Mouse.WheelForward`.


    For information on how to obtain the `Class.Mouse` object, please see the

    `Class.Mouse` page.


    Note, developers are recommended to use `Class.UserInputService` instead

    of the `Class.Mouse` object in new work.

    '
  code_samples:
  - Mouse-WheelBackward1
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Input
