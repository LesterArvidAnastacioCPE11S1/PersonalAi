  description: "**Icon** is a property that determines the image used as the pointer.\
    \ If\nblank, a default arrow is used. While the cursor hovers over a\n`Class.GuiButton`,\
    \ this property is temporarily ignored.\n\nTo hide the cursor entirely, **do not**\
    \ use a transparent image &ndash;\ninstead, set `Class.UserInputService.MouseIconEnabled`\
    \ to false.\n\nFor getting/setting the user mouse icon in experiences, you should\
    \ use\n`Class.UserInputService.MouseIcon`. `Class.Mouse.Icon` will be deprecated\n\
    after the new API for plugins to set the mouse cursor is released.\n\n##### Designing\
    \ a Cursor\n\nThe following guidelines may prove useful when creating your own\
    \ mouse\ncursors:\n\n- The dimensions of the image used determines the size of\
    \ the cursor.\n- The dimensions of the image should not exceed 256 pixels on any\
    \ axis.\n- The **center** of the image is where mouse inputs are issued.\n- The\
    \ default mouse image is 64x64 pixels, with the mouse taking up 17x24\n  pixels\
    \ of space.\n\n##### System Cursors\n\nWhen using a `Class.PluginMouse` retrieved\
    \ from `Class.Plugin:GetMouse()`,\nyou can use the following icons similar to\
    \ your system's default cursors,\nsuch as hands, arrows, I-beams, etc. You can\
    \ use these with GUI events\nlike `Class.GuiObject.MouseEnter|MouseEnter`,\n`Class.GuiObject.MouseLeave|MouseLeave`,\
    \ and\n`Class.GuiButton.MouseButton1Down|MouseButton1Down` to provide a\nconsistent\
    \ Studio experience when interacting with certain kinds of GUI\ncomponents. Note\
    \ that these only work for Studio plugins; they will not\nwork for other `Class.Mouse`\
    \ objects.\n\n<table>\n    <thead>\n        <tr>\n            <th>Look*</th>\n\
    \            <th>Asset</th>\n            <th>Suggested Use</th>\n        </tr>\n\
    \    </thead>\n    <tbody>\n        <tr>\n            <td><img src=\"../../../assets/misc/Mouse-Icon-Pointer.png\"\
