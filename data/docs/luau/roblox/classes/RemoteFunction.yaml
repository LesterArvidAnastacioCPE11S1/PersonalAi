methods:
- name: RemoteFunction:InvokeClient
  summary: 'Invokes the `Class.RemoteFunction` which in turn calls the

    `Class.RemoteFunction.OnClientInvoke|OnClientInvoke` callback.

    '
  description: "Invokes the `Class.RemoteFunction` which in turn calls the\n`Class.RemoteFunction.OnClientInvoke|OnClientInvoke`\
    \ callback. Since this\nmethod is used to communicate from the server to a client,\
    \ it will only\nwork when used in a `Class.Script`.\n\nAny type of Roblox object\
    \ such as an `Datatype.Enum`, `Class.Instance`, or\nothers can be passed as a\
    \ parameter to\n`Class.RemoteFunction:InvokeClient()|InvokeClient()`, as well\
    \ as Luau\ntypes such as numbers, strings, and booleans, although you should\n\
    carefully explore the\n[limitations](../../../scripting/events/remote.md#argument-limitations).\n\
    \nSee [Remote Events and Callbacks](../../../scripting/events/remote.md) for\n\
    code samples and further details on `Class.RemoteFunction`.\n\n#### Warning\n\n\
    In practice, the server does not often invoke the client, as clients\ntypically\
    \ do not have information that the server doesn't have, and\nactions that only\
    \ a client can take, such as displaying a GUI, typically\ndo not require a callback.\
    \ As such, `Class.RemoteEvent:FireClient()` is\nrecommended as an asynchronous\
    \ method that doesn't need to wait for a\nresponse to continue execution.\n\n\
    If you legitimately need to invoke a client from the server, note the\nfollowing\
    \ risks:\n\n- If the client throws an error, the server throws the error too.\n\
    - If the client disconnects while it's being invoked,\n  `Class.RemoteFunction:InvokeClient()|InvokeClient()`\
    \ throws an error.\n- If the client doesn't return a value, the server yields\
    \ forever.\n"
  code_samples: []
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` associated with the client to invoke.

      '
  - name: arguments
    type: Tuple
    default: null
    summary: 'Values to pass to the

      `Class.RemoteFunction.OnClientInvoke|OnClientInvoke` callback.

      '
  returns:
  - type: Tuple
    summary: 'Values returned from the

      `Class.RemoteFunction.OnClientInvoke|OnClientInvoke` callback.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - RemoteEvent
- name: RemoteFunction:InvokeServer
  summary: 'Invokes the `Class.RemoteFunction` which in turn calls the

    `Class.RemoteFunction.OnServerInvoke|OnServerInvoke` callback.

    '
  description: 'Invokes the `Class.RemoteFunction` which in turn calls the

    `Class.RemoteFunction.OnServerInvoke|OnServerInvoke` callback. Since this

    method is used to communicate from a client to the server, it will only

    work when used in a `Class.LocalScript`.


    If a returned result is not needed, it''s recommended to use

    `Class.RemoteEvent:FireServer()` instead, as its call is asynchronous and

    doesn''t need to wait for a response to continue execution.


    Any type of Roblox object such as an `Datatype.Enum`, `Class.Instance`, or

    others can be passed as a parameter to

    `Class.RemoteFunction:InvokeServer()|InvokeServer()`, as well as Luau

    types such as numbers, strings, and booleans, although you should

    carefully explore the

    [limitations](../../../scripting/events/remote.md#argument-limitations).


    See [Remote Events and Callbacks](../../../scripting/events/remote.md) for

    code samples and further details on `Class.RemoteFunction`.

    '
  code_samples: []
  parameters:
  - name: arguments
    type: Tuple
    default: null
    summary: 'Values to pass to the

      `Class.RemoteFunction.OnServerInvoke|OnServerInvoke` callback.

      '
  returns:
  - type: Tuple
    summary: 'Values returned from the

      `Class.RemoteFunction.OnServerInvoke|OnServerInvoke` callback.

      '
