name: ViewportFrame
type: class
memory_category: Gui
summary: '`Class.GuiObject` that renders 3D objects inside its bounds.

  '
description: "`ViewportFrame` is a `Class.GuiObject` that renders 3D objects inside\
  \ its\nbounds, offering a way to display 3D objects in a 2D space like a\n`Class.ScreenGui`.\
  \ This object has the following caveats:\n\n- No shadows or\n  [post-processing](../../../environment/post-processing-effects.md)\
  \ effects\n  are rendered.\n\n- `Enum.Material.Neon` and `Enum.Material.Glass` materials\
  \ render at the\n  lowest quality.\n\n- Nested `Class.GuiObject|GuiObjects` aren't\
  \ supported.\n\n- By default, lighting inside a `ViewportFrame` acts as if\n  `Class.Lighting.EnvironmentSpecularScale`\
  \ and\n  `Class.Lighting.EnvironmentDiffuseScale` are both set to `0`, so properties\n\
  \  that rely on these fields, such as `Class.SurfaceAppearance.MetalnessMap`,\n\
  \  may look different.\n\n- This object can use a `Class.Sky` child as a cubemap\
  \ for reflections, in\n  which case only the `Class.Sky` object's six `Skybox[…]`\
  \ properties are\n  used. Assuming these properties are valid, lighting inside the\n\
  \  `ViewportFrame` acts similarly to if\n  `Class.Lighting.EnvironmentSpecularScale`\
  \ and\n  `Class.Lighting.EnvironmentDiffuseScale` are both set to `1`. For details,\n\
  \  see [here](../../../ui/viewport-frames.md).\n"
