name: WrapTextureTransfer
type: class
memory_category: Instances
summary: '`Class.WrapTextureTransfer` allows a parent `Class.Decal` to be wrapped
  around

  its parent `Class.MeshPart` based on the cage of its `Class.WrapTarget`.

  '
description: "WrapTextureTransfer provides an alternative projection mode for `Class.Decal`\n\
  where this `Class.Decal` is fit to the parent `Class.MeshPart` based on it's\nCageMesh\
  \ provided in `Class.WrapTarget`.\n\nThis is useful as it allows fitting of Decals\
  \ to a wide variety of differently\nshaped MeshParts that share a similar WrapTarget\
  \ CageMesh topology. By\nauthoring textures that are in the WrapTarget UV space,\
  \ these textures can be\nreused across many different MeshParts with different texture\
  \ layouts.\n\n- DataModel Structure\n  - `Class.MeshPart`\n    - `Class.WrapTarget`\n\
  \    - `Class.Decal`\n      - `Class.WrapTextureTransfer`\n\nA way to visualize\
  \ how this works is to imagine the Decals textures on the\nWrapTarget CageMesh,\
  \ which is wrapped around the MeshPart. These textures are\nthen projected from\
  \ the CageMesh onto the MeshPart surface. Geometry that is\ninternal to the MeshPart,\
  \ or that is not covered by the CageMesh, will not\nreceive any projected decal\
  \ textures. Segmented regions of the target\n`Class.MeshPart` are used to improve\
  \ projection quality near holes or\nboundaries in the CageMesh.\n"
