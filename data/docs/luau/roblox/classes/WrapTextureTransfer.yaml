methods:
- name: WrapTextureTransfer:PrepareProjectionMeshDataAsync
  summary: 'Prepares and caches projection data for using this

    `Class.WrapTextureTransfer` with projected `Class.EditableImage`

    operations.

    '
  description: "Prepares this `Class.WrapTextureTransfer` for use as the\n`projectionSource`\
    \ in `Class.EditableImage:DrawImageProjected()` and\n`Class.EditableImage:SampleImageProjected()`.\
    \ This method takes no\nparameters, yields until preparation completes, and returns\
    \ no value.\n\nThis allows projected texture editing, such as painting makeup\
    \ on a\nplayer's current head, without creating an `Class.EditableMesh` from the\n\
    target asset or requiring permission to create one. The prepared data is\ncached\
    \ internally; it is not returned to scripts and cannot be inspected,\nconverted\
    \ to `Datatype.Content`, or published.\n\nThe `Class.WrapTextureTransfer` must\
    \ be parented to a `Class.Decal` whose\nparent is a `Class.MeshPart` with mesh\
    \ content and a valid\n`Class.WrapTarget` child. This hierarchy must be in the\
    \ data model.\nConfigure `Class.WrapTextureTransfer.ReferenceCageMeshContent`,\n\
    `Class.WrapTextureTransfer.UVMinBound`, and\n`Class.WrapTextureTransfer.UVMaxBound`\
    \ as needed before calling this\nmethod.\n\nThe prepared data combines the target\
    \ mesh's positions, normals, and\ntriangle connectivity within the region covered\
    \ by the transfer with the\ntransferred UVs computed from the current cage configuration\
    \ and UV\nbounds. The geometry is scaled to match the target `Class.MeshPart`'s\n\
    current `Class.BasePart.Size`. Projection positions and directions use the\ntarget\
    \ MeshPart's local space.\n\nPreparation is reused across projected image operations\
    \ while the data\nremains valid. Changes to the target mesh or its size, cage\
    \ configuration,\nUV bounds, or hierarchy invalidate the cached data. Call this\
    \ method again\nafter such a change. Both projection methods raise an error if\
    \ preparation\nhas not completed successfully or the cached data has been invalidated.\n\
    Passing an `Class.EditableMesh` to those methods does not require this\npreparation.\n\
    \nUse `pcall()` to handle preparation errors, including invalid hierarchy,\nunavailable\
    \ mesh or cage data, failed UV transfer, or inputs changing\nduring preparation.\
    \ Only perform projected image operations after the call\nsucceeds.\n\nFor example,\
    \ with the head, decal, images, reference cage content, UV\nbounds, and brush\
    \ configurations already defined:\n\n```lua\nlocal projectionTransfer = Instance.new(\"\
    WrapTextureTransfer\")\nprojectionTransfer.ReferenceCageMeshContent = referenceCageContent\n\
    projectionTransfer.UVMinBound = makeupUVMin\nprojectionTransfer.UVMaxBound = makeupUVMax\n\
    projectionTransfer.Parent = makeupDecal\nmakeupDecal.Parent = playerHead\n\nlocal\
    \ success, errorMessage = pcall(function()\n    projectionTransfer:PrepareProjectionMeshDataAsync()\n\
    end)\n\nif not success then\n    warn(\"Failed to prepare makeup projection: \"\
    \ .. tostring(errorMessage))\n    return\nend\n\nmakeupTexture:DrawImageProjected(projectionTransfer,\
    \ projection, brushConfig)\nsampledBrush:SampleImageProjected(\n    projectionTransfer,\n\
    \    makeupTexture,\n    projection,\n    sampleBrushConfig\n)\n```\n"
