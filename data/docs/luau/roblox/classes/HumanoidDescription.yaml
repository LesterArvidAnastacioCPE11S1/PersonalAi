methods:
- name: HumanoidDescription:AddEmote
  summary: 'Adds the emote to the description given a name and its asset ID.

    '
  description: "**AddEmote** will add an Emote asset to the description given a name\
    \ and\nits asset ID. The asset ID must be for an \"Emote\" asset (see\n[Featured\
    \ emotes](https://www.roblox.com/catalog?Category=0&Subcategory=39)\nin the Catalog).\n\
    \nYou can add multiple emotes of the same name. All emotes of the same name\n\
    can be removed using\n`Class.HumanoidDescription:RemoveEmote()|RemoveEmote`. If\
    \ an emote with\nthe same ID is added under the same name,\n`Class.HumanoidDescription.EmotesChanged|EmotesChanged`\
    \ fires.\n\nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:GetEmotes()|GetEmotes`,\
    \ which can be used to\n  retrieve the emotes that have been added by this function\n\
    - `Class.HumanoidDescription:SetEmotes()|SetEmotes` and\n  `Class.HumanoidDescription:RemoveEmote()|RemoveEmote`,\
    \ which also\n  manipulate what emotes have been added\n- `Class.HumanoidDescription.EmotesChanged|EmotesChanged`,\
    \ which fires\n  after this function is called\n"
  code_samples: []
  parameters:
  - name: name
    type: string
    default: null
    summary: 'A string that identifies what emote is being added. Example:

      `"Salute"`.

      '
  - name: assetId
    type: int64
    default: null
    summary: 'An emote asset ID.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription:GetAccessories
  summary: 'Returns a table of an avatar''s current accessories.

    '
  description: 'Returns a table of an avatar''s current accessories. If the second

    parameter (includeRigidAccessories) is true then the returned table will

    also include entries for rigid accessories from the rigid accessory

    properties.

    '
  code_samples:
  - get-accessories
  parameters:
  - name: includeRigidAccessories
    type: boolean
    default: null
    summary: 'Set to true if rigid accessories from the rigid accessory properties

      should also be included in the return array. False means only include

      layered clothing accessories from the AccessoryBlob.

      '
  returns:
  - type: List<AccessoriesInfo>
    summary: 'Returns an array where each entry specifies for an individual

      accessory the AccessoryType, AssetId, IsLayered, Order and Puffiness.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription:GetEmotes
  summary: 'Returns a dictionary of emotes that have been

    `Class.HumanoidDescription:AddEmote()|added` or

    `Class.HumanoidDescription:SetEmotes()|set` to this description.

    '
  description: "**GetEmotes** returns a dictionary of emotes that have been\n`Class.HumanoidDescription:AddEmote()|added`\
    \ or\n`Class.HumanoidDescription:SetEmotes()|set` to this description. The keys\n\
    of this dictionary are the names of the emotes, and the values are a\nnon-empty\
    \ array of emote IDs for that name.\n\n#### Example\n\n```lua\nlocal hd = Instance.new(\"\
    HumanoidDescription\")\nhd:AddEmote(\"Salute\", 3360689775)\nlocal emotes = hd:GetEmotes()\n\
    for name, ids in emotes do\n    print((\"The emote %s has %d ids:\"):format(name,\
    \ #ids))\n    for _, id in ids do\n        print(id)\n    end\nend\n```\n\nSee\
    \ also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:SetEmotes()|SetEmotes`\
    \ and\n  `Class.HumanoidDescription:AddEmote()|AddEmote`, which can add emotes\n\
    \  that may be returned by this function\n- `Class.HumanoidDescription.EmotesChanged|EmotesChanged`,\
    \ which fires\n  with the value returned this function after it may have changed\n"
  code_samples: []
  parameters: []
  returns:
  - type: Dictionary
    summary: "A dictionary of emotes where the key is the emote name and the value\n\
      is an array of emote asset IDs. Example:\n\n```lua\n{\n    Salute = {3360689775},\n\
      \    Agree = {4849487550},\n    Disagree = {4849495710}\n}\n```\n\n.\n"
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription:GetEquippedEmotes
  summary: 'Returns an array of tables describing the equipped emotes that have been

    `Class.HumanoidDescription:SetEquippedEmotes()|set`.

    '
  description: "**GetEquippedEmotes** returns an array of tables which indicate the\
    \ `Name`\nand `Slot` of each equipped emote as it was set by\n`Class.HumanoidDescription:SetEquippedEmotes()|SetEquippedEmotes`.\n\
    \n#### Example\n\n```lua\nlocal hd = Instance.new(\"HumanoidDescription\")\nhd:SetEmotes({Salute\
    \ = {3360689775}, Agree = {4849487550}})\nhd:SetEquippedEmotes({\"Salute\", \"\
    Agree\"})\n-- Iterate over the equipped emotes:\nfor _, t in hd:GetEquippedEmotes()\
    \ do\n    print((\"In slot %d: emote %s is equipped\"):format(t.Slot, t.Name))\n\
    end\n```\n\nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:SetEquippedEmotes()|SetEquippedEmotes`,\
    \ which\n  sets the currently equipped emotes and changes what this function\n\
    \  returns\n- `Class.HumanoidDescription.EquippedEmotesChanged|EquippedEmotesChanged`,\n\
    \  which fires when the function returned by this value may have changed\n"
  code_samples: []
  parameters: []
  returns:
  - type: Array
    summary: "An array of tables describing the name and slot which each emote is\n\
      equipped. Example:\n\n```lua\n{\n    {Slot = 3, Name = \"Salute\"},\n    {Slot\
      \ = 2, Name = \"Agree\"},\n    {Slot = 1, Name = \"Disagree\"},\n}\n```\n\n\
      .\n"
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription:RemoveEmote
  summary: 'Removes any emotes that have been added under the given name.

    '
  description: "**RemoveEmote** removes all emotes from the description that have\
    \ been\n`Class.HumanoidDescription:AddEmote()|added` or\n`Class.HumanoidDescription:SetEmotes()|set`\
    \ under the given name. If there\nare no added emotes with the given name, no\
    \ error is thrown and\n`Class.HumanoidDescription.EmotesChanged|EmotesChanged`\
    \ **does not** fire.\n\nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:SetEmotes()|SetEmotes`\
    \ and\n  `Class.HumanoidDescription:AddEmote()|AddEmote`, which can add emotes\n\
    \  that may be removed\n- `Class.HumanoidDescription:GetEmotes()|GetEmotes`, which\
    \ can retrieve a\n  dictionary of emotes that may be removed\n"
  code_samples: []
  parameters:
  - name: name
    type: string
    default: null
    summary: 'The name of the emote as it was

      `Class.HumanoidDescription:SetEmotes()|set` or

      `Class.HumanoidDescription:AddEmote()|added`.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription:SetAccessories
  summary: 'Accepts a table that sets the accessories and related properties for an

    avatar.

    '
  description: 'Accepts a table that sets the accessories and related properties for
    an

    avatar. If the second parameter (includeRigidAccessories) is true, then

    this function can also be used to set the rigid accessories in the rigid

    accessory properties. In this case any table entry that does not have an

    Order will be considered a rigid accessory and put in the appropriate

    property according to the AccessoryType.

    '
  code_samples:
  - set-accessories
  parameters:
  - name: accessories
    type: Array
    default: null
    summary: 'Each entry specifies for an individual accessory the AccessoryType,

      AssetId, IsLayered, Order and Puffiness.

      '
  - name: includeRigidAccessories
    type: boolean
    default: null
    summary: 'Set to true if rigid accessories are also included in the passed in

      array (they would have to not specify Order).

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription:SetEmotes
  summary: 'Sets all of the emotes on this description.

    '
  description: "**SetEmotes** sets all of the emotes on this description given a table\n\
    similar to that returned by\n`Class.HumanoidDescription:GetEmotes()|GetEmotes`.\
    \ It fires\n`Class.HumanoidDescription.EmotesChanged|EmotesChanged`\n\n#### Example\n\
    \n```lua\nlocal emotes = {\n    Salute = {3360689775}, -- Syntax note: can also\
    \ use [\"Salute\"] = ...\n    Agree = {4849487550},\n    Disagree = {4849495710}\n\
    }\nlocal hd = Instance.new(\"HumanoidDescription\")\nhd:SetEmotes(emotes)\n```\n\
    \nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:AddEmote()|AddEmote`\
    \ and\n  `Class.HumanoidDescription:RemoveEmote()|RemoveEmote` which can modify\n\
    \  the added emotes on an individual level\n- `Class.HumanoidDescription.EmotesChanged|EmotesChanged`,\
    \ which fires\n  when this function is called\n"
  code_samples: []
  parameters:
  - name: emotes
    type: Dictionary
    default: null
    summary: "A dictionary of emotes where the key is the emote name and the value\n\
      is an array of emote asset IDs. Example:\n\n```lua\n{\n    Salute = {3360689775},\n\
      \    Agree = {4849487550},\n    Disagree = {4849495710}\n}\n```\n\n.\n"
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription:SetEquippedEmotes
  summary: 'Sets the currently equipped emotes given an array of emote names.

    '
  description: "**SetEquippedEmotes** sets the currently equipped emotes given an\
    \ array of\nemote names as they were passed to\n`Class.HumanoidDescription:AddEmote()|AddEmote`\
    \ or\n`Class.HumanoidDescription:SetEmotes()|SetEmotes`. It can also take an\n\
    array of tables similar to that returned by\n`Class.HumanoidDescription:GetEquippedEmotes()|GetEquippedEmotes`.\
    \ Calling\nthis function fires\n`Class.HumanoidDescription.EquippedEmotesChanged|EquippedEmotesChanged`.\n\
    \n#### Example\n\n```lua\nlocal hd = Instance.new(\"HumanoidDescription\")\nhd:SetEmotes({Salute\
    \ = {3360689775}, Agree = {4849487550}})\n-- Can provide either an array of strings...\
    \ (index is slot number)\nhd:SetEquippedEmotes({\"Salute\", \"Agree\"})\n-- ...or\
    \ an array of tables as returned by GetEquippedEmotes (Slot and Name keys set)\n\
    hd:SetEquippedEmotes({{Slot = 1, Name = \"Salute\"}, {Slot = 2, Name = \"Agree\"\
    }})\n```\n\nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:GetEquippedEmotes()|GetEquippedEmotes`,\
    \ which\n  returns a value describing the equipped emotes set by this function\n\
    - `Class.HumanoidDescription.EquippedEmotesChanged|EquippedEmotesChanged`,\n \
    \ which fires when this function is called\n"
  code_samples: []
  parameters:
  - name: equippedEmotes
    type: Array
    default: null
    summary: "An array of emote names. Example:\n\n```lua\n{ \"Disagree\", \"Agree\"\
      , \"Salute\" }\n```\n\n&ndash; OR &ndash; An array of tables describing the\
      \ name and slot\nwhich each emote is equipped. Example:\n\n```lua\n{\n    {Slot\
      \ = 3, Name = \"Salute\"},\n    {Slot = 2, Name = \"Agree\"},\n    {Slot = 1,\
      \ Name = \"Disagree\"},\n}\n```\n\n.\n"
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
