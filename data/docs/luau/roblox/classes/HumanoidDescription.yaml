- name: HumanoidDescription.Face
  summary: 'Determines the asset ID of the Face to be applied to the `Class.Humanoid`.

    '
  description: "**Face** determines the asset ID of the Face to be\n`Class.Humanoid:ApplyDescriptionAsync()|applied`\
    \ to a `Class.Humanoid`.\nThe type of the asset ID provided **must be for a Face**\
    \ type asset and\nnot a Decal or Image type asset.\n\nThe actual face texture\
    \ is rendered using a `Class.Decal` in the Head\nnamed \"face\" or \"Face\".\n\
    \nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription.GraphicTShirt|GraphicTShirt`,\n\
    \  `Class.HumanoidDescription.Shirt|Shirt` and\n  `Class.HumanoidDescription.Pants|Pants`,\
    \ which also apply textures to a\n  rig\n- `Class.HumanoidDescription.Head|Head`,\
    \ which can change the mesh of the\n  head\n- `Class.HumanoidDescription.FaceAccessory|FaceAccessory`,\
    \ which can apply\n  one or more `Class.Accessory` objects to the face\n"
