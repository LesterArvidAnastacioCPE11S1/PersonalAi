events:
- name: HumanoidDescription.EmotesChanged
  summary: 'Fires when emotes are added, removed or set on this description.

    '
  description: "**EmotesChanged** fires when emotes are\n`Class.HumanoidDescription:AddEmote()|added`,\n\
    `Class.HumanoidDescription:RemoveEmote()|removed` or\n`Class.HumanoidDescription:SetEmotes()|set`\
    \ on the description. The event\nfires with the new emote table as returned by\n\
    `Class.HumanoidDescription:GetEmotes()|GetEmotes`.\n\nIf `Class.HumanoidDescription:AddEmote()|AddEmote`\
    \ is called with the same\nname and ID as an existing emote, this event fires.\n\
    \nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:AddEmote()|AddEmote`,\n\
    \  `Class.HumanoidDescription:RemoveEmote()|RemoveEmote` and\n  `Class.HumanoidDescription:SetEmotes()`,\
    \ which can cause this event to\n  be fired\n"
  code_samples: []
  parameters:
  - name: newEmotes
    type: Dictionary
    default: null
    summary: "A dictionary of emotes where the key is the emote name and the value\n\
      is an array of emote asset IDs. Example:\n\n```lua\n{\n    Salute = {3360689775},\n\
      \    Agree = {4849487550},\n    Disagree = {4849495710}\n}\n```\n\n.\n"
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - AvatarAppearance
- name: HumanoidDescription.EquippedEmotesChanged
  summary: 'Fires when the equipped emotes are

    `Class.HumanoidDescription:SetEquippedEmotes()|set` on this description.

    '
  description: "**EquippedEmotesChanged** fires when the equipped emotes are set on\
    \ this\ndescription using\n`Class.HumanoidDescription:SetEquippedEmotes()|SetEquippedEmotes`.\
    \ It\nprovides the new equipped emotes in a table like that returned by\n`Class.HumanoidDescription:GetEquippedEmotes()|GetEquippedEmotes`.\n\
    \n#### Example\n\n```lua\nlocal hd = Instance.new(\"HumanoidDescription\")\nhd.EquippedEmotesChanged:Connect(function(equippedEmotes)\n\
    \    print((\"We have %d emotes equipped\"):format(#equippedEmotes))\n    for\
    \ _, t in equippedEmotes do\n        print((\"In slot %d: emote %s is equipped\"\
    ):format(t.Slot, t.Name))\n    end\nend)\nhd:SetEquippedEmotes({\"Salute\", \"\
    Agree\"}) --> We have 2 emotes equipped\n```\n\nSee also:\n\n- [HumanoidDescription\
    \ System](../../../characters/appearance.md#humanoiddescription),\n  for more\
    \ information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription:SetEquippedEmotes()|SetEquippedEmotes`,\
    \ which\n  fires this event\n- `Class.HumanoidDescription:GetEquippedEmotes()|GetEquippedEmotes`,\
    \ which\n  can be used to query the currently equipped emotes without this event\n\
    \  firing\n"
  code_samples: []
  parameters:
  - name: newEquippedEmotes
    type: Array
    default: null
    summary: "An array of tables describing the name and slot which each emote is\n\
      equipped. Example:\n\n```lua\n{\n    {Slot = 3, Name = \"Salute\"},\n    {Slot\
      \ = 2, Name = \"Agree\"},\n    {Slot = 1, Name = \"Disagree\"},\n}\n```\n\n\
      .\n"
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - AvatarAppearance
