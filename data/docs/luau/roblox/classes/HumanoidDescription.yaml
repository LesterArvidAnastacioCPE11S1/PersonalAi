name: HumanoidDescription
type: class
memory_category: Instances
summary: 'Describes the appearance of a Humanoid character including body parts,

  accessories, colors, scales, animations, and emotes.

  '
description: "**HumanoidDescription** is an object that stores a description of a\n\
  `Class.Humanoid` for R6 and\n[R15 rigs](../../../avatar/character-bodies/specifications.md#rigging).\
  \ It can\nbe `Class.Humanoid:ApplyDescriptionAsync()|applied` in order to set a\
  \ rig's\nscaling, clothing (`Class.Shirt`, `Class.Pants`, `Class.ShirtGraphic`),\n\
  `Class.Accessory|Accessories`, `Class.Animation|Animations` and\n`Class.BodyColors`.\n\
  \nYou can get a HumanoidDescription by using the following functions:\n\n- `Class.Players:GetHumanoidDescriptionFromUserIdAsync()`,\
  \ for an outfit\n  currently being worn by a user on Roblox.\n- `Class.Players:GetHumanoidDescriptionFromOutfitIdAsync()`,\
  \ for an outfit\n  created by a user on Roblox.\n- You can create a Humanoid rig\
  \ model from a HumanoidDescription through\n  `Class.Players:CreateHumanoidModelFromDescriptionAsync()`.\n\
  \nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
  \  for more information on `Class.HumanoidDescription`.\n"
code_samples: []
inherits:
- Instance
descendants: []
tags: []
deprecation_message: ''
