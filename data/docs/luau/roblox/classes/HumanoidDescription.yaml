- name: HumanoidDescription.BackAccessory
  summary: 'A comma-separated list of asset IDs that will be added as

    `Class.Accessory|Accessories` to a `Class.Humanoid` rig when

    `Class.Humanoid:ApplyDescriptionAsync()|applied`, usually those attached

    to its back (such as capes).

    '
  description: "**BackAccessory** is a comma-separated list of asset IDs that determine\n\
    what accessories should be added when the description is\n`Class.Humanoid:ApplyDescriptionAsync()|applied`.\
    \ The list cannot contain\nduplicates.\n\nAn error is thrown if you try to apply\
    \ a new description which shares any\nassets with the existing description but\
    \ a different accessory property.\n\nSee also:\n\n- [HumanoidDescription System](../../../characters/appearance.md#humanoiddescription),\n\
    \  for more information on `Class.HumanoidDescription`.\n- `Class.HumanoidDescription.FaceAccessory|FaceAccessory`,\n\
    \  `Class.HumanoidDescription.FrontAccessory|FrontAccessory`,\n  `Class.HumanoidDescription.HairAccessory|HairAccessory`,\n\
    \  `Class.HumanoidDescription.HatAccessory|HatAccessory`,\n  `Class.HumanoidDescription.NeckAccessory|NeckAccessory`,\n\
    \  `Class.HumanoidDescription.ShouldersAccessory|ShouldersAccessory` and\n  `Class.HumanoidDescription.WaistAccessory|WaistAccessory`,\
    \ which are\n  similar properties that apply accessories like this one\n"
