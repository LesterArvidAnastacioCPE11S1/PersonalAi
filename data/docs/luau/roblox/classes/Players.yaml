  description: "This method returns a table of all presently connected `Class.Player`\n\
    objects. It functions the same way `Class.Instance:GetChildren()` would\nexcept\
    \ that it only returns `Class.Player` objects found under\n`Class.Players`. When\
    \ used with a `for` loop, it is useful for iterating\nover all players in an experience.\n\
    \n```lua\nlocal Players = game:GetService(\"Players\")\n\nfor _, player in Players:GetPlayers()\
    \ do\n\tprint(player.Name)\nend\n```\n\nScripts that connect to `Class.Players.PlayerAdded`\
    \ are often trying to\nprocess every Player that connects to the experience. This\
    \ method is\nuseful for iterating over already-connected players that wouldn't\
    \ fire\n`Class.Players.PlayerAdded|PlayerAdded`. Using this method ensures that\
    \ no\nplayer is missed!\n\n```lua\nlocal Players = game:GetService(\"Players\"\
    )\n\nlocal function onPlayerAdded(player)\n\tprint(\"Player: \" .. player.Name)\n\
    end\n\nfor _, player in Players:GetPlayers() do\n\tonPlayerAdded(player)\nend\n\
    Players.PlayerAdded:Connect(onPlayerAdded)\n```\n"
