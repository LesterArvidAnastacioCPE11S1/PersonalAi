- name: Players:GetCharacterAppearanceInfoAsync
  summary: 'Returns information about the character appearance of a given user.

    '
  description: "This function returns information about a player's avatar on the Roblox\n\
    website in the form of a dictionary. It is not to be confused with\n`Class.Players:GetCharacterAppearanceAsync()|GetCharacterAppearanceAsync`,\n\
    which actually loads the assets described by this method. You can use\n`Class.InsertService:LoadAsset()`\
    \ to load the assets that are used in the\nplayer's avatar. The structure of the\
    \ returned dictionary is as follows:\n\n<table>\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\
    \t\t\t<th>Type</th>\n\t\t\t<th>Description</th>\n\t\t</tr>\n\t</thead>\n  <tr>\n\
    \    <td><code>assets</code></td>\n    <td>table (see below)</td>\n    <td>Describes\
    \ the equipped assets (hats, body parts, etc)</td>\n  </tr>\n  <tr>\n    <td><code>bodyColors</code></td>\n\
    \    <td>table (see below)</td>\n    <td>Describes the BrickColor values for each\
    \ limb</td>\n  </tr>\n  <tr>\n    <td><code>bodyColor3s</code></td>\n    <td>table\
    \ (see below)</td>\n    <td>Describes the Color3 instance for each limb which\
    \ may not match perfectly with bodyColors</td>\n  </tr>\n\t<tr>\n    <td><code>defaultPantsApplied</code></td>\n\
    \    <td>bool</td>\n    <td>Describes whether default pants are applied</td>\n\
    \  </tr>\n\t<tr>\n    <td><code>defaultShirtApplied</code></td>\n    <td>bool</td>\n\
    \    <td>Describes whether default shirt is applied</td>\n  </tr>\n  <tr>\n  \
    \  <td><code>emotes</code></td>\n    <td>table (see below)</td>\n    <td>Describes\
    \ the equipped emote animations</td>\n  </tr>\n\t<tr>\n    <td><code>playerAvatarType</code></td>\n\
    \    <td>string</td>\n    <td>Either \"R15\" or \"R6\"</td>\n  </tr>\n\t<tr>\n\
    \    <td><code>scales</code></td>\n    <td>table (see below)</td>\n    <td>Describes\
    \ various body scaling factors</td>\n  </tr>\n</table>\n\n#### Assets Sub-Table\n\
    \nThe `assets` table is an array of tables containing the following keys\nthat\
    \ describe the assets currently equipped by the player:\n\n<table>\n\t<thead>\n\
    \t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t<th>Description</th>\n\
    \t\t</tr>\n\t</thead>\n\t<tr>\n    <td><code>id</code></td>\n    <td>number</td>\n\
    \    <td>The asset ID of the equipped asset</td>\n  </tr>\n\t<tr>\n    <td><code>assetType</code></td>\n\
    \    <td>table</td>\n    <td>A table with <code>name</code> and <code>id</code>\
    \ fields, each describing the kind of asset equipped (\"Hat\", \"Face\", etc.)</td>\n\
    \  </tr>\n\t<tr>\n    <td><code>name</code></td>\n    <td>string</td>\n    <td>The\
    \ name of the equipped asset</td>\n  </tr>\n</table>\n\n#### Scales Sub-Table\n\
    \nThe `scales` table has the following keys, each a number corresponding to\n\
    one `Class.Humanoid` scaling property: `bodyType`, `head`, `height`,\n`proportion`,\
    \ `depth`, `width`.\n\n#### Body Colors Sub-Table\n\nThe `bodyColors` table has\
    \ the following keys, each a number corresponding\nto a `Datatype.BrickColor`\
    \ ID number which can be used with\n`Datatype.BrickColor.new(id)`: `leftArmColorId`,\
    \ `torsoColorId`,\n`rightArmColorId`, `headColorId`, `leftLegColorId`, `rightLegColorId`.\n\
    \n#### Example Return Value\n\nThe following is the dictionary returned for a\
    \ player whose avatar uses a\npackage and wears several hats:\n\n```lua\nlocal\
    \ appearanceInfo = {\n\tplayerAvatarType = \"R15\",\n\tdefaultPantsApplied = false,\n\
    \tdefaultShirtApplied = false,\n\tscales = {\n\t\tbodyType = 0,\n\t\thead = 1,\n\
    \t\theight = 1.05,\n\t\tproportion = 0,\n\t\tdepth = 0.92,\n\t\twidth = 0.85,\n\
    \t},\n\tbodyColors = {\n\t\tleftArmColorId = 1030,\n\t\ttorsoColorId = 1001,\n\
    \t\trightArmColorId = 1030,\n\t\theadColorId = 1030,\n\t\tleftLegColorId = 1001,\n\
    \t\trightLegColorId = 1001,\n\t},\n\tassets = {\n\t\t{\n\t\t\tid = 1031492,\n\t\
    \t\tassetType = {\n\t\t\t\tname = \"Hat\",\n\t\t\t\tid = 8,\n\t\t\t},\n\t\t\t\
    name = \"Striped Hat\",\n\t\t},\n\t\t{\n\t\t\tid = 13062491,\n\t\t\tassetType\
    \ = {\n\t\t\t\tname = \"Face Accessory\",\n\t\t\t\tid = 42,\n\t\t\t},\n\t\t\t\
    name = \"Vision Française \",\n\t\t},\n\t\t{\n\t\t\tid = 16598440,\n\t\t\tassetType\
    \ = {\n\t\t\t\tname = \"Neck Accessory\",\n\t\t\t\tid = 43,\n\t\t\t},\n\t\t\t\
    name = \"Red Bow Tie\",\n\t\t},\n\t\t{\n\t\t\tid = 28999228,\n\t\t\tassetType\
    \ = {\n\t\t\t\tname = \"Face\",\n\t\t\t\tid = 18,\n\t\t\t},\n\t\t\tname = \"Joyous\
    \ Surprise\",\n\t\t},\n\t\t{\n\t\t\tid = 86896488,\n\t\t\tassetType = {\n\t\t\t\
    \tname = \"Shirt\",\n\t\t\t\tid = 11,\n\t\t\t},\n\t\t\tname = \"Expensive Red\
    \ Tuxedo Jacket\",\n\t\t},\n\t\t{\n\t\t\tid = 86896502,\n\t\t\tassetType = {\n\
    \t\t\t\tname = \"Pants\",\n\t\t\t\tid = 12,\n\t\t\t},\n\t\t\tname = \"Expensive\
    \ Red Tuxedo Pants\",\n\t\t},\n\t\t{\n\t\t\tid = 376530220,\n\t\t\tassetType =\
    \ {\n\t\t\t\tname = \"Left Arm\",\n\t\t\t\tid = 29,\n\t\t\t},\n\t\t\tname = \"\
    ROBLOX Boy Left Arm\",\n\t\t},\n\t\t{\n\t\t\tid = 376531012,\n\t\t\tassetType\
    \ = {\n\t\t\t\tname = \"Right Arm\",\n\t\t\t\tid = 28,\n\t\t\t},\n\t\t\tname =\
    \ \"ROBLOX Boy Right Arm\",\n\t\t},\n\t\t{\n\t\t\tid = 376531300,\n\t\t\tassetType\
    \ = {\n\t\t\t\tname = \"Left Leg\",\n\t\t\t\tid = 30,\n\t\t\t},\n\t\t\tname =\
    \ \"ROBLOX Boy Left Leg\",\n\t\t},\n\t\t{\n\t\t\tid = 376531703,\n\t\t\tassetType\
    \ = {\n\t\t\t\tname = \"Right Leg\",\n\t\t\t\tid = 31,\n\t\t\t},\n\t\t\tname =\
    \ \"ROBLOX Boy Right Leg\",\n\t\t},\n\t\t{\n\t\t\tid = 376532000,\n\t\t\tassetType\
    \ = {\n\t\t\t\tname = \"Torso\",\n\t\t\t\tid = 27,\n\t\t\t},\n\t\t\tname = \"\
    ROBLOX Boy Torso\",\n\t\t},\n\t},\n}\n```\n"
  code_samples:
  - Players-GetCharacterAppearanceInfoAsync
  parameters:
  - name: userId
    type: User
    default: null
    summary: 'The \*_userId_ of the specified player.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary containing information about the character appearance of

      a given user.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Players
