events:
- name: Players.PlayerAdded
  summary: 'Fires when a player enters the experience.

    '
  description: "This event fires when a player enters the experience, such as loading\
    \ the\nplayer's saved `Class.GlobalDataStore` data.\n\nThis can be used alongside\
    \ the `Class.Players.PlayerRemoving` event, which\nfires when a player is about\
    \ to leave the experience. For instance, if you\nwould like print a message every\
    \ time a new player joins or leaves:\n\n```lua\nlocal Players = game:GetService(\"\
    Players\")\n\nPlayers.PlayerAdded:Connect(function(player)\n\tprint(player.Name\
    \ .. \" joined the experience!\")\nend)\n\nPlayers.PlayerRemoving:Connect(function(player,\
    \ reason)\n\tprint(player.Name .. \" left the experience! Reason: \" .. tostring(exitReason))\n\
    end)\n```\n\nIf you want to track when a player's character is added or removed\
    \ from\nthe experience, such as when a player respawns or dies, you can use the\n\
    `Class.Player.CharacterAdded` and `Class.Player.CharacterRemoving`\nfunctions.\n\
    \nNote that this event does not work as expected in a solo playtest mode\nbecause\
    \ the player is created before scripts run that connect to\n`Class.Players.PlayerAdded|PlayerAdded`.\
    \ To handle this case, as well as\ncases in which the script is added into the\
    \ experience after a player\nenters, create an `onPlayerAdded()` function that\
    \ you can call to handle a\nplayer's entrance.\n"
  code_samples:
  - Players-PlayerAdded1
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'An instance of the player that joined the experience.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Players
- name: Players.PlayerMembershipChanged
  summary: 'Fires when the experience server recognizes that a player''s membership
    has

    changed.

    '
  description: "This event fires when the experience server recognizes that a player's\n\
    membership has changed. Note, however, that the server will only attempt\nto check\
    \ and update the membership **after** the Premium modal has been\nclosed. Thus,\
    \ to account for cases where the user purchases Premium\n**outside** of the experience\
    \ while playing, you must still prompt them to\npurchase Premium; this will then\
    \ show a message telling them they're\nalready upgraded and, once they close the\
    \ modal, the server will update\ntheir membership and trigger this event.\n\n\
    To learn more about and incorporating Premium into your experience and\nmonetizing\
    \ with the engagement-based payouts system, see\n[Engagement-Based Payouts](../../../production/monetization/engagement-based-payouts.md).\n\
    \nSee also:\n\n- `Class.MarketplaceService:PromptPremiumPurchase()`, used to prompt\
    \ a\n  user to purchase Premium\n- `Class.MarketplaceService.PromptPremiumPurchaseFinished`,\
    \ fires when the\n  Premium purchase UI closes\n"
  code_samples:
  - handling-premium-membership-changes
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` whose membership has changed.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Players
- name: Players.PlayerRemoving
  summary: 'Fires when a player is about to leave the experience.

    '
  description: "This event fires right before a `Class.Player` leaves the experience,\n\
    before `Class.Instance.ChildRemoved|ChildRemoved` fires on\n`Class.Players`, and\
    \ behaves somewhat similarly to\n`Class.Instance.DescendantRemoving`. Since it\
    \ fires before the actual\nremoval of a `Class.Player`, this event is useful for\
    \ storing player data\nusing a `Class.GlobalDataStore`.\n\nThis can be used alongside\
    \ the `Class.Player.PlayerAdded` event, which\nfires when a player joins the experience.\
    \ For instance, to print a message\nevery time a new player joins or leaves:\n\
    \n```lua\nlocal Players = game:GetService(\"Players\")\n\nPlayers.PlayerAdded:Connect(function(player)\n\
    \tprint(player.Name .. \" joined the experience!\")\nend)\n\nPlayers.PlayerRemoving:Connect(function(player,\
    \ exitReason)\n\tprint(player.Name .. \" left the experience! - Reason: \" ..\
    \ tostring(exitReason))\nend)\n```\n\nIf you want to track when a player's character\
    \ is added or removed from\nthe experience, such as when a player respawns or\
    \ dies, you can use the\n`Class.Player.CharacterAdded` and `Class.Player.CharacterRemoving`\n\
    functions.\n"
  code_samples:
  - Players-PlayerRemoving1
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'An instance of the player that is leaving.

      '
  - name: reason
    type: PlayerExitReason
    default: null
    summary: 'Enum.PlayerExitReason in attempt to inform why.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Players
- name: Players.UserSubscriptionStatusChanged
  summary: 'Fires when the experience server recognizes that the user''s status for
    a

    certain subscription has changed.

    '
  description: 'This event fires when the experience server recognizes that the user''s

    status for a certain subscription has changed. Note that the server only

    attempts to check and update the status **after** the Subscription

    Purchase modal has been closed. To account for cases in which the user

    purchases the subscription **outside** of the experience while playing,

    you must still prompt them to purchase the subscription; the prompt shows

    a message telling the user they''re already subscribed, and after they

    close the modal, the server updates their subscription status and triggers

    this event.


    Note that only server scripts receive this event.

    '
  code_samples: []
  parameters:
  - name: user
    type: Player
    default: null
    summary: 'User whose subscription status has changed.

      '
  - name: subscriptionId
    type: string
    default: null
    summary: 'The ID of the subscription with a status change.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Players
  - Monetization
