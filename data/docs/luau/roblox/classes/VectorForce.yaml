name: VectorForce
type: class
memory_category: BaseParts
summary: 'Applies constant force to an assembly.

  '
description: "The `VectorForce` constraint applies constant force to an assembly.\
  \ The\ndirection and strength of the force is determined by a `Datatype.Vector3`\
  \ and\ncan be relative to an attachment on the part, another attachment, or the\
  \ world\ncoordinate system. Alternatively:\n\n- Because the `VectorForce` constraint\
  \ applies **constant** force and\n  acceleration, very high speeds may result if\
  \ no other forces are involved.\n  If you want to maintain a more steady velocity\
  \ over time, use a\n  `Class.LinearVelocity` constraint.\n- If you only need **initial**\
  \ velocity, set the\n  `Class.BasePart.AssemblyLinearVelocity|AssemblyLinearVelocity`\
  \ property\n  directly on the assembly.\n\nWhen configuring this constraint, it\
  \ may be helpful to study\n[Roblox Units](../../../physics/units.md) to understand\
  \ how Roblox units\ncompare to metric units.\n\n#### Force Location\n\nBy default,\
  \ force is applied to the assembly at the location of\n`Class.Constraint.Attachment0|Attachment0`.\
  \ Thus, if its center of mass is not\naligned with the direction/point of force,\
  \ torque will be applied as well. If\ndesired, force can be focused at the center\
  \ of mass by toggling on\n`Class.VectorForce.ApplyAtCenterOfMass|ApplyAtCenterOfMass`.\n\
  \n#### Relativity\n\nBy default, force is applied relative to\n`Class.Constraint.Attachment0|Attachment0`.\
  \ If the parent assembly rotates,\nthe force will change direction to match the\
  \ adjusted orientation of the\nattachment; visualize this behavior in how the thruster\
  \ of a rocket pushes it\nforward, regardless of the rocket's rotation.\n\nIf `Class.VectorForce.RelativeTo|RelativeTo`\
  \ is set to\n`Enum.ActuatorRelativeTo|World`, force will be applied in world coordinates,\n\
  independent of the parent or attachment orientations; visualize this behavior\n\
  as a directional force like the wind blowing against an object.\n\nIf `Class.VectorForce.RelativeTo|RelativeTo`\
  \ is set to\n`Enum.ActuatorRelativeTo|Attachment1`, force will be applied relative\
  \ to\n`Class.Constraint.Attachment1|Attachment1` and, if the attachment rotates,\
  \ the\nforce will change to match its orientation.\n"
