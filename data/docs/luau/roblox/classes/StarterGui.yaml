- name: StarterGui.RtlTextSupport
  summary: 'Controls whether right-to-left (RTL) text layout is enabled for text in

    `Class.GuiObject|GuiObjects` throughout the experience.

    '
  description: 'This property determines whether right-to-left (RTL) text layout is

    applied to the text of `Class.GuiObject|GuiObjects` in the experience,

    which is needed to correctly display languages written right-to-left, such

    as Arabic and Hebrew.


    The default value is `Enum.RtlTextSupport.Default`. Both

    `Enum.RtlTextSupport.Default` and `Enum.RtlTextSupport.Enabled` turn RTL

    text layout support on, while `Enum.RtlTextSupport.Disabled` turns it off.

    '
