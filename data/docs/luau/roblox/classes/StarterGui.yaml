- name: StarterGui:SetCore
  summary: 'Allows you to perform certain interactions with Roblox''s core scripts.

    '
  description: "This method (not to be confused with\n`Class.StarterGui:SetCoreGuiEnabled()|SetCoreGuiEnabled()`)\
    \ exposes a\nvariety of functionality defined by Roblox's core scripts, such as\
    \ sending\nnotifications, toggling notifications for badges/points, defining a\n\
    callback for the reset button, or toggling the topbar.\n\nThe first parameter\
    \ is a string that selects the functionality with which\nthe call will interact.\
    \ It may be necessary to call this method multiple\ntimes using `Global.LuaGlobals.pcall()`\
    \ in case the respective core script\nhas not yet loaded (or if it has been disabled\
    \ entirely).\n\nThe following table describes the strings that may be accepted\
    \ as the\nfirst parameter. The parameters that should follow are dependent on\
    \ the\nfunctionality that will be used and are described in sub-tables.\n\n#####\
    \ ChatActive\n\nControls whether the chat is active.\n\n<table size=\"small\"\
    >\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\
    \t\t\t<th>Description</th>\t\n    </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n    <td><code>active</code></td>\n\
    \    <td>boolean</td>\n    <td>(required)</td>\n    <td>Determines whether the\
    \ chat should be made active.</td>\n  </tr>\n  </tbody>\n</table>\n\n##### PointsNotificationsActive\n\
    \nControls whether notifications for earned player points will appear.\n\n<table\
    \ size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\
    \t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n\t</thead>\n  <tbody>\n\
    \t<tr>\n    <td><code>active</code></td>\n    <td>boolean</td>\n    <td>(required)</td>\n\
    \    <td>Determines whether notifications for earned player points will appear.</td>\n\
    \  </tr>\n  </tbody>\n</table>\n\n##### BadgesNotificationsActive\n\nControls\
    \ whether notifications for earned badges will appear.\n\n<table size=\"small\"\
    >\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\
    \t\t\t<th>Description</th>\n      </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n    <td><code>active</code></td>\n\
    \    <td>boolean</td>\n    <td>(required)</td>\n    <td>Determines whether notifications\
    \ for earned badges\nwill appear.</td>\n  </tr>\n  </tbody>\n</table>\n\n#####\
    \ ResetButtonCallback\n\nDetermines the behavior, if any, of the reset button\
    \ given a boolean or a\n`Class.BindableEvent` to be fired when a player requests\
    \ to reset.\n\n<table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\
    \t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n\
    \t\t</thead>\n    <tbody>\n\t<tr>\n    <td><code>enabled</code></td>\n    <td>boolean</td>\n\
    \    <td>(required)</td>\n    <td>Determines whether the reset button retains\
    \ its default behavior.</td>\n  </tr>\n\t<tr>\n    <td colspan=\"4\"><b>OR</b></td>\n\
    \  </tr>\n\t<tr>\n    <td><code>callback</code></td>\n    <td><code>Class.BindableEvent</code></td>\n\
    \    <td>(required)</td>\n    <td>A <code>Class.BindableEvent</code> to be fired\
    \ when the player confirms they want to reset.</td>\n  </tr>\n  </tbody>\n</table>\n\
    \n##### ChatMakeSystemMessage\n\nDisplay a formatted message in the chat. Using\
    \ this method requires the\nexperience's `Class.TextChatService.ChatVersion` to\
    \ be set to\n`Enum.ChatVersion|LegacyChatService`, although legacy chat is\n**deprecated**\
    \ and usage is discouraged. For experiences using the current\n`Class.TextChatService`,\
    \ refer to\n`Class.TextChannel:DisplaySystemMessage()`.\n\n<table size=\"small\"\
    >\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\
    \t\t\t<th>Description</th>\n      </tr>\n\t</thead>\n  <tbody>\n\t<tr>\n    <td><code>configTable</code></td>\n\
    \    <td>dictionary</td>\n    <td>(required)</td>\n    <td>A dictionary of information\
    \ describing the message (see below).</td>\n  </tr>\n  </tbody>\n</table>\n\n\
    <table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\
    \t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\
    \t<tr>\n    <td><code>Text</code></td>\n    <td>string</td>\n    <td>(required)</td>\n\
    \    <td>The message to display.</td>\n  </tr>\n\t<tr>\n    <td><code>Color</code></td>\n\
    \    <td><code>Datatype.Color3</code></td>\n    <td><code>Datatype.Color3.fromRGB(255,\
    \ 255, 243)</code></td>\n    <td>Text color of the message.</td>\n  </tr>\n\t\
    <tr>\n    <td><code>Font</code></td>\n    <td><code>Enum.Font</code></td>\n  \
    \  <td><code>SourceSansBold</code></td>\n    <td>Font of the message.</td>\n \
    \ </tr>\n\t<tr>\n    <td><code>TextSize</code></td>\n    <td>integer</td>\n  \
    \  <td><code>18</code></td>\n    <td>Text size of the message.</td>\n  </tr>\n\
    \  </tbody>\n</table>\n\n##### SendNotification\n\nCauses a non-intrusive notification\
    \ to appear at the bottom right of the\nscreen. The notification may have up to\
    \ two buttons.\n\n<table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\
    \t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n\
    </thead>\n  <tbody>\n\t<tr>\n    <td><code>configTable</code></td>\n    <td>dictionary</td>\n\
    \    <td>(required)</td>\n    <td>A dictionary of information describing the notification\
    \ (see below).</td>\n  </tr>\n  </tbody>\n</table>\n\n<table size=\"small\">\n\
    \t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\
    \t\t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\t<tr>\n    <td><code>Title</code></td>\n\
    \    <td>string</td>\n    <td>(required)</td>\n    <td>The title of the notification.</td>\n\
    \  </tr>\n\t<tr>\n    <td><code>Text</code></td>\n    <td>string</td>\n    <td>(required)</td>\n\
    \    <td>The main text of the notification.</td>\n  </tr>\n\t<tr>\n    <td><code>Icon</code></td>\n\
    \    <td>string</td>\n    <td></td>\n    <td>The image to display with the notification.</td>\n\
    \  </tr>\n\t<tr>\n    <td><code>Duration</code></td>\n    <td>number</td>\n  \
    \  <td><code>5</code></td>\n    <td>Duration (in seconds) the notification should\
    \ stay visible.</td>\n  </tr>\n\t<tr>\n    <td><code>Callback</code></td>\n  \
    \  <td><code>Class.BindableFunction</code></td>\n    <td></td>\n    <td>A <code>Class.BindableFunction</code>\
    \ that should be invoked with the text of the button pressed by the player.</td>\n\
    \  </tr>\n\t<tr>\n    <td><code>Button1</code></td>\n    <td>string</td>\n   \
    \ <td></td>\n    <td>The text to display on the first button.</td>\n  </tr>\n\t\
    <tr>\n    <td><code>Button2</code></td>\n    <td>string</td>\n    <td></td>\n\
    \    <td>The text to display on the second button.</td>\n  </tr>\n  </tbody>\n\
    </table>\n\n##### TopbarEnabled\n\nDetermines whether the topbar is displayed.\
    \ Disabling the topbar will also\ndisable all `Class.CoreGui|CoreGuis` such as\
    \ the chat, inventory, and\nplayer list (for example, those set with\n`Class.StarterGui:SetCoreGuiEnabled()|SetCoreGuiEnabled`).\n\
    \nWhen disabled, the region the topbar once occupied will still capture\nmouse\
    \ events; however, buttons placed there will not respond to clicks.\nThe origin\
    \ of GUI space will still be offset 36 pixels from the top of the\nscreen.\n\n\
    <table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\
    \t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\
    \t<tr>\n    <td><code>enabled</code></td>\n    <td>boolean</td>\n    <td>(required)</td>\n\
    \    <td>Determines whether the topbar should be visible.</td>\n  </tr>\n</tbody>\n\
    </table>\n\n##### DevConsoleVisible\n\nDetermines whether the\n[Developer Console](../../../studio/developer-console.md)\
    \ is visible.\n\n<table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\
    \t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n\
    </thead>\n<tbody>\n\t<tr>\n    <td><code>visibility</code></td>\n    <td>boolean</td>\n\
    \    <td>(required)</td>\n    <td>Determines whether the console is visible.</td>\n\
    \  </tr>\n</tbody>\n</table>\n\n##### PromptSendFriendRequest\n\nPrompts the current\
    \ player to send a friend request to the given\n`Class.Player`.\n\n<table size=\"\
    small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t\
    <th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\t\
    <tr>\n    <td><code>player</code></td>\n    <td><code>Class.Player</code></td>\n\
    \    <td>(required)</td>\n    <td>The player to which the friend request should\
    \ be sent.</td>\n  </tr>\n</tbody>\n</table>\n\n##### PromptUnfriend\n\nPrompts\
    \ the current player to remove a given `Class.Player` from their\nfriends list.\n\
    \n<table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\
    \t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\
    \t<tr>\n    <td><code>player</code></td>\n    <td><code>Class.Player</code></td>\n\
    \    <td>(required)</td>\n    <td>The player who should be unconnected.</td>\n\
    \  </tr>\n</tbody>\n</table>\n\n##### PromptBlockPlayer\n\nPrompts the current\
    \ player to block the given `Class.Player`.\n\n<table size=\"small\">\n\t<thead>\n\
    \t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\t\
    \t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\t<tr>\n    <td><code>player</code></td>\n\
    \    <td><code>Class.Player</code></td>\n    <td>(required)</td>\n    <td>The\
    \ player who should be blocked.</td>\n  </tr>\n  </tbody>\n</table>\n\n##### PromptUnblockPlayer\n\
    \nPrompts the current player to unblock the given `Class.Player`.\n\n<table size=\"\
    small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t\
    <th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n </thead>\n <tbody>\n\
    \t<tr>\n    <td><code>player</code></td>\n    <td><code>Class.Player</code></td>\n\
    \    <td>(required)</td>\n    <td>The player who should be unblocked.</td>\n \
    \ </tr>\n  </tbody>\n</table>\n\n##### AvatarContextMenuEnabled\n\nDetermines\
    \ whether the\n[Avatar Context Menu](../../../players/avatar-context-menu.md)\
    \ is enabled.\n\n<table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\
    \t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n\
    </thead>\n<tbody>\n\t<tr>\n    <td><code>enabled</code></td>\n    <td>boolean</td>\n\
    \    <td>(required)</td>\n    <td>Determines whether the context menu is enabled.</td>\n\
    \  </tr>\n</tbody>\n</table>\n\n##### AvatarContextMenuTarget\n\nForcibly opens\
    \ the\n[Avatar Context Menu](../../../players/avatar-context-menu.md).\n\n<table\
    \ size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\
    \t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\
    \t<tr>\n    <td><code>player</code></td>\n    <td><code>Class.Player</code></td>\n\
    \    <td>(required)</td>\n    <td>The player on whom the context menu will be\
    \ opened.</td>\n  </tr>\n</tbody>\n</table>\n\n##### AddAvatarContextMenuOption\n\
    \nAdds an option to the\n[Avatar Context Menu](../../../players/avatar-context-menu.md).\n\
    \n<table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\
    \t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n</thead>\n<tbody>\n\
    \t<tr>\n    <td><code>option</code></td>\n    <td><code>Enum.AvatarContextMenuOption</code></td>\n\
    \    <td>(required)</td>\n    <td>Option to add.</td>\n  </tr>\n\t<tr>\n    <td\
    \ colspan=\"4\"><b>OR</b></td>\n  </tr>\n\t<tr>\n    <td><code>option</code></td>\n\
    \    <td>table</td>\n    <td>(required)</td>\n    <td>A two-element table, where\
    \ the first is the name of the custom action, and the second is a <code>Class.BindableEvent</code>\
    \ which will be fired with a player was selected when the option was activated.</td>\n\
    \  </tr>\n</tbody>\n</table>\n\n##### RemoveAvatarContextMenuOption\n\nRemoves\
    \ an option to the\n[Avatar Context Menu](../../../players/avatar-context-menu.md).\
    \ The\n`option` argument must be the same as what was used with\n`\"AddAvatarContextMenuOption\"\
    ` (see above).\n\n<table size=\"small\">\n\t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\
    \t\t\t<th>Type</th>\n\t\t\t<th>Default</th>\n\t\t\t<th>Description</th>\n    </tr>\n\
    </thead>\n<tbody>\n\t<tr>\n    <td><code>option</code></td>\n    <td>Variant</td>\n\
    \    <td>(required)</td>\n    <td>The same value provided to <b>AddAvatarContextMenuOption</b>.</td>\n\
    \  </tr>\n  </tbody>\n</table>\n\n##### AvatarContextMenuTheme\n\nConfigures the\
    \ customizable\n[Avatar Context Menu](../../../players/avatar-context-menu.md)\
    \ which is an\nopt-in feature that allows easy player-to-player social interaction\
    \ via\ncustom actions, such as initiating trades, battles, and more. For more\n\
    info on how to customize its theme, see the\n[Avatar Context Menu](../../../players/avatar-context-menu.md)\
    \ article.\n\n##### CoreGuiChatConnections\n\nSets up a bindable gateway connection\
    \ between the `Class.CoreGui` topbar's\nchat button and the legacy chat system.\
    \ The second parameter must be a\ntable of `Class.BindableEvent|BindableEvents`\
    \ and\n`Class.BindableFunction|BindableFunctions`.\n"
