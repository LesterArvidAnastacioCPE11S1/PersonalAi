name: AudioChannelMixer
type: class
memory_category: Internal
summary: 'Combines multiple audio streams into a single, multichannel audio stream.

  '
description: '`Class.AudioChannelMixer` mixes multiple audio streams into a single,

  multichannel stream. It provides one combined **Input** pin, one **Output**

  pin, as well as the following secondary input pins, all of which can be

  connected to/from by `Class.Wire|Wires`: **Left**, **Right**, **Center**,

  **SurroundLeft**, **SurroundRight**, **Sub**, **BackLeft**, **BackRight**,

  **TopLeft**, **TopRight**, **TopBackLeft**, and **TopBackRight**.


  <img src="/assets/engine-api/enums/AudioChannelLayout/Surround_7_1_4.jpg" width="810"
  alt="Diagram showing position of all potential channels." />

  '
code_samples:
- audio-wiring---splitting-mixing
inherits:
- Instance
descendants: []
tags: []
deprecation_message: ''
properties:
- name: AudioChannelMixer.Layout
  summary: 'Controls the output channel layout to be mixed to.

    '
  description: "Controls the output channel layout to be mixed to. The **Input** pin\
    \ of\n`Class.AudioChannelMixer` is always forwarded \"as-is\" to **Output**, but\n\
    depending on the value of `Layout`:\n\n- For `Enum.AudioChannelLayout.Mono|Mono`,\
    \ the **Center** pin consumes\n  audio streams.\n- For `Enum.AudioChannelLayout.Stereo|Stereo`,\
    \ the **Left** and **Right**\n  pins consume audio streams.\n- For `Enum.AudioChannelLayout.Quad|Quad`,\
    \ the **Left**, **Right**,\n  **BackLeft**, and **BackRight** pins consume audio\
    \ streams.\n- `Enum.AudioChannelLayout.Surround_5|Surround_5` is the same as `Quad`,\n\
    \  plus **Center** consumes an audio stream.\n- `Enum.AudioChannelLayout.Surround_5_1|Surround_5_1`\
    \ is the same as\n  `Surround_5`, plus **Sub** consumes an audio stream.\n- `Enum.AudioChannelLayout.Surround_7_1|Surround_7_1`\
    \ is the same as\n  `Surround_5_1`, plus **SurroundLeft** and **SurroundRight**\
    \ consume\n  audio streams.\n- For `Enum.AudioChannelLayout.Surround_7_1_4|Surround_7_1_4`,\
    \ all\n  secondary input pins consume audio streams.\n"
