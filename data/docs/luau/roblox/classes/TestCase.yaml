methods:
- name: TestCase:Check
  summary: 'Records a failure if a value isn''t equal to the expected value, and lets

    the test continue.

    '
  description: "Compares `actualValue` with `expectedValue`. If they aren't equal,\
    \ the\ncheck records a `Class.TestFailure` and the test will fail, but the\ncallback\
    \ keeps running, so one run can report several failed checks. To\nstop the test\
    \ at the first mismatch instead, use\n`Class.TestCase:Require()|Require()`.\n\n\
    Values are compared as follows:\n\n- Values of different types are never equal,\
    \ so `1` and `\"1\"` don't match.\n- Numbers, strings, booleans, and `Datatype.Vector3`\
    \ values are compared\n  by value. `NaN` is never equal to itself.\n- Tables are\
    \ compared by their contents: both tables must have the same\n  keys, with values\
    \ that are equal by these same rules. A table with an\n  `__eq` metamethod is\
    \ compared with `==` instead.\n- `Class.Instance|Instances`, functions, and threads\
    \ are equal only if\n  they're the same object.\n- Other Roblox data types are\
    \ compared with `==`.\n\n`message` must be a string, a number, or `nil`. Checks\
    \ only count while\nthe test is running. Checks made outside a run, such as from\
    \ a thread the\ntest spawned that keeps going after the test finished, are ignored.\n"
  code_samples: []
  parameters:
  - name: actualValue
    type: Variant
    default: null
    summary: 'The value your code produced.

      '
  - name: expectedValue
    type: Variant
    default: null
    summary: 'The value you expect.

      '
  - name: message
    type: string
    default: null
    summary: 'Optional text that describes the check, shown when it fails.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
