name: TestCase
type: class
memory_category: Instances
summary: 'A registered test, used inside its callback to check values.

  '
description: "A `TestCase` is a test registered with `Class.TestService:RegisterTest()`\
  \ or\n`Class.TestSuite:RegisterTest()`. It's passed as the first argument to the\n\
  test's callback, where you call `Class.TestCase:Check()|Check()` and\n`Class.TestCase:Require()|Require()`\
  \ to compare the values your code produces\nwith the values you expect.\n\n`Class.TestService:ListTests()`\
  \ also returns `TestCase` objects, which you can\nuse to see each test's name, ID,\
  \ tags, and timeout. A `TestCase` isn't an\n`Class.Instance` and can't be parented.\n\
  \n```lua\nlocal TestService = game:GetService(\"TestService\")\n\nTestService:RegisterTest(\"\
  health starts full\", function(test)\n\tlocal humanoid = Instance.new(\"Humanoid\"\
  )\n\ttest:Check(humanoid.Health, humanoid.MaxHealth)\n\ttest:Check({ humanoid.Health,\
  \ humanoid.MaxHealth }, { 100, 100 }, \"default health\")\nend)\n```\n"
