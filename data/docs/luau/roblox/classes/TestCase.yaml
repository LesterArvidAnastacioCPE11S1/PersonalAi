  security: None
  thread_safety: Unsafe
  capabilities: []
- name: TestCase:Require
  summary: 'Records a failure and stops the test if a value isn''t equal to the

    expected value.

    '
  description: "Compares `actualValue` with `expectedValue` using the same rules as\n\
    `Class.TestCase:Check()|Check()`. If they aren't equal, it records a\n`Class.TestFailure`\
    \ and then throws an error that stops the test's\ncallback, so the rest of the\
    \ test doesn't run. Use it for conditions the\nrest of the test depends on, such\
    \ as an object existing before you read\nits properties.\n\nThe test is reported\
    \ as failed with the recorded failure, and\n`Class.TestResult.UncaughtError` stays\
    \ empty, since the error only stops\nthe test. Calling `Class.TestCase:Require()|Require()`\
    \ inside\n`Global.LuaGlobals.pcall()` catches the error, but the failure is still\n\
    recorded.\n\n```lua\nlocal TestService = game:GetService(\"TestService\")\n\n\
    TestService:RegisterTest(\"shop has items\", function(test)\n\tlocal shop = workspace:FindFirstChild(\"\
    Shop\")\n\ttest:Require(shop ~= nil, true, \"Workspace.Shop should exist\")\n\t\
    -- Only runs if the shop exists\n\ttest:Check(#shop:GetChildren() > 0, true, \"\
    the shop should have items\")\nend)\n```\n"
  code_samples: []
  parameters:
  - name: actualValue
    type: Variant
    default: null
    summary: 'The value your code produced.

      '
  - name: expectedValue
    type: Variant
    default: null
    summary: 'The value you expect.

      '
  - name: message
    type: string
    default: null
    summary: 'Optional text that describes the check, shown when it fails.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
