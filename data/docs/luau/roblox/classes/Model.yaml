  description: "Models contain a persistent canonical scale factor, which starts out\
    \ at 1\nfor newly created models. This function scales the model, around the pivot\n\
    location, relative to how it would look at a scale factor of 1. To\naccomplish\
    \ this it does two things:\n\n- Sets the current scale factor of the model to\
    \ the specified value\n- Resizes and repositions all descendant Instances accordingly\n\
    \nThe scaling of locations is done around the pivot location.\n\nAll \"geometric\"\
    \ properties of descendant Instances will be scaled. That\nobviously includes\
    \ the sizes of parts, but here are some other examples of\nproperties which are\
    \ scaled:\n\n- The length of joints like `Class.WeldConstraint|WeldConstraints`,\
    \ and\n  `Class.RopeConstraint`\n- Physical velocities and forces like `Class.HingeConstraint`\n\
    - Visual properties like sizes of particle emitters\n- Other length properties\
