name: Model
type: class
memory_category: BaseParts
summary: 'Models are container objects, meaning they group objects together. They
  are

  best used to hold collections of `Class.BasePart|BaseParts` and have a number

  of functions that extend their functionality.

  '
description: "Models are container objects, meaning they group objects together. They\
  \ are\nbest used to hold collections of `Class.BasePart|BaseParts` and have a number\n\
  of functions that extend their functionality.\n\nModels are intended to represent\
  \ **geometric** groupings. If your grouping has\nno geometric interpretation, for\
  \ instance a collection of\n`Class.Script|Scripts`, use a `Class.Folder` instead.\n\
  \nModels whose constituent parts are joined together with joints (so that they\n\
  can move around or be destroyed via physics simulation) usually have a\n`Class.Model.PrimaryPart|PrimaryPart`\
  \ set, as it specifies which part within\nthe model the pivot and bounding box will\
  \ \"follow\" as the model moves. Static\nmodels which stay in one place do not benefit\
  \ from having a primary part set.\n\nModels have a wide range of applications, including\
  \ Roblox player characters.\nThey also have a number of unique behaviors that are\
  \ important to keep in\nmind:\n\n- When a `Class.Humanoid` and a `Class.Part` named\
  \ **Head** are parented under\n  a model, a name/health GUI will appear over the\
  \ model; see\n  [Character Name/Health Display](../../../characters/name-health-display.md)\n\
  \  for details.\n- If a part's position on the **Y** axis hits the\n  `Class.Workspace.FallenPartsDestroyHeight`\
  \ value, and it was the last object\n  inside of a `Class.Model`, the model will\
  \ be destroyed as well.\n- When used in a place with `Class.Workspace.StreamingEnabled`\
  \ set to true,\n  the value of `Class.Model.ModelStreamingMode|ModelStreamingMode`\
  \ controls\n  various behaviors around how the model and any descendants are replicated\n\
  \  and/or removed from clients. In addition, the value of\n  `Class.Model.LevelOfDetail|LevelOfDetail`\
  \ impacts rendering of the model.\n\nAs with all `Class.Instance` types, the fact\
  \ that a parent `Class.Model` is\nreplicated to a client does not guarantee that\
  \ all its children are\nreplicated. This is particularly important if these instances\
  \ are being\naccessed by code running on the client, such as in a `Class.LocalScript`.\n\
  Using `Class.Model.ModelStreamingMode|ModelStreamingMode` with values such as\n\
  `Enum.ModelStreamingMode|Atomic` can ensure that the entire model and all of\nits\
  \ descendants are present if the parent model exists on the client, or you\ncan\
  \ use `Class.Instance:WaitForChild()|WaitForChild()` when atomicity is not\ndesired.\n"
code_samples:
- Model-Instantiation
inherits:
- PVInstance
descendants:
- Actor
- BackpackItem
- ProceduralModel
- Status
- WorldRoot
tags: []
deprecation_message: ''
properties:
- name: Model.LevelOfDetail
  summary: 'Sets the level of detail on the model for experiences with instance

    streaming enabled.

    '
  description: 'Sets the level of detail on the model for experiences with instance

    [streaming](../../../workspace/streaming/index.md) enabled. Composite or

    imposter meshes do not support physics, collision detection, or

    raycasting.


    When set to `Enum.ModelLevelOfDetail|StreamingMesh`, a lower resolution

    "imposter" mesh (colored, coarse mesh that wraps around all child parts of

    the model) renders outside the streaming radius. Does not support

    textures.


    When set to `Enum.ModelLevelOfDetail|SLIM`, a **SLIM** model (Scalable

    Lightweight Interactive Model) renders a composite of all child parts at

    progressively lower resolutions at distances based on the streaming

    radius. This greatly improves visual quality over

    `Enum.ModelLevelOfDetail|StreamingMesh`.


    When set to `Enum.ModelLevelOfDetail|Disabled` or

    `Enum.ModelLevelOfDetail|Automatic`, lower resolution meshes will not be

    displayed.

    '
  code_samples: []
  type: ModelLevelOfDetail
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Appearance
  serialization:
