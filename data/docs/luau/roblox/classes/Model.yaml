  description: "SurfaceType based joining is deprecated. Don't use MakeJoints for\
    \ new\nprojects. Use `Class.WeldConstraint|WeldConstraints` and\n`Class.HingeConstraint|HingeConstraints`\
    \ instead.\n\nGoes through all `Class.BasePart|Parts` in the `Class.Model` and\
    \ creates\njoints between the specified Parts and any planar touching surfaces,\n\
    depending on the parts' surfaces.\n\n- Smooth surfaces will not create joints\n\
    - Glue surfaces will create a `Class.Glue` joint\n- Weld will create a `Class.Weld`\
    \ joint with any surface except for\n  Unjoinable\n- Studs, Inlet, or Universal\
    \ will each create a `Class.Snap` joint with\n  either of other the other two\
    \ surfaces (e.g. Studs with Inlet and\n  Universal)\n- Hinge and Motor surfaces\
    \ create `Class.Rotate` and `Class.RotateV` joint\n  instances\n\nThis function\
    \ doesn't work if the Part is not a descendant of\n`Class.Workspace`. Therefore,\
