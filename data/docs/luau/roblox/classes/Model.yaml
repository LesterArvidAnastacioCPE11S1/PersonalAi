    can_save: true
  capabilities:
  - PluginOrOpenCloud
- name: Model.ModelStreamingMode
  summary: 'Controls the model streaming behavior on `Class.Model|Models` when

    instance streaming is enabled.

    '
  description: 'Controls how `Class.Model|Models` are streamed in and out when instance

    [streaming](../../../workspace/streaming/index.md) is enabled. Behavior

    depends on the selected enum. Has no effect when streaming is not enabled.


    This property should only be changed in Studio via the

    [Properties](../../../studio/properties.md) window when streaming is

    enabled, or in `Class.Script|Scripts`, but never in

    `Class.LocalScript|LocalScripts` (doing so can result in undefined

    behavior).

    '
  code_samples: []
  type: ModelStreamingMode
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Behavior
  serialization:
    can_load: true
    can_save: true
  capabilities: []
- name: Model.PrimaryPart
  summary: 'The primary part of the `Class.Model`, or `nil` if not explicitly set.

    '
  description: "Points to the primary part of the `Class.Model`. The primary part\
    \ is the\n`Class.BasePart` that acts as the physical reference for the pivot of\
    \ the\nmodel. That is, when parts within the model are moved due to physical\n\
    simulation or other means, the pivot will move in sync with the primary\npart.\n\
    \nNote that `Class.Model|Models` do not have `PrimaryPart` set by default.\nIf\
    \ you are creating a model that needs to be acted upon by physics, you\nshould\
    \ manually set this property in Studio or within a script. If the\nprimary part\
    \ is **not** set, the pivot will remain at the same location in\nworld space,\
    \ even if parts within the model are moved.\n\nAlso note that when setting this\
    \ property, it must be a `Class.BasePart`\nthat is a descendant of the model.\
    \ If you try to set\n`Class.Model.PrimaryPart` to a `Class.BasePart` that is **not**\
    \ a\ndescendant of the model, it will be set to that part but reset to `nil`\n\
    during the next simulation step &mdash; this is legacy behavior to support\nscripts\
    \ which assume they can temporarily set the primary part to a\n`Class.BasePart`\
    \ which isn't a descendant of the model.\n\nThe general rule for models is that:\n\
    \n- Models whose parts are joined together via physical joints such as\n  `Class.WeldConstraint|WeldConstraints`\
    \ or `Class.Motor6D|Motor6Ds`\n  should have a primary part assigned. For example,\
    \ Roblox character\n  models have their `Class.Model.PrimaryPart` set to the\n\
    \  **HumanoidRootPart** by default.\n- Static (usually `Class.BasePart.Anchored|Anchored`)\
    \ models which stay in\n  one place unless a script explicitly moves them don't\
    \ require a\n  `Class.Model.PrimaryPart` and tend not to benefit from having one\
    \ set.\n"
  code_samples:
  - throwing-dice
  type: BasePart
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Pivot
  serialization:
    can_load: true
    can_save: true
  capabilities: []
- name: Model.Scale
  summary: 'Editor-only property used to scale the model around its pivot. Setting

    this property will move the scale as though `Class.Model:ScaleTo()` was

    called on it.

    '
  description: 'Setting this property in the Properties window will scale the model
    as

    though `Class.Model:ScaleTo()` was called on it, scaling all descendant

    Instances in the model, such as materials, images, and the 3D geometry of

    parts, so that the model has the specified scale factor relative to its

    original size.


    This property is only available in Studio and will throw an error if used

    in a `Class.Script` or `Class.LocalScript`. `Class.Model:ScaleTo()` and

    `Class.Model:GetScale()` should be used from scripts.

    '
  code_samples: []
  type: float
  tags:
  - NotReplicated
  - NotScriptable
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Pivot
  serialization:
