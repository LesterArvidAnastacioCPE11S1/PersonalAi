  capabilities: []
- name: ScriptEditorService.TextDocumentDidClose
  summary: 'Fires just before a `Class.ScriptDocument` object is destroyed, which

    happens right after the script editor closes.

    '
  description: 'Fires just before a `Class.ScriptDocument` object is destroyed, which

    happens right after the script editor closes. After this event fires, the

    `Class.ScriptDocument` enters a "Closed" state, and trying to call its

    methods throws an error. `Class.ScriptDocument` objects aren''t reusable,

    even if the script editor reopens the same script.

    '
  code_samples:
  - ScriptEditorService-TextDocumentDidClose
  parameters:
  - name: oldDocument
    type: ScriptDocument
    default: null
    summary: 'The `Class.ScriptDocument` that is about to be destroyed.

      '
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  capabilities: []
- name: ScriptEditorService.TextDocumentDidOpen
  summary: 'Fires just after a `Class.ScriptDocument` object is created and parented

    to the service, which happens right after the script editor opens.

    '
  description: 'Fires just after a `Class.ScriptDocument` object is created and parented

    to the service, which happens right after the script editor opens. The

    `Class.ScriptDocument` passed to the handler is fully initialized and

    ready to read or modify. This event also fires for the command bar

    document.

    '
  code_samples:
  - ScriptEditorService-TextDocumentDidOpen
  parameters:
  - name: newDocument
