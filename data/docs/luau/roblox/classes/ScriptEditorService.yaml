name: ScriptEditorService
type: class
memory_category: Instances
summary: 'This service is used for interacting with `Class.ScriptDocument` instances.

  '
description: 'This service is used for interacting with `Class.ScriptDocument` instances.
  It

  provides methods to open, find, and list script documents that represent

  scripts currently open in the Studio

  [Script Editor](../../../studio/script-editor.md). It also enables plugins to

  register custom callbacks for autocomplete and script analysis, and fires

  events when script documents are opened, closed, or changed.


  This service is only available in Studio plugins and the command bar (Plugin

  security level).

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: ''
properties: []
