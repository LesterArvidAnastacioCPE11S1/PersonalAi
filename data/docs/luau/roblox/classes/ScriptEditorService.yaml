- name: ScriptEditorService:OpenScriptDocumentAsync
  summary: 'Requests that a Script Editor open the specified script. Returns (true,

    nil) if the request succeeds. Returns (false, string) if the request

    fails, with a string that describes the problem.

    '
  description: 'Requests that a Script Editor open the specified script. Returns (true,

    nil) if the request succeeds. Returns (false, string) if the request

    fails, with a string that describes the problem.


    If the script is already open, this function succeeds and switches tabs to

    the associated editor.

    '
  code_samples:
  - ScriptEditorService-OpenScriptDocumentAsync
  - ScriptEditorService-OpenScriptDocumentAsync-InitialReadOnlyReasons
  parameters:
  - name: script
    type: LuaSourceContainer
    default: null
    summary: 'The `Class.LuaSourceContainer` to open in the Script Editor.

      '
  - name: options
    type: Dictionary
    default: nil
    summary: "A dictionary that supports the following options:\n\n- `Temporary` &mdash;\
      \ Boolean. Whether to open the script in a preview\n  tab. Default is false.\n\
      - `HighlightRange` &mdash; A nested dictionary containing a line and\n  character\
      \ range to highlight in the editor. Example:\n  `HighlightRange = { Start =\
      \ { Line = 10, Character = 1 }, End = { Line = 15, Character = 20 }}`.\n  Lines\
      \ and characters are 1-based. Out-of-range positions are clamped\n  to the nearest\
      \ valid position: a `Line` or `Character` below 1\n  becomes 1, a `Character`\
      \ past the end of its line becomes the end of\n  that line, and a `Line` past\
      \ the last line becomes the end of the\n  script. `Start` and `End` are clamped\
      \ independently; if `End` is\n  before `Start` after clamping, they are swapped,\
      \ so the same text is\n  highlighted with the cursor at the later position.\n\
      - `InitialReadOnlyReasons` &mdash; An array of strings. Reasons to add\n  with\
      \ `Class.ScriptDocument:AddReadOnlyReasonsAsync()` once the\n  editor opens,\
      \ so the script is read-only as soon as the call\n  returns. Example:\n  `InitialReadOnlyReasons\
      \ = { \"MyPluginTemplateScript\" }`.\n"
  returns:
  - type: Tuple
    summary: 'A tuple where the first value is a boolean indicating success and the

      second is nil on success or a string describing the problem on

      failure.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
- name: ScriptEditorService:RegisterAutocompleteCallback
  summary: 'Registers an autocomplete callback `callbackFunction` named `name` with

    priority `priority`.

    '
  description: "Registers an autocomplete callback `callbackFunction` named `name`\
    \ with\npriority `priority`.\n\nWhen the Script Editor invokes autocomplete, all\
    \ registered autocomplete\ncallbacks call in order of ascending priority with\
    \ the autocomplete\nrequest and response. Multiple callbacks may share a priority,\
    \ but then\ntheir calling order is unpredictable. Each callback is intended to\
    \ return\na response table with the same format as the response input table.\n\
    Callbacks shouldn't yield. The first callback invoked receives the\ninternal autocomplete's\
    \ response as its response table, and subsequent\ncallbacks receive the previous\
    \ callback's output as their response table.\nCallbacks may either modify the\
    \ passed table or return a new table of the\nsame format.\n\nThe `callbackFunction`\
    \ must have the following type:\n`(Request: table, Response: table) -> table`\n\
    \nThe Request table has the following format:\n\n```lua\ntype Request = {\n  position:\
    \ {\n    line: number,\n    character: number\n  },\n  textDocument: {\n    document:\
    \ ScriptDocument?,\n    script: LuaSourceContainer?\n  }\n}\n```\n\n- `position`\
    \ is the one-indexed cursor position where you are\n  autocompleting.\n- `textDocument.document`\
    \ is the open `Class.ScriptDocument` you are\n  completing in, if it exists.\n\
    - `textDocument.script` is the `Class.LuaSourceContainer` you are\n  completing\
    \ in, if it exists.\n\nIf both `textDocument.document` and `textDocument.script`\
    \ are present,\nthen they correspond to each other:\n`req.textDocument.document:GetScript()\
    \ == req.textDocument.script`\n\nThe Response table has the following format:\n\
    \n```\ntype Response = {\n  items: {\n    {\n      label: string, -- The label\n\
    \      kind: Enum.CompletionItemKind?,\n      tags: {Enum.CompletionItemTag}?,\n\
    \      detail: string?,\n      documentation: {\n        value: string,\n    \
    \  }?,\n      overloads: number?,\n      learnMoreLink: string?,\n      codeSample:\
    \ string?,\n      preselect: boolean?,\n      textEdit: {\n        newText: string,\n\
    \        insert: { start: { line: number, character: number }, [\"end\"]: { line:\
    \ number, character: number } },\n        replace: { start: { line: number, character:\
    \ number }, [\"end\"]: { line: number, character: number } },\n      }?\n    }\n\
    \  }\n}\n```\n\n- `Response.items` is an array of the completion items. The order\
    \ of this\n  array is insignificant, and it resorts in the editor as the user\
    \ types.\n- `Response.items[n].label` is the label of the item which display in\
    \ the\n  autocomplete menu.\n- `Response.items[n].kind` specifies what type of\
    \ autocomplete item this\n  is. Primarily this controls the icon given to the\
    \ item in the editor.\n  Not all kinds have a unique icon. If not specified, the\
    \ editor uses the\n  \"Text\" icon. Unsupported kinds default to displaying the\
    \ \"Property\"\n  icon.\n- `Response.items[n].tags` specifies an array of tags\
    \ describing this\n  completion item. See the `Enum.CompletionItemTag` for details\
    \ on their\n  function.\n- `Response.items[n].details` specifies a string describing\
    \ details about\n  the completion item. For default items, this is a string representation\n\
    \  of their type. Note that, in order for the documentation widget to\n  display,\
    \ `documentation` must be present, but `documentation.value` may\n  be empty.\n\
    - `Response.items[n].documentation` specifies the main body of the\n  documentation\
    \ in its `value` field. `documentation` is present, even if\n  value is empty,\
    \ so the documentation window displays if either details\n  or overloads are specified.\n\
    - `Response.items[n].overloads` specifies the number of overloads of a\n  function\
    \ autocompletion.\n- `Response.items[n].learnMoreLink` links to a relevant page\
    \ on the\n  creator docs. This URL must be a `https` request to create.roblox.com;\n\
    \  no other URLs display in the editor.\n- `Response.items[n].codeSample` specifies\
    \ a sample use of the completion\n  item. `documentation` must be non-empty to\
    \ display this field.\n- `Response.items[n].preselect` If true, the editor sorts\
    \ this completion\n  item ahead of all others and selects it for the user by default.\
    \ No\n  effect if false or missing.\n- `Response.items[n].textEdit` If present,\
    \ accepting the completion\n  applies this text edit - inserting or replacing\
    \ the span between the\n  positions start and end with newText.\n\nIf a callback\
    \ returns a malformed result or encounters an error, the\neditor discards the\
    \ modified Response table and uses the built-in\nautocomplete result list.\n"
  code_samples:
  - ScriptEditorService-RegisterAutocompleteCallback
  parameters:
  - name: name
    type: string
    default: null
    summary: 'A unique identifier for this callback, used to deregister it later

      with `Class.ScriptEditorService:DeregisterAutocompleteCallback()`.

      '
  - name: priority
    type: int
    default: null
    summary: 'The invocation order among registered callbacks; lower values run

      first.

      '
  - name: callbackFunction
    type: Function
    default: null
    summary: 'The function invoked during autocomplete with the signature

      `(Request: table, Response: table) -> table`.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
- name: ScriptEditorService:RegisterScriptAnalysisCallback
  summary: 'Registers a Script Analysis callback `callbackFunction` named `name` with

    `priority`.

    '
  description: "Registers a Script Analysis callback `callbackFunction` named `name`\
    \ with\n`priority`. When Script Analysis in Studio runs, all registered callbacks\n\
    call in order of ascending priority. Each callback is intended to return a\nresponse\
    \ table matching the format specified below. Callbacks should not\nyield.\n\n\
    The request table has the following format, where `script` is the\n`LuaSourceContainer`\
    \ that is going to be analyzed.\n\n```\ntype Request = {\n  script: LuaSourceContainer?\n\
    }\n```\n\nThe response table has the following format, where `diagnostics` is\
    \ an\narray of diagnostic tables. Each diagnostic table has the entries listed\n\
    below.\n\n```\ntype Response = {\n  diagnostics: {\n    {\n      range: {\n  \
    \      start: {\n          line: number,\n          character: number,\n     \
    \   },\n        [\"end\"]: {\n          line: number,\n          character: number,\n\
    \        }\n      },\n      code: string?,\n      message: string,\n      severity:\
    \ Enum.Severity?,\n      codeDescription: { href: string }?\n    }\n  }\n}\n```\n\
    \n- `range` represents a text range that should be highlighted by the\n  linter,\
    \ providing what line/character to start highlighting and what\n  line/character\
    \ to stop highlighting.\n- `code` is a label for the message.\n- `message` is\
    \ a warning message to be displayed for the line. This will\n  also appear on\
    \ a tooltip when the user hovers their cursor over the line\n  in the Script Editor.\n\
    - `severity` is a `Enum.Severity` value for the diagnostics. This\n  determines\
    \ how the diagnostic is categorized in the Script Analysis tool\n  in Studio,\
    \ as well as how text is highlighted in the Script Editor.\n- `codeDescription`\
    \ links to a relevant page on the creator docs. This URL\n  must be an `https`\
    \ request to `create.roblox.com`; no other URLs display\n  in the editor.\n"
  code_samples:
  - ScriptEditorService-RegisterScriptAnalysisCallback
  parameters:
  - name: name
    type: string
    default: null
    summary: 'A unique identifier for this callback, used to deregister it later

      with `Class.ScriptEditorService:DeregisterScriptAnalysisCallback()`.

      '
  - name: priority
    type: int
    default: null
    summary: 'The invocation order among registered callbacks; lower values run

      first.

      '
  - name: callbackFunction
    type: Function
    default: null
    summary: 'The function invoked during Script Analysis with the signature

      `(Request: table) -> table`, returning a response containing

      diagnostics.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
- name: ScriptEditorService:UpdateSourceAsync
  summary: 'Generates new content from the old script and updates the script editor
    if

    it''s open, or the `Class.Script` instance if the script editor is closed.

    '
  description: 'Returns the edit-time `Class.Script.Source` for the given script.


    This function calls the passed callback using the old contents of the

    script to calculate the new contents of the script.


    If the script is open in the

    [Script Editor](../../../studio/script-editor.md), then it issues a

    request to the editor to update its source. The editor may reject this

    update if the `Class.Script.Source` property was out of date with the

    user''s version of the script when this function was called, in which case

    the callback will be re-invoked and the attempt will be repeated.


    The callback may not yield. If the callback returns `nil`, the operation

    is cancelled. This function yields until the operation is cancelled or

    succeeds.


    If the script is not open in the editor, the new content updates to the

    script source, which is the text the editor would display if it is opened.

    '
  code_samples:
  - ScriptEditorService-UpdateSourceAsync
  parameters:
  - name: script
    type: LuaSourceContainer
    default: null
    summary: 'Script instance to be updated.

      '
  - name: callback
    type: Function
    default: null
    summary: 'The function to return new script content.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Yields
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
