name: UICorner
type: class
memory_category: Instances
summary: 'UI modifier which applies deformation to corners of its parent

  `Class.GuiObject`.

  '
description: "`UICorner` is a modifier which applies deformation to corners of its\
  \ parent\n`Class.GuiObject`. Input, but not descendants, will be clipped to the\
  \ round\ncorner area. See\n[UI appearance modifiers](../../../ui/appearance-modifiers.md#corners)\
  \ for\nexamples.\n\nIn order to keep the circular shape of round corners, each corner\
  \ radius\n(`Datatype.UDim`) is internally calculated as follows:\n\n- The radius\
  \ of the **X** axis is always the same as the radius of **Y** axis.\n- `Datatype.UDim.Scale|Scale`\
  \ rounding will always apply to the **minimum**\n  width or height.\n- Rounded rectangles\
  \ will always be in a \"pill\" shape if\n  `Class.UICorner.CornerRadius|CornerRadius`\
  \ is set to a value that leads to a\n  calculated result greater than half of the\
  \ rectangle's minimum width or\n  height.\n\nAlternatively to `UICorner`, rounded\
  \ corners can be accomplished using\n**slices** which are suitable for decorative\
  \ borders that are not simply\nrounded. See [9‑Slice Design](../../../ui/9-slice.md)\
  \ for details.\n\nNote that `UICorner` can not be applied to a `Class.ScrollingFrame`.\n\
  \n#### Individual Corners\n\nEach corner has its own radius property\n(`Class.UICorner.TopLeftRadius|TopLeftRadius`,\n\
  `Class.UICorner.TopRightRadius|TopRightRadius`,\n`Class.UICorner.BottomRightRadius|BottomRightRadius`,\n\
  `Class.UICorner.BottomLeftRadius|BottomLeftRadius`). The\n`Class.UICorner.CornerRadius|CornerRadius`\
  \ property is a convenience shorthand\nthat sets all four corners at once and reads\
  \ from\n`Class.UICorner.TopLeftRadius|TopLeftRadius`.\n\nWhen using [styling](../../../ui/styling/index.md)\
  \ with `UICorner`, avoid\nconfiguring both `Class.UICorner.CornerRadius|CornerRadius`\
  \ and the individual\ncorner radii in style rules at the same time, as this may\
  \ produce unexpected\nresults.\n"
