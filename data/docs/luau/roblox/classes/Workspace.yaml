name: Workspace
type: class
memory_category: BaseParts
summary: '`Workspace` houses 3D objects which are rendered to the 3D world. Objects
  not

  descending from it will not be rendered or physically interact with the world.

  '
description: "The core job of `Class.Workspace` is to hold objects that exist in the\
  \ 3D\nworld, effectively `Class.BasePart|BaseParts` and\n`Class.Attachment|Attachments`.\
  \ While such objects are descendant of\n`Class.Workspace`, they will be active.\
  \ For `Class.BasePart|BaseParts`, this\nmeans they will be rendered, and physically\
  \ interact with other parts and the\nworld. For `Class.Attachment|Attachments`,\
  \ this means that objects adorned to\nthem, such as `Class.ParticleEmitter|ParticleEmitters`,\
  \ `Class.Beam|Beams`,\nand `Class.BillboardGui|BillboardGuis`, will render.\n\n\
  Understanding this behavior is important, as it means objects can be removed\nfrom\
  \ `Class.Workspace` when they are not needed. For example, map\n`Class.Model|Models`\
  \ can be removed when a different map is being played on.\nObjects that are not\
  \ immediately needed in the 3D world are generally stored\nin `Class.ReplicatedStorage`\
  \ or `Class.ServerStorage`.\n\nIn its role as the holder of active 3D objects, `Class.Workspace`\
  \ includes a\nnumber of useful functions related to parts, their positions, and\
  \ joints\nbetween them.\n\n#### Accessing the Workspace\n\n`Class.Workspace` can\
  \ be accessed several ways, all of which are valid.\n\n- `workspace`\n- `game:GetService(\"\
  Workspace\")`\n- `game.Workspace`\n\n#### Notes\n\n- Objects that require adornment,\
  \ such as\n  `Class.ParticleEmitter|ParticleEmitters` and\n  `Class.BillboardGui|BillboardGuis`,\
  \ will be at the\n  <Typography noWrap>`(0, 0, 0)`</Typography> position when parented\
  \ to\n  `Class.Workspace` without an adornee otherwise being set.\n- The `Class.Model:MakeJoints()`\
  \ and `Class.Model:BreakJoints()` methods\n  inherited from the `Class.Model` class\
  \ are overridden by\n  `Class.Workspace:MakeJoints()` and `Class.Workspace:BreakJoints()`\
  \ which can\n  only be used in plugins.\n- It is impossible to delete `Class.Workspace`.\n\
  - `Class.Workspace` automatically cleans up `Class.BasePart|BaseParts` that\n  fall\
  \ beneath\n  `Class.Workspace.FallenPartsDestroyHeight|FallenPartsDestroyHeight`.\n\
  - A client's current `Class.Camera` object can be accessed using the\n  `Class.Workspace.CurrentCamera`\
  \ property.\n- The `Class.Terrain` object can be accessed using the\n  `Class.Workspace.Terrain`\
  \ property.\n"
