- name: Workspace:GetNumAwakeParts
  summary: 'Returns the number of `Class.BasePart|BaseParts` that are deemed

    physically active, due to being recently under the influence of physics.

    '
  description: 'Returns the number of `Class.BasePart|BaseParts` that are deemed

    physically active, due to being recently under the influence of physics.


    This function provides a measure of how many `Class.BasePart|BaseParts`

    are being influenced by, or recently under the influence of, physical

    forces.


    ```

    local Workspace = game:GetService("Workspace")


    print(Workspace:GetNumAwakeParts())

    ```


    In order to ensure good performance, the engine sets

    `Class.BasePart|BaseParts` in which physics are not being applied to a

    "sleeping" state. `Class.BasePart|BaseParts` with

    `Class.BasePart.Anchored` set to `true`, for example, will always be

    sleeping as physics doesn''t apply to them. When a force is applied to a

    non‑anchored `Class.BasePart`, an "awake" state will be applied. Whilst a

    `Class.BasePart` is awake, the physics engine will perform continuous

    calculations to ensure physical forces interact correctly with the part.

    Once the `Class.BasePart` is no longer subject to physical forces, it will

    revert to a "sleeping" state.

    '
  code_samples: []
  parameters: []
  returns:
  - type: int
    summary: 'The number of awake parts.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
- name: Workspace:GetPhysicsThrottling
  summary: 'Returns an integer, between 0 and 100, representing the percentage of
    real

    time that physics simulation is currently being throttled to.

    '
  description: 'Returns an integer, between `0` and `100`, representing the percentage
    of

    real time that physics simulation is currently being throttled to. Physics

    throttling occurs when the physics engine detects it cannot keep up with

    the game in real time. When physics is being throttled, it will update

    less frequently causing `Class.BasePart|BaseParts` to appear to move

    slower.


    Objects associated with `Class.Humanoid|Humanoids` are exempt from physics

    throttling.


    #### See also


    - `Class.Workspace:SetPhysicsThrottleEnabled()`.

    '
  code_samples: []
  parameters: []
  returns:
  - type: int
    summary: 'The percentage of real time that physics simulation is currently being

      throttled to.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
- name: Workspace:GetRealPhysicsFPS
  summary: 'Returns the number of frames per second that physics is currently being

    simulated at.

    '
  description: 'Returns the number of frames per second that physics is currently
    being

    simulated at.


    #### Using GetRealPhysicsFPS to combat exploiters


    A common use of this function is to detect if exploiters are increasing

    their local physics frame rate to move faster. This is generally done by

    comparing the result returned by a client''s GetRealPhysicsFPS to a maximum

    that will not be breached in normal circumstances (usually 65 or 70). If

    this limit is breached, developers can use the `Class.Player:Kick()`

    function to remove that `Class.Player` from the game. It is important to

    remember that, although this practice may be effective sometimes,

    client-side anti-exploiter measures are never 100% reliable.

    '
  code_samples:
  - Workspace-GetRealPhysicsFPS1
  parameters: []
  returns:
  - type: double
    summary: 'Returns the number of frames per second that physics is currently

      being simulated at.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
- name: Workspace:GetServerTimeNow
  summary: 'Returns the server''s Unix time in seconds.

    '
  description: "This method returns the client's best approximation of the current\
    \ time on\nthe server. It is useful for creating synchronized experiences, as\
    \ every\nclient will get roughly the same results regardless of their timezone\
    \ or\nlocal clock.\n\nThis method returns a Unix timestamp, similar to `Library.os|os.time()`,\n\
    that you can use with `Library.os|os.date()` or\n`Datatype.DateTime.fromUnixTimestamp()`.\
    \ The timestamp is smoothed so\nthat:\n\n- It is monotonic; its value will never\
    \ decrease.\n- It moves at the same rate as the local clock to within 0.6%.\n\n\
    This method is useful for making sure an event starts at the right\nreal-world\
    \ time and for periodic adjustments to keep a series of events in\nsync. For benchmarking\
    \ or other use cases that require higher precision,\nconsider `Library.os|os.clock()`.\n\
    \nThis method relies on the server, so calling it from a client that isn't\nconnected\
    \ will throw an error. Also note that this method is not suitable\nfor things\
    \ like timed rewards, as it is not secure compared to tracking\nsuch timers on\
    \ the server.\n\n#### See also\n\n- `Class.Workspace.DistributedGameTime|DistributedGameTime`,\
    \ a game-time\n  clock\n- `Library.os|os.time()`\n- `Datatype.DateTime`\n"
  code_samples: []
  parameters: []
  returns:
  - type: double
    summary: 'The estimated Unix timestamp on the server.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
- name: Workspace:JoinToOutsiders
  summary: 'Creates joints between the specified `Class.BasePart|Parts` and any

    touching parts depending on the parts'' surfaces and the specified joint

    creation mode.

    '
  description: "This function creates joints between the specified `Class.BasePart|Parts`\n\
    and any touching parts depending on the parts' surfaces and the specified\njoint\
    \ creation mode.\n\nThis function creates joints between the specified Parts and\
    \ any planar\ntouching surfaces, depending on the parts' surfaces and the specified\n\
    joint creation mode.\n\n- Glue, Studs, Inlets, Universal, Weld, and Smooth surfaces\
    \ will all\n  create Weld instances.\n- Spheres will not surface-weld to anything.\
    \ The rounded sides of\n  cylinders will not surface-weld, but the flat end sides\
    \ will.\n- Hinge and Motor surfaces will still create `Class.Rotate` and\n  `Class.RotateP`\
    \ joint instances, regardless of part shape.\n\nThe first parameter is an array\
    \ of `Class.BasePart|BaseParts`. Joints will\nonly be created between the parts\
    \ in the array and not in the array.\nJoints will not be created between the parts\
    \ in the array.\n\nThe second parameter is a `Enum.JointCreationMode` that determines\
    \ how\njoints will be created. Passing in either enum value,\n`Enum.JointCreationMode|Enum.JointCreationMode.All`\
    \ or\n`Enum.JointCreationMode|Enum.JointCreationMode.Surface`, has the same\n\
    behavior which equates to Join Always\n\nThis function is used by the Roblox Studio\
    \ **Move** tool when the user\nfinishes moving a selection. In conjunction with\n\
    `Class.Plugin:GetJoinMode()` and `Class.Workspace:UnjoinFromOutsiders()`\nit can\
    \ be used to retain join functionality when developing custom studio\nbuild tools.\
    \ See the snippets below for an example.\n\n```lua\nlocal Workspace = game:GetService(\"\
    Workspace\")\n\n-- Finished moving a selection; make joints\nlocal function finishedMovingParts(parts)\n\
    \tlocal joinMode = Plugin:GetJoinMode()\n\tWorkspace:JoinToOutsiders(parts, joinMode)\n\
    end\n```\n\n```lua\nlocal Workspace = game:GetService(\"Workspace\")\n\n-- Started\
    \ moving a selection; break joints\nlocal function startMovingParts(parts)\n\t\
    Workspace:UnjoinFromOutsiders(parts)\nend\n```\n"
  code_samples: []
  parameters:
  - name: objects
    type: Instances
    default: null
    summary: 'An array of `Class.BasePart|BaseParts` for whom joints are to be made.

      '
  - name: jointType
    type: JointCreationMode
    default: null
    summary: 'The `Enum.JointCreationMode` to be used. Passing in

      `Enum.JointCreationMode|Enum.JointCreationMode.All` or

      `Enum.JointCreationMode|Enum.JointCreationMode.Surface` has the same

      behavior which equates to Join Always.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Physics
- name: Workspace:MakeJoints
  summary: 'Goes through all `Class.BasePart|BaseParts` given. If any part''s side
    has

    a `Enum.SurfaceType` that can make a joint it will create a joint with any

    adjacent parts.

    '
  description: "**Deprecated**\n\nSurfaceType based joining is deprecated, do not\
    \ use MakeJoints for new\nprojects. `Class.WeldConstraint|WeldConstraints` and\n\
    `Class.HingeConstraint|HingeConstraints` should be used instead.\n\nGoes through\
    \ all `Class.BasePart|Parts` given. If any part's side has a\n`Enum.SurfaceType`\
    \ that can make a joint it will create a joint with any\nadjacent parts.\n\nJoints\
    \ will be created between the specified Parts and any planar touching\nsurfaces,\
    \ depending on the parts' surfaces.\n\n- Smooth surfaces will not create joints\n\
    - Glue surfaces will create a `Class.Glue` joint\n- Weld will create a `Class.Weld`\
    \ joint with any surface except for\n  Unjoinable\n- Studs, Inlet, or Universal\
    \ will each create a `Class.Snap` joint with\n  either of other the other two\
    \ surfaces (e.g. Studs with Inlet and\n  Universal)\n- Hinge and Motor surfaces\
    \ create `Class.Rotate` and `Class.RotateV` joint\n  instances\n\nUnlike `Class.Model:MakeJoints()`,\
    \ this function requires an array of\nparts as a parameter. This array is given\
    \ as follows:\n\n```\nlocal Workspace = game:GetService(\"Workspace\")\n\nWorkspace:MakeJoints({part1,\
    \ part2, part3})\n```\n\nJoints are broken if enough force is applied to them\
    \ due to an\n`Class.Explosion`, unless a `Class.ForceField` object is parented\
    \ to the\n`Class.BasePart` or ancestor `Class.Model`. For this reason, they are\n\
    often used to make simple destructible buildings and other models.\n"
  code_samples: []
  parameters:
  - name: objects
    type: Instances
    default: null
    summary: 'An array of `Class.BasePart|parts` for whom joints are to be made.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Deprecated
  deprecation_message: 'This method is deprecated. Do not use it for new work.

    '
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
