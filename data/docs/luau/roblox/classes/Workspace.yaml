- name: Workspace:UnjoinFromOutsiders
  summary: 'Breaks all joints between the specified `Class.BasePart|BaseParts` and

    other `Class.BasePart|BaseParts`.

    '
  description: "Breaks all joints between the specified `Class.BasePart|BaseParts`\
    \ and\nother `Class.BasePart|BaseParts`.\n\nThis function requires an array of\
    \ `Class.BasePart|BaseParts`. Note,\njoints will not be broken between these `Class.BasePart|BaseParts`\
    \ (each\nother), only between these `Class.BasePart|BaseParts` and other\n`Class.BasePart|BaseParts`\
    \ not in the array.\n\nThis function is used by the Roblox Studio **Move** tool\
    \ when the user\nstarts moving a selection. In conjunction with\n`Class.Plugin:GetJoinMode()`\
    \ and `Class.Workspace:JoinToOutsiders()` it\ncan be used to retain join functionality\
    \ when developing custom Studio\nbuild tools. See the snippets below for an example.\n\
    \n```\nlocal Workspace = game:GetService(\"Workspace\")\n\n-- Finished moving\
    \ a selection; make joints\nlocal function finishedMovingParts(parts)\n\tlocal\
    \ joinMode = Plugin:GetJoinMode()\n\tWorkspace:JoinToOutsiders(parts, joinMode)\n\
    end\n```\n\n```\nlocal Workspace = game:GetService(\"Workspace\")\n\n-- Started\
    \ moving a selection; break joints\nlocal function startMovingParts(parts)\n\t\
    Workspace:UnjoinFromOutsiders(parts)\nend\n```\n"
