    '
  description: 'Read-only property that provides the screen position of the default
    chat

    input bar in pixels. Behaves similarly to

    `Class.GuiBase2d.AbsolutePosition`.


    This value represents only the input bar portion of the chat UI, not the

    entire chat interface. To get the total bounds including the message list,

    see `Class.ChatWindowConfiguration.AbsolutePosition` and combine both

    regions.

    '
