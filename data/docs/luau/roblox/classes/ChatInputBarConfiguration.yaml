- name: ChatInputBarConfiguration.TextBox
  summary: 'Reference to a designated `Class.TextBox` instance that sends messages
    on

    behalf of the user.

    '
  description: "Reference to a designated `Class.TextBox` instance that sends messages\
    \ on\nbehalf of the user. You can use it to further integrate your custom chat\n\
    input bar UI into your experience by freely manipulating appearance,\nlocation,\
    \ and layout. When opting to set this property to a custom\n`Class.TextBox`, you\
    \ don't need to write any code for the following\nbehavior:\n\n- When a user types\
    \ a message and presses `Enum.KeyCode.Return`, the\n  message will be sent to\n\
    \  `Class.ChatInputBarConfiguration.TargetTextChannel`.\n- When a message is sent,\
    \ `Class.TextBox.Text` will automatically clear.\n\nFor security, some limitations\
    \ are imposed on the `Class.TextBox` when it\nis promoted to `Class.ChatInputBarConfiguration.TextBox`.\
    \ Luau code will\nnot be able to:\n\n- Change the `Class.TextBox.Text` property.\n\
    - Use the `Class.TextBox:CaptureFocus()` or `Class.TextBox:ReleaseFocus()`\n \
    \ methods.\n"
