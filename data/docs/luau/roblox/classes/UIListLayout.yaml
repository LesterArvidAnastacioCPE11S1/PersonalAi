- name: UIListLayout.ItemLineAlignment
  summary: 'In a flex layout, defines the **cross-directional** alignment of siblings

    within a line.

    '
  description: "In a [flex layout](../../../ui/list-flex-layouts.md#flex-layouts),\
    \ defines\nthe **cross-directional** alignment of siblings within a line. See\n\
    `Enum.ItemLineAlignment` for visual examples.\n\n<table size=\"small\">\n  <thead>\n\
    \    <tr>\n      <th>Setting</th>\n      <th>Sibling Behavior</th>\n    </tr>\n\
    \  </thead>\n  <tbody>\n    <tr>\n      <td><code>Enum.ItemLineAlignment.Automatic|Automatic</code></td>\n\
    \      <td>Aligns the layout's siblings or the specific <code>Class.UIFlexItem</code>\
    \ parent to the layout's <code>Class.UIListLayout.HorizontalAlignment|HorizontalAlignment</code>\
    \ or <code>Class.UIListLayout.VerticalAlignment|VerticalAlignment</code>, depending\
    \ on its <code>Class.UIListLayout.FillDirection|FillDirection</code>.</td>\n \
    \   </tr>\n    <tr>\n      <td><code>Enum.ItemLineAlignment.Start|Start</code></td>\n\
    \      <td>Aligns the layout's siblings or the specific <code>Class.UIFlexItem</code>\
    \ parent to the line's <b>top</b> in a horizontal fill or the line's <b>left</b>\
    \ in a vertical fill.</td>\n    </tr>\n    <tr>\n      <td><code>Enum.ItemLineAlignment.Center|Center</code></td>\n\
    \      <td>Aligns the layout's siblings or the specific <code>Class.UIFlexItem</code>\
    \ parent to the line's <b>center</b> in either a horizontal or vertical fill.</td>\n\
    \    </tr>\n    <tr>\n      <td><code>Enum.ItemLineAlignment.End|End</code></td>\n\
    \      <td>Aligns the layout's siblings or the specific <code>Class.UIFlexItem</code>\
    \ parent to the line's <b>bottom</b> in a horizontal fill or the line's <b>right</b>\
    \ in a vertical fill.</td>\n    </tr>\n    <tr>\n      <td><code>Enum.ItemLineAlignment.Stretch|Stretch</code></td>\n\
    \      <td>Stretches the layout's siblings or the specific <code>Class.UIFlexItem</code>\
    \ parent to fill the entire cross‑direction of the line in either a horizontal\
    \ or vertical fill.</td>\n    </tr>\n  </tbody>\n</table>\n\n<img src=\"../../../assets/engine-api/classes/UIListLayout/ItemLineAlignment.png\"\
    \ width=\"720\" alt=\"Examples of options for ItemLineAlignment in a horizontal\
    \ fill direction.\" />\n"
