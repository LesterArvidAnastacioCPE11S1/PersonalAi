- name: UIListLayout.HorizontalFlex
  summary: 'Controls how to distribute extra horizontal space.

    '
  description: "When the list layout's `Class.UIListLayout.FillDirection|FillDirection`\
    \ is\nset to `Enum.FillDirection.Horizontal`, the\n`Class.UIListLayout.HorizontalFlex|HorizontalFlex`\
    \ property specifies how\nto distribute extra horizontal space in the parent container.\n\
    \n<table size=\"small\">\n  <thead>\n    <tr>\n      <th>Setting</th>\n      <th>Sibling\
    \ Behavior</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.None|None</code></td>\n\
    \      <td>No flex behavior; siblings maintain their defined width.</td>\n   \
    \ </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.Fill|Fill</code></td>\n\
    \      <td>Siblings resize horizontally to fill the entire parent container, overriding\
    \ their defined width. The number of siblings in a row remain unchanged; for example,\
    \ if three siblings fit horizontally within the container's width under the <code>Enum.UIFlexAlignment.None|None</code>\
    \ setting, those three siblings will resize to fill the entire width.</td>\n \
    \   </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.SpaceAround|SpaceAround</code></td>\n\
    \      <td>Siblings maintain their defined width. Equal spacing is added on both\
    \ sides of each sibling.</td>\n    </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.SpaceBetween|SpaceBetween</code></td>\n\
    \      <td>Siblings maintain their defined width. Equal spacing is added <b>between</b>\
    \ siblings, but no additional space is added <b>around</b> siblings.</td>\n  \
    \  </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.SpaceEvenly|SpaceEvenly</code></td>\n\
    \      <td>Siblings maintain their defined width. Equal spacing is added both\
    \ <b>between</b> and <b>around</b> siblings.</td>\n    </tr>\n  </tbody>\n</table>\n\
    \n<img src=\"../../../assets/engine-api/classes/UIListLayout/HorizontalFlex-Options.png\"\
    \ width=\"800\" alt=\"UIListLayout examples showing how each HorizontalFlex option\
    \ affects the size and spacing of sibling UI objects.\" />\n\n##### Cross-Direction\
    \ Behavior\n\nIn **vertical** list layouts\n(`Class.UIListLayout.FillDirection|FillDirection`\
    \ set to\n`Enum.FillDirection.Vertical`), the\n`Class.UIListLayout.HorizontalFlex|HorizontalFlex`\
    \ property specifies how\nto distribute the siblings across the **horizontal cross‑direction**.\
    \ In\nsuch layouts, a setting of `Enum.UIFlexAlignment.Fill` makes the siblings\n\
    fill the entire horizontal space while vertical spacing adheres to\n`Class.UIListLayout.VerticalFlex|VerticalFlex`.\n\
    \n<img src=\"../../../assets/engine-api/classes/UIListLayout/HorizontalFlex-Cross-Direction.png\"\
    \ width=\"720\" alt=\"Diagram showing how HorizontalFlex affects the horizontal\
    \ size of sibling UI objects when the UIListLayout fill direction is set to vertical.\"\
    \ />\n\n##### AutomaticSize Interaction\n\nIf `Class.GuiObject.AutomaticSize`\
    \ is enabled for a child of the\n`Class.UIListLayout` in the\n`Class.UIListLayout.FillDirection|FillDirection`,\
    \ it is interpreted as\n\"automatic flex basis\" and it defines the size of the\
    \ `Class.GuiObject`\nfrom which it can grow or shrink.\n\nIf `Class.GuiObject.AutomaticSize`\
    \ is enabled for a child of the\n`Class.UIListLayout` in the **cross‑direction**,\
    \ it is interpreted as\n\"automatic cross size\" and it defines the minimum size\
    \ needed to contain\nall the child's content in the cross‑direction.\n"
