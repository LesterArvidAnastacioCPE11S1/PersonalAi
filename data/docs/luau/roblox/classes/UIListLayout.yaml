- name: UIListLayout.VerticalFlex
  summary: 'Controls how to distribute extra vertical space.

    '
  description: "When the list layout's `Class.UIListLayout.FillDirection|FillDirection`\
    \ is\nset to `Enum.FillDirection.Vertical`, the\n`Class.UIListLayout.VerticalFlex|VerticalFlex`\
    \ property specifies how to\ndistribute extra vertical space in the parent container.\n\
    \n<table size=\"small\">\n  <thead>\n    <tr>\n      <th>Setting</th>\n      <th>Sibling\
    \ Behavior</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.None|None</code></td>\n\
    \      <td>No flex behavior; siblings maintain their defined height.</td>\n  \
    \  </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.Fill|Fill</code></td>\n\
    \      <td>Siblings resize vertically to fill the entire parent container, overriding\
    \ their defined height. The number of siblings in a column remain unchanged; for\
    \ example, if three siblings fit vertically within the container's height under\
    \ the <code>Enum.UIFlexAlignment.None|None</code> setting, those three siblings\
    \ will resize to fill the entire height.</td>\n    </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.SpaceAround|SpaceAround</code></td>\n\
    \      <td>Siblings maintain their defined height. Equal spacing is added on both\
    \ sides of each sibling.</td>\n    </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.SpaceBetween|SpaceBetween</code></td>\n\
    \      <td>Siblings maintain their defined height. Equal spacing is added <b>between</b>\
    \ siblings, but no additional space is added <b>around</b> siblings.</td>\n  \
    \  </tr>\n    <tr>\n      <td><code>Enum.UIFlexAlignment.SpaceEvenly|SpaceEvenly</code></td>\n\
    \      <td>Siblings maintain their defined height. Equal spacing is added both\
    \ <b>between</b> and <b>around</b> siblings.</td>\n    </tr>\n  </tbody>\n</table>\n\
    \n<img src=\"../../../assets/engine-api/classes/UIListLayout/VerticalFlex-Options.png\"\
    \ width=\"800\" alt=\"UIListLayout examples showing how each VerticalFlex option\
    \ affects the size and spacing of sibling UI objects.\" />\n\n##### Cross-Direction\
    \ Behavior\n\nIn **horizontal** list layouts\n(`Class.UIListLayout.FillDirection|FillDirection`\
    \ set to\n`Enum.FillDirection.Horizontal`), the\n`Class.UIListLayout.VerticalFlex|VerticalFlex`\
    \ property specifies how to\ndistribute the siblings across the **vertical cross\
    \ direction**. In such\nlayouts, a setting of `Enum.UIFlexAlignment.Fill` makes\
    \ the siblings fill\nthe entire vertical space while horizontal spacing adheres\
    \ to\n`Class.UIListLayout.HorizontalFlex|HorizontalFlex`.\n\n<img src=\"../../../assets/engine-api/classes/UIListLayout/VerticalFlex-Cross-Direction.png\"\
    \ width=\"720\" alt=\"Diagram showing how VerticalFlex affects the vertical size\
    \ of sibling UI objects when the UIListLayout fill direction is set to horizontal.\"\
    \ />\n\n##### AutomaticSize Interaction\n\nIf `Class.GuiObject.AutomaticSize`\
    \ is enabled for a child of the\n`Class.UIListLayout` in the\n`Class.UIListLayout.FillDirection|FillDirection`,\
    \ it is interpreted as\n\"automatic flex basis\" and it defines the size of the\
    \ `Class.GuiObject`\nfrom which it can grow or shrink.\n\nIf `Class.GuiObject.AutomaticSize`\
    \ is enabled for a child of the\n`Class.UIListLayout` in the **cross‑direction**,\
    \ it is interpreted as\n\"automatic cross size\" and it defines the minimum size\
    \ needed to contain\nall the child's content in the cross‑direction.\n"
