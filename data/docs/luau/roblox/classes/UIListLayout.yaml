name: UIListLayout
type: class
memory_category: Instances
summary: 'Positions sibling UI elements in rows or columns within the parent UI

  container.

  '
description: "A `Class.UIListLayout` positions sibling UI elements in rows or columns\
  \ within\nthe parent UI container, based on the\n`Class.UIListLayout.FillDirection|FillDirection`.\
  \ The\n`Class.GuiObject.Position|Position` and `Class.GuiObject.Rotation|Rotation`\n\
  properties of each sibling `Class.GuiObject` are either ignored or overridden\n\
  by the list layout, while each sibling retains its defined\n`Class.GuiObject.Size|Size`\
  \ unless the layout is configured to utilize a flex\nlayout. See [List and Flex\
  \ Layouts](../../../ui/list-flex-layouts.md) for\nfurther information.\n\n<img src=\"\
  ../../../assets/engine-api/classes/UIListLayout/FillDirection.png\"\nwidth=\"720\"\
  \ alt=\"UIListLayouts illustrating FillDirection of either horizontal\nor vertical.\"\
  \ />\n\nTo control the layout order of siblings, set\n`Class.UIListLayout.SortOrder|SortOrder`\
  \ to either `Enum.SortOrder.Name` or\n`Enum.SortOrder.LayoutOrder`, then rename\
  \ siblings in alphanumerical order or\nset their `Class.GuiObject.LayoutOrder|LayoutOrder`\
  \ value, respectively.\n`Class.UIListLayout` will automatically re‑layout elements\
  \ when elements are\nadded/removed, or if a sibling's `Class.Instance.Name|Name`\
  \ or\n`Class.GuiObject.LayoutOrder|LayoutOrder` changes.\n\n<img src=\"../../../assets/engine-api/classes/UIListLayout/SortOrder.png\"\
  \nwidth=\"720\" alt=\"List layout examples illustrating numerical LayoutOrder\n\
  sorting or alphanumerical Name sorting.\" />\n\nPadding between siblings is controlled\
  \ through the\n`Class.UIListLayout.Padding|Padding` property, and wrapping within\
  \ the parent\ncontainer's bounds through the `Class.UIListLayout.Wraps|Wraps` boolean.\n\
  Alignment of siblings within the parent container is controlled through\n`Class.UIListLayout.HorizontalAlignment|HorizontalAlignment`\
  \ and\n`Class.UIListLayout.VerticalAlignment|VerticalAlignment` unless the layout\
  \ is\nconfigured to utilize a\n[flex layout](../../../ui/list-flex-layouts.md#flex-layouts).\n\
  \nNote that there are performance implications of using a\n[flex‑enabled](../../../ui/list-flex-layouts.md#flex-layouts)\
  \ list layout,\nsince extra calculations are needed to calculate flex basis sizes,\
  \ flexed\nsizes, and line wrapping. Flex is enabled on a `Class.UIListLayout` when\
  \ the\nfollowing properties are set, or if any `Class.GuiObject` sibling has a\n\
  `Class.UIFlexItem` parented to it:\n\n- `Class.UIListLayout.HorizontalFlex|HorizontalFlex`\
  \ and/or\n  `Class.UIListLayout.VerticalFlex|VerticalFlex` are **not** set to\n\
  \  `Enum.UIFlexAlignment.None`.\n- `Class.UIListLayout.ItemLineAlignment|ItemLineAlignment`\
  \ is **not** set to\n  `Enum.ItemLineAlignment.Automatic`.\n- `Class.UIListLayout.Wraps|Wraps`\
  \ is `true`.\n"
