name: Atmosphere
type: class
memory_category: Instances
summary: 'The `Class.Atmosphere` object pushes Roblox closer toward realistic

  environments where sunlight scatters in different ways depending on density

  and other air particle properties.

  '
description: "Fog properties are hidden when Lighting contains an Atmosphere object.\n\
  \nThe **Atmosphere** object pushes Roblox closer toward realistic environments\n\
  where sunlight scatters in different ways depending on density and other air\nparticle\
  \ properties. It simulates real-world \"aerial perspective\" and lets you\ncontrol\
  \ light transmission from the background sky through distant objects.\nFurthermore,\
  \ it controls haze and glare conditions, letting you tune a perfect\nsunset, foggy\
  \ afternoon, and more.\n\nSee also:\n\n- [Atmospheric Effects](../../../environment/atmosphere.md)\
  \ for property\n  comparisons and example environments.\n- [Skybox](../../../environment/skybox.md)\
  \ for how to change the default\n  skybox for games and customize the lighting.\n\
  - [Post-Processing Effects](../../../environment/post-processing-effects.md)\n \
  \ for how post-processing effects can quickly improve a game's visuals with a\n\
  \  variety of customizable filters.\n"
