- name: Atmosphere.Density
  summary: 'Defines the amount of particles in the `Class.Atmosphere` and essentially

    controls how much in-game objects/terrain will be obscured by them.

    '
  description: 'Defines the amount of particles in the air. The higher the density,
    the

    more particles and the more in-game objects/terrain will be obscured by

    them. Note that density does not **directly** affect the skybox &mdash; it

    merely affects in-game objects/terrain and visibility of the skybox

    through them.

    '
