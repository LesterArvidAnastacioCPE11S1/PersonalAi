- name: ControllerPartSensor.LadderSearchOffset
  summary: 'The downward offset, in studs, that positions the vertical region the

    sensor searches for a ladder when `Class.ControllerPartSensor.SensorMode`

    is set to a ladder mode.

    '
  description: 'Downward offset, in studs relative to the parent `Class.BasePart`,
    that

    positions the vertical extent scanned for a climbable ladder. Behaves like

    a hip-height offset: increasing it lowers both the bottom and top of the

    searched region, and scales the rung-spacing tolerance used to decide

    whether a surface is climbable.


    Defaults to `5`; clamped to non-negative values.


    Only affects sensing when `Class.ControllerPartSensor.SensorMode` is a

    ladder mode such as `Enum.SensorMode.Ladder`. Because `SensorMode`

    defaults to `Enum.SensorMode.Floor`, this has no effect until `SensorMode`

    is changed.

    '
