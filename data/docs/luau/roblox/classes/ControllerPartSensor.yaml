- name: ControllerPartSensor.LadderSearchHeight
  summary: 'The upper bound, in studs, of the vertical region the sensor searches
    for

    a ladder when `Class.ControllerPartSensor.SensorMode` is set to a ladder

    mode.

    '
  description: 'Top of the vertical extent the sensor scans for a climbable ladder,
    in

    studs relative to the sensor''s parent `Class.BasePart`. Together with

    `Class.ControllerPartSensor.LadderSearchOffset`, it defines the height

    range: the region extends upward to `LadderSearchHeight` minus

    `LadderSearchOffset`.


    Defaults to `6`; clamped to non-negative values.


    Only affects sensing when `Class.ControllerPartSensor.SensorMode` is a

    ladder mode such as `Enum.SensorMode.Ladder`. Because `SensorMode`

    defaults to `Enum.SensorMode.Floor`, this has no effect until `SensorMode`

    is changed.

    '
