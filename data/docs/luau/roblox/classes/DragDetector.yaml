name: DragDetector
type: class
memory_category: Instances
summary: 'Instance which facilitates and encourages interaction with 3D objects in
  an

  experience.

  '
description: "The `Class.DragDetector` instance facilitates and encourages interaction\
  \ with\n3D objects in an experience, such as opening doors and drawers, sliding\
  \ a part\naround, and much more. Key features include:\n\n- Place a `Class.DragDetector`\
  \ under any `Class.BasePart` or `Class.Model` to\n  make it draggable via all inputs\
  \ (mouse, touch, gamepad, and VR), all\n  without a single line of code.\n\n- Choose\
  \ from several `Class.DragDetector.DragStyle|DragStyle` options, define\n  how the\
  \ object responds to motion via\n  `Class.DragDetector.ResponseStyle|ResponseStyle`,\
  \ and optionally apply axis\n  or movement limits.\n\n- Scripts can respond to manipulation\
  \ of dragged objects to drive UI or make\n  logical decisions, such as adjusting\
  \ the light level in a room based on a\n  sliding wall switch dimmer.\n\n- Players\
  \ can manipulate anchored parts or models and they'll stay exactly\n  where you\
  \ put them upon release.\n\n- `Class.DragDetector|DragDetectors` work in Studio\
  \ as long as you're **not**\n  using the **Select**, **Move**, **Scale**, or **Rotate**\
  \ tools, making it\n  easier to test and adjust draggable objects while editing.\n\
  \nSee the [3D Drag Detectors](../../../ui/3D-drag-detectors.md) guide for\ndetails\
  \ and usage examples.\n"
