methods:
- name: DragDetector:AddConstraintFunction
  summary: 'Adds a function to modify or constrain proposed motion.

    '
  description: 'Adds a function to modify or constrain proposed motion. The function
    takes

    an input `Datatype.CFrame` of **proposed** motion and returns a

    `Datatype.CFrame` of **modified** or unmodified motion. Both the input and

    output are expressed relative to the reference frame. You can add multiple

    functions which will be called in order by `priority`, passing the results

    along in a chain.


    To remove an added constraint function, call

    `Datatype.RBXScriptConnection:Disconnect()|Disconnect()` on the returned

    connection object.

    '
  code_samples: []
  parameters:
  - name: priority
    type: int
    default: null
    summary: 'The order of priority for functions added via this method. Higher

      values take precedence over lower values.

      '
  - name: function
    type: Function
    default: null
    summary: 'Function for modifying or constraining proposed motion. This function

      takes an input `Datatype.CFrame` of **proposed** motion and returns a

      `Datatype.CFrame` of **modified** or unmodified motion, both relative

      to the reference frame.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'Use this connection object to remove the constraint function.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Physics
  - Input
- name: DragDetector:GetReferenceFrame
  summary: 'Returns the reference `Datatype.CFrame` in which motion is expressed.

    '
  description: 'Returns the reference `Datatype.CFrame` in which motion is expressed;
    see

    the `Class.DragDetector.ReferenceInstance|ReferenceInstance` property for

    more details.

    '
  code_samples: []
  parameters: []
  returns:
