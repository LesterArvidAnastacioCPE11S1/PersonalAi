name: ModerationService
type: class
memory_category: Instances
summary: 'Server-side service for submitting player captures to content moderation

  review and receiving the results asynchronously.

  '
description: '`ModerationService` lets server-side experience code submit user-generated

  captures (screenshots taken with `Class.CaptureService:CaptureScreenshot()`

  and videos recorded with `Class.CaptureService:StartVideoCaptureAsync()`) to

  Roblox''s content moderation pipeline and receive the review results

  asynchronously.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: ''
properties: []
methods:
- name: ModerationService:BindReviewableContentEventProcessor
  summary: 'Registers a server-side processor, ordered by `priority`, that is invoked

    for each moderation review event on reviewable content.

    '
  description: "Binds a callback that the server invokes for each moderation review\
    \ event\nproduced for content registered through\n`Class.ModerationService:CreateReviewableContentAsync()|CreateReviewableContentAsync()`.\n\
    \nOnce at least one processor is bound, review events are delivered to the\nbound\
    \ processors in `priority` order. The `callback` function receives a\nsingle table\
    \ with the following fields:\n\n- `Id` — The reviewable-content ID the event refers\
    \ to.\n- `State` — The review state (`ReviewableContentState`).\n- `Ref` — The\
    \ optional caller-supplied reference string passed to\n  `Class.ModerationService:CreateReviewableContentAsync()|CreateReviewableContentAsync()`,\n\
    \  present only when one was supplied.\n- `ModerationResult` — Present when a\
    \ moderation result is available, a\n  table with a `Category` (`ModerationResultCategory`)\
    \ and, when a\n  violation is detected, a `Labels` array of `ModerationResultLabel`\n\
    \  values.\n\nProcessors run as a chain: if a processor returns `true`, the event\
    \ is\nacknowledged, deleted from the backend, and removed from the pending set,\n\
    and no further processors run for that event. If it returns `false` (or\ndoes\
    \ not return a boolean), the next processor runs; if no processor\nreturns `true`,\
    \ the event is left unacknowledged and redelivered on a\nlater poll.\n"
  code_samples: []
  parameters:
  - name: priority
    type: int
    default: null
    summary: 'Determines the order in which this processor is invoked relative to

      other bound processors.

      '
  - name: callback
    type: Function
    default: null
    summary: 'The function invoked for each reviewable-content event. It receives
      a

      table describing the event and should return `true` to acknowledge the

      event or `false` to leave it for redelivery.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'A connection that can be disconnected to unregister the processor.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Consequences
- name: ModerationService:CreateReviewableContentAsync
  summary: 'Registers user-generated captures for moderation review and triggers the

    owning clients to upload them, returning the reviewable-content ID.

    '
  description: "Registers one or more captures as a single unit of reviewable content\
    \ and\nstarts its moderation review. This is a yielding function that must be\n\
    called on the server and is restricted to allow-listed universes; calling\nit\
    \ from a universe that is not permitted to use this API raises an error.\n\nThe\
    \ `config` table accepts:\n\n- `Id` — An optional caller-chosen ID for the reviewable\
    \ content.\n  Supplying an ID that already exists raises an error.\n- `Ref` —\
    \ An optional reference string echoed back on the events delivered\n  to processors\
    \ bound with\n  `Class.ModerationService:BindReviewableContentEventProcessor()|BindReviewableContentEventProcessor()`.\n\
    - `Content` — A list of items (currently limited to one), each containing\n  either\
    \ an `Image` or a `Video` table with a `UserId` (the owning player)\n  and a `ContentKey`\
    \ obtained from\n  `Class.ModerationService:CreateReviewableContentKey()|CreateReviewableContentKey()`.\n\
    \nThe method registers the content with the backend and returns the\nreviewable\
    \ content ID. Review results are later delivered to bound\nprocessors as the moderation\
    \ review completes.\n"
  code_samples: []
  parameters:
  - name: config
    type: Dictionary
    default: null
    summary: 'A table of parameters describing the content to review, including an

      optional `Id`, an optional `Ref`, and a `Content` list of image or

      video items.

      '
  returns:
  - type: string
    summary: 'The ID of the created reviewable content.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Consequences
- name: ModerationService:CreateReviewableContentKey
  summary: 'Returns an opaque key that identifies a screenshot or video capture for

    use with

    `Class.ModerationService:CreateReviewableContentAsync()|CreateReviewableContentAsync()`.

    '
  description: 'Produces an opaque key that describes a single capture so it can be

    submitted to

    `Class.ModerationService:CreateReviewableContentAsync()|CreateReviewableContentAsync()`.


    The `content` must reference a supported capture (a temporary content URI

    produced by `Class.CaptureService:CaptureScreenshot()`, a

    `Class.ScreenshotCapture` object, or a `Class.VideoCapture` object). Any

    other content raises an error.

    '
  code_samples: []
  parameters:
  - name: content
    type: Content
    default: null
    summary: 'A `Datatype.Content` referring to a screenshot or video capture (a

      temporary URI from `Class.CaptureService:CaptureScreenshot()`, a

      `Class.ScreenshotCapture`, or a `Class.VideoCapture`).

      '
  returns:
  - type: string
    summary: 'An opaque content key identifying the capture.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Consequences
