- name: RunService:IsResimulating
  summary: 'Returns whether the client is currently in a resimulation step after a

    misprediction in the server authority model.

    '
  description: 'Returns `true` if the engine is currently replaying simulation steps
    after

    detecting a misprediction in the server authority model; returns `false`

    otherwise. When the server''s authoritative state diverges from the

    client''s predicted state, the client rolls back and rapidly resimulates

    all affected steps within a single frame. During that resimulation pass,

    `Class.RunService:BindToSimulation()|BindToSimulation()` callbacks and

    property-changed signals fire again for each replayed step, which can

    cause unwanted side effects such as duplicate sound playback or redundant

    network requests.

    '
  code_samples: []
  parameters: []
  returns:
  - type: boolean
    summary: 'Whether the engine is currently resimulating.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
  simulationAccess: true
- name: RunService:IsRunMode
  summary: 'Returns whether a **Run** playtest has been initiated in Studio.

    '
  description: 'This method returns whether a **Run** playtest has been initiated
    in

    Studio. It will continue to return `true` if the simulation has been

    paused using the **Pause** button; however, once it has been stopped using

    the **Stop** button, it will revert to returning `false`. Note that Studio

    only enters "run" mode when a **Run** playtest (without the user''s player

    character) is initiated. Also note that this method will return `false` if

    the simulation was started using `Class.RunService:Run()`.

    '
  code_samples: []
  parameters: []
  returns:
  - type: boolean
    summary: 'Whether a **Run** playtest has been initiated in Studio.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Basic
