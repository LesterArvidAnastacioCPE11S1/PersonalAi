properties:
- name: RunService.RunState
  summary: 'The current run state of the game''s simulation.

    '
  description: 'An `Enum.RunState` value that reflects whether the game''s simulation
    is

    stopped, running, or paused. Reading reports the current state; setting it

    transitions the simulation, equivalent to `Class.RunService:Run()`,

    `Class.RunService:Pause()`, and `Class.RunService:Stop()` for the

    corresponding states. Defaults to `Enum.RunState.Stopped`. Setting this

    property requires `Plugin` security.


    The state reported here backs the context methods on `Class.RunService`:

    it is `Running` when `Class.RunService:IsRunning()|IsRunning()` returns

    `true`, and `Stopped` when `Class.RunService:IsEdit()|IsEdit()` returns

    `true`.

    '
