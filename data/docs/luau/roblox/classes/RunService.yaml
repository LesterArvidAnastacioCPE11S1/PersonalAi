events:
- name: RunService.Heartbeat
  summary: 'Fires every frame, after the physics simulation has completed.

    '
  description: 'The `Heartbeat` event fires every frame, after the physics simulation
    has

    completed. The `deltaTime` argument indicates the time that has elapsed

    since the previous frame.


    This event is when most scripts run. It occurs at the end of each frame

    and it''s also when any waiting scripts are executed, such as those

    scheduled with the `Library.task` library. `Heartbeat` is commonly used

    for periodic tasks, such as updating core game systems like health

    regeneration.


    Following this step, the engine sends property updates and events to the

    server or clients which are later received as part of the

    [replication](../../../projects/client-server.md#replication) receive

    step.

    '
  code_samples: []
  parameters:
  - name: deltaTime
    type: double
    default: null
    summary: 'The time (in seconds) that has elapsed since the previous frame.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Basic
- name: RunService.Misprediction
  summary: 'In the server authority model, fires during prediction when the engine

    detects that the client has diverged from the server''s authoritative

    state. Intended for plugin-based debugging.

    '
  description: "With server authority enabled, the Misprediction event fires when\
    \ a\nreceived server state differs from the predicted state.\n\nUse this event\
    \ to build debugging tools that inspect misprediction data\nprogrammatically.\
    \ For example, a plugin could listen for this event and\ntrack which instances\
    \ are frequently mispredicting, what properties are\ndiverging, and by how much.\n\
    \n##### Instances Array\n\nEach entry in the `instances` array is a table with\
    \ the following\nstructure:\n\n<table size=\"small\">\n  <thead>\n    <tr>\n \
    \     <th>Field</th>\n      <th>Type</th>\n      <th>Description</th>\n    </tr>\n\
    \  </thead>\n  <tbody>\n    <tr>\n      <td><code>Instance</code></td>\n     \
    \ <td><code>Instance</code></td>\n      <td>The instance that was mispredicted.</td>\n\
    \    </tr>\n    <tr>\n      <td><code>Properties</code></td>\n      <td><code>dictionary?</code></td>\n\
    \      <td>Properties that were mispredicted. Each key is a property name\nmapping\
    \ to a table with the client's <code>Predicted</code> and\nowner's/server's <code>Authoritative</code>\
    \ values as captured on the\nstep when the client first mispredicted the owner's\
    \ value. Only\npresent if there are property mismatches.</td>\n    </tr>\n   \
    \ <tr>\n      <td><code>Attributes</code></td>\n      <td><code>dictionary?</code></td>\n\
    \      <td>Attributes that were mispredicted. Each key is a property name\nmapping\
    \ to a table with the client's <code>Predicted</code> and\nowner's/server's <code>Authoritative</code>\
    \ values as captured on the\nstep when the client first mispredicted the owner's\
    \ value. Only\npresent if there are attribute mismatches.</td>\n    </tr>\n  </tbody>\n\
