name: RunService
type: class
memory_category: Instances
summary: 'Service responsible for all runtime activity and progression of time.

  '
description: "`RunService` contains methods and events for time management as well\
  \ as for\nmanaging the context in which an experience or script is running. Methods\
  \ like\n`Class.RunService:IsClient()|IsClient()`,\n`Class.RunService:IsServer()|IsServer()`,\
  \ and\n`Class.RunService:IsStudio()|IsStudio()` can help you determine under what\n\
  context code is running. These methods are useful for\n`Class.ModuleScript|ModuleScripts`\
  \ that may be required by both client and\nserver scripts. Furthermore, `Class.RunService:IsStudio()|IsStudio()`\
  \ can be\nused to add special behaviors for in‑Studio testing.\n\n`RunService` also\
  \ houses events that allow your code to adhere to the engine's\nframe‑by‑frame loop,\
  \ such as `Class.RunService.PreRender|PreRender`,\n`Class.RunService.PreAnimation|PreAnimation`,\n\
  `Class.RunService.PreSimulation|PreSimulation`,\n`Class.RunService.PostSimulation|PostSimulation`,\
  \ and\n`Class.RunService.Heartbeat|Heartbeat`. Selecting the proper event to use\
  \ for\nany case is important, so you should read\n[Task Scheduler](../../../performance-optimization/microprofiler/task-scheduler.md)\n\
  to make an informed decision.\n\n##### Context Test Results\n\n<table size=\"small\"\
  >\n  <thead>\n    <tr>\n      <th>Environment</th>\n      <th><code>Class.RunService:IsStudio()|IsStudio</code></th>\n\
  \      <th><code>Class.RunService:IsClient()|IsClient</code></th>\n      <th><code>Class.RunService:IsServer()|IsServer</code></th>\n\
  \      <th><code>Class.RunService:IsEdit()|IsEdit</code></th>\n      <th><code>Class.RunService:IsRunning()|IsRunning</code></th>\n\
  \      <th><code>Class.RunService:IsRunMode()|IsRunMode</code></th>\n    </tr>\n\
  \  </thead>\n  <tbody>\n    <tr>\n      <td>Live (Client)</td>\n      <td><code>false</code></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n      <td></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n    </tr>\n\
  \    <tr>\n      <td>Live (Server)</td>\n      <td><code>false</code></td>\n   \
  \   <td><code>false</code></td>\n      <td><code>true</code></td>\n      <td></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n    </tr>\n\
  \    <tr>\n      <td>Edit</td>\n      <td><code>true</code></td>\n      <td><code>true</code></td>\n\
  \      <td><code>true</code></td>\n      <td><code>true</code></td>\n      <td><code>false</code></td>\n\
  \      <td><code>false</code></td>\n    </tr>\n    <tr>\n      <td>Collaborative\
  \ Edit</td>\n      <td><code>true</code></td>\n      <td><code>true</code></td>\n\
  \      <td><code>false</code></td>\n      <td><code>true</code></td>\n      <td><code>false</code></td>\n\
  \      <td><code>false</code></td>\n    </tr>\n    <tr>\n      <td>Run Mode</td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n      <td><code>true</code></td>\n\
  \      <td></td>\n      <td><code>true</code></td>\n      <td><code>true</code></td>\n\
  \    </tr>\n    <tr>\n      <td>Play Mode (Client)</td>\n      <td><code>true</code></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n      <td></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n    </tr>\n\
  \    <tr>\n      <td>Play Mode (Server)</td>\n      <td><code>true</code></td>\n\
  \      <td><code>false</code></td>\n      <td><code>true</code></td>\n      <td></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n    </tr>\n\
  \    <tr>\n      <td>Team Test (Client)</td>\n      <td><code>true</code></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n      <td></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n    </tr>\n\
  \    <tr>\n      <td>Team Test (Server)</td>\n      <td><code>true</code></td>\n\
  \      <td><code>false</code></td>\n      <td><code>true</code></td>\n      <td></td>\n\
  \      <td><code>true</code></td>\n      <td><code>false</code></td>\n    </tr>\n\
  \    <tr>\n      <td>Luau Execution</td>\n      <td><code>false</code></td>\n  \
  \    <td><code>false</code></td>\n      <td><code>true</code></td>\n      <td></td>\n\
  \      <td><code>false</code></td>\n      <td><code>false</code></td>\n    </tr>\n\
  \  </tbody>\n</table>\n"
