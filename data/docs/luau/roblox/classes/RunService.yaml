methods:
- name: RunService:BindToAnimation
  summary: 'Binds a custom function to be called at a fixed frequency before Animators

    update when fixed simulation is enabled, or immediately before

    `BindToSimulation` callbacks otherwise.

    '
  description: '`BindToAnimation()` binds a custom function to be called at a fixed

    frequency which is independent of the frame rate. When

    `Class.Workspace.UseFixedSimulation` is enabled, these functions are

    invoked before Animators update, making this the fixed-frequency

    counterpart to `Class.RunService.PreAnimation|PreAnimation`. When fixed

    simulation is disabled, they instead run immediately before

    `Class.RunService:BindToSimulation()|BindToSimulation()` callbacks, so no

    pre-animation ordering should be assumed. In the server authority model,

    bound functions will also get called when the client needs to resimulate.


    Like `Class.RunService:BindToSimulation()|BindToSimulation()`, the bound

    function is meant for physics controllers and prediction, so an error will

    trigger if you read or write from unsynchronized properties or call an

    unsynchronized method. This error is meant to help guide you in writing a

    pure, synchronized simulation.


    To synchronize inaccessible properties, you should store the relevant data

    in [attributes](../../../studio/properties.md#instance-attributes) and

    update the relevant property in

    `Class.RunService.PostSimulation|PostSimulation` or

    `Class.RunService.RenderStepped|RenderStepped` by reading from attributes.

    This will leverage attribute synchronization to keep the property fully

    synchronized through the rollback mechanism.

    '
  code_samples: []
  parameters:
  - name: function
    type: Function
    default: null
    summary: 'The function to call. This function will be passed one parameter

      called `deltaTime`, which shows the elapsed time since the callback''s

      previous invocation.

      '
  - name: frequency
    type: StepFrequency
    default: Hz30
    summary: 'Optional `Enum.StepFrequency` value indicating the frequency at which

      to call the bound function. Defaults to `Enum.StepFrequency.Hz30`.

      '
  - name: priority
    type: int
    default: 2000
    summary: 'Optional priority of the binding as an integer; it determines the

      order in which bound functions are called within a simulation step.

      Lower numbers are called first. If two bindings have the same

      priority, the order between them is unspecified. Defaults to 2000.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'A `Datatype.RBXScriptConnection` that can be disconnected to

      unregister the callback.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RunService:BindToAnimationParallel
  summary: 'Binds an `Class.Actor`-scoped function to run in parallel at a fixed

    frequency after serial

    `Class.RunService:BindToAnimation()|BindToAnimation()` callbacks.

    '
  description: '`BindToAnimationParallel()` is the parallel counterpart to

    `Class.RunService:BindToAnimation()|BindToAnimation()`. The calling script

    must be a descendant of an `Class.Actor`. A `Class.ModuleScript` may also

    register the callback when its current instantiation was required by a

    script associated with an `Class.Actor`. Each fixed animation phase runs

    its serial bindings first, then runs due parallel bindings concurrently

    across `Class.Actor` VMs; `priority` orders callbacks within one VM but

    does not define an order between different VMs.


    The callback has the same simulation restrictions as

    `Class.RunService:BindToAnimation()|BindToAnimation()`. Calling

    `Library.task.synchronize()` resumes the callback in serial execution

    within the same fixed-step phase. A later `Library.task.synchronize()`

    returns it to parallel execution. The engine finishes these continuations

    before advancing beyond the phase.

    '
  code_samples: []
  parameters:
  - name: function
    type: Function
    default: null
    summary: 'The function to call. This function receives a `deltaTime` parameter

      containing the elapsed time since its previous invocation.

      '
  - name: frequency
    type: StepFrequency
    default: Hz30
    summary: 'Optional `Enum.StepFrequency` value indicating how often to call the

      bound function. Defaults to `Enum.StepFrequency.Hz30`.

      '
  - name: priority
    type: int
    default: 2000
    summary: 'Optional binding priority. Lower numbers run first within the same

      `Class.Actor` VM. Defaults to `2000`.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'A `Datatype.RBXScriptConnection` that can be disconnected to

      unregister the callback.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RunService:BindToRenderStep
  summary: 'Given a string name of a function and a priority, this method binds the

    function to `Class.RunService.PreRender`.

    '
  description: "The `BindToRenderStep()` function binds a custom function to be called\
    \ at\na specific time during the render step. There are three main arguments:\n\
    `name`, `priority`, and what `function` to call.\n\nAs it is linked to the client's\
    \ rendering process, `BindToRenderStep()`\ncan only be called on the client.\n\
    \n##### Name\n\nThe `name` parameter is a label for the binding and can be used\
    \ with\n`Class.RunService:UnbindFromRenderStep()` if the binding is no longer\n\
    needed.\n\n```lua\nlocal RunService = game:GetService(\"RunService\")\n\nlocal\
    \ function functionToBind() end\n\n-- Bind the function above to the binding named\
    \ \"tempBinding\"\nRunService:BindToRenderStep(\"tempBinding\", 1, functionToBind)\n\
    -- Unbind the function bound to \"tempBinding\"\nRunService:UnbindFromRenderStep(\"\
    tempBinding\")\n```\n\n##### Priority\n\nThe `priority` of the binding is an integer;\
    \ it determines when during the\nrender step to call the custom function. The\
    \ lower this number, the sooner\nthe custom function will be called. If two bindings\
    \ have the same\npriority, the engine will randomly pick one to run first. The\
    \ default\ncontrol scripts run with these specific priorities:\n\n- Player Input:\
    \ `100`\n- Camera Controls: `200` For convenience; the `Enum.RenderPriority` enum\n\
    \  can be used to determine the integer value to set a binding. For\n  example,\
    \ to make a binding right before the default camera update,\n  simply subtract\
    \ `1` from the camera priority level.\n\nWhen using `Enum.RenderPriority`, remember\
    \ to use `.Value` at the end of\nthe desired enum. `Class.RunService:BindToRenderStep()`\
    \ will not work if\njust the enum is used on its own.\n\n```lua\nlocal RunService\
    \ = game:GetService(\"RunService\")\n\nlocal function beforeCamera(delta)\n\t\
    -- Code in here will run before the default camera script\nend\n\nRunService:BindToRenderStep(\"\
    Before camera\", Enum.RenderPriority.Camera.Value - 1, beforeCamera)\n```\n\n\
    ##### Custom Function and Delta Time\n\nThe last argument (`function`) is the\
    \ custom function to call. This\nfunction will be passed one parameter called\
    \ `deltaTime` which shows how\nmuch time passed between the beginning of the previous\
    \ render step and the\nbeginning of the current render step.\n\nAll rendering\
    \ updates will wait until the code in the render step\nfinishes. Make sure that\
    \ any code called by `BindToRenderStep()` runs\nquickly and efficiently; if code\
    \ takes too long, the experience visuals\nwill be choppy.\n"
  code_samples:
  - RunService-BindToRenderStep
  - runservice-custom-function
  - runservice-unbindfromrenderstep
  parameters:
  - name: name
    type: string
    default: null
    summary: 'Label for the binding which can be used with

      `Class.RunService.Unbind|Unbind` if the binding is no longer needed.

      '
  - name: priority
    type: int
    default: null
    summary: 'Priority of the binding as an integer; it determines when during the

      render step to call the custom function. The lower this number, the

      sooner the custom function will be called. If two bindings have the

      same priority, the engine will randomly pick one to run first.

      '
  - name: function
    type: Function
    default: null
    summary: 'The custom function being bound.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RunService:BindToSimulation
  summary: 'Binds a custom function to be called at a fixed frequency which is

    independent of the frame rate.

    '
  description: '`BindToSimulation()` binds a custom function to be called at a fixed

    frequency which is independent of the frame rate. In the server authority

    model, bound functions will also get called when the client needs to

    resimulate. This method is only available when

    `Class.Workspace.UseFixedSimulation` is enabled.


    Note that since the bound function is meant for physics controllers and

    prediction, an error will trigger if you read or write from unsynchronized

    properties or call an unsynchronized method. This error is meant to help

    guide you in writing a pure, synchronized simulation.


    To synchronize inaccessible properties, you should store the relevant data

    in [attributes](../../../studio/properties.md#instance-attributes) and

    update the relevant property in

    `Class.RunService.PostSimulation|PostSimulation` or

    `Class.RunService.RenderStepped|RenderStepped` by reading from attributes.

    This will leverage attribute synchronization to keep the property fully

    synchronized through the rollback mechanism.

    '
  code_samples:
  - RunService-BindToSimulation
  parameters:
  - name: function
    type: Function
    default: null
    summary: 'The function to call. This function will be passed one parameter

      called `deltaTime` which shows how much time passed between the

      beginning of the previous simulation step and the beginning of the

      current simulation step.

      '
  - name: frequency
    type: StepFrequency
    default: Hz30
    summary: 'Optional `Enum.StepFrequency` value indicating the frequency at which

      to call the bound function. If not provided, the default frequency

      will be used.

      '
  - name: priority
    type: int
    default: 2000
    summary: 'Optional priority of the binding as an integer; it determines the

      order in which bound functions are called within a simulation step.

      Lower numbers are called first. If two bindings have the same

      priority, the order between them is unspecified. Defaults to 2000.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'An `Datatype.RBXScriptConnection` that can be disconnected to unbind

      the function from the simulation step.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: RunService:BindToSimulationParallel
  summary: 'Binds an `Class.Actor`-scoped function to run in parallel at a fixed

    frequency after serial

    `Class.RunService:BindToSimulation()|BindToSimulation()` callbacks.

    '
  description: '`BindToSimulationParallel()` is the parallel counterpart to

    `Class.RunService:BindToSimulation()|BindToSimulation()`. The calling

    script must be a descendant of an `Class.Actor`. A `Class.ModuleScript`

    may also register the callback when its current instantiation was required

    by a script associated with an `Class.Actor`. Each fixed simulation phase

    runs its serial bindings first, then runs due parallel bindings

    concurrently across `Class.Actor` VMs; `priority` orders callbacks within

    one VM but does not define an order between different VMs.


    The callback has the same restrictions on unsynchronized properties and

    methods as `Class.RunService:BindToSimulation()|BindToSimulation()`.

    Calling `Library.task.synchronize()` resumes the callback in serial

    execution within the same fixed-step phase. A later

    `Library.task.desynchronize()` returns it to parallel execution. The

    engine finishes these continuations before advancing beyond the phase.

    '
  code_samples: []
  parameters:
  - name: function
    type: Function
    default: null
    summary: 'The function to call. This function receives a `deltaTime` parameter

      containing the elapsed time since its previous invocation.

      '
  - name: frequency
    type: StepFrequency
    default: Hz30
    summary: 'Optional `Enum.StepFrequency` value indicating how often to call the

      bound function. Defaults to `Enum.StepFrequency.Hz30`.

      '
  - name: priority
    type: int
    default: 2000
    summary: 'Optional binding priority. Lower numbers run first within the same

      `Class.Actor` VM. Defaults to `2000`.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'A `Datatype.RBXScriptConnection` that can be disconnected to

      unregister the callback.

      '
  tags: []
  deprecation_message: ''
  security: None
