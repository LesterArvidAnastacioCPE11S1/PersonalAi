- name: ScreenshotHud.HideCoreGuiForCaptures
  summary: 'Whether Roblox''s core GUI is hidden while a screenshot is captured.

    '
  description: 'Determines whether Roblox''s core GUI is hidden while a screenshot
    is

    captured through the `Class.ScreenshotHud`. Defaults to `true`, so any

    enabled `Enum.CoreGuiType` elements are hidden for the duration of the

    capture and restored afterward. A saved capture is only flagged as

    GUI-free when both this property and

    `Class.ScreenshotHud.HidePlayerGuiForCaptures` are enabled.

    '
