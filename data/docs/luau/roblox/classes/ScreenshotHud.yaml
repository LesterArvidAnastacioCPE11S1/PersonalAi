name: ScreenshotHud
type: class
memory_category: Instances
summary: 'A 2D user interface that allows users to capture and save screenshots to
  their

  local device.

  '
description: "The `Class.ScreenshotHud` is a 2D user interface that allows users to\
  \ capture\nand save screenshots to their local device. It consists of the following\
  \ UI\nelements:\n\n- An overlay containing the experience name and Roblox branding.\
  \ These remain\n  on screen when a screenshot is taken, although the experience\
  \ name can be\n  disabled through the `Class.ScreenshotHud.ExperienceNameOverlayEnabled`\n\
  \  property.\n- A camera button that hides all UI except for the overlay and takes\
  \ a\n  screenshot.\n- A close button that closes the `Class.ScreenshotHud`.\n\n\
  <img src=\"../../../assets/engine-api/classes/ScreenshotHud/Diagram.jpg\" width=\"\
  100%\" />\n"
