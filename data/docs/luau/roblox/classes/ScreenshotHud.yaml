  summary: 'Whether the local player''s GUI is hidden while a screenshot is captured.

    '
  description: 'Determines whether the local player''s GUI is hidden while a screenshot
    is

    captured through the `Class.ScreenshotHud`. Defaults to `true`, so any

    enabled `Class.ScreenGui` instances under the

