- name: Highlight.DepthMode
  summary: 'Controls how the `Class.Highlight` effect displays with respect to other

    objects in the world.

    '
  description: "Controls how the `Class.Highlight` effect displays with respect to\
    \ other\nobjects in the world. You can set this property to one of the following\n\
    options:\n\n- `Enum.HighlightDepthMode.AlwaysOnTop|AlwaysOnTop` — Allows the highlight\n\
    \  to display regardless if there are objects between the camera and the\n  highlighted\
    \ object. This means the viewer is always able to see the\n  highlight regardless\
    \ of what is between the highlighted object and the\n  camera.\n\n- `Enum.HighlightDepthMode.Occluded|Occluded`\
    \ — Hides the highlight if\n  there are objects between the camera and the highlighted\
    \ object. This\n  means the viewer is only able to see the object if there are\
    \ no\n  obstructing objects between the highlighted object and the camera's\n\
    \  view.\n\n<table size=\"small\">\n<tbody>\n  <tr>\n    <td width=\"50%\">\n\
    \      <figure>\n      <img src=\"/assets/ui/highlighting-objects/DepthMode-AlwaysOnTop.jpg\"\
    \ />\n      <figcaption>DepthMode = AlwaysOnTop</figcaption>\n      </figure>\n\
    \    </td>\n    <td width=\"50%\">\n      <figure>\n      <img src=\"/assets/ui/highlighting-objects/DepthMode-Occluded.jpg\"\
    \ />\n      <figcaption>DepthMode = Occluded</figcaption>\n      </figure>\n \
    \   </td>\n  </tr>\n</tbody>\n</table>\n"
