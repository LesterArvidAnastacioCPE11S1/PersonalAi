name: Highlight
type: class
memory_category: Instances
summary: 'A visual effect which you can use to call attention to a specific object

  within an experience.

  '
description: "The `Class.Highlight` instance is a visual effect which you can use\
  \ to call\nattention to a specific object within an experience. Every highlight\
  \ effect\nhas a silhouette **outline** that surrounds the object and a solid overlay\n\
  **interior** that displays over the object. You can customize both of these\ncomponents\
  \ independently to modify the highlight's visual appearance.\n\n<table size=\"small\"\
  >\n  <tbody>\n    <tr>\n      <td width=\"30%\">\n        <figure>\n        <img\
  \ src=\"/assets/ui/highlighting-objects/OutlineTransparency-1.jpg\" />\n       \
  \ <figcaption>Base object</figcaption>\n        </figure>\n      </td>\n      <td\
  \ width=\"30%\">\n        <figure>\n        <img src=\"/assets/ui/highlighting-objects/Adding-Highlight.jpg\"\
  \ />\n        <figcaption>White outline, 50% red interior</figcaption>\n       \
  \ </figure>\n      </td>\n      <td width=\"30%\">\n        <figure>\n        <img\
  \ src=\"/assets/ui/highlighting-objects/Overview-Yellow-Outline.jpg\" />\n     \
  \   <figcaption>Yellow outline, black interior</figcaption>\n        </figure>\n\
  \      </td>\n    </tr>\n  </tbody>\n</table>\n\nUseful applications of the highlight\
  \ effect include:\n\n- Providing visual feedback that an object is important and/or\
  \ interactable.\n- Making distant objects visible through objects that are closer\
  \ to the user.\n- Indicating the current position and status of other characters.\n\
  \n#### Limitations\n\nAs a performance limit, Studio only displays 255 simultaneous\n\
  `Class.Highlight` instances on the client at a time. If you exceed this limit,\n\
  the additional instances are silently ignored. Note that while a\n`Class.Highlight`\
  \ with `Class.Highlight.Enabled|Enabled` set to `false`\ndoesn't display, it still\
  \ takes one of the 255 available slots, so if you plan\nto permanently disable a\
  \ `Class.Highlight` instance, it's best to delete it\nrather than disable it.\n"
