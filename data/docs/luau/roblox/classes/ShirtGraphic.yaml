- name: ShirtGraphic.Color3
  summary: 'Determines the colorization to be applied to the `Class.ShirtGraphic`

    texture.

    '
  description: "This property determines the colorization to be applied to the\n`Class.ShirtGraphic`\
    \ texture. It functions similarly to\n`Class.ImageLabel.ImageColor3` except that\
    \ it is applied to\n`Class.ShirtGraphic` textures. This is useful for creating\
    \ shirt graphics\nthat have many different color variations but share the same\
    \ basic look.\n\nSee also:\n\n- `Class.Clothing.Color3` which determines the colorization\
    \ to be applied\n  to the `Class.Clothing` texture\n"
