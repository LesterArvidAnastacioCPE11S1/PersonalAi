- name: NetworkSettings.InboundNetworkJitterMs
  summary: 'Adds jitter to playtest connections in the server-to-client direction.

    '
  description: 'On [playtest](/studio/testing-modes.md#playtesting) connections, this

    property adds variability (jitter) in milliseconds to the latency added to

    packets sent from server to client. This variable latency is in addition

    to any latency introduced by

    `Class.NetworkSettings.InboundNetworkMinDelayMs|InboundNetworkMinDelayMs`.

    Per-packet delay sampled from delay and jitter is rounded to 1

    millisecond. See

    [network simulation](/studio/testing-modes.md#network-simulation) for

    additional details.

    '
  code_samples: []
  type: float
