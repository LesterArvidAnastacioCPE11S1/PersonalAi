- name: NetworkSettings.PrintPhysicsErrors
  summary: 'Whether debug messages will be printed to the output pertaining to physics

    replication errors.

    '
  description: "When set to `true`, debug messages will be printed to the **Output**\n\
    window pertaining to physics replication errors. The following are debug\noutputs\
    \ that are made available:\n\n- `Physics-in old packet` prints for a part that\
    \ has been updated ahead of\n  the packet's submission time. This happens if the\
    \ packet is received\n  late, and a newer packet has already been processed.\n\
    \n- `Physics-in of unidentified {GUID}` prints for an unfound part that is\n \
    \ trying to be updated because the provided `Class.Instance` identifier\n  was\
    \ invalid, where `{GUID}` is the unknown `Class.Instance:GetDebugId()`\n  identifier\
    \ that is supposed to be targeting the part. This typically\n  happens if a part\
    \ is removed before the physics update packet is\n  received.\n\n- `Physics-in\
    \ of part not in workspace {GUID}` prints for a request to\n  update the physics\
    \ of a part that is not a descendant of the\n  `Class.Workspace`, where `{GUID}`\
    \ is the `Class.Instance:GetDebugId()`\n  identifier of the target part. This\
    \ happens if the part was just moved\n  out of the `Class.Workspace`, and was\
    \ previously being simulated.\n"
  code_samples: []
  type: boolean
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Diagnostics
  serialization:
    can_load: true
    can_save: true
  capabilities:
  - Network
