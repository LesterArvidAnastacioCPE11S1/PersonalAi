- name: DataModelMesh.Scale
  summary: 'The Scale of a mesh determines the size of the mesh relative to its

    original dimensions.

    '
  description: "The Scale of a mesh determines the size of the mesh relative to its\n\
    original dimensions.\n\n#### How to use mesh scale\n\nThe scale property works\
    \ slightly differently depending on the type of\nmesh being used. Note the size\
    \ of the `Class.BasePart` remains unchanged,\nmeaning the physics collision box\
    \ of the part will remain the same.\n\n- `Class.SpecialMesh` objects with `Class.SpecialMesh.FileType`\
    \ set to\n  'FileMesh' scale relative to the original dimensions of the mesh when\
    \ it\n  was uploaded to Roblox\n- `Class.BlockMesh` objects or `Class.SpecialMesh`\
    \ objects with\n  `Class.SpecialMesh.FileType` set to 'Brick', 'Wedge' or 'Sphere'\
    \ scale\n  uniformly relative to the `Class.BasePart.Size` of their parent\n-\
    \ `Class.CylinderMesh` objects or `Class.SpecialMesh` objects with\n  `Class.SpecialMesh.FileType`\
    \ set to 'Cylinder' scale relative to the\n  `Class.BasePart.Size` of their parent.\
    \ Uniformly for the cylinders\n  height axis and maintaining a 1:1 ratio for the\
    \ length and width of the\n  cylinder, using the lowest value.\n- `Class.SpecialMesh`\
    \ objects with `Class.SpecialMesh.FileType` set to\n  'Head' currently scale in\
    \ a non standard manner. Developers should not\n  rely on this as there are plans\
    \ to change this behavior.\n- `Class.SpecialMesh` objects with `Class.SpecialMesh.FileType`\
    \ set to\n  'Torso' scale in a non standard manner. Developers should not rely\
    \ on\n  this as there are plans to deprecate this mesh type.\n\n#### Mesh scale\
    \ demonstration\n\nThe above behavior can be seen in the following demonstration\
    \ images.\n\nLinear scaling relative to part size for 'Brick', 'Wedge' and 'Sphere'\n\
    meshes.\n\nLinear scaling relative to original uploaded mesh for 'FileMesh' meshes\n\
    \nNon-uniform constrained scaling for 'Cylinder' meshes\n\n#### Other uses for\
    \ mesh scale\n\nThere are a number of interesting uses for the mesh offset property.\n\
    \n- `Class.DataModelMesh.Offset` and Scale can be animated using\n  `Class.TweenService`\
    \ relatively inexpensively as the engine does not\n  need to make any physics/collision\
    \ calculations as the `Class.BasePart`\n  is not changed.\n- Changing the relationship\
    \ between the mesh and its collision extents\n  (determined by the `Class.BasePart`)\n"
  code_samples:
  - Mesh-Offset-and-Scale
