name: DataModelMesh
type: class
memory_category: Instances
summary: 'The DataModelMesh is an abstract class from which mesh classes descend.

  '
description: 'The DataModelMesh is an abstract class from which mesh classes descend.


  Mesh classes are objects that, when parented to `Class.BasePart|BaseParts`

  alter the appearance of the part to that of a predefined mesh. Note, they only

  alter the appearance of the part and not the physics/collision boundaries of

  the part. Developers looking to apply a mesh to a part that alters the part''s

  collision should use `Class.MeshPart|MeshParts`.


  Note the `Class.MeshPart` and `Class.CharacterMesh` classes do not descend

  from DataModelMesh.

  '
code_samples: []
inherits:
- Instance
descendants:
- BevelMesh
- FileMesh
tags:
- NotCreatable
- NotBrowsable
deprecation_message: ''
properties:
- name: DataModelMesh.Offset
  summary: 'The Offset of a mesh determines the relative position from the

    `Class.BasePart.Position` of a `Class.BasePart` that the mesh will be

    displayed at.

    '
  description: "The Offset of a mesh determines the distance from the\n`Class.BasePart.Position`\
    \ of a `Class.BasePart` that the mesh will be\ndisplayed.\n\n#### How to use mesh\
    \ offset\n\nThe Offset property changes the relative position the mesh will be\n\
    rendered at. For example, an offset of 0, 5, 0 will cause the mesh to be\ndisplayed\
    \ 5 studs above the position of the `Class.BasePart`.\n\nThe position of the `Class.BasePart`\
    \ remains unchanged, meaning the\nphysics collision box of the part will remain\
    \ in the same location. This\nis demonstrated in the image below where the green\
    \ outline (a\n`Class.SelectionBox`) shows the extents of the `Class.BasePart`.\n\
    \n#### Other uses for mesh offset\n\nThere are a number of interesting uses for\
    \ the mesh offset property.\n\n- Offset and `Class.DataModelMesh.Scale` can be\
    \ animated using\n  `Class.TweenService` relatively inexpensively as the engine\
    \ does not\n  need to make any physics/collision calculations as the `Class.BasePart`\n\
    \  is not moved.\n- Changing the relationship between the mesh and its collision\
    \ extents\n  (determined by the `Class.BasePart`)\n"
  code_samples:
  - Mesh-Offset-and-Scale
  type: Vector3
