  description: "The primary axis in the plane, when\n`Class.LinearVelocity.VelocityConstraintMode|VelocityConstraintMode`\
    \ is\nset to `Enum.VelocityConstraintMode|Plane`. Value depends on the value of\n\
    `Class.LinearVelocity.RelativeTo|RelativeTo` as follows:\n\n- If `Class.LinearVelocity.RelativeTo|RelativeTo`\
    \ is set to\n  `Enum.ActuatorRelativeTo|Attachment0`, this axis is the\n  `Class.Attachment.Axis|Axis`\
    \ of\n  `Class.Constraint.Attachment0|Attachment0`.\n- If `Class.LinearVelocity.RelativeTo|RelativeTo`\
    \ is set to\n  `Enum.ActuatorRelativeTo|Attachment1`, this axis is the\n  `Class.Attachment.Axis|Axis`\
    \ of\n  `Class.Constraint.Attachment1|Attachment1`.\n- If `Class.LinearVelocity.RelativeTo|RelativeTo`\
    \ is set to\n  `Enum.ActuatorRelativeTo|World`, this value must be specified in\
    \ the\n  world space.\n"
