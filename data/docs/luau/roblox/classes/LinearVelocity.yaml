name: LinearVelocity
type: class
memory_category: BaseParts
summary: 'Applies force on an assembly to maintain a constant linear velocity.

  '
description: "The `LinearVelocity` constraint applies force on an assembly to maintain\
  \ a\n**constant** linear velocity. It can be set to apply force along a\n`Datatype.Vector3`,\
  \ line, or 2D&nbsp;plane. Alternatively:\n\n- If you want to control the amount\
  \ of force applied, use a\n  `Class.VectorForce` constraint.\n- If you only need\
  \ **initial** linear velocity, set the\n  `Class.BasePart.AssemblyLinearVelocity|AssemblyLinearVelocity`\
  \ property\n  directly on the assembly.\n\nWhen configuring this constraint, it\
  \ may be helpful to study\n[Roblox Units](../../../physics/units.md) to understand\
  \ how Roblox units\ncompare to metric units.\n\n#### Relativity\n\nApplication of\
  \ velocity can be controlled through the constraint's\n`Class.LinearVelocity.RelativeTo|RelativeTo`\
  \ property. If set to\n`Enum.ActuatorRelativeTo|World`, force will be applied in\
  \ world coordinates,\nindependent of the parent or attachment orientations. If set\
  \ to\n`Enum.ActuatorRelativeTo|Attachment0` or\n`Enum.ActuatorRelativeTo|Attachment1`,\
  \ force will be applied relative to\n`Class.Constraint.Attachment0|Attachment0`\
  \ or\n`Class.Constraint.Attachment1|Attachment1` respectively.\n"
