name: Clouds
type: class
memory_category: Instances
summary: 'Renders realistic clouds that drift slowly across the sky.

  '
description: 'The **Clouds** object renders realistic clouds that drift slowly across
  the

  sky. Both cloud cover and density can be adjusted, as well as cloud color to

  achieve atmospheres like stormy skies, moody sunsets, alien worlds, etc.


  See the <a href="../../../environment/clouds.md">Dynamic Clouds</a> article

  for a summary of properties and expected results.

  '
