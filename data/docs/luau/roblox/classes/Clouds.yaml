properties:
- name: Clouds.Color
  summary: 'Controls the material color of cloud particles.

    '
  description: 'This property controls the material color of cloud particles. However,

    cloud color is influenced by several `Class.Lighting` and

    `Class.Atmosphere` properties, so it is not intended as a dedicated

    property to simulate colored sunsets, sunrises, etc.


    See the <a href="../../../environment/clouds.md">Dynamic Clouds</a>

    article for a summary of properties and expected results.

    '
