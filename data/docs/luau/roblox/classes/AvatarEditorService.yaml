name: AvatarEditorService
type: class
memory_category: Instances
summary: 'A service to support developer Avatar Editors.

  '
description: "AvatarEditorService is a service to support developer Avatar Editors.\
  \ It\nprovides methods to modify the player's platform avatar, request information\n\
  about a user's inventory, and request information about the catalog.\n\nFor more\
  \ information regarding the Avatar Editor, see\n[Avatar Editor Service](../../../players/avatar-editor.md).\n\
  \n#### Throttling\n\nThe following endpoints on `AvatarEditorService` have experience-level\n\
  throttling:\n\n- `Class.AvatarEditorService.GetItemDetailsAsync`\n- `Class.AvatarEditorService.GetBatchItemDetailsAsync`\n\
  - `Class.AvatarEditorService.GetRecommendedAssetsAsync`\n- `Class.AvatarEditorService.GetRecommendedBundlesAsync`\n\
  - `Class.AvatarEditorService.SearchCatalogAsync`\n- `Class.AvatarEditorService.PromptSetFavorite`\n\
  - `Class.AvatarEditorService.GetFavoriteAsync`\n\nFor each experience, this throttling\
  \ allows you to send up to 100 requests per\nsecond to these `AvatarEditorService`\
  \ endpoints, regardless of the number of\nservers or user count. Exceeding these\
  \ limits returns a\n`429 Too Many Requests` error.\n\n#### Item Details Response\n\
  \nThe following methods return item data in a shared response format:\n\n- `Class.AvatarEditorService:GetItemDetailsAsync()`\n\
  - `Class.AvatarEditorService:GetBatchItemDetailsAsync()`\n- `Class.AvatarEditorService:GetBundlesByAssetIdAsync()`\n\
  - `Class.AvatarEditorService:SearchCatalogAsync()`\n\n```lua\n{\n  \"Id\": 0,\n\
  \  \"ItemType\": \"Asset\",\n  \"AssetType\": \"Image\",\n  \"BundleType\": \"BodyParts\"\
  ,\n  \"Name\": \"string\",\n  \"Description\": \"string\",\n  \"ProductId\": 0,\n\
  \  \"ItemStatus\": [\"New\"],\n  \"ItemRestrictions\": [\"Collectible\"],\n\n  \"\
  BundledItems\": [\n    {\n      \"Id\": 0,\n      \"Name\": \"string\",\n      \"\
  Type\": \"Asset\",\n      \"AssetType\": \"string\",\n      \"SupportsHeadShapes\"\
  : false,\n      \"Owned\": false\n    }\n  ],\n  \"IsRecolorable\": false,\n\n \
  \ \"CollectibleItemId\": \"string\",\n  \"TotalQuantity\": 0,\n  \"UnitsAvailableForConsumption\"\
  : 0,\n  \"QuantityLimitPerUser\": 0,\n  \"HasResellers\": false,\n  \"OffSaleDeadline\"\
  : null,\n\n  \"Price\": 0,\n  \"PremiumPricing\": {\n    \"PremiumDiscountPercentage\"\
  : 0,\n    \"PremiumPriceInRobux\": 0\n  },\n  \"LowestPrice\": 0,\n  \"LowestResalePrice\"\
  : 0,\n  \"PriceStatus\": \"string\",\n  \"SaleLocationType\": \"ShopAndAllExperiences\"\
  ,\n  \"PurchaseCount\": 0,\n  \"FavoriteCount\": 0,\n\n  \"CreatorType\": \"User\"\
  ,\n  \"CreatorTargetId\": 0,\n  \"CreatorName\": \"string\",\n  \"CreatorHasVerifiedBadge\"\
  : false,\n\n  \"SupportsHeadShapes\": false,\n\n  \"TimedOptions\": [\n    { \"\
  Duration\": 259200, \"Price\": 30 },\n    { \"Duration\": 604800, \"Price\": 40\
  \ },\n    { \"Duration\": 1209600, \"Price\": 50 }\n  ]\n}\n```\n\n##### Basic Information\n\
  \n<table>\n  <thead>\n    <tr>\n      <th>Field</th>\n      <th>Type</th>\n    \
  \  <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n  <tr>\n    <td><code>Id</code></td>\n\
  \    <td>number</td>\n    <td>The unique identifier of the item.</td>\n  </tr>\n\
  \  <tr>\n    <td><code>ItemType</code></td>\n    <td>string</td>\n    <td>The type\
  \ of item: <code>\"Asset\"</code> or <code>\"Bundle\"</code>. Corresponds to <code>Enum.AvatarItemType</code>.</td>\n\
  \  </tr>\n  <tr>\n    <td><code>AssetType</code></td>\n    <td>string</td>\n   \
  \ <td>The asset type. Corresponds to <code>Enum.AvatarAssetType</code> values (e.g.,\
  \ <code>\"Hat\"</code>, <code>\"Shirt\"</code>). Only present if <code>ItemType</code>\
  \ is <code>\"Asset\"</code>.</td>\n  </tr>\n  <tr>\n    <td><code>SupportsHeadShapes</code></td>\n\
  \    <td>boolean</td>\n    <td>Whether the asset supports head shape swapping. Only\
  \ present if <code>AssetType</code> is <code>\"DynamicHead\"</code>.</td>\n  </tr>\n\
  \  <tr>\n    <td><code>BundleType</code></td>\n    <td>string</td>\n    <td>The\
  \ bundle type. Corresponds to <code>Enum.BundleType</code> values (e.g., <code>\"\
  BodyParts\"</code>, <code>\"Animations\"</code>). Only present if <code>ItemType</code>\
  \ is <code>\"Bundle\"</code>.</td>\n  </tr>\n  <tr>\n    <td><code>Name</code></td>\n\
  \    <td>string</td>\n    <td>The display name of the item.</td>\n  </tr>\n  <tr>\n\
  \    <td><code>Description</code></td>\n    <td>string</td>\n    <td>The item's\
  \ description text.</td>\n  </tr>\n  <tr>\n    <td><code>ProductId</code></td>\n\
  \    <td>number</td>\n    <td>The product ID associated with this item.</td>\n \
  \ </tr>\n  <tr>\n    <td><code>ItemStatus</code></td>\n    <td>array</td>\n    <td>An\
  \ array of status strings (e.g., <code>\"New\"</code>, <code>\"Sale\"</code>, <code>\"\
  XboxExclusive\"</code>, <code>\"AmazonExclusive\"</code>).</td>\n  </tr>\n  <tr>\n\
  \    <td><code>ItemRestrictions</code></td>\n    <td>array</td>\n    <td>An array\
  \ of restriction strings. See the <code>itemRestrictions</code> table below.</td>\n\
  \  </tr>\n  </tbody>\n</table>\n\n##### Bundle Information\n\n<table>\n  <thead>\n\
  \    <tr>\n      <th>Field</th>\n      <th>Type</th>\n      <th>Description</th>\n\
  \    </tr>\n  </thead>\n  <tbody>\n  <tr>\n    <td><code>BundledItems</code></td>\n\
  \    <td>array</td>\n    <td>An array of items contained in the bundle. Only present\
  \ if <code>ItemType</code> is <code>\"Bundle\"</code>. Each entry contains:</td>\n\
  \  </tr>\n  <tr>\n    <td colspan=\"2\"></td>\n    <td><code>Id</code>: The unique\
  \ identifier of the bundled item.</td>\n  </tr>\n  <tr>\n    <td colspan=\"2\"></td>\n\
  \    <td><code>Name</code>: The display name of the bundled item.</td>\n  </tr>\n\
  \  <tr>\n    <td colspan=\"2\"></td>\n    <td><code>Type</code>: The type of the\
  \ bundled item (e.g., <code>\"Asset\"</code>).</td>\n  </tr>\n  <tr>\n    <td colspan=\"\
  2\"></td>\n    <td><code>AssetType</code>: The asset type as a string. Corresponds\
  \ to <code>Enum.AvatarAssetType</code> values (e.g., <code>\"Hat\"</code>, <code>\"\
  DynamicHead\"</code>).</td>\n  </tr>\n  <tr>\n    <td colspan=\"2\"></td>\n    <td><code>SupportsHeadShapes</code>:\
  \ Whether the asset supports head shape swapping. Only present if <code>AssetType</code>\
  \ is <code>\"DynamicHead\"</code>.</td>\n  </tr>\n  <tr>\n    <td colspan=\"2\"\
  ></td>\n    <td><code>Owned</code>: Whether the bundled item is owned by the current\
  \ user.</td>\n  </tr>\n  <tr>\n    <td><code>IsRecolorable</code></td>\n    <td>boolean</td>\n\
  \    <td>Whether the bundle supports skin tone matching. Only applies to BodyParts\
  \ and DynamicHead bundles.</td>\n  </tr>\n  </tbody>\n</table>\n\n##### Collectible\
  \ Information\n\n<table>\n  <thead>\n    <tr>\n      <th>Field</th>\n      <th>Type</th>\n\
  \      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n  <tr>\n    <td><code>CollectibleItemId</code></td>\n\
  \    <td>string</td>\n    <td>The unique item ID of the collectible.</td>\n  </tr>\n\
  \  <tr>\n    <td><code>TotalQuantity</code></td>\n    <td>number</td>\n    <td>The\
  \ total quantity of the collectible available for purchase (not resale).</td>\n\
  \  </tr>\n  <tr>\n    <td><code>UnitsAvailableForConsumption</code></td>\n    <td>number</td>\n\
  \    <td>The number of units available for purchase. Only applies to Limited items\
  \ with remaining stock.</td>\n  </tr>\n  <tr>\n    <td><code>QuantityLimitPerUser</code></td>\n\
  \    <td>number</td>\n    <td>Maximum number of the same collectible item a user\
  \ can own.</td>\n  </tr>\n  <tr>\n    <td><code>HasResellers</code></td>\n    <td>boolean</td>\n\
  \    <td><code>true</code> when item is a Limited collectible and there are copies\
  \ available for resale.</td>\n  </tr>\n  <tr>\n    <td><code>OffSaleDeadline</code></td>\n\
  \    <td>string</td>\n    <td>The date/time when the item goes off sale.</td>\n\
  \  </tr>\n  </tbody>\n</table>\n\n##### Pricing and Sale Information\n\n<table>\n\
  \  <thead>\n    <tr>\n      <th>Field</th>\n      <th>Type</th>\n      <th>Description</th>\n\
  \    </tr>\n  </thead>\n  <tbody>\n  <tr>\n    <td><code>Price</code></td>\n   \
  \ <td>number</td>\n    <td>The price in Robux. <code>0</code> if free or not for\
  \ sale.</td>\n  </tr>\n  <tr>\n    <td><code>PremiumPricing</code></td>\n    <td>table</td>\n\
  \    <td>Premium pricing information. Contains the following fields:</td>\n  </tr>\n\
  \  <tr>\n    <td colspan=\"2\"></td>\n    <td><code>PremiumDiscountPercentage</code>:\
  \ The discount percentage for Premium members.</td>\n  </tr>\n  <tr>\n    <td colspan=\"\
  2\"></td>\n    <td><code>PremiumPriceInRobux</code>: The discounted price in Robux\
  \ for Premium members.</td>\n  </tr>\n  <tr>\n    <td><code>LowestPrice</code></td>\n\
  \    <td>number</td>\n    <td>The lowest resale price for Limited items.</td>\n\
  \  </tr>\n  <tr>\n    <td><code>LowestResalePrice</code></td>\n    <td>number</td>\n\
  \    <td>The lowest resale price for the collectible in Robux.</td>\n  </tr>\n \
  \ <tr>\n    <td><code>PriceStatus</code></td>\n    <td>string</td>\n    <td>The\
  \ price status (e.g., <code>\"Free\"</code>, <code>\"Off Sale\"</code>, <code>\"\
  No Resellers\"</code>).</td>\n  </tr>\n  <tr>\n    <td><code>SaleLocationType</code></td>\n\
  \    <td>string</td>\n    <td>The type of sale location setting. See <code>SaleLocationType</code>\
  \ values below.</td>\n  </tr>\n  <tr>\n    <td><code>PurchaseCount</code></td>\n\
  \    <td>number</td>\n    <td>The total number of times this item has been purchased.</td>\n\
  \  </tr>\n  <tr>\n    <td><code>FavoriteCount</code></td>\n    <td>number</td>\n\
  \    <td>The total number of users who have favorited this item.</td>\n  </tr>\n\
  \  </tbody>\n</table>\n\n##### Creator Information\n\n<table>\n  <thead>\n    <tr>\n\
  \      <th>Field</th>\n      <th>Type</th>\n      <th>Description</th>\n    </tr>\n\
  \  </thead>\n  <tbody>\n  <tr>\n    <td><code>CreatorType</code></td>\n    <td>string</td>\n\
  \    <td>Either <code>User</code> or <code>Group</code>. See <code>Enum.CreatorType</code>.</td>\n\
  \  </tr>\n  <tr>\n    <td><code>CreatorTargetId</code></td>\n    <td>number</td>\n\
  \    <td>The ID of the creator user or group.</td>\n  </tr>\n  <tr>\n    <td><code>CreatorName</code></td>\n\
  \    <td>string</td>\n    <td>The display name of the creator.</td>\n  </tr>\n \
  \ <tr>\n    <td><code>CreatorHasVerifiedBadge</code></td>\n    <td>boolean</td>\n\
  \    <td>Boolean of whether the creator has a verified badge.</td>\n  </tr>\n  </tbody>\n\
  </table>\n\n##### Timed Options Information\n\n<table>\n  <thead>\n    <tr>\n  \
  \    <th>Field</th>\n      <th>Type</th>\n      <th>Description</th>\n    </tr>\n\
  \  </thead>\n  <tbody>\n  <tr>\n    <td><code>TimedOptions</code></td>\n    <td>array</td>\n\
  \    <td>Optional. An array of available timed options with durations and prices.\
  \ Only present for assets that support timed ownership. Do not hardcode duration\
  \ values; always retrieve them from the API as available options may change. Each\
  \ entry contains:</td>\n  </tr>\n  <tr>\n    <td colspan=\"2\"></td>\n    <td><code>Duration</code>:\
  \ The duration in seconds (e.g. 259200 for 3 days, 604800 for 7 days).</td>\n  </tr>\n\
  \  <tr>\n    <td colspan=\"2\"></td>\n    <td><code>Price</code>: The price in Robux\
  \ for this duration.</td>\n  </tr>\n  </tbody>\n</table>\n\n##### SaleLocationType\
  \ Values\n\n| Value                    | Description                           \
  \                                                 |\n| :-----------------------\
  \ | :-------------------------------------------------------------------------------------\
  \ |\n| `NotApplicable`          | Default value, should not occur in practice. \
  \                                          |\n| `ShopOnly`               | Item\
  \ can only be purchased in the Roblox catalog shop.                            \
  \     |\n| `MyExperiencesOnly`      | Item can only be purchased in the creator's\
  \ experiences.                               |\n| `ShopAndMyExperiences`   | Item\
  \ can be purchased in the Roblox catalog shop or the creator's experiences.    \
  \     |\n| `ExperiencesById`        | Item can only be purchased in a specific list\
  \ of experiences.                          |\n| `ShopAndAllExperiences`  | Item\
  \ can be purchased in the Roblox catalog shop and all experiences.             \
  \     |\n| `ExperiencesDevApiOnly`  | Item can only be purchased in experiences\
  \ via developer APIs.                          |\n| `ShopAndExperiencesById` | Item\
  \ can be purchased in the Roblox catalog shop or a whitelisted list of experiences.\
  \ |\n\n##### itemRestrictions Values\n\n| itemRestrictions | Limited or Unlimited\
  \  |\n| :--------------: | :-------------------: |\n|     `empty`      |       Unlimited\
  \       |\n|  `Collectible`   |      UGC Limited      |\n|    `Limited`     |  \
  \  Roblox Limited     |\n| `LimitedUnique`  | Roblox Limited Unique |\n"
