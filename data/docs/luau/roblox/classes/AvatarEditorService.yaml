- name: AvatarEditorService:GetBatchItemDetailsAsync
  summary: 'Gets the item details for a list of items at once.

    '
  description: 'Gets the item details for a list of items at once. More efficient
    than

    `Class.AvatarEditorService:GetItemDetailsAsync()` if you need to get the

    item details for multiple items.


    You can request up to 100 item IDs per call. If `itemIds` contains more

    than 100 IDs, this method raises an error.


    Returns an array of items (see Item Details Response above in summary).

    Each item includes the `TimedOptions` field when the asset supports timed

    ownership.

    '
  code_samples: []
  parameters:
  - name: itemIds
    type: Array
    default: null
    summary: 'The list of item ids to get details of.

      '
  - name: itemType
    type: AvatarItemType
    default: null
    summary: 'The type of the item ids provided.

      '
  returns:
  - type: Array
    summary: 'Returns an array of item details.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AssetRead
