  summary: 'Returns a `Class.CatalogPages` object containing bundles that include
    the

    given asset.

    '
  description: 'Returns a paginated list of bundles that contain the specified asset.

    Results are returned in ascending order by date created. Each page entry

    uses the **Item Details Response** format (see service description above).

    '
  code_samples: []
  parameters:
