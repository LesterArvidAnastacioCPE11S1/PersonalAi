- name: AvatarEditorService:GetAccessoryType
  summary: 'Returns the `Enum.AccessoryType` that corresponds to the given

    `Enum.AvatarAssetType`.

    '
  description: 'Returns the `Enum.AccessoryType` that corresponds to the given

    `Enum.AvatarAssetType`, which is useful for grouping avatar assets by the

    accessory slot they occupy.


    The mapping covers accessory asset types — for example,

    `Enum.AvatarAssetType.HairAccessory` maps to `Enum.AccessoryType.Hair`,

    and layered-clothing types such as `Enum.AvatarAssetType.ShirtAccessory`

    map to `Enum.AccessoryType.Shirt`. An `Enum.AvatarAssetType` that does not

    correspond to an accessory (for example, an animation or a body part)

    returns `Enum.AccessoryType.Unknown`.


    This method returns immediately; it does not yield or perform a web

    request.

    '
  code_samples: []
  parameters:
  - name: avatarAssetType
    type: AvatarAssetType
    default: null
    summary: 'The `Enum.AvatarAssetType` to convert to its corresponding

      `Enum.AccessoryType`.

      '
  returns:
  - type: AccessoryType
    summary: 'The `Enum.AccessoryType` corresponding to the given

      `Enum.AvatarAssetType`, or `Enum.AccessoryType.Unknown` if the asset

      type has no matching accessory type.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
