    \nThe returned table includes the following fields:\n\n```lua\n[\n    {\n    \
    \  \"AssetId\": 0,\n      \"AssetType\": \"string\",\n      \"Created\": \"string\"\
    ,\n      \"Name\": \"string\",\n      \"CreatedTime\": DateTime,\n      \"ExpirationTime\"\
    : DateTime,\n    }\n]\n```\n\n<table>\n  <thead>\n    <tr>\n      <th>Field</th>\n\
    \      <th>Type</th>\n      <th>Description</th>\n    </tr>\n  </thead>\n  <tbody>\n\
    \  <tr>\n    <td><code>AssetId</code></td>\n    <td>number</td>\n    <td>The asset\
    \ ID.</td>\n  </tr>\n  <tr>\n    <td><code>AssetType</code></td>\n    <td>string</td>\n\
    \    <td>The asset type as a string.</td>\n  </tr>\n  <tr>\n    <td><code>Created</code></td>\n\
    \    <td>string</td>\n    <td>ISO 8601 timestamp of when the item was acquired.</td>\n\
    \  </tr>\n  <tr>\n    <td><code>Name</code></td>\n    <td>string</td>\n    <td>The\
    \ display name of the item.</td>\n  </tr>\n  <tr>\n    <td><code>CreatedTime</code></td>\n\
    \    <td>DateTime</td>\n    <td>When the item was acquired, as a <code>Datatype.DateTime</code>\
    \ value.</td>\n  </tr>\n  <tr>\n    <td><code>ExpirationTime</code></td>\n   \
    \ <td>DateTime</td>\n    <td>Optional. The absolute time when the item's timed\
    \ ownership expires. Only present for items acquired via a timed option. Absent\
    \ for permanently owned items.</td>\n  </tr>\n  </tbody>\n</table>\n"
