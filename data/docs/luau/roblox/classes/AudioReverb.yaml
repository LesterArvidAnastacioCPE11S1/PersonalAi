name: AudioReverb
type: class
memory_category: Internal
summary: 'Reverberates audio streams.

  '
description: '`Class.AudioReverb` reverberates audio streams, modeling the natural
  echoes of

  a room or enclosed space. It provides one **Input** pin and one **Output** pin

  which can be connected to/from by `Class.Wire|Wires`.

  '
