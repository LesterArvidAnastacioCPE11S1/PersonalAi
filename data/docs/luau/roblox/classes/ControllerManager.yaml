name: ControllerManager
type: class
memory_category: Instances
summary: 'Manages simulated motion control for its assigned

  `Class.ControllerManager.RootPart` .

  '
description: 'The `Class.ControllerManager` instance manages simulated motion control
  for

  its assigned `Class.ControllerManager.RootPart`. It can be used to build a

  physics-based character controller.

  '
