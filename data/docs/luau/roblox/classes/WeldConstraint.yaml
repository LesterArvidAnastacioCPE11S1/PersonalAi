name: WeldConstraint
type: class
memory_category: BaseParts
summary: 'Connects two `Class.BasePart|BaseParts` together such that their relative

  position and orientation remain the same.

  '
description: "**WeldConstraint** connects two `Class.BasePart|BaseParts` and ensures\
  \ they\nstay in the same relative position/orientation to each other, meaning that\
  \ if\none part moves, the other moves the same amount. Even if the two parts are\
  \ not\ntouching, they can be welded together.\n\nThe most common way to create a\
  \ weld constraint is by selecting **Weld**\nthrough Studio's **Create** menu in\
  \ the toolbar's **Model** tab.\n\nNote that this tool behaves differently depending\
  \ on how many\n`Class.BasePart|BaseParts` are selected when the tool is activated:\n\
  \n- If no `Class.BasePart|BaseParts` are selected, the next two\n  `Class.BasePart|BaseParts`\
  \ clicked will be connected by a new\n  `Class.WeldConstraint`. If the same `Class.BasePart`\
  \ is clicked twice, no\n  constraint will be created.\n- If one `Class.BasePart`\
  \ is already selected, the next `Class.BasePart`\n  clicked will be connected to\
  \ the selected one with a new\n  `Class.WeldConstraint`.\n- If multiple `Class.BasePart|BaseParts`\
  \ are selected, those which are\n  touching or overlapping will be automatically\
  \ welded together by new\n  `Class.WeldConstraint|WeldConstraints`.\n\n#### Repositioning\
  \ Behavior\n\nMoving a welded `Class.BasePart` behaves differently depending on\
  \ whether the\npart was moved through its `Class.BasePart.Position|Position` or\
  \ through its\n`Datatype.CFrame`.\n\n- If a welded part's `Class.BasePart.Position|Position`\
  \ is updated, that part\n  will move but none of the connected parts will move with\
  \ it. The weld will\n  recalculate the offset from the other parts based on the\
  \ moved part's new\n  position.\n\n- If a welded part's `Datatype.CFrame` is updated,\
  \ that part will move **and**\n  all of the connected parts will also move, ensuring\
  \ they maintain the same\n  offset as when the weld was created.\n"
