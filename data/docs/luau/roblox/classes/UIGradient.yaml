- name: UIGradient.Offset
  summary: 'Determines the scalar translation of the gradient from the center of the

    parent `Class.GuiObject`.

    '
  description: 'This property determines the scalar translation of the gradient from
    the

    center of the parent `Class.GuiObject`. It is a scalar translation,

    meaning that the actual pixel offset is determined by the

    `Class.GuiBase2d.AbsoluteSize|AbsoluteSize` of the parent

    `Class.GuiObject`. For example, a value of `(1, 0)` shifts the gradient

    horizontally to the right by a distance equal to the parent object''s size.

    Depending on the `Class.UIGradient.Rotation|Rotation`, this may cause the

    gradient to be partially visible or not visible at all.


    Also see `Class.UIGradient.Rotation|Rotation` which also affects the

    geometry of the applied gradient.

    '
