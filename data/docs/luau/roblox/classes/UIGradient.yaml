- name: UIGradient.Rotation
  summary: 'Determines the clockwise rotation in degrees of the gradient starting
    from

    left to right.

    '
  description: 'This property determines the **clockwise** rotation in degrees of
    the

    `UIGradient` starting from left to right. The beginning and end control

    points snap to the edges of the parent `Class.GuiObject`, but maintain the

    provided rotation.


    Also see `Class.UIGradient.Offset|Offset` which also affects the geometry

    of the applied gradient.

    '
