- name: UIGradient.TileMode
  summary: 'Determines how the gradient repeats.

    '
  description: 'This property determines what happens when the gradient

    `Class.UIGradient.Scale|Scale` is less than `1` or when

    `Class.UIGradient.Offset|Offset` shifts the gradient so that it does not

    fully cover the element. See `Enum.GradientTileMode` for possible values

    and their effect.


    See also `Class.UIGradient.Scale|Scale` which controls how much of the

    color/transparency sequence is visible.

    '
