- name: UIGradient.Scale
  summary: 'Multiplies the extent of the gradient, controlling how much of the

    color/transparency sequence is visible within the element.

    '
  description: "This property multiplies the extent of the gradient, controlling how\
    \ much\nof the color/transparency sequence is visible within the parent\n`Class.GuiObject`.\n\
    \n- A value of `1` (default) means the full sequence spans the element\n  exactly\
    \ once.\n\n- Values **less** than `1` compress the gradient so that the full sequence\n\
    \  fits in a smaller region. The remaining area is determined by\n  `Class.UIGradient.TileMode|TileMode`.\
    \ Note that `Scale` is clamped to a\n  minimum of `0.001` to avoid degenerate\
    \ gradients.\n\n- Values **greater** than `1` stretch the gradient beyond the\
    \ element\n  bounds so that only a portion of the sequence is visible.\n\nThe\
    \ effect of `Scale` also depends on the gradient's\n`Class.UIGradient.Type|Type`:\n\
    \n- `Enum.GradientType.Linear` — `Scale` affects the distance between the\n  start\
    \ and end control points.\n\n- `Enum.GradientType.Radial` — `Scale` affects the\
    \ radius of the radial\n  gradient.\n\n- `Enum.GradientType.Elliptical` — `Scale`\
    \ affects both radii of the\n  elliptical gradient.\n\n- `Enum.GradientType.Conical`\
    \ — `Scale` affects the angular sweep, clamped\n  so that the sweep does not exceed\
    \ a full revolution.\n\nSee also `Class.UIGradient.TileMode|TileMode` which determines\
    \ how the\ngradient repeats when `Scale` causes it to not fill the entire element.\n"
  code_samples: []
