name: UIGradient
type: class
memory_category: Instances
summary: 'Applies a color and transparency gradient to the parent `Class.GuiObject`.

  '
description: "`UIGradient` applies a color and transparency gradient to the parent\n\
  `Class.GuiObject`. The appearance of the gradient is configurable through its\n\
  `Class.UIGradient.Color|Color`, `Class.UIGradient.Transparency|Transparency`,\n\
  `Class.UIGradient.Offset|Offset`, `Class.UIGradient.Rotation|Rotation`,\n`Class.UIGradient.Scale|Scale`,\
  \ `Class.UIGradient.TileMode|TileMode`, and\n`Class.UIGradient.Type|Type`.\n\n`UIGradient`\
  \ will not apply to child or descendant\n`Class.GuiObject|GuiObjects`. In order\
  \ to apply the same gradient to multiple\nobjects, you will need multiple gradient\
  \ instances.\n\nSee also [appearance modifiers](../../../ui/appearance-modifiers.md#gradient)\n\
  for more information on the `UIGradient` modifier and how it works.\n\n#### Supported\
  \ Objects\n\nYou can apply `UIGradient` modifiers to `Class.Frame`, `Class.TextLabel`,\n\
  `Class.TextButton`, `Class.ImageLabel`, `Class.ImageButton`, `Class.Path2D`,\nand\
  \ `Class.ViewportFrame`. However, `Class.ScrollingFrame` and `Class.TextBox`\nare\
  \ not currently supported.\n\n#### Performance Considerations\n\nIn order to efficiently\
  \ use a `UIGradient`, follow these principles:\n\n- Avoid using more than 6 color\
  \ stops on the `Class.UIGradient.Color|Color`\n  sequence.\n\n- Avoid using a `UIGradient`\
  \ on any object that applies a text stroke\n  (`Class.TextLabel.TextStrokeColor3|TextStrokeColor3`),\
  \ as the gradient will\n  try to blend with strokes and borders, and may cause performance\
  \ issues.\n\n- Avoid setting `Class.UIGradient.Color|Color` and\n  `Class.UIGradient.Transparency|Transparency`\
  \ frequently: this causes the\n  sequence of colors to rebuild often, which is expensive.\
  \ If possible, set\n  these properties only once and try to animate the\n  `Class.UIGradient.Offset|Offset`\
  \ or `Class.UIGradient.Rotation|Rotation`\n  properties to achieve a similar effect.\
  \ Alternatively, you can change the\n  color of the parent `Class.GuiObject` using\
  \ such properties as\n  `Class.GuiObject.BackgroundColor3|BackgroundColor3`,\n \
  \ `Class.ImageLabel.ImageColor3|ImageColor3`, or\n  `Class.TextLabel.TextColor3|TextColor3`.\n\
  \n- When applying an unchanging gradient on a UI element whose state changes a\n\
  \  lot, there is a tradeoff between using a `UIGradient` (processing time) and\n\
  \  a static gradient image (memory).\n"
