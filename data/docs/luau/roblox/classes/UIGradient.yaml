- name: UIGradient.Color
  summary: 'Determines the color blended with the parent `Class.GuiObject` along the

    length of the gradient.

    '
  description: 'This property describes the color to blend with the parent

    `Class.GuiObject` along the provided `Datatype.ColorSequence`. This

    property works in a similar manner to `Class.Beam.Color` or

    `Class.Trail.Color`, except that it applies over a distance determined by

    the `Class.UIGradient.Offset|Offset` and

    `Class.UIGradient.Rotation|Rotation`.

    '
