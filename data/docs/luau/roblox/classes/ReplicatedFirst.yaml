name: ReplicatedFirst
type: class
memory_category: Instances
summary: 'A container whose contents are replicated to all clients (but not back to
  the

  server) first before anything else.

  '
description: "`ReplicatedFirst` is a container whose contents are replicated to all\
  \ clients\n(but not back to the server) before anything else. It's most commonly\
  \ used to\nstore `Class.LocalScript|LocalScripts` and other elements that are essential\n\
  for the experience's start such as\n[loading screens](../../../players/loading-screens.md).\n\
  \nFor objects that do **not** need to be replicated before anything else, use\n\
  the `Class.ReplicatedStorage` container instead.\n\nThere are some key considerations\
  \ for running `Class.LocalScript|LocalScripts`\nin `ReplicatedFirst`:\n\n- Since\
  \ its contents replicate before anything else in the experience,\n  `Class.LocalScript|LocalScripts`\
  \ running in `ReplicatedFirst` will need to\n  wait for any objects they require\
  \ to replicate using\n  `Class.Instance:WaitForChild()`\n- Any objects that are\
  \ to be used by a `Class.LocalScript` in\n  `ReplicatedFirst` should also be parented\
  \ to `ReplicatedFirst`. Otherwise,\n  they may replicate to the client late, yielding\
  \ the script and negating the\n  benefit of initial replication.\n"
