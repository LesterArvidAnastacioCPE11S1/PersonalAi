- name: LocalizationService:GetTableEntries
  summary: 'Gets all entries used for automated localization.

    '
  description: "Returns an `Array`, where each element of the returned `Array` is\
    \ itself\nan `Array` of entries in the same format as described in\n`Class.LocalizationTable:GetEntries()`.\
    \ The order of the elements in the\nreturned `Array` is the same order that the\n\
    `Class.LocalizationTable|LocalizationTables` will be searched through to\nattempt\
    \ automated localization for the provided `Class.Instance`. The\nentry elements\
    \ within a particular `Class.LocalizationTable` are returned\nin an unspecified\
    \ order.\n\nThis function returns entries regardless of whether the object is\
    \ a\n`Class.GuiBase2d` with `Class.GuiBase2d.AutoLocalize` enabled. An object\n\
    that is a `Class.GuiBase2d` will not actually be automatically localized\nunless\
    \ `Class.GuiBase2d.AutoLocalize` is enabled.\n\nThe ordering of the tables is\
    \ as follows:\n\n- First, it looks for the earliest `Class.GuiBase2d` ancestor\
    \ of the\n  object (including the provided object) that has a\n  `Class.GuiBase2d.RootLocalizationTable`.\
    \ Tables then append in the same\n  order as described in `Class.GuiBase2d.RootLocalizationTable`\
    \ by going\n  up through the `Class.LocalizationTable` ancestors of that\n  `Class.GuiBase2d.RootLocalizationTable`.\
    \ If no such\n  `Class.GuiBase2d.RootLocalizationTable` is found, no tables append\
    \ in\n  this step. If `instance` is `nil`, no tables append in this step.\n- Next,\
    \ tables from the `Class.LocalizationTable` hierarchy under\n  `Class.LocalizationService`\
    \ append. For each child\n  `Class.LocalizationTable` of `Class.LocalizationService`,\
    \ it appends\n  tables going up from the lowest descendant `Class.LocalizationTable`\
    \ of\n  the tables parented to the service, all the way up to the children of\n\
    \  the service. If there are no children of `Class.LocalizationService`\n  that\
    \ are `Class.LocalizationTable|LocalizationTables`, then no tables\n  append in\
    \ this step.\n- Finally, the cloud `Class.LocalizationTable` appends to the array.\
    \ If\n  there is no cloud `Class.LocalizationTable`, or the cloud\n  `Class.LocalizationTable`\
    \ has not yet loaded, then no table appends in\n  this step.\n\nThis function\
    \ does not yield. It will not wait until the cloud\n`Class.LocalizationTable`\
    \ has loaded.\n"
  code_samples: []
  parameters:
  - name: instance
    type: Instance
    default: nil
    summary: 'The `Class.Instance` for which to retrieve the ordered localization

      table entries. If nil, only entries from the

      `Class.LocalizationService` hierarchy and the cloud

      `Class.LocalizationTable` are returned.

      '
  returns:
  - type: Array
    summary: 'An array of arrays, where each array is in the same format as

      described in `Class.LocalizationTable:GetEntries()`.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: LocalizationService:GetTranslatorForLocaleAsync
  summary: 'Yields until the cloud `Class.LocalizationTable` for the argument locale

    has been loaded - if available. Returns a `Class.Translator` instance to

    be used for translations for the provided locale.

    '
  description: "This function takes a locale code as an argument and yields until\
    \ the\ncloud `Class.LocalizationTable` for that locale has been loaded, if\navailable.\
    \ It then returns a `Class.Translator` object which can be used\nto perform translations\
    \ for that locale if any are available. The entries\nused for localization are\
    \ the entries provided by the\n`Class.LocalizationTable` hierarchy under `Class.LocalizationService`\
    \ as\nwell as the cloud table (if available). This will be the same set of\nentries\
    \ returned by `Class.LocalizationService:GetTableEntries(nil)`.\n\nThis function\
    \ can error and thus should be wrapped in a `pcall()`.\n\nSee also:\n\n- `Class.LocalizationService:GetTranslatorForPlayer()`\
    \ gets the translator\n  corresponding to the locale of the provided player. This\
    \ function is\n  deprecated and should not be used in new work.\n- `Class.LocalizationService:GetTranslatorForPlayerAsync()`\
    \ yields until\n  the cloud `Class.LocalizationTable` for the locale of the provided\n\
    \  player has loaded and then gets the translator corresponding to the\n  locale\
    \ of the provided player.\n"
  code_samples:
  - getting-and-using-a-translator-for-a-locale
  parameters:
  - name: locale
    type: string
    default: null
    summary: 'A Roblox supported language or locale code.

      '
  returns:
  - type: Instance
    summary: 'The `Class.Translator` instance for the specified locale.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: LocalizationService:GetTranslatorForPlayer
  summary: 'Returns a `Class.Translator` to be used for translations using the locale

    data loaded.

    '
  description: "This function takes a player as an argument and returns a\n`Class.Translator`\
    \ instance which can be used to perform translations for\nthat locale if any are\
    \ available. The entries used for localization are\nthe entries provided by the\
    \ `Class.LocalizationTable` hierarchy under\n`Class.LocalizationService` as well\
    \ as the cloud\n`Class.LocalizationTable`, if it is available and already loaded.\
    \ This\nwill be the same set of entries returned by\n`Class.LocalizationService:GetTableEntries(nil)`.\n\
    \nThis function does not yield. It will not wait until the cloud\n`Class.LocalizationTable`\
    \ has loaded.\n\nSee also:\n\n- `Class.LocalizationService:GetTranslatorForPlayerAsync()`\
    \ has the same\n  functionality as this function, except that it yields until\
    \ the cloud\n  `Class.LocalizationTable` has been loaded.\n- `Class.LocalizationService:GetTranslatorForLocaleAsync()`,\
    \ returns a\n  Translator to be used for translations using the provided locale.\n"
  code_samples:
  - getting-and-using-a-translator-for-a-player
  parameters:
  - name: player
    type: Instance
    default: null
    summary: 'The `Class.Player` that you are getting the `Class.Translator` for.

      '
  returns:
  - type: Instance
    summary: 'The `Class.Translator` instance for the specified locale.

      '
  tags:
  - Deprecated
  deprecation_message: 'This function has been deprecated by

    `Class.LocalizationService:GetTranslatorForPlayerAsync()`, which functions

    similarly except that it yields until the cloud table has loaded. Please

    use it in new work instead.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
