- name: LocalizationService.SystemLocaleId
  summary: 'The locale ID that the local player has set for their operating system.

    '
  description: 'This property shows the locale ID that the local player has set for
    their

    operating system.


    This will return a string with the two letter code (for example, "en-us")

    for the locale.


    See also `Class.Player.LocaleId`, the locale ID that a user has set for

    their Roblox account which is used for localizing in-experience content.

    This will be a different value when that player''s account locale isn''t

    supported for localizing Roblox UI content.

    '
