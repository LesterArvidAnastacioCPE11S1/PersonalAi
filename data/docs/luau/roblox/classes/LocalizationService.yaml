- name: LocalizationService.RobloxLocaleId
  summary: 'The locale ID used for localizing core and internal features.

    '
  description: 'This property shows the locale ID used for the localization of core
    and

    internal features such as `Class.CoreGui`. Returns a string with the two

    letter code (for example, `en-us`) for the locale.

    '
