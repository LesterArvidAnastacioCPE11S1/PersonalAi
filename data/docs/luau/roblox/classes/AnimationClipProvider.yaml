- name: AnimationClipProvider:GetClipEvaluatorAsync
  summary: 'Returns a `ClipEvaluator` for the `Class.AnimationClip` at the given

    content ID, loaded asynchronously.

    '
  description: 'Fetches the `Class.AnimationClip` at the specified `assetId` and returns
    a

    `ClipEvaluator` that wraps it. A `ClipEvaluator` samples the clip at an

    arbitrary time to produce an animation pose, so you can read animation

    data directly instead of playing it back through an `Class.Animator`.


    The `assetId` must be an animation asset on Roblox. Yields until the clip

    is loaded and should be wrapped in a `pcall`. Loads through the same path

    as

    `Class.AnimationClipProvider:GetAnimationClipAsync()|GetAnimationClipAsync`,

    at the local player animation priority.

    '
  code_samples: []
  parameters:
  - name: assetId
    type: ContentId
    default: null
    summary: 'The content ID of the animation to load.

      '
  returns:
  - type: ClipEvaluator
    summary: 'A `ClipEvaluator` that can sample the loaded `Class.AnimationClip`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Animation
- name: AnimationClipProvider:RegisterActiveAnimationClip
  summary: 'Generates a temporary asset ID from a `Class.AnimationClip` that can be

    used for localized testing of an animation.

    '
  description: 'Generates a temporary asset ID from a `Class.AnimationClip` that can
    be

    used for localized testing of an animation. This performs the same

    function as

    `Class.AnimationClipProvider:RegisterAnimationClip()|RegisterAnimationClip()`

    but generates an `active://` URL instead of a hash. The generated ID can

    be used as an `Class.Animation.AnimationId|AnimationId` property for

    testing.


    The asset ID generated by this function is temporary and cannot be used

    outside of Studio. Developers wishing to generate an asset ID that can be

    used online should upload the `Class.AnimationClip` to Roblox.

    '
  code_samples: []
  parameters:
  - name: animationClip
    type: AnimationClip
    default: null
    summary: 'The `Class.AnimationClip` to be used.

      '
  returns:
  - type: ContentId
    summary: 'A temporary asset ID generated for localized animation playback.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Animation
- name: AnimationClipProvider:RegisterAnimationClip
  summary: 'Generates a temporary asset ID from a `Class.AnimationClip` that can be

    used for localized testing of an animation. Generates a hash.

    '
  description: 'Generates a temporary asset ID from a `Class.AnimationClip` that can
    be

    used for localized testing of an animation.


    This function performs the same function to

    `Class.AnimationClipProvider:RegisterActiveAnimationClip()|RegisterActiveAnimationClip`

    yet generates a hash instead of an `active://` URL.


    The ID generated can be used for the `Class.Animation.AnimationId`

    property to test animations.


    The asset ID generated by this function is temporary and cannot be used

    outside of Studio. Developers wishing to generate an asset ID that can be

    used online should upload the `Class.AnimationClip` to Roblox.

    '
  code_samples: []
  parameters:
  - name: animationClip
    type: AnimationClip
    default: null
    summary: 'The `Class.AnimationClip` to be used.

      '
  returns:
  - type: ContentId
    summary: 'A temporary asset ID generated for localized animation playback.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Animation
