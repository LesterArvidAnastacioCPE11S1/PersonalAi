  deprecation_message: 'This function is deprecated and can lead to the game freezing
    until the

    animation is loaded. Developers are recommended to use

    `GetAnimationClipAsync` instead.

    '
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities:
  - Animation
- name: AnimationClipProvider:GetAnimationClipAsync
  summary: 'Returns a `Class.AnimationClip` based on the specified assetId

    asynchronously.

    '
  description: 'Fetches an `Class.AnimationClip` based on the specified assetId. The

    assetId must correspond to an animation asset in Roblox. The function will

    yield until the `Class.AnimationClip` is loaded from the website and

    should be wrapped in a `pcall`.

    '
  code_samples: []
  parameters:
  - name: assetId
    type: ContentId
    default: null
    summary: 'The content ID of the animation.

      '
  returns:
  - type: AnimationClip
    summary: 'The `Class.AnimationClip` found.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Animation
