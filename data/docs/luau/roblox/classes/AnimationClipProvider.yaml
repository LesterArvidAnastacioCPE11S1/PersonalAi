name: AnimationClipProvider
type: class
memory_category: Animation
summary: 'Provides functions to load and preview `Class.AnimationClip|AnimationClips`.

  '
description: "Provides functions to load and preview `Class.AnimationClip|AnimationClips`.\n\
  It includes a number of functions that are useful when working with an\n`Class.Animation`.\n\
  \nThe `Class.AnimationClipProvider` replaces the deprecated\n`Class.KeyframeSequenceProvider`\
  \ that was used to download `KeyframeSequences`\nby content ID.\n\nThe AnimationClipProvider\
  \ has a number of uses.\n\n- Download the `Class.AnimationClip` associated with\
  \ an animation content ID\n  from the Roblox website, regardless of the underlying\
  \ type of\n  `Class.AnimationClip` (`Class.KeyframeSequence` or `Class.CurveAnimation`).\n\
  - Generate a temporary ID to locally preview an animation.\n- Fetch the content\
  \ IDs of animations owned by a particular user.\n"
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: ''
