- name: AnimationClipProvider:GetAnimations
  summary: 'This function returns an `Class.InventoryPages` object which can be used

    to iterate over animations owned by a specific user.

    '
  description: 'This function returns an `Class.InventoryPages` object which can be
    used

    to iterate over animations owned by a specific user. It yields until the

    first page of results is loaded from the website. The `userId` must be a

    positive number; otherwise the call errors.


    This function is deprecated. Use

    `Class.AnimationClipProvider:GetAnimationsAsync()|GetAnimationsAsync`

    instead, which behaves identically.

    '
  code_samples: []
  parameters:
  - name: userId
    type: User
    default: null
    summary: 'The user ID of the user.

