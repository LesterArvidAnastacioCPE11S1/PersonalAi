- name: TextFilterResult:GetChatForUserAsync
  summary: 'Returns the text in a properly filtered manner for the specified

    `Class.Player.UserId`.

    '
  description: "This method returns the text in a properly filtered manner for the\n\
    specified `Class.Player.UserId` using the least restrictive filtering\nappropriate\
    \ for that user, with `Class.Chat` privacy settings of both\nusers enforced. This\
    \ should be used in the context of chats between\nplayers, although there are\
    \ some other cases where text filtering is\nrequired.\n\nThe returned string should\
    \ only be shown to the target user, as it might\nnot be appropriate for all users.\n\
    \nIf this method throws an error, the string should **not** be displayed to\n\
    the user. Cases for error include:\n\n- The two users are not allowed to chat,\
    \ for example if\n  `Class.Chat:CanUserChatAsync()` would return `false` for the\
    \ given\n  sender and receiver.\n- The user with the ID `toUserId` is not online\
    \ on the current server.\n\nThis function will return immediately in most cases,\
    \ although it will\nyield if the target user has just joined the server and their\
    \ filtering\ninfo is not yet loaded.\n"
  code_samples: []
  parameters:
  - name: toUserId
    type: int64
    default: null
    summary: '`Class.Player.UserId` of the user being chatted.

      '
  returns:
  - type: string
    summary: 'Filtered text string.

      '
  tags:
  - Yields
  - Deprecated
  deprecation_message: 'This method is deprecated and returns an empty string. Text
    filtering

    pertaining to chat should be done through `Class.TextChatService`, and

    experiences that do not properly filter player-generated chat text may be

    subject to moderation.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
- name: TextFilterResult:GetNonChatStringForBroadcastAsync
  summary: 'Returns the text in a properly filtered manner for all users.

    '
  description: 'Returns the text in a properly filtered manner for all users. This
    should

    be used in the context of non-chat text that every user can see, such as

    for a dialog that lets a user write a message on a sign, visible to all

    users on the server even after the author has left.

    '
  code_samples: []
  parameters: []
  returns:
  - type: string
    summary: 'Filtered text string.

