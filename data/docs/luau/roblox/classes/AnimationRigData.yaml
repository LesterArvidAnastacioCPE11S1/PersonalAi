name: AnimationRigData
type: class
memory_category: Instances
summary: 'Used to store information regarding the model an animation was authored
  for.

  '
description: 'An AnimationRigData instance commonly appears in the Data Model as a
  child of

  an AnimationClip. It is used to store information regarding the source rig an

  animation was authored for. It is currently only used for AnimationClips

  authored on

  [R15 rigs](../../../avatar/character-bodies/specifications.md#rigging).

  '
