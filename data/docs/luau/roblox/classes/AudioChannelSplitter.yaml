name: AudioChannelSplitter
type: class
memory_category: Internal
summary: 'Splits an audio stream into component channels so that each can be processed

  independently.

  '
description: '`Class.AudioChannelSplitter` splits an audio stream into component channels
  so

  that each can be processed independently. It provides one **Input** pin, one

  combined **Output** pin, as well as the following secondary output pins, all

  of which can be connected to/from by `Class.Wire|Wires`: **Left**, **Right**,

  **Center**, **SurroundLeft**, **SurroundRight**, **Sub**, **BackLeft**,

  **BackRight**, **TopLeft**, **TopRight**, **TopBackLeft**, and

  **TopBackRight**.


  <img src="/assets/engine-api/enums/AudioChannelLayout/Surround_7_1_4.jpg" width="810"
  alt="Diagram showing position of all potential channels." />

  '
code_samples:
- audio-wiring---splitting-mixing
inherits:
- Instance
descendants: []
tags: []
deprecation_message: ''
properties:
- name: AudioChannelSplitter.Layout
  summary: 'Controls the input channel layout to be split from.

    '
  description: "Controls the input channel layout to be split from. When changed,\
    \ all\naudio streams prior to this channel splitter's input may need to be\nup-mixed\
    \ (widened to at least as many channels as the input requires).\n\nThe **Output**\
    \ pin produces a copy of the stream wired to **Input** but,\ndepending on the\
    \ value of `Class.AudioChannelSplitter.Layout`:\n\n- For `Enum.AudioChannelLayout.Mono|Mono`,\
    \ the **Center** pin produces an\n  audio stream.\n- For `Enum.AudioChannelLayout.Stereo|Stereo`,\
    \ the **Left** and **Right**\n  pins produce audio streams.\n- For `Enum.AudioChannelLayout.Quad|Quad`,\
    \ the **Left**, **Right**,\n  **BackLeft**, and **BackRight** pins produce audio\
    \ streams.\n- `Enum.AudioChannelLayout.Surround_5|Surround_5` is the same as `Quad`,\n\
    \  plus **Center** produces an audio stream.\n- `Enum.AudioChannelLayout.Surround_5_1|Surround_5_1`\
    \ is the same as\n  `Surround_5`, plus **Sub** produces an audio stream.\n- `Enum.AudioChannelLayout.Surround_7_1|Surround_7_1`\
    \ is the same as\n  `Surround_5_1`, plus **SurroundLeft** and **SurroundRight**\
    \ produce\n  audio streams.\n- For `Enum.AudioChannelLayout.Surround_7_1_4|Surround_7_1_4`,\
    \ all\n  secondary output pins produce audio streams.\n"
