    \ body part size limits, attachment positions, and more.\n\nThe returned dictionary\
    \ of validation rules takes the following form:\n\n```\n{\n\t[\"MeshRules\"] =\
    \ {\n\t\t[\"BodyPartMaxTriangles\"] = {\n\t\t\tEnum.AssetType.DynamicHead: number,\n\
    \t\t\tEnum.AssetType.LeftArm: number,\n\t\t\tEnum.AssetType.RightArm: number,\n\
    \t\t\tEnum.AssetType.Torso: number,\n\t\t\tEnum.AssetType.LeftLeg: number,\n\t\
    \t\tEnum.AssetType.RightLeg: number,\n\t\t},\n\t\t\t[\"AccessoryMaxTriangles\"\
    ]: number,\n\t\t\t[\"MeshVertColor\"]: Color3,\n\t\t\t[\"CageMeshMaxDistanceFromRenderMesh\"\
    ]: number,\n\t},\n\t[\"TextureRules\"] = {\n\t\t[\"MaxTextureSize\"]: number,\n\
    \t},\n\t[\"BodyPartRules\"] = {\n\t\t[Enum.AssetType.DynamicHead] = {\n\t\t\t\
    [\"Bounds\"] = {\n\t\t\t\t[\"Classic\"] = {\n\t\t\t\t\t[\"MinSize\"]: Vector3,\n\
    \t\t\t\t\t[\"MaxSize\"]: Vector3,\n\t\t\t},\n\t\t\t\t[\"ProportionsSlender\"]\
    \ = {\n\t\t\t\t\t[\"MinSize\"]: Vector3,\n\t\t\t\t\t[\"MaxSize\"]: Vector3,\n\t\
    \t\t\t},\n\t\t\t\t[\"ProportionsNormal\"] = {\n\t\t\t\t\t[\"MinSize\"]: Vector3,\n\
    \t\t\t\t\t[\"MaxSize\"]: Vector3,\n\t\t\t\t},\n\t\t\t},\n\t\t\t[\"SubParts\"]\
    \ = {\n\t\t\t\t[\"Head\"] = {\n\t\t\t\t\t[\"NeckRigAttachment\"] = {\n\t\t\t\t\
    \t\t[\"LowerBound\"]: Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\
    \t\t},\n\t\t\t\t\t[\"FaceFrontAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"]:\
    \ Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t\t[\"\
    HatAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"]: Vector3,\n\t\t\t\t\t\t[\"\
    UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t\t[\"HairAttachment\"] = {\n\t\t\
    \t\t\t\t[\"LowerBound\"]: Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\t\
    \t\t\t\t},\n\t\t\t\t\t[\"FaceCenterAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"\
    ]: Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t},\n\
    \t\t\t},\n\t\t},\n\t\t[Enum.AssetType.LeftArm] = {\n\t\t\t[\"Bounds\"] = {\n\t\
    \t\t\t[\"Classic\"] = {\n\t\t\t\t\t[\"MinSize\"]: Vector3,\n\t\t\t\t\t[\"MaxSize\"\
    ]: Vector3,\n\t\t\t\t},\n\t\t\t\t[\"ProportionsSlender\"] = {\n\t\t\t\t\t[\"MinSize\"\
    ]: Vector3,\n\t\t\t\t\t[\"MaxSize\"]: Vector3,\n\t\t\t\t},\n\t\t\t\t[\"ProportionsNormal\"\
    ] = {\n\t\t\t\t\t[\"MinSize\"]: Vector3,\n\t\t\t\t\t[\"MaxSize\"]: Vector3,\n\t\
    \t\t\t},\n\t\t\t},\n\t\t\t[\"SubParts\"] = {\n\t\t\t\t[\"LeftHand\"] = {\n\t\t\
    \t\t\t[\"LeftWristRigAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"]: Vector3,\n\
    \t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t\t[\"LeftGripAttachment\"\
    ] = {\n\t\t\t\t\t\t[\"LowerBound\"]: Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\
    \t\t\t\t\t},\n\t\t\t\t},\n\t\t\t\t[\"LeftUpperArm\"] = {\n\t\t\t\t\t[\"LeftShoulderRigAttachment\"\
    ] = {\n\t\t\t\t\t\t[\"LowerBound\"]: Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\
    \t\t\t\t\t},\n\t\t\t\t\t[\"LeftShoulderAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"\
    ]: Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t\t\t\
    [\"LeftElbowRigAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"]: Vector3,\n\t\t\
    \t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t},\n\t\t\t\t[\"LeftLowerArm\"\
    ] = {\n\t\t\t\t\t[\"LeftElbowRigAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"\
    ]: Vector3,\n\t\t\t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t\t\
    [\"LeftWristRigAttachment\"] = {\n\t\t\t\t\t\t[\"LowerBound\"]: Vector3,\n\t\t\
    \t\t\t\t[\"UpperBound\"]: Vector3,\n\t\t\t\t\t},\n\t\t\t\t},\n\t\t\t},\n\t\t},\n\
    \t\t...\n\t},\n\t[\"AccessoryRules\"] = {\n\t\t[Enum.AssetType.HairAccessory]\
    \ = {\n\t\t\t[\"Attachments\"] = {\n\t\t\t\t{\n\t\t\t\t\t[\"Size\"]: Vector3,\n\
    \t\t\t\t\t[\"Offset\"]: Vector3,\n\t\t\t\t\t[\"Name\"]: string,\n\t\t\t\t},\n\t\
    \t\t},\n\t\t\t[\"RigidAllowed\"]: boolean,\n\t\t},\n\t\t...\n      \t},\n    \
    \    [\"MakeupRules\"] = {\n\t\t[\"ReferenceCageMeshId\"]: number,\n\t\t[\"WrapTextureTransferUVBounds\"\
    ] = {\n\t\t\t[\"MinBound\"]: Vector2,\n            \t\t[\"MaxBound\"]: Vector2,\n\
    \          \t},\n          \t[\"ExcludeUVBounds\"] = {\n            \t\t[Enum.AssetType.FaceMakeup]\
    \ = {\n              \t\t\t[\"LeftEye\"] = {\n                \t\t\t[\"MinBound\"\
    ]: Vector2,\n                \t\t\t[\"MaxBound\"]: Vector2,\n              \t\t\
    \t},\n              \t\t\t[\"RightEye\"] = {\n                \t\t\t[\"MinBound\"\
    ]: Vector2,\n                \t\t\t[\"MaxBound\"]: Vector2,\n              \t\t\
    \t},\n              \t\t\t[\"Lips\"] = {\n                \t\t\t[\"MinBound\"\
    ]: Vector2,\n                \t\t\t[\"MaxBound\"]: Vector2,\n              \t\t\
    \t},\n            \t\t},\n          \t},\n          \t[\"IncludeUVBounds\"] =\
    \ {\n\t\t\t[Enum.AssetType.LipMakeup] = {\n\t\t\t\t[\"MinBound\"]: Vector2,\n\t\
    \t\t\t[\"MaxBound\"]: Vector2,\n\t\t    \t},\n\t\t    \t[Enum.AssetType.EyeMakeup]\
    \ = {\n\t\t      \t\t[\"MinBound\"]: Vector2,\n\t\t      \t\t[\"MaxBound\"]: Vector2,\n\
    \t\t    \t},\n          \t}\n\t}\n}\n```\n"
  code_samples: []
