- name: AvatarCreationService:LoadGeneratedAvatarAsync
  summary: 'Loads a generated avatar using an avatar generation ID.

    '
  description: 'Loads a generated avatar using an avatar generation ID, as returned
    by

    `Class.AvatarCreationService:AutoSetupAvatarAsync()|AutoSetupAvatarAsync()`

    or

    `Class.AvatarCreationService:GenerateAvatarAsync()|GenerateAvatarAsync()`.

    The generated avatar will be returned as a `Class.HumanoidDescription`

    with all the generated instances and properties. Mesh and texture assets

    will be provided as `Class.EditableMesh` and `Class.EditableImage`

    objects, respectively, to allow continued editing of the generated avatar.


    This method can be called on both the server and client, allowing the

    generated avatar to be loaded in both places (on the client for

    previewing, and on the server for saving the generated avatar to the

    player''s inventory using

    `Class.AvatarCreationService:PromptCreateAvatarAsync()|PromptCreateAvatarAsync()`).

    Once the method has been invoked on both the client and server, the data

    associated with the generation ID will be erased and subsequent calls to

    his method with the same generation ID will fail.


    **Note**: this API requires the `Enable Mesh / Image APIs` setting to be

    turned on under Content Settings for your experience.

    '
  code_samples:
  - AvatarCreationService-LoadGeneratedAvatarAsync
  parameters:
  - name: generationId
    type: string
    default: null
    summary: 'A unique string that identifies the generated avatar, as returned by

      `Class.AvatarCreationService:AutoSetupAvatarAsync()|       AutoSetupAvatarAsync()`.

      '
  returns:
  - type: HumanoidDescription
    summary: 'The `Class.HumanoidDescription` of the generated avatar, which

      includes all the generated instances and properties.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
- name: AvatarCreationService:PrepareAvatarForPreviewAsync
  summary: 'Prepares in-experience avatar for preview.

    '
  description: 'Triggers HSR generation and attachment point updating for in-experience

    avatar previews. This allows for previewing of avatars created in

    experience with layered clothing and accessories in the same way they will

    appear when published through

    `Class.AvatarCreationService:PromptCreateAvatarAsync()|PromptCreateAvatarAsync()`.


    When developers use `Class.EditableMesh` and `Class.WrapDeformer` to

    modify avatars before publishing, the original HSR data may not accurately

    account for the new deformations. This method generates updated HSR data

    and corrects attachment points based on the `Class.WrapDeformer`

    modifications, ensuring consistent preview and published avatar

    appearance.

    '
  code_samples: []
  parameters:
  - name: humanoidModel
    type: Model
    default: null
    summary: 'The `Class.Model` containing `Class.MeshPart` children with

      `Class.WrapDeformer` instances that require HSR data updating for

      preview.

      '
  returns:
  - type: ()
    summary: 'void

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AvatarAppearance
- name: AvatarCreationService:PromptCreateAvatarAssetAsync
  summary: 'Prompts a `Class.Player` to purchase and create an avatar asset from an

    `Class.Instance`.

    '
  description: 'Prompts a `Class.Player` to purchase and create an avatar asset from
    an

    `Class.Instance`. The price of the creation is dictated by the price

    attributed to the avatar creation token. This creation token is required

    for the purchasing and creation of the asset and can be generated by

    following the

    [token creation](../../../production/monetization/avatar-creation-token.md)

    process.


    For accessory creation, the `Class.Instance` is expected to include a new

    accessory to be created. This includes the following types:

    `Enum.AvatarAssetType.Hat|Hat`, `Enum.AvatarAssetType.HairAccessory|Hair`,

    `Enum.AvatarAssetType.FaceAccessory|FaceAccessory`,

    `Enum.AvatarAssetType.NeckAccessory|NeckAccessory`,

    `Enum.AvatarAssetType.ShoulderAccessory|ShoulderAccessory`,

    `Enum.AvatarAssetType.FrontAccessory|FrontAccessory`,

    `Enum.AvatarAssetType.BackAccessory|BackAccessory`,

    `Enum.AvatarAssetType.WaistAccessory|WaistAccessory`,

    `Enum.AvatarAssetType.TShirtAccessory|TShirtAccessory`,

    `Enum.AvatarAssetType.ShirtAccessory|ShirtAccessory`,

    `Enum.AvatarAssetType.PantsAccessory|PantsAccessory`,

    `Enum.AvatarAssetType.JacketAccessory|JacketAccessory`,

    `Enum.AvatarAssetType.SweaterAccessory|SweaterAccessory`,

    `Enum.AvatarAssetType.ShortsAccessory|ShortsAccessory`,

    `Enum.AvatarAssetType.DressSkirtAccessory|DressSkirtAccessory`,

    `Enum.AvatarAssetType.EyebrowAccessory|EyebrowAccessory`, and

    `Enum.AvatarAssetType.EyelashAccessory|EyelashAccessory`.


    To support this, the `Class.Instance` should be an `Class.Accessory`

    instance or contain an `Class.Accessory` child instance. This should

    include a `Class.MeshPart` child instance which makes up the accessory.


    The avatar asset `Class.MeshPart` will also need to include:


    - An `Class.EditableImage`.

    - An `Class.EditableMesh`.


    If creating a layered clothing accessory such as a shirt, the

    `Class.MeshPart` should include a `Class.WrapDeformer` with an

    `Class.EditableMesh`.


    This method also supports `Enum.AvatarAssetType.FaceMakeup|FaceMakeup`,

    `Enum.AvatarAssetType.LipMakeup|LipMakeup`, and

    `Enum.AvatarAssetType.EyeMakeup|EyeMakeup`. For these types,

    `assetInstance` must be a `Class.Decal` whose `Class.Decal.TextureContent`

    references an `Class.EditableImage`, with exactly one

    `Class.WrapTextureTransfer` child. The accessory and MeshPart requirements

    above do not apply to these types.


    Finally, the provided `Enum.AvatarAssetType` should match the creation

    type of the token and the type of asset for upload.

    '
  code_samples:
  - AvatarCreationService-PromptCreateAvatarAssetAsync
  parameters:
  - name: tokenId
    type: string
    default: null
    summary: 'The ID of a creation token. The token must be valid in that the

      universe the method is called from is the same universe the token was

      created for. Furthermore, the token creator must maintain ID

      verification and

      [Roblox Premium](https://www.roblox.com/premium/membership). To create

      a token for utilization in this API, follow the

      [token creation](../../../production/monetization/avatar-creation-token.md)

      process. The token''s creation type must match the

      `Enum.AvatarAssetType` passed in to the method.

      '
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` intended to be presented with the creation prompt.

      '
  - name: assetInstance
    type: Instance
    default: null
    summary: 'The `Class.Instance` of the avatar asset intended for creation.

      '
  - name: assetType
    type: AvatarAssetType
    default: null
    summary: 'The `Enum.AvatarAssetType` of the expected creation. This must match

      the creation type of the provided token.

      '
  returns:
  - type: Tuple
    summary: "A tuple containing, in order:\n\n- An `Enum.PromptCreateAssetResult`\
      \ indicating the result of the\n  creation prompt.\n\n- A string result. In\
      \ the case of\n  `Enum.PromptCreateAssetResult.Success`, this will indicate\
      \ the asset\n  ID. In the case of any failure enum, this will indicate the\n\
      \  resultant error message.\n"
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: AvatarCreationService:PromptCreateAvatarAsync
  summary: 'Prompts a `Class.Player` to purchase and create an avatar from a

    `Class.HumanoidDescription`.

    '
  description: "Prompts a `Class.Player` to purchase and create an avatar from a\n\
    `Class.HumanoidDescription`. The price of the creation is dictated by the\nprice\
    \ attributed to the avatar creation token. This avatar creation token\nis required\
    \ for the purchasing and creation of the body and can be\ngenerated by following\
    \ the\n[token creation](../../../production/monetization/avatar-creation-token.md)\n\
    process.\n\nFor avatar creation, the `Class.HumanoidDescription` is expected to\n\
    include new assets to be created for each of the 6 body parts\n(`Enum.BodyPart.Head|Head`,\
    \ `Enum.BodyPart.Torso|Torso`,\n`Enum.BodyPart.RightLeg|RightLeg`, `Enum.BodyPart.LeftLeg|LeftLeg`,\n\
    `Enum.BodyPart.RightArm|RightArm`, `Enum.BodyPart.LeftArm|LeftArm`).\nOptionally,\
    \ it can also include a new `Enum.AccessoryType.Hair|Hair`\naccessory.\n\nTo support\
    \ this, the `Class.HumanoidDescription` should include 6\n`Class.BodyPartDescription`\
    \ children (one for each body part). For each,\nthe `Class.BodyPartDescription.Instance`\
    \ property references a\n`Class.Folder` which includes all of the `Class.MeshPart`\
    \ instances which\nmake up the body part, for example a `LeftArm` folder which\
    \ has\n`LeftHand`, `LeftUpperArm`, and `LeftLowerArm` `Class.MeshPart|MeshParts`.\n\
    The `Class.BodyPartDescription.BodyPart` property should also be set to\nthe relevant\
    \ `Enum.BodyPart`.\n\nEach body part `Class.MeshPart` will also need to include:\n\
    \n- An `Class.EditableImage`.\n- A `Class.WrapDeformer` with an `Class.EditableMesh`.\n\
    \nIf including an accessory such as hair, the `Class.HumanoidDescription`\nshould\
    \ include a child `Class.AccessoryDescription` where:\n\n- The `Class.AccessoryDescription.Instance`\
    \ property references the\n  `Class.Accessory` instance.\n- The `Class.AccessoryDescription.AccessoryType`\
    \ property is set to the\n  relevant `Enum.AccessoryType`.\n\nFinally, the `Class.HumanoidDescription`\
    \ should include the humanoid\nscales of `Class.HumanoidDescription.BodyTypeScale|BodyTypeScale`,\n\
    `Class.HumanoidDescription.HeadScale|HeadScale`,\n`Class.HumanoidDescription.HeightScale|HeightScale`,\n\
    `Class.HumanoidDescription.WidthScale|WidthScale`, and\n`Class.HumanoidDescription.ProportionScale|ProportionScale`.\
    \ Be mindful of\nthe scales that a base body is imported with so that they match\
    \ the scales\nprovided to the `Class.HumanoidDescription`.\n"
