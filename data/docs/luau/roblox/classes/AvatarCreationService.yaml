- name: AvatarCreationService:PromptCreateMakeupAsync
  summary: 'Prompts a `Class.Player` to create and publish a makeup look from multiple

    makeup assets.

    '
  description: "Prompts a `Class.Player` to create and publish a makeup look from\
    \ two to\nsix makeup assets. For example, an in-experience creation tool can use\n\
    this method to let a player publish lip and face makeup together as a\nsingle\
    \ look. This method can only be called from the server and yields\nuntil the operation\
    \ completes.\n\nEach asset requires a creation token for its asset type and the\
    \ current\nexperience. See the\n[token creation](../../../production/monetization/avatar-creation-token.md)\n\
    process. The input entries are checked before the prompt opens. Creation\ntoken\
    \ and user-generated content validation run while the prompt is\nloading; the\
    \ player can proceed with creation after validation succeeds.\n\nFor `FaceMakeup`,\
    \ `LipMakeup`, and `EyeMakeup`, the asset instance must be\na `Class.Decal` whose\
    \ `Class.Decal.TextureContent` references an\n`Class.EditableImage`, with exactly\
    \ one `Class.WrapTextureTransfer` child.\n\nThe overall `Enum.PromptCreateOutfitResult`\
    \ describes creation of the\nlook:\n\n- `Enum.PromptCreateOutfitResult.Success|Success`\
    \ means all submitted\n  assets and the makeup look were created.\n- `Enum.PromptCreateOutfitResult.PartialSuccess|PartialSuccess`\
    \ means at\n  least one asset was created, but another asset or the makeup look\n\
    \  composition failed. If the look was created, the second return value is\n \
    \ its outfit ID; if composition failed, it is an error message instead.\n- `Enum.PromptCreateOutfitResult.CreationFailure|CreationFailure`\
    \ means no\n  assets were created, so no makeup look was created.\n\nInspect the\
    \ per-asset results to determine which assets were created. Each\nentry contains\
    \ `Enum.PromptCreateAssetResult.Success|Success` and an asset\nID, or `Enum.PromptCreateAssetResult.UploadFailed|UploadFailed`\
    \ without an\nasset ID. If a failure occurs before asset uploads, the results\
    \ array may\nbe empty.\n\nFor `Enum.PromptCreateOutfitResult.PermissionDenied|PermissionDenied`,\n\
    `Enum.PromptCreateOutfitResult.Timeout|Timeout`, and\n`Enum.PromptCreateOutfitResult.NoUserInput|NoUserInput`,\
    \ only the result\nenum is returned; variables assigned to the other return values\
    \ receive\n`nil`.\n\nThis method can raise an error for invalid input, request\
    \ throttling, or\nunexpected failures. Validation failures may raise an error\
    \ or return\n`Enum.PromptCreateOutfitResult.UGCValidationFailed|UGCValidationFailed`\n\
    with an error message and an empty per-asset results array. Use `pcall()`\nto\
    \ handle errors as well as checking the returned result enum.\n"
  code_samples: []
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` who receives the creation prompt and owns the

      uploaded makeup look.

      '
  - name: makeupAssetEntries
    type: Array
    default: null
    summary: "An array containing between two and six asset-entry dictionaries. Each\n\
      dictionary contains:\n\n- `TokenId` (string) – The ID of a creation token valid\
      \ for the\n  current experience and the entry's `AvatarAssetType`.\n- `Instance`\
      \ (`Class.Instance`) – The makeup asset instance to upload.\n- `AvatarAssetType`\
      \ (`Enum.AvatarAssetType`) – The asset type.\n  Supported types are `Enum.AvatarAssetType.FaceMakeup|FaceMakeup`,\n\
      \  `Enum.AvatarAssetType.LipMakeup|LipMakeup`,\n  `Enum.AvatarAssetType.EyeMakeup|EyeMakeup`,\n\
      \  `Enum.AvatarAssetType.EyebrowAccessory|EyebrowAccessory`, and\n  `Enum.AvatarAssetType.EyelashAccessory|EyelashAccessory`.\n\
      - `SortOrder` (number) – The asset's ordering within the makeup look.\n"
  - name: thumbnailHeadColor
    type: Color3?
    default: nil
    summary: 'Optional `Datatype.Color3` for the head in the makeup look thumbnail.

      If omitted, the default gray head color is used.

      '
  returns:
  - type: Tuple
    summary: "A tuple containing, in order:\n\n- An `Enum.PromptCreateOutfitResult`\
      \ indicating the overall creation\n  outcome.\n\n- A string containing the outfit\
      \ ID when the makeup look is created,\n  or an error message otherwise. This\
      \ value is not returned for\n  `PermissionDenied`, `Timeout`, or `NoUserInput`.\n\
      \n- An array of per-asset result dictionaries in the same order as the\n  input\
      \ entries. Each dictionary contains `Result`\n  (`Enum.PromptCreateAssetResult`)\
      \ and, for successfully created\n  assets, `AssetId` (string). This value is\
      \ not returned for\n  `PermissionDenied`, `Timeout`, or `NoUserInput`.\n"
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - AssetCreateUpdate
  - Monetization
- name: AvatarCreationService:PromptSelectAvatarGenerationImageAsync
  summary: 'Prompt the `Class.Player` to take a selfie and return the FileId.

    '
  description: "Prompt the `Class.Player` to take a selfie and return the FileId of\
    \ the\nselfie. This FileId is then passed as an argument to\n`Class.AvatarCreationService:GenerateAvatar2DPreviewAsync()|GenerateAvatar2DPreviewAsync()`.\n\
    This API can only be used on the game server.\n\n```lua\nlocal AvatarCreationService\
    \ = game:GetService(\"AvatarCreationService\")\n\nfunction promptSelectAvatarGenerationImage(player)\n\
    \    local pcallSuccess, result = pcall(function()\n        return AvatarCreationService:PromptSelectAvatarGenerationImageAsync(player)\n\
    \    end)\n\n    if not pcallSuccess then\n        errName, errDesc = unpack(string.split(result,\
    \ \": \"))\n        if errName == \"SelfieConsentDenied\" then\n            warn(\"\
    Player must accept consent to use feature.\")\n        else\n            warn(\"\
    Failed to prompt for image: \", errDesc)\n        end\n    end\n\n    return result\n\
    end\n```\n\nOn failure, the result string has the format\n`ErrorName: Error description`,\
    \ allowing the error type to be identified\nprogrammatically.\n\n<table>\n<thead>\n\
    \  <tr>\n    <th>Error name</th>\n    <th>Error description</th>\n  </tr>\n</thead>\n\
    <tbody>\n  <tr>\n    <td>`SelfieConsentDenied`</td>\n    <td>Selfie consent not\
    \ accepted</td>\n  </tr>\n  <tr>\n    <td>`QRTooManyRequests`</td>\n    <td>Failure\
    \ to generate QR url due to too many requests; please wait and try again later</td>\n\
    \  </tr>\n  <tr>\n    <td>`MediaPermissionsDenied`</td>\n    <td>Permissions not\
    \ granted for taking photo</td>\n  </tr>\n  <tr>\n    <td>`FeatureUnavailable`</td>\n\
    \    <td>Feature not available for player</td>\n  </tr>\n  <tr>\n    <td>`GenerationInProgress`</td>\n\
    \    <td>Generation already in progress for player</td>\n  </tr>\n</tbody>\n</table>\n"
  code_samples: []
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` to prompt for taking a selfie.

      '
  returns:
  - type: string
    summary: 'A string FileId of the selfie on success, or an error string

      describing the reason for failure.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - SensitiveInput
- name: AvatarCreationService:RequestAvatarGenerationSessionAsync
  summary: 'Request an AvatarGeneration session for a `Class.Player`.

    '
  description: 'Request an AvatarGeneration session for a `Class.Player`. Information

    about the session is returned via the callback, including the SessionId

    which is passed to the

    `Class.AvatarCreationService:GenerateAvatar2DPreviewAsync()|GenerateAvatar2DPreviewAsync()`

    and

    `Class.AvatarCreationService:GenerateAvatarAsync()|GenerateAvatarAsync()`

    methods. Additional session information includes allowed 2d preview

    generations, allowed 3d avatar generations, and the session time. The

    method returns a `Tuple` with an `Datatype.RBXScriptConnection` and

    estimated `waitTime`. The `Datatype.RBXScriptConnection` allows canceling

    a session request. The estimated `waitTime` is used to provide the player

    an estimated time in seconds until the session will be ready. This API can

    only be used on the game server.

    '
  code_samples:
  - AvatarCreationService-RequestAvatarGenerationSessionAsync
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` to request an AvatarGeneration session for.

      '
  - name: callback
    type: Function
    default: null
    summary: 'Callback function that is invoked with a SessionInfo table, with

      information about the session. Type:

      `(SessionInfo: { SessionId: string, Allowed2DGenerations: number, Allowed3DGenerations:
      number, SessionTime: number }) -> ()`

      '
  returns:
  - type: Tuple
    summary: 'A tuple containing a `Datatype.RBXScriptConnection` that can be used

      to cancel the session request and the estimated wait time in seconds.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
