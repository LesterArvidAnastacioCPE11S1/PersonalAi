events:
- name: AvatarCreationService.AvatarAssetModerationCompleted
  summary: 'Fires when an in-experience-created avatar asset''s moderation status
    has

    been updated from pending.

    '
  description: 'Fires when an in-experience-created avatar asset''s moderation status
    has

    been updated from pending. This event provides a streamlined way to know

    when an avatar asset created through

    `Class.AvatarCreationService:PromptCreateAvatarAssetAsync()|PromptCreateAvatarAssetAsync()`

    has completed the moderation process and is ready for use in-experience.


    Note that this event only fires for avatar assets created within the

    current experience and will trigger when the `Enum.ModerationStatus`

    changes from `Enum.ModerationStatus.NotReviewed|NotReviewed` to any other

    status. The event fires on the client only.

    '
  code_samples:
  - AvatarCreationService-AvatarAssetModerationCompleted
  parameters:
  - name: assetId
    type: int64
    default: null
    summary: 'The asset ID of the asset that has completed moderation.

      '
  - name: moderationStatus
    type: ModerationStatus
    default: null
    summary: 'The final `Enum.ModerationStatus` result after moderation completed.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - DynamicGeneration
- name: AvatarCreationService.AvatarModerationCompleted
  summary: 'Fires when an in-experience-created avatar''s moderation status has been

    updated from pending.

    '
  description: 'Fires when an in-experience-created avatar''s moderation status has
    been

    updated from pending. This event provides a streamlined way to know when

    an avatar created through

    `Class.AvatarCreationService:PromptCreateAvatarAsync()|PromptCreateAvatarAsync()`

    has completed the moderation process and is ready for use in-experience.


    Note that this event only fires for avatars created within the current

    experience and will trigger when the `Enum.ModerationStatus` changes from

    `Enum.ModerationStatus.NotReviewed|NotReviewed` to any other status. The

    event fires on the client only.

    `Class.AvatarEditorService:GetOutfitDetailsAsync|GetOutfitDetailsAsync`

    can be used on the server to verify the current moderation status if

    needed.

    '
  code_samples: []
  parameters:
  - name: outfitId
    type: int64
    default: null
    summary: 'The outfit ID of the avatar that has completed moderation.

      '
  - name: moderationStatus
    type: ModerationStatus
    default: null
    summary: 'The final `Enum.ModerationStatus` result after moderation completion.

      '
  tags: []
  deprecation_message: 'This event is deprecated. Use

    `Class.AvatarCreationService.AvatarOutfitModerationCompleted` instead; the

    replacement event supports avatar outfits and other in-experience-created

    outfit types.

    '
  security: None
  capabilities:
  - DynamicGeneration
- name: AvatarCreationService.AvatarOutfitModerationCompleted
  summary: 'Fires on the client when moderation completes for an in-experience-created

    outfit.

    '
  description: 'Fires on the client when an in-experience-created outfit''s moderation

    status changes from `Enum.ModerationStatus.NotReviewed|NotReviewed` to

    another status. Use this event for any in-experience-created outfit type.

    Current outfit creation flows include

    `Class.AvatarCreationService:PromptCreateAvatarAsync()|PromptCreateAvatarAsync()`.

    Future in-experience outfit types will use this event as well

    (`Class.AvatarCreationService.AvatarModerationCompleted|AvatarModerationCompleted`

    is deprecated).


    Use `outfitType` to determine the kind of outfit that completed

    moderation. This event is informational: an outfit cannot be used until

    its moderation status permits it.

    '
  code_samples: []
  parameters:
  - name: outfitId
    type: int64
    default: null
    summary: 'The outfit ID of the outfit that has completed moderation.

      '
  - name: moderationStatus
    type: ModerationStatus
    default: null
    summary: 'The final `Enum.ModerationStatus` result after moderation completion.

      '
  - name: outfitType
    type: OutfitType
    default: null
    summary: 'The `Enum.OutfitType` of the moderated outfit.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - DynamicGeneration
