events:
- name: LogService.MessageOut
  summary: 'Fires when the client outputs text.

    '
  description: "Fires whenever a message is logged through the engine's output system,\n\
    including calls to `Global.LuaGlobals.print()`,\n`Global.RobloxGlobals.warn()`,\
    \ and the structured logging methods on\n`Class.LogService`. The `message` parameter\
    \ contains the fully rendered\ntext (template placeholders already replaced).\
    \ The `context` parameter\ncarries the structured key-value pairs when the message\
    \ was emitted via a\nmethod that accepts a context table; otherwise it is nil.\n\
    \n```lua\nlocal LogService = game:GetService(\"LogService\")\n\nLogService.MessageOut:Connect(function(message,\
    \ messageType, context)\n\tif messageType == Enum.MessageType.MessageError then\n\
    \t\tprint(\"Error:\", message)\n\tend\n\tif context then\n\t\t-- Access structured\
    \ data from structured logging calls\n\t\tfor key, value in context do\n\t\t\t\
    print(key, \"=\", value)\n\t\tend\n\tend\nend)\n```\n"
  code_samples:
  - LogService-MessageOut1
  parameters:
  - name: message
    type: string
    default: null
    summary: 'The fully rendered message string after any template placeholder

      substitution.

      '
  - name: messageType
    type: MessageType
    default: null
    summary: 'A `Enum.MessageType` value indicating the severity level of the

      message.

      '
  - name: context
    type: Dictionary
    default: null
    summary: 'A dictionary of key-value pairs provided when the message was logged

      via a structured logging method (`Class.LogService:Output()`,

      `Class.LogService:Info()`, `Class.LogService:Warn()`, or

      `Class.LogService:Error()`), or nil if no context was supplied.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - Logging
