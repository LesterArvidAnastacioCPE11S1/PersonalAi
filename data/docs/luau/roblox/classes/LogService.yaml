name: LogService
type: class
memory_category: Instances
summary: 'A service that allows you to read outputted text.

  '
description: "`LogService` allows you to log structured log entries and read outputted\
  \ text.\nFor logging scoped to a named, hierarchical path, use\n`Class.LogService:GetLogger()`\
  \ to obtain a `Class.Logger`.\n\n#### Template Syntax\n\nMethods that accept a `context`\
  \ table support `{key}` template placeholders in\nthe message string. To include\
  \ a literal brace character in the output, use\ndouble braces: `{{` produces a literal\
  \ `{` and `}}` produces a literal `}`.\n\n```lua\nlocal LogService = game:GetService(\"\
  LogService\")\n\nLogService:Info(\"Value = {{result}}: {val}\", {val = 42})\n--\
  \ Output: \"Value = {result}: 42\"\n```\n\n#### Context Values\n\nThe `context`\
  \ table accepts any value type. Non-serializable values are\nautomatically converted\
  \ to strings in the stored context:\n\n- **Instances** are stored as their full\
  \ path (e.g.,\n  `\"Workspace.MyModel.Part\"`)\n- **Functions** are stored as `\"\
  <function>\"`\n- **Other non-primitive types** are stored using their `tostring()`\n\
  \  representation\n\nMixed tables (tables with both string and numeric keys) and\
  \ pure arrays are\naccepted. Numeric keys are converted to string keys (e.g., index\
  \ `1` becomes\nkey `\"1\"`). If a numeric key collides with an existing string key,\
  \ the\nexplicit string key takes precedence.\n\n```lua\nlocal LogService = game:GetService(\"\
  LogService\")\n\n-- Instance values are converted to their full path\nLogService:Info(\"\
  Touched {part}\", {part = workspace.MyPart})\n-- Context stores: {part = \"Workspace.MyPart\"\
  }\n\n-- Mixed tables are accepted; numeric keys become string keys\nLogService:Info(\"\
  Player {name}\", {name = \"Alice\", 1, 2, 3})\n-- Context stores: {name = \"Alice\"\
  , [\"1\"] = 1, [\"2\"] = 2, [\"3\"] = 3}\n```\n\n#### Warning\n\nThis service might\
  \ have unexpected or unreliable behavior and content might be\ntruncated. Don't\
  \ rely on contents of events and messages emitted by this\nservice for any important\
  \ game logic.\n"
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
deprecation_message: ''
