- name: LogService:Error
  summary: 'Logs a message at the `Enum.MessageType.MessageError` level and throws
    a

    structured error with optional context.

    '
  description: "Logs a message at the `Enum.MessageType.MessageError` level and throws\
    \ a\nstructured error with optional context. As this method always throws, use\n\
    `Global.LuaGlobals.pcall()` to catch the error. The thrown error is a\ntable with\
    \ `message`, `template`, `context`, and `stack` fields, and a\n`__tostring` metamethod\
    \ that returns the rendered message.\n\nWhen a `context` table is provided, template\
    \ placeholders like `{key}` in\nthe message are replaced with the corresponding\
    \ context values.\n\n```lua\nlocal LogService = game:GetService(\"LogService\"\
    )\n\nlocal ok, err = pcall(function()\n\tLogService:Error(\"Failed: {reason}\"\
    , {reason = \"timeout\"})\nend)\n-- ok is false\n-- err.message == \"Failed: timeout\"\
    \n-- err.context == {reason = \"timeout\"}\n-- tostring(err) == \"Failed: timeout\"\
    \n```\n"
  code_samples: []
  parameters:
  - name: message
    type: string
    default: null
    summary: 'The message string. Supports `{key}` template placeholders when a

      context table is provided.

      '
  - name: context
    type: Dictionary
    default: nil
    summary: 'An optional dictionary of key-value pairs. When provided, `{key}`

      placeholders in the message are replaced with the corresponding

      values.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Logging
- name: LogService:GetLogHistory
  summary: 'Returns a table of tables, each with the message string, message type,
    and

    timestamp of a message that the client displays in the **Output** window.

    '
  description: "Returns a table of tables, each with the message string, message type,\
    \ and\ntimestamp of a message that the client displays in the **Output** window.\n\
    Each inner table contains the following keys:\n\n- `message` (string) -- the rendered\
    \ message text.\n- `messageType` (`Enum.MessageType`) -- the log level (MessageOutput,\n\
    \  MessageInfo, MessageWarning, or MessageError).\n- `timestamp` (number) -- the\
    \ time the message was emitted, in seconds.\n- `context` (dictionary) -- the structured\
    \ key-value pairs if the message\n  was emitted via a structured logging method;\
    \ absent otherwise.\n\nThe history is capped at a maximum of 512 entries by default.\
    \ Calling\n`Class.LogService:ClearOutput()` empties the history, so subsequent\
    \ calls\nreturn only entries logged after the clear.\n"
  code_samples: []
  parameters: []
  returns:
  - type: Array
    summary: 'An array of tables, each containing `message` (string), `messageType`

      (`Enum.MessageType`), `timestamp` (number, in seconds), and optionally

      `context` (dictionary) for entries logged with structured context.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Logging
- name: LogService:GetLogHistoryAsync
  summary: 'Returns the log history of another participant''s client, or of the server,

    during a Team Test session.

    '
  description: "Returns the log history of a Team Test participant's client, or of\
    \ the\nTeam Test server. Each inner table contains the following keys:\n\n- `message`:\
    \ The rendered message text.\n- `messageType` (`Enum.MessageType`): The log level\n\
    \  (`Enum.MessageType|MessageOutput`, `Enum.MessageType|MessageInfo`,\n  `Enum.MessageType|MessageWarning`,\
    \ or `Enum.MessageType|MessageError`).\n- `timestamp`: The time the message was\
    \ emitted on the participant's\n  client or the server, in seconds.\n\nThe history\
    \ contains a maximum of the 512 most recent entries.\n\nThis method is only available\
    \ from a participant's client during a Team\nTest.\n\n```lua\nlocal LogService\
    \ = game:GetService(\"LogService\")\nlocal Players = game:GetService(\"Players\"\
    )\n\nfor _, player in Players:GetPlayers() do\n\tlocal ok, history = pcall(LogService.GetLogHistoryAsync,\
    \ LogService, player.User)\n\tif not ok then\n\t\twarn(`Couldn't read {player.Name}'s\
    \ logs: {history}`)\n\t\tcontinue\n\tend\n\tfor _, entry in history do\n\t\tif\
    \ entry.messageType == Enum.MessageType.MessageError then\n\t\t\tprint(`[{player.Name}]\
    \ {entry.message}`)\n\t\tend\n\tend\nend\n```\n"
  code_samples: []
  parameters:
  - name: user
    type: User
    default: null
    summary: 'The `Class.Player.User` of the Team Test participant whose log history

      to read. Pass `Datatype.User.fromId(0)` to read the Team Test server''s

      log history.

      '
  returns:
  - type: Array
    summary: 'An array of tables, each containing `message` (string), `messageType`

      (`Enum.MessageType`), and `timestamp` (number, in seconds), in the

      same format as `Class.LogService:GetLogHistory()`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Logging
- name: LogService:GetLogger
  summary: 'Returns a top-level `Class.Logger` with the given name, creating it if
    it

    does not already exist.

    '
  description: 'Returns the top-level logger with the given `name`, creating it if
    it does

    not already exist. Calling this with the same name repeatedly returns the

    same logger instance for as long as a reference to it is held. Use the

    returned `Class.Logger` to emit structured log entries scoped to a

    hierarchical path, and `Class.Logger:GetLogger()` to create nested child

    loggers.


    This method raises an error if the name is empty, contains a `.`, or

    contains control characters, or if the maximum number of live loggers has

    been exceeded.


    ```lua

    local LogService = game:GetService("LogService")


    local combat = LogService:GetLogger("Combat")

    combat:Info("Match started with {count} players", {count = 8})

    ```

    '
  code_samples: []
  parameters:
  - name: name
    type: string
    default: null
    summary: 'The name of the logger. Must be non-empty, must not contain a `.`

      character, and must not contain control characters.

      '
  returns:
  - type: Logger
    summary: 'A `Class.Logger` whose `Class.Logger.Name` and `Class.Logger.FullPath`

      both equal `name`.

      '
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Logging
