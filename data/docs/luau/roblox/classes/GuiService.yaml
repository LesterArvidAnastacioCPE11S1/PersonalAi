- name: GuiService.PreferredTextSize
  summary: 'Gets the player''s preferred text size as an `Enum.PreferredTextSize`

    value.

    '
  description: "Gets the player's preferred text size as an `Enum.PreferredTextSize`\
    \ value\nof `Enum.PreferredTextSize.Medium|Medium` (default),\n`Enum.PreferredTextSize.Large|Large`,\n\
    `Enum.PreferredTextSize.Larger|Larger`, or\n`Enum.PreferredTextSize.Largest|Largest`.\
    \ This property maps to the\n**Text&nbsp;Size** setting available to players from\
    \ the Roblox and\nin‑game **Settings** menus, and it can be combined with\n`Class.Object.GetPropertyChangedSignal()`\
    \ to detect text size setting\nchanges for purposes of adjusting UI.\n\nWhen working\
    \ with UI elements, note the following behaviors:\n\n- Text that is constrained\
    \ to a minimum and/or maximum size through a\n  `Class.UITextSizeConstraint` will\
    \ **not** shrink below or expand above\n  the set\n  `Class.UITextSizeConstraint.MinTextSize|MinTextSize`/`Class.UITextSizeConstraint.MaxTextSize|MaxTextSize`,\n\
    \  regardless of the player's text size setting.\n\n- When `Class.TextLabel.TextScaled|TextScaled`\
    \ is enabled for a\n  `Class.TextLabel.TextScaled|TextLabel` or\n  `Class.TextButton.TextScaled|TextButton`,\
    \ the element's text will\n  **not** be scaled by the\n  `Class.GuiService.PreferredTextSize|PreferredTextSize`\
    \ value.\n\n- UI elements with `Class.GuiObject.AutomaticSize|AutomaticSize` enabled\n\
    \  will shrink/grow as\n  `Class.GuiService.PreferredTextSize|PreferredTextSize`\n\
    \  decreases/increases (element bounds will resize to fit the resized\n  text).\n\
    \n- When `Class.TextLabel.TextWrapped|TextWrapped` is enabled for a\n  `Class.TextLabel.TextWrapped|TextLabel`\
    \ or\n  `Class.TextButton.TextWrapped|TextButton`, the element's text will wrap\n\
    \  to additional lines as\n  `Class.GuiService.PreferredTextSize|PreferredTextSize`\
    \ increases, within\n  limits of the element's absolute size.\n\n- The results\
    \ returned by `Class.TextService:GetTextSize()` and\n  `Class.TextService:GetTextBoundsAsync()`\
    \ honor changes related to\n  `Class.GuiService.PreferredTextSize|PreferredTextSize`.\n"
  code_samples:
  - GuiService-PreferredTextSize
  type: PreferredTextSize
  tags:
  - ReadOnly
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: false
    can_save: false
  capabilities:
  - UI
- name: GuiService.PreferredTransparency
  summary: 'Gets the player''s preferred transparency as a number between `0` and
    `1`.

    '
  description: 'Gets the player''s preferred transparency as a number between `0`
    and `1`.

    This property maps to the **Background&nbsp;Transparency** setting

    available to players from the Roblox and in‑experience **Settings** menus,

    and it can be combined with `Class.Object.GetPropertyChangedSignal()` to

    detect transparency setting changes for purposes of adjusting UI.


    A value of `1` (default) indicates the player prefers the default

    background transparency, while a value of `0` indicates the player prefers

    fully opaque (non‑transparent) background transparency for improved

    readability and contrast. Multiplying a UI element''s

    `Class.GuiObject.BackgroundTransparency|BackgroundTransparency` with

    `Class.GuiService.PreferredTransparency|PreferredTransparency` is the

    recommended approach, such that backgrounds become more opaque as

    `Class.GuiService.PreferredTransparency|PreferredTransparency` approaches

    `0`.

    '
  code_samples:
  - GuiService-PreferredTransparency
  type: float
  tags:
