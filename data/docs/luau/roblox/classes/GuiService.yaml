    viewport.

    '
  description: 'Read-only property which represents the physical rendering size of
    the

    viewport:


    - `Enum.DisplaySize.Small` — Most tablet/mobile/handheld devices

    - `Enum.DisplaySize.Medium` — Most laptops and monitors

    - `Enum.DisplaySize.Large` — Most TVs or larger


    You can listen for changes to this property through the

    `Class.Object:GetPropertyChangedSignal()|GetPropertyChangedSignal()`

    method to adapt UI to various display sizes.

    '
