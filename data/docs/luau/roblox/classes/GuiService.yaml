- name: GuiService:SendNotification
  summary: 'Displays a notification described by `notificationInfo` and returns a

    unique identifier for it.

    '
  description: "Displays a notification built from the `notificationInfo` dictionary\
    \ using\nRoblox's native notification UI, and returns a unique identifier string\n\
    for the notification. The following fields of `notificationInfo` are\nrecognized:\n\
    \n<table>\n<thead>\n  <tr>\n  \t<th>Field</th>\n  \t<th>Type</th>\n  \t<th>Description</th>\n\
    \  </tr>\n</thead>\n<tbody>\n  <tr>\n  \t<td><code>Title</code></td>\n  \t<td><code>string</code></td>\n\
    \  \t<td>The notification's title text.</td>\n  </tr>\n  <tr>\n  \t<td><code>Text</code></td>\n\
    \  \t<td><code>string</code></td>\n  \t<td>The notification's body text.</td>\n\
    \  </tr>\n  <tr>\n  \t<td><code>Icon</code></td>\n  \t<td><code>string</code></td>\n\
    \  \t<td>An image asset to display with the notification.</td>\n  </tr>\n  <tr>\n\
    \  \t<td><code>Buttons</code></td>\n  \t<td><code>{[ButtonInfo]}</code></td>\n\
    \  \t<td>An array of button definitions. Each entry is a table with a <code>Text</code>\
    \ (<code>string</code>), a <code>ButtonType</code> (<code>Enum.NotificationButtonType</code>),\
    \ and an <code>OnActivated</code> (<code>function</code>) callback invoked when\
    \ the button is pressed.</td>\n  </tr>\n  <tr>\n  \t<td><code>OnDisplay</code></td>\n\
    \  \t<td><code>function</code></td>\n  \t<td>Invoked when the notification is\
    \ shown.</td>\n  </tr>\n  <tr>\n  \t<td><code>OnDismiss</code></td>\n  \t<td><code>function</code></td>\n\
    \  \t<td>Invoked when the notification is dismissed.</td>\n  </tr>\n</tbody>\n\
    </table>\n\nThe returned identifier can be passed to\n`Class.GuiService:DismissNotification()|DismissNotification()`\
    \ to dismiss\nthe notification programmatically; an empty string is returned if\
    \ the\nnotification could not be queued.\n"
  code_samples: []
  parameters:
  - name: notificationInfo
    type: Dictionary
    default: null
    summary: 'A dictionary describing the notification. Recognized fields are

      `Title` (string), `Text` (string), `Icon` (string), `Buttons` (an

      array of button tables, each with a `Text` string, a `ButtonType`

      `Enum.NotificationButtonType` value, and an `OnActivated` callback),

      and `OnDisplay`/`OnDismiss` callback functions.

      '
  returns:
  - type: string
    summary: 'A unique identifier string for the notification, which can be passed

      to `Class.GuiService:DismissNotification()|DismissNotification()`.

      Returns an empty string if the notification could not be queued.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
