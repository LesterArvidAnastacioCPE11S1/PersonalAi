- name: GuiService:GetInsetArea
  summary: 'Takes an `Enum.ScreenInsets` value and returns a `Datatype.Rect`

    describing the inset region, relative to the

    `Enum.ScreenInsets.CoreUISafeInsets|CoreUISafeInsets` area.

    '
  description: 'Takes an `Enum.ScreenInsets` value and returns a `Datatype.Rect`

    describing the inset region relative to the

    `Enum.ScreenInsets.CoreUISafeInsets|CoreUISafeInsets` area, effectively

    the usable rectangle for a particular `Enum.ScreenInsets` area.


    On a mobile device screen, for example, querying

    `GetInsetArea(Enum.ScreenInsets.None)` may return a result such as

    `-59, -58, 792, 334`, meaning the usable rectangle for

    `Enum.ScreenInsets.None` has a top‑left corner `59` pixels left and `58`

    pixels up from the top‑left corner of the core UI area, and a bottom‑right

    corner `792` pixels right and `334` pixels down from the top‑left corner

    of the core UI area.


    <img src="../../../assets/engine-api/classes/GuiService/GetInsetArea.png" width="840"
    />

    '
  code_samples:
  - GuiService-GetInsetArea
