name: BaseWrap
type: class
memory_category: Instances
summary: 'Abstract base class for `Class.WrapTarget` and `Class.WrapLayer` that stores

  cage mesh data for layered clothing deformation.

  '
description: 'The base class for `Class.WrapTarget` and `Class.WrapLayer` objects.
  Note that

  `Class.MeshPart` is the only valid parent type for `Class.BaseWrap` and that

  it behaves more like a component of `Class.MeshPart` than an independent

  object.

  '
code_samples: []
inherits:
- Instance
descendants:
- WrapDeformer
- WrapLayer
- WrapTarget
tags:
- NotCreatable
deprecation_message: ''
properties:
- name: BaseWrap.CageMeshContent
  summary: 'The cage mesh this wrap uses to deform geometry, stored as a

    `Datatype.Content` value.

    '
  description: 'The cage mesh this wrap uses to deform geometry, stored as a

    `Datatype.Content` value that can reference an uploaded mesh asset or an

    in-memory `Class.EditableMesh`. Set automatically by the Importer. It is

    the backing store for `Class.BaseWrap.CageMeshId`: that property reads the

    mesh ID from this content, and setting either keeps both in sync and

    raises a change on both.


    Defaults to an empty `Datatype.Content`. Without a valid cage, the wrap

    cannot contribute to layered clothing deformation for `Class.WrapLayer` or

    `Class.WrapTarget`.

    '
  code_samples: []
  type: Content
