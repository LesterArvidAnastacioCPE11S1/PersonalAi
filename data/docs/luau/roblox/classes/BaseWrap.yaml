- name: BaseWrap.HSRContent
  summary: 'The hidden surface removal data for this wrap, stored as a

    `Datatype.Content` value.

    '
  description: 'Hidden surface removal (HSR) data for this wrap, stored as a

    `Datatype.Content` value that references a precomputed mesh asset. It is

    the backing store for `Class.BaseWrap.HSRAssetId`: that property reads the

    asset ID from this content, and setting either keeps both in sync.


    The content determines which mesh triangles are hidden when clothing

    layers overlap so occluded geometry can be culled during layered clothing

    deformation. Generated automatically when a `Class.BaseWrap` is published;

    you do not need to set it manually.

    '
