events:
- name: SensorBase.OnSensorOutputChanged
  summary: 'Fires when one of the sensor''s output properties changes value.

    '
  description: 'Fires when one of the sensor''s output properties changes value. The
    event

    carries no arguments; read the relevant output property to get its new

    value.


    A sensor only recomputes its outputs while

    `Class.SensorBase.UpdateType|UpdateType` is `Enum.SensorUpdateType.OnRead`

    (the default), so with the default update type this event fires as the

    outputs are recalculated on read. When

    `Class.SensorBase.UpdateType|UpdateType` is

    `Enum.SensorUpdateType.Manual`, the outputs — and therefore this event —

    change only when you set the output properties yourself.

    '
