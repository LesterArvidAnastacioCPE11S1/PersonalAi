- name: SensorBase:Sense
  summary: 'Recomputes the sensor''s output properties immediately.

    '
  description: 'Recomputes the sensor''s output properties immediately.


    This method is deprecated and should not be used in new work. When

    `Class.SensorBase.UpdateType|UpdateType` is `Enum.SensorUpdateType.OnRead`

    (the default), the sensor recalculates its output properties automatically

    the next time you read them, so calling this method is unnecessary. When

    `Class.SensorBase.UpdateType|UpdateType` is

    `Enum.SensorUpdateType.Manual`, the outputs are never recomputed

    automatically; set the output properties yourself rather than calling this

    method.

    '
