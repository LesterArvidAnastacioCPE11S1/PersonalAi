name: SensorBase
type: class
memory_category: Instances
summary: 'An abstract class for various sensor instance types.

  '
description: 'A `Class.SensorBase` is an instance that, when parented to a `Class.BasePart`,

  outputs additional data about the world around that part. Often, other systems

  will consume the sensor''s output data.

  '
