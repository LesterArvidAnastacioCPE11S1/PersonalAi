name: Pants
type: class
memory_category: Instances
summary: 'Displays a Pants texture from the Roblox website to display on a

  `Class.Humanoid` rig.

  '
description: 'The `Pants` object displays a pants texture from Roblox on a `Class.Humanoid`

  rig. Pants cover the torso and legs, and will be covered by a `Class.Shirt` on

  the torso. To be visible, a `Pants` must be a sibling of a `Class.Humanoid`

  and have its `Class.Pants.PantsTemplate|PantsTemplate` property set to an

  appropriate texture such as `rbxassetid://86896501`. The pants texture may be

  colorized using the `Class.Clothing.Color3` property.


  Pants are automatically loaded on `Class.Player` characters if their avatar is

  wearing one.

  '
code_samples:
- Shirt-Pants
inherits:
- Clothing
descendants: []
tags: []
deprecation_message: ''
properties:
- name: Pants.PantsTemplate
  summary: 'Determines the texture of the `Class.Pants`.

    '
  description: "The content ID link pointing to the pants template hosted on Roblox.\n\
    \nThis content ID is different than the website URL of the pants. It can be\n\
    found by pasting the website URL of the pants into the **PantsTemplate**\nproperty\
    \ in Studio. Alternatively, `Class.InsertService:LoadAsset()` can\nbe used to\
    \ insert the pants into the workspace, for example:\n\n```\nlocal InsertService\
    \ = game:GetService(\"InsertService\")\nlocal Workspace = game:GetService(\"Workspace\"\
    )\n\nlocal webURL = \"https://www.roblox.com/catalog/1804739/Jeans\"\nlocal assetId\
    \ = tonumber(string.match(webURL, \"%d+\") or 0)  -- Extract the number\nlocal\
    \ success, model = pcall(function()\n\treturn InsertService:LoadAsset(assetId)\n\
    end)\nif success then\n\tmodel.Parent = Workspace\nend\n```\n\nFor a `Class.Shirt`\
    \ object's template, see `Class.Shirt.ShirtTemplate`.\n"
  code_samples:
  - Shirt-Pants
