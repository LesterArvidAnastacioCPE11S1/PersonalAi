  summary: 'Specifies the asset URI of the pants texture.

    '
  description: 'Specifies the pants texture using an

    [asset URI](../../../projects/assets/index.md#asset-uris). Although this

    property uses Datatype.Content, it does not support `Class.EditableImage`

    objects.


    Setting either `PantsTemplateContent` or `Class.Pants.PantsTemplate`

    updates the other; both reflect the same texture.

    '
