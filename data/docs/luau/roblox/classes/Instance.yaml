- name: Instance:GetAttribute
  summary: 'Returns the value which has been assigned to the given attribute name.

    '
  description: "This method returns the value which has been assigned to the given\n\
    attribute name. If no attribute has been assigned, `nil` is returned.\n\nFor example,\
    \ the following code snippet sets and then gets the value of\nthe instance's `InitialPosition`\
    \ attribute:\n\n```lua\nlocal Workspace = game:GetService(\"Workspace\")\n\nlocal\
    \ part = Workspace.Part\npart:SetAttribute(\"InitialPosition\", part.Position)\n\
    \nlocal initialPosition = instance:GetAttribute(\"InitialPosition\")\nprint(initialPosition)\n\
    ```\n\n#### See Also\n\n- `Class.Instance:SetAttribute()` which sets the attribute\
