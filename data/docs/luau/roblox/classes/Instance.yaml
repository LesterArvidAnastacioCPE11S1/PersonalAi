- name: Instance:FindFirstAncestorOfClass
  summary: 'Returns the first ancestor of the `Class.Instance` whose

    `Class.Object.ClassName` is equal to the given className.

    '
  description: 'Returns the first ancestor of the `Class.Instance` whose

    `Class.Object.ClassName` is equal to the given className.


    This method works upwards, meaning it starts at the instance''s immediate

    `Class.Instance.Parent` and works up towards the `Class.DataModel`. If no

    matching ancestor is found, it returns `nil`.


    A common use of this method is finding the `Class.Model` a

    `Class.BasePart` belongs to. For example:


    ```

    local model = part:FindFirstAncestorOfClass("Model")

    ```


    This method is a variant of `Class.Instance:FindFirstAncestor()` which

    checks the `Class.Object.ClassName` property rather than

    `Class.Instance.Name`. `Class.Instance:FindFirstAncestorWhichIsA()` also

    exists, using the `Class.Object:IsA()` method instead to respect class

    inheritance.

    '
  code_samples: []
  parameters:
  - name: className
    type: string
    default: null
    summary: 'The `Class.Object.ClassName` to be looked for.

      '
  returns:
