- name: Instance:WaitForChild
  summary: 'Returns the child of the `Class.Instance` with the given name. If the

    child does not exist, it will yield the current thread until it does.

    '
  description: "Returns the child of the `Class.Instance` with the given name. If\
    \ the\nchild does not exist, it will yield the current thread until it does. If\n\
    the `timeOut` parameter is specified, this method will time out after the\nspecified\
    \ number of seconds and return `nil`.\n\n#### Primary Usage\n\n`Class.Instance:WaitForChild()|WaitForChild()`\
    \ is extremely important when\nworking on code run by the client in a `Class.LocalScript`.\
    \ The Roblox\nengine does not guarantee the time or order in which objects are\n\
    replicated from the server to the client. Additionally, if an experience\nhas\
    \ `Class.Workspace.StreamingEnabled` set to true,\n`Class.BasePart|BaseParts`\
    \ that are far away from the player's character\nmay not be streamed to the client,\
    \ potentially causing scripts to break\nwhen indexing objects that do not yet\
    \ exist on the client.\n\n#### Notes\n\n- This method does not yield if a child\
    \ with the given name exists when\n  the call is made.\n- `Class.Instance:FindFirstChild()`\
    \ is a more efficient alternative to\n  `Class.Instance:WaitForChild()|WaitForChild()`\
    \ for objects that are\n  assumed to exist.\n- If a call to this method exceeds\
    \ 5 seconds without returning, and no\n  `timeOut` parameter has been specified,\
    \ a warning will be printed to the\n  output that the thread may yield indefinitely.\n"
  code_samples:
  - Instance-WaitForChild1
  parameters:
  - name: childName
    type: string
    default: null
    summary: 'The `Class.Instance.Name` to be looked for.

      '
