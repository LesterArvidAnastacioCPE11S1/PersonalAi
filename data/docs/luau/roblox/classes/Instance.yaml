- name: Instance:SetAttribute
  summary: 'Sets the attribute with the given name to the given value.

    '
  description: "This method sets the attribute with the given name to the given value.\
    \ If\nthe value given is `nil`, the attribute will be removed, since `nil` is\n\
    returned by default.\n\nFor example, the following code snippet sets the instance's\n\
    `InitialPosition` attribute to `Datatype.Vector3|Vector3.new(0, 10, 0)`:\n\n```lua\n\
    local Workspace = game:GetService(\"Workspace\")\n\nlocal part = Workspace.Part\n\
    part:SetAttribute(\"InitialPosition\", Vector3.new(0, 10, 0))\n```\n\n#### Limitations\n\
    \nNaming requirements and restrictions:\n\n- Names must only use alphanumeric\
    \ characters.\n  - You may also include periods, hyphens, slashes, and underscores.\n\
    - No spaces or unique symbols (such as @, ~, !) are allowed.\n- Strings must be\
    \ 100 characters or less.\n- Names are not allowed to start with **RBX** unless\
    \ the caller is a\n  Roblox core script (reserved for Roblox).\n\nWhen attempting\
    \ to set an attribute to an unsupported type, an error will\nbe thrown.\n\n####\
    \ See Also\n\n- `Class.Instance:GetAttribute()` which returns the value that has\
    \ been\n  assigned to the given attribute name.\n- `Class.Instance:GetAttributes()`\
    \ which returns a dictionary of key‑value\n  pairs for each of the instance's\
    \ attributes.\n"
