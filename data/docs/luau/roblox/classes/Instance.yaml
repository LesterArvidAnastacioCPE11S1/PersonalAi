- name: Instance.DescendantRemoving
  summary: 'Fires immediately before a descendant of the `Class.Instance` is removed.

    '
  description: "This event fires **immediately before** the parent `Class.Instance`\n\
    changes such that a **descendant** instance will no longer be a\ndescendant. `Class.Instance:Destroy()|Destroy()`\
    \ changes an instance's\n`Class.Instance.Parent|Parent` to `nil`, so calling that\
    \ method on a\ndescendant of the parent will cause this event to fire.\n\nSince\
    \ this event fires **before** the descendant's removal, the parent of\nthe descendant\
    \ will be unchanged at the time of this event firing. If the\ndescendant is also\
    \ a **direct child** of the parent, this event will fire\nbefore `Class.Instance.ChildRemoved`.\n\
    \nIf a descendant has children, this event fires with the descendant first,\n\
    followed by its descendants.\n\n#### Warning\n\nThis event fires with the descendant\
    \ object that is being removed.\nAttempting to set the `Class.Instance.Parent|Parent`\
    \ of the descendant to\nsomething else will fail. Below is an example that demonstrates\
    \ this:\n\n```\nlocal Workspace = game:GetService(\"Workspace\")\n\nWorkspace.DescendantRemoving:Connect(function(descendant)\n\
    \t-- Do not manipulate the parent of the descendant in this function!\n\t-- This\
    \ event fires BECAUSE the parent was manipulated, and the change hasn't happened\
    \ yet\n\t-- Therefore, it is problematic to change the parent like this:\n\tdescendant.Parent\
    \ = game\nend)\n\nlocal part = Instance.new(\"Part\")\npart.Parent = Workspace\n\
    part.Parent = nil\n```\n\nSee also `Class.Instance.DescendantAdded|DescendantAdded`.\n"
