- name: Instance.Name
  summary: 'A non-unique identifier of the `Class.Instance`.

    '
  description: 'A non-unique identifier of the `Class.Instance`. Names are used to
    keep

    the object hierarchy organized, along with allowing scripts to access

    specific objects. The name of an instance cannot exceed 100 characters in

    size.


    The name of an object is often used to access the object through the data

    model hierarchy using the following methods:


    ```

    local Workspace = game:GetService("Workspace")


    local baseplate = Workspace.Baseplate

    local baseplate = Workspace["Baseplate"]

    local baseplate = Workspace:FindFirstChild("BasePlate")

    ```


    In order to make an object accessible using the dot operator (`.`), its

    name must start with an underscore or letter, and the rest of the name can

    only contain letters, numbers, or underscores (no other special

    characters). If an object''s name does not follow this syntax, it will not

    be accessible using the dot operator and Luau will not interpret its name

    as an identifier.


    If more than one object with the same name are siblings, any attempt to

    index an object by that name will return only one of the objects, similar

    to `Class.Instance:FindFirstChild()`, but not always the desired object.

    If a specific object needs to be accessed through code, it''s recommended

    to give it a unique name or guarantee that none of its siblings share the

    same name.


    See also `Class.Instance:GetFullName()` to obtain a full name including

    the object''s hierarchy.

    '
  code_samples: []
  type: string
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: true
    can_save: true
  capabilities: []
- name: Instance.Parent
  summary: 'Determines the hierarchical parent of the `Class.Instance`.

    '
  description: "The `Parent` property determines the hierarchical parent of the\n\
    `Class.Instance`. The following terminology is commonly used when talking\nabout\
    \ how this property is set:\n\n- An object is a **child** of, or is **parented\
    \ to**, another object when\n  its `Parent` is set to that object.\n\n- The **descendants**\
    \ of an `Class.Instance` are the children of that\n  object, plus the descendants\
    \ of the children as well.\n\n- The **ancestors** of an `Class.Instance` are all\
    \ the objects that the\n  instance is a descendant of.\n\nIt is from the `Parent`\
    \ property that many other API members get their\nname, such as `Class.Instance:GetChildren()|GetChildren()`\
    \ and\n`Class.Instance:FindFirstChild()|FindFirstChild()`. This property is also\n\
    used to manage whether an object exists in the experience or needs to be\nremoved.\
    \ As long as an object's parent is in the `Class.DataModel`, is\nstored in a variable,\
    \ or is referenced by another object's property, the\nobject remains in the experience;\
    \ otherwise, the object will automatically\nbe removed.\n\nCalling `Class.Instance:Destroy()|Destroy()`\
    \ will set the `Parent` of an\n`Class.Instance` and all of its descendants to\
    \ `nil`, and also **lock**\nthe `Parent` property. An error is raised when setting\
    \ the `Parent` of a\ndestroyed object.\n\nNewly created objects using `Datatype.Instance.new()`\
    \ will not have a\nparent, and usually will not be visible or function until one\
    \ is set.\n\n#### Object Replication\n\nAn object created by the server will not\
    \ replicate to clients until it is\nparented to some object that is replicated.\
    \ When creating an object and\nsetting many properties, it's recommended to set\
    \ the `Parent` property\n**last**. This ensures the object replicates once, instead\
    \ of replicating\nmany property changes.\n\n```lua\nlocal Workspace = game:GetService(\"\
    Workspace\")\n\n-- Set new instance's parent last (recommended)\nlocal part =\
    \ Instance.new(\"Part\")\npart.Position = Vector3.new(0, 10, 0)\npart.Parent =\
    \ Workspace\n```\n\nHowever, if parenting parts to a `Class.Model` whose parent\
    \ hasn't been\nset yet, parenting each part to that model is acceptable since\
    \ the model\nwould not have replicated.\n"
  code_samples: []
  type: Instance
  tags:
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: true
    can_save: false
  capabilities: []
- name: Instance.PredictionMode
  summary: 'Reflects the client-side prediction mode applied to the instance under

    server-authoritative physics.

    '
  description: "This property reflects the `Enum.PredictionMode` currently applied\
    \ to the\ninstance, which determines whether the instance's state is predicted\
    \ on\nthe client ahead of the authoritative server state under\nserver-authoritative\
    \ physics. It defaults to\n`Enum.PredictionMode|Automatic`.\n\nThis property is\
    \ read-only and cannot be assigned directly from a script;\nthe prediction mode\
    \ is set through `Class.RunService:SetPredictionMode()`.\nThe property is shown\
    \ in Studio's Properties window only when the\nexperience uses server-authoritative\
    \ physics.\n\n- `Enum.PredictionMode|Automatic` (default) — the engine automatically\n\
    \  decides whether to predict the instance. Currently, only\n  `Class.BasePart|BaseParts`\
    \ near the local player character's\n  `Class.Humanoid` are predicted, within\
    \ a dynamic radius that grows and\n  shrinks based on the device's capacity to\
    \ handle the simulation load.\n- `Enum.PredictionMode|On` — the instance is always\
    \ predicted. If it is a\n  `Class.BasePart`, its physics properties are predicted\
    \ ahead of the\n  replicated authoritative server state, and mismatches in the\
    \ instance's\n  attributes between the client and server cause a rollback and\n\
    \  resimulation.\n- `Enum.PredictionMode|Off` — the instance is not predicted,\
    \ and regular\n  network ownership semantics apply.\n"
  code_samples: []
  type: PredictionMode
  tags:
  - ReadOnly
  - NotReplicated
  - NotScriptable
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: false
    can_save: false
  capabilities: []
