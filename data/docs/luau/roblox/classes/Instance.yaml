methods:
- name: Instance:AddTag
  summary: 'Applies a tag to the instance.

    '
  description: "This method applies a tag to the instance, with no effect if the tag\
    \ is\nalready applied. Successfully adding a tag will fire a signal created by\n\
    `Class.CollectionService:GetInstanceAddedSignal()` with the given tag.\n\n####\
    \ Warnings\n\n- An instance's tags that were added client-side will be dropped\
    \ if the\n  server later adds or removes a tag on that instance because the server\n\
    \  replicates all tags together and overwrites previous tags.\n\n- When tagging\
    \ an instance, it is common that some resources are used to\n  give the tag its\
    \ functionality, for example event connections or tables.\n  To prevent memory\
    \ leaks, it's a good idea to clean these up (disconnect,\n  set to `nil`, etc.)\
    \ when no longer needed for a tag. Do this when\n  calling `Class.Instance:RemoveTag()`,\
    \ calling\n  `Class.Instance:Destroy()`, or in a function connected to a signal\n\
    \  returned by `Class.CollectionService:GetInstanceRemovedSignal()`.\n"
  code_samples: []
  parameters:
  - name: tag
    type: string
    default: null
    summary: 'The tag to apply to the instance.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
