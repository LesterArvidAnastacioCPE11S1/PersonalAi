- name: Instance:FindFirstAncestorWhichIsA
  summary: 'Returns the first ancestor of the `Class.Instance` for whom

    `Class.Object:IsA()` returns true for the given className.

    '
  description: 'Returns the first ancestor of the `Class.Instance` for whom

    `Class.Object:IsA()` returns true for the given className.


    This method works upwards, meaning it starts at the instance''s immediate

    `Class.Instance.Parent` and works up towards the `Class.DataModel`. If no

    matching ancestor is found, it returns `nil`.


    Unlike `Class.Instance:FindFirstAncestorOfClass()`, this method uses

    `Class.Object:IsA()` which respects class inheritance. For example:


    ```

    print(part:IsA("Part"))  --> true

    print(part:IsA("BasePart"))  --> true

    print(part:IsA("Instance"))  --> true

    ```


    Therefore, the following code sample will return the first

    `Class.BasePart` ancestor, regardless of if it is a `Class.WedgePart`,

    `Class.MeshPart` or `Class.Part`.


    ```

    local part = object:FindFirstAncestorWhichIsA("BasePart")

    ```


    See also `Class.Instance:FindFirstAncestor()`.

    '
  code_samples: []
  parameters:
  - name: className
    type: string
    default: null
    summary: 'The `Class.Object.ClassName` to be looked for.

      '
  returns:
  - type: Instance?
    summary: 'The `Class.Instance` found.

