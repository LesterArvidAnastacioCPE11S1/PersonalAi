- name: Instance:FindFirstAncestor
  summary: 'Returns the first ancestor of the `Class.Instance` whose

    `Class.Instance.Name` is equal to the given name.

    '
  description: 'Returns the first ancestor of the `Class.Instance` whose

    `Class.Instance.Name` is equal to the given name.


    This method works upwards, meaning it starts at the instance''s immediate

    `Class.Instance.Parent` and works up towards the `Class.DataModel`. If no

    matching ancestor is found, it returns `nil`.


    The following code snippet would find the first ancestor of the object

    named `Car`.


    ```

    local car = object:FindFirstAncestor("Car")

    ```


    For variants of this method that find ancestors of a specific class,

    please see `Class.Instance:FindFirstAncestorOfClass()` and

    `Class.Instance:FindFirstAncestorWhichIsA()`.

    '
  code_samples: []
  parameters:
  - name: name
    type: string
    default: null
    summary: 'The `Class.Instance.Name` to be looked for.

      '
  returns:
  - type: Instance?
    summary: 'The `Class.Instance` found.

