- name: Instance:QueryDescendants
  summary: 'Returns an array containing all descendants of the instance that match
    the

    `selector` string.

    '
  description: "This object method returns an array that contains all descendants\
    \ of the\nobject that match the provided `selector` string. `selector` can include\n\
    multiple selectors and combinators to match characteristics such as the\nclass\
    \ name, instance name, and hierarchy relationships, as well as\nspecific values\
    \ of instance properties and attributes. The `selector`\ngrammar is similar to\
    \ the one used in `Class.StyleRule`, with only a few\ndifferences regarding which\
    \ parts of the grammar are supported or not.\n\n#### Selectors\n\n- `ClassName`\
    \ — Matches instances of the specified class in a\n  `Class.Object:IsA()` relationship.\n\
    - `.Tag` — Matches instances tagged with a `Class.CollectionService` tag.\n- `#Name`\
    \ — Matches instances of a specific `Class.Instance.Name`.\n- `[property = value]`\
    \ — Matches instances which have the specified\n  property and that property has\
    \ the specified value. Boolean, number, and\n  string values are supported. Letters,\
    \ numbers, `_`, and `-` can be used\n  without putting the value in quotation\
    \ marks.\n- `[$attribute]` — Matches instances which have the specified\n  [attribute](../../../studio/properties.md#instance-attributes)\
    \ set.\n- `[$attribute = value]` — Matches instances which have the specified\n\
    \  attribute **and** that attribute has the specified value. Same\n  limitations\
    \ apply as for property selectors. If you want to check for\n  the absence of\
    \ an attribute, do not query it as `nil`; instead use the\n  `:not` pseudo‑class\
    \ as in `:not([$attribute])`.\n\nSelectors can also be combined. For example,\n\
    `Model.Apple[$Variety = Fuji][$Flavor = 4]` will match instances which are\na\
    \ `Class.Model` tagged as `Apple` and which have a `Variety` attribute\nequal\
    \ to `Fuji` as well as a `Flavor` attribute equal to `4`.\n\n```lua\nlocal Workspace\
    \ = game:GetService(\"Workspace\")\n\n-- Get all MeshPart descendants\nprint(Workspace:QueryDescendants(\"\
    MeshPart\"))\n\n-- Get all descendants tagged as \"Fruit\"\nprint(Workspace:QueryDescendants(\"\
    .Fruit\"))\n\n-- Get all descendants with the name \"RedTree\"\nprint(Workspace:QueryDescendants(\"\
    #RedTree\"))\n\n-- Get all descendants with CanCollide property set to false\n\
    print(Workspace:QueryDescendants(\"[CanCollide = false]\"))\n\n-- Get all descendants\
    \ with a \"FuelCapacity\" attribute assigned\nprint(Workspace:QueryDescendants(\"\
    [$FuelCapacity]\"))\n-- Get all descendants with a \"FuelCapacity\" attribute\
    \ set to 75\nprint(Workspace:QueryDescendants(\"[$FuelCapacity = 75]\"))\n```\n\
    \n#### Combinators\n\nCombinators let you mix basic selectors to match deeper\
    \ hierarchy\nrelationships.\n\n- `>` — Matches instances that are **direct children**\
    \ of the previous\n  filter matches.\n\n- `>>` — Matches instances that are **descendants**\
    \ of the previous filter\n  matches. This is the default first filter, meaning\
    \ that `SpotLight.Red`\n  is the same as `>> SpotLight.Red`.\n\n- `,` — Specifies\
    \ a list of multiple independent selectors for the\n  descendant query. Only elements\
    \ matching the filter are placed in the\n  returned array; `nil` will not be included\
    \ for non‑matches in a query\n  list.\n\n```lua\nlocal Workspace = game:GetService(\"\
    Workspace\")\n\n-- Get direct children of any Model that are tagged as \"SwordPart\"\
    \nprint(Workspace:QueryDescendants(\"Model > .SwordPart\"))\n\n-- Get direct children\
    \ which are a Part and are tagged as \"Apple\"\nprint(Workspace:QueryDescendants(\"\
    > Part.Apple\"))\n\n-- Get descendants of any Model with an attribute \"OnFire\"\
    \ set to true\nprint(Workspace:QueryDescendants(\"Model >> [$OnFire = true]\"\
    ))\n\n-- Get MeshPart descendants tagged as \"SwordPart\" OR with an attribute\
    \ \"OnFire\" set to true\nprint(Workspace:QueryDescendants(\"MeshPart.SwordPart,\
    \ MeshPart[$OnFire = true]\"))\n```\n\n#### Pseudo-class selectors\n\n- `:not(complex-selector-list)`\
    \ — Allows selecting instances which do\n  **not** match any of the selectors\
    \ inside, effectively performing a\n  negation of the selectors. Since the expression\
    \ inside is a list of\n  complex selectors, it's possible to filter based on multiple\
    \ conditions.\n\n- `:has(relative-selector-list)` — Allows selecting instances\
    \ based on\n  which instances they contain inside. The selector list is evaluated\n\
    \  relative to each instance.\n\n- `:in-radius(studs, complex-selector-list)`\
    \ Selects instances within the\n  specified number of studs. The selector list\
    \ is evaluated against all\n  instances matching the query. It's effectively evaluating\
    \ a join.\n\n```lua\nlocal Workspace = game:GetService(\"Workspace\")\n\n-- Get\
    \ all descendants which are NOT of class SpotLight\nprint(Workspace:QueryDescendants(\"\
    :not(SpotLight)\"))\n-- Get all descendants which are NOT of class SpotLight OR\
    \ PointLight\nprint(Workspace:QueryDescendants(\":not(SpotLight, PointLight)\"\
    ))\n-- Get all descendants which do NOT have an attribute \"OnFire\"\nprint(Workspace:QueryDescendants(\"\
    :not([$OnFire])\"))\n-- Get all descendants EXCEPT children of a Model tagged\
    \ as \"SwordPart\"\nprint(Workspace:QueryDescendants(\":not(Model > .SwordPart)\"\
    ))\n\n-- Get descendants which contain a Tool instance as their own descendant\n\
    print(Workspace:QueryDescendants(\":has(Tool)\"))\n-- Get MeshPart descendants\
    \ which contain a direct child tagged as \"SwordPart\"\nprint(Workspace:QueryDescendants(\"\
    MeshPart:has(> .SwordPart)\"))\n\n-- Get MeshPart descendants with direct children\
    \ NOT of SurfaceAppearance or Texture class\nprint(Workspace:QueryDescendants(\"\
    MeshPart:has(> :not(SurfaceAppearance, Texture))\"))\n\n-- Get Fireball Models\
    \ within 10 studs of a HumanoidRootPart (Players or NPC's)\nprint(Workspace:QueryDescendants(\"\
    Model.FireBall:in-radius(10, Model:has(> Part#HumanoidRootPart))\"))\n```\n"
  code_samples: []
  parameters:
  - name: selector
    type: string
    default: null
    summary: 'Selector string used to filter elements.

      '
  returns:
  - type: Instances
    summary: 'An array of instances (empty if nothing matched the selector).

      '
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
