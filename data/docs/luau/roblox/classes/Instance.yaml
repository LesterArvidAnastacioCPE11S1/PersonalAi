- name: Instance:FindFirstChild
  summary: 'Returns the first child of the `Class.Instance` found with the given name.

    '
  description: "Returns the first child of the `Class.Instance` with the given name,\
    \ or\n`nil` if no such child exists. If the optional `recursive` argument is\n\
    `true`, this method searches all descendants rather than only the\nimmediate children\
    \ of the `Class.Instance`.\n\n#### Checking the Existence of an Object\n\n`FindFirstChild()`\
    \ is necessary if you need to verify an object exists\nbefore continuing. Attempting\
    \ to index a child by name using the dot\noperator throws an error if the child\
    \ doesn't exist.\n\n```lua\nlocal Workspace = game:GetService(\"Workspace\")\n\
    \n-- The following line errors if the part doesn't exist in the workspace\nWorkspace.Part.Transparency\
    \ = 0.5\n```\n\nA better approach is to use `FindFirstChild()` to first check\
    \ for `Part`,\nthen use an `if` statement to run code that needs it.\n\n```lua\n\
    local Workspace = game:GetService(\"Workspace\")\n\nlocal part = Workspace:FindFirstChild(\"\
    Part\")\nif part then\n\tpart.Transparency = 0.5\nend\n```\n\n#### Finding a Child\
    \ Whose Name Matches a Property\n\nSometimes the `Class.Instance.Name|Name` of\
    \ an object is the same as that\nof a property of its `Class.Instance.Parent|Parent`.\
    \ When using the dot\noperator, properties take precedence over children if they\
    \ share a name.\n\nIn the following example, a `Class.Folder` called `Color` is\
    \ added to a\n`Class.Part`, which also has the `Class.Part.Color` property. Notice\
    \ that\n`part.Color` refers to the `Datatype.Color3` property value, not the child\n\
    `Class.Folder` instance. A benefit of using\n`Class.Instance:FindFirstChild()|FindFirstChild()`\
    \ is that the\nintroduction of new properties does not impose a risk on your code.\n\
    \n```lua\nlocal part = Instance.new(\"Part\")\nlocal folder = Instance.new(\"\
    Folder\")\nfolder.Name = \"Color\"\nfolder.Parent = part\nlocal c1 = part.Color\
    \  -- The property\nlocal c2 = part:FindFirstChild(\"Color\")  -- The child folder\n\
    ```\n\n#### Performance Notes\n\n`Class.Instance:FindFirstChild()|FindFirstChild()`\
    \ takes about 20% longer\nthan using the dot operator and almost 8 times longer\
    \ than simply storing\na reference to an object. Therefore, you should avoid calling\
    \ it in\nperformance-dependent code such as in tight loops or functions connected\n\
    to `Class.RunService.Heartbeat` and `Class.RunService.PreRender`. Instead,\nstore\
    \ the result in a variable, or consider using\n`Class.Instance.ChildAdded|ChildAdded`\
    \ or\n`Class.Instance:WaitForChild()|WaitForChild()` to detect when a child of\
    \ a\ngiven name becomes available.\n"
  code_samples:
  - Instance-FindFirstChild1
  parameters:
  - name: name
    type: string
    default: null
    summary: 'The `Class.Instance.Name` to be searched for.

      '
  - name: recursive
    type: boolean
    default: false
    summary: 'Whether or not the search should be conducted recursively.

      '
  returns:
  - type: Instance?
    summary: 'The `Class.Instance` found.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities: []
  simulationAccess: true
