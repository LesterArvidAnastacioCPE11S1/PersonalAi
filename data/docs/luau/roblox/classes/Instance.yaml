- name: Instance:ClearAllChildren
  summary: 'This method destroys all of an instance''s children.

    '
  description: "This method destroys all of an instance's children and descendants.\n\
    \n```\nlocal part = Instance.new(\"Part\")\n\n-- Add some sparkles\nfor i = 1,\
    \ 3 do\n\tlocal sparkles = Instance.new(\"Sparkles\")\n\tsparkles.Parent = part\n\
    \n  local sc = Instance.new(\"Sparkles\")\n  sc.Parent = sparkles\nend\n\nprint(\"\
    Children:\", #part:GetChildren())  --> Children: 3\n\npart:ClearAllChildren()\n\
    \nprint(\"Children:\", #part:GetChildren())  --> Children: 0\n```\n\nIf you do\
    \ not wish to destroy **all** children and descendants, use either\n`Class.Instance:GetChildren()`\
    \ or `Class.Instance:GetDescendants()` to\nloop through those children/descendants\
    \ and select what to destroy. For\nexample, the following code sample will destroy\
    \ all\n`Class.BasePart|BaseParts` descending from a `Class.Model`:\n\n```\nlocal\
    \ Workspace = game:GetService(\"Workspace\")\n\nlocal model = Workspace:FindFirstChild(\"\
    TestModel\")\n\nfor _, descendant in model:GetDescendants() do\n\tif descendant:IsA(\"\
    BasePart\") then\n\t\tdescendant:Destroy()\n\tend\nend\n```\n"
  code_samples: []
  parameters: []
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: Instance:Clone
  summary: 'Create a copy of an instance and all its descendants, ignoring instances

    that are not `Class.Instance.Archivable|Archivable`.

    '
  description: "`Clone()` creates a copy of an instance and all of its descendants,\n\
    ignoring all instances that are not\n`Class.Instance.Archivable|Archivable`. The\
    \ copy of the root instance is\nreturned by this method and its `Class.Instance.Parent|Parent`\
    \ is set to\n`nil`. Note that if the instance itself has\n`Class.Instance.Archivable|Archivable`\
    \ set to `false`, this method will\nreturn `nil`.\n\nIf a reference property such\
    \ as `Class.ObjectValue.Value` is set in a\ncloned instance, the value of the\
    \ copy's property depends on the\noriginal's value:\n\n- If a reference property\
    \ refers to an instance that was **also** cloned,\n  the copy will refer to the\
    \ copy.\n- If a reference property refers to an instance that was **not** cloned,\n\
    \  the same value is maintained in the copy.\n"
  code_samples:
  - Clone-Example
  parameters: []
  returns:
  - type: Instance
    summary: 'A copy of the instance, or `nil` if the instance is not

      `Class.Instance.Archivable|Archivable`.

      '
  tags: []
  deprecation_message: ''
  security: None
