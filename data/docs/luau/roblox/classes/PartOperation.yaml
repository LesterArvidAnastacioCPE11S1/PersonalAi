properties:
- name: PartOperation.RenderFidelity
  summary: 'The level of detail used to render the solid modeled part.

    '
  description: "This property determines the level of detail that the solid modeled\
    \ part\nwill be shown in. It can be set to the possible values of the\n`Enum.RenderFidelity`\
    \ enum except for\n`Enum.RenderFidelity.Performance|Performance`.\n\nThe default\
    \ value is `Enum.RenderFidelity.Automatic|Automatic`, meaning\nthe part's detail\
    \ is based on its distance from the camera as outlined in\nthe following table.\n\
    \n<table>\n    <thead>\n        <tr>\n            <th>Distance From Camera</th>\n\
    \            <th>Render Fidelity</th>\n        </tr>\n    </thead>\n    <tbody>\n\
    \        <tr>\n            <td>Less than 250 studs</td>\n            <td>Highest</td>\n\
    \        </tr>\n        <tr>\n            <td>250-500 studs</td>\n           \
    \ <td>Medium</td>\n        </tr>\n        <tr>\n            <td>500 or more studs</td>\n\
    \            <td>Lowest</td>\n        </tr>\n    </tbody>\n</table>\n"
  code_samples: []
  type: RenderFidelity
  tags: []
  deprecation_message: ''
  security:
