  returns:
  - type: Array
    summary: '(see description)

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: ValueCurve:InsertKeyValue
  summary: 'Creates a key for the given value and inserts it at the given time. If
    a

    key at the same time is found, it will be replaced.

    '
  description: 'Creates a `Datatype.ValueCurveKey` from the given arguments and inserts
    it

    in this curve. If a key at the same time is found, it will be replaced. In

    the returned array, the first value is `true` if a key was added or

    `false` if a previous key was replaced; the second value is the index at

    which the marker was added.


    If there are not yet any keys, then the key may be added. If keys exist,

    the type of the value must match those of existing keys; otherwise a

    message is printed and `{false, -1}` is returned.

    '
  code_samples: []
  parameters:
  - name: time
    type: float
    default: null
    summary: 'Time at which to insert the new `Datatype.ValueCurveKey`.

      '
  - name: value
    type: Variant
    default: null
    summary: 'Value of the inserted `Datatype.ValueCurveKey`.

      '
  - name: Interpolation
    type: KeyInterpolationMode
    default: null
    summary: 'Interpolation mode of the inserted `Datatype.ValueCurveKey`.

      '
  returns:
  - type: Array
    summary: '(see description)

