- name: BodyPartDescription.HeadShape
  summary: 'Specifies the head shape identifier to apply to a Dynamic Head when this

    `Class.BodyPartDescription` is applied.

    '
  description: "**HeadShape** specifies a Classic Head shape identifier to apply to\
    \ a\ncompatible Dynamic Head. This property is only relevant when\n`Class.BodyPartDescription.BodyPart|BodyPart`\
    \ is set to\n`Enum.BodyPart|Head` and `Class.BodyPartDescription.AssetId|AssetId`\n\
    references a Dynamic Head that supports head shapes.\n\n#### Example\n\n```lua\n\
    local AvatarEditorService = game:GetService(\"AvatarEditorService\")\n\n-- Get\
    \ available head shapes for the user\nlocal headShapes = AvatarEditorService:GetHeadShapesAsync(userId)\n\
    \n-- Create a BodyPartDescription for a Dynamic Head with a Classic shape\nlocal\
    \ bodyPartDescription = Instance.new(\"BodyPartDescription\")\nbodyPartDescription.BodyPart\
    \ = Enum.BodyPart.Head\nbodyPartDescription.AssetId = dynamicHeadAssetId\nbodyPartDescription.HeadShape\
    \ = headShapes[1] -- Apply the first owned head shape\nbodyPartDescription.Parent\
    \ = humanoidDescription\n\n-- Apply the description\nhumanoid:ApplyDescriptionAsync(humanoidDescription)\n\
    ```\n\nSee also:\n\n- `Class.AvatarEditorService:GetHeadShapesAsync()`, which\
    \ returns head\n  shape identifiers that can be used with this property\n- `Class.BodyPartDescription.AssetId|AssetId`,\
    \ which specifies the Dynamic\n  Head asset to apply the shape to\n- `Class.BodyPartDescription.BodyPart|BodyPart`,\
    \ which must be set to\n  `Enum.BodyPart|Head` for this property to have effect\n\
    - `Class.Humanoid:ApplyDescriptionAsync()`, which applies the description\n  containing\
    \ this `Class.BodyPartDescription`\n"
