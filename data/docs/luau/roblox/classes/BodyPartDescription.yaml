- name: BodyPartDescription.Instance
  summary: 'A reference to the `Class.Instance` that should be applied when applying

    this `Class.BodyPartDescription`.

    '
  description: 'A reference to the `Class.Instance` that should be applied when applying

    this `Class.BodyPartDescription`. This property can be used instead of

    `Class.BodyPartDescription.AssetId|AssetId` to apply accessories without

    uploading them to the platform. This can reference either a body part with

    R15, **R15ArtistIntent** and **R6** folders, or only reference a single

    subfolder.

    '
