name: SpotLight
type: class
memory_category: Instances
summary: 'A light source that emits light directionally in the shape of a cone with
  a

  spherical base.

  '
description: "A **Spotlight** emits light of a specified `Class.Light.Color|Color`\
  \ and\n`Class.Light.Brightness|Brightness` in the shape of a cone with a spherical\n\
  base. This object is ideal for **directional** light sources like flashlights\n\
  and headlights.\n\n`Class.SpotLight.Range|Range` controls the distance of illumination\
  \ and\n`Class.SpotLight.Angle|Angle` defines the angle of light emission from the\n\
  cone's apex as illustrated below.\n\nA spotlight must be a direct child of a `Class.BasePart`\
  \ or `Class.Attachment`\nand will exhibit the following behavior:\n\n- When the\
  \ spotlight is parented to a `Class.BasePart`, the\n  `Class.SpotLight.Face|Face`\
  \ property determines the face of the part from\n  which light emanates.\n\n- Although\
  \ `Class.Attachment|Attachments` don't have faces, the\n  `Class.SpotLight.Face|Face`\
  \ property determines the axis of the attachment\n  from which light emanates; **-Z**\
  \ is front, **+X** is right, **+Y** is top,\n  etc.\n\nSee also `Class.SurfaceLight`\
  \ and `Class.PointLight`.\n"
