- name: CharacterMesh.OverlayTextureContent
  summary: 'The overlay texture that covers Shirts, Pants, T-Shirts, and the base

    texture, as a `Datatype.Content` value.

    '
  description: 'The `Datatype.Content`-typed equivalent of

    `Class.CharacterMesh.OverlayTextureId`. The overlay covers Shirts, Pants,

    T-Shirts, and `Class.CharacterMesh.BaseTextureContent`. Supports

    [asset URIs](../../../projects/assets/index.md#asset-uris). Defaults to

    empty `Datatype.Content`.


    Setting either `OverlayTextureContent` or

    `Class.CharacterMesh.OverlayTextureId` updates the other; both reflect the

    same texture. Like the rest of `Class.CharacterMesh`, it only affects R6

    characters.

    '
