- name: CharacterMesh.BaseTextureContent
  summary: 'The base texture applied to the mesh, as a `Datatype.Content` value.

    '
  description: 'The `Datatype.Content`-typed equivalent of

    `Class.CharacterMesh.BaseTextureId`, holding the base texture applied to

    the R6 body part''s mesh. Supports

    [asset URIs](../../../projects/assets/index.md#asset-uris). Can be

    overridden by Shirts, Pants, T-Shirts, and

    `Class.CharacterMesh.OverlayTextureContent`. Defaults to empty

    `Datatype.Content`.


    Underlying storage for legacy `Class.CharacterMesh.BaseTextureId`: the two

    stay in sync. Like the rest of `Class.CharacterMesh`, it only affects R6

    characters.

    '
