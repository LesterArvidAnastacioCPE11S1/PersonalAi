name: UniqueIdLookupService
type: class
memory_category: Instances
summary: 'Team Create service that maps `Class.Instance.UniqueId|UniqueId` to and
  from

  RFC-4122 strings; not for experience scripts.

  '
description: 'Not intended for experience scripts. Used by Team Create and Studio

  collaboration to map between an `Class.Instance`''s

  `Class.Instance.UniqueId|UniqueId` (a 128-bit identifier) and its canonical

  RFC-4122 string form, and to resolve the live instance from that string.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
deprecation_message: ''
