methods:
- name: UniqueIdLookupService:GetOrCreateUniqueIdRemoteCommand
  summary: 'Returns the RFC-4122 string form of the instance''s

    `Class.Instance.UniqueId|UniqueId`, creating one if the instance does not

    already have it.

    '
  description: 'Returns the RFC-4122 string representation of the given `Class.Instance`''s

    `Class.Instance.UniqueId|UniqueId`. If the instance does not yet have one,

    a `Class.Instance.UniqueId|UniqueId` is generated for it (and for any

    descendants that lack one) before the string is returned.

    '
  code_samples: []
  parameters:
  - name: instance
    type: Instance
    default: null
    summary: 'The instance whose `Class.Instance.UniqueId|UniqueId` to read or

      create.

      '
  returns:
  - type: string
    summary: 'The instance''s `Class.Instance.UniqueId|UniqueId` as an RFC-4122

      string.

