  simulationAccess: true
- name: PhysicsService:RemoveCollisionGroup
  summary: 'Removes the collision group with the given name.

    '
  description: 'Removes the collision group with the given name. If an invalid name
    is

    provided, this method will not do anything, although if the reserved name

    `"Default"` is provided, it will throw an error. If there are any parts in

    the collision group when it is removed, these parts will still maintain

    the same collision group ID. The physical behavior of parts in a removed

    group is undefined, so it is recommended to move any parts in a removed

    group to another group. This method will throw a runtime error in the

    following circumstances:


    - The name `"Default"` is provided.

    - The method is called from a client.

    '
  code_samples: []
  parameters:
  - name: name
    type: string
    default: null
    summary: 'The name of the collision group to remove.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Deprecated
  deprecation_message: 'This method has been superseded by

    `Class.WorldRoot:UnregisterCollisionGroup()|UnregisterCollisionGroup()`

    which should be used for all new work.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Physics
- name: PhysicsService:RenameCollisionGroup
  summary: 'Renames specified collision group.

    '
  description: 'Renames the specified registered collision group, but does **not**
    rename

    the `Class.BasePart.CollisionGroup|CollisionGroup` property of parts that

    utilize the group. The first argument of this method is the name of the

    group to rename, the second argument is the new name for the group. If the

    specified group does not exist, this method will not do anything. The

    naming conventions for the new name follow the same rules as if the group

    was being created with

    `Class.PhysicsService:RegisterCollisionGroup()|RegisterCollisionGroup()`.


    This method will throw a runtime error in the following circumstances:


    - Invalid or empty name provided for either argument.

    - The method is called from a client.


    Note that this method has a slight performance overhead based on the

    number of `Class.BasePart|BaseParts` in the workspace, so it''s recommended

    that you register all collision groups at edit time through the Studio

    [editor](../../../workspace/collisions.md#collision-groups) and rename

    them as infrequently as possible.

    '
  code_samples: []
  parameters:
  - name: from
    type: string
    default: null
    summary: 'The current name of the collision group to rename.

      '
  - name: to
    type: string
    default: null
    summary: 'The new name for the collision group.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: 'This method has been superseded by

    `Class.WorldRoot:RenameCollisionGroup()` which should be used for all new

    work.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Physics
  simulationAccess: true
- name: PhysicsService:SetPartCollisionGroup
  summary: 'Sets the collision group of a part.

    '
  description: 'This method sets the collision group of the specified part to the
    group

    with the specified name. It is equivalent to setting the

    `Class.BasePart.CollisionGroupId`, although calling this method is the

    recommended approach.


    This method will throw a runtime error in the following circumstances:


    - The part parameter is not a `Class.BasePart` instance.

    - The specified group does not exist.

    '
  code_samples: []
  parameters:
  - name: part
    type: BasePart
    default: null
    summary: 'The part being set.

      '
  - name: name
    type: string
    default: null
    summary: 'The name of collision group that the part''s collision group is being

      set to.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Deprecated
  deprecation_message: 'This method has been deprecated. It''s recommended that you
    set a part''s

    collision group by **name** through its

    `Class.BasePart.CollisionGroup|CollisionGroup` property.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Physics
- name: PhysicsService:UnregisterCollisionGroup
  summary: 'Unregisters the collision group for the given name.

    '
  description: "Unregisters the collision group for the given name, with the following\n\
    behaviors:\n\n- If an invalid name is provided, the method will not do anything.\n\
    - If the reserved name `\"Default\"` is provided **or** if the method is\n  called\
    \ from a client, it will throw an error.\n- If there are any parts in the collision\
    \ group when it is removed, those\n  parts will still maintain the same collision\
    \ group name. The physical\n  behavior of parts in a removed group is undefined,\
    \ so it's recommended\n  to move any parts in a removed group to another group,\
    \ such as the\n  `\"Default\"` group.\n\nNote that this method has a slight performance\
    \ overhead based on the\nnumber of `Class.BasePart|BaseParts` in the workspace,\
    \ so it's recommended\nthat you register all collision groups at edit time through\
    \ the Studio\n[editor](../../../workspace/collisions.md#collision-groups) and\
    \ call this\nmethod as infrequently as possible.\n"
  code_samples: []
  parameters:
  - name: name
    type: string
    default: null
    summary: 'The name of the collision group to unregister.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: 'This method has been superseded by

    `Class.WorldRoot:UnregisterCollisionGroup()` which should be used for all

    new work.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Physics
  simulationAccess: true
