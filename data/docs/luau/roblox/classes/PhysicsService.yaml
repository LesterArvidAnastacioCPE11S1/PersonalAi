  summary: 'Returns whether the part is in the collision group.

    '
  description: 'Returns whether the specified part is in the specified collision group.

    This method will throw a runtime error in the following circumstances:


    - The specified group does not exist.

    - The specified part is not a `Class.BasePart`.

    '
