name: PhysicsService
type: class
memory_category: Instances
summary: 'Service that provides methods for creating and managing collision groups,

  which control whether sets of `Class.BasePart|BaseParts` collide with each

  other.

  '
description: '`Class.PhysicsService` primarily contains methods for working with **collision

  groups** which define whether a set of parts may or may not collide with parts

  in other collision groups. You can register a collision group through

  `Class.PhysicsService:RegisterCollisionGroup()|RegisterCollisionGroup()` and

  assign parts to it by setting those parts''

  `Class.BasePart.CollisionGroup|CollisionGroup` property to the **name** of the

  collision group.


  Creating, deleting, and modifying collision relationships between collision

  groups is limited to server-side `Class.Script|Scripts`.


  See

  [Collision Filtering](../../../workspace/collisions.md#collision-filtering)

  for usage details in Studio and within scripts.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
deprecation_message: 'This service has been deprecated in favor of per-world collision
  group

  configuration through `Class.WorldRoot` which should be used for collision

  group management. Existing `Class.PhysicsService` calls will forward to

  `Class.Workspace`.

  '
properties: []
methods:
