name: VelocityMotor
type: class
memory_category: BaseParts
summary: 'A `Class.Motor`-like `Class.JointInstance` that forms its connection using
  a

  `Class.MotorFeature` and a `Class.Hole`.

  '
description: "The VelocityMotor is a special type of joint that works similarly to\
  \ a\n`Class.Motor`, but it uses a `Class.MotorFeature` and a `Class.Hole` to create\n\
  the connection. In order for this object to work correctly:\n\n- The VelocityMotor\
  \ must be parented inside of a `Class.MotorFeature`\n- The `Class.MotorFeature`\
  \ needs to be parented inside of a `Class.BasePart`\n- A `Class.Hole` needs to be\
  \ parented inside of another `Class.BasePart`\n- The VelocityMotor's `Class.VelocityMotor.Hole`\
  \ property should be assigned\n  to the hole you parented inside of the other part.\n"
