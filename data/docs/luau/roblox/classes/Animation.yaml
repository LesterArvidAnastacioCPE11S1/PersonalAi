name: Animation
type: class
memory_category: Animation
summary: 'References an animation asset which can be loaded by an

  `Class.AnimationController`.

  '
description: "An object that references an animation asset\n(`Class.Animation.AnimationId|AnimationId`)\
  \ which can be loaded by an\n`Class.AnimationController`.\n\n#### Loading an Animation\
  \ on Client or Server\n\nIn order for `Class.AnimationTrack|AnimationTracks` to\
  \ replicate correctly,\nit's important to know when they should be loaded on the\
  \ client or on the\nserver:\n\n- If an `Class.Animator` is a descendant of a `Class.Humanoid`\
  \ or\n  `Class.AnimationController` in a player's `Class.Player.Character`,\n  animations\
  \ started on that player's client will be replicated to the server\n  and other\
  \ clients.\n\n- If the `Class.Animator` is **not** a descendant of a player character,\
  \ its\n  animations must be loaded and started on the server to replicate.\n\nThe\
  \ `Class.Animator` object must be initially created on the server and\nreplicated\
  \ to clients for animation replication to work at all. If an\n`Class.Animator` is\
  \ created locally, then\n`Class.AnimationTrack|AnimationTracks` loaded with that\
  \ `Class.Animator` will\nnot replicate.\n\nSee also [Animation Editor](../../../animation/editor.md)\
  \ and\n[Using Animations](../../../animation/using.md) to learn how to create and\
  \ add\npre-built or custom animations to your game.\n"
