properties:
- name: Animation.AnimationContent
  summary: 'A reference to the animation asset associated with this `Class.Animation`.

    '
  description: 'The `Datatype.Content`-typed reference to the animation asset for
    this

    `Class.Animation`. It is the underlying storage for

    `Class.Animation.AnimationId|AnimationId` and accepts animation asset

    URIs; setting either property updates the other.


    Requires `Animation` security and is not accessible from regular scripts.

    For most use cases, use `Class.Animation.AnimationId|AnimationId` instead,

    which provides unrestricted access to the same animation reference as a

    string content ID.

    '
