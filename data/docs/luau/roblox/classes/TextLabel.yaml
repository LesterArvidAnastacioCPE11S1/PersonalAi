- name: TextLabel.TextScaled
  summary: 'Changes whether text is resized to fit within the `Class.TextLabel`.

    '
  description: "This property determines whether text is scaled so that it fills the\n\
    label's entire space. When enabled, `Class.TextLabel.TextSize|TextSize` is\nignored\
    \ and `Class.TextLabel.TextWrapped|TextWrapped` is automatically\nenabled. This\
    \ property is useful for rendering text elements within\n`Class.BillboardGui|BillboardGuis`.\
    \ When this property is used for\n[on-screen UI](../../../ui/on-screen-containers.md),\
    \ it may be helpful to\nuse a `Class.UITextSizeConstraint` to restrict the range\
    \ of possible text\nsizes.\n\n##### Automatic Sizing\n\nIt's recommended that\
    \ you avoid usage of\n`Class.TextLabel.TextScaled|TextScaled` and adjust UI to\
    \ take advantage of\nthe `Class.GuiObject.AutomaticSize|AutomaticSize` property\
    \ instead. Here\nare the core differences between the two properties:\n\n- `Class.TextLabel.TextScaled|TextScaled`\
    \ scales the content (text) to\n  accommodate the UI. Without careful consideration,\
    \ some text may become\n  unreadable if scaled too small.\n\n- `Class.GuiObject.AutomaticSize|AutomaticSize`\
    \ resizes the UI to\n  accommodate content while maintaining a consistent font\
    \ size. For more\n  information, see [here](../../../ui/size-modifiers.md#automatic-sizing).\n\
    \nAdditionally, it's recommended that you avoid applying both\n`Class.GuiObject.AutomaticSize|AutomaticSize`\
    \ and\n`Class.TextLabel.TextScaled|TextScaled` and to the same `Class.TextLabel`.\n\
    `Class.GuiObject.AutomaticSize|AutomaticSize` determines the maximum\namount of\
    \ available space that a `Class.GuiObject` can use (in this case,\ntext), while\
    \ `Class.TextLabel.TextScaled|TextScaled` uses the available\nspace determined\
    \ by `Class.GuiObject.AutomaticSize|AutomaticSize` to scale\nthe font size up\
    \ to the maximum font size (100) if there are no size\nconstraints.\n"
  code_samples: []
  type: boolean
