methods:
- name: TestService:ListTests
  summary: 'Returns every registered test.

    '
  description: 'Returns every registered test as a `Class.TestCase`, in the order
    the

    tests were registered, including tests registered with

    `Class.TestSuite:RegisterTest()`. Use it to see what

    `Class.TestService:RunTestsAsync()|RunTestsAsync()` can run, or to build a

    test picker.


    Throws an error if `Class.TestService.Enabled|Enabled` is `false`.

    '
  code_samples: []
  parameters: []
  returns:
  - type: Array
    summary: 'An array of `Class.TestCase` objects in the order they were

      registered.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: TestService:RegisterSuite
  summary: 'Creates a named group of tests that share tags and a timeout.

    '
  description: "Creates a suite: a named group of tests. Register tests in it with\n\
    `Class.TestSuite:RegisterTest()`. Every test in the suite gets the suite's\ntags\
    \ and timeout, and you can select the whole suite with the `Suite`\nfilter of\
    \ `Class.TestService:RunTestsAsync()|RunTestsAsync()`.\n\nThe `options` table\
    \ accepts:\n\n- `Tags`: an array of strings. Tests in the suite get these tags\
    \ in\n  addition to their own.\n- `TimeoutSec`: the default timeout for tests\
    \ in the suite, from `0` to\n  `86400` seconds. Defaults to `30`. A test can override\
    \ it with its own\n  `TimeoutSec`.\n\nCalling `Class.TestService:RegisterSuite()|RegisterSuite()`\
    \ again with the\nsame name and no `options` (or an empty table) returns the existing\
    \ suite,\nso several scripts can add tests to one suite. If the second call passes\n\
    `options`, they must match the original (tags in any order), with any\nfield you\
    \ leave out counting as its default, or the call throws an error.\n\nThrows an\
    \ error if `Class.TestService.Enabled|Enabled` is `false`, if\n`suiteName` is\
    \ empty, if `Tags` isn't an array of strings, or if\n`TimeoutSec` isn't a number\
    \ from `0` to `86400`.\n"
  code_samples: []
  parameters:
  - name: suiteName
    type: string
    default: null
    summary: 'The name of the suite. Must not be empty.

      '
  - name: options
    type: Dictionary
    default: nil
    summary: 'Optional settings for the suite: `Tags` (an array of strings) and

      `TimeoutSec` (a number of seconds).

      '
  returns:
  - type: TestSuite
    summary: 'The `Class.TestSuite`, which you use to register tests in it.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: TestService:RegisterTest
  summary: 'Registers a test so `Class.TestService:RunTestsAsync()|RunTestsAsync()`

    can run it.

    '
  description: "Registers a test. The test doesn't run until you call\n`Class.TestService:RunTestsAsync()|RunTestsAsync()`.\
    \ Tests registered with\nthis method belong to the `Default` suite; to put a test\
    \ in your own\nsuite, use `Class.TestSuite:RegisterTest()`.\n\nWhen the test runs,\
    \ `callback` is called with two arguments: the test's\n`Class.TestCase`, which\
    \ you use to check values, and a\n`Class.TestExecutionContext`, which you use\
    \ to skip the test. The callback\ncan yield.\n\nThe `options` table accepts:\n\
    \n- `Tags`: an array of strings that you can select tests by with the\n  `IncludeTags`\
    \ filter of\n  `Class.TestService:RunTestsAsync()|RunTestsAsync()`.\n- `TimeoutSec`:\
    \ how long the test can run, from `0` to `86400` seconds.\n  Defaults to `30`.\
    \ A test that runs longer is reported as\n  `Enum.TestCaseStatus.TimedOut`. If\
    \ the test is yielding when its time\n  runs out, it's stopped there, though threads\
    \ it spawned keep running. If\n  it's running without yielding, it's reported\
    \ as timed out when it\n  finishes. Set `TimeoutSec` to `0` for no per-test timeout.\
    \ Either way,\n  the place's script timeout still stops a test that runs too long\
    \ without\n  yielding, and that test is reported as timed out too.\n\nEach test\
    \ in a suite must have a unique name. Throws an error if\n`Class.TestService.Enabled|Enabled`\
    \ is `false`, if `testName` is empty or\nis already registered in the suite, if\
    \ `Tags` isn't an array of strings,\nor if `TimeoutSec` isn't a number from `0`\
    \ to `86400`.\n\n```lua\nlocal TestService = game:GetService(\"TestService\")\n\
    \nTestService:RegisterTest(\"spawn location exists\", function(test)\n\tlocal\
    \ spawnLocation = workspace:FindFirstChildWhichIsA(\"SpawnLocation\")\n\ttest:Check(spawnLocation\
    \ ~= nil, true, \"the place needs a SpawnLocation\")\nend, { Tags = { \"smoke\"\
    \ } })\n```\n"
  code_samples: []
  parameters:
  - name: testName
    type: string
    default: null
    summary: 'The name of the test. Must not be empty.

      '
  - name: callback
    type: Function
    default: null
    summary: 'The function that runs the test. It receives the test''s

      `Class.TestCase` and a `Class.TestExecutionContext`.

      '
  - name: options
    type: Dictionary
    default: nil
    summary: 'Optional settings for the test: `Tags` (an array of strings) and

      `TimeoutSec` (a number of seconds).

      '
  returns:
  - type: TestCase
    summary: 'The `TestCase` for the registered test.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: TestService:ResetTestRegistry
  summary: 'Removes every registered test and suite.

    '
  description: 'Removes every registered test and suite, so you can register a fresh
    set.

    `Class.TestCase` objects you already hold stay readable but no longer run.

    A `Class.TestSuite` from before the reset still registers tests with its

    old settings, but it''s no longer the registered suite of that name. Call

    `Class.TestService:RegisterSuite()|RegisterSuite()` again to get the

    current one.


    Throws an error if `Class.TestService.Enabled|Enabled` is `false` or if a

    test run is in progress.

    '
  code_samples: []
  parameters: []
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: TestService:RunTestsAsync
  summary: 'Runs the registered tests one at a time and yields until they finish.

    '
  description: "Runs the registered tests one at a time, in the order they were\n\
    registered, and yields until the last one finishes. It returns a\n`Class.TestRunResult`\
    \ and prints a summary of the run to the **Output**\nwindow.\n\nThe optional `filter`\
    \ table selects which tests run. A test runs only if\nit matches every field you\
    \ set:\n\n- `TestId`: a string. Matches the test with exactly this\n  `Class.TestCase.TestId`.\n\
    - `Suite`: a string. Matches tests in the suite with this name.\n- `NamePattern`:\
    \ a string. Matches tests whose name contains this text.\n  The match is case-sensitive\
    \ and is plain text, not a string pattern.\n- `IncludeTags`: an array of strings.\
    \ Matches tests that have at least one\n  of these tags.\n\n```lua\n-- Run the\
    \ \"gameplay\" tests in the Door suite\nlocal result = TestService:RunTestsAsync({\
    \ Suite = \"Door\", IncludeTags = { \"gameplay\" } })\n```\n\nThe run uses the\
    \ tests that were registered when it started; tests\nregistered during the run\
    \ wait for the next one. Only one run can be in\nprogress at a time.\n\nThrows\
    \ an error if `Class.TestService.Enabled|Enabled` is `false`, if\nanother run\
    \ is in progress, if `filter` has a field not listed above, if a\nfield has the\
    \ wrong type, or if `TestId`, `Suite`, or `IncludeTags` is\nempty.\n"
  code_samples: []
  parameters:
  - name: filter
    type: Dictionary
    default: nil
    summary: 'Optional fields that select which tests run: `TestId`, `Suite`,

      `NamePattern`, and `IncludeTags`. Omit it to run every registered

      test.

      '
  returns:
  - type: TestRunResult
    summary: 'A `Class.TestRunResult` with the outcome of the run and of each test.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
