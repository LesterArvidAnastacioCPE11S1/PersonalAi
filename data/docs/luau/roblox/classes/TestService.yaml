events:
- name: TestService.TestRegistryChanged
  summary: 'Fires after tests or suites are registered or the registry is reset.

    '
  description: "Fires after tests or suites are registered or after\n`Class.TestService:ResetTestRegistry()|ResetTestRegistry()`\
    \ is called. It\nfires at most once per `Class.RunService.Heartbeat`, so a script\
    \ that\nregisters many tests at once doesn't flood listeners. Call\n`Class.TestService:ListTests()|ListTests()`\
    \ to see the current tests.\n\n```lua\nlocal TestService = game:GetService(\"\
    TestService\")\n\nTestService.TestRegistryChanged:Connect(function()\n\tfor _,\
    \ test in TestService:ListTests() do\n\t\tprint(test.TestId, table.concat(test:GetTestTags(),\
    \ \", \"))\n\tend\nend)\n```\n"
  code_samples: []
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities: []
