name: TestService
type: class
memory_category: Instances
summary: 'Registers and runs automated tests written in Luau while playtesting your

  experience.

  '
description: "`TestService` lets you write automated tests for your experience in\
  \ Luau and\nrun them inside a live playtest, against the same scripts, physics,\
  \ and\nreplication your players get. Register each test with a callback, run them\n\
  with `Class.TestService:RunTestsAsync()|RunTestsAsync()`, and read the\nreturned\
  \ `Class.TestRunResult` to see what passed and what failed.\n\n#### Where tests\
  \ can run\n\nThe test APIs only work while `TestService.Enabled` is `true`. That's\
  \ the case\nwhile playtesting in Studio (**Play**, **Play Here**, or **Run**) and\
  \ on a\nTeam Test server. `Class.TestService.Enabled|Enabled` is `false` in Edit\
  \ mode\n(including the command bar while you're editing) and in live servers, and\n\
  there every method below throws an error. Tests can't run in a published\nexperience.\n\
  \n#### Writing a test\n\nA test is a callback registered with\n`Class.TestService:RegisterTest()|RegisterTest()`.\
  \ The callback receives the\ntest's `Class.TestCase` and a `Class.TestExecutionContext`.\
  \ Inside the\ncallback:\n\n- `Class.TestCase:Check()` compares a value to the one\
  \ you expect. A mismatch\n  is recorded as a failure, and the test keeps running.\n\
  - `Class.TestCase:Require()` does the same comparison, but a mismatch also\n  stops\
  \ the test right away. Use it when the rest of the test can't continue,\n  such\
  \ as when a part it needs doesn't exist.\n- `Class.TestExecutionContext:Skip()`\
  \ stops the test and records it as\n  skipped, for example when it doesn't apply\
  \ on the current device. If a check\n  fails in the test, or the callback catches\
  \ the skip and then throws a\n  different error, the test fails instead.\n\nA test\
  \ passes if its callback returns with no failed checks. It fails if any\ncheck failed\
  \ or if the callback throws an error. A test can yield (for\nexample, with `task.wait()`\
  \ or by waiting on an event), and it times out if it\nruns longer than its `Class.TestCase.TimeoutSec`.\n\
  \nGroup related tests with `Class.TestService:RegisterSuite()|RegisterSuite()`.\n\
  Tests in a suite inherit the suite's tags and timeout.\n\n```lua\n-- Script in ServerScriptService\n\
  local TestService = game:GetService(\"TestService\")\nlocal Workspace = game:GetService(\"\
  Workspace\")\n\nif not TestService.Enabled then\n\treturn -- Not playtesting\nend\n\
  \nlocal doorSuite = TestService:RegisterSuite(\"Door\", { Tags = { \"gameplay\"\
  \ } })\n\ndoorSuite:RegisterTest(\"starts closed\", function(test)\n\tlocal door\
  \ = Workspace:FindFirstChild(\"Door\")\n\ttest:Require(door ~= nil, true, \"Workspace.Door\
  \ should exist\")\n\ttest:Check(door:GetAttribute(\"Open\"), false)\nend)\n\ndoorSuite:RegisterTest(\"\
  opens when triggered\", function(test)\n\tlocal door = Workspace.Door\n\tdoor:SetAttribute(\"\
  Open\", true)\n\ttask.wait(0.5) -- Let the door animate\n\ttest:Check(door.CanCollide,\
  \ false, \"an open door shouldn't block players\")\nend, { TimeoutSec = 5 })\n\n\
  local result = TestService:RunTestsAsync()\nprint(result.Summary) -- 2 passed, 0\
  \ failed, 0 skipped (2 total) in 512ms\n```\n\n#### Reading results\n\n`Class.TestService:RunTestsAsync()|RunTestsAsync()`\
  \ yields until every test it\nselects has finished and returns a `Class.TestRunResult`.\
  \ Check its\n`Class.TestRunResult.Status` against `Enum.TestRunStatus.Pass` to decide\
  \ if\nthe run passed, and call `Class.TestRunResult:GetTests()` for a\n`Class.TestResult`\
  \ per test. Each failed check is a `Class.TestFailure` with\nthe expected and actual\
  \ values and the line it came from.\n\n```lua\nlocal result = TestService:RunTestsAsync({\
  \ Suite = \"Door\" })\nif result.Status ~= Enum.TestRunStatus.Pass then\n\tfor _,\
  \ test in result:GetTests() do\n\t\tif test.Status == Enum.TestCaseStatus.Fail or\
  \ test.Status == Enum.TestCaseStatus.TimedOut then\n\t\t\twarn(test.TestId, test.UncaughtError)\n\
  \t\t\tfor _, failure in test:GetFailures() do\n\t\t\t\twarn(`  line {failure.Line}:\
  \ {failure.Message}`)\n\t\t\tend\n\t\tend\n\tend\nend\n```\n\n`Class.TestService:RunTestsAsync()|RunTestsAsync()`\
  \ also prints a summary of\nthe run to the **Output** window, followed by the `Class.TestResult.TestId`\
  \ of\neach test that failed or timed out and why: its timeout, its uncaught error,\n\
  or its first failed check.\n\n#### Test IDs\n\nEach test has a `Class.TestCase.TestId`\
  \ that identifies it in results and\nfilters. It's built from the suite and test\
  \ names, but treat it as an opaque\nstring: read it from `Class.TestCase.TestId`\
  \ or `Class.TestResult.TestId`\nrather than building it yourself.\n"
