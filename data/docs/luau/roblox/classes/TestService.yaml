- name: TestService.Enabled
  summary: 'Whether tests can be registered and run in the current session.

    '
  description: 'Whether tests can be registered and run in the current session. This
    is

    `true` while playtesting in Studio and on a Team Test server. It''s `false`

    in Edit mode (including the command bar while you''re editing) and in live

    servers.


    While `Class.TestService.Enabled|Enabled` is `false`,

    `Class.TestService:RegisterTest()|RegisterTest()`,

    `Class.TestService:RegisterSuite()|RegisterSuite()`,

    `Class.TestService:RunTestsAsync()|RunTestsAsync()`,

    `Class.TestService:ListTests()|ListTests()`, and

    `Class.TestService:ResetTestRegistry()|ResetTestRegistry()` throw an

    error, so check it before registering tests from a script that also runs

    in live servers.

    '
