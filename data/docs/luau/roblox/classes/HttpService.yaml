- name: HttpService:RequestAsync
  summary: 'Sends an HTTP request using any HTTP method given a dictionary of

    information.

    '
  description: "This method sends an HTTP request using a dictionary to specify the\n\
    request data, such as the target URL, method, headers, and request body\ndata.\
    \ It returns a dictionary that describes the response data received.\nOptionally,\
    \ the request can be compressed using `Enum.HttpCompression`.\n\n##### Request\
    \ dictionary fields\n\n<table>\n    <thead>\n        <tr>\n            <th>Name</th>\n\
    \            <th>Type</th>\n            <th>Required</th>\n            <th>Description</th>\n\
    \        </tr>\n    </thead>\n    <tbody>\n        <tr>\n            <td><code>Url</code></td>\n\
    \            <td>String</td>\n            <td>yes</td>\n            <td>The target\
    \ URL for this request. Must use <code>http</code> or <code>https</code> protocols.</td>\n\
    \        </tr>\n        <tr>\n            <td><code>Method</code></td>\n     \
    \       <td>String</td>\n            <td>no</td>\n            <td>The HTTP method\
    \ being used by this request, most often <code>GET</code> or <code>POST</code>.</td>\n\
    \        </tr>\n        <tr>\n            <td><code>Headers</code></td>\n    \
    \        <td>Dictionary</td>\n            <td>no</td>\n            <td>A dictionary\
    \ of headers to be used with this request. Most HTTP headers are accepted here,\
    \ but not all.</td>\n        </tr>\n        <tr>\n            <td><code>Body</code></td>\n\
    \            <td>String</td>\n            <td>no</td>\n            <td>The request\
    \ body. Can be any string, including binary data. Must be excluded when using\
    \ the <code>GET</code> or <code>HEAD</code> HTTP methods. It might be necessary\
    \ to specify the <code>Content-Type</code> header when sending JSON or other formats.</td>\n\
    \        </tr>\n        <tr>\n            <td><code>Compress</code></td>\n   \
    \         <td><code>Enum.HttpCompression</code></td>\n            <td>no</td>\n\
    \            <td>An optional compression field that will compress the data in\
    \ the request. The value can either be <code>Enum.HttpCompression.None</code>\
    \ or <code>Enum.HttpCompression.Gzip</code>.</td>\n        </tr>\n        <tr>\n\
    \            <td><code>Timeout</code></td>\n            <td>Integer</td>\n   \
    \         <td>no</td>\n            <td>An optional timeout value in seconds to\
    \ make requests time out more quickly. Values must be greater than zero and no\
    \ greater than the default request timeout. This can be useful when debugging\
    \ hanging requests.</td>\n        </tr>\n    </tbody>\n</table>\n\n##### Supported\
    \ HTTP methods\n\nThe HTTP request methods specify the purpose of the request\
    \ being made and\nwhat is expected if the request is successful. For instance,\
    \ the `GET`\nrequest method tells the server at the requested address that a resource\n\
    is being requested and, if it succeeds, the resource at that address will\nbe\
    \ returned. Similarly, the `HEAD` request method does the same except the\nserver\
    \ knows to return a response without a `Body` element.\n\n<table>\n    <thead>\n\
    \        <tr>\n            <th>Method</th>\n            <th>Description</th>\n\
    \            <th>Safe</th>\n        </tr>\n    </thead>\n    <tbody>\n       \
    \ <tr>\n            <td><code>GET</code> &nbsp;<a href=\"https://developer.mozilla.org/docs/Web/HTTP/Methods/GET\"\
    >&#9432;</a></td>\n            <td>The <code>GET</code> method requests the resource\
    \ at the specified address. Does not support use of the <code>Body</code> parameter.</td>\n\
    \            <td>Yes</td>\n        </tr>\n        <tr>\n            <td><code>HEAD</code>\
    \ &nbsp;<a href=\"https://developer.mozilla.org/docs/Web/HTTP/Methods/HEAD\">&#9432;</a></td>\n\
    \            <td>The <code>HEAD</code> method requests a response identical to\
    \ a <code>GET</code> request, but with no response body. Does not support use\
    \ of the <code>Body</code> parameter.</td>\n            <td>Yes</td>\n       \
    \ </tr>\n        <tr>\n            <td><code>POST</code> &nbsp;<a href=\"https://developer.mozilla.org/docs/Web/HTTP/Methods/POST\"\
    >&#9432;</a></td>\n            <td>The <code>POST</code> method submits the supplied\
    \ <code>Body</code> data to the requested address.</td>\n            <td>No</td>\n\
    \        </tr>\n        <tr>\n            <td><code>PUT</code> &nbsp;<a href=\"\
    https://developer.mozilla.org/docs/Web/HTTP/Methods/PUT\">&#9432;</a></td>\n \
    \           <td>The <code>PUT</code> method replaces all current iterations of\
    \ the resource specified within the supplied <code>Body</code> data.</td>\n  \
    \          <td>No</td>\n        </tr>\n        <tr>\n            <td><code>DELETE</code>\
    \ &nbsp;<a href=\"https://developer.mozilla.org/docs/Web/HTTP/Methods/DELETE\"\
    >&#9432;</a></td>\n            <td>The <code>DELETE</code> method deletes the\
    \ resource specified in the supplied <code>Body</code> data at the requested address.</td>\n\
    \            <td>No</td>\n        </tr>\n        <tr>\n            <td><code>OPTIONS</code>&nbsp;&nbsp;<a\
    \ href=\"https://developer.mozilla.org/docs/Web/HTTP/Methods/OPTIONS\">&#9432;</a></td>\n\
    \            <td>The <code>OPTIONS</code> method requests the permitted communication\
    \ options for the supplied address.</td>\n            <td>Yes</td>\n        </tr>\n\
    \        <tr>\n            <td><code>TRACE</code> &nbsp;<a href=\"https://developer.mozilla.org/docs/Web/HTTP/Methods/TRACE\"\
    >&#9432;</a></td>\n            <td>The <code>TRACE</code> method performs a message\
    \ loop-back test along the path to the resource specified in the supplied <code>Body</code>\
    \ data.</td>\n            <td>Yes</td>\n        </tr>\n        <tr>\n        \
    \    <td><code>PATCH</code> &nbsp;<a href=\"https://developer.mozilla.org/docs/Web/HTTP/Methods/PATCH\"\
    >&#9432;</a></td>\n            <td>The <code>PATCH</code> method applies partial\
    \ changes to the resource specified in the supplied <code>Body</code> data at\
    \ the requested address.</td>\n            <td>No</td>\n        </tr>\n    </tbody>\n\
    </table>\n\n##### HTTP headers\n\nIn the request dictionary, you can specify custom\
    \ HTTP headers to use in\nthe request. However, some headers cannot be specified.\
    \ For example,\n`Content-Length` is determined from the request body. `User-Agent`\
    \ and\n`Roblox-Id` are locked by Roblox. Other headers like `Accept` or\n`Cache-Control`\
    \ use default values but can be overridden. More commonly,\nsome REST APIs may\
    \ require API keys or other service authentication to be\nspecified in request\
    \ headers.\n\nThe `RequestAsync()` method does not detect the format of body content.\n\
    Many web servers require the `Content-Type` header be set appropriately\nwhen\
    \ sending certain formats. Other methods of `Class.HttpService` use the\n`Enum.HttpContentType`\
    \ enum; for this method set the `Content-Type` header\nappropriately: `text/plain`,\
    \ `text/xml`, `application/xml`,\n`application/json` or `application/x-www-form-urlencoded`\
    \ are replacement\n`Content-Type` header values for the respective enum values.\n\
    \n##### Response dictionary fields\n\n`RequestAsync()` returns a dictionary containing\
    \ the following fields:\n\n<table>\n    <thead>\n        <tr>\n            <th>Name</th>\n\
    \            <th>Type</th>\n            <th>Description</th>\n        </tr>\n\
    \    </thead>\n    <tbody>\n        <tr>\n            <td><code>Success</code></td>\n\
    \            <td>Boolean</td>\n            <td>The success status of the request.\
    \ This is true if and only if the <code>StatusCode</code> lies within the range\
    \ <code>200</code>-<code>299</code>.</td>\n        </tr>\n        <tr>\n     \
    \       <td><code>StatusCode</code></td>\n            <td>Integer</td>\n     \
    \       <td>The HTTP response code identifying the status of the response.</td>\n\
    \        </tr>\n        <tr>\n            <td><code>StatusMessage</code></td>\n\
    \            <td>String</td>\n            <td>The status message that was sent\
    \ back.</td>\n        </tr>\n        <tr>\n            <td><code>Headers</code></td>\n\
    \            <td>Dictionary</td>\n            <td>A dictionary of headers that\
    \ were set in this response.</td>\n        </tr>\n        <tr>\n            <td><code>Body</code></td>\n\
    \            <td></td>\n            <td>The request body (content) received in\
    \ the response.</td>\n        </tr>\n    </tbody>\n</table>\n\n##### Error Cases\n\
    \n`RequestAsync()` raises an error if the response times out or if the\ntarget\
    \ server rejects the request. If a web service goes down for some\nreason, it\
    \ can cause scripts that use this method to stop functioning\naltogether. It is\
    \ often a good idea to wrap calls to this method in\n`Global.LuaGlobals.pcall()`\
    \ and gracefully handle failure cases if the\nrequired information isn't available.\n\
    \n##### Limitations\n\nThe current limitation for sending and receiving **external**\
    \ HTTP\nrequests is 500 requests per minute. There is also a separate limit of\n\
    2500 requests per minute for\n[Open Cloud requests](../../../cloud-services/http-service.md#use-with-open-cloud).\n\
    Requests over these thresholds will fail.\n"
  code_samples:
  - sending-an-http-request
  - OpenCloud-via-HttpService
  parameters:
  - name: requestOptions
    type: Dictionary
    default: null
    summary: 'A dictionary containing information to be requested from the server

      specified.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary containing response information from the server

      specified.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Network
- name: HttpService:UrlEncode
  summary: 'Replaces URL-unsafe characters with ''%'' and two hexadecimal characters.

    '
  description: 'This method

    [percent-encodes](https://en.wikipedia.org/wiki/Percent-encoding) a given

    string so that reserved characters properly encoded with `%` and two

    hexadecimal characters.


    This is useful when formatting URLs for use with

    `Class.HttpService:GetAsync()`/`Class.HttpService:PostAsync()`, or `POST`

    data of the media type `application/x-www-form-urlencoded`

    (`Enum.HttpContentType|Enum.HttpContentType.ApplicationUrlEncoded`).


    For instance, when you encode the URL `https://www.roblox.com/discover#/`,

    this method returns `https%3A%2F%2Fwww%2Eroblox%2Ecom%2Fdiscover%23%2F`.

    '
  code_samples:
  - HttpService-UrlEncode
  - HttpService-Pastebin
  parameters:
  - name: input
    type: string
    default: null
    summary: 'The string (URL) to encode.

      '
  returns:
  - type: string
    summary: 'The encoded string.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
  - Network
