methods:
- name: HttpService:CreateWebStreamClient
  summary: 'Creates a client that opens a persistent connection to stream data.

    '
  description: 'This method creates a client that establishes a long-lived connection
    to

    servers utilizing various streaming technologies, such as

    [Server-Sent Events (SSE)](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events).

    After the connection is established, the client fires signals that you can

    connect callback functions to with `Datatype.RBXScriptConnection`. Use

    these callbacks to process messages as soon as they arrive, as well as

    respond to open, close, and error events.


    There is a limit of four total clients allowed at one time. Close streams

    that you no longer need with `Class.WebStreamClient:Close()`. When the

    stream is no longer needed, you should disconnect any associated

    `Datatype.RBXScriptConnection|RBXScriptConnections` to avoid memory leaks.


    This method is available in Studio only. If you use it inside scripts,

    make sure to remove any references before publishing the experience. We

    encourage you to create plugins with this feature for reusability and ease

    of use.

    '
  code_samples:
  - HttpService-CreateSSEWebStreamClient
  - HttpService-CreateRawStreamWebStreamClient
  parameters:
  - name: streamClientType
    type: WebStreamClientType
    default: null
    summary: 'The type of streaming connection to intiialize the client with.

      '
  - name: requestOptions
    type: Dictionary
    default: null
    summary: 'A dictionary containing information to be requested from the server.

      It is identical to `requestOptions` in

      `Class.HttpService:RequestAsync()`.

      '
  returns:
  - type: WebStreamClient
    summary: 'A stateful client that emits events in the stream lifecycle.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Network
- name: HttpService:GenerateGUID
  summary: 'Generates a UUID/GUID random string, optionally with curly braces.

    '
  description: 'This method generates a **random universally unique identifier**

    ([UUID](https://en.wikipedia.org/wiki/Universally_unique_identifier))

    string. The sixteen octets of a UUID are represented as 32 hexadecimal

    (base&nbsp;16) digits, displayed in five groups separated by hyphens in

    the form `8-4-4-4-12` for a total of 36 characters, for example

    `123e4567-e89b-12d3-a456-426655440000`.


    The UUID specification used is

    [Version 4 (random)](<https://en.wikipedia.org/wiki/Universally_unique_identifier#Version_4_(random)>),

    variant 1 (DCE 1.1, ISO/IEC 11578:1996). UUIDs of this version are the

    most commonly used due to their simplicity, as they are entirely randomly

    generated. Note that this version does not have certain features that

    other UUID versions have, such as encoded timestamps, MAC addresses, or

    time-based sorting like [UUIDv7](https://uuid7.com/) or

    [ULID](https://github.com/ulid/spec).


    There are over 5.3&times;10<sup>36</sup> unique v4 UUIDs, in which the

    probability of finding a duplicate within 103 trillion UUIDs is one in a

    billion.


    The `wrapInCurlyBraces` argument determines whether the returned string is

    wrapped in curly braces (`{}`). For instance:


    - `true`: `{94b717b2-d54f-4340-a504-bd809ef5bf5c}`

    - `false`: `db454790-7563-44ed-ab4b-397ff5df737b`


    This method can be used regardless of whether HTTP requests are enabled.

    '
  code_samples:
  - HttpService-GenerateGUID
  parameters:
  - name: wrapInCurlyBraces
    type: boolean
    default: true
    summary: 'Whether the returned string should be wrapped in curly braces (`{}`).

      '
  returns:
  - type: string
    summary: 'The randomly generated UUID.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities: []
- name: HttpService:GetAsync
  summary: 'Sends an HTTP `GET` request.

    '
  description: 'This method sends an HTTP `GET` request. It functions similarly to

    `Class.HttpService:RequestAsync()|RequestAsync()` except that it accepts

    HTTP request parameters as method parameters instead of a single

    dictionary and returns only the body of the HTTP response. Generally, this

    method is useful only as a shorthand and

    `Class.HttpService:RequestAsync()|RequestAsync()` should be used in most

    cases.


    When `true`, the `nocache` parameter prevents this method from caching

    results from previous calls with the same `url`.


    The `url` parameter also accepts a `Datatype.Secret` value; use

    `Class.HttpService:GetSecret()|GetSecret` combined with

    `Datatype.Secret:AddPrefix()|AddPrefix` and

    `Datatype.Secret:AddSuffix()|AddSuffix` to safely embed secret credentials

    (such as API keys) directly in the URL without exposing their values.

    '
  code_samples:
  - Astronauts-in-Space
  - International-Space-Station
  parameters:
  - name: url
    type: Variant
    default: null
    summary: 'The web address you are requesting data from.

      '
  - name: nocache
    type: boolean
    default: false
    summary: 'Whether the request stores (caches) the response.

      '
  - name: headers
    type: Variant
    default: null
    summary: 'Used to specify some HTTP request headers.

      '
  returns:
  - type: string
    summary: 'The GET request''s response body.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Network
- name: HttpService:GetSecret
  summary: 'Returns a `Datatype.Secret` from the secrets store.

    '
  description: 'This method returns a value previously added to the secrets store
    for the

    experience. The secret content is not printable and not available when the

    experience runs locally.


    The returned `Datatype.Secret` can be transformed using built-in methods

    such as `Datatype.Secret:AddPrefix()`. It is expected to be sent as a part

    of an HTTP request.


    For more information, see the

    [usage guide](../../../cloud-services/secrets.md).

    '
  code_samples: []
  parameters:
  - name: key
    type: string
    default: null
    summary: 'The name of the secret to fetch, matching the identifier under which

      it was added to the experience''s secrets store.

      '
  returns:
  - type: Secret
    summary: 'A `Datatype.Secret` wrapping the stored value associated with `key`.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities:
