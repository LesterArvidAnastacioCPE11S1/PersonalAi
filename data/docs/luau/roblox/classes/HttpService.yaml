- name: HttpService:JSONDecode
  summary: 'Decodes a JSON string into a Luau table.

    '
  description: "This method transforms a JSON object or array into a Luau\n[table](../../../luau/tables.md)\
    \ with the following characteristics:\n\n- Keys of the table are strings or numbers\
    \ but not both. If a JSON object\n  contains both, string keys are ignored.\n\
    - An empty JSON object generates an empty Luau table (`{}`).\n- If the `input`\
    \ string is not a valid JSON object, this method will throw\n  an error.\n\nTo\
    \ encode a Luau table into a JSON object, use the\n`Class.HttpService:JSONEncode()`\
    \ method.\n\nThis method can be used regardless of whether HTTP requests are enabled.\n"
  code_samples:
  - HttpService-JSONDecode
  parameters:
  - name: input
    type: string
    default: null
    summary: 'The JSON object being decoded.

      '
  returns:
  - type: Variant
    summary: 'The decoded JSON object as a Luau table.

      '
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities: []
- name: HttpService:JSONEncode
  summary: 'Generate a JSON string from a Luau table.

    '
  description: "This method transforms a Luau [table](../../../luau/tables.md) into\
    \ a JSON\nobject or array based on the following guidelines:\n\n- Keys of the\
    \ table must be either strings or numbers. If a table contains\n  both, an array\
    \ takes priority (string keys are ignored).\n- An empty Luau table (`{}`) generates\
    \ an empty JSON array (e.g. `[]`).\n- Whether passing a dictionary table or a\
    \ numerically indexed table, avoid\n  `nil` values for any index.\n- Cyclic table\
    \ references cause an error.\n\nThis method allows values such as `inf` and `nan`\
    \ which are not valid\nJSON. This may cause problems if you want to use the outputted\
    \ JSON\nelsewhere.\n\nThis method also accepts `Library.buffer|buffers` up to\
    \ 50 MiB, which it\nencodes to base64 (and often compresses) before converting\
    \ to a JSON\nobject.\n\nTo reverse the encoding process and decode a JSON object,\
    \ use the\n`Class.HttpService:JSONDecode()` method.\n\nThis method can be used\
    \ regardless of whether HTTP requests are enabled.\n"
  code_samples:
  - HttpService-JSONEncode
  parameters:
  - name: input
    type: Variant
    default: null
    summary: 'The input Luau table.

      '
  returns:
  - type: string
    summary: 'The returned JSON string.

      '
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Safe
  capabilities: []
- name: HttpService:PostAsync
  summary: 'Sends an HTTP `POST` request.

    '
  description: 'This method sends an HTTP `POST` request. It functions similarly to

    `Class.HttpService:RequestAsync()|RequestAsync()` except that it accepts

    HTTP request parameters as method parameters instead of a single

    dictionary and returns only the body of the HTTP response. Generally, this

    method is useful only as a shorthand and

    `Class.HttpService:RequestAsync()|RequestAsync()` should be used in most

    cases.


    When `true`, the `compress` parameter controls whether a large request

    body is compressed using **gzip**.


    The `url` parameter also accepts a `Datatype.Secret` value — use

    `Class.HttpService:GetSecret()|GetSecret` combined with

    `Datatype.Secret:AddPrefix()|AddPrefix` and

    `Datatype.Secret:AddSuffix()|AddSuffix`to safely embed secret credentials

    (such as API keys) directly in the URL without exposing their values.

    '
  code_samples:
