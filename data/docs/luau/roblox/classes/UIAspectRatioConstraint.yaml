- name: UIAspectRatioConstraint.AspectType
  summary: 'Determines how the maximum size of the object is limited.

    '
  description: "This property determines how the maximum size of the object is limited.\n\
    \n- When set to `Enum.AspectType.FitWithinMaxSize|FitWithinMaxSize`, the\n  object\
    \ will be the maximum size possible within its own\n  `Class.GuiBase2d.AbsoluteSize|AbsoluteSize`.\n\
    \n- When set to `Enum.AspectType.ScaleWithParentSize|ScaleWithParentSize`,\n \
    \ the object's maximum size will be the size of the parent while still\n  maintaining\
    \ the aspect ratio.\n"
