- name: AnalyticsService:LogFunnelStepEvent
  summary: 'Logs an event used to track user actions stepping through a pre-planned

    funnel.

    '
  description: 'Logs an event used to track user actions stepping through a pre-planned

    funnel. Funnel breakdowns only consider the user and event values from the

    first step in a funnel session. See

    [Funnel events](../../../production/analytics/funnel-events.md).

    '
  code_samples:
  - AnalyticsService-LogFunnelStepEvent-Shop
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The user who triggered the event.

      '
  - name: funnelName
    type: string
    default: null
    summary: 'The name of the funnel. This should be the same for all steps in the

      funnel. Limited to 10 unique funnels per experience.

      '
  - name: funnelSessionId
    type: string
    default: null
    summary: 'Optional unique identifier for the funnel session. This should be the

      same for all steps in the funnel.


      Note that this field is only necessary for **recurring** funnels, for

      example a purchase flow funnel or an item upgrade funnel. If you don''t

      have a natural funnel session identifier, it''s recommended to use

      `Class.HttpService:GenerateGUID()`.

      '
  - name: step
    type: int
    default: 1
    summary: 'The step number in the funnel. This should be unique for each step in

      the funnel. All funnels start at step 1. Limited to steps 1-100.


      Repeated steps by the same user in the same funnel session, or when

      `funnelSessionId` is `nil` will be ignored.


      Note that if any steps are skipped, the intermediate steps will be

      considered completed.

      '
  - name: stepName
    type: string
    default: null
    summary: 'Optional name of the step in the funnel. This field is only used for

      display purposes in Roblox-provided charts.

      '
  - name: customFields
    type: Dictionary
    default: nil
    summary: 'Optional dictionary of custom fields that will provide breakdowns in

      Roblox-provided charts. Only specific keys, provided by

      `Enum.AnalyticsCustomFieldKeys`, will be used for these breakdowns.

      Limited to 8,000 unique combinations of values across the three custom

      fields per experience.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
- name: AnalyticsService:LogJourneyEvent
  summary: 'Logs a journey event used to track non-linear player paths through an

    experience.

    '
  description: 'Logs a journey event used to track non-linear player paths through
    an

    experience. Unlike funnels, which track ordered sequential steps, journeys

    track graph-like player paths where players can move between named nodes

    in any order. Each call records that a player reached a specific node

    within a named journey. The resulting data is visualized as a Sankey

    diagram in Creator Hub, showing how players distribute across paths in the

    experience.

    '
  code_samples: []
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The player who triggered the journey event.

      '
  - name: journeyName
    type: string
    default: null
    summary: 'The name of the journey. This should be the same for all nodes in the

      journey. Cannot be empty and cannot contain a comma `,`, double quote

      `"`, single quote `''`, or newline character.

      '
  - name: nodeName
    type: string
    default: null
    summary: 'The name of the node the player reached in the journey. Cannot be

      empty, cannot contain a comma `,`, double quote `"`, single quote `''`,

      or newline character, and cannot start with `__` (double underscore),

      which is reserved.

      '
  - name: journeySessionId
    type: string
    default: null
    summary: 'Optional unique identifier for the journey session. This should be the

      same for all nodes in a single session of the journey. If provided,

      cannot contain a comma `,`, double quote `"`, single quote `''`, or

      newline character.

      '
  - name: customFields
    type: Dictionary
    default: nil
    summary: 'Optional dictionary of custom fields that will provide breakdowns in

      Roblox-provided charts. Only specific keys, provided by

      `Enum.AnalyticsCustomFieldKeys`, will be used for these breakdowns.

      Limited to 8,000 unique combinations of values across the three custom

      fields per experience.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
