- name: AnalyticsService:FireInGameEconomyEvent
  summary: 'Fire an event used to track player actions pertaining to the in-game

    '
  description: 'This function triggers an event used to track player actions pertaining
    to

    the in-game economy. For example, it should be called to track when

    players acquire or spend virtual items within the economy like currency.

    '
  code_samples:
  - analytics-event---economy
  parameters:
  - name: player
    type: Instance
    default: null
    summary: 'The player who triggered the economy event.

      '
  - name: itemName
    type: string
    default: null
    summary: 'The name of the item.

      '
  - name: economyAction
    type: AnalyticsEconomyAction
    default: null
    summary: 'Indicates the acquisition or spending of an in game resource.

      '
  - name: itemCategory
    type: string
    default: null
    summary: 'A user defined category for items such as "Vehicle," "Weapon.".

      '
  - name: amount
    type: int
    default: null
    summary: 'The amount of the currency.

      '
  - name: currency
    type: string
    default: null
    summary: 'The currency used. Examples: ''gold'', ''gems'', ''life.''.

      '
  - name: location
    type: Variant
    default: null
    summary: "The event location. A dictionary that each key-value represents an\n\
      entry of location data. The key-value is a string-string pair. With\nthis you\
      \ can query which are the most popular \"stores\" then maybe you\nwant to increase/lower\
      \ the price for the stores.\n\nSee the example below:\n\n```lua\nlocal location\
      \ = {\n    [\"placeDesc\"] = \"Dungeon1\",\n    [\"levelDesc\"] = \"level2\"\
      ,\n    [\"mapDesc\"] = \"LeftChamberMap\",\n    [\"storeName\"] = \"DarkSmith\"\
      ,\n    [\"userDefinedKey\"] = \"0005\"\n}\n```\n"
  - name: customData
    type: Variant
    default: null
    summary: 'Optional. User defined data, could be a string, a number or a table.

      '
  returns:
  - type: ()
    summary: 'No return.

      '
  tags:
  - Deprecated
  deprecation_message: 'This deprecated function is a variant of

    `Class.AnalyticsService:LogEconomyEvent()` which should be used instead.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
