- name: AnalyticsService:GetPlayerSegmentsAsync
  summary: 'Returns coarse player segment buckets for the current experience.

    '
  description: "This server-only method returns coarse segment buckets for a player\
    \ in the\ncurrent experience. Use these buckets at runtime to personalize content\
    \ or\ngate features for specific player groups. If a cached result is not\nalready\
    \ available, the method may yield while the engine fetches the\nsegment data.\
    \ Successfully fetched results are cached per player for the\nlifetime of the\
    \ server session.\n\nIf segment data is unavailable, this method does not throw.\
    \ Instead, it\nreturns `HasData = false` and all enum fields are set to `Unknown`.\n\
    \nThis method throws only when called from the client or when the `player`\nargument\
    \ is invalid.\n\nThe returned dictionary has the following structure:\n\n<table>\n\
    \t<thead>\n\t\t<tr>\n\t\t\t<th>Name</th>\n\t\t\t<th>Type</th>\n\t\t\t<th>Description</th>\n\
    \t\t</tr>\n\t</thead>\n\t<tr>\n\t\t<td><code>HasData</code></td>\n\t\t<td>bool</td>\n\
    \t\t<td>Whether segment data was successfully retrieved for the player.</td>\n\
    \t</tr>\n\t<tr>\n\t\t<td><code>ActivePayerStatus</code></td>\n\t\t<td><code>Enum.ActivePayerStatus</code></td>\n\
    \t\t<td>The player's current payer status bucket for this experience.</td>\n\t\
    </tr>\n\t<tr>\n\t\t<td><code>WhenUserFirstPlayed</code></td>\n\t\t<td><code>Enum.WhenUserFirstPlayed</code></td>\n\
    \t\t<td>When the player first played this experience, represented as a bucket.</td>\n\
    \t</tr>\n\t<tr>\n\t\t<td><code>PlatformSpenderStatus</code></td>\n\t\t<td><code>Enum.PlayerPlatformSpenderStatus</code></td>\n\
    \t\t<td>The player's platform-wide spender status bucket, including whether the\
    \ player falls outside the active spender bucket.</td>\n\t</tr>\n\t<tr>\n\t\t\
    <td><code>ExperienceActivationStatus</code></td>\n\t\t<td><code>Enum.ExperienceActivationStatus</code></td>\n\
    \t\t<td>Whether the player is new, active, lapsed, or reactivated in this experience,\
    \ based on the last 30 days.</td>\n\t</tr>\n\t<tr>\n\t\t<td><code>EngagementLevel</code></td>\n\
    \t\t<td><code>Enum.EngagementLevel</code></td>\n\t\t<td>How many days the player\
    \ played this experience in the last 7 days, represented as a bucket.</td>\n\t\
    </tr>\n\t<tr>\n\t\t<td><code>PlatformActivationStatus</code></td>\n\t\t<td><code>Enum.PlayerPlatformActivationStatus</code></td>\n\
    \t\t<td>Whether the player is new, active, lapsed, or reactivated on Roblox, based\
    \ on the last 60 days.</td>\n\t</tr>\n\t<tr>\n\t\t<td><code>UserNewReturningStatus</code></td>\n\
    \t\t<td><code>Enum.UserNewReturningStatus</code></td>\n\t\t<td>Whether the player\
    \ is new to this experience or has played it before.</td>\n\t</tr>\n\t<tr>\n\t\
    \t<td><code>UserAcquisitionSource</code></td>\n\t\t<td><code>Enum.UserAcquisitionSource</code></td>\n\
    \t\t<td>How the player first found this experience.</td>\n\t</tr>\n</table>\n"
  code_samples:
  - AnalyticsService-GetPlayerSegmentsAsync
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The player whose segment buckets should be returned.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary containing coarse player segment buckets for the current

      experience.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
