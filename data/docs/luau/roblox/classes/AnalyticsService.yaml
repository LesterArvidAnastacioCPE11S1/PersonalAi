- name: AnalyticsService:LogProgressionEvent
  summary: 'Logs an event for when a user has started, completed, or failed a level

    attempt.

    '
  description: 'Logs an event for when a user has started, completed, or failed a
    level

    attempt. This event does not currently display in any Roblox-provided

    charts.

    '
  code_samples: []
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The player who triggered the event.

      '
  - name: progressionPathName
    type: string
    default: null
    summary: 'The name of the progression path this event belongs to, such as a

      world, chapter, or level group. This groups related progression events

      together. Cannot be empty and cannot contain a comma `,`, double quote

      `"`, single quote `''`, or newline character.

