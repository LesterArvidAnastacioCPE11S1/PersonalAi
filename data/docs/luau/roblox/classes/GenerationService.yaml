name: GenerationService
type: class
memory_category: Instances
summary: 'Service that allows developers to generate 3D objects from text prompts.

  '
description: '`GenerationService` enables you to generate 3D objects from text prompts
  using

  Roblox''s Cube 3D foundation model. This enables the generation of objects like

  environmental props in-experience, as well as fully functional models like

  vehicles that drive, planes that fly, and weapons that shoot.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
deprecation_message: ''
properties: []
methods:
- name: GenerationService:GenerateMeshAsync
  summary: 'Starts the generation of a new 3D mesh from a text prompt and returns

    unique IDs used to track and retrieve the result.

    '
  description: 'Starts the generation of a new 3D mesh from a text prompt and returns

    unique IDs used to track and retrieve the result. Must be called from

    server scripts. You can optionally receive intermediate results, such as

    the untextured mesh, by providing an `intermediateResultCallback`

    function.


    After the generation is complete, use

    `Class.GenerationService:LoadGeneratedMeshAsync|LoadGeneratedMeshAsync()`

    to load and display the generated mesh.


    #### Error Codes


    | Error                                      | Description                                                              |
    Recommended action                                                                   |

    | ------------------------------------------ | ------------------------------------------------------------------------
    | ------------------------------------------------------------------------------------
    |

    | Rate limit exceeded                        | The maximum number of mesh generations
    has been exceeded for the minute. | Wait until the rate limit resets.                                                    |

    | Moderation failed                          | The mesh generation was flagged
    for moderation.                          | Review and modify the prompt to ensure
    it adheres to Roblox''s moderation guidelines. |

    | Internal server error                      | An unexpected issue occurred on
    the server.                              | Retry the request later or check server
    status for issues.                           |

    | Character limit exceeded                   | The input prompt length for this
    generation request exceeded the limit.  | Reduce the number of characters in the
    `Prompt` string of the `input` dictionary.    |

    | Service overloaded                         | The service is overloaded.                                               |
    Retry the request later.                                                             |

    | Size dimensions must all be greater than 0 | Invalid size provided.                                                   |
    Change the size to above `0`.                                                        |

    '
  code_samples:
  - GenerationService-ClientSideMeshGeneration
  - GenerationService-ServerSideMeshGeneration
  - GenerationService-ClientSideMeshGeneration-WithSuggestedSize
  - GenerationService-ServerSideMeshGeneration-WithSuggestedSize
  - GenerationService-StarterPlayerScripts-WithSuggestedSize
  parameters:
  - name: inputs
    type: Dictionary
    default: null
    summary: 'A dictionary containing the mesh generation prompts. Currently, the

      only supported key is the `Prompt` (string) that describes the mesh to

      generate.

      '
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` requesting the generation.

      '
  - name: options
    type: Dictionary
    default: null
    summary: 'A dictionary for additional generation options to influence the

      result. The optional `SuggestedSize` key (`Datatype.Vector3`)

      represents a size guide for the generated asset, meaning

      `GenerationService` will attempt to create a model with a size and

      proportion similar to the provided `Datatype.Vector3`, although there

      is no guarantee on the final output size.

      '
  - name: intermediateResultCallback
    type: Function?
    default: null
    summary: 'A callback function triggered with intermediate generation results.

      Useful for retrieving early mesh versions before textures are applied.

      '
  returns:
  - type: Tuple
    summary: 'A tuple of the generation ID (a unique ID returned for each invocation

      of `GenerateMeshAsync()`) and context ID (not currently used).

      '
  tags:
  - Yields
  deprecation_message: 'This method is scheduled for future deprecation. Explore

    `Class.GenerationService:GenerateModelAsync()|GenerateModelAsync()` as a

    newer method.

    '
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
- name: GenerationService:GenerateModelAsync
  summary: 'Enables generation of multi-mesh geometries according to provided `inputs`

    and a `schema`.

    '
  description: 'Enables generation of multi-mesh geometries according to provided
    `inputs`

    and a `schema`.


    Provide creative direction through `inputs`: a `TextPrompt`, an `Image` to

    condition on visually, or both. Control the output structure through

    `schema`, supplying either a built-in `PredefinedSchema` or a custom

    `SchemaDefinition` that names the parts to produce.


    This method throws an error during the generation process for issues like

    prompt rejection, generation timeouts, `schema` mismatches, or backend

    service errors. It''s recommended to wrap it in a

    `Global.LuaGlobals.pcall()` to catch such errors.


    See [this guide](../../../parts/model-generation.md) for more detailed

    examples including usage of a `Behaviors` module to connect functional

    behaviors to generated models.

    '
  code_samples:
  - GenerationService-Basic-Car5
  - GenerationService-Custom-Schema
  - GenerationService-Image-Conditioning
  parameters:
  - name: inputs
    type: Dictionary
    default: null
    summary: "A table representing conditioning inputs with the following keys:\n\n\
      - `TextPrompt` — String description of the object to generate.\n  Required unless\
      \ an `Image` is provided; you must supply at least one\n  of `TextPrompt` or\
      \ `Image`.\n- `Image` — Optional `Datatype.Content` referencing an image asset\n\
      \  (for example, the result of `Datatype.Content.fromAssetId()`) used\n  to\
      \ visually condition the generation. Supply it together with or\n  instead of\
      \ `TextPrompt`.\n- `Size` — Optional `Datatype.Vector3` describing the object\
      \ size to\n  generate. This is only approximate; scale the model extents\n \
      \ post‑generation if you need a specific size.\n- `MaxTriangles` — Optional\
      \ integer describing the maximum number of\n  triangles that the returned model\
      \ will contain. Lower values result\n  in more faceted and low-poly generations.\n\
      - `GenerateTextures` — `true` (default) textures the resulting\n  generation,\
      \ while `false` will not generate textures.\n"
  - name: schema
    type: Dictionary
    default: null
    summary: "Table representing the generation schema. Provide exactly one of the\n\
      following keys:\n\n- `PredefinedSchema` — String selecting a built-in schema.\
      \ Current\n  valid options are `Car5` for a basic vehicle chassis consisting\
      \ of\n  five `Class.Model|Models`, or `Body1` which results in a single mesh\n\
      \  output.\n- `SchemaDefinition` — Table describing a custom multi-part structure.\n\
      \  It contains a `Groups` array of part-name strings (one entry per\n  desired\
      \ part); the returned `Class.Model` is organized to match the\n  named groups.\
      \ Use this instead of `PredefinedSchema` when you need a\n  structure the predefined\
      \ schemas don't cover.\n"
  - name: options
    type: Dictionary?
    default: null
    summary: 'Currently not used; reserved for future customization options.

      '
  returns:
  - type: Tuple
    summary: "Tuple with the following elements:\n\n- A standard `Class.Model` container\
      \ instance that is compliant with\n  the specified `schema`.\n- A table containing\
      \ a UUID and other metadata about the generation.\n"
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
- name: GenerationService:LoadGeneratedMeshAsync
  summary: 'Retrieves and loads a mesh generated by

    `Class.GenerationService:GenerateMeshAsync()` using the provided

    `generationId`.

    '
  description: 'Retrieves and loads a mesh generated by

    `Class.GenerationService:GenerateMeshAsync()|GenerateMeshAsync()` using

    the provided `generationId`. Must be called from client scripts.


    The mesh can be returned as a `Class.MeshPart` or `Class.Model`. Because

    editable meshes are not replicated, the loaded mesh is not replicated to

    any other clients and can only be loaded once per `generationId`.

    '
  code_samples: []
  parameters:
  - name: generationId
    type: string
    default: null
    summary: 'The unique ID returned by

      `Class.GenerationService:GenerateMeshAsync()|GenerateMeshAsync()`.

      Identifies the mesh to load.

      '
  returns:
  - type: MeshPart
    summary: 'The generated asset, returned as a `Class.Model` with a single

      `Class.MeshPart` containing an `Class.EditableMesh`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
- name: GenerationService:SegmentMeshAsync
  summary: 'Segments an existing `Class.MeshPart` into multiple named parts according

    to a provided schema, returning a `Class.Model` organized by the schema

    groups.

    '
  description: 'Segments an existing `Class.MeshPart` into multiple named parts according

    to a provided schema and returns a `Class.Model` with the segmented parts

    organized by the schema groups.


    The `schema` parameter accepts the same structure as

    `Class.GenerationService:GenerateModelAsync()|GenerateModelAsync()`:

    either a `PredefinedSchema` string (such as `"Car5"` for a five-part

    vehicle chassis or `"Body1"` for a single-mesh output) or a

    `SchemaDefinition` table with a `Groups` array of custom part names.


    This method can only be called from Roblox Studio (edit mode or plugin

    context). For published mesh assets, the caller must have edit permission

    for the asset. Wrap calls in `Global.LuaGlobals.pcall()` to handle errors

    such as permission failures or mesh export issues.

    '
  code_samples: []
  parameters:
  - name: meshPart
    type: MeshPart
    default: null
    summary: 'The `Class.MeshPart` to segment. Must contain mesh geometry (either
      an

      `Class.EditableMesh` or a published mesh asset the caller has edit

      permission for).

      '
  - name: schema
    type: Dictionary
    default: null
    summary: 'A table specifying how to segment the mesh. Provide exactly one of

      `PredefinedSchema` (a string such as `"Car5"` or `"Body1"`) or

      `SchemaDefinition` (a table with a `Groups` array of part-name strings

      defining the segmentation structure).

      '
  - name: options
    type: Dictionary?
    default: null
    summary: 'Has no effect.

      '
  returns:
  - type: Tuple
    summary: 'A tuple containing a `Class.Model` whose children are organized

      according to the specified schema (each group as a child `Class.Model`

      with a `Class.MeshPart` inside), and a table with a `UUID` key holding

      the backend job identifier.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DynamicGeneration
