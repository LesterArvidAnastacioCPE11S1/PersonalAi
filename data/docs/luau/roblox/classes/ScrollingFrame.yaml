name: ScrollingFrame
type: class
memory_category: Gui
summary: '`ScrollingFrame` is a special `Class.Frame` type with built-in scrolling

  interactivity and different ways to customize how the scrolling works.

  '
description: '`ScrollingFrame` is a special `Class.Frame` type with built-in scrolling

  interactivity and different ways to customize how the scrolling works.


  <img src="/assets/ui/ui-objects/ScrollingFrame-Example.jpg" width="840" alt="Example
  ScrollingFrame on the screen containing a tabbed category bar and a list of magical
  items for the player to consider purchasing." />

  '
