- name: ScrollingFrame.AbsoluteWindowSize
  summary: 'The size of the frame, in offsets, without the scroll bars.

    '
  description: 'The size of the frame, in offsets, without the scroll bars. This read-only

    property represents the visible content area of the `ScrollingFrame`: the

    frame''s `Class.GuiBase2d.AbsoluteSize|AbsoluteSize` minus the space

    occupied by any currently visible scroll bar gutters

    (`Class.ScrollingFrame.ScrollBarThickness|ScrollBarThickness`). If no

    scroll bars are visible, this equals the frame''s absolute size.

    '
