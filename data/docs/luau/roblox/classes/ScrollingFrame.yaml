- name: ScrollingFrame.HorizontalScrollBarInset
  summary: 'Indicates whether `Class.ScrollingFrame.CanvasSize|CanvasSize` is inset
    by

    `Class.ScrollingFrame.ScrollBarThickness|ScrollBarThickness` on the

    horizontal axis.

    '
  description: "Indicates whether the scrollable canvas is inset by\n`Class.ScrollingFrame.ScrollBarThickness|ScrollBarThickness`\
    \ to account\nfor the horizontal scroll bar. Because the horizontal scroll bar\
    \ occupies\nspace along the bottom edge, this inset reduces the canvas height.\n\
    Defaults to `Enum.ScrollBarInset.None`.\n\n- `Enum.ScrollBarInset|None` — the\
    \ canvas is never inset; content may be\n  obscured behind the horizontal scroll\
    \ bar when it is visible.\n- `Enum.ScrollBarInset|ScrollBar` — the canvas is inset\
    \ only while the\n  horizontal scroll bar is visible.\n- `Enum.ScrollBarInset|Always`\
    \ — the canvas is always inset regardless of\n  whether the horizontal scroll\
    \ bar is visible.\n"
