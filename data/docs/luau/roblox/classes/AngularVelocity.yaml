name: AngularVelocity
type: class
memory_category: BaseParts
summary: 'Applies torque on an assembly to maintain a constant angular velocity.

  '
description: "The `AngularVelocity` constraint applies torque on an assembly to maintain\
  \ a\n**constant** angular velocity. Alternatively:\n\n- If you want to control the\
  \ amount of torque applied, use a `Class.Torque`\n  constraint.\n- If you only need\
  \ **initial** angular velocity, set the\n  `Class.BasePart.AssemblyAngularVelocity|AssemblyAngularVelocity`\
  \ method\n  directly on the assembly.\n\nWhen configuring this constraint, it may\
  \ be helpful to study\n[Roblox Units](../../../physics/units.md) to understand how\
  \ Roblox units\ncompare to metric units.\n\n#### Relativity\n\nApplication of velocity\
  \ can be controlled through the constraint's\n`Class.AngularVelocity.RelativeTo|RelativeTo`\
  \ property. If set to\n`Enum.ActuatorRelativeTo|World`, the angular velocity vector\
  \ is used as is. If\nset to `Enum.ActuatorRelativeTo|Attachment1` and the constraint's\n\
  `Class.Constraint.Attachment1|Attachment1` property is set to another\nattachment,\
  \ the angular velocity will be affected by that of the other\nattachment. Setting\
  \ `Class.AngularVelocity.RelativeTo|RelativeTo` to\n`Enum.ActuatorRelativeTo|Attachment1`\
  \ also exposes the\n`Class.AngularVelocity.ReactionTorqueEnabled|ReactionTorqueEnabled`\
  \ property.\n"
