name: Seat
type: class
memory_category: BaseParts
summary: 'A type of `Class.BasePart` that characters can ''sit'' in. When a character

  touches an enabled Seat object, it will be attached to the part by a

  `Class.Weld` and the default character scripts will play a sitting animation.

  '
description: "A type of `Class.BasePart` that a player character can 'sit' in. When\
  \ a\ncharacter touches an enabled Seat object, it will be attached to the part by\
  \ a\n`Class.Weld` and the default character scripts will play a sitting animation.\n\
  \n## How do Seats work?\n\nWhen a model containing a `Class.Humanoid` and a `Class.BasePart`\
  \ called\n'HumanoidRootPart' (generally a player character) touches a seat, a\n\
  `Class.Weld` is created between the seat and the part. The\n`Class.JointInstance.C0|C0`\
  \ and `Class.JointInstance.C1|C1` properties are\nconfigured so that the character\
  \ is welded 2 studs above the seat. This weld\nis named 'SeatWeld' and parented\
  \ to the seat.\n\nWhen sitting the `Class.Seat.Occupant` property is set to the\
  \ `Class.Humanoid`\nthat is 'sitting' in the seat. Furthermore the `Class.Humanoid.SeatPart`\n\
  property of the humanoid is set to the seat.\n\nA character can also be forced to\
  \ sit in a seat using the `Class.Seat:Sit()`\nfunction.\n\nThere are two ways for\
  \ a character to get out of a seat. When a player jumps,\nthey are removed from\
  \ the seat. However this can also be done manually by\ndestroying the seat weld,\
  \ for example:\n\n    seat:FindFirstChild(\"SeatWeld\"):Destroy()\n\nNote seats\
  \ have a cooldown (currently 3 seconds) that is on a per-character\nper-seat basis.\
  \ This means once a character has gotten out of a seat they\ncannot sit back on\
  \ the same seat for 3 seconds. This cooldown behavior may\nchange and should not\
  \ be relied upon by developers.\n\n## What can Seats be used for?\n\nSeats have\
  \ a diverse range of uses, ranging from the obvious to the more\nunconventional.\n\
  \n- Creating chairs or benches without the need for any programming\n- Allowing\
  \ characters to 'sit' in moving objects such as vehicles without\n  getting flung\
  \ around\n- Creating interfaces that are controlled by the character in the seat\
  \ using\n  the `Class.Seat.Occupant` property\n"
