- name: TextService:FilterStringAsync
  summary: 'Filters a string being received from a user and returns a

    '
  description: "This method filters a string being received from a user and returns\
    \ a\n`Class.TextFilterResult` which can be used to distribute the correctly\n\
    filtered text accordingly.\n\nThis method should be called once each time a user\
    \ submits a message. If\nit fails, do not display the text to any user.\n\nSee\
    \ [text filtering](../../../ui/text-filtering.md) for usage guidelines\nand examples.\n\
    \n#### Notes\n\n- This method always yields to make a text filtering service call.\n\
    - This method may throw if there is a service error that cannot be\n  resolved.\
    \ In such cases, do not retry the request, as this method\n  implements its own\
    \ retry logic internally.\n- This method currently throws if `fromUserId` is not\
    \ online on the\n  current server.\n"
  code_samples:
  - pet-name-filter-example
  parameters:
  - name: stringToFilter
    type: string
    default: null
    summary: 'The text to be filtered.

      '
  - name: fromUserId
    type: int64
    default: null
    summary: 'The `Class.Player.UserId` of the player filtering the text.

      '
  - name: textContext
    type: TextFilterContext
    default: PrivateChat
    summary: 'The context that the filtered message will be used in. This parameter

      does not impact the filtered result of the query and is only used to

      improve Roblox''s text filtering.

      '
  returns:
  - type: TextFilterResult
    summary: 'A `Class.TextFilterResult` that wraps the filtered text and exposes

      methods for retrieving it in the form appropriate for each audience.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
- name: TextService:GetFamilyInfoAsync
  summary: 'Returns a table containing the name and faces of a font family.

    '
  description: 'Returns a table containing the name and faces of a font family. If
