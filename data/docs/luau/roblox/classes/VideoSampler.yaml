methods:
- name: VideoSampler:GetSamplesAtTimesAsync
  summary: 'Gets image frames at the specified timestamps.

    '
  description: 'This method allows you to get a set of image frames from a video at

    specified timestamps as image `Datatype.Content` objects.

    '
  code_samples: []
  parameters:
  - name: times
    type: Array
    default: null
    summary: 'An array of requested timestamps in seconds for which to retrieve

      image frames. Each timestamp should be a number between `0` and

      `Class.VideoSampler.TimeLength|TimeLength`.

      '
  returns:
  - type: List<VideoSample>
    summary: "An array of dictionary or nil values for each requested timestamp. If\n\
      a requested timestamp is out of range or the `Class.VideoSampler` was\nunable\
      \ to produce a sample, the corresponding entry in the returned\narray will be\
      \ nil.\n\nEach dictionary contains the following keys:\n\n- `Time` (number):\
      \ The timestamp of the returned image frame in\n  seconds. This value may differ\
      \ slightly from the requested\n  timestamp.\n- `Image` (`Datatype.Content`):\
      \ A `Datatype.Content` with a\n  `Datatype.Content.SourceType|SourceType` of\n\
      \  `Enum.ContentSourceType.Opaque` containing the image frame at the\n  corresponding\
      \ timestamp.\n"
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
