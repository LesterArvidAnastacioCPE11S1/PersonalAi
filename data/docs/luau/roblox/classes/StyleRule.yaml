- name: StyleRule:SetDefaultPropertyTransition
  summary: 'Sets or clears a default transition that applies to all properties of
    the

    `StyleRule` that don''t have an explicit transition set.

    '
  description: "Sets or clears a default transition that applies to all properties\
    \ of the\n`StyleRule` that don't have an explicit transition set. This is equivalent\n\
    to calling\n`Class.StyleRule:SetPropertyTransition()|SetPropertyTransition()`\
    \ with\n`\"*\"` as the property name.\n\nThe `transitionParams` parameter accepts\
    \ a `Datatype.TweenInfo` that\nconfigures the transition's timing. The following\
    \ `Datatype.TweenInfo`\nproperties are used:\n\n- `Datatype.TweenInfo.Time|Time`\
    \ &mdash; Duration of the transition in\n  seconds.\n- `Datatype.TweenInfo.EasingStyle|EasingStyle`\
    \ &mdash; The easing function\n  used for interpolation.\n- `Datatype.TweenInfo.EasingDirection|EasingDirection`\
    \ &mdash; The\n  direction of the easing function.\n- `Datatype.TweenInfo.DelayTime|DelayTime`\
    \ &mdash; Delay in seconds before\n  the transition starts.\n\nNote that the `Datatype.TweenInfo.RepeatCount|RepeatCount`\
    \ and\n`Datatype.TweenInfo.Reverses|Reverses` fields of `Datatype.TweenInfo` are\n\
    ignored, as style transitions cannot repeat or reverse automatically.\n\nA per-property\
    \ transition set via\n`Class.StyleRule:SetPropertyTransition()|SetPropertyTransition()`\
    \ takes\nprecedence over the default transition for that property.\n"
  code_samples: []
  parameters:
  - name: transitionParams
    type: Variant
    default: null
    summary: 'Either a `Datatype.TweenInfo`, a token string defining the default

      transition timing, or `nil` to remove the default transition.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
- name: StyleRule:SetProperties
  summary: 'Lets you declare and set multiple properties of the `StyleRule` at once.

    '
  description: "Similar to `Class.StyleRule:SetProperty()|SetProperty()` but lets\
    \ you\ndeclare and set multiple properties of the `StyleRule` at once. Each\n\
    assignment should be a valid property of the affected `Class.GuiObject` or\n`Class.UIComponent`\
    \ (`Class.UICorner`, `Class.UIGradient`, etc.), and each\nassigned value should\
    \ match its property's value type, for example\n`Datatype.Vector2` for `Class.GuiObject.AnchorPoint|AnchorPoint`\
    \ or\n`Datatype.Color3` for `Class.GuiObject.BackgroundColor3|BackgroundColor3`.\n\
    \nAttempts to assign invalid property names such as `\"AnchorPt\"` or\n`\"BkColor\"\
    ` will silently fail. Type mismatches such as `Datatype.CFrame`\nfor `Class.GuiObject.AnchorPoint|AnchorPoint`\
    \ or `Datatype.UDim2` for\n`Class.GuiObject.BackgroundColor3|BackgroundColor3`\
    \ will also fail and an\nerror will appear in the [Output](../../../studio/output.md)\
    \ window.\n\nTo set/update just one property of a `StyleRule`, see\n`Class.StyleRule:SetProperty()|SetProperty()`.\n\
    \n```lua\nlocal ReplicatedStorage = game:GetService(\"ReplicatedStorage\")\n\n\
    local coreSheet = ReplicatedStorage:FindFirstChild(\"CoreSheet\")\n\n-- Get reference\
    \ to style rule\nlocal frameRule = coreSheet.Frame\n\n-- Set rule properties\n\
    frameRule:SetProperties({\n\t[\"AnchorPoint\"] = Vector2.new(0.5, 0),\n\t[\"BackgroundColor3\"\
    ] = Color3.new(1, 0, 0.25)\n})\n```\n\nNote that you can assign **tokens** as\
    \ property values through the `$`\nprefix:\n\n```lua\nlocal ReplicatedStorage\
    \ = game:GetService(\"ReplicatedStorage\")\n\nlocal coreSheet = ReplicatedStorage:FindFirstChild(\"\
    CoreSheet\")\nlocal tokensSheet = ReplicatedStorage:FindFirstChild(\"Tokens\"\
    )\n\n-- Set tokens (attributes) on tokens sheet\ntokensSheet:SetAttribute(\"TopCenterAnchor\"\
    , Vector2.new(0.5, 0))\ntokensSheet:SetAttribute(\"MainBackgroundColor\", Color3.new(0.2,\
    \ 0.2, 0.3))\n\n-- Get reference to style rule\nlocal frameRule = coreSheet.Frame\n\
    \n-- Set rule properties\nframeRule:SetProperties({\n\t[\"AnchorPoint\"] = \"\
    $TopCenterAnchor\",\n\t[\"BackgroundColor3\"] = \"$MainBackgroundColor\"\n})\n\
    ```\n"
  code_samples: []
  parameters:
  - name: styleProperties
    type: Dictionary
    default: null
    summary: 'Dictionary of key-value pairs defining the properties to set.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
- name: StyleRule:SetProperty
  summary: 'Sets or updates a single property of the `StyleRule`.

    '
  description: 'Sets a new property (or modifies an existing property) for the

    `StyleRule`. The `name` parameter should be a valid property of the

    affected `Class.GuiObject` or `Class.UIComponent` (`Class.UICorner`,

    `Class.UIGradient`, etc.), and the assigned value should match the

    property''s value type, for example `Datatype.Vector2` for

    `Class.GuiObject.AnchorPoint|AnchorPoint` or `Datatype.Color3` for

    `Class.GuiObject.BackgroundColor3|BackgroundColor3`.


    Attempts to assign invalid property names such as `"AnchorPt"` or

    `"BkColor"` will silently fail. Type mismatches such as `Datatype.CFrame`

    for `Class.GuiObject.AnchorPoint|AnchorPoint` or `Datatype.UDim2` for

    `Class.GuiObject.BackgroundColor3|BackgroundColor3` will also fail and an

    error will appear in the [Output](../../../studio/output.md) window.


    To set multiple properties for a `StyleRule` at once, see

    `Class.StyleRule:SetProperties()|SetProperties()`.


    ```lua

    local ReplicatedStorage = game:GetService("ReplicatedStorage")


    local coreSheet = ReplicatedStorage:FindFirstChild("CoreSheet")


    -- Get reference to style rule

    local frameRule = coreSheet.Frame


    -- Set rule property

    frameRule:SetProperty("BackgroundColor3", Color3.new(1, 0, 0.25))

    ```


    Note that you can assign **tokens** as property values through the `$`

    prefix:


    ```lua

    local ReplicatedStorage = game:GetService("ReplicatedStorage")


    local coreSheet = ReplicatedStorage:FindFirstChild("CoreSheet")

    local tokensSheet = ReplicatedStorage:FindFirstChild("Tokens")


    -- Set new token (attribute) on tokens sheet

    tokensSheet:SetAttribute("MainBackgroundColor", Color3.new(0.2, 0.2, 0.3))


    -- Get reference to style rule

    local frameRule = coreSheet.Frame

    -- Set rule property to use the token as its value

    frameRule:SetProperty("BackgroundColor3, "$MainBackgroundColor")

    ```

    '
  code_samples: []
  parameters:
  - name: name
    type: string
    default: null
    summary: 'Property name to set, for example `"BackgroundColor3"`.

      '
  - name: value
    type: Variant
    default: null
    summary: 'Property value to set, for example `Datatype.Color3.new(1, 0, 0.25)`.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
- name: StyleRule:SetPropertyTransition
  summary: 'Sets or clears the transition for a single property on the `StyleRule`.

    '
  description: "Sets or clears the transition for a single property on the `StyleRule`.\n\
    When a transition is set for a property, any change to that property's\nstyled\
    \ value will be animated over time instead of applied immediately.\n\nThe `transitionParams`\
    \ parameter accepts a `Datatype.TweenInfo` that\nconfigures the transition's timing.\
    \ The following `Datatype.TweenInfo`\nproperties are used:\n\n- `Datatype.TweenInfo.Time|Time`\
    \ &mdash; Duration of the transition in\n  seconds.\n- `Datatype.TweenInfo.EasingStyle|EasingStyle`\
    \ &mdash; The easing function\n  used for interpolation.\n- `Datatype.TweenInfo.EasingDirection|EasingDirection`\
    \ &mdash; The\n  direction of the easing function.\n- `Datatype.TweenInfo.DelayTime|DelayTime`\
    \ &mdash; Delay in seconds before\n  the transition starts.\n\nNote that the `Datatype.TweenInfo.RepeatCount|RepeatCount`\
    \ and\n`Datatype.TweenInfo.Reverses|Reverses` fields of `Datatype.TweenInfo` are\n\
    ignored, as style transitions cannot repeat or reverse automatically.\n\nTo set\
    \ transitions for multiple properties at once, see\n`Class.StyleRule:SetPropertyTransitions()|SetPropertyTransitions()`.\n"
  code_samples:
  - StyleRule-SetPropertyTransition
  - StyleRule-SetPropertyTransition-Tokens
  parameters:
  - name: property
    type: string
    default: null
    summary: 'String name of the property to set a transition for, for example

      `"BackgroundColor3"` or `"Size"`.

      '
  - name: transitionParams
    type: Variant
    default: null
    summary: 'A `Datatype.TweenInfo` or token string defining the transition timing,

      or `nil` to remove the transition for this property.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
- name: StyleRule:SetPropertyTransitions
  summary: 'Lets you declare and set transitions for multiple properties of the

    `StyleRule` at once.

    '
  description: "Similar to\n`Class.StyleRule:SetPropertyTransition()|SetPropertyTransition()`\
    \ but lets\nyou declare and set transitions for multiple properties of the `StyleRule`\n\
    at once.\n\nCalling this method **replaces** all existing transitions on the\n\
    `StyleRule` with the provided set. Each key should be a property name\n(string)\
    \ and each value should be a `Datatype.TweenInfo` or string token\ndefining the\
    \ transition timing for that property. Passing `nil` as a value\nfor a key excludes\
    \ that property from the resulting transitions.\n\nThe following `Datatype.TweenInfo`\
    \ properties are used:\n\n- `Datatype.TweenInfo.Time|Time` &mdash; Duration of\
    \ the transition in\n  seconds.\n- `Datatype.TweenInfo.EasingStyle|EasingStyle`\
    \ &mdash; The easing function\n  used for interpolation.\n- `Datatype.TweenInfo.EasingDirection|EasingDirection`\
    \ &mdash; The\n  direction of the easing function.\n- `Datatype.TweenInfo.DelayTime|DelayTime`\
    \ &mdash; Delay in seconds before\n  the transition starts.\n\nNote that the `Datatype.TweenInfo.RepeatCount|RepeatCount`\
    \ and\n`Datatype.TweenInfo.Reverses|Reverses` fields of `Datatype.TweenInfo` are\n\
    ignored, as style transitions cannot repeat or reverse automatically.\n\nTo set/update\
    \ just one property transition on a `StyleRule`, see\n`Class.StyleRule:SetPropertyTransition()|SetPropertyTransition()`.\n"
  code_samples:
  - StyleRule-SetPropertyTransitions
  - StyleRule-SetPropertyTransitions-Tokens
  parameters:
  - name: properties
    type: Dictionary
    default: null
    summary: 'Dictionary of property names to transition parameters.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
