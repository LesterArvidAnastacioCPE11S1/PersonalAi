- name: StyleRule.Selector
  summary: 'A string specifying which instances the `StyleRule` should affect.

    '
  description: "A string specifying which instances the `StyleRule` should affect.\
    \ This\ncan be a mix of selectors and combinators to match characteristics such\
    \ as\nthe class name, instance name, and hierarchy relationships.\n\nFor example,\
    \ `\".Container > ImageLabel.BlueOnHover:Hover\"` effectively\nmeans the style\
    \ rule overrides every `Class.ImageLabel` that's a child of\nan instance tagged\
    \ with `Container` (`.Container > ImageLabel`) **and** is\ntagged with `BlueOnHover`\
    \ (`.BlueOnHover`) **and** is in the\n`Enum.GuiState.Hover` state (`:Hover`).\n\
    \n#### Selectors\n\n<table>\n<thead>\n  <tr>\n    <th>Selector</th>\n    <th>Description</th>\n\
    \    <th>Examples</th>\n  </tr>\n</thead>\n<tbody>\n  <tr>\n    <td><code>[class]</code></td>\n\
    \    <td>Matches instances of a <code>Class.GuiObject</code> or <code>Class.UIComponent</code>\
    \ class.</td>\n    <td><code>\"Frame\"</code><br /><code>\"ImageButton\"</code><br\
    \ /><code>\"UICorner\"</code></td>\n  </tr>\n  <tr>\n    <td><code>.[tag]</code></td>\n\
    \    <td>Matches instances <a href=\"../../../studio/properties.md#instance-tags\"\
    >tagged</a> with a <code>Class.CollectionService</code> tag.</td>\n    <td><code>\"\
    .Container\"</code><br /><code>\".BlueOnHover\"</code></td>\n  </tr>\n  <tr>\n\
    \    <td><code>#[name]</code></td>\n    <td>Matches instances of a specific <code>Class.Instance.Name</code>.</td>\n\
    \    <td><code>\"#ModalFrame\"</code><br /><code>\"#CloseButton\"</code></td>\n\
    \  </tr>\n  <tr>\n    <td><code>:[state]</code></td>\n    <td>Matches instances\
    \ currently in a <code>Enum.GuiState</code>.</td>\n    <td><code>\":Hover\"</code></td>\n\
    \  </tr>\n  <tr>\n    <td><code>@[StyleQuery name]</code></td>\n    <td>Matches\
    \ instances with child <code>Class.StyleQuery</code> that has <code>Class.StyleQuery.IsActive|IsActive</code>\
    \ set to <code>true</code>.<br /><br />\n    There are also built-in selectors\
    \ for <code>\"@ReducedMotionEnabledFalse\"</code>, <code>\"@ReducedMotionEnabledTrue\"\
    </code>, <code>\"@PreferredInputGamepad\"</code>, <code>\"@PreferredInputKeyboardAndMouse\"\
    </code>, <code>\"@PreferredInputTouch\"</code>, <code>\"@PreferredTextSizeMedium\"\
    </code>, <code>\"@PreferredTextSizeLarge\"</code>, <code>\"@PreferredTextSizeLarger\"\
    </code>, <code>\"@PreferredTextSizeLargest\"</code>, <code>\"@ViewportDisplaySizeSmall\"\
    </code>, <code>\"@ViewportDisplaySizeMedium\"</code>, and <code>\"@ViewportDisplaySizeLarge\"\
    </code> that can match an instance without a <code>Class.StyleQuery</code> instance.</td>\n\
    \    <td><code>\"@StyleQuerySmall\"</code></td>\n  </tr>\n</tbody>\n</table>\n\
    \n#### Combinators\n\n<table>\n<thead>\n  <tr>\n    <th>Combinator</th>\n    <th>Description</th>\n\
    \    <th>Examples</th>\n  </tr>\n</thead>\n<tbody>\n  <tr>\n    <td><code>&gt;</code></td>\n\
    \    <td>Matches instances that are <b>direct children</b> of the previous filter\
    \ matches.</td>\n    <td width=\"40%\"><code>\"Frame &gt; .Inventory\"</code></td>\n\
    \  </tr>\n  <tr>\n    <td><code>&gt;&gt;</code></td>\n    <td>Matches instances\
    \ that are <b>descendants</b> of the previous filter matches.</td>\n    <td><code>\"\
    ImageButton &gt;&gt; .BlueOnHover\"</code></td>\n  </tr>\n  <tr>\n    <td><code>,</code></td>\n\
    \    <td>Specifies a list of multiple independent selectors for the style rule.</td>\n\
    \    <td><code>\"Frame.TagA, TextLabel.TagA\"</code></td>\n  </tr>\n  <tr>\n \
    \   <td><code>::</code></td>\n    <td>Creates a phantom <code>Class.UIComponent</code>\
    \ instance under the previous filter matches and applies the style rule's properties\
    \ to it.<br /><br />\n    Multiple instances can be created for <code>Class.StyleQuery</code>\
    \ and <code>Class.UIStroke</code> by aliasing the instance with a name selector.\n\
    \    Some nested instances are supported, including <code>Class.UIGradient</code>\
    \ under <code>Class.UIStroke</code> or <code>Class.UIConstraint</code> under a\
    \ <code>Class.UIGridLayout</code>.</td>\n    <td><code>\"Frame::UICorner\" \"\
    ::UIStroke #Outer\"</code></td>\n  </tr>\n</tbody>\n</table>\n"
  code_samples:
