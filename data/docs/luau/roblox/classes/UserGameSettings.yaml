- name: UserGameSettings:GetOnboardingCompleted
  summary: 'Checks if onboarding has been completed.

    '
  description: "Checks whether or not the given onboarding has been completed yet,\
    \ which\nis useful for avoiding showing the onboarding animation again.\n\nIf\
    \ onboardingId is not one of the accepted IDs, an error is thrown.\n\nThe onboarding\
    \ process is one-way. This means that, as a developer, you\ncan force the onboarding\
    \ process to completion but cannot reset it.\n\nSee also:\n\n- `Class.UserGameSettings:SetOnboardingCompleted()`,\
    \ sets onboarding as\n  completed\n"
