- name: UserGameSettings:SetOnboardingCompleted
  summary: 'Sets onboarding as completed.

    '
  description: "Sets the given onboarding as completed, so it won't be shown again\
    \ to the\nuser the next time they play.\n\nCurrently, this function only accepts\n\
    [DynamicThumbstick](../../../luau/strings.md), and it is used to\npersistently\
    \ track whether or not the player has finished the tutorial for\nthe Dynamic Thumbstick\
    \ control scheme. If onboardingId is not one of the\naccepted IDs, an error is\
    \ thrown.\n\nThe onboarding process is one-way. This means that, as a developer,\
    \ you\ncan force the onboarding process to completion but cannot reset it.\n\n\
    See also:\n\n- `Class.UserGameSettings:GetOnboardingCompleted()`, checks if onboarding\n\
    \  has been completed\n"
  code_samples: []
  parameters:
  - name: onboardingId
    type: string
    default: null
