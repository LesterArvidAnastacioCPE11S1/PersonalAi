- name: TextChatService.CreateDefaultCommands
  summary: 'Determines whether `Class.TextChatService` should create default

    `Class.TextChatCommand|TextChatCommands`.

    '
  description: "Determines whether `Class.TextChatService` should create default\n\
    `Class.TextChatCommand|TextChatCommands`. If `true`, the following\n`Class.TextChatCommand|TextChatCommands`\
    \ are created and put in a\n`Class.Folder` named **TextChatCommands** inside `Class.TextChatService`:\n\
    \n<table>\n  <thead>\n    <tr>\n      <th>Name</th>\n      <th>Primary Alias</th>\n\
    \      <th>Secondary Alias</th>\n      <th>Description</th>\n      <th>Usage Example</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><b>RBXClearCommand</b></td>\n\
    \      <td>clear</td>\n      <td>cls</td>\n      <td>Clears the chat log for the\
    \ local user.</td>\n      <td><code>/cls</code></td>\n    </tr>\n    <tr>\n  \
    \    <td><b>RBXConsoleCommand</b></td>\n      <td>console</td>\n      <td></td>\n\
    \      <td>Opens the Developer Console.</td>\n      <td><code>/console</code></td>\n\
    \    </tr>\n    <tr>\n      <td><b>RBXEmoteCommand</b></td>\n      <td>emote</td>\n\
    \      <td>e</td>\n      <td>Plays an avatar emote.</td>\n      <td><code>/e dance</code></td>\n\
    \    </tr>\n    <tr>\n      <td><b>RBXHelpCommand</b></td>\n      <td>help</td>\n\
    \      <td>?</td>\n      <td>Shows a list of chat commands.</td>\n      <td><code>/help</code></td>\n\
    \    </tr>\n    <tr>\n      <td><b>RBXMuteCommand</b></td>\n      <td>mute</td>\n\
    \      <td>m</td>\n      <td>Mutes a user by their <code>Class.Player.Name|Name</code>\
    \ or <code>Class.Player.DisplayName|DisplayName</code> in all <code>Class.TextChannel|TextChannels</code>.</td>\n\
    \      <td><code>/m Username</code></td>\n    </tr>\n    <tr>\n      <td><b>RBXTeamCommand</b></td>\n\
    \      <td>team</td>\n      <td>t</td>\n      <td>Enters team chat mode where\
    \ messages are only visible to teammates.</td>\n      <td><code>/t</code></td>\n\
    \    </tr>\n    <tr>\n      <td><b>RBXUnmuteCommand</b></td>\n      <td>unmute</td>\n\
    \      <td>um</td>\n      <td>Unmutes a user by their <code>Class.Player.Name|Name</code>\
    \ or <code>Class.Player.DisplayName|DisplayName</code> in all <code>Class.TextChannel|TextChannels</code>.</td>\n\
    \      <td><code>/um Username</code></td>\n    </tr>\n    <tr>\n      <td><b>RBXVersionCommand</b></td>\n\
    \      <td>version</td>\n      <td>v</td>\n      <td>Shows the chat version.</td>\n\
    \      <td><code>/version</code></td>\n    </tr>\n    <tr>\n      <td><b>RBXWhisperCommand</b></td>\n\
    \      <td>whisper</td>\n      <td>w</td>\n      <td>Enters whisper mode with\
    \ another <code>Class.Player</code>.</td>\n      <td><code>/w DisplayName</code>\
    \ or <code>/w @Username</code></td>\n    </tr>\n  </tbody>\n</table>\n\nNote that\
    \ you can edit, create, and remove\n`Class.TextChatCommand|TextChatCommands` even\
    \ if\n`Class.TextChatService.CreateDefaultCommands|CreateDefaultCommands` is\n\
    `true`. Also note that mute and unmute commands apply to all\n`Class.TextChannel|TextChannels`.\n"
  code_samples: []
  type: boolean
  tags: []
  deprecation_message: ''
