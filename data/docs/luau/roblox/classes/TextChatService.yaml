- name: TextChatService.CreateDefaultTextChannels
  summary: 'Determines whether `Class.TextChatService` should create default

    `Class.TextChannel|TextChannels`.

    '
  description: "Determines whether `Class.TextChatService` should create default\n\
    `Class.TextChannel|TextChannels`. If `true`, a `Class.Folder` named\n**TextChannels**\
    \ is created inside `Class.TextChatService` at runtime to\ncontain the `Class.TextChannel|TextChannels`\
    \ outlined in the table below.\nEach of the default channels has the described\
    \ special behavior applied to\nmessages using its internally bound `Class.TextChannel.OnIncomingMessage`\n\
    callback function, changing how messages appear when sent through the\nchannel.\
    \ The callback is assigned automatically either at runtime (if the\n`Class.TextChannel`\
    \ exists) or when the `Class.TextChannel` is created.\n\n<table>\n  <thead>\n\
    \    <tr>\n      <th>Channel</th>\n      <th>Description</th>\n    </tr>\n  </thead>\n\
    \  <tbody>\n    <tr>\n      <td><b>RBXGeneral</b></td>\n      <td><code>Class.TextChannel</code>\
    \ for player messages. In the chat window, messages are modified such that <code>Class.TextChatMessage.PrefixText|PrefixText</code>\
    \ receives a <a href=\"../../../ui/rich-text.md\">rich text</a> font color tag\
    \ to give chatting players their distinctive name color. If <code>Class.Player.Team</code>\
    \ exists, that <code>Class.Team.TeamColor</code> is used instead of the default\
    \ name color.</td>\n    </tr>\n    <tr>\n      <td><b>RBXSystem</b></td>\n   \
    \   <td><code>Class.TextChannel</code> for system messages. In the chat window,\
    \ messages are modified such that <code>Class.TextChatMessage.Text</code> is given\
    \ a light grey color tag by default, or a red color tag if <code>Class.TextChatMessage.Metadata</code>\
    \ contains the word <code>\"Error\"</code>.</td>\n    </tr>\n    <tr>\n      <td><b>RBXTeam[BrickColor]</b></td>\n\
    \      <td><code>Class.TextChannel</code> for team-specific player messages, created\
    \ when a <code>Class.Team.TeamColor|TeamColor</code> is in use by any <code>Class.Team</code>\
    \ within the <code>Class.Teams</code> service. Name of the created channel is\
    \ <b>RBXTeam</b> followed by the <code>Class.Team.TeamColor|TeamColor</code> name.\
    \ For example, <b>RBXTeamCrimson</b> is a <code>Class.TextChannel</code> created\
    \ when there is an active team whose <code>Class.Team.TeamColor|TeamColor</code>\
    \ property is the \"Crimson\" <code>Datatype.BrickColor</code>.<br /><br />In\
    \ the chat window, messages are modified such that <code>Class.TextChatMessage.PrefixText|PrefixText</code>\
    \ is colored according to the <code>Class.Player.TeamColor|TeamColor</code> and\
    \ is prepended with <b>[Team]</b>.<br /><br />Team channels create <code>Class.TextSource|TextSources</code>\
    \ for all non‑<code>Class.Player.Neutral|Neutral</code> players with the matching\
    \ <code>Class.Team.TeamColor|TeamColor</code>, allowing them to use team‑only\
    \ chat. Channels are removed if there are no remaining teams with an associated\
    \ <code>Class.Team.TeamColor|TeamColor</code>.</td>\n    </tr>\n    <tr>\n   \
    \   <td><b>RBXWhisper:[UserId1]_[UserId2]</b></td>\n      <td><code>Class.TextChannel</code>\
    \ for whisper messages between two players, created when a player uses the <code>/whisper</code>\
    \ command on another player. For example <b>RBXWhisper:2276836_505306092</b> is\
    \ a <code>Class.TextChannel</code> for players with <code>Class.Player.UserId|UserIds</code>\
    \ <b>2276836</b> and <b>505306092</b>. Inside whisper channels are two <code>Class.TextSource|TextSources</code>\
    \ associated with the respective <code>Class.Player.UserId|UserIds</code>.<br\
    \ /><br />In the chat window, messages are colored the same as those in <b>RBXGeneral</b>\
    \ and <code>Class.TextChatMessage.PrefixText</code> is modified to show whether\
    \ a message was sent from or received by the local user.<br /><br />Whisper channels\
    \ are removed when either player leaves the experience.</td>\n    </tr>\n  </tbody>\n\
    </table>\n\nNote that the default `Class.TextChannel.OnIncomingMessage` callbacks\
    \ can\nbe overwritten. Also note that you can edit, create, and remove\n`Class.TextChannel|TextChannels`\
    \ even if\n`Class.TextChatService.CreateDefaultTextChannels|CreateDefaultTextChannels`\n\
    is `true`.\n\nMessages from different TextChannels can be separated into different\
    \ tabs\nin the chat window using `Class.ChannelTabsConfiguration`.\n"
  code_samples: []
  type: boolean
  tags: []
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: true
    can_save: true
  capabilities:
