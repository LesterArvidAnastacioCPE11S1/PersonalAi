methods:
- name: TextChatService:CanUserChatAsync
  summary: 'Determines whether a user has permission to chat in experiences.

    '
  description: 'Determines whether a user has permission to chat in experiences. Factors

    such as parental control settings may prevent the user from sending

    messages. Errors if the `userId` is not in the current server. Note that

    this method can be used with all current player

    `Class.Player.UserId|UserIds` in a `Class.Script` with

    `Class.Script.RunContext|RunContext` of `Enum.RunContext.Server` or

    `Enum.RunContext.Legacy`. This method can also be used in a

    `Class.LocalScript` but only with the `Class.Player.UserId|UserId` of the

    local player.

    '
  code_samples: []
  parameters:
  - name: userId
    type: User
    default: null
    summary: 'The `Class.Player.UserId` of the user whose chat permission is being

      checked.

      '
  returns:
  - type: boolean
    summary: 'A boolean indicating whether the user has permission to chat.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Chat
- name: TextChatService:CanUsersChatAsync
  summary: 'Determines whether or not two users can receive messages from each other.

    '
  description: 'Determines whether or not two users can receive messages from each
    other.

    Both users must be in the current server, otherwise an error will occur.


    Factors such as incompatible parental control settings or blocked status

    may prevent the delivery of messages between users

    (`Class.TextChannel|TextChannels` internally use this result to determine

    whether to deliver messages between users). Note that this method is only

    available for use in a `Class.Script` with

    `Class.Script.RunContext|RunContext` of `Enum.RunContext.Server` or

    `Enum.RunContext.Legacy`.

    '
  code_samples: []
  parameters:
  - name: userIdFrom
    type: User
    default: null
    summary: 'The `Class.Player.UserId` of the potential message sender.

      '
  - name: userIdTo
    type: User
    default: null
    summary: 'The `Class.Player.UserId` of the potential message receiver.

      '
  returns:
  - type: boolean
    summary: 'A boolean indicating whether the two users can exchange messages.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Chat
- name: TextChatService:CanUsersDirectChatAsync
  summary: 'Determines whether a user has permission to chat directly with other users

    in experiences based on factors such as their parental control settings.

    '
  description: "Determines whether a user has permission to chat directly with other\
    \ users\nin experiences based on their parental control settings, such as a whisper\n\
    channel between two users. To be used when:\n\n- The line of communication is\
    \ user-initiated (not developer- or\n  gameplay-initiated).\n- Access to the communication\
    \ is closed and limited.\n\nYou may use this method to gate certain features in\
    \ your experience\ndepending on the result.\n\nWhen creating a `Class.TextChannel`\
    \ for a direct chat, use\n`Class.TextChannel:SetDirectChatRequester` to set the\
    \ `requesterUserId` so\nthat the channel can determine whether to deliver messages\
    \ between users.\nWhen `Class.TextChannel.DirectChatRequester` is non-`nil`,\n\
    `Class.TextChannel|TextChannels` internally use this result to determine\nwhether\
    \ to deliver messages between users.\n\nNote that this method is only available\
    \ for use in a `Class.Script` with\n`Class.Script.RunContext|RunContext` of `Enum.RunContext.Server`\
    \ or\n`Enum.RunContext.Legacy`.\n"
  code_samples:
  - TextChatService-User-Chat
  parameters:
  - name: requesterUserId
    type: User
    default: null
    summary: 'The user who would have initiated the direct chat request. If the user

      is not in the current server, this method will error.

      '
  - name: userIds
    type: Array
    default: null
    summary: 'A list of users who the `requesterUserId` would like to chat with

      directly. Users not in the current server are ignored.

      '
  returns:
  - type: Array
    summary: 'A list of users who could participate in the direct chat request. If

      none of the users can direct chat with the `requesterUserId`, the

      result is an empty array.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Chat
