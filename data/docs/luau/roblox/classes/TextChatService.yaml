- name: TextChatService.PlatformIntegratedChat
  summary: 'Determines whether platform-integrated chat is enabled for the experience.

    Requires `RobloxScript` security.

    '
  description: 'Requires `RobloxScript` security; not accessible from experience scripts.

    Controls whether platform-integrated chat is enabled for the experience.

    When set to `Enum.RolloutState.Enabled`,

    `Class.TextChatService.OnIncomingMessage` and

    `Class.TextChannel.OnIncomingMessage` callbacks from developer scripts are

    not invoked, and only CoreScripts can set those callbacks. When set to

    `Enum.RolloutState.Disabled`, behavior is explicitly disabled. Defaults to

    `Enum.RolloutState.Default`.

    '
