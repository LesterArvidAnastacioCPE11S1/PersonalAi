- name: InsertService:GetUserSets
  summary: 'Returns an array of dictionaries, containing information about sets owned

    by the user.

    '
  description: "Returns an array of dictionaries, containing information about sets\
    \ owned\nby the user. This includes\n\n- Sets the user is subscribed to.\n- Sets\
    \ that the user created.\n- A single set containing the models created by the\
    \ user.\n- A single set containing the decals created by the user.\n\nNote:\n\n\
    - All values in the dictionaries are\n  <a href=\"../../../luau/strings.md\">strings</a>,\
    \ even if they are a\n  number.\n\n<table>\n  <thead>\n  <tr>\n    <th>Name</th>\n\
    \    <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n    <td>Name</td>\n\
    \    <td>The name of the set.</td>\n  </tr>\n  <tr>\n    <td>Description</td>\n\
    \    <td>The description of the set.</td>\n  </tr>\n  <tr>\n    <td>ImageAssetId</td>\n\
    \    <td>An assetId for the icon of the set.</td>\n  </tr>\n  <tr>\n    <td>CreatorName</td>\n\
    \    <td>The creator of the set.</td>\n  </tr>\n  <tr>\n    <td>AssetSetId</td>\n\
    \    <td>The set's unique ID on the website.</td>\n  </tr>\n  <tr>\n    <td>CategoryId</td>\n\
    \    <td>Identical to AssetSetId</td>\n  </tr>\n  <tr>\n    <td>SetType</td>\n\
    \    <td>The type of set that this set is.</td>\n  </tr>\n  </tbody>\n</table>\n"
  code_samples: []
  parameters:
  - name: userId
    type: User
    default: null
    summary: 'The ID of the user whose sets to retrieve.

      '
  returns:
  - type: Array
    summary: 'An array of dictionaries containing information about the user''s sets.

      '
