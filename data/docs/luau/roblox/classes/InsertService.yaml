- name: InsertService:LoadAsset
  summary: 'Returns a `Class.Model` containing the asset.

    '
  description: "The LoadAsset function fetches an asset given its ID and returns a\n\
    `Class.Model` containing the asset. For example, to load this public\n[Doge](https://www.roblox.com/library/257489726/Doge)\
    \ `Class.Model`, which\nhas the asset ID **_257489726_**, you can use:\n\n```lua\n\
    local InsertService = game:GetService(\"InsertService\")\nlocal Workspace = game:GetService(\"\
    Workspace\")\n\nlocal assetId = 257489726\nlocal model = InsertService:LoadAsset(assetId)\n\
    model.Parent = Workspace\n```\n\nCalls to this function may fail if a server providing\
    \ a model is having\nproblems. As such, it's generally a good idea to wrap calls\
    \ to this\nfunction in `pcall` to catch these kinds of errors.\n\n```lua\nlocal\
    \ InsertService = game:GetService(\"InsertService\")\nlocal Workspace = game:GetService(\"\
    Workspace\")\n\nlocal assetId = 257489726\n\nlocal success, model = pcall(InsertService.LoadAsset,\
    \ InsertService, assetId)\nif success and model then\n\tprint(\"Model loaded successfully\"\
    )\n\tmodel.Parent = Workspace\nelse\n\tprint(\"Model failed to load!\")\nend\n\
    ```\n\n#### Security Check\n\nAn asset loaded by this function must meet one of\
    \ the following:\n\n- The asset must be **created or owned** by the game creator.\n\
    - The asset must be **shared** by the asset owner.\n- The asset must be owned\
    \ by Roblox.\n\nAdditionally, benign asset types such as t-shirts, shirts, pants\
    \ and\navatar accessories are loadable from any game as they are `OpenUse`.\n\n\
    To load assets which do not meet the above criteria, such as free Models\npublished\
    \ on the Store, you must use `Class.AssetService:LoadAssetAsync()`\nand enable\
    \ `Class.AssetService.AllowInsertFreeAssets`.\n\nSee also:\n\n- `Class.AssetService:GetBundleDetailsAsync()`,\
    \ to find out which assets\n  are associated with a bundle.\n- For plugins, see\
    \ `Class.DataModel:GetObjects()`\n"
  code_samples:
  - InsertService-LoadAsset1
  parameters:
  - name: assetId
    type: int64
    default: null
    summary: 'The asset ID of the asset being loaded.

      '
  returns:
  - type: Instance
    summary: 'An instance of the loaded asset.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - LoadOwnedAsset
