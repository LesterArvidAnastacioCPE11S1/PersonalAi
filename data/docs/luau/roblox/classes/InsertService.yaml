name: InsertService
type: class
memory_category: Instances
summary: 'Used to insert assets from the Roblox website.

  '
description: "InsertService is used to insert assets from the Roblox website, typically\
  \ the\n`Class.InsertService:LoadAsset()|LoadAsset` function.\n\nTo load an asset,\
  \ it must be accessible by the creator of the experience\nloading it, which can\
  \ be either a user or group. Should an experience be\nuploaded by a different creator,\
  \ the asset data would not be accessible. See\nthe `Class.InsertService:LoadAsset()|LoadAsset()`\
  \ method for more details on\nthis security check. Note that you should **not**\
  \ use this service for loading\nAPI keys or other secrets. Use `Class.HttpService:GetSecret()`\
  \ instead.\n\n#### See Also\n\n- `Class.AssetService`, which can provide information\
  \ about assets you might\n  want to load using InsertService\n"
