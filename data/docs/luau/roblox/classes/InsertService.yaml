- name: InsertService:GetFreeDecalsAsync
  summary: 'Retrieves a list of free Decals from the Catalog.

    '
  description: "The GetFreeDecalsAsync function retrieves a list of free\n`Class.Decal|Decals`\
    \ from the Catalog. The return type for this method is\nvery odd, as it returns\
    \ a single table wrapped in a table.\n\nThe best way to explain it is to show\
    \ a visual of the array returned:\n\n```lua\n[1] = {\n\tCurrentStartIndex = 1,\
    \ -- This can vary depending on the page you input.\n\tTotalCount = 21, -- Always\
    \ 21.\n\tResults = {\n\t\t-- All parameters here are pseudo. They can vary depending\
    \ on the asset.\n\t\t[1] = {\n\t\t\tName = \"Asset Name\",\n\t\t\tAssetId = 0000000,\n\
    \t\t\tAssetVersionId = 0000000,\n\t\t\tCreatorName = \"Roblox\",\n\t\t},\n\t\t\
    -- [2], [3], and so on... up to [21]\n\t},\n}\n```\n\nAn example for iterating\
    \ over this list has been provided at the bottom of\nthis page.\n\nAdditionally,\
    \ if you want to insert `Class.Model|Models` instead, you can\nuse the `Class.InsertService:GetFreeModelsAsync()`\
    \ function.\n\n_Note:_ The page argument starts at 0. So Page 1 = 0, Page 2 =\
    \ 1, etc.\n"
  code_samples:
  - InsertService-GetFreeDecals1
  parameters:
  - name: searchText
    type: string
    default: null
    summary: 'String used to search for free decals in the Catalog.

      '
  - name: pageNum
    type: int
    default: null
    summary: 'The page number in the Catalog to return.

      '
  returns:
  - type: Array
    summary: 'A single table (of returned free decals) wrapped in a table.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
