name: AnimationConstraint
type: class
memory_category: BaseParts
summary: 'Aligns two `Class.BasePart|BaseParts` with an animate-able kinematic or

  force-based joint that supports physical simulation (ragdoll, arm strength).

  The default joint type for R15 avatar rigs.

  '
description: "#### Replaces Motor6D for Avatar rigs\n\nAs part of the\n[Avatar Joint\
  \ Upgrade](https://devforum.roblox.com/t/avatar-joint-upgrade-for-physically-simulated-character-movement-is-now-live/4298561),\n\
  `AnimationConstraint` is the **replacement for `Class.Motor6D`** in\n[R15 player\
  \ character rigs](../../../avatar/character-bodies/specifications.md#rigging).\n\
  When `Class.StarterPlayer.AvatarJointUpgrade|AvatarJointUpgrade` is enabled\n(the\
  \ default for new experiences), player characters spawn with\nAnimationConstraints\
  \ instead of Motor6Ds. Unlike Motor6D, AnimationConstraint\nsupports both kinematic\
  \ animation and force-based physical simulation —\nenabling ragdoll physics, arm\
  \ strength, and other physically simulated\ncharacter movement without rebuilding\
  \ the rig.\n\n#### Migrating from Motor6D\n\nIf you have existing code that uses\
  \ Motor6D for character rigs, note these key\ndifferences. See also the\n[Phase\
  \ 2 migration recommendations](https://devforum.roblox.com/t/avatar-joint-upgrade-aju-phase-2-rollout-updated-migration-recommendations/4656414).\n\
  \n- **Finding joints**: Use `:FindFirstChildWhichIsA(\"AnimationConstraint\")`\n\
  \  instead of `:FindFirstChildOfClass(\"Motor6D\")`. For code that must support\n\
  \  both old and new rigs, check for AnimationConstraint first, then fall back\n\
  \  to Motor6D.\n- **C0, C1, Part0, Part1**: These properties exist on AnimationConstraint\
  \ as\n  **read-only** aliases for backwards compatibility. They map to\n  `Attachment0.CFrame`,\
  \ `Attachment1.CFrame`, `Attachment0.Parent`, and\n  `Attachment1.Parent` respectively.\
  \ Do not attempt to write to them.\n- **Do not modify RigAttachment.CFrame directly**\
  \ — this disrupts animation\n  retargeting and causes performance issues.\n- **Transform**:\
  \ Works identically to `Class.Motor6D.Transform` — the\n  `Class.Animator` writes\
  \ to it each frame. Layer procedural animations by\n  multiplying into `Transform`\
  \ during `Class.RunService.PreSimulation`, which\n  stacks with active animation\
  \ tracks without breaking retargeting.\n- **IsKinematic**: When `true` (default),\
  \ behavior is equivalent to Motor6D.\n  Set to `false` to enable force-based physical\
  \ simulation.\n- **Type checks**: `animConstraint:IsA(\"Motor6D\")` returns `false`.\
  \ Update any\n  `IsA(\"Motor6D\")` guards to also accept `\"AnimationConstraint\"\
  `.\n- **Server replication**: Instead of setting C0 on the server, use client-side\n\
  \  animation evaluation and synchronize data through custom Attributes or\n  `Class.UnreliableRemoteEvent`.\n\
  \n##### Example: Procedural neck rotation\n\n```lua\n-- Before (Motor6D): writing\
  \ to C0 directly\nlocal originalC0 = neck.C0\nRunService.RenderStepped:Connect(function()\n\
  \    neck.C0 = originalC0 * computeNeckRotation()\nend)\n\n-- After (AnimationConstraint):\
  \ multiplying into Transform during PreSimulation\nRunService.PreSimulation:Connect(function()\n\
  \    if not animator.EvaluationThrottled then\n        neck.Transform = computeNeckRotation()\
  \ * neck.Transform\n    end\nend)\n```\n\n#### Description\n\nAn `AnimationConstraint`\
  \ constrains its `Class.Attachment|Attachments` so that\nthey're offset by `Class.AnimationConstraint.Transform|Transform`.\
  \ When\n`Class.AnimationConstraint.IsKinematic|IsKinematic` is `true`, the parts\n\
  follow the transform perfectly (identical to Motor6D behavior). When `false`,\n\
  the constraint applies forces and torques limited by\n`Class.AnimationConstraint.MaxForce|MaxForce`\
  \ and\n`Class.AnimationConstraint.MaxTorque|MaxTorque`, enabling physically simulated\n\
  character movement.\n"
