- name: AnimationConstraint.Transform
  summary: 'Describes the current animation offset of the constraint joint.

    '
  description: 'The internal `Datatype.CFrame` that is manipulated when the constraint
    is

    being animated.


    Note that `AnimationConstraint` transforms are not applied immediately,

    but rather as a batch in a parallel job after

    `Class.RunService.PreSimulation`, immediately before physics steps. The

    deferred batch update is much more efficient than many immediate updates.

    If the `AnimationConstraint` is part of an animated model with an

    `Class.Animator`, then `Class.AnimationConstraint.Transform|Transform` is

    usually overwritten every frame by the `Class.Animator` after

    `Class.RunService.PreAnimation` and before

    `Class.RunService.PreSimulation`.

    '
