- name: ScriptDebuggerService.Resumed
  summary: 'Fires when a previously paused thread resumes execution.

    '
  description: 'Fires when a previously paused thread resumes. After this event, all

    `frameId` values, `VariablesReference` values, and script variable objects

    from that thread are invalidated. Re-fetch them the next time the

    `Class.DataModel` stops if needed.


    Avoid modifying the `Class.DataModel`, throwing unhandled errors, or

    calling async yielding functions inside this event handler.

    '
  code_samples: []
  parameters:
  - name: threadIds
    type: Array
    default: null
    summary: 'An array of thread identifiers that resumed.

      '
  tags: []
