- name: ScriptDebuggerService:Evaluate
  summary: 'Evaluates a Luau expression in a stack frame''s context.

    '
  description: 'Evaluates a Luau expression in the context of the specified stack
    frame,

    or globally if no `frameId` is provided.


    Errors if the expression has a syntax error or `frameId` is invalid.

    '
  code_samples: []
  parameters:
  - name: expression
    type: string
    default: null
    summary: 'The Luau expression to evaluate.

      '
  - name: frameId
    type: int?
    default: nil
    summary: 'Optional frame identifier. If omitted, evaluates globally.

      '
  returns:
  - type: ScriptEvaluateResult
    summary: "Dictionary with the following key-value pairs:\n\n- `Result` — String\
      \ representation of the evaluated result.\n- `Type` — String indicating the\
      \ Luau type of the result (`\"number\"`,\n  `\"string\"`, `\"table\"`, `\"Instance\"\
      `, etc.).\n- `VariablesReference` — If greater than `0`, drill into with\n \
      \ `Class.ScriptDebuggerService:GetVariables()|GetVariables()`.\n"
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
- name: ScriptDebuggerService:GetRootVariables
  summary: 'Returns the root variables (locals, upvalues, globals) for a stack frame.

    '
  description: 'Returns the root variables (locals, upvalues, globals) for the specified

    stack frame. Each variable includes a `VariablesReference` field; if

    greater than `0`, pass it to

    `Class.ScriptDebuggerService:GetVariables()|GetVariables()` to drill into

    children.


    Errors if `frameId` is invalid. Returns empty if the `Class.DataModel` is

    not stopped at a breakpoint or exception, or when stopped via

    `Class.ScriptDebuggerService:Pause()|Pause()`.

    '
  code_samples: []
  parameters:
  - name: frameId
    type: int
    default: null
    summary: 'The frame identifier from a debug stack frame `Id` field (see

      `Class.ScriptDebuggerService:GetStackTrace()|GetStackTrace()`).

      '
  returns:
  - type: List<ScriptVariable>
    summary: "An array of script variable dictionaries, each containing the\nfollowing\
      \ key-value pairs:\n\n- `Name` — String value indicating the variable name or\
      \ table key.\n- `Value` — String representation of the value.\n- `Type` — String\
      \ indicating the Luau type (`\"number\"`, `\"string\"`,\n  `\"table\"`, `\"\
      Instance\"`, etc.).\n- `Scope` — `Enum.ScriptVariableScope` value (children\
      \ inherit\n  parent's scope).\n- `VariablesReference` — If greater than `0`,\
      \ call\n  `Class.ScriptDebuggerService:GetVariables()|GetVariables()` with\n\
      \  this to get children.\n"
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
- name: ScriptDebuggerService:GetStackTrace
  summary: 'Returns the call stack for a paused thread.

    '
  description: 'Returns the call stack for a paused thread, ordered innermost (current

    execution point) to outermost. Use `startFrame` (1‑based) for paginated

    retrieval of large stacks.


    Errors if `threadId` or `startFrame` is invalid.

    '
  code_samples: []
  parameters:
  - name: threadId
    type: int
    default: null
    summary: 'The thread identifier from a script debug thread `Id` field (see

      `Class.ScriptDebuggerService:GetThreads()|GetThreads()`).

      '
  - name: startFrame
    type: int?
    default: nil
    summary: 'Optional 1-based frame index for paginated retrieval.

      '
  returns:
  - type: DebugStackTraceResult
    summary: "Dictionary containing the frames ordered innermost (current) to\noutermost.\
      \ Contains the following key-value pairs:\n\n- `Frames` — Array of debug stack\
      \ frame dictionaries. Each dictionary\n  item contains the following key-value\
      \ pairs:\n  - `Id` — Numerical frame identifier; use with\n    `Class.ScriptDebuggerService:GetRootVariables()|GetRootVariables()`\n\
      \    and `Class.ScriptDebuggerService:Evaluate()|Evaluate()`.\n  - `Name` —\
      \ Human-readable name of the function at this frame.\n  - `ScriptPath` — Full\
      \ instance path of the script, for example\n    `\"ServerScriptService.MainScript\"\
      `.\n  - `Line` — 1-based line number where execution is paused at this\n   \
      \ frame.\n- `TotalFrames` — Total frame count, provided when paginating.\n"
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
