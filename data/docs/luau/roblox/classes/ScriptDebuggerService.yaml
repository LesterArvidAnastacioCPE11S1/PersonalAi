name: ScriptDebuggerService
type: class
memory_category: Instances
summary: 'Provides programmatic breakpoint management, execution control, and runtime

  inspection of Luau scripts during a playtest.

  '
description: '`ScriptDebuggerService` exposes the Roblox Studio Luau debugger for

  programmatic use. It provides functionality for breakpoint management,

  execution control, and runtime state inspection.


  **APIs in this class are currently in beta and are subject to breaking

  changes.**


  #### Breakpoint Propagation


  Breakpoints set in the **edit** `Class.DataModel` are set on the specific

  script instance and do not propagate to clones, but they propagate to

  corresponding scripts in play data models at the start of a playtest.

  Breakpoints set in a **play** `Class.DataModel` propagate to script clones in

  the same data model and to corresponding scripts in other data models.


  #### Parallel Threads


  The behavior of this API with parallel Luau is undefined.

  '
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: ''
properties: []
methods:
- name: ScriptDebuggerService:AddBreakpoint
  summary: 'Adds a breakpoint to a script. If a breakpoint already exists on the same

    script and line, its data is replaced.

    '
  description: 'Adds a breakpoint to the specified script. If a breakpoint already
    exists

    on the same script and line, its data is replaced with the new

    configuration.


    Errors if the script instance or breakpoint argument is invalid.

    '
  code_samples: []
  parameters:
  - name: scriptInstance
    type: LuaSourceContainer
    default: null
    summary: 'The `Class.LuaSourceContainer` to place the breakpoint on.

      '
  - name: breakpoint
    type: Dictionary
    default: null
    summary: "Dictionary describing the breakpoint configuration through the\nfollowing\
      \ key-value pairs:\n\n- `Line` — Required 1-based line number.\n- `Enabled`\
      \ — Optional boolean whether the breakpoint is active.\n  Default is `true`.\n\
      - `Condition` — Optional string indicating the Luau expression which\n  must\
      \ be truthy to pause, for example `\"health < 10\"`.\n- `LogMessage` — Optional\
      \ string message logged when the breakpoint is\n  hit. This string is parsed\
      \ as a comma-separated list of Luau\n  expressions, evaluated in the breakpoint's\
      \ scope, and concatenated\n  `Global.LuaGlobals.print()`‑style with spaces between\
      \ segments.\n  String literals are quoted; bare identifiers reference live values.\n\
      \  For example, `\"'count is', count\"` produces output like\n  `count is 7`.\n\
      - `ContinueExecution` — If `true`, the `Class.DataModel` does not\n  pause when\
      \ the breakpoint is hit. Default is `false`.\n"
  returns:
  - type: ScriptBreakpointResult
    summary: "Dictionary indicating whether the breakpoint was placed successfully\n\
      and on which line. Includes the following key-value pairs:\n\n- `Verified` —\
      \ Boolean value indicating whether the breakpoint was\n  placed successfully.\n\
      - `Line` — The line number the breakpoint was placed on.\n- `Message` — Optional\
      \ explanation if `Verified` is `false`.\n"
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
