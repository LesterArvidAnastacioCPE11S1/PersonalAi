callbacks:
- name: ScriptDebuggerService.OnStopped
  summary: 'The primary callback for reacting to debugger pauses. Returns a resume

    action.

    '
  description: 'The primary mechanism for reacting to debugger pauses. Set this to
    a

    function that receives a `stopped` payload and returns a script resume

    action dictionary indicating how execution should continue.


    Only one `OnStopped` per `Class.DataModel` is allowed; it is not inherited

    from the edit `Class.DataModel`.


    If the callback returns nothing or throws,

    `Enum.DebuggerResumeType.Resume` is assumed. Avoid modifying the

    `Class.DataModel`, throwing unhandled errors, or calling async yielding

    functions inside this callback.


    #### Late-Set Behavior


    If `OnStopped` is set while the `Class.DataModel` is already stopped at a

    breakpoint and the previous value was `nil`, the callback runs

    immediately.

    '
  code_samples: []
  parameters:
  - name: stopped
    type: Dictionary
    default: null
    summary: "Dictionary describing why the debugger paused. The following key-value\n\
      pairs are valid:\n\n- `Reason` — `Enum.ScriptStoppedReason` why the debugger\
      \ paused.\n- `ThreadIds` — Array of thread identifiers that stopped.\n- `ExceptionText`\
      \ — Error message present when `Reason` is\n  `Enum.ScriptStoppedReason.Exception`.\n"
  returns:
  - type: ScriptResumeAction
    summary: "Dictionary specifying how to resume execution. Contains the following\n\
      key-value pairs:\n\n- `steppedType` — `Enum.DebuggerResumeType` describing how\
      \ to resume.\n- `threadId` — Number indicating which thread to step. Required\
      \ for\n  step actions.\n"
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
  writeCapabilities: []
