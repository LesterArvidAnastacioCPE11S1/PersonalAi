- name: ScriptDebuggerService:Pause
  summary: 'Requests the debugger to pause at the next safe point.

    '
  description: 'Requests the debugger to pause at the next safe point. This method
    is

    asynchronous and returns immediately. When the thread pauses,

    `Class.ScriptDebuggerService.OnStopped|OnStopped` fires with reason

    `Enum.ScriptStoppedReason.Pause`. Has no effect if already stopped.


    Only meaningful when the `Class.DataModel` is running during a playtest.

    Calling `Pause()` while already stopped at a breakpoint has no effect.

    '
