- name: Sky.SkyboxOrientation
  summary: 'Angle of the skybox, in degrees, with rotation order of **Y**, **X**,

    **Z**.

    '
  description: "Changes the orientation of the skybox surfaces. This property takes\
    \ a\n`Datatype.Vector3` of degree values in the typical **XYZ** order, but\napplies\
    \ rotation **first** around the **Y** axis. After applying the Y\naxis rotation,\
    \ the orientation is applied to the **X** and **Z** axes to\nallow for predictable\
    \ control over complex movements. Your camera and\nobject orientation can affect\
    \ how this rotation appears to be applied.\n\nAn easy way to script an orientation\
    \ animation is to spin around the **Y**\naxis (keeping the horizon level), then\
    \ tilt this axis by setting **X** and\n**Z** to a fixed value:\n\n```lua\nlocal\
    \ Lighting = game:GetService(\"Lighting\")\nlocal RunService = game:GetService(\"\
    RunService\")\n\nlocal sky = Lighting:FindFirstChild(\"Sky\")\n\nlocal ROTATION_SPEED\
    \ = 5  -- In degrees per second\n\nRunService.Heartbeat:Connect(function(deltaTime)\n\
    \tsky.SkyboxOrientation = Vector3.new(\n\t\t30,\n\t\t(sky.SkyboxOrientation.Y\
    \ + ROTATION_SPEED * deltaTime) % 360,\n\t\t0\n\t)\nend)\n```\n\nSee [here](../../../environment/skybox.md#orientation)\
    \ for further info\nand limitations.\n"
  code_samples:
  - Skybox-Orientation
  type: Vector3
