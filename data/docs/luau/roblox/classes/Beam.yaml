methods:
- name: Beam:SetTextureOffset
  summary: 'Sets the current offset of the beam''s texture cycle.

    '
  description: "The offset of a beam's texture cycle represents the progress of its\n\
    texture animation. This method sets the current offset of the beam's\ntexture\
    \ cycle; hence, it can be used to reset the cycle by passing `0` as\nthe `offset`\
    \ parameter.\n\n#### Notes\n\n- The given `offset` parameter is expected to be\
    \ a value between 0 and 1,\n  but greater values can be used.\n- The texture cycle\
    \ wraps at 0 and 1, meaning the texture is in the same\n  position when the offset\
    \ is at 0 or 1.\n- If the `Class.Beam.Texture|Texture` property is not set, this\
    \ method\n  does nothing.\n- Increasing the offset will act in the inverse direction\
    \ to the\n  `Class.Beam.TextureSpeed|TextureSpeed` property, meaning it will move\n\
    \  the texture in the opposite direction to the direction the texture\n  animates\
    \ when `Class.Beam.TextureSpeed|TextureSpeed` is greater than 0.\n"
  code_samples: []
  parameters:
  - name: offset
    type: float
    default: 0
    summary: 'The desired offset of the texture cycle.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
