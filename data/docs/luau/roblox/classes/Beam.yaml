- name: Beam.TextureSpeed
  summary: 'Determines the speed at which the `Class.Beam.Texture|Texture` image moves

    along the beam.

    '
  description: "Sets the number of texture cycles per second at which the\n`Class.Beam.Texture|Texture`\
    \ image moves along the beam, where one cycle\nis a full traversal of the texture's\
    \ UV range. When this property is a\npositive value, the beam's texture will move\
    \ from\n`Class.Beam.Attachment0|Attachment0` to\n`Class.Beam.Attachment1|Attachment1`.\
    \ This direction can be inverted by\nsetting this property to a negative number.\
    \ The default value is `1`.\n\nHow far one cycle travels along the beam in studs\
    \ depends on\n`Class.Beam.TextureMode|TextureMode` and\n`Class.Beam.TextureLength|TextureLength`.\n\
    \n#### Examples\n\n- `-2` — Texture scrolls from `Class.Beam.Attachment1|Attachment1`\
    \ toward\n  `Class.Beam.Attachment0|Attachment0`, completing two cycles per second.\n\
    - `0` — Texture is static.\n- `1` — Texture scrolls from `Class.Beam.Attachment0|Attachment0`\
    \ toward\n  `Class.Beam.Attachment1|Attachment1`, completing one cycle per second\n\
    \  (default).\n- `2` — Texture scrolls from `Class.Beam.Attachment0|Attachment0`\
    \ toward\n  `Class.Beam.Attachment1|Attachment1`, completing two cycles per second.\n"
  code_samples: []
  type: float
