    to vary across the length of the beam.\n\nConsider the following `Datatype.NumberSequence`\
    \ which, when applied to a\nbeam, would yield the pictured result.\n\n```lua\n\
    local numberSequence = NumberSequence.new({\n\t\tNumberSequenceKeypoint.new(0,\
    \ 0), -- Opaque\n\t\tNumberSequenceKeypoint.new(0.5, 1), -- Transparent\n\t\t\
    NumberSequenceKeypoint.new(1, 0), -- Opaque\n\t}\n)\n```\n\n<img src=\"/assets/lighting-and-effects/beam/Transparency-Applied.png\"\
    \ width=\"800\" />\n\nNote that the beam's transparency also depends on the number\
