- name: Beam.Color
  summary: 'Determines the color of the beam across its

    `Class.Beam.Segments|Segments`.

    '
  description: "Determines the color of the beam across its\n`Class.Beam.Segments|Segments`.\
    \ If `Class.Beam.Texture|Texture` is set,\nthis color will be applied to the beam's\
    \ texture. If no\n`Class.Beam.Texture|Texture` is set, the `Class.Beam` will appear\
    \ as a\nsolid line colored in accordance with this property.\n\nThis property\
    \ is a `Datatype.ColorSequence`, allowing the color to be\nconfigured to vary\
    \ across the length of the beam. Consider the following\n`Datatype.ColorSequence`\
    \ which, when applied to a beam, would yield the\npictured result.\n\n```lua\n\
    local colorSequence = ColorSequence.new({\n\t\tColorSequenceKeypoint.new(0, Color3.fromRGB(255,\
    \ 0, 0)), -- Red\n\t\tColorSequenceKeypoint.new(0.5, Color3.fromRGB(0, 188, 203)),\
    \ -- Cyan\n\t\tColorSequenceKeypoint.new(1, Color3.fromRGB(196, 0, 255)), -- Purple\n\
    \t}\n)\n```\n\n<img src=\"/assets/lighting-and-effects/beam/ColorSequence-Applied.png\"\
    \ width=\"800\" />\n\nNote the beam's coloration also depends on the number of\n\
    `Class.Beam.Segments|Segments` the `Class.Beam` has. Each segment of the\nbeam\
    \ can only show a transition between two colors. Therefore a\n`Class.Beam` will\
    \ need to have at least `n-1` segments in order for the\ncolor to display correctly,\
    \ where `n` is the number of\n`Datatype.ColorSequenceKeypoint|ColorSequenceKeypoints`\
    \ in the\n`Datatype.ColorSequence`.\n"
