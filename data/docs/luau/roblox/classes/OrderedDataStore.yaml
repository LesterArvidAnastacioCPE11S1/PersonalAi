name: OrderedDataStore
type: class
memory_category: Instances
summary: 'A GlobalDataStore that also allows for ordered data store entries.

  '
description: 'A **OrderedDataStore** is essentially a `Class.GlobalDataStore` with
  the

  exception that stored values must be **integers**. It exposes a method

  `Class.OrderedDataStore:GetSortedAsync()|GetSortedAsync()` which allows

  inspection of the entries in sorted order using a `Class.DataStorePages`

  object.


  Ordered data stores do not support versioning and metadata, so

  `Class.DataStoreKeyInfo` is always `nil` for keys in an

  `Class.OrderedDataStore`. If you need versioning and metadata support, use a

  `Class.DataStore`.


  Ordered data stores do not support the optional `userIds` parameter for

  `Class.OrderedDataStore:SetAsync()|SetAsync()` or

  `Class.OrderedDataStore:IncrementAsync()|IncrementAsync()`.


  See [Data stores](../../../cloud-services/data-stores/index.md) for an

  overview on how to use ordered data stores.

  '
code_samples:
- OrderedDataStore-Basics
inherits:
- GlobalDataStore
descendants: []
tags:
- NotCreatable
- NotReplicated
deprecation_message: ''
properties: []
methods:
- name: OrderedDataStore:GetSortedAsync
  summary: 'Returns a `Class.DataStorePages` object.

    '
  description: 'Returns a `Class.DataStorePages` object. The sort order is determined
    by

    **ascending**, the length of each page by **pageSize**, and

    **minValue**/**maxValue** are optional parameters which filter the

    results.


    See

    [Error codes and limits](../../../cloud-services/data-stores/error-codes-and-limits.md)

    for request limits and descriptions of the error codes.

    '
  code_samples: []
  parameters:
  - name: ascending
    type: boolean
    default: null
    summary: 'A boolean indicating whether the returned data pages are in ascending

      order.

      '
  - name: pagesize
    type: int
    default: null
    summary: 'The length of each page. By default is 50. The max allowed value

      is 100.

      '
  - name: minValue
    type: Variant
    default: null
    summary: 'Optional parameter. If set, data pages with a value less than

      **minValue** will be excluded.

      '
  - name: maxValue
    type: Variant
    default: null
    summary: 'Optional parameter. If set, data pages with a value greater than

      **maxValue** will be excluded.

      '
  returns:
  - type: DataStorePages
    summary: 'A sorted `Class.DataStorePages` object based on the provided

      arguments.

      '
