- name: SlidingBallConstraint.ActuatorType
  summary: 'Sets whether the translation of the `Class.SlidingBallConstraint` is

    actuated and, if so, what kind of actuation.

    '
  description: "Sets whether the translation of the `Class.SlidingBallConstraint`\
    \ is\nactuated and, if so, what kind of actuation.\n\n- If `Class.SlidingBallConstraint|ActuatorType`\
    \ is set to\n  `Enum.ActuatorType|None`, the joint can slide freely.\n\n- If `Class.SlidingBallConstraint|ActuatorType`\
    \ is set to\n  `Enum.ActuatorType|Motor`, it attempts to translate the attachments\
    \ with\n  the goal of reaching `Class.SlidingBallConstraint|Velocity`. You can\n\
    \  further control this translation through both\n  `Class.SlidingBallConstraint|MotorMaxAcceleration`\
    \ and\n  `Class.SlidingBallConstraint|MotorMaxForce`.\n\n- If this constraint's\
    \ `Class.SlidingBallConstraint|ActuatorType` is set\n  to `Enum.ActuatorType|Servo`,\
    \ it attempts to translate the attachments\n  to a set separation specified by\n\
    \  `Class.SlidingBallConstraint|TargetPosition`. This translation is\n  controlled\
    \ by `Class.SlidingBallConstraint|Speed`,\n  `Class.SlidingBallConstraint|LinearResponsiveness`,\
    \ and\n  `Class.SlidingBallConstraint|ServoMaxForce`.\n"
