- name: StudioService:PromptImportFile
  summary: 'Prompts the current Studio user to select one file to add as a

    `Class.File`.

    '
  description: "This function prompts the current Studio user to select one file,\
    \ which\nwill then be loaded as a `Class.File`.\n\nSee also:\n\n- `Class.StudioService:PromptImportFiles()`,\
    \ the same function but for\n  loading a list of files instead of a single file\n"
  code_samples: []
  parameters:
  - name: fileTypeFilter
    type: Array
    default: '{}'
    summary: 'A list of file types that the user is allowed to select. File types

      are formatted without a period. For example, {"jpg", "png"} would

      allow only a JPG or PNG file to be selected. If no filter is provided,

      the filter is `nil` and allows the user to select any file type.

      '
  returns:
  - type: Instance
    summary: 'The imported `Class.File`. Returns `nil` if no files were selected,
      or

      if the selected file was too large (FileSize greater than 100

      megabytes).

      '
  tags:
  - Yields
  - Deprecated
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
