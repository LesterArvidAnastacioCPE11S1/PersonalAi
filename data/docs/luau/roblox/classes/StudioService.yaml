methods:
- name: StudioService:GetClassIcon
  summary: 'Provides a dictionary that allows the display of a class'' Explorer window

    icon.

    '
  description: "**GetClassIcon** provides a dictionary that allows the display of\
    \ a class'\nExplorer window icon, e.g. calling this function with \"Part\" returns\n\
    property values that display the part icon from the Explorer window.\n\nBelow\
    \ is a literal table representation of the value returned when this\nfunction\
    \ is called with `\"Part\"`.\n\n```\n{\n\tImage = \"rbxasset://textures/ClassImages.png\"\
    ,\n\tImageRectOffset = Vector2.new(16, 0),\n\tImageRectSize = Vector2.new(16,\
    \ 16)\n}\n```\n\nThe utility function below may prove useful when displaying class\
    \ icons:\n\n```lua\nlocal StudioService = game:GetService(\"StudioService\")\n\
    local imageLabel = script.Parent\nlocal function displayClassIcon(image, className)\n\
    \tfor k, v in StudioService:GetClassIcon(className) do\n\t\timage[k] = v -- Set\
    \ property\n\tend\nend\ndisplayClassIcon(imageLabel, \"Part\")\n```\n"
  code_samples: []
  parameters:
  - name: className
    type: string
    default: null
    summary: 'The name of the Roblox class to retrieve the Explorer window icon for.

      '
  returns:
  - type: Dictionary
    summary: 'A dictionary containing `Image`, `ImageRectOffset`, and

      `ImageRectSize` fields that can be applied to an `Class.ImageLabel` to

      display the class icon.

      '
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
