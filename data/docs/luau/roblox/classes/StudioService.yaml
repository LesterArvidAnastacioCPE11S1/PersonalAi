name: StudioService
type: class
memory_category: Instances
summary: 'Provides access to configuration of Roblox Studio and allows importing files

  from the user''s file system.

  '
description: "**StudioService** provides access to configuration of Roblox Studio,\
  \ allows\nimporting files from the user's file system, and other miscellaneous\n\
  information. It is intended to be used by `Class.Plugin|Plugins` in order to\nprovide\
  \ a consistent user experience.\n\n- Plugins that allow the user to move objects\
  \ may find\n  `Class.StudioService.GridSize|GridSize`,\n  `Class.StudioService.RotateIncrement|RotateIncrement`\
  \ and\n  `Class.StudioService.UseLocalSpace|UseLocalSpace` useful.\n- Plugins that\
  \ require the user to import files should use\n  `Class.StudioService:PromptImportFileAsync()|PromptImportFileAsync`\
  \ or\n  `Class.StudioService:PromptImportFilesAsync()|PromptImportFilesAsync` in\n\
  \  order to receive `Class.File` objects.\n- Plugins that display icons of Instance\
  \ classes can use\n  `Class.StudioService:GetClassIcon()|GetClassIcon`.\n- Plugins\
  \ that care about which script is currently being edited (if any) can\n  read this\
  \ from `Class.StudioService.ActiveScript|ActiveScript`.\n"
code_samples: []
inherits:
- Instance
descendants: []
tags:
- NotCreatable
- Service
- NotReplicated
deprecation_message: ''
