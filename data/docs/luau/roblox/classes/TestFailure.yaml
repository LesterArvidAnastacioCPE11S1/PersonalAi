name: TestFailure
type: class
memory_category: Instances
summary: 'Details of one failed check in a test.

  '
description: "A `TestFailure` describes one `Class.TestCase:Check()` or\n`Class.TestCase:Require()`\
  \ call that failed: its message, the expected and\nactual values, and where in your\
  \ code it was called. Get them from\n`Class.TestResult:GetFailures()`.\n\nA `TestFailure`\
  \ isn't an `Class.Instance` and can't be parented.\n\n```lua\nfor _, test in result:GetTests()\
  \ do\n\tfor _, failure in test:GetFailures() do\n\t\tlocal source = failure:GetSource()\n\
  \t\tlocal location = if source then `{source:GetFullName()}:{failure.Line}` else\
  \ \"unknown\"\n\t\twarn(`{test.TestId} at {location}: {failure.Message}`)\n\t\t\
  warn(`  expected {failure:GetExpected()}, got {failure:GetActual()}`)\n\tend\nend\n\
  ```\n"
