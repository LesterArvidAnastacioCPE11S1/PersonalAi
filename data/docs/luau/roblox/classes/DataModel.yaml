- name: DataModel.JobId
  summary: 'A unique identifier for the running game server instance.

    '
  description: "This property is a unique identifier for the running game server instance.\n\
    It is a universally unique identifier (UUID), meaning that no two servers,\npast\
    \ or present, will ever have the same ID.\n\nDefaults to an empty string in Studio.\n\
    \n#### See Also\n\n- `Class.TeleportService:GetPlayerPlaceInstanceAsync()` which\
    \ can be used\n  to retrieve the `Class.DataModel.JobId` of a user's current server.\n\
    - `Class.TeleportService:TeleportToPlaceInstance()` which can be used to\n  teleport\
    \ a `Class.Player` to a specific server.\n- `Class.DataModel.PrivateServerId`\
    \ describes the ID of the private server\n  the game server instance belongs to.\n\
    - `Class.HttpService:GenerateGUID()`, a function that can be used to\n  generate\
    \ your own UUIDs.\n"
