- name: DataModel.PrivateServerId
  summary: 'Describes the private server ID of the server, if the server is a VIP

    server or a reserved server. VIP servers and reserved servers are the two

    types of private servers.

    '
  description: "This property describes the private server ID of the server, if the\
    \ server\nis a private server.\n\nIf the server is not a private server, then\
    \ this property will be an empty\nstring.\n\n#### Private servers\n\nPrivate servers\
    \ refer to the following:\n\n- [VIP servers](../../../production/monetization/private-servers.md),\n\
    \  private servers that users can purchase from the games page.\n- Reserved servers,\
    \ private servers created by the developer using\n  `Class.TeleportService:TeleportAsync()`\
    \ with\n  `Class.TeleportOptions.ReservedServerId`.\n\n#### PrivateServerId vs\
    \ JobId\n\nThe PrivateServerId of a server is different from the\n`Class.DataModel.JobId`.\
    \ The `Class.DataModel.JobId|JobId` is the unique\nidentifier of the current server\
    \ instance.\n\nPrivate servers (private or reserved servers) can have multiple\
    \ server\ninstances associated with them over time. This is because, although\
    \ only\none server instance can be running at once for a private server, new\n\
    server instances can open and close as players join and leave the game.\nFor example,\
    \ no server instance is running when nobody is playing in the\nserver. The PrivateServerId\
    \ will be consistent across all of these server\ninstances, and the `Class.DataModel.JobId`\
    \ will be unique for each one.\n\nSee also:\n\n- `Class.DataModel.PrivateServerOwnerId`,\
    \ a property describing the owner\n  of a private server\n- `Class.TeleportService:TeleportAsync()`,\
    \ a function which can create a\n  reserved server when used with `Class.TeleportOptions.ReservedServerId`\n"
  code_samples:
  - detecting-private-servers
  type: string
  tags:
  - ReadOnly
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: false
    can_save: true
  capabilities: []
- name: DataModel.PrivateServerOwnerId
  summary: 'Describes the `Class.Player.UserId|UserId` of the `Class.Player` that
    owns

    the private server if the server is VIP.

    '
  description: "This property describes the `Class.Player.UserId|UserId` of the\n\
    `Class.Player` that owns the\n[VIP server](../../../production/monetization/private-servers.md)\
    \ if the\nserver is a VIP server.\n\nIf the server is a standard or reserved server\
    \ then this property will be\nset to `0`.\n\nThis property could be used to identify\
    \ if a `Class.Player` is the owner\nof the private server, for example:\n\n```lua\n\
    local Players = game:GetService(\"Players\")\n\n-- is this a private server?\n\
    if game.PrivateServerId ~= \"\" and game.PrivateServerOwnerId ~= 0 then\n\n  \
    \  -- listen for new players being added\n    Players.PlayerAdded:Connect(function(player)\n\
    \n        -- check if the player is the server owner\n        if player.UserId\
    \ == game.PrivateServerOwnerId then\n            print(\"The private server owner\
    \ has joined the game\")\n        end\n    end)\nend\n```\n\nSee also:\n\n- `Class.DataModel.PrivateServerId`,\
    \ a property describing the unique ID\n  of VIP and reserved servers\n"
  code_samples:
  - detecting-private-servers
  type: int64
  tags:
  - ReadOnly
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Data
  serialization:
    can_load: false
    can_save: true
  capabilities: []
