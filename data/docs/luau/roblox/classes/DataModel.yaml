methods:
- name: DataModel:BindToClose
  summary: 'Binds a function to be called before the server shuts down.

    '
  description: "Binds a function to be called before the server shuts down. If the\
    \ bound\nfunction accepts a parameter, it passes `Enum.CloseReason` specifying\
    \ the\nreason for the server shutdown.\n\nYou can bind multiple functions by calling\n\
    `Class.DataModel:BindToClose()|BindToClose()` repeatedly. Bound functions\nare\
    \ called in parallel and run at the same time.\n\nThe experience server waits\
    \ 30 seconds for all bound functions to stop\nrunning before it shuts down. After\
    \ 30 seconds, the server shuts down even\nif functions are still running. Teleports\
    \ are disabled during moderation\nshutdowns.\n\nTo verify that the current session\
    \ is not in Roblox Studio, use\n`Class.RunService:IsStudio()`. This prevents bound\
    \ functions from\ncompleting their run in offline testing sessions.\n\nWhen you\
    \ use `Class.DataStoreService`, you should also use `BindToClose`\nto bind a function\
    \ saving all unsaved data to\n`Class.GlobalDataStore|DataStores`. This prevents\
    \ data loss if the server\nshuts down unexpectedly.\n\nSee also:\n\n- `Enum.CloseReason`\
    \ for reasons for the experience server shutdown.\n- `Class.PluginGui:BindToClose()`,\
    \ which binds a function to a\n  `Class.PluginGui` close button.\n"
  code_samples:
  - saving-player-data-before-shutting-down
  - DataModel-BindToClose1
  parameters:
  - name: function
    type: Function
    default: null
    summary: 'A function called before the experience server shuts down. If the

      bound function accepts a parameter, it passes `Enum.CloseReason`

      specifying the reason for the server shutdown.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: DataModel:GetJobsInfo
  summary: 'Returns a table containing basic information about the jobs performed
    by

    the task scheduler.

    '
  description: "Returns a table containing basic information about the jobs performed\
    \ by\nthe task scheduler.\n\nIn computing, a task scheduler is a system responsible\
    \ for executing key\ntasks at the appropriate intervals.\n\nYou can also find\
    \ live task scheduler statistics in the Task Scheduler\nwindow in Roblox Studio.\n\
    \nThe first entry in the table returned is a reference dictionary containing\n\
    the statistics (or headings) available. It is in the following format:\n\n```lua\n\
    {\n    [\"name\"] = \"name\",\n    [\"averageDutyCycle\"] = \"averageDutyCycle\"\
    ,\n    [\"averageStepsPerSecond\"] = \"averageStepsPerSecond\",\n    [\"averageStepTime\"\
    ] = \"averageStepTime\",\n    [\"averageError\"] = \"averageError\",\n    [\"\
    isRunning\"] = \"isRunning\",\n}\n```\n\nThe subsequent entries in the table returned\
    \ are dictionaries containing\nthe above statistics for jobs performed by the\
    \ task scheduler. For\nexample:\n\n```lua\n{\n    [\"name\"] = \"Heartbeat\",\n\
    \    [\"averageDutyCycle\"] = 0,\n    [\"averageStepsPerSecond\"] = 0,\n    [\"\
    averageStepTime\"] = 0,\n    [\"averageError\"] = 0,\n    [\"isRunning\"] = false,\n\
    }\n```\n\nSee also:\n\n- `Class.TaskScheduler`\n"
  code_samples:
  - DataModel-GetJobsInfo1
  parameters: []
  returns:
  - type: Array
    summary: 'A table containing information about the jobs performed by the task

      scheduler, see above for the format.

      '
  tags: []
  deprecation_message: ''
  security: PluginSecurity
  thread_safety: Unsafe
  capabilities: []
