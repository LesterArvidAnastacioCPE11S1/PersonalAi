- name: DataModel.GraphicsQualityChangeRequest
  summary: 'Fires when the user prompts and increase or decrease in graphics quality

    using the hotkeys.

    '
  description: "Fires when the user prompts an increase or decrease in graphics quality\n\
    using the hotkeys.\n\nThis event fires under the following conditions:\n\n- If\
    \ the user presses <kbd>F10</kbd>, this event fires with a\n  `betterQuality`\
    \ argument of `true`.\n- If the user presses <kbd>Shift</kbd><kbd>F10</kbd>, this\
    \ event fires\n  with a `betterQuality` argument of `false`.\n\nThis event does\
    \ not provide the current graphics quality level or cover\nall updates to the\
    \ graphics quality. For example, changes made in the core\nGUI escape menu are\
    \ not registered.\n\nYou can retrieve a user's `Enum.SavedQualitySetting` using\n\
    `Class.UserGameSettings` with the following snippet:\n\n```lua\nUserSettings():GetService(\"\
    UserGameSettings\").SavedQualityLevel\n```\n\nIf the user's graphics settings\
    \ are set to automatic then the\n`Enum.SavedQualitySetting` will be\n`Enum.SavedQualitySetting.Automatic|Automatic`.\
    \ There is currently no way\nfor developers to reliably get the current graphics\
    \ quality level of a\nuser's machine.\n"
  code_samples:
  - DataModel-GraphicsQualityChangeRequest1
  parameters:
  - name: betterQuality
    type: boolean
    default: null
    summary: 'Whether the user has prompted an increase (_true_) or a decrease

      (_false_) in graphics quality.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities: []
- name: DataModel.ItemChanged
  summary: 'Fires when a property of any object in the `Class.DataModel` is changed.

    '
  description: 'This event fires when a property of any object in the `Class.DataModel`
    is

    changed.

    '
  code_samples:
  - DataModel-ItemChanged1
  parameters:
  - name: object
    type: Instance
    default: null
    summary: ''
  - name: descriptor
    type: string
    default: null
    summary: ''
  tags:
  - Deprecated
  deprecation_message: 'This function has been superseded by `Class.Object.Changed`,
    which should

    be used in new work instead.

    '
  security: None
  capabilities: []
- name: DataModel.Loaded
  summary: 'Fires on the client when the game finishes loading for the first time.

    '
  description: "This event fires on the client when all initial `Class.Instance|Instances`\n\
    in the game have finished replicating to the client.\n\nUnless they are parented\
    \ to `Class.ReplicatedFirst`,\n`Class.LocalScript|LocalScripts` do not run until\
    \ the game has loaded. The\nfollowing snippet, run from a `Class.LocalScript`\
    \ in\n`Class.ReplicatedFirst` yields until the game has loaded:\n\n```lua\nif\
    \ not game:IsLoaded() then\n    game.Loaded:Wait()\nend\n```\n\nSee also:\n\n\
    - [Replication order](../../../scripting/attributes.md#replication-order)\n  for\
    \ a more detailed summary of the loading process.\n- `Class.DataModel.Loaded`,\
    \ an event that fires when the game has loaded\n- `Class.Instance:WaitForChild()`,\
    \ a function which can be used to wait\n  for an individual `Class.Instance` to\
    \ replicate without having to wait\n  for the whole game to finish loading.\n"
  code_samples: []
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities: []
- name: DataModel.ServerLowMemoryWarning
  summary: 'Fires on the server when Roblox detects that the server is under memory

    pressure.

    '
  description: 'Fires on the server when Roblox detects that the server is under memory

    pressure. Use this event as a best-effort opportunity to reduce

    nonessential memory use.


    This event can fire more than once while the server remains under memory

    pressure. Make handlers idempotent and avoid memory-intensive work. The

    event does not guarantee that the server will shut down or that it can

    avoid shutting down.

    '
  code_samples:
  - DataModel-ServerLowMemoryWarning1
  parameters: []
  tags: []
  deprecation_message: ''
  security: None
  capabilities: []
- name: DataModel.ServerRestartScheduled
  summary: 'Fires on the server when the server has been scheduled to restart.

    Provides the scheduled restart time, source, and custom attributes.

    '
  description: 'Fires when the server has been scheduled to restart, for example when
    you

    restart servers from the Creator Hub or

    [Open Cloud](https://create.roblox.com/docs/cloud/reference/features/universes#Restarts_LaunchRestart)

    to [release an experience update](../../../projects/update-games.md), or

    when Roblox needs to restart servers for infrastructure maintenance.


    You can use this event to inform players on the server of the impending

    restart. You could then let them save their progress or teleport them to

    updated servers at the most convenient time for your game.

    '
  code_samples:
  - DataModel-ServerRestartScheduled1
  parameters:
  - name: restartTime
    type: DateTime
    default: null
    summary: 'A `Datatype.DateTime` indicating when the server is scheduled to shut

      down. The actual restart may happen slightly after this projected

      time, but not before.

      '
  - name: source
    type: CloseReason
    default: null
    summary: 'An `Enum.CloseReason` describing what triggered the restart. The value

      will be `Enum.CloseReason.DeveloperUpdate` for experience updates, and

      `Enum.CloseReason.RobloxMaintenance` for server maintenance updates.

      '
  - name: attributes
    type: Dictionary
    default: null
    summary: 'A dictionary of developer-supplied metadata associated with the

      restart. If no attributes are provided, then this will be an empty

      table.

      '
  tags: []
  deprecation_message: ''
  security: None
  capabilities:
  - ServerCommunication
