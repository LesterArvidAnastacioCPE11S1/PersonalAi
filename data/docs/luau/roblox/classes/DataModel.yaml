  deprecation_message: 'This property is deprecated and is no longer functional. It
    should not be

    used.

    '
  security: None
  thread_safety: Unsafe
  capabilities: []
- name: DataModel:IsLoaded
  summary: 'Returns true if the client has finished loading the game for the first

    time.

    '
  description: "When all initial `Class.Instance|Instances` in the game have finished\n\
    replicating to the client, this function returns true.\n\nUnless they are parented\
    \ to `Class.ReplicatedFirst`,\n`Class.LocalScript|LocalScripts` do not run until\
    \ the game has loaded. The\nfollowing snippet, run from a `Class.LocalScript`\
    \ in\n`Class.ReplicatedFirst` yields until the game has loaded:\n\n```lua\nif\
    \ not game:IsLoaded() then\n    game.Loaded:Wait()\nend\n```\n\nSee also:\n\n\
    - [Replication order](../../../scripting/attributes.md#replication-order)\n  for\
    \ a more detailed summary of the loading process.\n- `Class.DataModel.Loaded`,\
    \ an event that fires when the game has loaded\n- `Class.Instance:WaitForChild()`,\
    \ a function which can be used to wait\n  for an individual `Class.Instance` to\
    \ replicate without having to wait\n  for the whole game to finish loading.\n"
  code_samples:
  - Custom-Loading-Screen
  parameters: []
  returns:
  - type: boolean
    summary: 'Whether the client has finished loading the game for the first time.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
