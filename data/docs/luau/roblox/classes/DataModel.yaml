    '
  description: 'This property describes the ID of the user or group that owns the
    place.

    If the `Class.DataModel.CreatorType` property is `User` then `CreatorId`

    will be the `Class.Player.UserId` of the place''s owner. If the

    `Class.DataModel.CreatorType` is `Group` then `CreatorId` will be the ID

    of the group that owns the place.

