- name: MemoryStoreHashMap:UpdateAsync
  summary: 'Retrieves the value of a key from a hash map and lets you update it to
    a

    new value.

    '
  description: "Retrieves the value of a key from a hash map and lets you update it\
    \ to a\nnew value.\n\nThis method accepts a callback function that retrieves the\
    \ existing key\nvalue and passes it to a transform function, which returns the\
    \ new value\nfor the item, with these exceptions:\n\n- If the key does not exist,\
    \ the old value passed to the function is\n  `nil`.\n- If the function returns\
    \ `nil`, the update is canceled.\n\nThe new value is saved only if the key was\
    \ not updated (for example, by a\ndifferent game server) since the moment it was\
    \ read. If the value changed\nin that time, the transform function is called again\
    \ with the most recent\nitem value. This cycle repeats until the value is saved\
    \ successfully or\nthe transform function returns `nil` to abort the operation.\n"
  code_samples:
  - updating-hash-map-memory-store
  parameters:
  - name: key
    type: string
    default: null
    summary: 'The key whose value you want to update.

      '
  - name: transformFunction
    type: Function
    default: null
    summary: 'The transform function, which you provide. This function takes the old

      value as an input and returns the new value.

      '
  - name: expiration
    type: int64
    default: null
    summary: 'Item expiration in seconds, after which the item is automatically

      removed from the hash map. The maximum expiration time is 45 days

      (3,888,000 seconds).

      '
  returns:
  - type: Variant
    summary: 'The last value returned by the transform function.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - DataStore
