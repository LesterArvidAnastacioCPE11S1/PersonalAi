- name: ProceduralModel.Generator
  summary: 'A reference to a `Class.ModuleScript` that contains code which defines
    how

    the `ProceduralModel` generates its contents in response to parameter

    changes.

    '
  description: "A reference to a `Class.ModuleScript` containing code that defines\
    \ how the\n`ProceduralModel` generates its contents in response to parameter changes.\n\
    \nSetting `Generator` triggers generation using the new generator module.\nThe\
    \ `Attributes` table exported by the module is automatically applied as\ndefault\
    \ attribute values on the `ProceduralModel`.\n\nClearing `Generator` preserves\
    \ the current contents of the\n`ProceduralModel`, and prevents further generation\
    \ until a new generator\nis assigned.\n\nGuidelines for writing the generator\
    \ module's `OnGenerate` function:\n\n- Only write results into the provided `targetContainer`.\
    \ `OnGenerate`\n  should not modify the `Class.DataModel` directly; writes elsewhere\
    \ may\n  not interact correctly with engine systems.\n- `OnGenerate` is allowed\
    \ to yield and call yielding methods (for example,\n  `Class.GeometryService`\
    \ CSG APIs). Generation is considered complete\n  whenever `OnGenerate` returns.\n\
    - Calling `parameters:Pause()` inside long-running loops lets the engine\n  break\
    \ up work. It only yields when needed to avoid dropping frames, so\n  calls are\
    \ low-cost when the frame budget is not exceeded.\n"
  code_samples:
  - ProceduralModel-Generator-Default
  - ProceduralModel-Generator-Ladder
