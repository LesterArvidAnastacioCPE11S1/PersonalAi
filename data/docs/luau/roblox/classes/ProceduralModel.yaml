name: ProceduralModel
type: class
memory_category: BaseParts
summary: 'Procedural models support edit-time procedural generation. Instead of manually

  constructing model content, a procedural model generates its contents

  automatically in response to parameter changes.

  '
description: "`ProceduralModel` inherits from `Class.Model` and supports edit-time\n\
  procedural generation of its contents. Instead of manually constructing model\n\
  content, a procedural model generates its contents automatically in response\nto\
  \ parameter changes.\n\nGeneration is defined by a **generator module**, a `Class.ModuleScript`\n\
  referenced by the `Class.ProceduralModel.Generator|Generator` property. The\nengine\
  \ invokes the module's `OnGenerate` function to produce the model's\ncontents.\n\
  \nA procedural model regenerates when any of the following inputs change:\n\n- The\
  \ `Class.ProceduralModel.Size|Size` property of the procedural model,\n  which defines\
  \ a bounding box for the model to generate within.\n- Any attributes on the procedural\
  \ mode, as defined by the generator module.\n- The generator's module sandboxing\
  \ configuration (`Sandboxed` and\n  `Capabilities`).\n- The source code of the generator\
  \ module.\n\nWhen any of these inputs change, the engine schedules regeneration.\
  \ This\nscheduled regeneration is performed by calling `OnGenerate` and applying\
  \ its\nresults once it returns. In most cases, generation happens within the same\n\
  frame, but can be deferred to maintain performance.\n"
code_samples: []
inherits:
- Model
descendants: []
tags: []
deprecation_message: ''
