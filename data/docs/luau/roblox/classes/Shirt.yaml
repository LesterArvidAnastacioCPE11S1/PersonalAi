- name: Shirt.ShirtTemplateContent
  summary: 'Specifies the asset URI of the shirt texture.

    '
  description: 'Specifies the shirt texture using an

    [asset URI](../../../projects/assets/index.md#asset-uris). Although this

    property uses Datatype.Content, it does not support `Class.EditableImage`

    objects.


    Setting `ShirtTemplateContent` updates `Class.Shirt.ShirtTemplate`;

    likewise, setting `ShirtTemplate` updates this property. Both share the

    same clothing texture data.

    '
