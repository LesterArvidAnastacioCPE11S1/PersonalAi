name: Shirt
type: class
memory_category: Instances
summary: 'Displays a shirt texture on a `Class.Humanoid` rig.

  '
description: 'The `Shirt` object displays a shirt texture from Roblox on a `Class.Humanoid`

  rig. Shirts cover the torso and arms, and will take priority over a

  `Class.Pants` on the torso. To be visible, a `Shirt` must be a sibling of a

  `Class.Humanoid` and have its `Class.Shirt.ShirtTemplate|ShirtTemplate`

  property set to an appropriate texture such as `rbxassetid://86896487`. The

  shirt texture may be colorized using the `Class.Clothing.Color3` property.


  Shirts are automatically loaded on `Class.Player` characters if their avatar

  is wearing one.

  '
code_samples:
- Shirt-Pants
inherits:
- Clothing
descendants: []
tags: []
deprecation_message: ''
properties:
- name: Shirt.ShirtTemplate
  summary: 'Determines the texture of the `Class.Shirt`.

    '
  description: "The content ID link pointing to the shirt template hosted on Roblox.\n\
    \nThis content ID is different than the website URL of the shirt. It can be\n\
    found by pasting the website URL of the shirt into the **ShirtTemplate**\nproperty\
    \ in Studio. Alternatively, `Class.InsertService:LoadAsset()` can\nbe used to\
    \ insert the shirt into the workspace, for example:\n\n```\nlocal InsertService\
    \ = game:GetService(\"InsertService\")\nlocal Workspace = game:GetService(\"Workspace\"\
    )\n\nlocal webURL = \"https://www.roblox.com/catalog/1804747/White-Shirt\"\nlocal\
    \ assetId = tonumber(string.match(webURL, \"%d+\") or 0)  -- Extract the number\n\
    local success, model = pcall(function()\n\treturn InsertService:LoadAsset(assetId)\n\
    end)\nif success then\n\tmodel.Parent = Workspace\nend\n```\n\nSee also `Class.ShirtGraphic.Graphic`\
    \ for the image applied to T-shirts.\n"
  code_samples:
  - Shirt-Pants
