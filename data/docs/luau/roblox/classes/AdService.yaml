- name: AdService:UnregisterAdOpportunity
  summary: 'Stops tracking an instance that was previously registered with

    `Class.AdService:RegisterAdOpportunityAsync()|RegisterAdOpportunityAsync`.

    '
  description: 'Removes `instance` from the ad opportunity tracker so that it no longer

    counts toward the rewarded video ad opportunity reporting started by

    `Class.AdService:RegisterAdOpportunityAsync()|RegisterAdOpportunityAsync()`.

    Call it once an instance should no longer be treated as an ad opportunity,

    such as when its associated UI is closed or removed.


    If the supplied `instance` is not currently being tracked, this method has

    no effect.

    '
  code_samples: []
  parameters:
  - name: instance
    type: Instance
    default: null
    summary: 'The instance to stop tracking. This should be an instance that you

      previously passed to

      `Class.AdService:RegisterAdOpportunityAsync()|RegisterAdOpportunityAsync()`.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
