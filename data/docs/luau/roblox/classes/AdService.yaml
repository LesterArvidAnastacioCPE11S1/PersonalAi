- name: AdService:CreateAdRewardFromDevProductId
  summary: 'Creates an `Datatype.AdReward` to give users who watch a video ad.

    '
  description: 'Constructs an `Datatype.AdReward` that wraps the given developer product

    so it can be passed to

    `Class.AdService:ShowRewardedVideoAdAsync()|ShowRewardedVideoAdAsync`.

    When the user watches the entire rewarded video ad, the developer product

    identified by `devProductId` is granted through the

    `Class.MarketplaceService.ProcessReceipt|ProcessReceipt` callback with a

    `ProductPurchaseChannel` of `Enum.ProductPurchaseChannel.AdReward`.

    '
  code_samples: []
  parameters:
  - name: devProductId
    type: int64
    default: null
    summary: 'The ID of the developer product you want to grant as a reward.

      '
  returns:
  - type: AdReward
    summary: 'An `Datatype.AdReward` configured as a developer product reward for

      the specified product.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
- name: AdService:GetAdAvailabilityNowAsync
  summary: 'Checks if an ad with the specified format is available to be shown to
    the

    `Class.Players.LocalPlayer|LocalPlayer`.

    '
  description: 'This method may only be called from a `Class.Script` with

    `Enum.RunContext.Client`.


    Note that you should call this method as close as possible to the moment

    you plan to show the ad. For example, if you have a "Watch video ad to get

    a reward" button in a shop menu, only call this method when the user opens

    the shop menu. This approach improves performance by preventing ads from

    unnecessarily being held in memory, and it benefits CPM (cost-per-thousand

    impressions) and earnings by optimizing the ad fill rate.

    '
  code_samples: []
  parameters:
  - name: adFormat
    type: AdFormat
    default: null
    summary: 'The format of the requested ad. For example,

      `Enum.AdFormat.RewardedVideo`.

      '
  returns:
  - type: GetAdAvailabilityNowResult
    summary: 'A dictionary that looks like

      `{ AdAvailabilityResult: Enum.AdAvailabilityResult }`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
- name: AdService:GetCampaignEligibilityAsync
  summary: 'Checks a `Class.Player`''s eligibility to be shown an

    [ad integration](../../../production/promotion/ad-integrations.md)

    campaign.

    '
  description: '`Class.AdService:GetCampaignEligibilityAsync()|GetCampaignEligibilityAsync`

    checks whether a `Class.Player` is eligible to be shown a specific

    [ad integration](../../../production/promotion/ad-integrations.md)

    campaign, returning a dictionary that looks like

    `{ IsEligible: boolean }`.


    Call this method and confirm that `result.IsEligible` is `true` before you

    display any of the campaign''s ad integration assets or register their

    disclosure buttons with

    `Class.AdService:RegisterDisclosureButton()|RegisterDisclosureButton`. All

    ad integration assets should remain hidden until the `Class.Player` is

    confirmed eligible.


    When called from the client, the `player` argument defaults to the

    `Class.Players.LocalPlayer|LocalPlayer`. When called from the server,

    `player` is required. The call raises an error if the supplied

    `campaignId` exceeds the maximum allowed length.

    '
  code_samples:
  - AdService-AdIntegrations
  parameters:
  - name: campaignId
    type: string
    default: null
    summary: 'The ID of the campaign that you want to check a `Class.Player`''s

      eligibility for.

      '
  - name: player
    type: Player?
    default: nil
    summary: 'The `Class.Player` you want to check eligibility for. If omitted, it

      will default to the `Class.Players.LocalPlayer|LocalPlayer`. On the

      server, `player` argument is required.

      '
  returns:
  - type: GetCampaignEligibilityResult
    summary: 'A dictionary that looks like `{ IsEligible: boolean }`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
- name: AdService:RegisterAdOpportunityAsync
  summary: 'Tracks how many times a user had the chance to watch a video ad and the

    rate at which they actually watched the ad.

    '
  description: 'This method may only be called from a `Class.Script` with

    `Enum.RunContext.Client`.


    Registers a `Class.GuiButton` for ad opportunity tracking. Once

    registered, the system periodically checks whether the button is visible

    and unobstructed (the topmost input-sinking element at its center point).

    These visibility transitions are reported as ad opportunity impressions

    and used to measure the rate at which users are presented with, and choose

    to watch, rewarded video ads.


    The `instance` must be a `Class.GuiButton` that is a descendant of a

    `Class.ScreenGui` under `Class.PlayerGui`. If the instance is moved out of

    a valid hierarchy at runtime, tracking pauses automatically and resumes

    when it returns to a valid ancestor. Call

    `Class.AdService:UnregisterAdOpportunity()|UnregisterAdOpportunity` to

    stop tracking the instance.

    '
  code_samples:
  - AdService-RegisterAdOpportunityAsync
  parameters:
  - name: instance
    type: Instance
    default: null
    summary: 'The `Class.GuiButton` to track as a rewarded video ad opportunity.

      Must be a descendant of a `Class.ScreenGui`.

      '
  - name: placementId
    type: int64?
    default: null
    summary: 'The ID of the placement of the rewarded video ad inside the

      experience. Allows for reporting on the performance of individual ad

      placements.

      '
  returns:
  - type: ()
    summary: ''
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
- name: AdService:RegisterDisclosureButton
  summary: 'Registers an ad disclosure button for an

    [ad integration](../../../production/promotion/ad-integrations.md).

    '
  description: 'This method may only be called from a `Class.Script` with

    `Enum.RunContext.Client`.


    `Class.AdService:RegisterDisclosureButton()|RegisterDisclosureButton`

    marks a button in your experience as an ad disclosure for an ad

    integration. When a user clicks it, they can see who is paying for the ad.

    See

    [ad integrations](../../../production/promotion/ad-integrations.md#labeling-and-disclosure)

    for guidance on what the disclosures should look like and when they should

    be visible.


    Note: you must verify that the `Class.Players.LocalPlayer|LocalPlayer` is

    eligible to see the associated ad integration campaign by calling

    `Class.AdService:GetCampaignEligibilityAsync()|GetCampaignEligibilityAsync`

    and verifying that `result.IsEligible` is `true` before attempting to

    register a disclosure button for it. If you do not wait, or the

    `Class.Players.LocalPlayer|LocalPlayer` is not eligible to see the

    associated campaign, then

    `Class.AdService:RegisterDisclosureButton()|RegisterDisclosureButton` will

    raise an error.

    '
  code_samples: []
  parameters:
  - name: disclosureButton
    type: GuiButton
    default: null
    summary: 'The `Class.GuiButton` you want to mark as an ad integration

      disclosure. The `Class.GuiButton` must follow labeling guidelines

      outlined

      [here](../../../production/promotion/ad-integrations.md#labeling-and-disclosure).

      '
  - name: adIntegrationPlacementId
    type: string
    default: null
    summary: 'The ID of the placement that this disclosure is attached to.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Monetization
- name: AdService:ShowRewardedVideoAdAsync
  summary: 'Plays the video ad to the current user inside the experience.

    '
  description: '**Warning**: Rewarded Video ads must be user opt-in and clearly disclosed.

    For details, review our

    [eligibility requirements](../../../production/promotion/rewarded-video-ads.md#eligibility-requirements)

    and

    [advertising standards](https://en.help.roblox.com/hc/en-us/articles/13722260778260-Advertising-Standards).


    This method may only be called from a `Class.Script` with

    `Enum.RunContext.Server`.


    Note: before calling this method, you must first verify that the specified

    user has a rewarded video ad available to show by calling

    `Class.AdService:GetAdAvailabilityNowAsync()|GetAdAvailabilityNowAsync`.

    If the client does not have an available ad, then

    `Class.AdService:ShowRewardedVideoAdAsync()|ShowRewardedVideoAdAsync` will

    return `Enum.ShowAdResult.AdNotReady`.

    '
  code_samples:
  - AdService-RewardedVideo
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Class.Player` to trigger a rewarded video ad play for.

      '
  - name: reward
    type: AdReward
    default: null
    summary: 'The `Datatype.AdReward` to grant the user after they view the ad.

      '
  - name: placementId
    type: int64?
    default: null
    summary: 'The ID of the placement of the rewarded video ad inside the

      experience. Allows for reporting on the performance of individual ad

      placements.

      '
  returns:
  - type: ShowAdResult
    summary: 'The `Enum.ShowAdResult` of the client''s ad presentation. You should

      not use this result to grant the reward. Instead, you should grant the

      reward from your

      `Class.MarketplaceService.ProcessReceipt|ProcessReceipt`

      implementation. For

      [developer products](../../../production/monetization/developer-products.md)

      earned through rewarded video ads, the

      `receipt.ProductPurchaseChannel` will be

      `Enum.ProductPurchaseChannel.AdReward`.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - UI
  - Monetization
