- name: BasePart.LocalTransparencyModifier
  summary: 'Determines a multiplier for `Class.BasePart.Transparency` that is only

    visible to the local client.

    '
  description: "The `LocalTransparencyModifier` property is a multiplier to\n`Class.BasePart.Transparency|Transparency`\
    \ that is only visible to the\nlocal client. It does not replicate from client\
    \ to server and is useful\nfor when a part should not render for a specific client,\
    \ such as how the\nplayer does not see their character's body parts when they\
    \ zoom into first\nperson mode.\n\nThis property modifies the local part's transparency\
    \ through the following\nformula, with resulting values clamped between `0` and\
    \ `1`.\n\n`1` - ((`1` - `Class.BasePart.Transparency|Transparency`) &times; (`1`\
    \ -\n`LocalTransparencyModifier`))\n\n<table size=\"small\">\n<thead>\n<tr>\n\
    \  <th><code>Class.BasePart.Transparency|Transparency</code></th>\n  <th><code>LocalTransparencyModifier</code></th>\n\
    \  <th>Server-Side</th>\n  <th>Client-Side</th>\n</tr>\n</thead>\n<tbody>\n  <tr>\n\
    \    <td><code>0.5</code></td>\n    <td><code>0</code></td>\n    <td><code>0.5</code></td>\n\
    \    <td><code>0.5</code></td>\n  </tr>\n  <tr>\n    <td><code>0.5</code></td>\n\
    \    <td><code>0.25</code></td>\n    <td><code>0.5</code></td>\n    <td><code>0.625</code></td>\n\
    \  </tr>\n  <tr>\n    <td><code>0.5</code></td>\n    <td><code>0.5</code></td>\n\
    \    <td><code>0.5</code></td>\n    <td><code>0.75</code></td>\n  </tr>\n  <tr>\n\
    \    <td><code>0.5</code></td>\n    <td><code>0.75</code></td>\n    <td><code>0.5</code></td>\n\
    \    <td><code>0.875</code></td>\n  </tr>\n  <tr>\n    <td><code>0.5</code></td>\n\
    \    <td><code>1</code></td>\n    <td><code>0.5</code></td>\n    <td><code>1</code></td>\n\
    \  </tr>\n</tbody>\n</table>\n"
  code_samples: []
