- name: BasePart:TorqueToAngularAcceleration
  summary: 'Returns the angular acceleration that would result from applying a given

    torque to this part''s assembly, optionally accounting for gyroscopic

    effects.

    '
  description: 'Returns the world-space angular acceleration that would result from

    applying the specified torque to the part''s assembly, optionally taking

    into account gyroscopic effects.


    This is the inverse of `Class.BasePart:AngularAccelerationToTorque()`. It

    is useful for predicting how an assembly will respond to an applied

    torque.


    The calculation uses:


    **α = I⁻¹ · (τ − ω × (I · ω))**


    where **I** is the assembly''s world-space inertia tensor, **τ** is the

    applied torque, and **ω** is the angular velocity.


    If the part is not a descendant of `Class.Workspace`, returns `(0, 0, 0)`.

    If the assembly is anchored, returns `(0, 0, 0)`.


    #### Gyroscopic Effects


    When a spinning assembly has an asymmetric inertia tensor, the

    acceleration resulting from an applied torque also depends on the current

    angular velocity. The `angVelocity` parameter accounts for these

    gyroscopic effects. If omitted (defaults to zero), the result neglects

    this contribution from the result.

    '
  code_samples:
  - BasePart-TorqueToAngularAcceleration
  parameters:
  - name: torque
    type: Vector3
    default: null
    summary: 'The torque vector applied to the assembly in world space.

      '
  - name: angVelocity
    type: Vector3
    default: 0, 0, 0
    summary: 'The current angular velocity of the assembly in world space. Defaults

      to `(0, 0, 0)`. Supply the assembly''s angular velocity to account for

      gyroscopic effects.

      '
  returns:
  - type: Vector3
    summary: 'A `Datatype.Vector3` representing the resulting angular acceleration

      in world space.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
