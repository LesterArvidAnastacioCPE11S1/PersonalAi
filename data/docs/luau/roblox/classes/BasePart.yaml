name: BasePart
type: class
memory_category: Instances
summary: 'The abstract base class for in-world objects that physically interact.

  '
description: "`Class.BasePart` is an abstract base class for in-world objects that\
  \ render\nand are physically simulated while in the `Class.Workspace`. There are\
  \ several\nimplementations of `Class.BasePart`, the most common being `Class.Part`\
  \ and\n`Class.MeshPart`. Others include `Class.WedgePart`, `Class.SpawnLocation`,\
  \ and\nthe singleton `Class.Terrain` object. Generally, when documentation refers\
  \ to\na \"part,\" most `Class.BasePart` implementations will work and not just\n\
  `Class.Part`.\n\nFor information on how `Class.BasePart|BaseParts` are grouped into\
  \ simulated\nrigid bodies, see [Assemblies](../../../physics/assemblies.md).\n\n\
  There are many different objects that interact with `Class.BasePart` (other\nthan\
  \ `Class.Terrain`), including:\n\n- Several `Class.BasePart|BaseParts` may be grouped\
  \ within a `Class.Model` and\n  moved at the same time using `Class.PVInstance:PivotTo()`.\
  \ See\n  [Models](../../../parts/models.md).\n- A `Class.Decal` applies a stretched\
  \ image texture to the faces of a\n  `Class.BasePart`, while a `Class.Texture` applies\
  \ a tiled image texture to\n  the faces. See [Textures and Decals](../../../parts/textures-decals.md).\n\
  - A `Class.SurfaceGui` renders `Class.GuiObject|GuiObjects` on the face of a\n \
  \ part. See\n  [In-Experience UI Containers](../../../ui/in-experience-containers.md).\n\
  - `Class.Attachment|Attachments` can be added to a `Class.BasePart` to specify\n\
  \  `Datatype.CFrame|CFrames` relative to the part. These are often used by\n  physical\
  \ `Class.Constraint` objects as outlined in\n  [Mechanical Constraints](../../../physics/mechanical-constraints.md)\
  \ and\n  [Mover Constraints](../../../physics/mover-constraints.md).\n- `Class.ParticleEmitter`\
  \ objects emit particles uniformly in the volume of\n  the `Class.BasePart` to which\
  \ they are parented. See\n  [Particle Emitters](../../../effects/particle-emitters.md).\n\
  - Light objects like `Class.PointLight` emit light from the center of a\n  `Class.BasePart`\
  \ as illustrated in\n  [Light Sources](../../../effects/light-sources.md).\n- If\
  \ parented to a `Class.Tool` and given the name **Handle**, a\n  `Class.BasePart`\
  \ can be held by characters. See\n  [In-Experience Tools](../../../players/tools.md).\n"
code_samples:
- SmoothDamp-CFrame
