methods:
- name: BasePart:AngularAccelerationToTorque
  summary: 'Returns the torque needed to achieve a given angular acceleration on this

    part''s assembly, optionally accounting for gyroscopic effects.

    '
  description: 'Returns the world-space torque vector that must be applied to the
    part''s

    assembly to achieve the specified angular acceleration. This result can be

    used to determine the torque that should be applied via a `Class.Torque`

    instance or `Class.BasePart:ApplyAngularImpulse()`.


    The calculation uses Euler''s rotation equation where _I_ is the assembly''s

    world-space inertia tensor, _α_ is the desired angular acceleration, and

    _ω_ is the angular velocity.


    _τ = I · α + ω × (I · ω)_


    If the part is not a descendant of `Class.Workspace`, this method returns

    a vector of infinity. If the assembly is anchored, it similarly returns a

    vector of infinity.


    #### Gyroscopic Effects


    When a spinning assembly has an asymmetric inertia tensor, the torque

    required to achieve a specified angular acceerlation is augmented due to

    the changing orientation of the body. The optional `angVelocity` parameter

    accounts for these gyroscopic effects. If omitted, these gyroscopic

    effects are omitted from the calculation.

    '
  code_samples:
  - BasePart-AngularAccelerationToTorque
  parameters:
  - name: angAcceleration
    type: Vector3
    default: null
    summary: 'The desired angular acceleration vector in world space.

      '
  - name: angVelocity
    type: Vector3
    default: 0, 0, 0
    summary: 'The current angular velocity of the assembly in world space. Defaults

      to `(0, 0, 0)`. Supply the assembly''s angular velocity to account for

      gyroscopic effects.

      '
  returns:
  - type: Vector3
    summary: 'A `Datatype.Vector3` representing the world-space torque required to

      produce the specified angular acceleration.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
- name: BasePart:ApplyAngularImpulse
  summary: 'Apply an angular impulse to the assembly.

    '
  description: 'Applies an instant angular force impulse to this part''s assembly,
    causing

    the assembly to spin.


    The resulting angular velocity from the impulse relies on the assembly''s

    `Class.BasePart.AssemblyMass|mass`. So a higher impulse is required to

    move more massive assemblies. Impulses are useful for cases where you want

    a force applied instantly, such as an explosion or collision.


    If the part is [owned](../../../physics/network-ownership.md) by the

    server, this function must be called from a server `Class.Script` (not

    from a `Class.LocalScript` or a `Class.Script` with

    `Class.BaseScript.RunContext|RunContext` set to `Enum.RunContext.Client`).

    If the part is owned by a client through **automatic** ownership, this

    function can be called from either a client script **or** a server script;

    calling it from a client script for a server-owned part will have no

    effect.

    '
  code_samples: []
  parameters:
  - name: impulse
    type: Vector3
    default: null
    summary: 'An angular impulse vector to be applied to the assembly.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
- name: BasePart:ApplyImpulse
  summary: 'Apply an impulse to the assembly at the assembly''s

    `Class.BasePart.AssemblyCenterOfMass|center of mass`.

    '
  description: 'This function applies an instant force impulse to this part''s assembly.


    The force is applied at the assembly''s

    `Class.BasePart.AssemblyCenterOfMass|center of mass`, so the resulting

    movement will only be linear.


    The resulting velocity from the impulse relies on the assembly''s

    `Class.BasePart.AssemblyMass|mass`. So a higher impulse is required to

    move more massive assemblies. Impulses are useful for cases where you want

    a force applied instantly, such as an explosion or collision.


    If the part is [owned](../../../physics/network-ownership.md) by the

    server, this function must be called from a server `Class.Script` (not

    from a `Class.LocalScript` or a `Class.Script` with

    `Class.BaseScript.RunContext|RunContext` set to `Enum.RunContext.Client`).

    If the part is owned by a client through **automatic** ownership, this

    function can be called from either a client script **or** a server script;

    calling it from a client script for a server-owned part will have no

    effect.

    '
  code_samples: []
  parameters:
  - name: impulse
    type: Vector3
    default: null
    summary: 'A linear impulse vector to be applied to the assembly.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
- name: BasePart:ApplyImpulseAtPosition
  summary: 'Apply an impulse to the assembly at specified position.

    '
  description: 'This function applies an instant force impulse to this part''s assembly,
    at

    the specified position in world space.


    If the position is not at the assembly''s

    `Class.BasePart.AssemblyCenterOfMass|center of mass`, the impulse will

    cause a positional and rotational movement.


    The resulting velocity from the impulse relies on the assembly''s

    `Class.BasePart.AssemblyMass|mass`. So a higher impulse is required to

    move more massive assemblies. Impulses are useful for cases where

    developers want a force applied instantly, such as an explosion or

    collision.


    If the part is [owned](../../../physics/network-ownership.md) by the

    server, this function must be called from a server `Class.Script` (not

    from a `Class.LocalScript` or a `Class.Script` with

    `Class.BaseScript.RunContext|RunContext` set to `Enum.RunContext.Client`).

    If the part is owned by a client through **automatic** ownership, this

    function can be called from either a client script **or** a server script;

    calling it from a client script for a server-owned part will have no

    effect.

    '
  code_samples: []
  parameters:
  - name: impulse
    type: Vector3
    default: null
    summary: 'An impulse vector to be applied to the assembly.

      '
  - name: position
    type: Vector3
    default: null
    summary: 'The position, in world space, to apply the impulse.

      '
  returns:
  - type: ()
    summary: ''
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities: []
  simulationAccess: true
- name: BasePart:BindToCollisionSummaries
  summary: 'Subscribes to detailed per-frame contact data for the collisions this
    part

    is involved in.

    '
  description: "Subscribes `callback` to the contact data that the physics engine\n\
    generates for this part while detecting collisions. Once per frame, after\nthe\
    \ simulation has stepped, `callback` receives an array of summaries\ndescribing\
    \ every contact patch this part was involved in during that\nframe. Each summary\
    \ reports where the contact occurred, which direction it\nfaced, and how fast\
    \ the two parts were moving relative to each other at\nthat point.\n\nThis method\
    \ is a separate mechanism from `Class.BasePart.Touched`.\n\nThrows an error if\
    \ `callback` is `nil`, or if the part is not a descendant\nof `Class.Workspace`.\n\
    \n#### Summary Fields\n\nEach entry in the array passed to `callback` is a table\
    \ with the following\nkeys:\n\n<table size=\"small\">\n<thead>\n  <tr>\n    <th>Key</th>\n\
    \    <th>Type</th>\n    <th>Summary</th>\n  </tr>\n</thead>\n<tbody>\n  <tr>\n\
    \    <td><code>Time</code></td>\n    <td><code>number</code></td>\n    <td>Simulation\
    \ time, in seconds, of the physics substep that produced this summary.</td>\n\
    \  </tr>\n  <tr>\n    <td><code>Part0</code></td>\n    <td><code>Class.BasePart</code></td>\n\
    \    <td>The subscribed part.</td>\n  </tr>\n  <tr>\n    <td><code>Part1</code></td>\n\
    \    <td><code>Class.BasePart</code></td>\n    <td>The other part in the pair,\
    \ which may be <code>Class.Terrain</code>.</td>\n  </tr>\n  <tr>\n    <td><code>Point</code></td>\n\
    \    <td><code>Datatype.Vector3</code></td>\n    <td>Contact point in world space,\
    \ averaged across the points in the patch.</td>\n  </tr>\n  <tr>\n    <td><code>Normal</code></td>\n\
    \    <td><code>Datatype.Vector3</code></td>\n    <td>Unit contact normal for the\
    \ patch, oriented relative to the subscribed part.</td>\n  </tr>\n  <tr>\n   \
    \ <td><code>RelativeVelocity</code></td>\n    <td><code>Datatype.Vector3</code></td>\n\
    \    <td>Velocity of <code>Part1</code> relative to <code>Part0</code> at the\
    \ contact point.</td>\n  </tr>\n  <tr>\n    <td><code>Area</code></td>\n    <td><code>number</code></td>\n\
    \    <td>Estimated area of the contact patch, in square studs. <code>0</code>\
    \ for a patch of fewer than three points, such as an edge or corner contact.</td>\n\
    \  </tr>\n</tbody>\n</table>\n\n`Normal` is oriented relative to the subscribed\
    \ part rather than to\nwhichever part the engine happened to list first, so if\
    \ both parts of a\npair are subscribed, each subscription receives its own summary\
    \ with\nitself as `Part0` and the normal flipped to match.\n\n`RelativeVelocity`\
    \ is the velocity of `Part1` relative to `Part0`, so the\nmagnitude of its projection\
    \ onto `Normal` is the speed at which the two\nparts are approaching or separating\
    \ head-on, and the component tangential\nto `Normal` describes sliding and glancing\
    \ contact.\n\n#### Reporting Behavior\n\n- Contact recording is enabled only while\
    \ at least one subscription exists\n  anywhere in the `Class.Workspace`, and the\
    \ cost of it scales with the\n  number of subscribed parts rather than with the\
    \ total number of\n  collisions in the scene.\n- Contacts between multiple sleeping\
    \ parts do not produce summaries.\n- Contacts from Parts with `Class.BasePart.CanCollide`\
    \ set to `false` do\n  not produce summaries.\n- Physics may run several substeps\
    \ per frame, so a pair that stays in\n  contact across several of them produces\
    \ up to one summary per patch per\n  substep, all delivered in the same invocation\
    \ of `callback`. Use `Time`\n  to order them.\n- Non-convex collision geometry\
    \ produces one summary per pair of touching\n  convex hulls, and contact with\
    \ `Class.Terrain` is split further by\n  contact normal, so either can yield several\
    \ summaries for the same pair\n  within one substep.\n- Nothing is replicated.\
    \ Each client generates summaries for the\n  collisions it owns. See\n  [network\
    \ ownership](../../../physics/network-ownership.md).\n- Destroying the part disconnects\
    \ its subscriptions.\n"
  code_samples: []
  parameters:
  - name: callback
    type: Function
    default: null
    summary: 'Invoked with an array of summary tables, at most once per frame, if

      the part was involved in a collision.

      '
  returns:
  - type: RBXScriptConnection
    summary: 'A `Datatype.RBXScriptConnection` that ends the subscription when

      disconnected.

      '
  tags: []
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - Basic
