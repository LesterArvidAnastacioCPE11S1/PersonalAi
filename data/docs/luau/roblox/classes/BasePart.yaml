  simulationAccess: true
- name: BasePart:UnionAsync
  summary: 'Creates a new `Class.UnionOperation` from the part, plus the geometry

    occupied by the parts in the given array.

    '
  description: "Creates a new `Class.UnionOperation` from the part, plus the geometry\n\
    occupied by the parts in the given array. Only `Class.Part|Parts` are\nsupported,\
    \ not `Class.Terrain` or `Class.MeshPart|MeshParts`. Similar to\n`Class.Instance:Clone()|Clone()`,\
    \ the returned object has no set\n`Class.Instance.Parent|Parent`.\n\nThe following\
    \ properties from the calling part are applied to the\nresulting `Class.UnionOperation`:\n\
    \n- `Class.BasePart.Color|Color`, `Class.BasePart.Material|Material`,\n  `Class.BasePart.MaterialVariant|MaterialVariant`,\n\
    \  `Class.BasePart.Reflectance|Reflectance`,\n  `Class.BasePart.Transparency|Transparency`\n\
    - `Class.BasePart.CanCollide|CanCollide`\n- `Class.BasePart.Anchored|Anchored`,\
    \ `Class.BasePart.Density|Density`,\n  `Class.BasePart.Elasticity|Elasticity`,\n\
    \  `Class.BasePart.ElasticityWeight|ElasticityWeight`,\n  `Class.BasePart.Friction|Friction`,\n\
    \  `Class.BasePart.FrictionWeight|FrictionWeight`\n\n#### Migration\n\nIt is highly\
    \ recommended to use the newer\n`Class.GeometryService:UnionAsync()` instead of\
    \ this method. As well as\nhaving better performance and more features, the new\
    \ method differs as\nfollows:\n\n- The output is an array of instances rather\
    \ than a single instance.\n- The input parts do not need to be parented to the\
    \ scene, allowing for\n  background operations.\n- When the `SplitApart` option\
    \ is set to `true` (default), each distinct\n  body will be returned in its own\
    \ `Class.PartOperation`.\n- All the returned parts are in the coordinate space\
    \ of the main part, so\n  their `Class.PVInstance.Origin` positions are the same\
    \ as the main\n  part's. This keeps the vertices of the mesh in the same position\n\
    \  relative to the object as before the operation, but it does also mean\n  the\
    \ `(0, 0, 0)` of a returned part is not necessarily at the center of\n  its body.\n\
    \n#### Notes\n\n- The original parts remain intact following a successful union\
    \ operation.\n  In most cases, you should `Class.Instance.Destroy|Destroy()` all\
    \ of the\n  original parts and parent the returned `Class.UnionOperation` to the\n\
    \  same place as the calling `Class.BasePart`.\n- By default, the resulting union\
    \ respects the\n  `Class.BasePart.Color|Color` property of each of its parts.\
    \ To change\n  the entire union to a specific color, set its\n  `Class.PartOperation.UsePartColor|UsePartColor`\
    \ property to `true`.\n- If a union operation would result in a part with more\
    \ than 20,000\n  triangles, it will be simplified to 20,000 triangles.\n"
