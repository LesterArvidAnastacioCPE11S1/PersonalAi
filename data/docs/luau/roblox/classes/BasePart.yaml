- name: BasePart:IntersectAsync
  summary: 'Creates a new `Class.IntersectOperation` from the overlapping geometry
    of

    the part and the other parts in the given array.

    '
  description: "Creates a new `Class.IntersectOperation` from the intersecting geometry\
    \ of\nthe part and the other parts in the given array. Only `Class.Part|Parts`\n\
    are supported, not `Class.Terrain` or `Class.MeshPart|MeshParts`. Similar\nto\
    \ `Class.Instance:Clone()|Clone()`, the returned object has no set\n`Class.Instance.Parent|Parent`.\n\
    \nThe following properties from the calling part are applied to the\nresulting\
    \ `Class.IntersectOperation`:\n\n- `Class.BasePart.Color|Color`, `Class.BasePart.Material|Material`,\n\
    \  `Class.BasePart.MaterialVariant|MaterialVariant`,\n  `Class.BasePart.Reflectance|Reflectance`,\n\
    \  `Class.BasePart.Transparency|Transparency`\n- `Class.BasePart.CanCollide|CanCollide`\n\
    - `Class.BasePart.Anchored|Anchored`, `Class.BasePart.Density|Density`,\n  `Class.BasePart.Elasticity|Elasticity`,\n\
    \  `Class.BasePart.ElasticityWeight|ElasticityWeight`,\n  `Class.BasePart.Friction|Friction`,\n\
    \  `Class.BasePart.FrictionWeight|FrictionWeight`\n\n#### Migration\n\nIt is highly\
    \ recommended to use the newer\n`Class.GeometryService:IntersectAsync()` instead\
    \ of this method. As well\nas having better performance and more features, the\
    \ new method differs as\nfollows:\n\n- The output is an array of instances rather\
    \ than a single instance.\n- The input parts do not need to be parented to the\
    \ scene, allowing for\n  background operations.\n- When the `SplitApart` option\
    \ is set to `true` (default), each distinct\n  body will be returned in its own\
    \ `Class.PartOperation`.\n- All the returned parts are in the coordinate space\
    \ of the main part, so\n  their `Class.PVInstance.Origin` positions are the same\
    \ as the main\n  part's. This keeps the vertices of the mesh in the same position\n\
    \  relative to the object as before the operation, but it does also mean\n  the\
    \ `(0, 0, 0)` of a returned part is not necessarily at the center of\n  its body.\n\
    \n#### Notes\n\n- The original parts remain intact following a successful intersect\n\
    \  operation. In most cases, you should `Class.Instance.Destroy|Destroy()`\n \
    \ all of the original parts and parent the returned\n  `Class.IntersectOperation`\
    \ to the same place as the calling\n  `Class.BasePart`.\n- By default, the face\
    \ colors of the resulting intersection are borrowed\n  from the `Class.BasePart.Color|Color`\
    \ property of the original parts. To\n  change the entire intersection to a specific\
    \ color, set its\n  `Class.PartOperation.UsePartColor|UsePartColor` property to\
    \ `true`.\n- If an intersect operation would result in a part with more than 20,000\n\
    \  triangles, it will be simplified to 20,000 triangles.\n"
  code_samples: []
  parameters:
  - name: parts
    type: Instances
    default: null
    summary: 'The objects taking part in the intersection.

      '
  - name: collisionfidelity
    type: CollisionFidelity
    default: Default
    summary: 'The `Enum.CollisionFidelity` value for the resulting

      `Class.IntersectOperation`.

      '
  - name: renderFidelity
    type: RenderFidelity
    default: Automatic
    summary: 'The `Enum.RenderFidelity` value of the resulting

      `Class.PartOperation`.

      '
  returns:
  - type: Instance
    summary: 'Resulting `Class.IntersectOperation` with default name **Intersect**.

      '
  tags:
  - Yields
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
  - CSG
