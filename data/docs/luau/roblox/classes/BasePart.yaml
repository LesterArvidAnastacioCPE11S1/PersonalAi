  - name: renderFidelity
    type: RenderFidelity
    default: Automatic
    summary: 'The `Enum.RenderFidelity` value of the resulting

      `Class.PartOperation`.

      '
  returns:
  - type: Instance
    summary: 'Resulting `Class.UnionOperation` with default name **Union**.

