- name: BasePart:MakeJoints
  summary: 'Creates a joint on any side of the object that has a surface ID that can

    make a joint.

    '
  description: "Creates a joint on any side of the `Class.BasePart|Part` that has\
    \ a\n`Enum.SurfaceType` that can make a joint it will create a joint with any\n\
    adjacent parts.\n\nJoints will be created between the sides and any planar touching\
    \ surfaces,\ndepending on the sides' surfaces.\n\n- Smooth surfaces will not create\
    \ joints\n- Glue surfaces will create a `Class.Glue` joint\n- Weld will create\
    \ a `Class.Weld` joint with any surface except for\n  Unjoinable\n- Studs, Inlet,\
    \ or Universal will each create a `Class.Snap` joint with\n  either of other the\
    \ other two surfaces (e.g. Studs with Inlet and\n  Universal)\n- Hinge and Motor\
    \ surfaces create `Class.Rotate` and `Class.RotateV` joint\n  instances\n\nUnlike\
    \ `Class.Model:MakeJoints()`, this function requires an array of\nparts as a parameter.\
    \ This array is given as follows:\n\n```\npart:MakeJoints({part1, part2, part3})\n\
    ```\n\nJoints are broken if enough force is applied to them due to an\n`Class.Explosion`,\
    \ unless a `Class.ForceField` object is parented to the\n`Class.BasePart` or ancestor\
    \ `Class.Model`. For this reason, they are\noften used to make simple destructible\
    \ buildings and other models.\n"
