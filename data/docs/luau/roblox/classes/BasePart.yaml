- name: BasePart:SubtractAsync
  summary: 'Creates a new `Class.UnionOperation` from the part, minus the geometry

    occupied by the parts in the given array.

    '
  description: "Creates a new `Class.UnionOperation` from the part, minus the geometry\n\
    occupied by the parts in the given array. Only `Class.Part|Parts` are\nsupported,\
    \ not `Class.Terrain` or `Class.MeshPart|MeshParts`. Similar to\n`Class.Instance:Clone()|Clone()`,\
    \ the returned object has no set\n`Class.Instance.Parent|Parent`.\n\nNote that\
    \ the resulting union cannot be empty due to subtractions. If the\noperation would\
    \ result in completely empty geometry, it will fail.\n\n#### Migration\n\nIt is\
    \ highly recommended to use the newer\n`Class.GeometryService:SubtractAsync()`\
    \ instead of this method. As well as\nhaving better performance and more features,\
    \ the new method differs as\nfollows:\n\n- The output is an array of instances\
    \ rather than a single instance.\n- The input parts do not need to be parented\
    \ to the scene, allowing for\n  background operations.\n- When the `SplitApart`\
    \ option is set to `true` (default), each distinct\n  body will be returned in\
    \ its own `Class.PartOperation`.\n- All the returned parts are in the coordinate\
    \ space of the main part, so\n  their `Class.PVInstance.Origin` positions are\
    \ the same as the main\n  part's. This keeps the vertices of the mesh in the same\
    \ position\n  relative to the object as before the operation, but it does also\
    \ mean\n  the `(0, 0, 0)` of a returned part is not necessarily at the center\
    \ of\n  its body.\n"
