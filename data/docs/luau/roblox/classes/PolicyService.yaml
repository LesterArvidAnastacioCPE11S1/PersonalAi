methods:
- name: PolicyService:CanViewBrandProjectAsync
  summary: 'Determines if a user can see brand project assets inside your experience.

    '
  description: 'Determines if a user can see brand project assets inside your experience.

    This method lets you work with brands to only show commercial assets to

    brand-compliant audiences.


    To use `CanViewBrandProjectAsync`, you must use a brand project ID

    provided by Roblox. To request a brand project ID,

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfGTRQwATB2wUg0P4HUSTtyXrhptFahJifo1ew84SyqtfSBfg/viewform">contact

    us</a>.


    You must call this method on a server-side Script and wrap it in a

    `Global.LuaGlobals.pcall()`.

    '
  code_samples:
  - PolicyService-BrandProjectIntegrationServer
  - PolicyService-BrandProjectIntegrationClient
  parameters:
  - name: player
    type: Player
    default: null
    summary: 'The `Player` object you''re trying to show the brand project to.

      '
  - name: brandProjectId
    type: string
    default: null
    summary: 'The brand project ID provided by Roblox. Represents all assets

      associated with a brand project.

      '
  returns:
  - type: boolean
    summary: 'Whether or not the brand project can be shown to the specific user.

      '
