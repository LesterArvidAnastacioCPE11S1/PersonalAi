- name: EditableMesh:BatchSetValues
  summary: 'Writes attribute values to a batch of mesh element IDs.

    '
  description: 'Writes attribute values to the given IDs. `values[i]` is written to

    `ids[i]`; the `ids` and `values` arrays must be the same length, unless

    `values` is `nil` to reset normals.


    For color IDs, pass an array of `Datatype.Color3` to set the colors, or an

    array of numbers to set the alphas. Mixing types in one call is an error.


    ```lua

    mesh:BatchSetValues(vertexIds, positions) -- Positions: {Vector3}

    mesh:BatchSetValues(normalIds, normals)   -- Normals: {Vector3}

    mesh:BatchSetValues(uvIds, uvs)           -- UVs: {Vector2}

    mesh:BatchSetValues(colorIds, colors)     -- Colors: {Color3}

    mesh:BatchSetValues(colorIds, alphas)     -- Alphas: {number}

    mesh:BatchSetValues(normalIds, nil)       -- Resets each normal to auto-computed

    ```

    '
  code_samples: []
  parameters:
  - name: ids
    type: Array
    default: null
    summary: 'IDs of the elements to write. All must be the same attribute type —

      vertex, normal, color, or UV. The attribute is determined by the ID

      type, so no `Enum.MeshAttribute` argument is needed. Mixing types, or

      passing face or bone IDs, throws an error.

      '
  - name: values
    type: Array
    default: null
    summary: 'Values to assign. Type depends on the ID type: `Datatype.Vector3` for

      vertex or normal IDs, `Datatype.Vector2` for UV IDs, `Datatype.Color3`

      or a number for color IDs. Pass `nil` for normal IDs to reset each

      normal to auto-computed values, equivalent to calling

