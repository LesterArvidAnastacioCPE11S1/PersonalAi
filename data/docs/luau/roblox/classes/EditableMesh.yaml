- name: EditableMesh:BatchAdd
  summary: 'Creates new mesh elements of the given attribute type and returns their

    IDs.

    '
  description: "Creates new mesh elements of the given attribute type and returns\
    \ their\nIDs in the same order as the input data. This method always requires\
    \ an\nexplicit `Enum.MeshAttribute` because its input is raw values with no\n\
    existing IDs to inspect. Throws an error if the attribute type is invalid,\nthe\
    \ data format does not match, or adding the elements would exceed mesh\nlimits.\n\
    \n```lua\nlocal vIds = mesh:BatchAdd(Enum.MeshAttribute.Vertex, positions)   \
    \  -- Positions: {Vector3}\nlocal nIds = mesh:BatchAdd(Enum.MeshAttribute.Normal,\
    \ normals)       -- Normals: {Vector3}\nlocal uIds = mesh:BatchAdd(Enum.MeshAttribute.UV,\
    \ uvs)               -- UVs: {Vector2}\nlocal cIds = mesh:BatchAdd(Enum.MeshAttribute.Color,\
    \ colors, alphas) -- Colors: {Color3}, Alphas: {number}\nlocal fIds = mesh:BatchAdd(Enum.MeshAttribute.Face,\
    \ {\n    {vIds[1], vIds[2], vIds[3]},\n    {vIds[1], vIds[3], vIds[4]},\n})\n\
    ```\n"
  code_samples: []
  parameters:
  - name: attr
    type: MeshAttribute
    default: null
