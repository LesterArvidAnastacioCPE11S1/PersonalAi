methods:
- name: EditableMesh:AddBone
  summary: 'Adds a new bone and returns a bone ID.

    '
  description: 'Adds a new bone to the mesh and returns a bone ID that persists across

    topology changes. An error is thrown if the bone name is already in use,

    the parent ID is invalid, or the mesh already contains the maximum number

    of bones.

    '
  code_samples: []
  parameters:
  - name: boneProperties
    type: Dictionary
    default: null
    summary: "Options table containing bone parameters:\n\n- `Name` — A string that\
      \ specifies the bone name. Note that all bone\n  names in a mesh must be unique,\
      \ and the maximum length is 100\n  characters.\n- `ParentId` — Optional bone\
      \ ID of the new bone's parent.\n- `CFrame` — Initial `Datatype.CFrame` of the\
      \ bone in the bind pose of\n  the mesh, in the mesh's local space.\n- `Virtual`\
      \ — Boolean that specifies whether this bone is virtual.\n  Virtual bones can\
      \ only be bound to a `Class.FaceControls` instance.\n"
  returns:
  - type: int64
    summary: 'Bone ID of the new bone.

      '
