- name: EditableMesh:AddFace
  summary: 'Adds a new triangle or quad face to the mesh and returns a face ID.

    '
  description: "Adds a new face from the given vertex IDs and returns a stable face\
    \ ID. A\nface is either a **triangle** (3 vertex IDs) or a **quad** (4 vertex\
    \ IDs);\nany other count throws an error. For adding triangles specifically, this\n\
    method is equivalent to `Class.EditableMesh:AddTriangle()|AddTriangle()`.\n\n\
    For rendering and collision, each quad is internally split into 2\ntriangles,\
    \ so a quad counts as 2 triangles toward the mesh's triangle\nlimit.\n\n#### Automatic\
    \ attribute assignment\n\n`AddFace()` only takes vertex IDs as arguments. For\
    \ each vertex of the new\nface, it automatically assigns normal, UV, and color\
    \ attributes using the\nfollowing logic:\n\n- If the vertex **already belongs\
    \ to another face**, the new face corner\n  **reuses** the same normal, UV, and\
    \ color IDs from the existing face.\n  This produces smooth shading and continuous\
    \ UVs across adjacent faces by\n  default.\n- If the vertex **does not yet belong\
    \ to any face**, new normal, UV, and\n  color IDs are created with default values\
    \ (auto-computed normal, UV\n  coordinate of `(0, 0)`, and white color).\n\n<img\
    \ src=\"../../../assets/engine-api/classes/EditableMesh/Shared-Attributes.png\"\
    \ alt=\"Two adjacent faces sharing vertex attribute IDs at their common vertices\"\
    \ width=\"690\" />\n\n#### Overriding attributes after adding a face\n\nThe auto-assigned\
    \ attributes can be customized after adding a face. The\napproach depends on whether\
    \ you want to change attribute **values** while\nkeeping the topology intact,\
    \ or create entirely new attribute IDs to add\nor remove **seams** between faces.\n\
    \n**To change values in-place**, retrieve the auto-created IDs with methods\n\
    like `Class.EditableMesh:GetVertexFaceUV()|GetVertexFaceUV()` and set\ntheir values\
    \ directly. This is more performant and avoids leaving unused\nIDs in the mesh:\n\
    \n```lua\n-- Create a triangle\nlocal faceId = editableMesh:AddFace(v0, v1, v2)\n\
    \n-- Get the UV IDs that were automatically created\nlocal uvId0 = editableMesh:GetVertexFaceUV(v0,\
    \ faceId)\nlocal uvId1 = editableMesh:GetVertexFaceUV(v1, faceId)\nlocal uvId2\
    \ = editableMesh:GetVertexFaceUV(v2, faceId)\n\n-- Set UV values on those existing\
    \ UV IDs\neditableMesh:SetUV(uvId0, Vector2.new(0, 0))\neditableMesh:SetUV(uvId1,\
    \ Vector2.new(1, 0))\neditableMesh:SetUV(uvId2, Vector2.new(0, 1))\n```\n\n**To\
    \ create a seam** — where the same vertex needs different attribute\nvalues on\
    \ different faces (for example, a UV seam or a sharp edge) —\ncreate new attribute\
    \ IDs with `Class.EditableMesh:AddUV()|AddUV()`,\n`Class.EditableMesh:AddNormal()|AddNormal()`,\
    \ or\n`Class.EditableMesh:AddColor()|AddColor()`, then assign them to the face\n\
    with `Class.EditableMesh:SetFaceUVs()|SetFaceUVs()`,\n`Class.EditableMesh:SetFaceNormals()|SetFaceNormals()`,\
    \ or\n`Class.EditableMesh:SetFaceColors()|SetFaceColors()`:\n\n```lua\n-- Create\
    \ a triangle\nlocal faceId = editableMesh:AddFace(v0, v1, v2)\n\n-- Create new\
    \ UV IDs with custom coordinates\nlocal uv0 = editableMesh:AddUV(Vector2.new(0,\
    \ 0))\nlocal uv1 = editableMesh:AddUV(Vector2.new(1, 0))\nlocal uv2 = editableMesh:AddUV(Vector2.new(0,\
    \ 1))\n\n-- Replace the face's UV IDs (creates a seam if the vertex had different\
    \ UVs on another face)\neditableMesh:SetFaceUVs(faceId, {uv0, uv1, uv2})\n```\n\
    \n#### Normal sharing and smooth vs. sharp edges\n\nBecause new faces reuse normal\
    \ IDs from adjacent faces by default, meshes\nappear smooth. To create a **sharp\
    \ edge** (crease) between faces, create a\nseparate normal ID for each face and\
    \ assign it with\n`Class.EditableMesh:SetFaceNormals()|SetFaceNormals()`:\n\n\
    <img src=\"../../../assets/engine-api/classes/EditableMesh/Faceted-Normals.png\"\
    \ alt=\"Two adjacent faces with separate normal IDs producing flat shading\" width=\"\
    690\" />\n\n```lua\n-- Two triangles sharing vertices v0 and v1, but with a sharp\
    \ edge between them\nlocal fid1 = editableMesh:AddFace(v0, v1, v2)\nlocal fid2\
    \ = editableMesh:AddFace(v0, v3, v1)\n\n-- Create separate normals for each face\
    \ to produce a hard edge\nlocal n1 = editableMesh:AddNormal() -- Auto-computed\
    \ for fid1\nlocal n2 = editableMesh:AddNormal() -- Auto-computed for fid2\neditableMesh:SetFaceNormals(fid1,\
    \ {n1, n1, n1})\neditableMesh:SetFaceNormals(fid2, {n2, n2, n2})\n```\n\nSee also\
    \ `Class.EditableMesh:SetNormal()|SetNormal()` to manually specify\na normal vector,\
    \ and `Class.EditableMesh:ResetNormal()|ResetNormal()` to\nrevert a normal back\
    \ to automatic computation.\n"
  code_samples: []
  parameters:
  - name: vertexIds
    type: Tuple
    default: null
    summary: 'The new face''s vertex IDs passed as separate arguments in order around

      the face. Provide 3 IDs to create a triangle or 4 IDs to create a

      quad.

      '
  returns:
  - type: int64
    summary: 'Face ID of the new face.

      '
  tags:
  - CustomLuaState
  deprecation_message: ''
  security: None
  thread_safety: Unsafe
  capabilities:
