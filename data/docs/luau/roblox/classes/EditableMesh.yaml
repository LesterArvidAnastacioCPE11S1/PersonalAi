name: EditableMesh
type: class
memory_category: Instances
summary: 'Object which allows for the runtime creation and manipulation of meshes.

  '
description: "`EditableMesh` changes the applied visual mesh when linked to a\n`Class.MeshPart`,\
  \ allowing for querying and modification of the mesh both in\nStudio and in-game.\n\
  \n#### Enabling for published games\n\nFor security purposes, using `EditableMesh`\
  \ fails by default in published\ngames. To enable it, open the\n[Creator Dashboard](https://create.roblox.com/dashboard/creations),\
  \ go to the\ngame's **Configure**&nbsp;⟩ **Settings**, and toggle on **Enable Mesh\
  \ / Image\nAPIs**. Alternatively, in Studio, open **Experience Settings** and toggle\
  \ on\n**Allow Mesh / Image APIs** under **Security**. Remember to review the\n[Terms\
  \ of Use](https://en.help.roblox.com/hc/en-us/articles/115004647846-Roblox-Terms-of-Use#creators-restrictions-on-use)\n\
  before enabling the toggle.\n\n#### Permissions\n\nTo prevent misuse, `Class.AssetService:CreateEditableMeshAsync()`\
  \ only allows\nyou to load and edit mesh assets if any of the following is true:\n\
  \n- Owned by or explicitly shared with the game owner.\n- Owned by or explicitly\
  \ shared with the logged in Studio user.\n- Owned by or explicitly shared with the\
  \ logged in player if the\n  `EditableMesh` is on the client side.\n- Owned by a\
  \ group where the game owner, Studio user, or player has a role\n  with permission\
  \ to edit the group's assets. See\n  [Roles and permissions](../../../projects/groups.md#roles-and-permissions)\n\
  \  for more information.\n\nSee [Grant permissions](../../../projects/assets/privacy.md#grant-permissions)\n\
  to learn how to share assets with users or groups.\n\nThe APIs throw an error if\
  \ they are used to load an asset that does not meet\nthe criteria above.\n\n####\
  \ Memory limits\n\nEditable assets are currently expensive for memory usage. To\
  \ minimize its\nimpact on client performance, `EditableMesh` has strict client-side\
  \ memory\nbudgets, although the server, Studio, and plugins operate with unlimited\n\
  memory. Using `Class.EditableMesh.FixedSize|FixedSize` may help you stay\nwithin\
  \ the memory budget and, in some scenarios, linking one `EditableMesh` to\nmultiple\
  \ `Class.MeshPart|MeshParts` (multi-referencing) can help with memory\noptimization.\n\
  \nIf an `EditableMesh` no longer changes, you can save a significant amount of\n\
  memory budget by converting it to `Enum.ContentSourceType|Opaque` content with\n\
  `Class.AssetService:CreateDataModelContentAsync()`. Use the returned\n`Datatype.Content`\
  \ in place of the `EditableMesh`, then call\n`Class.EditableMesh:Destroy()|Destroy()`\
  \ to release the editable copy. To edit\nthe mesh again, pass the opaque content\
  \ to\n`Class.AssetService:CreateEditableMeshAsync()`.\n\n#### Creation and display\n\
  \nAn `EditableMesh` can be created from an existing `Datatype.Content` of a\n`Class.MeshPart`\
  \ or a mesh ID using\n`Class.AssetService:CreateEditableMeshAsync()`, or a blank\
  \ `EditableMesh` can\nbe created with `Class.AssetService:CreateEditableMesh()`.\
  \ It can then be\ndisplayed, modified, and its collision model updated. Not all\
  \ of the steps are\nnecessary; for example, you might want to create an `EditableMesh`\
  \ just to\nraycast without ever displaying it.\n\n```lua\nlocal AssetService = game:GetService(\"\
  AssetService\")\n\n-- Create empty EditableMesh\nlocal editableMesh = AssetService:CreateEditableMesh()\n\
  \n-- Create EditableMesh from asset ID\nlocal editableMeshFromAsset = nil\nlocal\
  \ success, errorMessage = pcall(function()\n\teditableMeshFromAsset = AssetService:CreateEditableMeshAsync(Content.fromAssetId(ASSET_ID))\n\
  end)\n\n-- Create EditableMesh from another EditableMesh\nlocal editableMeshFromAnother\
  \ = nil\nlocal success, errorMessage = pcall(function()\n\teditableMeshFromAnother\
  \ = AssetService:CreateEditableMeshAsync(Content.fromObject(OTHER_EDITABLE_MESH))\n\
  end)\n\n-- Create EditableMesh from MeshPart\nlocal editableMeshFromMeshPart = nil\n\
  local success, errorMessage = pcall(function()\n\teditableMeshFromMeshPart = AssetService:CreateEditableMeshAsync(MESH_PART.MeshContent)\n\
  end)\n```\n\nAn `EditableMesh` is displayed when it's linked to a new `Class.MeshPart`,\n\
  through `Class.AssetService:CreateMeshPartAsync()`. You can create more\n`Class.MeshPart`\
  \ instances that reference the same `EditableMesh`\n`Datatype.Content`, or link\
  \ to an existing `Class.MeshPart` through\n`Class.MeshPart:ApplyMesh()`.\n\n```lua\n\
  local AssetService = game:GetService(\"AssetService\")\nlocal Workspace = game:GetService(\"\
  Workspace\")\n\n-- Create EditableMesh from asset ID\nlocal editableMeshFromAsset\
  \ = nil\nlocal success, errorMessage = pcall(function()\n\teditableMeshFromAsset\
  \ = AssetService:CreateEditableMeshAsync(Content.fromAssetId(ASSET_ID))\nend)\n\n\
  -- Create new MeshPart linked to the EditableMesh\nlocal newMeshPart = nil\nlocal\
  \ success, errorMessage = pcall(function()\n\tnewMeshPart = AssetService:CreateMeshPartAsync(Content.fromObject(editableMeshFromAsset))\n\
  end)\n\n-- Alternatively, link the new MeshPart created above to an existing MeshPart\n\
  local existingMeshPart = Workspace:FindFirstChild(\"EXISTING_MESH_PART\")\nexistingMeshPart:ApplyMesh(newMeshPart)\n\
  ```\n\nTo recalculate collision and fluid geometry after editing, you can again\
  \ call\n`Class.AssetService:CreateMeshPartAsync()` and `Class.MeshPart:ApplyMesh()`\
  \ to\nupdate an existing `Class.MeshPart`. It's generally recommended to do this\
  \ at\nthe end of a conceptual edit, not after individual calls to methods that\n\
  manipulate geometry. Visual changes to the mesh will always be immediately\nreflected\
  \ by the engine, without the need to call\n`Class.AssetService:CreateMeshPartAsync()`.\n\
  \n#### Fixed-size meshes\n\nWhen creating an `EditableMesh` from an existing mesh\
  \ asset (via\n`Class.AssetService:CreateEditableMeshAsync()`), the resulting editable\
  \ mesh\nis fixed-size by default. Fixed-size meshes are more efficient in terms\
  \ of\nmemory but you cannot change the number of vertices, faces, or attributes.\n\
  Only the values of vertex attributes and positions can be edited.\n\n```lua\nlocal\
  \ AssetService = game:GetService(\"AssetService\")\n\n-- Create EditableMesh without\
  \ fixed-size default\nlocal editableMeshFromAsset = nil\nlocal success, errorMessage\
  \ = pcall(function()\n\teditableMeshFromAsset = AssetService:CreateEditableMeshAsync(Content.fromAssetId(ASSET_ID),\
  \ {FixedSize = false})\nend)\n```\n\n#### Stable IDs\n\nMany `EditableMesh` methods\
  \ take **vertex**, **normal**, **UV**, **color** and\n**face** IDs. These are represented\
  \ as integers in Luau but they require some\nspecial handling. The main difference\
  \ is that IDs are stable and they remain\nthe same even if other parts of the mesh\
  \ change. For example, if an\n`EditableMesh` has five vertices `{1, 2, 3, 4, 5}`\
  \ and you remove vertex `4`,\nthe new vertices will be `{1, 2, 3, 5}`.\n\nNote that\
  \ the IDs are not guaranteed to be in order and there may be holes in\nthe numbering,\
  \ so when iterating through vertices or faces, you should iterate\nthrough the table\
  \ returned by `Class.EditableMesh:GetVertices()|GetVertices()`\nor `Class.EditableMesh:GetFaces()|GetFaces()`.\n\
  \nFor debugging purposes, it can be very helpful to get a more readable string\n\
  for a stable ID with `Class.EditableMesh:IdDebugString()|IdDebugString()`.\n\n####\
  \ Split vertex attributes\n\nA **vertex** is a corner of a face, and topologically\
  \ connects faces together.\nEach vertex has a single **position**, while its **normal**,\
  \ **UV\ncoordinate**, and **color** (with transparency) are stored per face corner.\
  \ A\nvertex shared by multiple faces can use the same values on every face, or\n\
  different values on each.\n\nSometimes it's useful for all faces that touch a vertex\
  \ to use the same\nattribute values, but sometimes you'll want different faces to\
  \ use different\nattribute values on the same vertex. For example, on a smooth sphere,\
  \ each\nvertex will only have a single normal. In contrast, at the corner of a cube,\n\
  the vertex will have 3 different normals (one for each adjacent face). You can\n\
  also have seams in the UV coordinates or sharp changes in the vertex colors.\n\n\
  When creating faces with `Class.EditableMesh:AddFace()|AddFace()` or\n`Class.EditableMesh:AddTriangle()|AddTriangle()`,\
  \ each corner of the new face\nis automatically assigned a normal, UV, and color\
  \ attribute. If a vertex\nalready belongs to an existing face, the new face **reuses**\
  \ that vertex's\nexisting attributes (producing smooth shading and continuous UVs).\
  \ If the\nvertex is new, fresh attribute IDs are created with default values\n(auto-computed\
  \ normal, UV of `(0, 0)`, white color). To create a seam, you\nshould create new\
  \ attributes and set them on the face. For example, this code\nwill create a sharp\
  \ cube:\n\n```lua\nlocal AssetService = game:GetService(\"AssetService\")\n\n--\
  \ Given 4 vertex IDs, adds a new normal and a quad face, making a sharp quad\nlocal\
  \ function addSharpQuad(editableMesh, vid0, vid1, vid2, vid3)\n\tlocal nid = editableMesh:AddNormal()\
  \ -- This creates a normal ID which is automatically computed\n\n\tlocal fid = editableMesh:AddFace(vid0,\
  \ vid1, vid2, vid3)\n\teditableMesh:SetFaceNormals(fid, {nid, nid, nid, nid})\n\
  end\n\n-- Makes a cube with creased edges between the 6 sides\nlocal function makeSharpCube()\n\
  \tlocal editableMesh = AssetService:CreateEditableMesh()\n\n\tlocal v1 = editableMesh:AddVertex(Vector3.new(0,\
  \ 0, 0))\n\tlocal v2 = editableMesh:AddVertex(Vector3.new(1, 0, 0))\n\tlocal v3\
  \ = editableMesh:AddVertex(Vector3.new(0, 1, 0))\n\tlocal v4 = editableMesh:AddVertex(Vector3.new(1,\
  \ 1, 0))\n\tlocal v5 = editableMesh:AddVertex(Vector3.new(0, 0, 1))\n\tlocal v6\
  \ = editableMesh:AddVertex(Vector3.new(1, 0, 1))\n\tlocal v7 = editableMesh:AddVertex(Vector3.new(0,\
  \ 1, 1))\n\tlocal v8 = editableMesh:AddVertex(Vector3.new(1, 1, 1))\n\n\taddSharpQuad(editableMesh,\
  \ v5, v6, v8, v7) -- Front\n\taddSharpQuad(editableMesh, v1, v3, v4, v2) -- Back\n\
  \taddSharpQuad(editableMesh, v1, v5, v7, v3) -- Left\n\taddSharpQuad(editableMesh,\
  \ v2, v4, v8, v6) -- Right\n\taddSharpQuad(editableMesh, v1, v2, v6, v5) -- Bottom\n\
  \taddSharpQuad(editableMesh, v3, v7, v8, v4) -- Top\n\n\teditableMesh:RemoveUnused()\n\
  \treturn editableMesh\nend\n```\n\n#### Winding\n\nMesh faces have a front side\
  \ and a back side. When drawing meshes, only the\nfront of the faces are drawn by\
  \ default, although you can change this by\nsetting the mesh' `Class.MeshPart.DoubleSided|DoubleSided`\
  \ property to `true`.\n\nThe order of the vertices around the face determines whether\
  \ you are looking\nat the front or the back. The front of the face is visible when\
  \ the vertices\ngo counterclockwise around it.\n\n<img src=\"../../../assets/engine-api/classes/EditableMesh/Winding.png\"\
  \ alt=\"Order of the vertices around the face\" width=\"550\" />\n\n#### FACS poses\n\
  \nAnimatable heads use the Facial Action Coding System (FACS). See the\n[FACS poses\
  \ reference](../../../avatar/dynamic-heads/facs-poses-reference.md)\nfor helpful\
  \ information when using\n`Class.EditableMesh:GetFacsPoses()|GetFacsPoses()` and\
  \ similar methods.\n\nEach FACS pose is specified by an `Enum.FacsActionUnit` value.\
  \ For the FACS\npose, virtual bones can each have a `Datatype.CFrame` that transforms\
  \ the\nbones' initial `Datatype.CFrame` in the bind pose of the mesh into the\n\
  `Datatype.CFrame` for that FACS action unit's pose. All bone\n`Datatype.CFrame|CFrames`\
  \ are in the mesh's local space.\n\nThese FACS poses are blended together during\
  \ animation. Sometimes, the\nblending of the base poses produces poor results. In\
  \ those cases, you can\noverride the blending of specific combinations of base poses\
  \ with a\n[corrective pose](../../../art/characters/facial-animation/create-basic-heads.md#combination-poses)\n\
  that is more pleasing. A corrective pose is specified by 2 or 3\n`Enum.FacsActionUnit`\
  \ values. Like a base FACS pose, for a corrective pose,\nvirtual bones can each\
  \ have a `Datatype.CFrame` that transforms the bones'\ninitial `Datatype.CFrame`\
  \ in the bind pose of the mesh into the\n`Datatype.CFrame` for that FACS corrective.\n\
  \nPlease note that corrective poses that operate on both left and right action\n\
  units are not currently expressible. For example, using `LeftCheekPuff` and\n`RightEyeClosed`\
  \ together in a corrective pose is not currently possible.\n\n#### Batching\n\n\
  The **batch** methods let you create, read, update, and remove many mesh\nelements\
  \ in a single call instead of invoking the singular methods\n(`Class.EditableMesh:AddVertex()|AddVertex()`,\n\
  `Class.EditableMesh:SetPosition()|SetPosition()`,\n`Class.EditableMesh:GetColor()|GetColor()`,\
  \ and so on) once per element.\nBatching your mesh operations is typically much\
  \ more performant than handling\nthem one by one.\n\nRather than one method per\
  \ attribute, each batch method shares a small set of\ngeneral entry points and uses\
  \ an `Enum.MeshAttribute` value (or the type\nalready encoded in each mesh ID) to\
  \ determine which attribute you mean. For\nexample, `Class.EditableMesh:BatchSetValues()|BatchSetValues()`\
  \ sets positions\nwhen called with vertex IDs, but sets normals when called with\
  \ normal IDs. You\ncannot mix-and-match ID types within a single call.\n\nBatch\
  \ setters take parallel arrays: element `i` of every argument array\ndescribes the\
  \ same logical operation. In\n`Class.EditableMesh:BatchSetValues()|BatchSetValues(ids,\
  \ values)`, `values[i]`\nis written to `ids[i]`. All argument arrays must be the\
  \ same length or the\ncall errors. Batch getters take an array of IDs and return\
  \ results in the same\norder.\n\nIf a mesh ID is invalid, batching still applies\
  \ updates to all elements before\nthe invalid ID, then stops.\n\n#### Limitations\n\
  \n`EditableMesh` currently has a limit of 60,000 vertices and 20,000 triangles.\n\
  Faces can be triangles or quads, and each quad counts as 2 triangles toward\nthe\
  \ triangle limit. Attempting to add too many vertices or triangles will\ncause an\
  \ error.\n"
