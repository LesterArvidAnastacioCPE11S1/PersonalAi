name: TriangleMeshPart
type: class
memory_category: Instances
summary: 'Abstract intermediate class that manages physical geometry properties for

  PartOperations and MeshParts.

  '
description: 'TriangleMeshPart is an abstract intermediate class from which `Class.MeshPart`

  and `Class.PartOperation` inherit. It was created to consolidate the

  management of physical geometry properties between the two sub-classes. It

  implements the read-only

  `Class.TriangleMeshPart.CollisionFidelity|CollisionFidelity` and

  `Class.TriangleMeshPart.CollisionPrecision|CollisionPrecision`.

  '
code_samples: []
inherits:
- BasePart
descendants:
- MeshPart
- PartOperation
tags:
- NotCreatable
- NotBrowsable
deprecation_message: ''
properties:
- name: TriangleMeshPart.CollisionFidelity
  summary: 'Determines the level of detail the part''s physics will adhere to its
    mesh.

    '
  description: 'This property determines how the collision model of the

    `Class.TriangleMeshPart` relates to the actual geometry of the mesh. This

    property cannot be read or manipulated by scripts during runtime.


    See [here](../../../workspace/collisions.md#collision-fidelity) for a

    visual representation of the various options.

    '
  code_samples: []
  type: CollisionFidelity
  tags:
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Collision
  serialization:
    can_load: true
    can_save: false
  capabilities:
  - Basic
- name: TriangleMeshPart.CollisionPrecision
  summary: 'Quantifies how precise or performant a `Enum.CollisionFidelity.Tunable`

    collision geometry is, from `0` to `1`.

    '
  description: 'This property describes the precision-to-performance tradeoff of the

    part''s collision geometry when `Class.TriangleMeshPart.CollisionFidelity`

    is set to `Enum.CollisionFidelity.Tunable`. A value of `0` favors maximum

    performance with the simplest collision mesh, while a value of `1` favors

    maximum precision with a collision mesh that closely matches the visual

    mesh.

    '
  code_samples: []
  type: float
  tags:
