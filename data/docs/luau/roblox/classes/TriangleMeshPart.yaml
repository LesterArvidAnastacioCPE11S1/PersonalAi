    read: None
    write: PluginSecurity
  thread_safety: ReadSafe
  category: Collision
  serialization:
    can_load: true
    can_save: false
  capabilities:
  - Basic
- name: TriangleMeshPart.FluidFidelity
  summary: 'Determines the geometric representation used to compute aerodynamic forces

    and torques.

    '
  description: "Controls which geometric representation the physics engine uses when\
    \ it\ncomputes aerodynamic (fluid) forces and torques for the part. It defaults\n\
    to `Enum.FluidFidelity.Automatic`, in which the engine selects a\nrepresentation\
    \ on your behalf.\n\n- `Enum.FluidFidelity.Automatic` — the engine chooses the\
    \ representation;\n  it currently evaluates fluid forces against the part's collision\n\
    \  geometry.\n- `Enum.FluidFidelity.UseCollisionGeometry` — fluid forces are evaluated\n\
    \  against the part's collision geometry, matching the shape used for\n  collision\
    \ detection.\n- `Enum.FluidFidelity.UsePreciseGeometry` — fluid forces are evaluated\n\
    \  against the part's precise mesh geometry, producing more accurate forces\n\
    \  at a higher computational cost.\n\nBecause this property has plugin-level write\
    \ security, it is configured in\nStudio rather than assigned by runtime scripts.\n\
    \nThis setting only affects a part while fluid forces are active for the\nplace,\
    \ which is governed by `Class.Workspace.FluidForces` (an\n`Enum.FluidForces` value\
    \ that defaults to `Default`; setting it to\n`Experimental` enables the aerodynamic\
    \ force model). When fluid forces are\nnot applied to the part, the chosen fidelity\
    \ has no effect.\n"
  code_samples: []
  type: FluidFidelity
  tags:
  - NotReplicated
  deprecation_message: ''
  security:
    read: None
    write: None
  thread_safety: ReadSafe
  category: Behavior
  serialization:
    can_load: true
    can_save: false
  capabilities:
  - Basic
- name: TriangleMeshPart.MeshSize
  summary: 'The original size of the part''s source mesh geometry, before any scaling

    applied through `Class.BasePart.Size`.

    '
  description: 'This read-only property reports the size of the part''s mesh geometry
    when

    it was loaded, as width, height, and depth in studs. It is not affected by

    resizing the part through `Class.BasePart.Size`, so dividing

    `Class.BasePart.Size` by `MeshSize` gives the scale factor currently

    applied to the mesh''s visual and physical geometry.

    '
  code_samples: []
